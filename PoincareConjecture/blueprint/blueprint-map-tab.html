    const KATEX_MACROS = {&quot;\\mbox&quot;:&quot;\\text&quot;,&quot;\\hbox&quot;:&quot;\\text&quot;,&quot;\\uses&quot;:&quot;&quot;,&quot;\\dcref&quot;:&quot;&quot;,&quot;\\source&quot;:&quot;&quot;,&quot;\\notready&quot;:&quot;&quot;,&quot;\\home&quot;:&quot;&quot;,&quot;\\github&quot;:&quot;&quot;,&quot;\\dochome&quot;:&quot;&quot;};
    const byId = new Map(DATA.nodes.map((node) =&gt; [node.id, node]));
    const incoming = new Map(DATA.nodes.map((node) =&gt; [node.id, []]));
    const outgoing = new Map(DATA.nodes.map((node) =&gt; [node.id, []]));
    for (const edge of DATA.edges) {
      incoming.get(edge.to)?.push(edge.from);
      outgoing.get(edge.from)?.push(edge.to);
    }

    const canvas = document.getElementById(&quot;map-canvas&quot;);
    const scene = document.getElementById(&quot;map-scene&quot;);
    const viewport = document.getElementById(&quot;map-viewport&quot;);
    const edgeLayer = document.getElementById(&quot;edge-layer&quot;);
    const focusEdgeLayer = document.getElementById(&quot;focus-edge-layer&quot;);
    const stat = document.getElementById(&quot;map-stat&quot;);
    const search = document.getElementById(&quot;map-search&quot;);
    const status = document.getElementById(&quot;map-status&quot;);
    const chapterSelect = document.getElementById(&quot;map-chapter&quot;);
    const minimized = document.getElementById(&quot;map-minimized&quot;);
    const depthSelect = document.getElementById(&quot;map-depth&quot;);
    const detail = document.getElementById(&quot;detail-panel&quot;);
    let zoom = 1;
    let baseWidth = 0;
    let baseHeight = 0;
    let focusedId = null;
    let fitMode = true;
    let previewId = null;
    let previewAnchor = null;
    let katexLoader = null;

    const escapeHtml = (value) =&gt; String(value ?? &quot;&quot;).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, (char) =&gt; ({
      &quot;&amp;&quot;: &quot;&amp;amp;&quot;, &quot;&lt;&quot;: &quot;&amp;lt;&quot;, &quot;&gt;&quot;: &quot;&amp;gt;&quot;, &#x27;&quot;&#x27;: &quot;&amp;quot;&quot;, &quot;&#x27;&quot;: &quot;&amp;#39;&quot;
    }[char]));
    const statusLabel = (value) =&gt; ({ lean_ok: &quot;Lean OK&quot;, mathlib_ok: &quot;Mathlib OK&quot;, sorry: &quot;Sorry&quot;, empty: &quot;Open&quot; }[value] || value || &quot;Open&quot;);
    const chapterColor = (index) =&gt; [&quot;#3868ad&quot;, &quot;#7556a8&quot;, &quot;#35865a&quot;, &quot;#b87923&quot;, &quot;#2d8580&quot;][index % 5];
    // Curated milestones from blueprint/important-statements.yaml (embedded at build).
    const importantLabels = new Set(DATA.important_labels || []);
    const importantNode = (node) =&gt; importantLabels.size ? importantLabels.has(node?.label) : true;
    const displayedNodes = () =&gt; {
      if (!minimized.checked) return DATA.nodes;
      if (!importantLabels.size) return DATA.nodes;
      return DATA.nodes.filter(importantNode);
    };
    function displayedEdges() {
      if (!minimized.checked || !importantLabels.size) return DATA.edges;
      const ids = new Set(displayedNodes().map((node) =&gt; node.id));
      const next = new Map();
      for (const edge of DATA.edges) {
        if (!next.has(edge.from)) next.set(edge.from, []);
        next.get(edge.from).push(edge.to);
      }
      // Keep a direct edge between important nodes when one is reachable from
      // the other through any path (possibly via non-important intermediates).
      const result = [];
      for (const from of ids) {
        const queue = [...(next.get(from) || [])];
        const seen = new Set();
        while (queue.length) {
          const current = queue.shift();
          if (seen.has(current)) continue;
          seen.add(current);
          if (ids.has(current)) result.push({ from, to: current });
          else queue.push(...(next.get(current) || []));
        }
      }
      // Drop edges that factor through another important node (transitive reduction).
      return result.filter((edge) =&gt; !result.some((mid) =&gt;
        mid.from === edge.from &amp;&amp; mid.to !== edge.to &amp;&amp;
        result.some((tail) =&gt; tail.from === mid.to &amp;&amp; tail.to === edge.to)
      ));
    }
    // Hop distance from the focused node, split by dependency direction.
    // &quot;in&quot; = prerequisites (edges pointing toward the focus along uses),
    // &quot;out&quot; = dependents (edges pointing away from the focus).
    // Depth N keeps only nodes within N hops on either side.
    function dependencyNeighborhood(id, edges, maxDepth) {
      const levels = new Map([[id, 0]]);
      const dirs = new Map([[id, &quot;focus&quot;]]);
      const upstream = new Map();
      const downstream = new Map();
      for (const edge of edges) {
        if (!upstream.has(edge.to)) upstream.set(edge.to, []);
        if (!downstream.has(edge.from)) downstream.set(edge.from, []);
        upstream.get(edge.to).push(edge.from);
        downstream.get(edge.from).push(edge.to);
      }
      const visit = (adjacency, direction) =&gt; {
        const queue = [id];
        while (queue.length) {
          const current = queue.shift();
          const level = levels.get(current);
          if (level &gt;= maxDepth) continue;
          for (const next of adjacency.get(current) || []) {
            if (levels.has(next)) continue;
            levels.set(next, level + 1);
            dirs.set(next, direction);
            queue.push(next);
          }
        }
      };
      visit(upstream, &quot;in&quot;);
      visit(downstream, &quot;out&quot;);
      return { levels, dirs };
    }
    function layerOpacity(level, maxDepth) {
      const span = Number.isFinite(maxDepth) &amp;&amp; maxDepth &gt; 1 ? maxDepth : 4;
      if (span &lt;= 1 || level &lt;= 1) return 1;
      const t = Math.max(0, Math.min(1, (level - 1) / Math.max(1, span - 1)));
      return Math.max(0.28, 1 - t * 0.62);
    }
    function layerStrength(level, maxDepth) {
      const span = Number.isFinite(maxDepth) &amp;&amp; maxDepth &gt; 1 ? maxDepth : 4;
      if (span &lt;= 1 || level &lt;= 1) return 80;
      const t = Math.max(0, Math.min(1, (level - 1) / Math.max(1, span - 1)));
      return Math.round(85 - t * 45);
    }
    function focusEdgeStyle(edge, focusedId, levels, dirs) {
      const fromLevel = levels.get(edge.from);
      const toLevel = levels.get(edge.to);
      if (fromLevel == null || toLevel == null) return null;
      const edgeLevel = Math.max(fromLevel, toLevel);
      // Keep only edges that step between consecutive layers (or touch the focus).
      if (Math.abs(fromLevel - toLevel) !== 1 &amp;&amp; !(fromLevel === 0 || toLevel === 0)) return null;
      let relation;
      if (edge.to === focusedId || (dirs.get(edge.from) === &quot;in&quot; &amp;&amp; dirs.get(edge.to) !== &quot;out&quot;)) {
        relation = &quot;incoming&quot;;
      } else if (edge.from === focusedId || (dirs.get(edge.to) === &quot;out&quot; &amp;&amp; dirs.get(edge.from) !== &quot;in&quot;)) {
        relation = &quot;outgoing&quot;;
      } else if (fromLevel &lt; toLevel) {
        relation = &quot;outgoing&quot;;
      } else {
        relation = &quot;incoming&quot;;
      }
      const color = relation === &quot;incoming&quot; ? &quot;#6b46c1&quot; : &quot;#0f766e&quot;;
      return { relation, color, edgeLevel };
    }

    function render() {
      const visibleNodeIds = new Set(displayedNodes().map((node) =&gt; node.id));
      canvas.querySelectorAll(&quot;.chapter-column&quot;).forEach((node) =&gt; node.remove());
      for (const [index, chapter] of DATA.chapters.entries()) {
        const column = document.createElement(&quot;section&quot;);
        column.className = &quot;chapter-column&quot;;
        column.dataset.chapter = chapter.title;
        column.style.setProperty(&quot;--chapter-color&quot;, chapterColor(index));
        const count = chapter.sections.reduce((sum, section) =&gt; sum + section.nodes.filter((node) =&gt; visibleNodeIds.has(node.id)).length, 0);
        if (!count) continue;
        column.innerHTML = `&lt;header class=&quot;chapter-head&quot;&gt;&lt;div class=&quot;chapter-kicker&quot;&gt;Stage ${String(index + 1).padStart(2, &quot;0&quot;)}&lt;/div&gt;&lt;h2&gt;${escapeHtml(chapter.title)}&lt;/h2&gt;&lt;div class=&quot;chapter-count&quot;&gt;${count} statement${count === 1 ? &quot;&quot; : &quot;s&quot;}&lt;/div&gt;&lt;/header&gt;&lt;div class=&quot;chapter-body&quot;&gt;&lt;/div&gt;`;
        const body = column.querySelector(&quot;.chapter-body&quot;);
        for (const section of chapter.sections) {
          const group = document.createElement(&quot;section&quot;);
          group.className = &quot;section-group&quot;;
          group.dataset.section = section.title;
          const sectionNodes = section.nodes.filter((node) =&gt; visibleNodeIds.has(node.id));
          if (!sectionNodes.length) continue;
          group.innerHTML = `&lt;header class=&quot;section-head&quot;&gt;&lt;h3&gt;${escapeHtml(section.title)}&lt;/h3&gt;&lt;span&gt;${sectionNodes.length}&lt;/span&gt;&lt;/header&gt;&lt;div class=&quot;node-list&quot;&gt;&lt;/div&gt;`;
          const list = group.querySelector(&quot;.node-list&quot;);
          for (const node of sectionNodes) {
            const card = document.createElement(&quot;div&quot;);
            card.className = &quot;node-card&quot;;
            card.tabIndex = 0;
            card.setAttribute(&quot;role&quot;, &quot;button&quot;);
            card.setAttribute(&quot;aria-pressed&quot;, &quot;false&quot;);
            card.dataset.node = node.id;
            card.dataset.chapter = chapter.title;
            card.dataset.status = node.status;
            card.dataset.search = `${node.title} ${node.label} ${node.kind}`.toLowerCase();
            card.innerHTML = `&lt;span class=&quot;node-title&quot;&gt;${escapeHtml(node.display_title || node.title)}&lt;/span&gt;&lt;button class=&quot;node-preview-toggle&quot; type=&quot;button&quot; title=&quot;Show statement preview&quot; aria-label=&quot;Show statement preview&quot; aria-expanded=&quot;false&quot;&gt;›&lt;/button&gt;`;
            card.addEventListener(&quot;click&quot;, () =&gt; selectNode(node.id));
            card.addEventListener(&quot;keydown&quot;, (event) =&gt; {
              if (event.target !== card || event.key !== &quot;Enter&quot; &amp;&amp; event.key !== &quot; &quot;) return;
              event.preventDefault();
              selectNode(node.id);
            });
            card.querySelector(&quot;.node-preview-toggle&quot;).addEventListener(&quot;click&quot;, (event) =&gt; {
              event.stopPropagation();
              toggleDetail(node.id, card);
            });
            list.appendChild(card);
          }
          body.appendChild(group);
        }
        canvas.appendChild(column);
      }
      chapterSelect.querySelectorAll(&quot;option:not(:first-child)&quot;).forEach((option) =&gt; option.remove());
      for (const chapter of DATA.chapters) {
        const option = document.createElement(&quot;option&quot;);
        option.value = chapter.title;
        option.textContent = chapter.title;
        chapterSelect.appendChild(option);
      }
      stat.textContent = `${visibleNodeIds.size}/${DATA.stats.nodes} statements · ${displayedEdges().length} dependency links`;
      requestAnimationFrame(() =&gt; {
        measure();
        fitMap(false);
      });
    }

    function measure() {
      canvas.style.transform = &quot;none&quot;;
      const columns = [...canvas.querySelectorAll(&quot;.chapter-column&quot;)];
      const style = getComputedStyle(canvas);
      const paddingRight = Number.parseFloat(style.paddingRight) || 0;
      const paddingBottom = Number.parseFloat(style.paddingBottom) || 0;
      baseWidth = Math.ceil(Math.max(...columns.map((column) =&gt; column.offsetLeft + column.offsetWidth), 1) + paddingRight);
      baseHeight = Math.ceil(Math.max(...columns.map((column) =&gt; column.offsetTop + column.offsetHeight), 1) + paddingBottom);
      canvas.style.transform = `scale(${zoom})`;
      scene.style.width = `${Math.max(viewport.clientWidth, Math.ceil(baseWidth * zoom))}px`;
      scene.style.height = `${Math.max(viewport.clientHeight, Math.ceil(baseHeight * zoom))}px`;
      for (const layer of [edgeLayer, focusEdgeLayer]) {
        layer.setAttribute(&quot;width&quot;, String(baseWidth));
        layer.setAttribute(&quot;height&quot;, String(baseHeight));
        layer.setAttribute(&quot;viewBox&quot;, `0 0 ${baseWidth} ${baseHeight}`);
      }
    }

    function drawArrowhead(layer, path, color, classes = [], focused = false, opacity = null) {
      const length = path.getTotalLength();
      if (!Number.isFinite(length) || length &lt;= 0) return;
      const tip = path.getPointAtLength(length);
      const sampleDistance = Math.min(14, Math.max(4, length * .25));
      const before = path.getPointAtLength(Math.max(0, length - sampleDistance));
      const angle = Math.atan2(tip.y - before.y, tip.x - before.x) * 180 / Math.PI;
      const headLength = focused ? 10 : 8.5;
      const halfWidth = focused ? 5 : 4.25;
      const arrowhead = document.createElementNS(&quot;http://www.w3.org/2000/svg&quot;, &quot;polygon&quot;);
      arrowhead.classList.add(&quot;edge-arrowhead&quot;, ...classes);
      arrowhead.setAttribute(&quot;points&quot;, `0,0 ${-headLength},${-halfWidth} ${-headLength},${halfWidth}`);
      arrowhead.setAttribute(&quot;transform&quot;, `translate(${tip.x} ${tip.y}) rotate(${angle})`);
      arrowhead.setAttribute(&quot;fill&quot;, color);
      if (opacity != null) {
        arrowhead.setAttribute(&quot;fill-opacity&quot;, String(opacity));
        arrowhead.style.opacity = String(opacity);
      }
      layer.appendChild(arrowhead);
    }

    function drawEdges() {
      const rect = canvas.getBoundingClientRect();
      edgeLayer.querySelectorAll(&quot;.edge-path, .edge-arrowhead&quot;).forEach((element) =&gt; element.remove());
      focusEdgeLayer.querySelectorAll(&quot;.edge-path, .edge-arrowhead&quot;).forEach((element) =&gt; element.remove());
      edgeLayer.classList.toggle(&quot;muted&quot;, !!focusedId);
      const edges = displayedEdges();
      const maxDepth = depthSelect.value === &quot;all&quot; ? Number.POSITIVE_INFINITY : Number(depthSelect.value);
      const neighborhood = focusedId ? dependencyNeighborhood(focusedId, edges, maxDepth) : { levels: new Map(), dirs: new Map() };
      const { levels, dirs } = neighborhood;
      for (const edge of edges) {
        const from = canvas.querySelector(`[data-node=&quot;${CSS.escape(edge.from)}&quot;]`);
        const to = canvas.querySelector(`[data-node=&quot;${CSS.escape(edge.to)}&quot;]`);
        if (!from || !to) continue;
        const a = from.getBoundingClientRect();
        const b = to.getBoundingClientRect();
        const sameChapter = byId.get(edge.from)?.chapter === byId.get(edge.to)?.chapter;
        const x1 = (a.right - rect.left) / zoom;
        const y1 = (a.top + a.height / 2 - rect.top) / zoom;
        const x2 = ((sameChapter ? b.right : b.left) - rect.left) / zoom;
        const y2 = (b.top + b.height / 2 - rect.top) / zoom;
        let pathData;
        if (sameChapter) {
          const right = Math.max(x1, x2) + 16;
          pathData = `M ${x1} ${y1} C ${right} ${y1}, ${right} ${y2}, ${x2} ${y2}`;
        } else {
          const delta = Math.max(28, Math.abs(x2 - x1) * .34);
          const direction = x2 &gt;= x1 ? 1 : -1;
          pathData = `M ${x1} ${y1} C ${x1 + delta * direction} ${y1}, ${x2 - delta * direction} ${y2}, ${x2} ${y2}`;
        }
        const focusStyle = focusedId ? focusEdgeStyle(edge, focusedId, levels, dirs) : null;
        if (focusStyle) {
          const opacity = layerOpacity(focusStyle.edgeLevel, maxDepth);
          const focusPath = document.createElementNS(&quot;http://www.w3.org/2000/svg&quot;, &quot;path&quot;);
          focusPath.classList.add(&quot;edge-path&quot;, &quot;edge-focus&quot;, `edge-${focusStyle.relation}`);
          focusPath.setAttribute(&quot;d&quot;, pathData);
          focusPath.setAttribute(&quot;stroke&quot;, focusStyle.color);
          focusPath.setAttribute(&quot;stroke-opacity&quot;, String(opacity));
          focusPath.style.stroke = focusStyle.color;
          focusPath.style.opacity = String(opacity);
          focusEdgeLayer.appendChild(focusPath);
          drawArrowhead(focusEdgeLayer, focusPath, focusStyle.color, [`edge-${focusStyle.relation}`], true, opacity);
        } else if (!focusedId) {
          const path = document.createElementNS(&quot;http://www.w3.org/2000/svg&quot;, &quot;path&quot;);
          path.classList.add(&quot;edge-path&quot;);
          if (!sameChapter) path.classList.add(&quot;edge-cross&quot;);
          path.setAttribute(&quot;d&quot;, pathData);
          edgeLayer.appendChild(path);
          drawArrowhead(edgeLayer, path, sameChapter ? &quot;#8fb1df&quot; : &quot;#6f95cb&quot;, sameChapter ? [] : [&quot;edge-cross&quot;]);
        }
      }
    }

    function refreshFocusPresentation() {
      const maxDepth = depthSelect.value === &quot;all&quot; ? Number.POSITIVE_INFINITY : Number(depthSelect.value);
      const edges = displayedEdges();
      const neighborhood = focusedId
        ? dependencyNeighborhood(focusedId, edges, maxDepth)
        : { levels: new Map(), dirs: new Map() };
      const { levels, dirs } = neighborhood;
      const query = search.value.trim().toLowerCase();
      const selectedStatus = status.value;
      const selectedChapter = chapterSelect.value;
      let visible = 0;
      canvas.querySelectorAll(&quot;.node-card&quot;).forEach((card) =&gt; {
        const nodeId = card.dataset.node;
        const node = byId.get(nodeId);
        const isSelected = nodeId === focusedId;
        const level = levels.get(nodeId);
        const dir = dirs.get(nodeId);
        const isChapter = selectedChapter === &quot;all&quot; || card.dataset.chapter === selectedChapter;
        const isStatus = selectedStatus === &quot;all&quot; || card.dataset.status === selectedStatus;
        const isQuery = !query || card.dataset.search.includes(query);
        const filterMatch = isChapter &amp;&amp; isStatus &amp;&amp; isQuery;
        const inNeighborhood = !focusedId || levels.has(nodeId);
        card.classList.toggle(&quot;selected&quot;, isSelected);
        card.setAttribute(&quot;aria-pressed&quot;, String(isSelected));
        card.classList.toggle(&quot;layer-dep&quot;, dir === &quot;in&quot;);
        card.classList.toggle(&quot;layer-use&quot;, dir === &quot;out&quot;);
        card.classList.toggle(&quot;match&quot;, !!query &amp;&amp; isQuery);
        // Depth filter owns visibility; status/search filters only dim within the neighborhood.
        const hideForDepth = !!focusedId &amp;&amp; !inNeighborhood;
        card.style.visibility = hideForDepth ? &quot;hidden&quot; : &quot;&quot;;
        card.style.pointerEvents = hideForDepth ? &quot;none&quot; : &quot;&quot;;
        card.classList.toggle(&quot;dim&quot;, hideForDepth || !filterMatch);
        if (level != null &amp;&amp; level &gt; 0 &amp;&amp; filterMatch &amp;&amp; !hideForDepth) {
          card.style.setProperty(&quot;--layer-strength&quot;, String(layerStrength(level, maxDepth)));
          card.style.opacity = String(Math.max(0.42, layerOpacity(level, maxDepth)));
        } else {
          card.style.removeProperty(&quot;--layer-strength&quot;);
          card.style.opacity = &quot;&quot;;
        }
        if (filterMatch &amp;&amp; !hideForDepth) visible += 1;
        if (node) card.setAttribute(&quot;aria-label&quot;, `${node.title}, ${statusLabel(node.status)}`);
      });
      canvas.querySelectorAll(&quot;.chapter-column&quot;).forEach((column) =&gt; {
        column.style.opacity = selectedChapter === &quot;all&quot; || column.dataset.chapter === selectedChapter ? &quot;1&quot; : &quot;.35&quot;;
      });
      const edgeCount = focusedId
        ? edges.filter((edge) =&gt; levels.has(edge.from) &amp;&amp; levels.has(edge.to)).length
        : displayedEdges().length;
      stat.textContent = focusedId
        ? `${visible} in ${depthSelect.value === &quot;all&quot; ? &quot;all&quot; : depthSelect.value}-layer focus · ${edgeCount} links`
        : `${visible}/${DATA.stats.nodes} statements · ${edgeCount} dependency links`;
      return { levels, dirs };
    }

    function applyFilters() {
      refreshFocusPresentation();
      drawEdges();
    }

    function linkList(ids, emptyText) {
      if (!ids.length) return `&lt;li&gt;${escapeHtml(emptyText)}&lt;/li&gt;`;
      return ids.slice(0, 12).map((id) =&gt; {
        const node = byId.get(id);
        return node ? `&lt;li&gt;${escapeHtml(node.display_title || node.title)}&lt;/li&gt;` : &quot;&quot;;
      }).join(&quot;&quot;);
    }

    async function discoverKatex() {
      const mainScript = [...window.parent.document.querySelectorAll(&quot;script[type=module][src]&quot;)]
        .map((script) =&gt; script.src)
        .find((source) =&gt; /\/assets\/index-[^/]+\.js$/.test(source));
      if (!mainScript) throw new Error(&quot;hgraph entry bundle was not found&quot;);
      const bundle = await fetch(mainScript).then((response) =&gt; response.text());
      const renderer = bundle.match(/katexLoader-[A-Za-z0-9_-]+\.js/)?.[0];
      const stylesheet = bundle.match(/katexLoader-[A-Za-z0-9_-]+\.css/)?.[0];
      if (!renderer || !stylesheet) throw new Error(&quot;hgraph KaTeX assets were not found&quot;);
      if (!document.querySelector(&#x27;link[data-katex-stylesheet]&#x27;)) {
        const link = document.createElement(&quot;link&quot;);
        link.rel = &quot;stylesheet&quot;;
        link.dataset.katexStylesheet = &quot;&quot;;
        link.href = new URL(stylesheet, new URL(&quot;.&quot;, mainScript)).href;
        document.head.appendChild(link);
      }
      return import(new URL(renderer, new URL(&quot;.&quot;, mainScript)).href).then((module) =&gt; module.default);
    }

    function loadKatex() {
      if (!katexLoader) katexLoader = discoverKatex();
      return katexLoader;
    }

    function typesetDetailBody(id, card) {
      const body = document.querySelector(&quot;#detail-body .detail-statement&quot;);
      if (!body || !body.textContent.includes(&quot;$&quot;) &amp;&amp; !body.textContent.includes(&quot;\\(&quot;) &amp;&amp; !body.textContent.includes(&quot;\\begin&quot;) &amp;&amp; !body.textContent.includes(&quot;begin{&quot;)) return;
      const normalizeMath = (value) =&gt; {
        let text = String(value)
          .replace(/\\?begin\{align\*?\s*[})]?/g, &quot;\\begin{aligned}&quot;)
          .replace(/\\?l?end\{align\*?\s*[})]?/g, &quot;\\end{aligned}&quot;);
        text = text.replace(/(?&lt;!\\\[)\\begin\{aligned\}/g, &quot;\\[\\begin{aligned}&quot;);
        text = text.replace(/\\end\{aligned\}(?!\\\])/g, &quot;\\end{aligned}\\]&quot;);
        return text;
      };
      body.textContent = normalizeMath(body.textContent);
      loadKatex().then((render) =&gt; {
        if (!body.isConnected || previewId !== id) return;
        render(body, {
          delimiters: [
            { left: &quot;\\[&quot;, right: &quot;\\]&quot;, display: true },
            { left: &quot;\\(&quot;, right: &quot;\\)&quot;, display: false },
            { left: &quot;$$&quot;, right: &quot;$$&quot;, display: true },
            { left: &quot;$&quot;, right: &quot;$&quot;, display: false },
          ],
          macros: KATEX_MACROS,
          globalGroup: true,
          throwOnError: false,
        });
        if (previewId === id &amp;&amp; card) placeDetail(card);
      }).catch(() =&gt; {});
    }

    function placeDetail(card) {
      if (!card || !detail.classList.contains(&quot;open&quot;)) return;
      const anchor = card.getBoundingClientRect();
      const viewportRect = viewport.getBoundingClientRect();
      if (anchor.right &lt; viewportRect.left || anchor.left &gt; viewportRect.right || anchor.bottom &lt; viewportRect.top || anchor.top &gt; viewportRect.bottom) {
        closeDetail();
        return;
      }
      const margin = 12;
      const gap = 10;
      const preferredWidth = Math.min(430, window.innerWidth - margin * 2);
      const spaces = {
        right: window.innerWidth - anchor.right - gap - margin,
        left: anchor.left - gap - margin,
        below: window.innerHeight - anchor.bottom - gap - margin,
        above: anchor.top - gap - margin,
      };
      const horizontalSide = spaces.right &gt;= preferredWidth || spaces.left &gt;= preferredWidth
        ? (spaces.right &gt;= spaces.left ? &quot;right&quot; : &quot;left&quot;)
        : null;

      detail.style.left = &quot;auto&quot;;
      detail.style.right = &quot;auto&quot;;
      detail.style.top = &quot;auto&quot;;
      detail.style.bottom = &quot;auto&quot;;
      detail.style.width = `${preferredWidth}px`;
      detail.style.maxHeight = `${Math.min(560, window.innerHeight - margin * 2)}px`;

      if (horizontalSide) {
        detail.style.left = horizontalSide === &quot;right&quot;
          ? `${anchor.right + gap}px`
          : `${anchor.left - gap - preferredWidth}px`;
        const panelHeight = detail.getBoundingClientRect().height;
        detail.style.top = `${Math.max(margin, Math.min(anchor.top, window.innerHeight - panelHeight - margin))}px`;
        detail.dataset.placement = horizontalSide;
        return;
      }

      const verticalSide = spaces.below &gt;= spaces.above ? &quot;below&quot; : &quot;above&quot;;
      const availableHeight = Math.max(80, spaces[verticalSide]);
      detail.style.maxHeight = `${Math.min(560, availableHeight)}px`;
      detail.style.left = `${Math.max(margin, Math.min(anchor.left + anchor.width / 2 - preferredWidth / 2, window.innerWidth - preferredWidth - margin))}px`;
      if (verticalSide === &quot;below&quot;) {
        detail.style.top = `${anchor.bottom + gap}px`;
      } else {
        detail.style.bottom = `${window.innerHeight - anchor.top + gap}px`;
      }
      detail.dataset.placement = verticalSide;
    }

    function openDetail(id, card = canvas.querySelector(`[data-node=&quot;${CSS.escape(id)}&quot;]`)) {
      const node = byId.get(id);
      if (!node) return;
      previewId = id;
      previewAnchor = card;
      canvas.querySelectorAll(&quot;.node-card&quot;).forEach((nodeCard) =&gt; {
        const isOpen = nodeCard.dataset.node === id;
        nodeCard.classList.toggle(&quot;preview-open&quot;, isOpen);
        const button = nodeCard.querySelector(&quot;.node-preview-toggle&quot;);
        button.setAttribute(&quot;aria-expanded&quot;, String(isOpen));
        button.setAttribute(&quot;aria-label&quot;, isOpen ? &quot;Hide statement preview&quot; : &quot;Show statement preview&quot;);
        button.title = isOpen ? &quot;Hide statement preview&quot; : &quot;Show statement preview&quot;;
      });
      document.getElementById(&quot;detail-kind&quot;).textContent = node.kind;
      document.getElementById(&quot;detail-title&quot;).textContent = node.title;
      document.getElementById(&quot;detail-label&quot;).textContent = node.label;
      document.getElementById(&quot;detail-chapter&quot;).textContent = node.chapter;
      document.getElementById(&quot;detail-section&quot;).textContent = node.section;
      document.getElementById(&quot;detail-status&quot;).textContent = statusLabel(node.status);
      const sourceRef = node.ref || node.label || node.id;
      document.getElementById(&quot;detail-ref&quot;).textContent = sourceRef;
      document.getElementById(&quot;detail-body&quot;).innerHTML = `&lt;div class=&quot;detail-source-ref&quot;&gt;Original source / dcref: &lt;code&gt;${escapeHtml(sourceRef)}&lt;/code&gt;&lt;/div&gt;&lt;div class=&quot;detail-statement&quot;&gt;${escapeHtml(node.body || &quot;No statement text was captured for this node.&quot;)}&lt;/div&gt;`;
      document.getElementById(&quot;detail-deps&quot;).innerHTML = linkList(incoming.get(id) || [], &quot;No prerequisites in the current blueprint.&quot;);
      document.getElementById(&quot;detail-used-by&quot;).innerHTML = linkList(outgoing.get(id) || [], &quot;No downstream consumers in the current blueprint.&quot;);
      detail.classList.add(&quot;open&quot;);
      if (card) {
        placeDetail(card);
      }
      typesetDetailBody(id, card);
    }

    function toggleDetail(id, card) {
      if (previewId === id &amp;&amp; detail.classList.contains(&quot;open&quot;)) {
        closeDetail();
      } else {
        openDetail(id, card);
      }
    }

    function closeDetail() {
      previewId = null;
      previewAnchor = null;
      detail.classList.remove(&quot;open&quot;);
      delete detail.dataset.placement;
      canvas.querySelectorAll(&quot;.node-card.preview-open&quot;).forEach((card) =&gt; {
        card.classList.remove(&quot;preview-open&quot;);
        const button = card.querySelector(&quot;.node-preview-toggle&quot;);
        button.setAttribute(&quot;aria-expanded&quot;, &quot;false&quot;);
        button.setAttribute(&quot;aria-label&quot;, &quot;Show statement preview&quot;);
        button.title = &quot;Show statement preview&quot;;
      });
    }

    function selectNode(id) {
      focusedId = focusedId === id ? null : id;
      refreshFocusPresentation();
      drawEdges();
    }

    function setZoom(next, keepFit = false) {
      zoom = Math.max(.08, Math.min(4, next));
      fitMode = keepFit;
      measure();
      drawEdges();
    }

    function fitMap(smooth = true) {
      measure();
      const fittedZoom = viewport.clientWidth / Math.max(baseWidth, 1);
      setZoom(fittedZoom, true);
      viewport.scrollTo({ left: 0, top: 0, behavior: smooth ? &quot;smooth&quot; : &quot;auto&quot; });
    }

    search.addEventListener(&quot;input&quot;, applyFilters);
    status.addEventListener(&quot;change&quot;, applyFilters);
    chapterSelect.addEventListener(&quot;change&quot;, applyFilters);
    minimized.addEventListener(&quot;change&quot;, () =&gt; { focusedId = null; render(); applyFilters(); });
    depthSelect.addEventListener(&quot;change&quot;, () =&gt; { if (focusedId) { const id = focusedId; focusedId = null; selectNode(id); } else drawEdges(); });
    document.getElementById(&quot;map-close&quot;).addEventListener(&quot;click&quot;, () =&gt; {
      if (window.parent !== window) window.parent.location.reload();
    });
    document.getElementById(&quot;map-fit&quot;).addEventListener(&quot;click&quot;, () =&gt; fitMap(true));
    viewport.addEventListener(&quot;scroll&quot;, () =&gt; {
      if (previewAnchor) requestAnimationFrame(() =&gt; placeDetail(previewAnchor));
    }, { passive: true });
    let resizeFrame = null;
    new ResizeObserver(() =&gt; {
      cancelAnimationFrame(resizeFrame);
      resizeFrame = requestAnimationFrame(() =&gt; {
        if (fitMode) fitMap(false); else { measure(); drawEdges(); }
        if (previewAnchor) placeDetail(previewAnchor);
      });
    }).observe(viewport);

    // Dragging the blank canvas makes the wide chapter layout feel like a map,
    // while buttons and text keep their normal click behaviour.
    let drag = null;
    viewport.addEventListener(&quot;pointerdown&quot;, (event) =&gt; {
      if (event.target.closest(&quot;.node-card, button, input, select&quot;)) return;
      drag = { x: event.clientX, y: event.clientY, left: viewport.scrollLeft, top: viewport.scrollTop };
      viewport.classList.add(&quot;dragging&quot;);
      viewport.setPointerCapture(event.pointerId);
    });
    viewport.addEventListener(&quot;pointermove&quot;, (event) =&gt; {
      if (!drag) return;
      viewport.scrollLeft = drag.left - (event.clientX - drag.x);
      viewport.scrollTop = drag.top - (event.clientY - drag.y);
    });
    const stopDrag = () =&gt; { drag = null; viewport.classList.remove(&quot;dragging&quot;); };
    viewport.addEventListener(&quot;pointerup&quot;, stopDrag);
    viewport.addEventListener(&quot;pointercancel&quot;, stopDrag);

    render();
  &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
