thrm{std}},C_2^{\\mathrm{std}}$ from\nLemma~59.7 and Claim~5 of II.2.  Set\n\\[\n C_1=\\max\\{30\\epsilon^{-1},C_1^\\kappa,C_1^{\\mathrm{std}}\\},\\qquad\nC_2=\\max\\{C_2^\\kappa,C_2^{\\mathrm{std}}\\}.\n\\]\nAt a transition time, $\\mathcal M_t^-$ denotes the presurgery slice and\n$\\mathcal M_t^+$ the postsurgery slice; at a regular time both denote the\nordinary slice.  A backward (respectively forward) parabolic neighborhood\nbelow is only formed with $x\\in\\mathcal M_t^-$ (respectively\n$x\\in\\mathcal M_t^+$) and with time depth at most $t$.  With this eligibility\nconvention, for a positive nonincreasing $r$, every\n$(x,t)\\in\\mathcal M_t^\\pm$ with\n$R(x,t)\\ge r(t)^{-2}$ has an open canonical neighborhood\n$\\overline{B^\\pm(x,t,\\widehat r)}\\subset U\\subset B^\\pm(x,t,2\\widehat r)$,\nwhere $R(x,t)^{-1/2}&lt;\\widehat r&lt;C_1R(x,t)^{-1/2}$, modeled by a strong\n$\\epsilon$-neck, a $\\kappa_0$- or standard-solution cap, an $S^3/\\mathbb{RP}^3$\ncomponent, or an $\\epsilon$-round positive space form; on $U$ scalar curvature\nis $C_2$-comparable to $R(x,t)$ and the derivative bounds\n$|\\nabla R|&lt;\\eta R^{3/2}$ and $|\\partial_tR|&lt;\\eta R^2$ hold one-sided at surgery.\nIn the neck, cap, and closed-component cases,\n\\[\n \\operatorname{Vol}_{g(t)}U&gt;C_2^{-1}R(x,t)^{-3/2},\n\\]\nand in the closed-component case the infimal sectional curvature on $U$ is\ngreater than $C_2^{-1}R(x,t)$.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:53,&quot;ref&quot;:&quot;KL:I.11:50.1,KL:II.1:59.4,KL:II.1:59.7,KL:II.2:Claim5,KL:II.4:69.1&quot;},{&quot;id&quot;:&quot;280980cf9bde&quot;,&quot;label&quot;:&quot;thm:controlled-curve-shrinking-existence&quot;,&quot;title&quot;:&quot;Controlled curve shrinking for compact loop families&quot;,&quot;display_title&quot;:&quot;Theorem 4.40: Controlled curve shrinking for compact loop families&quot;,&quot;body&quot;:&quot;This is an assembled interface: the cited Morgan--Tian claims supply the\nfree-loop approximation, ramp preservation/global existence, and flow pieces,\nwhile the correction supplies the required dependence on initial length and\ntotal curvature.  The compact-family conclusion is the composition of the\nexplicit interfaces stated above.\nLet $g(t)$ be a Ricci flow on a compact manifold for\n$t\\in[t_0,t_1]$, and let\n$\\Gamma\\colon S^2\\to\\Lambda M$ be a continuous family of null-homotopic\nloops.  Then for every $\\zeta&gt;0$ there is a homotopic family of smooth loops\n$\\widetilde\\Gamma$ with length and least spanning area within $\\zeta$ of\nthose of $\\Gamma$, and constants $L_0,\\Theta_0&lt;\\infty$ such that, for every\n$c\\in S^2$ and $0&lt;\\lambda&lt;1$, the degree-one lift\n$\\widetilde\\Gamma(c)^\\lambda\\subset M\\times S^1_\\lambda$ has a unique\ngeometric curve-shrinking flow, up to time-dependent reparametrization,\nthroughout $[t_0,t_1]$.  For each fixed $\\lambda$, these flows form a\ncontinuous family in $c$, remain ramps, obey uniform length and\ntotal-curvature bounds depending\non $L_0,\\Theta_0$ and the ambient flow, and satisfy the uniform local\ncurvature and derivative estimates above whenever the small-turning\nhypothesis holds.\nThe family statement means continuity as a map\n$S^2\\times[t_0,t_1]\\to\\Lambda M$ after projection from the chosen lifted\nbranches in $M\\times\\mathbb R$.  This is a free-loop family statement; no\nbased representative is fixed, but the free-loop orbit is preserved by\n\\ref{lem:free-loop-approximation-preserves-pi1-orbit} whenever\n$\\pi_2(M)=0$.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Controlled Curve-Shrinking Interface&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:178,&quot;ref&quot;:&quot;MT:ch19:19.1,MT:ch19:19.10,MT:ch19:19.14,MT:ch19:19.17,MT:ch19:19.24&quot;},{&quot;id&quot;:&quot;2afafee3686f&quot;,&quot;label&quot;:&quot;lem:least-disk-area-continuity-under-isotopy&quot;,&quot;title&quot;:&quot;Least-disk area is continuous under a boundary isotopy&quot;,&quot;display_title&quot;:&quot;Lemma 5.32: Least-disk area is continuous under a boundary isotopy&quot;,&quot;body&quot;:&quot;Let $(N,g)$ be compact and let\n$\\Gamma\\colon S^1\\times[0,1]\\to N$ be a $C^2$ isotopy such that every\n$\\Gamma_s$ is an embedded null-homotopic curve.  If\n$\\mathcal A_g(\\Gamma_s)$ denotes the least spanning-disk area, then\n$s\\mapsto\\mathcal A_g(\\Gamma_s)$ is continuous.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Controlled Loop-Family Deformation&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:210,&quot;ref&quot;:&quot;MT:ch19:19.4&quot;},{&quot;id&quot;:&quot;2afe5ab2efbb&quot;,&quot;label&quot;:&quot;lem:radial-surgery-map-nonexpanding&quot;,&quot;title&quot;:&quot;The radial surgery map is nonexpanding&quot;,&quot;display_title&quot;:&quot;Lemma 1.13: The radial surgery map is nonexpanding&quot;,&quot;body&quot;:&quot;Regard the map $\\xi$ of\n\\ref{lem:standard-cap-radial-collapse-nonexpanding} as a map from $N$\nto the surgery manifold $\\mathcal S$.  Then\n\\[\n \\xi\\colon(N,g)\\longrightarrow(\\mathcal S,\\widetilde g)\n\\]\nis distance nonincreasing.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:12,&quot;ref&quot;:&quot;MT:ch13:13.2&quot;},{&quot;id&quot;:&quot;2c2530143515&quot;,&quot;label&quot;:&quot;def:curve-flow-local-graph-coordinates&quot;,&quot;title&quot;:&quot;Local graph-flow coordinates&quot;,&quot;display_title&quot;:&quot;Definition 4.8: Local graph-flow coordinates&quot;,&quot;body&quot;:&quot;At the midpoint $p$ of a length-$r$ arc, lift the evolving arc through the\n$h(t&#x27;)$-exponential local diffeomorphism from a ball in $T_pW$.  Give\n$T_pW$ the Euclidean metric $h&#x27;=h(t&#x27;)_p$ and take the $z$-axis tangent to the\nlifted arc.  The choice of $r_0$ ensures that throughout the tangent-space\nball\n\\[\n |h(t)-h&#x27;|_{h&#x27;}&lt;\\delta,\\qquad\n |\\Gamma(A,B)|_{h&#x27;}&lt;\\delta|A|_{h&#x27;}|B|_{h&#x27;}.\n\\]\nOn a fixed interval $I&#x27;$ of $h&#x27;$-length $l\\in[0.8r,r]$, write the evolving\narc, up to its maximal graph time $t_3\\le t_2$, as\n$\\widetilde\\gamma(z,t)=(z,f(z,t))$, where $|f_z|_{h&#x27;}\\le1/10$.  Define\n\\[\n Z=\\partial_z\\widetilde\\gamma=(1,f_z),\\qquad\n Y=\\partial_t\\widetilde\\gamma=(0,f_t).\n\\]\nThus $Y$ is $h&#x27;$-orthogonal to the $z$-axis and differs from\n$\\nabla_SS$ by a scalar multiple of $Z$.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Graph-Flow Coordinate Estimates&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:146,&quot;ref&quot;:&quot;MT:ch19:19.64&quot;},{&quot;id&quot;:&quot;2c345842c2a8&quot;,&quot;label&quot;:&quot;lem:cutoff-surgery-volume-loss&quot;,&quot;title&quot;:&quot;Uniform volume loss at a cutoff surgery&quot;,&quot;display_title&quot;:&quot;Lemma 3.36: Uniform volume loss at a cutoff surgery&quot;,&quot;body&quot;:&quot;Fix the dimension-three neck parameter $\\epsilon$ and choose the cutoff\nparameter $\\bar\\delta$ below the standard cap threshold.  There is a constant\n$c_{\\rm vol}=c_{\\rm vol}(\\epsilon,\\bar\\delta)&gt;0$ such that, at every cutoff\nsurgery on a central neck of scale $h$, the total volume after inserting the\nstandard cap and discarding the exposed component satisfies\n\\[\n \\operatorname{Vol}(M_t^-)-\\operatorname{Vol}(M_t^+)\n \\ge c_{\\rm vol}h^3.\n\\]\nThe same bound holds componentwise whenever a neck is cut, and it is uniform\nover all scales and all surgery times for which the displayed parameters are\nused.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Surgery Continuation and Finiteness&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:136,&quot;ref&quot;:&quot;KL:II.4:volumelossremark,MT:ch17:17.12&quot;},{&quot;id&quot;:&quot;2d7fad1bc78e&quot;,&quot;label&quot;:&quot;thm:uniform-controlled-ramp-approximation&quot;,&quot;title&quot;:&quot;Uniform smooth approximation by controlled ramps&quot;,&quot;display_title&quot;:&quot;Theorem 4.22: Uniform smooth approximation by controlled ramps&quot;,&quot;body&quot;:&quot;Let $\\Gamma\\colon S^2\\to\\Lambda M$ be a continuous family of\nnull-homotopic loops.  Let $0&lt;\\zeta&lt;1$.  There is a continuous family\n$\\widetilde\\Gamma\\colon S^2\\to\\Lambda M$ such that\n$[\\widetilde\\Gamma]=[\\Gamma]$ as a free-loop homotopy class, every member is\nsmooth, and, for every\n$0&lt;\\alpha&lt;1$, the same family is continuous in the $C^{2,\\alpha}$ topology.\nThe homotopy is a free-loop homotopy; no based class or fixed-basepoint\npreservation is asserted.  In particular,\n\\[\n |L(\\widetilde\\Gamma(q))-L(\\Gamma(q))|&lt;\\zeta,\\qquad\n |A(\\widetilde\\Gamma(q))-A(\\Gamma(q))|&lt;\\zeta.\n\\]\nMoreover there is $C_0&lt;\\infty$, independent of $q$ and\n$0&lt;\\lambda&lt;1$, for which both the length and total curvature of every ramp\n$\\widetilde\\Gamma(q)^\\lambda$ are at most $C_0$.\nThe homotopy assertion is a family assertion: the annuli form a continuous\nmap $S^2\\times[0,1]\\to\\Lambda M$.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Polygonal Ramp Approximation&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:160,&quot;ref&quot;:&quot;MT:ch19:19.17&quot;},{&quot;id&quot;:&quot;2e150f9c057c&quot;,&quot;label&quot;:&quot;lem:immersed-loop-embedded-approximation&quot;,&quot;title&quot;:&quot;Single immersed loop approximation by embedded boundaries&quot;,&quot;display_title&quot;:&quot;Lemma 5.33: Single immersed loop approximation by embedded boundaries&quot;,&quot;body&quot;:&quot;Let $\\gamma\\colon S^1\\to N$ be a $C^2$ immersed null-homotopic loop in a\nsmooth three-manifold.  For every $\\varepsilon&gt;0$ there is an embedded $C^2$\nnull-homotopic loop $\\gamma_\\varepsilon$, $C^2$-close to $\\gamma$, and a\nthin collar homotopy between them such that\n\\[\n \\bigl|\\mathcal A_g(\\gamma_\\varepsilon)-\\mathcal A_g(\\gamma)\\bigr|&lt;\\varepsilon.\n\\]\nThe assertion is for each loop (or each member of a finite net), not a claim\nthat an arbitrary positive-dimensional family can be made simultaneously\nembedded.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Controlled Loop-Family Deformation&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:211,&quot;ref&quot;:&quot;MT:ch19:19.4&quot;},{&quot;id&quot;:&quot;2e2a150f9e0c&quot;,&quot;label&quot;:&quot;thm:annular-douglas-minimizer&quot;,&quot;title&quot;:&quot;Douglas attainment and regularity for a nondegenerate annulus&quot;,&quot;display_title&quot;:&quot;Theorem 5.37: Douglas attainment and regularity for a nondegenerate annulus&quot;,&quot;body&quot;:&quot;Let $\\rho&gt;0$ and assume that the class\n$\\mathscr A_\\rho(c_0,c_1)$ of\n\\ref{def:nondegenerate-douglas-annulus-class} is nonempty.  Then its annular\narea infimum is attained by a classical conformal harmonic annulus $A$.  Its\ninterior branch set is finite, it is real analytic up to its real-analytic\nboundary, and it has no true boundary branch point.  False boundary branch\npoints are not excluded.  There are interior parallel boundary curves\navoiding the finite branch set which converge to the original boundary and\nwhose intervening collar areas tend to zero.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Controlled Loop-Family Deformation&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:215,&quot;ref&quot;:&quot;MT:ch19:19.15, white-classical-area-minimizing-surfaces:page-0001, white-classical-area-minimizing-surfaces:page-0002&quot;},{&quot;id&quot;:&quot;2ea12f74bfde&quot;,&quot;label&quot;:&quot;lem:single-loop-polygonal-approximation&quot;,&quot;title&quot;:&quot;Polygonal approximation&quot;,&quot;display_title&quot;:&quot;Theorem 4.17: Polygonal approximation&quot;,&quot;body&quot;:&quot;For every $C^1$ loop $c\\colon S^1\\to M$ and every $\\zeta&gt;0$, there is\n$N$ such that, for all $n\\ge N$,\n\\[\n |L(c_n)-L(c)|&lt;\\zeta,\n\\]\nand $c_n$ and $c$ cobound a piecewise smooth annulus of area less than\n$\\zeta$.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Polygonal Ramp Approximation&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:155,&quot;ref&quot;:&quot;MT:ch19:19.19&quot;},{&quot;id&quot;:&quot;30267a999bf5&quot;,&quot;label&quot;:&quot;lem:finite-net-short-terminal-transfer&quot;,&quot;title&quot;:&quot;A short net ramp forces a short neighboring terminal loop&quot;,&quot;display_title&quot;:&quot;Lemma 5.46: A short net ramp forces a short neighboring terminal loop&quot;,&quot;body&quot;:&quot;Fix the compact ramp family, $\\zeta$, $B$, and\n$t_2=t_1-B^{-1}$ from\n\\ref{lem:single-ramp-terminal-dichotomy}, with $p_1$ denoting the same product\nprojection.  There is $\\mu_{\\rm short}&gt;0$,\nindependent of $0&lt;\\lambda&lt;1$, with the following property.  Suppose\n$c,\\widehat c\\in S^2$ and the initial ramps\n$\\widetilde\\Gamma_c^\\lambda(t_0)$ and\n$\\widetilde\\Gamma_{\\widehat c}^\\lambda(t_0)$ cobound an annulus of area less\nthan $\\mu_{\\rm short}$.  If\n\\[\n L\\bigl(\\widetilde\\Gamma_{\\widehat c}^\\lambda(t)\\bigr)&lt;\\zeta/2\n \\qquad(t_2\\le t\\le t_1),\n\\]\nthen\n\\[\n L_{g(t_1)}\\bigl(p_1\\widetilde\\Gamma_c^\\lambda(t_1)\\bigr)&lt;\\zeta.\n\\]&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Controlled Loop-Family Deformation&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:224,&quot;ref&quot;:&quot;MT:ch18:18.24,MT:ch19:19.31,MT:ch19:19.35&quot;},{&quot;id&quot;:&quot;3138498549d7&quot;,&quot;label&quot;:&quot;def:hamilton-ivey-pinching-condition&quot;,&quot;title&quot;:&quot;Hamilton--Ivey pinching condition&quot;,&quot;display_title&quot;:&quot;Definition 2.6: Hamilton--Ivey pinching condition&quot;,&quot;body&quot;:&quot;For $t&gt;0$, let $\\lambda_1\\le\\lambda_2\\le\\lambda_3$ be the curvature-operator\neigenvalues.  The time-$t$ Hamilton--Ivey condition is automatic when\n$\\lambda_1\\ge0$ and otherwise, with $X=-\\lambda_1$,\n\\[\n tR\\ge tX\\left(\\log(tX)+\\log\\frac{1+t}{t}-3\\right).\n\\]&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:48,&quot;ref&quot;:&quot;KL:appB:B.5&quot;},{&quot;id&quot;:&quot;31513c36faf4&quot;,&quot;label&quot;:&quot;lem:free-loop-approximation-preserves-pi1-orbit&quot;,&quot;title&quot;:&quot;Free-loop approximation preserves the _1-orbit&quot;,&quot;display_title&quot;:&quot;Lemma 4.21: Free-loop approximation preserves the _1-orbit&quot;,&quot;body&quot;:&quot;Assume $M$ is compact, connected, and $\\pi_2(M)=0$.  If a family\n$\\Gamma\\colon S^2\\to\\Lambda_0M$ represents the free-loop orbit\n$[\\xi]$ under\n$\\pi_2(\\Lambda_0M,*)\\cong\\pi_3(M,*)$, then every family\n$\\widetilde\\Gamma$ produced by the source&#x27;s uniform controlled-ramp\napproximation represents the same orbit\n$[\\xi]$.  No choice of a based representative is required.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Polygonal Ramp Approximation&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:159,&quot;ref&quot;:&quot;MT:ch18:18.16,MT:ch19:19.17&quot;},{&quot;id&quot;:&quot;31a90c8d1eb2&quot;,&quot;label&quot;:&quot;thm:controlled-loop-family-deformation&quot;,&quot;title&quot;:&quot;Imported controlled deformation of a loop family&quot;,&quot;display_title&quot;:&quot;Theorem 5.47: Imported controlled deformation of a loop family&quot;,&quot;body&quot;:&quot;Let $g(t)$ be a Ricci flow on a compact three-manifold for\n$t\\in[t_0,t_1]$, let $\\Gamma\\colon S^2\\to\\Lambda_0M$ be continuous, and let\n$\\zeta&gt;0$.  There is a continuous family\n$\\widetilde\\Gamma(t)\\colon S^2\\to\\Lambda_0M$ such that\nthe maps $\\widetilde\\Gamma(t_0)$ and $\\Gamma$ are homotopic as maps\n$S^2\\to\\Lambda_0M$, and the path $u\\mapsto\\widetilde\\Gamma(u)$ is a homotopy\nof maps from $\\widetilde\\Gamma(t_0)$ to $\\widetilde\\Gamma(t)$ for every\n$t\\in[t_0,t_1]$.  In particular, whenever $\\pi_2(M)=0$, all these maps have\nthe same free $\\pi_1(M)$-orbit under the established loop-space\n$\\pi_2=0$ identification.  For every $c\\in S^2$,\n\\[\n |\\mathcal A_{g(t_0)}(\\widetilde\\Gamma(t_0)(c))\n   -\\mathcal A_{g(t_0)}(\\Gamma(c))|&lt;\\zeta,\n\\]\nand at least one of the following holds:\n\\begin{enumerate}\n\\item $L_{g(t_1)}(\\widetilde\\Gamma(t_1)(c))&lt;\\zeta$;\n\\item\n\\[\n \\mathcal A_{g(t_1)}(\\widetilde\\Gamma(t_1)(c))\n \\le w_{\\mathcal A_{g(t_0)}(\\widetilde\\Gamma(t_0)(c)),t_0}(t_1)+\\zeta.\n\\]\n\\end{enumerate}\nMore precisely, the construction first fixes the common terminal interval\nfrom \\ref{lem:single-ramp-terminal-dichotomy}, then a positive annular-area\nthreshold $\\mu$, then a finite $\\mu/2$-annular net, and only afterward one\ncommon scale $\\lambda&gt;0$ below the finitely many pointwise thresholds and\n$\\lambda_{\\rm net}$ of\n\\ref{lem:finite-net-ramp-nondegeneration}.  At that fixed scale every net\ncomparison starts with annular area below $\\mu$ and has the positive\nnondegeneration constant $\\rho_\\lambda=\\lambda$ throughout the time\ninterval.  Douglas attainment and the corresponding branch/collar\nregularity are then supplied by\n\\ref{thm:annular-douglas-minimizer}; no uniform positive lower bound as\n$\\lambda\\downarrow0$ is asserted.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Controlled Loop-Family Deformation&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:225,&quot;ref&quot;:&quot;MT:ch18:18.24&quot;},{&quot;id&quot;:&quot;32d360ee53fe&quot;,&quot;label&quot;:&quot;lem:coupled-length-curvature-comparison&quot;,&quot;title&quot;:&quot;Scalar exponential comparison&quot;,&quot;display_title&quot;:&quot;Lemma 4.26: Scalar exponential comparison&quot;,&quot;body&quot;:&quot;Suppose $L,\\Theta\\colon[0,T]\\to[0,\\infty)$ are absolutely continuous and\n\\[\n L&#x27;\\le C_2L,\\qquad\n \\Theta&#x27;\\le(C_1+C_2)\\Theta+C_1L\n\\]\nalmost everywhere.  Then, for $0\\le t\\le T$,\n\\[\n L(t)\\le L(0)e^{C_2t},\\qquad\n \\Theta(t)+L(t)\\le(\\Theta(0)+L(0))e^{(C_1+C_2)t}.\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Evolution Identities and Global Bounds&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:164,&quot;ref&quot;:&quot;MT:ch19:19.10&quot;},{&quot;id&quot;:&quot;34c27224dce4&quot;,&quot;label&quot;:&quot;def:epsilon-neck-and-scale&quot;,&quot;title&quot;:&quot;Epsilon-closeness, neck, and scale&quot;,&quot;display_title&quot;:&quot;Definition 1.6: Epsilon-closeness, neck, and scale&quot;,&quot;body&quot;:&quot;Fix $0&lt;\\epsilon&lt;1/2$ and put $k=\\lfloor\\epsilon^{-1}\\rfloor$.  A metric\n$g$ is \\emph{$\\epsilon$-close to $g_0$ in $C^k$} on a common domain $X$ if\n\\[\n \\sup_{x\\in X}\\left(\n |g-g_0|_{g_0}^2+\\sum_{\\ell=1}^k\n |\\nabla_{g_0}^{\\ell}g|_{g_0}^2\\right)&lt;\\epsilon^2.\n\\]\n\nAn \\emph{$\\epsilon$-neck} centered at a point $x$ with $R(x)&gt;0$ in a\nRiemannian three-manifold\n$(M,g)$ is the image $N$ of a diffeomorphism\n\\[\n \\varphi\\colon S^2\\times(-\\epsilon^{-1},\\epsilon^{-1})\\longrightarrow N\n\\]\nwith $x\\in\\varphi(S^2\\times\\{0\\})$, such that\n$R(x)\\varphi^*g$ is $\\epsilon$-close in\n$C^{\\lfloor1/\\epsilon\\rfloor}$ to $h_0+ds^2$, where $h_0$ is the round\nmetric of scalar curvature $1$ on $S^2$.  The slices are the neck spheres,\nthe slice at $s=0$ is the central sphere, and\n\\[\n s_N=\\operatorname{pr}_2\\circ\\varphi^{-1},\n \\qquad r_N=R(x)^{-1/2}\n\\]\nare the axial coordinate and the scale.  Replacing $s_N$ by $-s_N$\nreverses the neck.  Its positive and negative ends are respectively\n\\[\n E_N^+=\\{s_N&gt;0.9\\epsilon^{-1}\\},\n \\qquad\n E_N^-=\\{s_N&lt;-0.9\\epsilon^{-1}\\}.\n\\]&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:5,&quot;ref&quot;:&quot;MT:ch2:2.16,MT:ch2:2.18&quot;},{&quot;id&quot;:&quot;356e0995b890&quot;,&quot;label&quot;:&quot;thm:cap-and-neck-cover-classification&quot;,&quot;title&quot;:&quot;Connected sets covered by canonical cap cores and neck centers&quot;,&quot;display_title&quot;:&quot;Theorem 1.42: Connected sets covered by canonical cap cores and neck centers&quot;,&quot;body&quot;:&quot;For every $C&lt;\\infty$ and all sufficiently small $\\epsilon&gt;0$, let $X$ be\na connected subset of a smooth Riemannian three-manifold $M$ without\nboundary.  Suppose every\npoint of $X$ is either the center of an $\\epsilon$-neck or lies in the core\nof a $(C,\\epsilon)$-cap.  Then at least one of the following holds:\n\\begin{enumerate}\n\\item $X$ lies in a component which is the union of two\n      $(C,\\epsilon)$-caps and is diffeomorphic to\n      $S^3$, $\\mathbb{RP}^3$, or\n      $\\mathbb{RP}^3\\#\\mathbb{RP}^3$;\n\\item $X$ lies in a doubly $C$-capped $\\epsilon$-tube component of one\n      of those three diffeomorphism types;\n\\item $X$ lies in one $(C,\\epsilon)$-cap;\n\\item $X$ lies in a $C$-capped $\\epsilon$-tube;\n\\item $X$ lies in an $\\epsilon$-tube;\n\\item $X$ lies in an $\\epsilon$-fibration component covered by\n      $\\epsilon$-necks.\n\\end{enumerate}&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:41,&quot;ref&quot;:&quot;MT:app:A.21&quot;},{&quot;id&quot;:&quot;37074c813bce&quot;,&quot;label&quot;:&quot;thm:curve-shrinking-short-time-existence&quot;,&quot;title&quot;:&quot;Short-time existence and curvature blow-up alternative&quot;,&quot;display_title&quot;:&quot;Theorem 4.15: Short-time existence and curvature blow-up alternative&quot;,&quot;body&quot;:&quot;Let $0&lt;\\alpha&lt;1$ and let\n$c_0\\colon S^1\\to(M,g(t_0))$ be an immersed $C^{2,\\alpha}$ curve.  There is\n$T&gt;t_0$ and an immersed curve-shrinking flow $c$ on $[t_0,T)$.  If\n$T&lt;\\sup I$\nand $\\sup_{S^1\\times[t_0,T)}k&lt;\\infty$, then the flow extends, through\nimmersed curves, to an interval $[t_0,T+\\eta)$ for some $\\eta&gt;0$.\nConsequently every finite nonextendible endpoint has\n$\\limsup_{t\\uparrow T}\\max_{S^1}k(\\cdot,t)=\\infty$.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Short-Time Existence&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:153,&quot;ref&quot;:&quot;MT:ch19:19.1&quot;},{&quot;id&quot;:&quot;389a14ec18f3&quot;,&quot;label&quot;:&quot;def:nondegenerate-douglas-annulus-class&quot;,&quot;title&quot;:&quot;Nondegenerate Douglas annulus class&quot;,&quot;display_title&quot;:&quot;Definition 5.36: Nondegenerate Douglas annulus class&quot;,&quot;body&quot;:&quot;Let $(M,h)$ be a compact real-analytic Riemannian three-manifold, put\n$\\bar h=h+ds^2$ on $M\\times S^1_\\lambda$, and let\n$c_0,c_1\\colon S^1\\to M\\times S^1_\\lambda$ be disjoint embedded\nreal-analytic degree-one ramps in one free homotopy class.  For $\\rho&gt;0$,\nwrite $\\mathscr A_\\rho(c_0,c_1)$ for the class of $W^{1,2}$ maps $F$ from a\ncompact annulus whose boundary traces are $c_0,c_1$ up to\norientation-preserving weakly monotone reparameterizations and such that\nevery essential simple closed curve $\\alpha$ in the domain satisfies\n\\[\n L_{\\bar h}(F\\circ\\alpha)\\ge\\rho.\n\\]\nArea is counted with multiplicity.  The class is called nondegenerate when it\nis nonempty.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Controlled Loop-Family Deformation&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:214,&quot;ref&quot;:&quot;MT:ch19:19.15&quot;},{&quot;id&quot;:&quot;3a6bc0d9a9d7&quot;,&quot;label&quot;:&quot;lem:loop-space-quotient-wedge&quot;,&quot;title&quot;:&quot;The quotient and wedge model&quot;,&quot;display_title&quot;:&quot;Lemma 5.24: The quotient and wedge model&quot;,&quot;body&quot;:&quot;For $c_0\\in S^2$, the quotient\n\\[\n Q=(S^2\\times S^1)/(\\{c_0\\}\\times S^1)\n\\]\nis homotopy equivalent to $S^2\\vee S^3$.  Consequently, for every based\nspace $X$ of CW type,\n\\[\n [Q,X]_*\\cong\\pi_2(X)\\times\\pi_3(X).\n\\]&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;The Loop-Space Width Interface&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:202,&quot;ref&quot;:&quot;MT:ch18:18.16&quot;},{&quot;id&quot;:&quot;3b2c67594e86&quot;,&quot;label&quot;:&quot;thm:kappa-solution-canonical-neighborhoods&quot;,&quot;title&quot;:&quot;Canonical neighborhoods in kappa-solutions&quot;,&quot;display_title&quot;:&quot;Theorem 3.17: Canonical neighborhoods in kappa-solutions&quot;,&quot;body&quot;:&quot;For every sufficiently small $\\epsilon&gt;0$ there is\n$C=C(\\epsilon)&lt;\\infty$ such that every point of every three-dimensional\n$\\kappa$-solution has a strong $(C,\\epsilon)$-canonical neighborhood,\nunless the solution is the round product $\\mathbb{RP}^2\\times\\mathbb R$.\nMoreover, if generalized flows with no embedded two-sided\n$\\mathbb{RP}^2$ converge smoothly to a $\\kappa$-solution, then their\nbasepoints have strong $(C,\\epsilon)$-canonical neighborhoods for all\nsufficiently large indices.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Canonical Neighborhood Models&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:117,&quot;ref&quot;:&quot;MT:ch9:9.94,MT:ch9:9.95&quot;},{&quot;id&quot;:&quot;3c6c0b64ac05&quot;,&quot;label&quot;:&quot;thm:conditional-noncollapsing-extension&quot;,&quot;title&quot;:&quot;Conditional noncollapsing extension&quot;,&quot;display_title&quot;:&quot;Theorem 2.54: Conditional noncollapsing extension&quot;,&quot;body&quot;:&quot;Fix $i\\ge0$ and positive nonincreasing finite sequences\n\\[\n\\delta_0\\ge\\cdots\\ge\\delta_i,\n\\qquad \\epsilon=r_0\\ge\\cdots\\ge r_i,\n\\qquad \\kappa_0\\ge\\cdots\\ge\\kappa_i.\n\\]\nFix stage times with $T_{-1}=0$ and explicit bounds\n\\[\n 0&lt;E_-\\le T_i-T_{i-1},\\qquad T_{i+1}-T_{i-1}\\le E&lt;\\infty.\n\\]\nThere are $0&lt;\\kappa_{i+1}\\le\\kappa_i$ and a stagewise selector\n$\\mathfrak d_i:(0,r_i]\\to(0,\\delta_i]$ in the sense of\n\\ref{def:stagewise-delta-selector} such that, for every\n$0&lt;r_{i+1}\\le r_i$, the following property holds with\n$\\delta(r_{i+1})=\\mathfrak d_i(r_{i+1})$.  If a\nthree-dimensional Ricci flow with Kleiner--Lott $(r,\\bar\\delta)$-cutoff on\n$[0,T)$, $T\\in(T_i,T_{i+1}]$, has normalized compact initial data in the\nsense of \\ref{def:normalized-riemannian-three-manifold}, satisfies the\ncontrolled-surgery topological assumptions, and is ordinarily\n  $\\kappa_i$-noncollapsed below $\\epsilon$ on\n  $[T_{i-1},T_i)$ (with $T_{-1}=0$), satisfies\n\n  \\[\n   r(t)\\ge r_i\\quad(t\\in[T_{i-1},T_i)),\n   \\qquad\n   r(t)\\ge r_{i+1}\\quad(t\\in[T_i,T)),\n  \\]\n  and $r(t)\\le\\epsilon$ throughout $[T_{i-1},T)$,\n  and has a positive nonincreasing\n  surgery-control function satisfying\n\\[\n \\bar\\delta(t)\\le\\delta_j\n \\quad\\bigl(t\\in[T_j,T_{j+1}),\\ 0\\le j\\le i\\bigr),\n \\qquad\n \\bar\\delta(t)\\le\\delta(r_{i+1})\n \\quad\\bigl(t\\in[T_{i-1},T_{i+1})\\bigr),\n\\]\n  where $T_{-1}=0$, and satisfies the strong canonical-neighborhood\n  assumption with parameter $r_{i+1}$ on $[T_i,T)$, then every parabolic ball\n  of radius at most\n  $\\epsilon$ satisfying the curvature hypothesis in\n\\ref{def:surgery-flow-noncollapsing} satisfies its source disjunction with\nconstant $\\kappa_{i+1}$ for every centre and every component of the time slice:\neither the ball has volume at least $\\kappa_{i+1}\\rho^3$, or its centre lies in\na positive-sectional-curvature component.  The constant is independent of the\nparticular flow.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:96,&quot;ref&quot;:&quot;MT:ch16:16.1,KL:II.5:II.5.2&quot;},{&quot;id&quot;:&quot;3d419b69ad4d&quot;,&quot;label&quot;:&quot;lem:localized-total-curvature-smallness&quot;,&quot;title&quot;:&quot;Small localized total-curvature bound&quot;,&quot;display_title&quot;:&quot;Theorem 4.33: Small localized total-curvature bound&quot;,&quot;body&quot;:&quot;There is $D_4$, depending only on $\\Theta,L_0$, and the ambient flow, such\nthat\n\\[\n \\int_{\\gamma_t}\\varphi k\\,ds\\le D_4\\sqrt\\delta\n \\qquad(t&#x27;\\le t\\le t_2).\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Localized Total-Curvature Control&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:171,&quot;ref&quot;:&quot;MT:ch19:19.62&quot;},{&quot;id&quot;:&quot;3f37c7b2cea9&quot;,&quot;label&quot;:&quot;lem:forward-dini-mean-value&quot;,&quot;title&quot;:&quot;Right-Dini mean-value lemma&quot;,&quot;display_title&quot;:&quot;Lemma 1.1: Right-Dini mean-value lemma&quot;,&quot;body&quot;:&quot;Let $q\\colon[c,d]\\to\\mathbb R$ be continuous.  If $q(d)&gt;q(c)$, then\nthere is $s\\in[c,d)$ such that $D^+q(s)&gt;0$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Forward-Difference Comparison&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:0,&quot;ref&quot;:&quot;MT:ch2:2.22&quot;},{&quot;id&quot;:&quot;3fa1d46bb843&quot;,&quot;label&quot;:&quot;thm:extinction-connected-sum-classification&quot;,&quot;title&quot;:&quot;Connected-sum classification from finite extinction&quot;,&quot;display_title&quot;:&quot;Theorem 6.25: Connected-sum classification from finite extinction&quot;,&quot;body&quot;:&quot;Let $({\\mathcal M},G)$ be a fixed controlled generalized Ricci flow satisfying\nAssumptions (1)--(7) and carrying the Kleiner--Lott cutoff of\n\\ref{def:ricci-flow-with-cutoff} on every finite restriction, with\nconnected closed initial slice $M_0=M$.  Assume that a regular time\n$T_{\\rm ext}&lt;\\infty$ has empty slice $M_{T_{\\rm ext}}=\\varnothing$ and that\nthe flow remains empty afterwards, and assume explicitly that only finitely\nmany singular times occur in every bounded time interval.  Then there are finite families of\nspherical space forms $P_1,\\ldots,P_r$ and sphere bundles\n$F_1,\\ldots,F_s\\in\\{E_+,E_-\\}$ such that\n\\[\n M\\cong P_1\\#\\cdots\\#P_r\\#F_1\\#\\cdots\\#F_s.\n\\]\nHere $r+s\\ge1$.\nIf $M$ is orientable, every $F_j$ is $E_+$.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Backward Reconstruction from Extinction&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:260,&quot;ref&quot;:&quot;MT:ch15:15.4,MT:intro:0.1&quot;},{&quot;id&quot;:&quot;4062bfa79032&quot;,&quot;label&quot;:&quot;lem:isotopic-cap-gluing-sphere&quot;,&quot;title&quot;:&quot;An isotopic cap-gluing sphere determines a component&quot;,&quot;display_title&quot;:&quot;Lemma 1.37: An isotopic cap-gluing sphere determines a component&quot;,&quot;body&quot;:&quot;Let $X\\subset M$ be connected.  Let $\\widetilde C$ be a cap or a finite\ncapped tube containing a point of $X$, and let $C&#x27;$ be a\n$(C,\\epsilon)$-cap whose core contains a point of\n$X\\cap\\operatorname{Fr}_M(\\widetilde C)$.  Let $N&#x27;$ be the neck end of\n$C&#x27;$, oriented away from its core.  If a two-sphere\n$\\Sigma\\subset N&#x27;\\cap\\widetilde C$ lies in the closed positive half of\n$N&#x27;$ and is isotopic in $N&#x27;$ to its central sphere, then\n$\\widetilde C\\cup C&#x27;$ is a component of $M$ containing $X$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:36,&quot;ref&quot;:&quot;MT:app:A.24&quot;},{&quot;id&quot;:&quot;407c8538a6ec&quot;,&quot;label&quot;:&quot;thm:morgan-tian-proposition-15-3&quot;,&quot;title&quot;:&quot;Morgan--Tian one-surgery topological type&quot;,&quot;display_title&quot;:&quot;Theorem 6.23: Morgan--Tian one-surgery topological type&quot;,&quot;body&quot;:&quot;Let $({\\mathcal M},G)$ be a controlled generalized Ricci flow satisfying\nAssumptions (1)--(7) of Morgan--Tian and carrying the Kleiner--Lott\n$(r,\\delta)$-cutoff of \\ref{def:ricci-flow-with-cutoff} on the relevant\nfinite interval.  If $T$ is a singular time and $t^-&lt;T$ is regular and\nsufficiently close to $T$, then, for each connected component $X$ of\n$M_{t^-}$, there is a finite connected-sum expression whose summands are\nconnected components of $M_T$, smooth $S^2$-bundles over $S^1$, and closed\nconstant-positive-curvature three-manifolds.  Taking the disjoint union over\nthe components $X$ gives the corresponding global statement.  The number of\nsummands and operations is finite because the exposed region and its frontier\nare finite.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Reversing One Surgery&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:258,&quot;ref&quot;:&quot;MT:ch15:15.3&quot;},{&quot;id&quot;:&quot;42924e90a0f8&quot;,&quot;label&quot;:&quot;lem:two-smallest-curvature-cone-invariant&quot;,&quot;title&quot;:&quot;The three-dimensional two-smallest-curvature cone is reaction invariant&quot;,&quot;display_title&quot;:&quot;Lemma 2.36: The three-dimensional two-smallest-curvature cone is reaction invariant&quot;,&quot;body&quot;:&quot;Let $\\lambda\\ge\\mu\\ge\\nu$ be the eigenvalues of a three-dimensional\ncurvature operator, and put $s=\\mu+\\nu$.  For the Ricci-flow reaction ODE\n\\[\n \\dot\\lambda=\\lambda^2+\\mu\\nu,\\qquad\n \\dot\\mu=\\mu^2+\\lambda\\nu,\\qquad\n \\dot\\nu=\\nu^2+\\lambda\\mu,\n\\]\nthe closed cone $\\{s\\ge0\\}$ is invariant.  More precisely, on its boundary\n $s=0$ one has $\\dot s=\\mu^2+\\nu^2\\ge0$.  The function $s$ is a concave,\nparallel-invariant function of the curvature operator, so its superlevel set\nhas the tangent-cone property required by\n\\ref{thm:strong-curvature-tensor-maximum-principle}.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Local Curvature and Neck Estimates&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:78,&quot;ref&quot;:&quot;MT:ch4:4.17,MT:ch4:4.18&quot;},{&quot;id&quot;:&quot;42e93ee61505&quot;,&quot;label&quot;:&quot;lem:loop-width-surgery-lower-semicontinuity&quot;,&quot;title&quot;:&quot;Loop-family width at a surgery time&quot;,&quot;display_title&quot;:&quot;Lemma 5.51: Loop-family width at a surgery time&quot;,&quot;body&quot;:&quot;At a surgery time $T$,\n\\[\n W_\\xi(T)\\le\\liminf_{t\\uparrow T}W_\\xi(t).\n\\]&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;_3-Width Evolution Through Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:229,&quot;ref&quot;:&quot;MT:ch18:18.22,MT:ch15:15.12&quot;},{&quot;id&quot;:&quot;45ed7d334607&quot;,&quot;label&quot;:&quot;lem:localized-cutoff-time-derivative&quot;,&quot;title&quot;:&quot;Time derivative of the localized cutoff&quot;,&quot;display_title&quot;:&quot;Theorem 4.31: Time derivative of the localized cutoff&quot;,&quot;body&quot;:&quot;There is $D_1$, depending only on $\\Theta,L_0$, and the ambient flow, such\nthat, on $[t&#x27;,t_2]$,\n\\[\n |\\partial_t\\varphi(x,t)|\n \\le D_1\\left(1+\\frac1{r\\sqrt{t-t&#x27;}}\\right).\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Localized Total-Curvature Control&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:169,&quot;ref&quot;:&quot;MT:ch19:19.60&quot;},{&quot;id&quot;:&quot;46001210b234&quot;,&quot;label&quot;:&quot;thm:least-disk-area-variation-interface&quot;,&quot;title&quot;:&quot;Least-disk variation interface&quot;,&quot;display_title&quot;:&quot;Theorem 5.35: Least-disk variation interface&quot;,&quot;body&quot;:&quot;Let $(M,g(t))$, $t_0\\le t\\le t_1$, be a Ricci flow on a compact\nthree-manifold, and let $\\gamma(t)$ be a $C^2$ curve-shrinking flow of\nnull-homotopic immersed loops.  Then $t\\mapsto\\mathcal A_{g(t)}(\\gamma(t))$\nis continuous and, at every time at which the flow is smooth,\n\\[\n D^+\\mathcal A_{g(t)}(\\gamma(t))\n \\le-2\\pi-\\frac12R_{\\min}(t)\n \\mathcal A_{g(t)}(\\gamma(t)).\n\\]&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Controlled Loop-Family Deformation&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:213,&quot;ref&quot;:&quot;MT:ch19:19.2,MT:ch19:19.4&quot;},{&quot;id&quot;:&quot;46b654fc3e42&quot;,&quot;label&quot;:&quot;thm:reduced-exponential-regularity&quot;,&quot;title&quot;:&quot;Regularity of the reduced exponential map&quot;,&quot;display_title&quot;:&quot;Theorem 2.30: Regularity of the reduced exponential map&quot;,&quot;body&quot;:&quot;Assume that minimizing $\\mathcal L$-geodesics to an open set remain in a\nsmooth region on which $|\\operatorname{Ric}|$ and $|\\nabla R|$ are bounded.\nThen $\\mathcal D_x^\\tau$ is open,\n\\[\n \\mathcal L\\exp_x^\\tau\\colon\\mathcal D_x^\\tau\n \\longrightarrow\\Omega_x^\\tau\n\\]\nis a diffeomorphism, and $l_x(\\cdot,\\tau)$ is smooth on\n$\\Omega_x^\\tau$.  The complement of $\\Omega_x^\\tau$ in the selected open\nset has measure zero.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Reduced Geometry&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:72,&quot;ref&quot;:&quot;MT:ch6:6.18,MT:ch6:6.28,MT:ch6:6.56,MT:ch6:6.67&quot;},{&quot;id&quot;:&quot;47d5774c640e&quot;,&quot;label&quot;:&quot;def:strong-canonical-neighborhood-control&quot;,&quot;title&quot;:&quot;Strong canonical-neighborhood control&quot;,&quot;display_title&quot;:&quot;Definition 2.16: Strong canonical-neighborhood control&quot;,&quot;body&quot;:&quot;Fix $C&lt;\\infty$, $0&lt;\\epsilon&lt;1/2$, and $r&gt;0$.  A three-dimensional Ricci\nflow with surgery satisfies the \\emph{strong\n$(C,\\epsilon)$-canonical-neighborhood assumption with parameter $r$} if\nevery point $x$ with $R(x)\\ge r^{-2}$ has one of the following\nneighborhoods at the curvature scale $R(x)^{-1/2}$:\n\\begin{enumerate}\n\\item a strong $\\epsilon$-neck centered at $x$, whose parabolic rescaling by\n      $R(x)$ is $\\epsilon$-close in\n      $C^{\\lfloor\\epsilon^{-1}\\rfloor}$ to the shrinking round cylinder on\n      normalized times $(-1,0]$;\n\\item a $(C,\\epsilon)$-cap whose core contains $x$, with $C$-comparable\n      scalar curvatures and scale-normalized diameter and volume bounded by\n      $C$, together with a uniform core volume lower bound and the\n      scale-invariant derivative bounds for $R$;\n\\item a compact positively curved $C$-component containing $x$, with\n      underlying manifold diffeomorphic to $S^3$ or $\\mathbb{RP}^3$,\n      least sectional curvature greater than $C^{-1}\\sup_M R$, and\n      \\[\n       C^{-1}(\\inf_M R)^{-1/2}&lt;\\operatorname{diam}(M)\n       &lt;C(\\sup_M R)^{-1/2};\n      \\]\n\\item an $\\epsilon$-round component containing $x$: a compact connected\n      component $(M,g)$ for which there are $R&gt;0$, a compact\n      constant-curvature-one manifold $(Z,g_0)$, and a diffeomorphism\n      $\\varphi:Z\\to M$ such that $\\varphi^*(Rg)$ is $\\epsilon$-close to $g_0$\n      in the $C^{\\lfloor\\epsilon^{-1}\\rfloor}$ topology.\n\\end{enumerate}\nOnly the first alternative is a spacetime neighborhood.  The other\nalternatives lie in the slice $M_{\\mathbf t(x)}$.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:58,&quot;ref&quot;:&quot;MT:ch9:9.76,MT:ch14:14.18&quot;},{&quot;id&quot;:&quot;49993844fd32&quot;,&quot;label&quot;:&quot;lem:rp2-exclusion-under-ball-surgery&quot;,&quot;title&quot;:&quot;Two-sided projective-plane exclusion survives ball surgery&quot;,&quot;display_title&quot;:&quot;Lemma 3.32: Two-sided projective-plane exclusion survives ball surgery&quot;,&quot;body&quot;:&quot;Let $M^-$ be a closed smooth three-manifold (possibly nonorientable)\ncontaining no embedded $\\mathbb{RP}^2$ with trivial normal bundle.  Obtain\n$M^+$ by finitely many\ndisjoint neck surgeries, each deleting a three-ball side and gluing a smooth\nthree-ball cap along its spherical boundary, and by discarding whole\ncomponents.  Then $M^+$ also contains no embedded $\\mathbb{RP}^2$ with trivial\nnormal bundle.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Surgery Continuation and Finiteness&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:132,&quot;ref&quot;:&quot;MT:ch15:15.8&quot;},{&quot;id&quot;:&quot;4a2c4d0e2044&quot;,&quot;label&quot;:&quot;lem:orientable-sphere-bundle-geometrized&quot;,&quot;title&quot;:&quot;The orientable sphere bundle is geometrized&quot;,&quot;display_title&quot;:&quot;Lemma 6.31: The orientable sphere bundle is geometrized&quot;,&quot;body&quot;:&quot;$E_+=S^2\\times S^1$ is geometrized in the sense of\n\\ref{def:thurston-geometrized}.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Backward Reconstruction from Extinction&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:266,&quot;ref&quot;:&quot;MT:ch15:15.4&quot;},{&quot;id&quot;:&quot;4c44eb3428eb&quot;,&quot;label&quot;:&quot;lem:strongly-parabolic-circle-equation&quot;,&quot;title&quot;:&quot;Strongly parabolic quasilinear equation on a closed circle&quot;,&quot;display_title&quot;:&quot;Lemma 4.13: Strongly parabolic quasilinear equation on a closed circle&quot;,&quot;body&quot;:&quot;Let $E\\to S^1$ be a smooth finite-dimensional vector bundle and let\n$P\\colon\\Gamma(E)\\to\\Gamma(E)$ be a smooth second-order quasilinear operator.\nSuppose that, on a neighbourhood of a section $w$, the linearisation has\nprincipal symbol satisfying\n\\[\n \\langle\\sigma(DP(v))(x,\\xi)z,z\\rangle\n \\ge \\lambda_0|\\xi|^2|z|^2\n \\qquad(\\lambda_0&gt;0)\n\\]\nfor every $v$ in that neighbourhood, $x\\in S^1$, and $\\xi,z$ in the\ncorresponding fibres.  Then the initial-value problem\n\\[\n \\partial_t v=P(v),\\qquad v(0)=w,\n\\]\nhas a unique smooth solution on a positive time interval.  On a compact set\nof initial sections on which the same symbol and coefficient bounds hold, the\ninterval can be chosen uniformly.  Solutions depend continuously on their\ninitial sections in $C^{2,\\alpha}$ on every shorter interval, and a solution\nwhose ellipticity, speed, and $C^2$ bounds stay uniform at a finite endpoint\nextends across that endpoint.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Short-Time Existence&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:151,&quot;ref&quot;:&quot;MT:ch19:19.1&quot;},{&quot;id&quot;:&quot;4c7ae5881218&quot;,&quot;label&quot;:&quot;thm:morgan-tian-corollary-15-4-empty&quot;,&quot;title&quot;:&quot;Orientable specialization of the Corollary 15.4 empty-slice clause&quot;,&quot;display_title&quot;:&quot;Theorem 6.35: Orientable specialization of the Corollary 15.4 empty-slice clause&quot;,&quot;body&quot;:&quot;Let $({\\mathcal M},G)$ be a controlled generalized Ricci flow satisfying\nAssumptions (1)--(7) and carrying the Kleiner--Lott cutoff of\n\\ref{def:ricci-flow-with-cutoff} on $[0,T]$, with connected, closed,\norientable initial slice $M_0=M$.  Suppose\nthat $M_T=\\varnothing$ at a time $T&gt;0$ and that only finitely many singular\ntimes occur in $[0,T]$.  Then\n\\[\n M\\cong P_1\\#\\cdots\\#P_r\\#E_+^{\\# s}\n\\]\nfor finitely many closed constant-positive-curvature $3$-manifolds $P_i$ and\nsome $s\\ge0$ (with $r+s\\ge1$).&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Backward Reconstruction from Extinction&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:270,&quot;ref&quot;:&quot;MT:ch15:15.4&quot;},{&quot;id&quot;:&quot;4db844706cd7&quot;,&quot;label&quot;:&quot;lem:reduced-volume-noncollapsing-transfer&quot;,&quot;title&quot;:&quot;Reduced-volume noncollapsing transfer&quot;,&quot;display_title&quot;:&quot;Lemma 2.51: Reduced-volume noncollapsing transfer&quot;,&quot;body&quot;:&quot;Assume the stage-$i$ noncollapsing bound on earlier controlled slices and all\nstage hypotheses of\n\\ref{prop:stagewise-reduced-exponential-family}.  For each selected terminal\ncentre choose $\\tau_*$, $\\widetilde W$, $l_0$, and $V_i$ from that proposition;\nthese data explicitly provide all five hypotheses of\n\\ref{thm:generalized-flow-noncollapsing-interface}.  There is then\n$\\kappa_{\\mathcal L}&gt;0$, depending only on the stage data, such that every\nterminal parabolic ball of radius\n$\\rho\\in[r_{i+1},\\epsilon]$ and curvature at most $\\rho^{-2}$ satisfies\n\\[\n \\operatorname{Vol}B(x,T,\\rho)\\ge\\kappa_{\\mathcal L}\\rho^3,\n\\]\nfor every selected terminal centre whose component does not have positive\nsectional curvature.  This is deliberately the nonpositive branch; the\npositive-component branch is supplied by the Kleiner--Lott estimate below.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:93,&quot;ref&quot;:&quot;MT:ch16:16.1,MT:ch16:16.4,MT:ch16:16.26,MT:ch6:6.80&quot;},{&quot;id&quot;:&quot;4e02960b5f84&quot;,&quot;label&quot;:&quot;lem:minimal-two-sphere-area-variation&quot;,&quot;title&quot;:&quot;Area variation of a minimal two-sphere&quot;,&quot;display_title&quot;:&quot;Lemma 5.4: Area variation of a minimal two-sphere&quot;,&quot;body&quot;:&quot;Let $g(t)$ be a Ricci flow on a closed three-manifold near $t_0$, and let\n$f\\colon S^2\\to(M,g(t_0))$ be a branched minimal immersion.  If\n$R_{\\min}(t_0)=\\min_M R_{g(t_0)}$, then\n\\[\n \\left.\\frac d{dt}\\right|_{t=t_0}\\operatorname{Area}_{g(t)}(f)\n \\le -4\\pi-\\frac12R_{\\min}(t_0)\\operatorname{Area}_{g(t_0)}(f).\n\\]&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Two-Sphere Width Control&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:182,&quot;ref&quot;:&quot;MT:ch18:18.12&quot;},{&quot;id&quot;:&quot;4e2f98dbbfef&quot;,&quot;label&quot;:&quot;lem:neck-separation-type-locally-constant&quot;,&quot;title&quot;:&quot;Separation type is constant on a connected neck-center set&quot;,&quot;display_title&quot;:&quot;Lemma 1.27: Separation type is constant on a connected neck-center set&quot;,&quot;body&quot;:&quot;For sufficiently small $\\epsilon$, let $X$ be a connected subset of a\nsmooth boundaryless Riemannian three-manifold $M$ such that every point of\n$X$ is the center of an embedded $\\epsilon$-neck.  Then either every central\nneck sphere arising from points of $X$ separates $M$, or none does.  More\nprecisely, if two centers are sufficiently close that their necks meet in\nthe middle nine-tenths, their central spheres are ambiently isotopic and\ntherefore have the same separation predicate; these neighborhoods form an\nopen cover of $X$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:26,&quot;ref&quot;:&quot;MT:app:A.11&quot;},{&quot;id&quot;:&quot;4f6c36011bc6&quot;,&quot;label&quot;:&quot;lem:sphere-bundle-fundamental-group&quot;,&quot;title&quot;:&quot;Fundamental group of a sphere bundle over the circle&quot;,&quot;display_title&quot;:&quot;Lemma 6.40: Fundamental group of a sphere bundle over the circle&quot;,&quot;body&quot;:&quot;Both $E_+$ and $E_-$ have fundamental group isomorphic to $\\mathbb Z$.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Connected Sums and Fundamental Groups&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:275,&quot;ref&quot;:&quot;MT:intro:0.1&quot;},{&quot;id&quot;:&quot;50d00891cd7a&quot;,&quot;label&quot;:&quot;thm:two-dimensional-kappa-solutions-round&quot;,&quot;title&quot;:&quot;Two-dimensional kappa-solutions are round&quot;,&quot;display_title&quot;:&quot;Theorem 3.1: Two-dimensional kappa-solutions are round&quot;,&quot;body&quot;:&quot;Every two-dimensional $\\kappa$-solution in the sense of\n\\ref{def:kappa-solution} is, after a constant parabolic scaling and time\ntranslation, a shrinking compact round surface.  Its orientable double cover\nis the shrinking round two-sphere, so the surface is $S^2$ or\n$\\mathbb{RP}^2$.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solutions and Asymptotic Models&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:101,&quot;ref&quot;:&quot;MT:ch9:9.50&quot;},{&quot;id&quot;:&quot;516f19e15e63&quot;,&quot;label&quot;:&quot;lem:loop-width-regular-continuity&quot;,&quot;title&quot;:&quot;Continuity of loop-family width at regular times&quot;,&quot;display_title&quot;:&quot;Lemma 5.50: Continuity of loop-family width at regular times&quot;,&quot;body&quot;:&quot;The function $W_\\xi$ is continuous at every nonsurgery time.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;_3-Width Evolution Through Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:228,&quot;ref&quot;:&quot;MT:ch18:18.21&quot;},{&quot;id&quot;:&quot;52c756bceff7&quot;,&quot;label&quot;:&quot;def:path-of-components&quot;,&quot;title&quot;:&quot;Path and ancestry of components&quot;,&quot;display_title&quot;:&quot;Definition 5.1: Path and ancestry of components&quot;,&quot;body&quot;:&quot;Let $I$ be an interval in the time domain of a controlled Ricci flow with\nsurgery $({\\mathcal M},G)$, with either endpoint allowed to be open, closed,\nfinite, or infinite.  A \\emph{path of components} on $I$ is a connected open\nsubset ${\\mathcal X}\\subset\\mathbf t^{-1}(I)$ such that\n${\\mathcal X}(t)={\\mathcal X}\\cap M_t$ is a connected component of $M_t$ for\nevery $t\\in I$.  On a surgery-free subinterval these components are identified\nby the time vector field.  At a singular time $T\\in I$, the path ends if its\npresurgery component is discarded; otherwise ${\\mathcal X}(T)$ is one chosen\ncontinuing postsurgery component.  For $s\\le t$, a component\n$X_s\\subset M_s$ is an \\emph{ancestor} of $X_t\\subset M_t$, and $X_t$ a\n\\emph{descendant} of $X_s$, when some path of components on $[s,t]$ has those\nendpoint slices.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Other results&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:179,&quot;ref&quot;:&quot;MT:ch18:18.1&quot;},{&quot;id&quot;:&quot;5300ba7685e0&quot;,&quot;label&quot;:&quot;def:standard-solution&quot;,&quot;title&quot;:&quot;Standard solution&quot;,&quot;display_title&quot;:&quot;Definition 2.5: Standard solution&quot;,&quot;body&quot;:&quot;The standard solution is the maximal Ricci flow $(\\mathbb R^3,g(t))$ with\n$g(0)=g_0$ and curvature bounded on every compact subinterval of its domain.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:47,&quot;ref&quot;:&quot;KL:II.2:60.2&quot;},{&quot;id&quot;:&quot;5436ad477cbd&quot;,&quot;label&quot;:&quot;lem:two-sphere-diffeomorphism-classes&quot;,&quot;title&quot;:&quot;The two smooth gluing classes of a two-sphere&quot;,&quot;display_title&quot;:&quot;Lemma 6.4: The two smooth gluing classes of a two-sphere&quot;,&quot;body&quot;:&quot;Every smooth diffeomorphism $\\varphi\\colon S^2\\to S^2$ is smoothly isotopic\nto the identity when it preserves orientation and to the antipodal map when it\nreverses orientation.  Hence gluing the two sphere boundaries of\n$S^2\\times[0,1]$ produces exactly one of $E_+$ and $E_-$.  The resulting\nclosed three-manifold is orientable exactly in the $E_+$ case.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Smooth Connected Sums and Prime Factors&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:239,&quot;ref&quot;:&quot;MT:ch15:15.4&quot;},{&quot;id&quot;:&quot;545f0a9ee81a&quot;,&quot;label&quot;:&quot;lem:finite-interval-harnack-distance-control&quot;,&quot;title&quot;:&quot;Finite-interval Harnack and distance control&quot;,&quot;display_title&quot;:&quot;Lemma 2.40: Finite-interval Harnack and distance control&quot;,&quot;body&quot;:&quot;Let $0&lt;T&lt;\\infty$ and let $(M,g(t))$, $-T&lt;t\\le0$, be a complete\nthree-dimensional Ricci flow with nonnegative curvature and curvature locally\nbounded in time.  If\n\\[\n Q=\\sup_{x\\in M}R_{g(0)}(x)&lt;\\infty,\n\\]\nthen for every $x\\in M$ and $-T&lt;t\\le0$,\n\\[\n R_{g(t)}(x)\\le Q\\frac{T}{T+t},\n\\]\nand for all $x,y\\in M$,\n\\[\n d_{g(t)}(x,y)\\le d_{g(0)}(x,y)+16\\sqrt{\\frac Q3}\\,T.\n\\]\nThe estimates also hold on compact exhaustions when the flow is initially\ngiven only as a pointed geometric limit.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Local Curvature and Neck Estimates&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:82,&quot;ref&quot;:&quot;MT:ch11:11.12&quot;},{&quot;id&quot;:&quot;547f37ae7414&quot;,&quot;label&quot;:&quot;lem:uniform-time-slice-transport&quot;,&quot;title&quot;:&quot;Uniform transport of time-slice maxima&quot;,&quot;display_title&quot;:&quot;Lemma 1.4: Uniform transport of time-slice maxima&quot;,&quot;body&quot;:&quot;Let $X$ be a set with functions $\\tau,F,V\\colon X\\to\\mathbb R$, let\n$Z\\subset X$, and let $m\\colon[a,b]\\to\\mathbb R$.  Suppose that for every\n$t\\in[a,b]$ there is $x\\in Z$ with $\\tau(x)=t$ and $F(x)=m(t)$, and that\n$F(y)\\le m(\\tau(y))$ whenever $\\tau(y)\\in[a,b]$.  Suppose also that there\nare $\\rho&gt;0$ and transports $\\Phi_h(x)$, defined for $x\\in Z$,\n$|h|&lt;\\rho$, and $\\tau(x)+h\\in[a,b]$, such that\n\\[\n \\tau(\\Phi_h(x))=\\tau(x)+h,\n \\qquad\n \\sup_{\\substack{x\\in Z\\\\ \\tau(x)+h\\in[a,b]}}\n |F(\\Phi_h(x))-F(x)|\\longrightarrow0\n \\quad(h\\to0).\n\\]\nAssume moreover that, for every $\\eta&gt;0$, there is $h_0&gt;0$ such that\n\\[\n \\frac{F(x)-F(\\Phi_{-h}(x))}{h}\\le V(x)+\\eta\n\\]\nwhenever $x\\in Z$, $0&lt;h&lt;h_0$, and the backward transport is defined.\nIf $\\psi\\colon[a,b]\\times\\mathbb R\\to\\mathbb R$ is continuous and\n\\[\n V(x)\\le\\psi(\\tau(x),F(x))\\qquad(x\\in Z),\n\\]\nthen $m$ is continuous and $D^+m(t)\\le\\psi(t,m(t))$ for every $t&lt;b$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Forward-Difference Comparison&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:3,&quot;ref&quot;:&quot;MT:ch2:2.23&quot;},{&quot;id&quot;:&quot;55d6f2f40050&quot;,&quot;label&quot;:&quot;lem:ricci-flow-surgery-cap-insertion&quot;,&quot;title&quot;:&quot;Imported interface: pinching-preserving cap insertion&quot;,&quot;display_title&quot;:&quot;Lemma 2.8: Imported interface: pinching-preserving cap insertion&quot;,&quot;body&quot;:&quot;For the fixed $A=10$ and $(B,F,k,g_0)$ above, there are\n$\\delta_0^{\\rm cap}\\in(0,1/2]$ and $\\delta&#x27;(\\delta)\\to0$ such that, whenever\n$t&gt;0$, $0&lt;\\delta&lt;\\delta_0^{\\rm cap}$, and a metric $h_0$ on\n$(-A,\\delta^{-1})\\times S^2$ is $\\delta$-close after scaling by $R(x)$ to the\nunit scalar-curvature cylinder in $C^{\\lfloor1/\\delta\\rfloor+1}$, with a\nspecified base point $x\\in\\{0\\}\\times S^2$, and satisfies the time-$t$\nHamilton--Ivey condition on the whole input metric, it extends over a\nthree-ball to a metric $h$ with the same pinching,\n$h=h_0$ on $[0,\\delta^{-1})\\times S^2$, $R(x)h=g_0$ on\n$(-B,-A)\\times S^2$, constant curvature $k^2$ on the ball, and\n$\\delta&#x27;$-closeness to $e^{2F}g_{\\mathrm{cyl}}$ on the capped end.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:50,&quot;ref&quot;:&quot;KL:II.4:72.24&quot;},{&quot;id&quot;:&quot;561f6019df62&quot;,&quot;label&quot;:&quot;lem:forward-dini-comparison-with-downward-jumps&quot;,&quot;title&quot;:&quot;Forward-Dini comparison with finitely many downward jumps&quot;,&quot;display_title&quot;:&quot;Lemma 1.3: Forward-Dini comparison with finitely many downward jumps&quot;,&quot;body&quot;:&quot;Let\n\\[\n a=\\tau_0&lt;\\tau_1&lt;\\cdots&lt;\\tau_N=b\n\\]\nbe a finite partition.  Suppose that $f\\colon[a,b]\\to\\mathbb R$ is\ncontinuous on every half-open interval $[\\tau_j,\\tau_{j+1})$, has a finite\nleft lower limit at each interior partition time, and satisfies\n\\[\n f(\\tau_j)\\le\\liminf_{s\\uparrow\\tau_j}f(s)\\qquad(1\\le j&lt;N).\n\\]\nLet $\\psi\\in C^1([a,b]\\times\\mathbb R)$ and assume\n\\[\n D^+f(t)\\le\\psi(t,f(t))\n \\qquad(\\tau_j\\le t&lt;\\tau_{j+1})\n\\]\nfor every $j$.  If $G\\in C^1([a,b])$ solves\n$G&#x27;=\\psi(t,G)$ and $f(a)\\le G(a)$, then $f(t)\\le G(t)$ on all of $[a,b]$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Forward-Difference Comparison&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:2,&quot;ref&quot;:&quot;MT:ch2:2.22,MT:ch18:18.9&quot;},{&quot;id&quot;:&quot;564a66dfd8e8&quot;,&quot;label&quot;:&quot;lem:positive-space-form-geometrized&quot;,&quot;title&quot;:&quot;Positive space forms are geometrized&quot;,&quot;display_title&quot;:&quot;Lemma 6.30: Positive space forms are geometrized&quot;,&quot;body&quot;:&quot;Every closed connected orientable three-manifold carrying a metric of constant\npositive sectional curvature is geometrized in the sense of\n\\ref{def:thurston-geometrized}.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Backward Reconstruction from Extinction&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:265,&quot;ref&quot;:&quot;MT:ch15:15.4&quot;},{&quot;id&quot;:&quot;5685aa7f1635&quot;,&quot;label&quot;:&quot;thm:kappa-solution-compactness&quot;,&quot;title&quot;:&quot;Normalized kappa-solution compactness&quot;,&quot;display_title&quot;:&quot;Theorem 3.6: Normalized kappa-solution compactness&quot;,&quot;body&quot;:&quot;Fix $\\kappa&gt;0$.  Let $(M_j,g_j(t),p_j)$ be based three-dimensional\n$\\kappa$-solutions for this common value of $\\kappa$, with\n$R(p_j,0)=1$.  A subsequence converges smoothly on compact spacetime\nsubsets to a based $\\kappa$-solution\n\\[\n (M_\\infty,g_\\infty(t),p_\\infty)\n\\]\nwith $R(p_\\infty,0)=1$.\nIn particular, for every $A&lt;\\infty$ and $m\\ge0$ there is $C(A,m)&lt;\\infty$\nsuch that\n\\[\n \\sup_{B_{g_j(0)}(p_j,A)\\times[-A,0]}\n |\\nabla^m\\operatorname{Rm}_{g_j}|\\le C(A,m).\n\\]&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solutions and Asymptotic Models&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:106,&quot;ref&quot;:&quot;MT:ch9:9.59,MT:ch9:9.60,MT:ch9:9.62,MT:ch9:9.63,MT:ch9:9.64,MT:ch9:9.65,MT:ch9:9.66,MT:ch9:9.67,MT:ch9:9.68,MT:ch9:9.69,MT:ch9:9.70,MT:ch9:9.71&quot;},{&quot;id&quot;:&quot;572cb18da12c&quot;,&quot;label&quot;:&quot;thm:curve-flow-curvature-evolution&quot;,&quot;title&quot;:&quot;Evolution equation for squared curvature&quot;,&quot;display_title&quot;:&quot;Theorem 4.23: Evolution equation for squared curvature&quot;,&quot;body&quot;:&quot;Let $\\widehat{\\operatorname{Rm}}$ be the curvature\ntensor of $\\widehat g$.  At every smooth point of the flow,\n\\begin{align*}\n \\partial_t k^2={}&amp;(k^2)&#x27;&#x27;-2| (\\nabla_SH)^\\perp|^2+2k^4\n -2\\operatorname{Ric}_g(H,H)+4k^2\\operatorname{Ric}_g(S,S)\\\\\n &amp;+2\\widehat{\\operatorname{Rm}}(\\widehat H,S,H,S)\n +2\\operatorname{Ric}_g(S,S)\\operatorname{Ric}_g(H,H)\n -2(\\nabla^g_S\\operatorname{Ric}_g)(S,H).\n\\end{align*}&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Evolution Identities and Global Bounds&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:161,&quot;ref&quot;:&quot;MT:ch19:19.7&quot;},{&quot;id&quot;:&quot;57ad05a8f82d&quot;,&quot;label&quot;:&quot;lem:positive-component-persistence&quot;,&quot;title&quot;:&quot;Positive-curvature components persist along smooth flow lines&quot;,&quot;display_title&quot;:&quot;Lemma 2.49: Positive-curvature components persist along smooth flow lines&quot;,&quot;body&quot;:&quot;Let $X_s$ be a compact connected component of a smooth three-dimensional\nRicci flow with strictly positive sectional curvature at a time $s$.  Until\nthe next surgery or extinction, its forward images remain compact and have\nstrictly positive sectional curvature.  Consequently, if a smooth backward\nflow line joins a point $y\\in X_s$ to a later point $x$, then the component\ncontaining $x$ is a positive-sectional-curvature component.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:91,&quot;ref&quot;:&quot;MT:ch4:4.23,MT:ch16:16.1&quot;},{&quot;id&quot;:&quot;5ae781823571&quot;,&quot;label&quot;:&quot;lem:trivial-free-product-factors&quot;,&quot;title&quot;:&quot;A trivial free product has trivial factors&quot;,&quot;display_title&quot;:&quot;Lemma 6.39: A trivial free product has trivial factors&quot;,&quot;body&quot;:&quot;If a finite free product $G_1*\\cdots*G_n$ is the trivial group, then every\n$G_i$ is trivial.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Connected Sums and Fundamental Groups&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:274,&quot;ref&quot;:&quot;MT:intro:0.1&quot;},{&quot;id&quot;:&quot;5be711b510d7&quot;,&quot;label&quot;:&quot;lem:closed-collar-fiber-saturation&quot;,&quot;title&quot;:&quot;Saturation on a closed product collar&quot;,&quot;display_title&quot;:&quot;Lemma 6.13: Saturation on a closed product collar&quot;,&quot;body&quot;:&quot;Let $E=S^2\\times[a,b]$ be a closed product collar in a smooth\nthree-manifold $Y$, with endpoint fibers $F_a$ and $F_b$.  Let $D\\subset Y$ be\nconnected and open, with compact smooth codimension-zero closure and\n\\(\\partial\\overline D=\\operatorname{Fr}_Y(D)\\) a finite union of displayed\ncross-sectional spheres.  For every connected component $V$ of\n$D\\cap(S^2\\times(a,b))$, there is an open interval $A\\subset(a,b)$ such that\n\\[\n V=S^2\\times A.\n\\]\nMoreover, if $D$ meets an endpoint fiber, it contains that whole fiber; if an\nendpoint fiber meets $\\operatorname{Fr}_Y(D)$, that whole fiber is a frontier\ncomponent.  Thus $D$ crosses each product collar by whole fibers, and can stop\nthere only at a displayed cross-section.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Reversing One Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:248,&quot;ref&quot;:&quot;MT:app:A.20,MT:app:A.21&quot;},{&quot;id&quot;:&quot;5c16aa7c0849&quot;,&quot;label&quot;:&quot;thm:canonical-neck-cap-topology&quot;,&quot;title&quot;:&quot;Topology of a manifold covered by canonical caps and necks&quot;,&quot;display_title&quot;:&quot;Theorem 1.43: Topology of a manifold covered by canonical caps and necks&quot;,&quot;body&quot;:&quot;Let $(M,g)$ be a connected smooth Riemannian three-manifold without boundary.\nFor fixed\n$C&lt;\\infty$ and sufficiently small $\\epsilon&gt;0$, suppose each point of\n$M$ is either the center of an $\\epsilon$-neck or belongs to the core of a\n$(C,\\epsilon)$-cap.  At least one of the following source alternatives\noccurs (their displayed diffeomorphism types are separated by compactness\nand end structure):\n\\begin{enumerate}\n\\item $M$ is diffeomorphic to $S^3$, $\\mathbb{RP}^3$, or\n      $\\mathbb{RP}^3\\#\\mathbb{RP}^3$, and is the union of two caps or a\n      doubly capped $\\epsilon$-tube;\n\\item $M$ is diffeomorphic to $\\mathbb R^3$ or to\n      $\\mathbb{RP}^3\\setminus\\{p\\}$, and is a cap or a capped\n      $\\epsilon$-tube;\n\\item $M$ is diffeomorphic to $S^2\\times\\mathbb R$ and is an\n      $\\epsilon$-tube;\n\\item $M$ is diffeomorphic to an $S^2$-bundle over $S^1$ and is an\n      $\\epsilon$-fibration.\n\\end{enumerate}&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:42,&quot;ref&quot;:&quot;MT:app:A.25&quot;},{&quot;id&quot;:&quot;5d257a96cea2&quot;,&quot;label&quot;:&quot;lem:canonical-neighborhood-stability&quot;,&quot;title&quot;:&quot;Stability of canonical neighborhoods&quot;,&quot;display_title&quot;:&quot;Lemma 3.7: Stability of canonical neighborhoods&quot;,&quot;body&quot;:&quot;Fix $\\epsilon&lt;1/4$ and $C&lt;\\infty$.\n\\begin{enumerate}\n\\item A $(C,\\epsilon)$-cap, controlled component, or round component\n      persists under sufficiently small\n      $C^{\\lfloor\\epsilon^{-1}\\rfloor}$ perturbations of its metric and\n      under a sufficiently small change of center.\n\\item An evolving $\\epsilon$-neck of normalized backward length strictly\n      greater than one persists as a strong $\\epsilon$-neck under\n      sufficiently small smooth perturbations of the flow.\n\\item If $C&#x27;&gt;C$, $\\epsilon&#x27;&gt;\\epsilon$, and the center satisfies $R(x)\\le2$,\n      then there is $\\delta&gt;0$ such that every metric which is $\\delta$-close\n      in $C^{\\lfloor\\epsilon^{-1}\\rfloor}$ to the given\n      $(C,\\epsilon)$-canonical neighborhood contains a\n      $(C&#x27;,\\epsilon&#x27;)$-canonical neighborhood of $x$.\n\\end{enumerate}\nIn particular, strong neck centers form an open spacetime set.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solution Geometry and Stability&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:107,&quot;ref&quot;:&quot;MT:ch9:9.79,MT:ch9:9.80&quot;},{&quot;id&quot;:&quot;5d564488bf3b&quot;,&quot;label&quot;:&quot;def:ricci-flow-with-surgery&quot;,&quot;title&quot;:&quot;Ricci flow with surgery&quot;,&quot;display_title&quot;:&quot;Definition 2.1: Ricci flow with surgery&quot;,&quot;body&quot;:&quot;A \\emph{Ricci flow with surgery} is a pair $(\\mathcal M,G)$ with the\nfollowing structure.  The surgery spacetime $\\mathcal M$ has a continuous\ntime function $\\mathbf t\\colon\\mathcal M\\to I$ which is $C^\\infty$ with\nnonvanishing differential on every ordinary or one-sided smooth chart, a\ntime vector field $\\chi$ which is smooth on those charts and satisfies\n$\\chi(\\mathbf t)=1$, and the ordinary, one-sided, and surgery charts\nwhich distinguish smooth, exposed, and singular points.  Every regular slice\n$M_t=\\mathbf t^{-1}(t)$ is a smooth manifold, and the horizontal bundle is\n$\\mathcal H=\\ker(d\\mathbf t)$.  The tensor $G$ is a smooth metric on\n$\\mathcal H$ and satisfies\n\\[\n \\mathcal L_\\chi G=-2\\operatorname{Ric}_G.\n\\]\nAt an exposed point or an endpoint of $I$, the Lie derivative is one-sided.\nAt each transition time $t=t_k^+=t_{k+1}^-$ there are a backward slice\n$\\mathcal M_t^- = \\Omega_k\\times\\{t\\}$, where $\\Omega_k$ is the open set of\npoints with bounded curvature and smooth terminal limit on the preceding\npiece, and a forward slice $\\mathcal M_t^+=M_{k+1}\\times\\{t\\}$, the initial\nslice of the following piece; at regular times\n$\\mathcal M_t^- = \\mathcal M_t^+=M_t$, while at a terminal singular time only\n$\\mathcal M_t^-$ is defined.  The path metrics on these slices may be\ninfinite between distinct components.  The flow is three-dimensional when\nits slices are three-manifolds.\n\nFor $x$ in a slice side and $s&gt;0$, let\n$B^\\pm(x,t,s)$ denote the open radius-$s$ ball in the path metric of the\nconnected component of $\\mathcal M_t^\\pm$ containing $x$; at a regular time the\ntwo signs agree with the ordinary metric ball.  The metric on the backward\nside is the terminal presurgery metric and the metric on the forward side is\nthe postsurgery initial metric.  Thus a ball or parabolic region with a minus\n(respectively plus) sign is formed only from points on the corresponding side\nof a transition.\n\nAn admissible curve is a continuous curve whose time-$u$ point lies in the\ncorresponding slice and whose restriction to each constituent flow is smooth.\nIt is \\emph{static} when its spatial component is constant in every chart.\nFor $(x,t)\\in\\mathcal M_t^+$, with $t+\\Delta t$ in the time domain and\n$\\Delta t&gt;0$, let\n$P(x,t,s,\\Delta t)$ be the union of maximal static curves starting in\n$B^+(x,t,s)$ and defined through $t+\\Delta t$.  For\n$(x,t)\\in\\mathcal M_t^-$ and $\\Delta t&lt;0$, define\n$P(x,t,s,\\Delta t)$ by maximal static curves ending in $B^-(x,t,s)$ and\ndefined back to $t+\\Delta t$.  No forward development is formed from a\nterminal singular slice, and no backward development is formed outside the\ntime domain.  A set $Y\\subset\\mathcal M_t$ is\n\\emph{unscathed on $[c,d]$} if every point of $Y$ lies on a static curve\nthroughout that interval.  A parabolic region is unscathed when its ball is\nunscathed and the region is its full static development.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:43,&quot;ref&quot;:&quot;MT:ch14:14.8&quot;},{&quot;id&quot;:&quot;5d7655e57ef8&quot;,&quot;label&quot;:&quot;lem:finitely-generated-kurosh-free-factor&quot;,&quot;title&quot;:&quot;Imported finitely generated Kurosh factor contract&quot;,&quot;display_title&quot;:&quot;Lemma 5.18: Imported finitely generated Kurosh factor contract&quot;,&quot;body&quot;:&quot;Let\n$G=G_1*\\cdots*G_m*F_r$, with the $G_i$ finite, and let $H$ be a finitely\ngenerated free factor of $G$.  Then $H$ is a free product of finitely many\nfinite groups and a finitely generated free group.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Late-Component _3 Topology&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:196,&quot;ref&quot;:&quot;MT:ch18:18.19&quot;},{&quot;id&quot;:&quot;5eda97c9d2c0&quot;,&quot;label&quot;:&quot;lem:nullhomotopic-embedded-sphere-separates&quot;,&quot;title&quot;:&quot;A null-homotopic embedded sphere separates&quot;,&quot;display_title&quot;:&quot;Lemma 1.14: A null-homotopic embedded sphere separates&quot;,&quot;body&quot;:&quot;Let $M$ be a connected closed smooth $3$-manifold and let\n$S\\subset M$ be a smoothly embedded two-sphere.  If the inclusion\n$S\\hookrightarrow M$ is null-homotopic, then $M\\setminus S$ is disconnected;\nequivalently, $S$ separates $M$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:13,&quot;ref&quot;:&quot;MT:ch15:15.12&quot;},{&quot;id&quot;:&quot;5f0941d364d0&quot;,&quot;label&quot;:&quot;thm:component-fundamental-group-persistence&quot;,&quot;title&quot;:&quot;Persistence of the fundamental-group class&quot;,&quot;display_title&quot;:&quot;Theorem 5.19: Persistence of the fundamental-group class&quot;,&quot;body&quot;:&quot;Let $[0,T]$ be a bounded interval containing only finitely many surgery times.\nSuppose the fundamental group of every initial component of a controlled\nsurgery flow is a free product of finitely many finite groups and infinite\ncyclic groups.  Then the same is true for every component of every time slice\nup to $T$.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Late-Component _3 Topology&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:197,&quot;ref&quot;:&quot;MT:ch18:18.19,MT:ch15:15.3&quot;},{&quot;id&quot;:&quot;5f4913b5014a&quot;,&quot;label&quot;:&quot;def:sphere-bundles-over-circle&quot;,&quot;title&quot;:&quot;The two sphere bundles over the circle&quot;,&quot;display_title&quot;:&quot;Definition 6.3: The two sphere bundles over the circle&quot;,&quot;body&quot;:&quot;Write\n\\[\n E_+=S^2\\times S^1\n \\qquad\\text{and}\\qquad\n E_-=S^1\\mathbin{\\widetilde\\times}S^2\n\\]\nfor, respectively, the orientable product bundle and the nonorientable\ntwisted smooth $S^2$-bundle over $S^1$.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Smooth Connected Sums and Prime Factors&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:238,&quot;ref&quot;:&quot;MT:ch15:15.3&quot;},{&quot;id&quot;:&quot;5fcc1cb5b7db&quot;,&quot;label&quot;:&quot;thm:finite-interval-surgery-bound&quot;,&quot;title&quot;:&quot;Finite surgery count on bounded intervals&quot;,&quot;display_title&quot;:&quot;Theorem 3.37: Finite surgery count on bounded intervals&quot;,&quot;body&quot;:&quot;Let a controlled Ricci flow with surgery be defined on $[0,T)$ with\n$T\\le T_{i+1}$ and with the control functions fixed on that interval.  Assume\nthe positive nonincreasing cutoff function $\\bar\\delta$ is defined through\n$T_{i+1}$ and that $r(t)\\ge r_{i+1}&gt;0$ there.  Put\n\\[\n \\Phi:=\\Phi_{\\rm HI}^{T_{i+1},g(0)}\n \\quad\\text{from \\ref{lem:finite-horizon-surgery-phi-envelope}},\n \\qquad\n h_*:=H_*(\\Phi,T_{i+1},r_{i+1},\n              \\bar\\delta(T_{i+1}))&gt;0,\n\\]\nwhere $H_*$ is the bounded-stage lower envelope from\n\\ref{lem:ricci-flow-surgery-horn-scale}.  Then every cutting neck in $[0,T)$\nhas $h(t)\\ge h_*$.  There is\n\\[\n N=N\\bigl(\\operatorname{Vol}(M_0,g(0)),T_{i+1},r_{i+1},\n             \\bar\\delta(T_{i+1}),h_*\\bigr)&lt;\\infty\n\\]\nsuch that the flow has at most $N$ surgery times in $[0,T)$.  In particular,\nsurgery times cannot accumulate in a bounded interval.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Surgery Continuation and Finiteness&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:137,&quot;ref&quot;:&quot;MT:ch17:17.12&quot;},{&quot;id&quot;:&quot;5fcd85b09ca5&quot;,&quot;label&quot;:&quot;def:spherical-space-form&quot;,&quot;title&quot;:&quot;Spherical space form&quot;,&quot;display_title&quot;:&quot;Definition 6.2: Spherical space form&quot;,&quot;body&quot;:&quot;A \\emph{spherical space form} is a quotient $S^3/\\Gamma$, where $S^3$ has\nits round metric and $\\Gamma$ is a finite group acting freely by isometries.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Smooth Connected Sums and Prime Factors&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:237,&quot;ref&quot;:&quot;MT:intro:0.1&quot;},{&quot;id&quot;:&quot;606dd3214150&quot;,&quot;label&quot;:&quot;def:ramp-curve&quot;,&quot;title&quot;:&quot;Ramp&quot;,&quot;display_title&quot;:&quot;Definition 4.5: Ramp&quot;,&quot;body&quot;:&quot;For an immersed oriented curve $c\\colon S^1\\to M\\times S^1_\\lambda$ with\nunit tangent $S$, put $u=\\langle S,U\\rangle$.  The curve is a \\emph{ramp} if\n$u(x)&gt;0$ for every $x\\in S^1$.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Product-Circle Geometry and Ramp Setup&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:143,&quot;ref&quot;:&quot;MT:ch19:19.12&quot;},{&quot;id&quot;:&quot;606f02fa7ec9&quot;,&quot;label&quot;:&quot;thm:local-volume-injectivity-radius-control&quot;,&quot;title&quot;:&quot;Local volume and injectivity-radius control&quot;,&quot;display_title&quot;:&quot;Theorem 2.21: Local volume and injectivity-radius control&quot;,&quot;body&quot;:&quot;Fix $n$, $K&lt;\\infty$, $r_0&gt;0$, and $v_0&gt;0$.  There are positive constants\n\\[\n v_*=v_*(n,K,r_0,v_0),\n \\qquad \\iota_*=\\iota_*(n,K,r_0,v_0),\n\\]\nwith the following property.  If $(M^n,g)$ is complete,\n$|\\operatorname{Rm}|\\le K$ on $B(p,r_0)$, and\n$\\operatorname{Vol}B(p,r_0)\\ge v_0$, then, for\n$0&lt;s\\le\\min\\{r_0,K^{-1/2}\\}$,\n\\[\n \\operatorname{Vol}B(p,s)\\ge v_*s^n,\n \\qquad\n \\operatorname{inj}_g(p)\\ge\n \\iota_*\\min\\{r_0,K^{-1/2}\\}.\n\\]\nThe convention is that $K^{-1/2}=\\infty$ when $K=0$.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:63,&quot;ref&quot;:&quot;MT:ch1:1.35,MT:ch1:1.36,MT:ch5:5.10&quot;},{&quot;id&quot;:&quot;61db94ef73bd&quot;,&quot;label&quot;:&quot;lem:canonical-neighborhood-first-failure&quot;,&quot;title&quot;:&quot;First canonical-neighborhood failure&quot;,&quot;display_title&quot;:&quot;Lemma 3.19: First canoni
