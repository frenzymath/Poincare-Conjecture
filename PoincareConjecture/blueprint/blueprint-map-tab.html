,&quot;display_title&quot;:&quot;Theorem 4.6: Ramp preservation&quot;,&quot;body&quot;:&quot;Suppose $c$ is a curve-shrinking flow on $[t_0,T)$ in the ramp product and\n$c(\\cdot,t_0)$ is a ramp.  If $C&#x27;$ bounds $|\\operatorname{Ric}|$, then\n\\[\n \\min_{S^1}u(\\cdot,t)\\ge\n e^{-C&#x27;(t-t_0)}\\min_{S^1}u(\\cdot,t_0)&gt;0\n \\qquad(t_0\\le t&lt;T).\n\\]\nIn particular every $c(\\cdot,t)$ is a ramp.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Product-Circle Geometry and Ramp Setup&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:100,&quot;ref&quot;:&quot;MT:ch19:19.13&quot;},{&quot;id&quot;:&quot;9977c10908db&quot;,&quot;label&quot;:&quot;def:graph-flow-connection-drift&quot;,&quot;title&quot;:&quot;Graph-flow connection drift&quot;,&quot;display_title&quot;:&quot;Definition 4.9: Graph-flow connection drift&quot;,&quot;body&quot;:&quot;Define\n\\[\n \\psi(Z)=\\frac{\\langle\\Gamma(Z,Z),\\partial_z\\rangle_{h&#x27;}}{|Z|^2}.\n\\]\nThe metric and slope comparisons imply $|\\psi(Z)|&lt;1.5\\delta$.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Graph-Flow Coordinate Estimates&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:103,&quot;ref&quot;:&quot;MT:ch19:19.65&quot;},{&quot;id&quot;:&quot;9b1d8806cf9e&quot;,&quot;label&quot;:&quot;lem:short-loop-families-trivial&quot;,&quot;title&quot;:&quot;Short loop families are trivial&quot;,&quot;display_title&quot;:&quot;Lemma 5.34: Short loop families are trivial&quot;,&quot;body&quot;:&quot;Let $(X,g)$ be compact with $\\pi_2(X)=0$.  There is $\\zeta&gt;0$ such that any\ncontinuous family $\\Gamma\\colon S^2\\to\\Lambda_0X$ all of whose loops have\nlength less than $\\zeta$ represents the zero free-homotopy orbit, and hence\nthe zero class after any based choice, under\n$\\pi_2(\\Lambda_0X,*)\\cong\\pi_3(X)$.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;_3-Width Evolution Through Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:163,&quot;ref&quot;:&quot;MT:ch18:18.27&quot;},{&quot;id&quot;:&quot;9c9d12b27929&quot;,&quot;label&quot;:&quot;lem:smoothed-polygonal-ramp-bounds&quot;,&quot;title&quot;:&quot;Length and total curvature of smoothed polygonal ramps&quot;,&quot;display_title&quot;:&quot;Theorem 4.18: Length and total curvature of smoothed polygonal ramps&quot;,&quot;body&quot;:&quot;For each $q$, obtain $\\widetilde\\Gamma(q)$ from the $n$-polygonal loop\n$\\Gamma_n(q)$ by the standard smoothing with a fixed, nonnegative, symmetric\nreparameterization bump.  For\n$0&lt;\\lambda&lt;1$, define the ramp\n$\\widetilde\\Gamma(q)^\\lambda(x)=(\\widetilde\\Gamma(q)(x),x)$ in\n $M\\times S^1_\\lambda$.  Then\n\\[\n L(\\widetilde\\Gamma(q)^\\lambda)\n \\le L(\\Gamma(q))+\\lambda,\n \\qquad\n \\int_{\\widetilde\\Gamma(q)^\\lambda}k\\,ds\\le n\\pi .\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Polygonal Ramp Approximation&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:112,&quot;ref&quot;:&quot;MT:ch19:19.22&quot;},{&quot;id&quot;:&quot;9dff0d1643ad&quot;,&quot;label&quot;:&quot;lem:annular-area-infimum-variation&quot;,&quot;title&quot;:&quot;Variation of the annular area infimum&quot;,&quot;display_title&quot;:&quot;Lemma 5.27: Variation of the annular area infimum&quot;,&quot;body&quot;:&quot;Let $n=\\dim M\\ge3$, and let $c_0(t),c_1(t)$ be degree-one ramp\ncurve-shrinking flows in $(M,g(t))\\times S^1_\\lambda$ in the same free\nhomotopy class.  Assume that, for each time under consideration, the annular\ninfimum is attained by a minimizer satisfying the hypotheses of\n\\ref{thm:annular-douglas-minimizer}.  If $\\mu(t)$ is the infimum of the areas\nof spanning annuli,\nthen $\\mu$ is continuous and\n\\[\n D^+\\mu(t)\\le(2n-1)\\max_M|\\operatorname{Rm}_{g(t)}|\\,\\mu(t).\n\\]\nConsequently $\\mu(t)\\le e^{C(t-s)}\\mu(s)$ on a compact time interval, with\n$C$ independent of $\\lambda$.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Controlled Loop-Family Deformation&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:156,&quot;ref&quot;:&quot;MT:ch19:19.15&quot;},{&quot;id&quot;:&quot;a0d6ae4e1672&quot;,&quot;label&quot;:&quot;def:surgery-flow-noncollapsing&quot;,&quot;title&quot;:&quot;Noncollapsing for a surgery flow&quot;,&quot;display_title&quot;:&quot;Definition 2.2: Noncollapsing for a surgery flow&quot;,&quot;body&quot;:&quot;Let $(\\mathcal M,G)$ be a three-dimensional Ricci flow with surgery.  The\nbackward parabolic neighborhood $P(x,t,\\rho,-\\rho^2)$ exists when every\npoint of $B_{g(t)}(x,\\rho)$ has a backward $\\chi$-flow line of length\n$\\rho^2$, and these flow lines give a product embedding of the ball over\n$[t-\\rho^2,t]$.  For $\\kappa,r_0&gt;0$, the flow is\n\\emph{$\\kappa$-noncollapsed on scales at most $r_0$} if\n\\[\n P(x,t,\\rho,-\\rho^2)\\text{ exists},\\qquad\n |\\operatorname{Rm}|\\le \\rho^{-2}\\text{ on }P\n \\quad\\Longrightarrow\\quad\n \\operatorname{Vol}_{g(t)}B(x,t,\\rho)\\ge\\kappa\\rho^3\n\\]\nwhenever $0&lt;\\rho\\le r_0$.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:32,&quot;ref&quot;:&quot;MT:ch14:14.14,MT:ch14:14.15&quot;},{&quot;id&quot;:&quot;a0f8035a1904&quot;,&quot;label&quot;:&quot;lem:infinite-neck-chain-frontier&quot;,&quot;title&quot;:&quot;An infinite neck-chain end has no frontier&quot;,&quot;display_title&quot;:&quot;Lemma 1.24: An infinite neck-chain end has no frontier&quot;,&quot;body&quot;:&quot;Let $N_0,N_1,\\ldots$ be a chain of sufficiently small\n$\\epsilon$-necks in $M$, and put $U=\\bigcup_{j\\ge0}N_j$.  Then the\nfrontier of $U$ in $M$ is exactly the frontier of the negative end of\n$N_0$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:23,&quot;ref&quot;:&quot;MT:app:A.15&quot;},{&quot;id&quot;:&quot;a26bc71fd1e8&quot;,&quot;label&quot;:&quot;lem:space-time-metric-connection&quot;,&quot;title&quot;:&quot;Space-time metric connection identities&quot;,&quot;display_title&quot;:&quot;Lemma 4.2: Space-time metric connection identities&quot;,&quot;body&quot;:&quot;Equip $M\\times I$ with the metric $\\widehat g=g(t)+dt^2$, and denote its\nLevi--Civita connection by $\\nabla$.  If $A,B$ are horizontal vector fields,\nthen\n\\[\n \\nabla_A B=\\nabla_A^gB+\\operatorname{Ric}_g(A,B)\\partial_t,\n \\qquad\n \\langle\\nabla_A\\partial_t,B\\rangle\n       =-\\operatorname{Ric}_g(A,B),\n\\]\nand $\\nabla_A\\partial_t$ is horizontal.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Curve-Flow Geometry&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:96,&quot;ref&quot;:&quot;MT:ch19:19.7&quot;},{&quot;id&quot;:&quot;a26f5c19302d&quot;,&quot;label&quot;:&quot;thm:short-time-curve-curvature-barrier&quot;,&quot;title&quot;:&quot;Short-time pointwise curvature barrier&quot;,&quot;display_title&quot;:&quot;Theorem 4.33: Short-time pointwise curvature barrier&quot;,&quot;body&quot;:&quot;Given bounds $\\Theta,L_0$ and the fixed ambient Ricci flow, there are\n$\\delta&gt;0$ and $0&lt;r_0\\le1$ such that the localized hypotheses stated above\nimply\n\\[\n k(x,t)^2\\le\\frac2{t-t&#x27;}\n \\qquad(x\\in S^1,\\ t&#x27;&lt;t\\le t&#x27;+\\delta r^2).\n\\]\nThe constants may depend on both $\\Theta$ and $L_0$.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Short-Time Curvature Barrier&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:127,&quot;ref&quot;:&quot;MT:ch19:19.58&quot;},{&quot;id&quot;:&quot;a4d91a09effa&quot;,&quot;label&quot;:&quot;thm:parametric-curve-shrinking-wellposedness&quot;,&quot;title&quot;:&quot;Short-time well-posedness for immersed curve shrinking&quot;,&quot;display_title&quot;:&quot;Theorem 4.12: Short-time well-posedness for immersed curve shrinking&quot;,&quot;body&quot;:&quot;Let $0&lt;\\alpha&lt;1$ and let $g(t)$ be a smooth Ricci flow on a compact\nmanifold for $t\\in[t_0,t_1]$.  For one immersed $C^{2,\\alpha}$ loop\n$c_0$, there is a nontrivial interval $[t_0,T)$ and an immersed geometric\ncurve-shrinking flow $c$ on that interval.  Smooth initial data give smooth\nsolutions.  If a finite endpoint has uniformly bounded curvature and the\nimmersion remains nondegenerate there, then the flow continues across that\nendpoint.  This statement makes no compact-parameter, uniqueness, or\nuniform-family assertion.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Short-Time Existence&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:106,&quot;ref&quot;:&quot;MT:ch19:19.1&quot;},{&quot;id&quot;:&quot;a6fce8d4dc10&quot;,&quot;label&quot;:&quot;prop:positive-curvature-neck-scale-lower-bound&quot;,&quot;title&quot;:&quot;Positive curvature excludes arbitrarily small necks&quot;,&quot;display_title&quot;:&quot;Proposition 3.11: Positive curvature excludes arbitrarily small necks&quot;,&quot;body&quot;:&quot;For every sufficiently small $\\epsilon&gt;0$, a complete positively curved\nRiemannian three-manifold contains no sequence of $\\epsilon$-necks whose\nscales tend to zero.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solution Geometry and Stability&quot;,&quot;kind&quot;:&quot;proposition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:73,&quot;ref&quot;:&quot;MT:ch2:2.20&quot;},{&quot;id&quot;:&quot;a7c743202d6a&quot;,&quot;label&quot;:&quot;def:balanced-neck-chain&quot;,&quot;title&quot;:&quot;Balanced chain of epsilon-necks&quot;,&quot;display_title&quot;:&quot;Definition 1.20: Balanced chain of epsilon-necks&quot;,&quot;body&quot;:&quot;A finite \\emph{chain of $\\epsilon$-necks} is a sequence\n$N_a,\\ldots,N_b$ with oriented axial coordinates such that\n$N_i\\cap N_{i+1}$ contains both\n\\[\n \\{s_{N_i}&gt;\\tfrac12\\epsilon^{-1}\\}\n \\quad\\hbox{and}\\quad\n \\{s_{N_{i+1}}&lt;-\\tfrac12\\epsilon^{-1}\\},\n\\]\nis contained in\n\\[\n \\{s_{N_i}&gt;-\\tfrac12\\epsilon^{-1}\\}\n \\cap\n \\{s_{N_{i+1}}&lt;\\tfrac12\\epsilon^{-1}\\},\n\\]\nand $N_i\\cap E_{N_a}^-=\\varnothing$ for $i&gt;a$.  An infinite chain indexed\nby an interval in $\\mathbb Z$ is one whose restriction to every finite\nsubinterval is a chain.  The chain is \\emph{balanced} if consecutive\ncenters $x_j,x_{j+1}$ satisfy\n\\[\n 0.99\\,r_{N_j}\\epsilon^{-1}\n \\le d(x_j,x_{j+1})\n \\le1.01\\,r_{N_j}\\epsilon^{-1}.\n\\]&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:19,&quot;ref&quot;:&quot;MT:app:A.12,MT:app:A.17&quot;},{&quot;id&quot;:&quot;a8a4aa399c74&quot;,&quot;label&quot;:&quot;thm:noncompact-two-connected-cover-contractible&quot;,&quot;title&quot;:&quot;Noncompact two-connected covers are contractible&quot;,&quot;display_title&quot;:&quot;Theorem 5.11: Noncompact two-connected covers are contractible&quot;,&quot;body&quot;:&quot;Let $X$ be a connected three-manifold with $\\pi_2(X)=0$.  If its universal\ncover $\\widetilde X$ is noncompact, then $\\widetilde X$ is contractible.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Eventual Vanishing of _2&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:140,&quot;ref&quot;:&quot;MT:ch18:18.9,Hatcher:ch3:3.29,Hatcher:ch4:4.5,Hatcher:ch4:4.32&quot;},{&quot;id&quot;:&quot;ab31435babe2&quot;,&quot;label&quot;:&quot;thm:noncompact-kappa-solution-structure&quot;,&quot;title&quot;:&quot;Structure of noncompact kappa-solutions&quot;,&quot;display_title&quot;:&quot;Theorem 3.13: Structure of noncompact kappa-solutions&quot;,&quot;body&quot;:&quot;For every sufficiently small $\\epsilon&gt;0$ there is\n$C_0=C_0(\\epsilon)&lt;\\infty$ such that the time-zero slice of every\nnoncompact three-dimensional $\\kappa$-solution containing no embedded\ntwo-sided $\\mathbb{RP}^2$ is either a strong $\\epsilon$-tube or a\n$(C_0,\\epsilon)$-cap followed by a strong $\\epsilon$-tube.  The cap core has\nuniform scale-normalized curvature, derivative, diameter, and volume bounds.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solution Geometry and Stability&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:75,&quot;ref&quot;:&quot;MT:ch9:9.84,MT:ch9:9.85,MT:ch9:9.87,MT:ch9:9.88&quot;},{&quot;id&quot;:&quot;abf8af0e33e6&quot;,&quot;label&quot;:&quot;lem:external-point-neck-distance-comparison&quot;,&quot;title&quot;:&quot;Distance comparison from outside a thin neck&quot;,&quot;display_title&quot;:&quot;Lemma 2.22: Distance comparison from outside a thin neck&quot;,&quot;body&quot;:&quot;For every $0&lt;\\alpha&lt;1$ there is $\\epsilon_2(\\alpha)&gt;0$ such that the\nfollowing holds.  Let $N$ be a separating $\\epsilon$-neck,\n$\\epsilon\\le\\epsilon_2$, let $z$ lie outside its middle two-thirds on the\nnegative side.  Assume every minimizing geodesic from $z$ to a point of the\npositive half of $N$ enters $N$ through the negative end and remains in $N$\nuntil that endpoint.  Let $p$ lie in its middle half, and let $q$ lie anywhere\nlater on the same axial product line in $N$, with $s(q)&gt;s(p)$.  Then\n\\[\n (1-\\alpha)r_N(s(q)-s(p))\n \\le d(z,q)-d(z,p)\n \\le(1+\\alpha)r_N(s(q)-s(p)).\n\\]&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Local Curvature and Neck Estimates&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:52,&quot;ref&quot;:&quot;MT:ch19:19.9&quot;},{&quot;id&quot;:&quot;ad5c0172b26d&quot;,&quot;label&quot;:&quot;thm:prime-decomposition-interface&quot;,&quot;title&quot;:&quot;Prime decomposition in the smooth category&quot;,&quot;display_title&quot;:&quot;Theorem 6.4: Prime decomposition in the smooth category&quot;,&quot;body&quot;:&quot;Assume Hatcher&#x27;s Basic 3-Manifold Topology prime-decomposition theorem,\nincluding the stated nonorientable normalization convention.\nEvery closed connected smooth $3$-manifold is a finite connected sum of prime\nsmooth $3$-manifolds.  For an orientable manifold the prime factors are unique,\nup to order and insertion or deletion of $S^3$ factors.  In the nonorientable\ncase, existence still holds, the two prime nonirreducible factors are $E_+$ and\n$E_-$, and uniqueness is restored by replacing every $E_+$ factor by $E_-$\nwhenever the remaining connected sum is nonorientable.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Smooth Connected Sums and Prime Factors&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:170,&quot;ref&quot;:&quot;Hatcher3M:ch1:1.5&quot;},{&quot;id&quot;:&quot;af24539c6503&quot;,&quot;label&quot;:&quot;lem:nonflat-terminal-cone-exclusion&quot;,&quot;title&quot;:&quot;Nonflat terminal cones are excluded&quot;,&quot;display_title&quot;:&quot;Lemma 2.26: Nonflat terminal cones are excluded&quot;,&quot;body&quot;:&quot;Let a three-dimensional Ricci flow have nonnegative sectional curvature on a\nconnected spacetime neighborhood.  If at a positive time a nonempty open\nsubset of a slice is isometric to an open subset of a metric cone, then that\nspacetime neighborhood is flat.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:56,&quot;ref&quot;:&quot;MT:ch4:4.22&quot;},{&quot;id&quot;:&quot;b064cd2364ba&quot;,&quot;label&quot;:&quot;prop:compact-reduced-minimizing-domain&quot;,&quot;title&quot;:&quot;Compact smooth domain for reduced minimizers&quot;,&quot;display_title&quot;:&quot;Proposition 2.28: Compact smooth domain for reduced minimizers&quot;,&quot;body&quot;:&quot;Under the hypotheses of \\ref{lem:short-reduced-paths-avoid-surgery-caps},\nthere is an open subset $U$ of the smooth spacetime over\n$[T_{i-1},T)$ such that:\n\\begin{enumerate}\n\\item every point of $U$ is joined to $x$ by a minimizing smooth\n      $\\mathcal L$-geodesic;\n\\item every slice $U_t$ is nonempty and\n      $\\min_{U_t}\\mathcal L\\le3\\sqrt{T-t}$;\n\\item over every compact time interval, the slice minimizers form a compact\n      subset of the smooth spacetime.\n\\end{enumerate}&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;kind&quot;:&quot;proposition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:58,&quot;ref&quot;:&quot;MT:ch16:16.4,MT:ch16:16.21,MT:ch16:16.24,MT:ch16:16.25&quot;},{&quot;id&quot;:&quot;b0ef6688e9c2&quot;,&quot;label&quot;:&quot;lem:standard-cap-radial-collapse-nonexpanding&quot;,&quot;title&quot;:&quot;Nonexpansion of the standard radial collapse&quot;,&quot;display_title&quot;:&quot;Lemma 1.11: Nonexpansion of the standard radial collapse&quot;,&quot;body&quot;:&quot;In the data of \\ref{def:local-neck-surgery-data}, define\n$\\xi\\colon N\\to\\mathbb R^3$ by preserving the angular coordinate,\nsending $s&lt;A_0+4$ to the point at $g_0$-distance $A_0+4-s$ from $p_0$,\nand collapsing $s\\ge A_0+4$ to $p_0$.  For all sufficiently small\n$\\delta$,\n\\[\n \\xi\\colon(N,Qg)\\longrightarrow(\\mathbb R^3,\\eta g_0)\n\\]\nis distance nonincreasing.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:10,&quot;ref&quot;:&quot;MT:ch12:12.37,MT:ch13:13.1&quot;},{&quot;id&quot;:&quot;b5fb8dfb64e4&quot;,&quot;label&quot;:&quot;thm:local-neck-surgery&quot;,&quot;title&quot;:&quot;Local surgery on a delta-neck&quot;,&quot;display_title&quot;:&quot;Theorem 1.17: Local surgery on a delta-neck&quot;,&quot;body&quot;:&quot;There are universal constants $C_0,q,R_0&lt;\\infty$ and $\\delta_0&#x27;&gt;0$ such\nthat, whenever $Q=R_g(x_0)\\ge R_0$ and\n$0&lt;\\delta\\le\\delta_0&#x27;$, the metric $\\widetilde g$ of\n\\ref{def:interpolating-surgery-metric} has the following properties.\n\\begin{enumerate}\n\\item Every curvature-pinching inequality in\n      \\ref{lem:retained-neck-surgery-pinching} that holds on the original\n      neck holds everywhere on $\\mathcal S$.\n\\item The sectional curvature is positive on\n      $1\\le s\\le A_0+4$.\n\\item The radial collapse map\n      $\\xi\\colon(N,g)\\to(\\mathcal S,\\widetilde g)$ is distance\n      nonincreasing.\n\\item The normalized pointed cap converges smoothly on bounded balls,\n      \\[\n        (\\mathcal S,\\widehat g,p_0)\\longrightarrow\n        (\\mathbb R^3,g_0,p_0),\n      \\]\n      as $\\delta\\to0$, in the quantitative sense of\n      \\ref{lem:local-surgery-standard-cap-convergence}.\n\\end{enumerate}&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:16,&quot;ref&quot;:&quot;MT:ch13:13.2&quot;},{&quot;id&quot;:&quot;b68b762d3d15&quot;,&quot;label&quot;:&quot;def:canonical-cap&quot;,&quot;title&quot;:&quot;Canonical cap&quot;,&quot;display_title&quot;:&quot;Definition 1.18: Canonical cap&quot;,&quot;body&quot;:&quot;For $C&lt;\\infty$, a \\emph{$(C,\\epsilon)$-cap} is an open submanifold\n$\\mathcal C$ of a Riemannian three-manifold with an open\n$\\epsilon$-neck $N\\subset\\mathcal C$ such that:\n\\begin{enumerate}\n\\item $\\mathcal C$ is diffeomorphic to an open three-ball or to\n      $\\mathbb{RP}^3$ minus a point;\n\\item $\\overline Y=\\mathcal C\\setminus N$ is a compact submanifold with\n      boundary, its interior $Y$ is the \\emph{core}, and\n      $\\partial\\overline Y$ is a central sphere of an $\\epsilon$-neck;\n\\item $R&gt;0$ on $\\mathcal C$,\n      $\\sup_{x,y\\in\\mathcal C}R(y)/R(x)&lt;C$, and\n      $\\operatorname{diam}(\\mathcal C)\n       &lt;C(\\sup_{\\mathcal C}R)^{-1/2}$.\n\\end{enumerate}&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:17,&quot;ref&quot;:&quot;MT:ch9:9.72&quot;},{&quot;id&quot;:&quot;b83aa6787faa&quot;,&quot;label&quot;:&quot;lem:standard-cap-encounter-control&quot;,&quot;title&quot;:&quot;A bounded-curvature cap encounter is standard&quot;,&quot;display_title&quot;:&quot;Lemma 3.19: A bounded-curvature cap encounter is standard&quot;,&quot;body&quot;:&quot;Consider rescaled first-failure flows and a backward flow line, starting in\na fixed-radius zero-time ball, which reaches a surgery cap after rescaled\ntime $s_a\\le s&#x27;&lt;\\infty$.  If scalar curvature along the line is bounded by\n$D&#x27;&lt;\\infty$ and $\\bar h_a$ is the rescaled surgery scale, then for all large\n$a$ there are constants $c=c(D&#x27;,s&#x27;)&gt;0$, $A&lt;\\infty$, and $\\theta&lt;1$ such that\n\\[\n \\bar h_a^2\\ge c,\n \\qquad s_a&lt;\\theta\\bar h_a^2,\n\\]\nand the point where the line reaches the surgery slice lies in the image of\nthe standard-solution ball $B(p_0,A)$ used to model the cap.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;First-Failure Extension&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:81,&quot;ref&quot;:&quot;MT:ch17:17.4,MT:ch17:17.5,MT:ch17:17.8&quot;},{&quot;id&quot;:&quot;b945feb50d33&quot;,&quot;label&quot;:&quot;lem:standard-cap-surgery-curvature&quot;,&quot;title&quot;:&quot;Curvature and pinching on the standard-cap side&quot;,&quot;display_title&quot;:&quot;Lemma 1.15: Curvature and pinching on the standard-cap side&quot;,&quot;body&quot;:&quot;For the same universal choices and all sufficiently small $\\delta$, the\nmetric $\\widetilde g$ has positive sectional curvature on\n$4\\le s\\le A_0+4$.  It satisfies the two curvature-pinching inequalities\nin \\ref{lem:retained-neck-surgery-pinching} there.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:14,&quot;ref&quot;:&quot;MT:ch13:13.2&quot;},{&quot;id&quot;:&quot;b98f0aa4fc27&quot;,&quot;label&quot;:&quot;lem:graph-slope-persistence&quot;,&quot;title&quot;:&quot;Full-interval graph-slope persistence&quot;,&quot;display_title&quot;:&quot;Theorem 4.31: Full-interval graph-slope persistence&quot;,&quot;body&quot;:&quot;For sufficiently small $\\delta$, the maximal graph time equals the\nprovisional curvature time, $t_3=t_2$, and\n\\[\n |f_z(z,t)|_{h&#x27;}&lt;\\frac1{10}\n \\qquad((z,t)\\in I&#x27;\\times[t&#x27;,t_2]).\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Short-Time Curvature Barrier&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:125,&quot;ref&quot;:&quot;MT:ch19:19.58&quot;},{&quot;id&quot;:&quot;b99a6419604a&quot;,&quot;label&quot;:&quot;lem:curve-flow-length-total-curvature-evolution&quot;,&quot;title&quot;:&quot;Integral evolution inequalities&quot;,&quot;display_title&quot;:&quot;Theorem 4.22: Integral evolution inequalities&quot;,&quot;body&quot;:&quot;Let\n$L(t)=\\int_{c_t}ds$ and $\\Theta(t)=\\int_{c_t}k\\,ds$, and let $C_2$ bound\n$|\\operatorname{Ric}_g|$ on $M\\times I$.  The function $L$ is smooth and\n$\\Theta$ is locally absolutely continuous.  For almost every time,\n\\[\n L&#x27;(t)\\le\\int_{c_t}(C_2-k^2)\\,ds\\le C_2L(t),\n \\qquad\n \\Theta&#x27;(t)\\le(C_1+C_2)\\Theta(t)+C_1L(t).\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Evolution Identities and Global Bounds&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:116,&quot;ref&quot;:&quot;MT:ch19:19.9&quot;},{&quot;id&quot;:&quot;b9cb0afd564e&quot;,&quot;label&quot;:&quot;lem:first-failure-noncollapsing-bridge&quot;,&quot;title&quot;:&quot;First-failure noncollapsing bridge&quot;,&quot;display_title&quot;:&quot;Lemma 3.23: First-failure noncollapsing bridge&quot;,&quot;body&quot;:&quot;Consider a rescaled first-failure sequence with unit scalar curvature at the\nbasepoints and with surgery controls tending to zero.  After passing to a\nsubsequence, one of the following holds:\n\\begin{enumerate}\n\\item the basepoints eventually have strong\n      $(C,\\epsilon)$-canonical neighborhoods;\n\\item there is $\\kappa_*&gt;0$ such that, on every fixed zero-time based ball,\n      every sufficiently advanced flow satisfies the ordinary\n      $\\kappa_*$-noncollapsing volume estimate on each fixed scale on which\n      the required backward parabolic neighborhood exists.\n\\end{enumerate}&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;First-Failure Extension&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:85,&quot;ref&quot;:&quot;MT:ch16:16.1,MT:ch17:17.1&quot;},{&quot;id&quot;:&quot;bcc086f18ab4&quot;,&quot;label&quot;:&quot;lem:curve-flow-speed-and-tangent-evolution&quot;,&quot;title&quot;:&quot;Speed and tangent evolution&quot;,&quot;display_title&quot;:&quot;Theorem 4.1: Speed and tangent evolution&quot;,&quot;body&quot;:&quot;Let $\\widehat c(x,t)=(c(x,t),t)$ and\n$\\widehat H=\\widehat c_*(\\partial_t)=H+\\partial_t$.  Then\n\\[\n \\widehat H(|X|^2)=-2\\operatorname{Ric}_g(X,X)-2k^2|X|^2,\n \\qquad\n [\\widehat H,S]=(k^2+\\operatorname{Ric}_g(S,S))S .\n\\]\nEquivalently, the first formula is the time derivative of the squared speed in\nthe evolving pulled-back metric.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Curve-Flow Geometry&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:95,&quot;ref&quot;:&quot;MT:ch19:19.6&quot;},{&quot;id&quot;:&quot;be45913142d1&quot;,&quot;label&quot;:&quot;thm:kappa-solution-asymptotic-models&quot;,&quot;title&quot;:&quot;Asymptotic models of three-dimensional kappa-solutions&quot;,&quot;display_title&quot;:&quot;Theorem 3.3: Asymptotic models of three-dimensional kappa-solutions&quot;,&quot;body&quot;:&quot;Assume the endpoint-transfer hypotheses of \\ref{thm:reduced-volume-transfer}\nhold for the rescaled reduced-exponential families below.  Let $(M,g(t))$ be\na three-dimensional $\\kappa$-solution and fix $(p,0)$.\nThere are $\\tau_j\\to\\infty$ and points $q_j$ at time $-\\tau_j$ with reduced\nlength at most $3/2$ such that the parabolically rescaled pointed flows based\nat $(q_j,-1)$ converge to a complete nonflat gradient shrinking soliton with\nbounded nonnegative curvature.  The limit is a compact round space form or\none of the three cylindrical models\n\\[\n S^2\\times\\mathbb R,\\qquad\n \\mathbb{RP}^2\\times\\mathbb R,\\qquad\n \\mathbb{RP}^2\\widetilde\\times\\mathbb R,\n\\]\nwhere the last space is the twisted line bundle.  If the original solution\nis nonround, a sequence can be chosen with one of these three noncompact\nlimits.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solutions and Asymptotic Models&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:65,&quot;ref&quot;:&quot;MT:ch9:9.11,MT:ch9:9.42,MT:ch9:9.44,MT:ch9:9.53,MT:ch9:9.54&quot;},{&quot;id&quot;:&quot;bf415d488cc7&quot;,&quot;label&quot;:&quot;def:reduced-volume&quot;,&quot;title&quot;:&quot;Reduced volume&quot;,&quot;display_title&quot;:&quot;Definition 2.10: Reduced volume&quot;,&quot;body&quot;:&quot;When the reduced injectivity domain has full measure in the time slice, the\nreduced volume based at $(x,T)$ is\n\\[\n \\widetilde V_x(\\tau)=\n \\int_{M_{T-\\tau}}(4\\pi\\tau)^{-3/2}e^{-l_x(y,\\tau)}\n \\,d\\operatorname{vol}_{g(T-\\tau)}(y).\n\\]\nEquivalently, if $J(v,\\tau)$ is the Jacobian of\n$\\mathcal L\\exp_x^\\tau$, then\n\\[\n \\widetilde V_x(\\tau)=\n \\int_{\\mathcal D_x^\\tau}(4\\pi\\tau)^{-3/2}\n e^{-l_x(\\mathcal L\\exp_x^\\tau(v),\\tau)}J(v,\\tau)\\,dv.\n\\]&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Reduced Geometry&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:40,&quot;ref&quot;:&quot;MT:ch6:6.70,MT:ch6:6.71&quot;},{&quot;id&quot;:&quot;bfa2180fd4c9&quot;,&quot;label&quot;:&quot;lem:controlled-surgery-restart&quot;,&quot;title&quot;:&quot;Controlled restart after surgery&quot;,&quot;display_title&quot;:&quot;Lemma 3.29: Controlled restart after surgery&quot;,&quot;body&quot;:&quot;Let a controlled Ricci flow reach a finite singular time $T$.  In its maximal\nextension, cut every sufficiently curved horn at the central sphere of a\nstrong $\\bar\\delta(T)$-neck of scale $h(T)$, discard each horn end and each\ncomponent containing no controlled-curvature point, and insert the standard\ncaps.  For sufficiently small control, the post-surgery metric is smooth,\nretains curvature pinching, satisfies the seven controlled-flow conditions,\nand is initial data for a maximal ordinary Ricci flow.  The new flow retains\nthe stage noncollapsing and strong canonical-neighborhood estimates.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Surgery Continuation and Finiteness&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:91,&quot;ref&quot;:&quot;MT:ch15:15.8,MT:ch15:15.11&quot;},{&quot;id&quot;:&quot;c0fea205205b&quot;,&quot;label&quot;:&quot;thm:compact-kappa-solution-structure&quot;,&quot;title&quot;:&quot;Structure of compact kappa-solutions&quot;,&quot;display_title&quot;:&quot;Theorem 3.14: Structure of compact kappa-solutions&quot;,&quot;body&quot;:&quot;For every sufficiently small $\\epsilon&gt;0$ there is\n$C_1=C_1(\\epsilon)&lt;\\infty$ such that a compact three-dimensional\n$\\kappa$-solution is round, is a positively curved $C_1$-component, or is\nthe union of two disjoint $(C_1,\\epsilon)$-cap cores joined by a strong\n$\\epsilon$-tube.  In the nonround cases its time-zero slice is\ndiffeomorphic to $S^3$ or $\\mathbb{RP}^3$.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solution Geometry and Stability&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:76,&quot;ref&quot;:&quot;MT:ch9:9.89,MT:ch9:9.90,MT:ch9:9.91&quot;},{&quot;id&quot;:&quot;c1c624f5a6e1&quot;,&quot;label&quot;:&quot;thm:ramp-curve-shrinking-global-existence&quot;,&quot;title&quot;:&quot;Global existence for ramps&quot;,&quot;display_title&quot;:&quot;Theorem 4.25: Global existence for ramps&quot;,&quot;body&quot;:&quot;Let $(M,g(t))$, $t_0\\le t\\le t_1$, be a Ricci flow and let\n$c_0\\colon S^1\\to M\\times S^1_\\lambda$ be a $C^{2,\\alpha}$ ramp at time\n$t_0$, for some $0&lt;\\alpha&lt;1$.\nThen its curve-shrinking flow exists on all of $[t_0,t_1]$, remains immersed,\nand consists entirely of ramps.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Evolution Identities and Global Bounds&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:119,&quot;ref&quot;:&quot;MT:ch19:19.14&quot;},{&quot;id&quot;:&quot;c41e0879d383&quot;,&quot;label&quot;:&quot;thm:kappa-solution-structure-summary&quot;,&quot;title&quot;:&quot;Uniform structure of kappa-solutions&quot;,&quot;display_title&quot;:&quot;Theorem 3.15: Uniform structure of kappa-solutions&quot;,&quot;body&quot;:&quot;For every sufficiently small $\\epsilon&gt;0$ there is\n$C=C(\\epsilon)&lt;\\infty$ such that every three-dimensional\n$\\kappa$-solution is one of the following: a round spherical space form; a\ncompact positively curved $C$-component; a compact double-capped strong\n$\\epsilon$-tube; a noncompact $(C,\\epsilon)$-capped strong\n$\\epsilon$-tube; the round strong cylinder; or\n$\\mathbb{RP}^2\\times\\mathbb R$.  In every nonexceptional case each point is\nin a cap core, a controlled or round component, or is the center of a strong\n$\\epsilon$-neck.  Uniformly on the flow,\n\\[\n |\\nabla R|\\le CR^{3/2},\\qquad |\\partial_tR|\\le CR^2.\n\\]&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solution Geometry and Stability&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:77,&quot;ref&quot;:&quot;MT:ch9:9.93&quot;},{&quot;id&quot;:&quot;c498839d073a&quot;,&quot;label&quot;:&quot;lem:extinction-scalar-curvature-lower-bound&quot;,&quot;title&quot;:&quot;Scalar-curvature lower bound&quot;,&quot;display_title&quot;:&quot;Lemma 5.10: Scalar-curvature lower bound&quot;,&quot;body&quot;:&quot;For the normalized all-time controlled surgery flow, including the\npostsurgery time slices,\n\\[\n R_{\\min}(t)\\ge-\\frac6{1+4t}.\n\\]&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Eventual Vanishing of _2&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:139,&quot;ref&quot;:&quot;MT:ch18:18.1,MT:ch15:15.9&quot;},{&quot;id&quot;:&quot;c564a4aa18b6&quot;,&quot;label&quot;:&quot;thm:point-soul-sphere-separation-annulus&quot;,&quot;title&quot;:&quot;Sphere separation and the annulus region about a point soul&quot;,&quot;display_title&quot;:&quot;Theorem 3.9: Sphere separation and the annulus region about a point soul&quot;,&quot;body&quot;:&quot;Let $M^3$ be complete, noncompact, and positively curved, and let $p$ be its\npoint soul.  Assume the smooth Schoenflies theorem and the smooth annulus\ntheorem for embedded two-spheres in the resulting $\\mathbb R^3$ identification\nof $M\\setminus\\{p\\}$.  Then every smoothly embedded two-sphere in\n$M\\setminus\\{p\\}$ has one\nrelatively compact complementary component with three-ball closure and one\ncomponent containing the unique end.  If such a sphere is isotopic in\n$M\\setminus\\{p\\}$ to a distance sphere about $p$, then it separates $p$ from\nthe end.  Any two disjoint embedded two-spheres that separate $p$ from the\nend bound a region diffeomorphic to $S^2\\times[0,1]$.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solution Geometry and Stability&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:71,&quot;ref&quot;:&quot;MT:ch2:2.19&quot;},{&quot;id&quot;:&quot;c62f7c1e78a3&quot;,&quot;label&quot;:&quot;lem:loop-width-ode-formula&quot;,&quot;title&quot;:&quot;Integrating-factor formula&quot;,&quot;display_title&quot;:&quot;Lemma 5.23: Integrating-factor formula&quot;,&quot;body&quot;:&quot;Put\n\\[\n B_{t&#x27;}(t)=\\int_{t&#x27;}^t\\frac12R_{\\min}(s)\\,ds.\n\\]\nThen, for $t&#x27;&#x27;\\ge t&#x27;$,\n\\[\n w_{a,t&#x27;}(t&#x27;&#x27;)=e^{-B_{t&#x27;}(t&#x27;&#x27;)}\n \\left(a-2\\pi\\int_{t&#x27;}^{t&#x27;&#x27;}e^{B_{t&#x27;}(s)}\\,ds\\right).\n\\]\nIf $a&#x27;\\ge a$, then\n\\[\n w_{a&#x27;,t&#x27;}(t&#x27;&#x27;)-w_{a,t&#x27;}(t&#x27;&#x27;)\n =(a&#x27;-a)e^{-B_{t&#x27;}(t&#x27;&#x27;)}\\ge0.\n\\]\nOn a fixed compact time interval this difference is bounded by a constant\ntimes $a&#x27;-a$.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;The Width Comparison ODE&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:152,&quot;ref&quot;:&quot;MT:ch18:18.25,MT:ch18:18.26&quot;},{&quot;id&quot;:&quot;c7f77a2809ce&quot;,&quot;label&quot;:&quot;def:regular-polygonal-loop-approximation&quot;,&quot;title&quot;:&quot;Regular polygonal approximation&quot;,&quot;display_title&quot;:&quot;Definition 4.14: Regular polygonal approximation&quot;,&quot;body&quot;:&quot;Let $c\\colon S^1\\to M$ be $C^1$, let $n\\ge1$, and put\n$\\xi_n=e^{2\\pi i/n}$ and $p_j=c(\\xi_n^j)$.  Choose a minimizing geodesic\n$A_j$ from $p_j$ to $p_{j+1}$, with circular indexing, and parametrize it at\nconstant speed on the corresponding subinterval of $S^1$.  The resulting\npiecewise geodesic loop $c_n$ is a \\emph{regular $n$-polygonal approximation}\nof $c$.  When all sides lie below the injectivity radius, the choices are\nunique.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Polygonal Ramp Approximation&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:108,&quot;ref&quot;:&quot;MT:ch19:19.18&quot;},{&quot;id&quot;:&quot;c97a532e4a8d&quot;,&quot;label&quot;:&quot;lem:whole-disappearing-component-classification&quot;,&quot;title&quot;:&quot;Whole disappearing components&quot;,&quot;display_title&quot;:&quot;Lemma 6.7: Whole disappearing components&quot;,&quot;body&quot;:&quot;If a connected component of $D$ is also a whole component of the time-$t$\nslice, then it is diffeomorphic to one of\n\\[\n S^3/\\Gamma,\\qquad \\mathbb{RP}^3\\mathbin{\\#}\\mathbb{RP}^3,\n \\qquad E_+,\n \\qquad E_-.\n\\]&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Reversing One Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:173,&quot;ref&quot;:&quot;MT:ch4:4.23,MT:ch15:15.3,MT:app:A.25&quot;},{&quot;id&quot;:&quot;cced2941ff59&quot;,&quot;label&quot;:&quot;def:reduced-length&quot;,&quot;title&quot;:&quot;Reduced length&quot;,&quot;display_title&quot;:&quot;Definition 2.8: Reduced length&quot;,&quot;body&quot;:&quot;Fix a smooth point $(x,T)$ and write backward time as $\\tau=T-t$.  For a\npiecewise smooth backward path $\\gamma\\colon[0,\\bar\\tau]\\to\\mathcal M$\nwith $\\gamma(0)=x$, define\n\\[\n \\mathcal L(\\gamma)=\n \\int_0^{\\bar\\tau}\\sqrt\\tau\n \\bigl(R(\\gamma(\\tau))+|\\dot\\gamma(\\tau)|^2\\bigr)\\,d\\tau.\n\\]\nFor a point $y$ at backward time $\\bar\\tau$, let\n$L_x(y,\\bar\\tau)$ be the infimum of $\\mathcal L$ over such paths and put\n\\[\n l_x(y,\\bar\\tau)=\\frac{L_x(y,\\bar\\tau)}{2\\sqrt{\\bar\\tau}}.\n\\]\nThese quantities are used only on domains on which every competing path\nstays in the smooth locus.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Reduced Geometry&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:38,&quot;ref&quot;:&quot;MT:ch6:6.2,MT:ch6:6.45&quot;},{&quot;id&quot;:&quot;ce186647dac1&quot;,&quot;label&quot;:&quot;thm:kappa-solution-splitting-at-infinity&quot;,&quot;title&quot;:&quot;Splitting at infinity for kappa-solutions&quot;,&quot;display_title&quot;:&quot;Theorem 3.12: Splitting at infinity for kappa-solutions&quot;,&quot;body&quot;:&quot;Let $(M,g(t))$, $-\\infty&lt;t\\le0$, be a noncompact three-dimensional\n$\\kappa$-solution.  If $p_j\\to\\infty$ and\n\\[\n R(p_j,-1)d_{g(-1)}(p,p_j)^2\\longrightarrow\\infty,\n\\]\nthen there are points $q_j\\to\\infty$ and scales $Q_j=R(q_j,-1)$ for\nwhich the based parabolic rescalings converge on compact subsets to the\nproduct of a shrinking round two-sphere with a flat line, possibly modulo\nthe free line-bundle involution.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solution Geometry and Stability&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:74,&quot;ref&quot;:&quot;MT:ch9:9.39&quot;},{&quot;id&quot;:&quot;ce9c2abb2e16&quot;,&quot;label&quot;:&quot;lem:graph-flow-tangential-derivative&quot;,&quot;title&quot;:&quot;Tangential component of _ZY&quot;,&quot;display_title&quot;:&quot;Theorem 4.32: Tangential component of _ZY&quot;,&quot;body&quot;:&quot;On $I&#x27;\\times[t&#x27;,t_2]$,\n\\[\n |\\langle\\nabla_ZY,Z\\rangle|\n \\le\\bigl(|f_z|_{h&#x27;}(|\\nabla_ZY|+2\\delta|Y|)\n       +\\delta|Z|^2|Y|\\bigr)(1+\\delta).\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Short-Time Curvature Barrier&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:126,&quot;ref&quot;:&quot;MT:ch19:19.67&quot;},{&quot;id&quot;:&quot;d3773f5a6e9c&quot;,&quot;label&quot;:&quot;lem:neck-chain-product&quot;,&quot;title&quot;:&quot;A neck chain is a product&quot;,&quot;display_title&quot;:&quot;Lemma 1.23: A neck chain is a product&quot;,&quot;body&quot;:&quot;The union $U$ of a finite or infinite chain of sufficiently small\n$\\epsilon$-necks is diffeomorphic to $S^2\\times(0,1)$, compatibly with\nthe isotopy classes of all neck spheres.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:22,&quot;ref&quot;:&quot;MT:app:A.13&quot;},{&quot;id&quot;:&quot;d388b2082a09&quot;,&quot;label&quot;:&quot;lem:graph-flow-velocity-identities&quot;,&quot;title&quot;:&quot;Graph-flow velocity identities&quot;,&quot;display_title&quot;:&quot;Theorem 4.8: Graph-flow velocity identities&quot;,&quot;body&quot;:&quot;On the graph interval,\n\\[\n Y=\\frac{\\nabla_ZZ-\\langle\\Gamma(Z,Z),\\partial_z\\rangle_{h&#x27;}Z}{|Z|^2}\n =\\nabla_SS+\\left(\n \\frac{\\langle\\nabla_ZZ,Z\\rangle}{|Z|^4}\n -\\frac{\\langle\\Gamma(Z,Z),\\partial_z\\rangle_{h&#x27;}}{|Z|^2}\n \\right)Z.\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Graph-Flow Coordinate Estimates&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:102,&quot;ref&quot;:&quot;MT:ch19:19.64&quot;},{&quot;id&quot;:&quot;d41a89faf926&quot;,&quot;label&quot;:&quot;lem:retained-neck-surgery-pinching&quot;,&quot;title&quot;:&quot;Curvature and pinching on the retained neck&quot;,&quot;display_title&quot;:&quot;Lemma 1.14: Curvature and pinching on the retained neck&quot;,&quot;body&quot;:&quot;For the universal choices in\n\\ref{lem:conformal-surgery-curvature-comparison} and all sufficiently\nsmall $\\delta$, the metric $\\widetilde g$ has positive sectional curvature\non $1\\le s&lt;4$.  Moreover, if the original neck satisfies, for some\n$t\\ge0$ and $X_g=\\max(0,-\\nu_g)$,\n\\[\n R_g\\ge-\\frac6{1+4t},\n \\qquad\n R_g\\ge2X_g\\bigl(\\log X_g+\\log(1+t)-3\\bigr)\n \\quad(X_g&gt;0),\n\\]\nthen the same inequalities hold for $\\widetilde g$ on $s&lt;4$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:13,&quot;ref&quot;:&quot;MT:ch13:13.13,MT:ch13:13.14&quot;},{&quot;id&quot;:&quot;d78b21365ab2&quot;,&quot;label&quot;:&quot;lem:normalized-initial-metric-exists&quot;,&quot;title&quot;:&quot;Existence of a normalized initial metric&quot;,&quot;display_title&quot;:&quot;Lemma 6.12: Existence of a normalized initial metric&quot;,&quot;body&quot;:&quot;Every closed smooth $3$-manifold admits a Riemannian metric which is normalized\nin the sense required by the all-time controlled-surgery theorem.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Connected Sums and Fundamental Groups&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:178,&quot;ref&quot;:&quot;MT:ch15:p:353&quot;},{&quot;id&quot;:&quot;da34bc1d727d&quot;,&quot;label&quot;:&quot;def:local-neck-surgery-data&quot;,&quot;title&quot;:&quot;Local neck-surgery data&quot;,&quot;display_title&quot;:&quot;Definition 1.8: Local neck-surgery data&quot;,&quot;body&quot;:&quot;Let $(N,g)$ be a $\\delta$-neck centered at $x_0$, let\n$Q=R_g(x_0)$, and let\n\\[\n \\rho\\colon S^2\\times(-\\delta^{-1},\\delta^{-1})\\longrightarrow N\n\\]\nbe its neck chart.  Assume $\\delta^{-1}&gt;A_0+4$.  Form $\\mathcal S$ by\ngluing $S^2\\times(-\\delta^{-1},4)$ to\n$B_{g_0}(p_0,A_0+4)$ through the cylindrical isometry on\n$S^2\\times(0,4)$.  The two axial coordinates glue to\n\\[\n s\\colon\\mathcal S\\longrightarrow(-\\delta^{-1},A_0+4].\n\\]\nFix smooth cutoffs $\\alpha\\colon[1,2]\\to[0,1]$ and\n$\\beta\\colon[A_0+4-r_0,A_0+4]\\to[0,1]$, equal to $1$ near their left\nendpoints and $0$ near their right endpoints.  Put\n\\[\n \\eta=1-2\\delta,\n \\qquad\n f(s)=\\begin{cases}\n 0,&amp;s\\le0,\\\\\n C_0\\delta e^{-q/s},&amp;s&gt;0.\n \\end{cases}\n\\]&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:7,&quot;ref&quot;:&quot;MT:ch13:13.1,MT:ch13:13.2&quot;},{&quot;id&quot;:&quot;da9c7ade7060&quot;,&quot;label&quot;:&quot;thm:free-product-connected-sum-classification&quot;,&quot;title&quot;:&quot;The free-product topology theorem&quot;,&quot;display_title&quot;:&quot;Theorem 6.13: The free-product topology theorem&quot;,&quot;body&quot;:&quot;Let $M$ be a closed connected smooth $3$-manifold whose fundamental group is\na free product of finite groups and infinite cyclic groups.  Then $M$ is a\nfinite connected sum of spherical space forms and copies of $E_+$ and $E_-$.\nIf $M$ is orientable, only $E_+$ occurs.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Connected Sums and Fundamental Groups&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:179,&quot;ref&quot;:&quot;MT:intro:0.1&quot;},{&quot;id&quot;:&quot;db2a61f4d32e&quot;,&quot;label&quot;:&quot;thm:free-product-pi2-obstruction&quot;,&quot;title&quot;:&quot;Free-product obstruction to vanishing _2&quot;,&quot;display_title&quot;:&quot;Theorem 5.14: Free-product obstruction to vanishing _2&quot;,&quot;body&quot;:&quot;Assume the closed three-manifold sphere/free-product theorem in the form that\na nontrivial free product or an infinite cyclic fundamental group yields an\nessential (non-null-homotopic) embedded $2$-sphere.  If $X$ is a closed\nconnected three-manifold with $\\pi_1(X)$ a nontrivial free product or\n$\\pi_1(X)\\cong\\mathbb Z$,\nthen\n$\\pi_2(X)\\ne0$.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Late-Component _3 Topology&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:143,&quot;ref&quot;:&quot;MT:ch18:18.20&quot;},{&quot;id&quot;:&quot;de78aa012715&quot;,&quot;label&quot;:&quot;thm:forward-dini-comparison&quot;,&quot;title&quot;:&quot;Forward-Dini comparison principle&quot;,&quot;display_title&quot;:&quot;Theorem 1.2: Forward-Dini comparison principle&quot;,&quot;body&quot;:&quot;Let $f\\colon[a,b]\\to\\mathbb R$ be continuous, let\n$\\psi\\colon[a,b]\\times\\mathbb R\\to\\mathbb R$ be of class $C^1$, and\nsuppose\n\\[\n  D^+f(t)\\le \\psi(t,f(t))\\qquad(a\\le t&lt;b).\n\\]\nIf $G\\in C^1([a,b])$ satisfies $G&#x27;(t)=\\psi(t,G(t))$ and\n$f(a)\\le G(a)$, then $f(t)\\le G(t)$ for every $t\\in[a,b]$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Forward-Difference Comparison&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:1,&quot;ref&quot;:&quot;MT:ch2:2.22&quot;},{&quot;id&quot;:&quot;e0785f0ad6be&quot;,&quot;label&quot;:&quot;lem:balanced-neck-chain-extension&quot;,&quot;title&quot;:&quot;Extension of a balanced neck chain&quot;,&quot;display_title&quot;:&quot;Lemma 1.25: Extension of a balanced neck chain&quot;,&quot;body&quot;:&quot;For all sufficiently small $\\epsilon$, let\n$N_a,\\ldots,N_b$ be a balanced chain whose central spheres separate $M$.\nIf a point in the frontier of its positive end is the center of an\n$\\epsilon$-neck $N$, then, after reversing $N$ if necessary,\n$N_a,\\ldots,N_b,N$ is a balanced chain.  The analogous assertion holds at\nthe negative end.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:24,&quot;ref&quot;:&quot;MT:app:A.17,MT:app:A.18&quot;},{&quot;id&quot;:&quot;e1d7d80c3e94&quot;,&quot;label&quot;:&quot;lem:localized-total-curvature-evolution&quot;,&quot;title&quot;:&quot;Localized total-curvature differential inequality&quot;,&quot;display_title&quot;:&quot;Theorem 4.28: Localized total-curvature differential inequality&quot;,&quot;body&quot;:&quot;There are constants $D_2,D_3&lt;\\infty$, depending only on\n$\\Theta,L_0$, and the ambient flow, such that the weighted curvature is\nlocally absolutely continuous and, for almost every $t&#x27; &lt; t\\le t_2$,\n\\[\n \\frac d{dt}\\int_{\\gamma_t}\\varphi k\\,ds\n \\le D_2\\left(1+\\frac1{r\\sqrt{t-t&#x27;}}\\right)+\\frac{D_2}{r^2}\n       +D_3\\int_{\\gamma_t}\\varphi k\\,ds\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Localized Total-Curvature Control&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:122,&quot;ref&quot;:&quot;MT:ch19:19.61&quot;},{&quot;id&quot;:&quot;e4211b5eebba&quot;,&quot;label&quot;:&quot;def:controlled-surgery-parameters&quot;,&quot;title&quot;:&quot;Controlled surgery parameters&quot;,&quot;display_title&quot;:&quot;Definition 2.4: Controlled surgery parameters&quot;,&quot;body&quot;:&quot;Fix $\\epsilon&gt;0$ sufficiently small and choose $C$ larger than the uniform\ncanonical-neighborhood constants for the standard solution and for\nthree-dimensional $\\kappa$-solutions.  Put $t_0=2^{-5}$ and\n$T_i=2^it_0$.  The control data are positive nonincreasing sequences\n\\[\n \\mathbf r=(r_i)_{i\\ge0},\\qquad\n \\mathbf K=(\\kappa_i)_{i\\ge0},\\qquad\n \\boldsymbol\\delta=(\\delta_i)_{i\\ge0},\n \\qquad r_0=\\epsilon,\n\\]\nand positive nonincreasing piecewise constant functions $r(t)$ and\n$\\kappa(t)$ with values $r_{i+1}$ and $\\kappa_{i+1}$ on\n$[T_i,T_{i+1})$.  A positive nonincreasing surgery-control function\n$\\bar\\delta(t)$ is required to satisfy\n$\\bar\\delta(t)\\le\\delta_{i+1}$ on that interval.  Define\n\\[\n \\rho(t)=\\bar\\delta(t)r(t),\n \\qquad\n h(t)=h(\\rho(t),\\bar\\delta(t))\n \\le \\bar\\delta(t)^2r(t),\n\\]\nwhere $h$ is the neck scale at which the local surgery construction applies.\nAt a surgery time $t$, every cutting sphere is the central sphere of a strong\n$\\bar\\delta(t)$-neck of scalar curvature $h(t)^{-2}$.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:34,&quot;ref&quot;:&quot;MT:ch15:15.5,MT:ch15:15.6,MT:ch15:15.7&quot;},{&quot;id&quot;:&quot;e57b0a4ff9d7&quot;,&quot;label&quot;:&quot;def:loop-width-comparison-ode&quot;,&quot;title&quot;:&quot;Comparison equation&quot;,&quot;display_title&quot;:&quot;Definition 5.22: Comparison equation&quot;,&quot;body&quot;:&quot;For a compact Ricci flow $(M,g(t))$, $t\\in[t_0,t_1]$, and\n$t&#x27;\\in[t_0,t_1]$, let $w_{a,t&#x27;}$ be the solution of\n\\[\n w&#x27;=-2\\pi-\\frac12R_{\\min}(t)w,\n \\qquad w(t&#x27;)=a.\n\\]\nWrite $w_a=w_{a,t_0}$.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;The Width Comparison ODE&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:151,&quot;ref&quot;:&quot;MT:ch18:18.23&quot;},{&quot;id&quot;:&quot;e5a1514edda1&quot;,&quot;label&quot;:&quot;thm:pointed-controlled-flow-compactness&quot;,&quot;title&quot;:&quot;Pointed compactness for controlled flows&quot;,&quot;display_title&quot;:&quot;Theorem 2.32: Pointed compactness for controlled flows&quot;,&quot;body&quot;:&quot;Let $(\\mathcal M_j,G_j,x_j)$ be based controlled three-dimensional Ricci\nflows and put $Q_j=R(x_j)\\to\\infty$.  Rescale by $Q_j$ and move the base\ntime to zero.  Assume curvature is pinched toward positive, the rescaled\nflows are uniformly $\\kappa$-noncollapsed on every fixed scale, and every\npoint at nonpositive time with rescaled scalar curvature at least four has a\nstrong $(C,\\epsilon)$-canonical neighborhood.  Suppose that for some\n$0&lt;T_0\\le\\infty$, every fixed\n$B(x_j,0,A)\\times(-T,0]$, with $A&lt;\\infty$ and $T&lt;T_0$, eventually has a\ncompatible spacetime embedding.  Then a subsequence converges smoothly to a\ncomplete pointed Ricci flow on $(-T_0,0]$ with nonnegative curvature,\nlocally bounded in time and bounded on each time slice.  If $T_0=\\infty$,\nthe limit is a $\\kappa$-solution.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:62,&quot;ref&quot;:&quot;MT:ch11:11.1,MT:ch11:11.8,MT:ch11:11.10&quot;},{&quot;id&quot;:&quot;e73998aba973&quot;,&quot;label&quot;:&quot;thm:ancient-scalar-curvature-monotonicity&quot;,&quot;title&quot;:&quot;Ancient scalar-curvature monotonicity&quot;,&quot;display_title&quot;:&quot;Theorem 2.19: Ancient scalar-curvature monotonicity&quot;,&quot;body&quot;:&quot;Let $(M,g(t))$, $-\\infty&lt;t\\le0$, be a complete Ricci flow with bounded\nnonnegative curvature operator on each time slice.  Then\n\\[\n \\partial_tR(x,t)\\ge0\n\\]\nat every spacetime point.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Local Curvature and Neck Estimates&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:49,&quot;ref&quot;:&quot;MT:ch4:4.37,MT:ch4:4.39&quot;},{&quot;id&quot;:&quot;e7b507d1568a&quot;,&quot;label&quot;:&quot;lem:regularized-curve-curvature-inequality&quot;,&quot;title&quot;:&quot;Regularized curvature inequality&quot;,&quot;display_title&quot;:&quot;Theorem 4.21: Regularized curvature inequality&quot;,&quot;body&quot;:&quot;There is a constant $C_1&lt;\\infty$, depending only on bounds for the ambient\nRicci flow and its first covariant curvature derivative, such that, for every\n$\\epsilon&gt;0$ and\n$h_\\epsilon=(k^2+\\epsilon^2)^{1/2}$,\n\\[\n \\partial_t h_\\epsilon\\le h_\\epsilon&#x27;&#x27;+k^3+C_1(h_\\epsilon+1).\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Evolution Identities and Global Bounds&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:115,&quot;ref&quot;:&quot;MT:ch19:19.8&quot;},{&quot;id&quot;:&quot;e8e99e72321a&quot;,&quot;label&quot;:&quot;lem:local-capping-connected-sum-identities&quot;,&quot;title&quot;:&quot;Connected-sum effect of capping frontier spheres&quot;,&quot;display_title&quot;:&quot;Lemma 6.9: Connected-sum effect of capping frontier spheres&quot;,&quot;body&quot;:&quot;Let $X$ be a connected closed smooth $3$-manifold, let $C\\subset X$ be one of\nthe three compact regions in\n\\ref{lem:frontier-disappearing-component-classification}, and let $Y$ be\nobtained by deleting the interior of $C$ and capping every new boundary sphere\nwith a $3$-ball.\n\\begin{enumerate}\n\\item If $C\\cong B^3$, then $X\\cong Y$.\n\\item If $C\\cong\\mathbb{RP}^3\\setminus\\operatorname{int}(B^3)$, then\n  $X\\cong Y\\#\\mathbb{RP}^3$.\n\\item If $C\\cong S^2\\times[0,1]$ and its middle sphere separates $X$, then\n  $Y=Y_1\\sqcup Y_2$ and $X\\cong Y_1\\#Y_2$.\n\\item If $C\\cong S^2\\times[0,1]$ and its middle sphere does not separate $X$,\n  then $Y$ is connected and $X\\cong Y\\#E_\\varepsilon$ for some\n  $\\varepsilon\\in\\{+,-\\}$.  If $X$ is orientable, then $\\varepsilon=+$.\n\\end{enumerate}&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Reversing One Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:175,&quot;ref&quot;:&quot;MT:ch15:15.3,Hatcher3M:ch1:1.1,Hatcher3M:ch1:1.5&quot;},{&quot;id&quot;:&quot;eb500921cc59&quot;,&quot;label&quot;:&quot;thm:free-product-excludes-two-sided-projective-plane&quot;,&quot;title&quot;:&quot;The free-product hypothesis excludes a two-sided projective plane&quot;,&quot;display_title&quot;:&quot;Theorem 5.36: The free-product hypothesis excludes a two-sided projective plane&quot;,&quot;body&quot;:&quot;Assume the corresponding closed three-manifold projective-plane theorem: a\ntwo-sided embedded $\\mathbb{RP}^2$ gives a forbidden free-product factor in\nthe fundamental group.  Let $M$ be a closed connected three-manifold whose\nfundamental group is a\nfree product of finite groups and infinite cyclic groups.  Then $M$ contains\nno embedded $\\mathbb{RP}^2$ with trivial normal bundle.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Finite Extinction&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:165,&quot;ref&quot;:&quot;MT:ch18:18.1&quot;},{&quot;id&quot;:&quot;edd928203cd3&quot;,&quot;label&quot;:&quot;thm:positive-ricci-three-manifold-roundness&quot;,&quot;title&quot;:&quot;Hamilton roundness for positive Ricci curvature&quot;,&quot;display_title&quot;:&quot;Theorem 6.6: Hamilton roundness for positive Ricci curvature&quot;,&quot;body&quot;:&quot;Assume Hamilton&#x27;s positive-Ricci convergence and spherical-space-form\nclassification theorem in dimension three, including its diffeomorphism-level\nconclusion.  If a closed smooth $3$-manifold admits a Riemannian metric with\npositive Ricci curvature, then it admits a metric of constant positive\nsectional curvature and is diffeomorphic to a spherical space form.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Smooth Connected Sums and Prime Factors&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:172,&quot;ref&quot;:&quot;MT:ch4:4.23&quot;},{&quot;id&quot;:&quot;eea9e1e3c571&quot;,&quot;label&quot;:&quot;thm:curvature-null-splitting&quot;,&quot;title&quot;:&quot;Splitting at a curvature null direction&quot;,&quot;display_title&quot;:&quot;Theorem 2.18: Splitting at a curvature null direction&quot;,&quot;body&quot;:&quot;Let a connected three-dimensional Ricci flow have nonnegative curvature\noperator.  If its curvature operator has a null eigenvector at a positive\ntime, then the tangent Ricci-null line distribution is locally parallel and time-independent,\nand every connected parabolic neighborhood on which it is defined locally\nsplits as a surface flow times a flat interval.  If the time slices are\ncomplete, the universal cover splits isometrically as a Ricci flow on a\nsurface times a flat line.  Every quotient is obtained from this product by\na group preserving the parallel line distribution.  In\nparticular, if the scalar curvature vanishes at one positive-time point,\nthen the flow is flat on that connected spacetime neighborhood.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Local Curvature and Neck Estimates&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:48,&quot;ref&quot;:&quot;MT:ch4:4.19,MT:ch4:4.20,MT:ch4:4.21&quot;},{&quot;id&quot;:&quot;efddbd482f53&quot;,&quot;label&quot;:&quot;lem:interpolating-surgery-metric-smooth&quot;,&quot;title&quot;:&quot;Smoothness of the interpolating surgery metric&quot;,&quot;display_title&quot;:&quot;Lemma 1.10: Smoothness of the interpolating surgery metric&quot;,&quot;body&quot;:&quot;The piecewise tensor $\\widehat g$ of\n\\ref{def:interpolating-surgery-metric} is a smooth Riemannian metric on\n$\\mathcal S$.  It equals $Q\\rho^*g$ on $s\\le0$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:9,&quot;ref&quot;:&quot;MT:ch13:13.2&quot;},{&quot;id&quot;:&quot;f2712cff9330&quot;,&quot;label&quot;:&quot;lem:rescaled-high-curvature-canonical-control&quot;,&quot;title&quot;:&quot;High-curvature control in a rescaled failure slice&quot;,&quot;display_title&quot;:&quot;Lemma 3.21: High-curvature control in a rescaled failure slice&quot;,&quot;body&quot;:&quot;After rescaling first-failure points to scalar curvature one and taking the\nsurgery controls to zero, every point of the zero-time slice with scalar\ncurvature greater than one has a strong\n$(2C,2\\epsilon)$-canonical neighborhood for all sufficiently large indices.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;First-Failure Extension&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:83,&quot;ref&quot;:&quot;MT:ch17:17.6&quot;},{&quot;id&quot;:&quot;f29967583a07&quot;,&quot;label&quot;:&quot;thm:loop-width-forward-inequality&quot;,&quot;title&quot;:&quot;Forward inequality for the _3 width&quot;,&quot;display_title&quot;:&quot;Theorem 5.35: Forward inequality for the _3 width&quot;,&quot;body&quot;:&quot;Let $\\mathcal X$ be a component path of a controlled surgery flow, suppose\n$\\pi_2(\\mathcal X(t_0))=0$ and\n$\\pi_3(\\mathcal X(t_0))\\cong\\mathbb Z$, and let\n$0\\ne\\xi(t_0)\\in\\pi_3(\\mathcal X(t_0))$.  For the transported class,\n$W_\\xi$ is continuous at nonsurgery times, obeys\n\\[\n W_\\xi(T)\\le\\liminf_{t\\uparrow T}W_\\xi(t)\n\\]\nat surgery times, and satisfies\n\\[\n D^+W_\\xi(t)\n \\le-2\\pi-\\frac12R_{\\min}(t)W_\\xi(t)\n\\]\non the immediate right of every time in the component path.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;_3-Width Evolution Through Surgery&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:164,&quot;ref&quot;:&quot;MT:ch18:18.18&quot;},{&quot;id&quot;:&quot;f32e24c7af2a&quot;,&quot;label&quot;:&quot;lem:simply-connected-three-manifold-orientable&quot;,&quot;title&quot;:&quot;A simply connected three-manifold is orientable&quot;,&quot;display_title&quot;:&quot;Lemma 6.5: A simply connected three-manifold is orientable&quot;,&quot;body&quot;:&quot;Every connected simply connected smooth $3$-manifold is orientable.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Smooth Connected Sums and Prime Factors&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:171,&quot;ref&quot;:&quot;Hatcher:ch3:3.25&quot;},{&quot;id&quot;:&quot;f52d6bda93a2&quot;,&quot;label&quot;:&quot;prop:universal-nonround-kappa&quot;,&quot;title&quot;:&quot;Universal noncollapsing for nonround kappa-solutions&quot;,&quot;display_title&quot;:&quot;Proposition 3.4: Universal noncollapsing for nonround kappa-solutions&quot;,&quot;body&quot;:&quot;Assume the endpoint-transfer hypotheses of \\ref{thm:reduced-volume-transfer}\nhold uniformly on the rescaled model balls.  There is a universal\n$\\kappa_*&gt;0$ such that every nonround\nthree-dimensional $\\kappa$-solution is a $\\kappa_*$-solution.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solutions and Asymptotic Models&quot;,&quot;kind&quot;:&quot;proposition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:66,&quot;ref&quot;:&quot;MT:ch9:9.58&quot;},{&quot;id&quot;:&quot;f538fa47d10b&quot;,&quot;label&quot;:&quot;lem:ramp-annulus-nondegeneration&quot;,&quot;title&quot;:&quot;Ramp nondegeneration&quot;,&quot;display_title&quot;:&quot;Lemma 5.26: Ramp nondegeneration&quot;,&quot;body&quot;:&quot;Let $c_0,c_1\\colon S^1\\to M\\times S^1_\\lambda$ be degree-one ramps in the\nsame free homotopy class, and let\n$F\\colon S^1\\times[0,1]\\to M\\times S^1_\\lambda$ span them.  For every\nessential simple closed domain curve $\\alpha$,\n\\[\n L(F\\circ\\alpha)\\ge L(S^1_\\lambda)&gt;0.\n\\]\nThe same bound holds while both curves evolve by smooth curve shrinking.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Controlled Loop-Family Deformation&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:155,&quot;ref&quot;:&quot;MT:ch19:19.15&quot;},{&quot;id&quot;:&quot;f82e94abd991&quot;,&quot;label&quot;:&quot;lem:epsilon-neck-geodesic-axis-alignment&quot;,&quot;title&quot;:&quot;Long minimizing geodesics align with a neck axis&quot;,&quot;display_title&quot;:&quot;Lemma 2.21: Long minimizing geodesics align with a neck axis&quot;,&quot;body&quot;:&quot;For every $\\alpha&gt;0$ there is $\\epsilon_0(\\alpha)&gt;0$ such that, in a\nnormalized $\\epsilon$-neck with $\\epsilon\\le\\epsilon_0$, every minimizing\ngeodesic of length greater than $\\epsilon^{-1}/100$ which crosses in the\npositive axial direction has tangent within $\\alpha$ of the axial unit\nvector at every point of the geodesic contained in the neck.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Local Curvature and Neck Estimates&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:51,&quot;ref&quot;:&quot;MT:ch19:19.4&quot;},{&quot;id&quot;:&quot;fa6d9839e669&quot;,&quot;label&quot;:&quot;lem:two-sphere-width-regular-continuity&quot;,&quot;title&quot;:&quot;Continuity of the two-sphere width at regular times&quot;,&quot;display_title&quot;:&quot;Lemma 5.5: Continuity of the two-sphere width at regular times&quot;,&quot;body&quot;:&quot;On a closed surgery-free interval on which the component is identified by\nthe Ricci-flow time vector field and has nonzero $\\pi_2$, the function $W_2$\nis continuous.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Two-Sphere Width Control&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:134,&quot;ref&quot;:&quot;MT:ch18:18.11,MT:ch18:18.13&quot;},{&quot;id&quot;:&quot;faaa7ab069aa&quot;,&quot;label&quot;:&quot;lem:conformal-surgery-curvature-comparison&quot;,&quot;title&quot;:&quot;Conformal curvature comparison on the neck side&quot;,&quot;display_title&quot;:&quot;Lemma 1.13: Conformal curvature comparison on the neck side&quot;,&quot;body&quot;:&quot;Let $h$ be a metric $C^{\\lfloor1/\\delta\\rfloor}$-close to\n$h_0+ds^2$ on $S^2\\times I$, and put $\\widehat h=e^{-2f}h$ with\n$f=C_0\\delta e^{-q/s}$ for $s&gt;0$.  Choose $K$ so that every curvature\neigenvalue of a scale-one $\\delta$-neck is at least $-K\\delta$.\nThere are universal choices $q\\gg(A_0+4)^2$, $C_0=2Ke^q$, and\n$\\delta_*&gt;0$ such that, whenever $0&lt;\\delta\\le\\delta_*$ and $0&lt;s&lt;4$,\nthe scalar curvature of\n$\\widehat h$ is at least that of $h$, and the least eigenvalue of its\ncurvature operator is strictly larger than that of $h$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:12,&quot;ref&quot;:&quot;MT:ch13:13.5,MT:ch13:13.6,MT:ch13:13.7,MT:ch13:13.8,MT:ch13:13.9,MT:ch13:13.10,MT:ch13:13.11,MT:ch13:13.12&quot;},{&quot;id&quot;:&quot;fb27b70fd4ff&quot;,&quot;label&quot;:&quot;lem:product-circle-parallel-geometry&quot;,&quot;title&quot;:&quot;Product-circle geometry&quot;,&quot;display_title&quot;:&quot;Theorem 4.3: Product-circle geometry&quot;,&quot;body&quot;:&quot;On $(M,g(t))\\times(S^1_\\lambda,ds^2)$ let $U$ be the oriented unit tangent\nto the circle factor.  Then $\\nabla U=0$ and\n$\\operatorname{Ric}(V,U)=0$ for every tangent vector $V$; both assertions are\nindependent of $\\lambda&gt;0$.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Product-Circle Geometry and Ramp Setup&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:97,&quot;ref&quot;:&quot;MT:ch19:19.11&quot;},{&quot;id&quot;:&quot;fc31a601123a&quot;,&quot;label&quot;:&quot;thm:poincare-conjecture&quot;,&quot;title&quot;:&quot;Poincare conjecture&quot;,&quot;display_title&quot;:&quot;Theorem 6.19: Poincare conjecture&quot;,&quot;body&quot;:&quot;Every closed smooth simply connected $3$-manifold is diffeomorphic to $S^3$.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Simple Connectivity&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:185,&quot;ref&quot;:&quot;MT:intro:0.2(a)&quot;},{&quot;id&quot;:&quot;fd268164d548&quot;,&quot;label&quot;:&quot;lem:compact-family-polygonal-approximation&quot;,&quot;title&quot;:&quot;Uniform polygonal approximation on compact families&quot;,&quot;display_title&quot;:&quot;Theorem 4.16: Uniform polygonal approximation on compact families&quot;,&quot;body&quot;:&quot;Let $K$ be a compact set of $C^1$ loops, with the $C^1$ topology, and let\n$\\zeta&gt;0$.  There is $N=N(K,\\zeta)$ such that the two conclusions of\n\\ref{lem:single-loop-polygonal-approximation} hold for every $c\\in K$ and\nevery $n\\ge N$.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Polygonal Ramp Approximation&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:110,&quot;ref&quot;:&quot;MT:ch19:19.20&quot;},{&quot;id&quot;:&quot;fdaab108b288&quot;,&quot;label&quot;:&quot;def:standard-surgery-cap-model&quot;,&quot;title&quot;:&quot;Standard surgery-cap model&quot;,&quot;display_title&quot;:&quot;Definition 1.7: Standard surgery-cap model&quot;,&quot;body&quot;:&quot;Fix a complete rotationally symmetric metric $g_0$ on $\\mathbb R^3$ with\nnonnegative sectional curvature and tip $p_0$.  Fix constants\n$A_0&gt;r_0&gt;0$ such that $g_0$ has constant sectional curvature $1/4$ on\n$B_{g_0}(p_0,r_0)$ and there is an isometry\n\\[\n \\psi\\colon(S^2\\times(-\\infty,4],h_0+ds^2)\n \\longrightarrow(\\mathbb R^3\\setminus B_{g_0}(p_0,A_0),g_0).\n\\]\nExtend the cylinder coordinate to a continuous radial function by\n\\[\n s_1(y)=A_0+4-d_{g_0}(p_0,y).\n\\]\nIt is smooth away from $p_0$ and has round two-sphere level sets.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:6,&quot;ref&quot;:&quot;MT:ch12:12.2,MT:ch12:12.3&quot;},{&quot;id&quot;:&quot;ff09b9b55dd8&quot;,&quot;label&quot;:&quot;thm:bounded-curvature-at-bounded-distance&quot;,&quot;title&quot;:&quot;Bounded curvature at bounded distance&quot;,&quot;display_title&quot;:&quot;Theorem 2.31: Bounded curvature at bounded distance&quot;,&quot;body&quot;:&quot;For sufficiently small $\\epsilon&gt;0$ and every $A,C&lt;\\infty$, there are\n$D_0=D_0(A,C,\\epsilon)$ and $D=D(A,C,\\epsilon)$ with the following\nproperty.  Let $x$ lie in a three-dimensional Ricci flow with surgery whose\ncurvature is pinched toward positive.  Suppose every point $z$ at time at\nmost $\\mathbf t(x)$ with $R(z)\\ge4R(x)$ has a strong\n$(C,\\epsilon)$-canonical neighborhood.  If $R(x)\\ge D_0$, then\n\\[\n R(y)\\le D R(x)\n \\qquad\\text{for every }y\\in\n B_{g(\\mathbf t(x))}\\bigl(x,A R(x)^{-1/2}\\bigr).\n\\]&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:61,&quot;ref&quot;:&quot;MT:ch10:10.2&quot;},{&quot;id&quot;:&quot;ff8bc7c2e43e&quot;,&quot;label&quot;:&quot;thm:normalized-short-time-ricci-flow&quot;,&quot;title&quot;:&quot;Normalized short-time flow&quot;,&quot;display_title&quot;:&quot;Theorem 2.7: Normalized short-time flow&quot;,&quot;body&quot;:&quot;There is a universal $\\kappa_0&gt;0$ such that every normalized compact\nthree-manifold $(M,g_0)$ admits a unique Ricci flow $g(t)$ on\n$[0,2^{-5}]$ with $g(0)=g_0$.  On this interval\n\\[\n |\\operatorname{Rm}_{g(t)}|\\le2,\n \\qquad\n \\operatorname{Vol}_{g(t)}B_{g(t)}(x,\\rho)\\ge\\kappa_0\\rho^3\n \\quad(0&lt;\\rho\\le1).\n\\]\nConsequently this interval has no surgery time and supplies the initial\nstage of a controlled Ricci flow with surgery.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&
