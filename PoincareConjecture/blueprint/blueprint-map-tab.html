ree-manifold with $\\pi_1(X)$ a nontrivial free product or\n$\\pi_1(X)\\cong\\mathbb Z$,\nthen\n$\\pi_2(X)\\ne0$.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Late-Component _3 Topology&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:143,&quot;ref&quot;:&quot;MT:ch18:18.20&quot;},{&quot;id&quot;:&quot;15ee9318bfae&quot;,&quot;label&quot;:&quot;thm:finite-cover-homotopy-three-sphere&quot;,&quot;title&quot;:&quot;Finite fundamental group and the universal cover&quot;,&quot;display_title&quot;:&quot;Theorem 5.15: Finite fundamental group and the universal cover&quot;,&quot;body&quot;:&quot;Let $X$ be a closed connected three-manifold with finite fundamental group\nand $\\pi_2(X)=0$.  Its universal cover $\\widetilde X$ is a homotopy\nthree-sphere, and covering projection induces\n\\[\n \\pi_3(\\widetilde X)\\cong\\pi_3(X)\\cong\\mathbb Z.\n\\]&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Late-Component _3 Topology&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:144,&quot;ref&quot;:&quot;MT:ch18:18.19,Hatcher:ch3:3.30,Hatcher:ch4:4.32&quot;},{&quot;id&quot;:&quot;6b365de62a4e&quot;,&quot;label&quot;:&quot;thm:late-component-nontrivial-pi3&quot;,&quot;title&quot;:&quot;Nonzero _3 on a late surviving component&quot;,&quot;display_title&quot;:&quot;Theorem 5.16: Nonzero _3 on a late surviving component&quot;,&quot;body&quot;:&quot;Let $T_1$ be as in \\ref{thm:eventual-pi2-vanishing}, and assume the initial\nfundamental groups are free products of finite groups and infinite cyclic\ngroups.  If $\\mathcal X$ is a component path defined on $[T_1,T_2]$, then\n\\[\n \\pi_3(\\mathcal X(T_1))\\cong\\mathbb Z.\n\\]\nIn particular it contains a nonzero class.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Late-Component _3 Topology&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:145,&quot;ref&quot;:&quot;MT:ch18:18.19&quot;}]},{&quot;id&quot;:&quot;the-loop-space-width-interface&quot;,&quot;title&quot;:&quot;The Loop-Space Width Interface&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;3a6bc0d9a9d7&quot;,&quot;label&quot;:&quot;lem:loop-space-quotient-wedge&quot;,&quot;title&quot;:&quot;The quotient and wedge model&quot;,&quot;display_title&quot;:&quot;Lemma 5.17: The quotient and wedge model&quot;,&quot;body&quot;:&quot;For $c_0\\in S^2$, the quotient\n\\[\n Q=(S^2\\times S^1)/(\\{c_0\\}\\times S^1)\n\\]\nis homotopy equivalent to $S^2\\vee S^3$.  Consequently, for every based\nspace $X$ of CW type,\n\\[\n [Q,X]_*\\cong\\pi_2(X)\\times\\pi_3(X).\n\\]&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;The Loop-Space Width Interface&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:146,&quot;ref&quot;:&quot;MT:ch18:18.16&quot;},{&quot;id&quot;:&quot;6bad96de75b2&quot;,&quot;label&quot;:&quot;lem:loop-space-universal-cover-lift&quot;,&quot;title&quot;:&quot;Lifting null-loop families&quot;,&quot;display_title&quot;:&quot;Lemma 5.18: Lifting null-loop families&quot;,&quot;body&quot;:&quot;Let $p\\colon\\widetilde X\\to X$ be the universal cover of a connected\nmanifold.  A continuous family $\\Gamma\\colon S^2\\to\\Lambda_0X$ lifts, after\nchoosing one lift of one marked point, to a continuous family of loops in\n$\\widetilde X$.  Homotopies lift in the same way, and changing the initial\nlift acts by one deck transformation on the entire lifted family.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;The Loop-Space Width Interface&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:147,&quot;ref&quot;:&quot;MT:ch18:18.16&quot;},{&quot;id&quot;:&quot;88699ab8e34d&quot;,&quot;label&quot;:&quot;thm:loop-space-pi3-identification&quot;,&quot;title&quot;:&quot;Free-loop-space identification of _3&quot;,&quot;display_title&quot;:&quot;Theorem 5.19: Free-loop-space identification of _3&quot;,&quot;body&quot;:&quot;If $X$ is compact, connected, and $\\pi_2(X,x_0)=0$, then adjunction induces\nan isomorphism\n\\[\n \\pi_2(\\Lambda_0X,*)\\cong\\pi_3(X,x_0).\n\\]\nFree homotopy classes of not necessarily based maps\n$S^2\\to\\Lambda_0X$ correspond to the orbit set of $\\pi_3(X,x_0)$ under its\nnatural $\\pi_1(X,x_0)$-action.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;The Loop-Space Width Interface&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:148,&quot;ref&quot;:&quot;MT:ch18:18.16&quot;},{&quot;id&quot;:&quot;6ead31810534&quot;,&quot;label&quot;:&quot;def:loop-family-width&quot;,&quot;title&quot;:&quot;Loop-family width&quot;,&quot;display_title&quot;:&quot;Definition 5.20: Loop-family width&quot;,&quot;body&quot;:&quot;For a null-homotopic $C^1$ loop $\\gamma$ in a compact Riemannian manifold,\nlet\n\\[\n \\mathcal A_g(\\gamma)=\\inf_F\\operatorname{Area}_g(F),\n\\]\nwhere $F\\colon D^2\\to X$ ranges over Lipschitz maps whose boundary agrees\nwith $\\gamma$ up to orientation-preserving reparameterization.  For a\ncontinuous family $\\Gamma\\colon S^2\\to\\Lambda_0X$, put\n\\[\n W_g(\\Gamma)=\\max_{c\\in S^2}\\mathcal A_g(\\Gamma(c)).\n\\]\nIf $\\xi\\in\\pi_3(X)$, let $[\\xi]$ be its $\\pi_1(X)$-orbit.  By\n\\ref{thm:loop-space-pi3-identification}, this orbit corresponds to a free\nhomotopy class of loop families.  Define\n\\[\n W_g(\\xi)=\\inf_{[\\Gamma]=[\\xi]}W_g(\\Gamma),\n\\]\nwhere representatives need not preserve the base point.  Thus $W_g$ is\nconstant on every $\\pi_1(X)$-orbit.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;The Loop-Space Width Interface&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:149,&quot;ref&quot;:&quot;MT:ch18:18.17&quot;},{&quot;id&quot;:&quot;67b3fec08fc1&quot;,&quot;label&quot;:&quot;lem:least-spanning-area-continuity&quot;,&quot;title&quot;:&quot;Continuity of least spanning area&quot;,&quot;display_title&quot;:&quot;Lemma 5.21: Continuity of least spanning area&quot;,&quot;body&quot;:&quot;The function $\\gamma\\mapsto\\mathcal A_g(\\gamma)$ is finite and continuous\non $\\Lambda_0X$ in the $C^1$ topology.  More precisely, two sufficiently\n$C^1$-close loops cobound a Lipschitz annulus whose area tends to zero with\ntheir $C^1$ distance, and\n\\[\n |\\mathcal A_g(\\gamma_0)-\\mathcal A_g(\\gamma_1)|\n \\le\\inf\\{\\operatorname{Area}_g(A):\\partial A=\\gamma_0\\sqcup\\gamma_1\\}.\n\\]&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;The Loop-Space Width Interface&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:150,&quot;ref&quot;:&quot;MT:ch18:18.17&quot;}]},{&quot;id&quot;:&quot;the-width-comparison-ode&quot;,&quot;title&quot;:&quot;The Width Comparison ODE&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;e57b0a4ff9d7&quot;,&quot;label&quot;:&quot;def:loop-width-comparison-ode&quot;,&quot;title&quot;:&quot;Comparison equation&quot;,&quot;display_title&quot;:&quot;Definition 5.22: Comparison equation&quot;,&quot;body&quot;:&quot;For a compact Ricci flow $(M,g(t))$, $t\\in[t_0,t_1]$, and\n$t&#x27;\\in[t_0,t_1]$, let $w_{a,t&#x27;}$ be the solution of\n\\[\n w&#x27;=-2\\pi-\\frac12R_{\\min}(t)w,\n \\qquad w(t&#x27;)=a.\n\\]\nWrite $w_a=w_{a,t_0}$.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;The Width Comparison ODE&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:151,&quot;ref&quot;:&quot;MT:ch18:18.23&quot;},{&quot;id&quot;:&quot;c62f7c1e78a3&quot;,&quot;label&quot;:&quot;lem:loop-width-ode-formula&quot;,&quot;title&quot;:&quot;Integrating-factor formula&quot;,&quot;display_title&quot;:&quot;Lemma 5.23: Integrating-factor formula&quot;,&quot;body&quot;:&quot;Put\n\\[\n B_{t&#x27;}(t)=\\int_{t&#x27;}^t\\frac12R_{\\min}(s)\\,ds.\n\\]\nThen, for $t&#x27;&#x27;\\ge t&#x27;$,\n\\[\n w_{a,t&#x27;}(t&#x27;&#x27;)=e^{-B_{t&#x27;}(t&#x27;&#x27;)}\n \\left(a-2\\pi\\int_{t&#x27;}^{t&#x27;&#x27;}e^{B_{t&#x27;}(s)}\\,ds\\right).\n\\]\nIf $a&#x27;\\ge a$, then\n\\[\n w_{a&#x27;,t&#x27;}(t&#x27;&#x27;)-w_{a,t&#x27;}(t&#x27;&#x27;)\n =(a&#x27;-a)e^{-B_{t&#x27;}(t&#x27;&#x27;)}\\ge0.\n\\]\nOn a fixed compact time interval this difference is bounded by a constant\ntimes $a&#x27;-a$.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;The Width Comparison ODE&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:152,&quot;ref&quot;:&quot;MT:ch18:18.25,MT:ch18:18.26&quot;}]},{&quot;id&quot;:&quot;controlled-loop-family-deformation&quot;,&quot;title&quot;:&quot;Controlled Loop-Family Deformation&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;46001210b234&quot;,&quot;label&quot;:&quot;thm:least-disk-area-variation-interface&quot;,&quot;title&quot;:&quot;Least-disk variation interface&quot;,&quot;display_title&quot;:&quot;Theorem 5.24: Least-disk variation interface&quot;,&quot;body&quot;:&quot;Assume Plateau minimizers for the relevant null-homotopic curves exist with\nthe required boundary regularity, and that their moving-boundary first\nvariation is valid.  Let $g(t)$ be a Ricci flow on a compact three-manifold and let\n$\\gamma(t)$ be a smooth curve-shrinking flow of null-homotopic immersed\nloops.  Then $t\\mapsto\\mathcal A_{g(t)}(\\gamma(t))$ is continuous and, at\nevery time at which the flow is smooth,\n\\[\n D^+\\mathcal A_{g(t)}(\\gamma(t))\n \\le-2\\pi-\\frac12R_{\\min}(t)\n       \\mathcal A_{g(t)}(\\gamma(t)).\n\\]&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Controlled Loop-Family Deformation&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:153,&quot;ref&quot;:&quot;MT:ch19:19.2,MT:ch19:19.4&quot;},{&quot;id&quot;:&quot;2e2a150f9e0c&quot;,&quot;label&quot;:&quot;thm:annular-douglas-minimizer&quot;,&quot;title&quot;:&quot;Regularity of an attained annular minimizer&quot;,&quot;display_title&quot;:&quot;Theorem 5.25: Regularity of an attained annular minimizer&quot;,&quot;body&quot;:&quot;Let $(N,h)$ be a compact real-analytic Riemannian manifold of dimension at\nleast three.  Let $c_0,c_1$ be disjoint embedded real-analytic closed curves\nwhich are freely homotopic and homotopically nontrivial.  Suppose an admissible\nspanning annulus $F_0$ attains the annular area infimum, and that there is\n$\\rho&gt;0$ such that, for every essential simple closed curve $\\alpha$ in its\ndomain,\n\\[\n L_h(F_0\\circ\\alpha)\\ge\\rho.\n\\]\nAfter replacing $F_0$ by its conformal harmonic representative in the same\nminimizing class, it has finite interior branch set, is real analytic up to\nits real-analytic boundary, and has no true boundary branch point.  False\nboundary branch points are not excluded.  There are interior parallel\nboundary curves avoiding the finite branch set which converge to the original\nboundary and whose intervening collar areas tend to zero.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Controlled Loop-Family Deformation&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:154,&quot;ref&quot;:&quot;MT:ch19:19.15, white-classical-area-minimizing-surfaces:page-0001, white-classical-area-minimizing-surfaces:page-0002&quot;},{&quot;id&quot;:&quot;f538fa47d10b&quot;,&quot;label&quot;:&quot;lem:ramp-annulus-nondegeneration&quot;,&quot;title&quot;:&quot;Ramp nondegeneration&quot;,&quot;display_title&quot;:&quot;Lemma 5.26: Ramp nondegeneration&quot;,&quot;body&quot;:&quot;Let $c_0,c_1\\colon S^1\\to M\\times S^1_\\lambda$ be degree-one ramps in the\nsame free homotopy class, and let\n$F\\colon S^1\\times[0,1]\\to M\\times S^1_\\lambda$ span them.  For every\nessential simple closed domain curve $\\alpha$,\n\\[\n L(F\\circ\\alpha)\\ge L(S^1_\\lambda)&gt;0.\n\\]\nThe same bound holds while both curves evolve by smooth curve shrinking.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Controlled Loop-Family Deformation&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:155,&quot;ref&quot;:&quot;MT:ch19:19.15&quot;},{&quot;id&quot;:&quot;9dff0d1643ad&quot;,&quot;label&quot;:&quot;lem:annular-area-infimum-variation&quot;,&quot;title&quot;:&quot;Variation of the annular area infimum&quot;,&quot;display_title&quot;:&quot;Lemma 5.27: Variation of the annular area infimum&quot;,&quot;body&quot;:&quot;Let $n=\\dim M\\ge3$, and let $c_0(t),c_1(t)$ be degree-one ramp\ncurve-shrinking flows in $(M,g(t))\\times S^1_\\lambda$ in the same free\nhomotopy class.  Assume that, for each time under consideration, the annular\ninfimum is attained by a minimizer satisfying the hypotheses of\n\\ref{thm:annular-douglas-minimizer}.  If $\\mu(t)$ is the infimum of the areas\nof spanning annuli,\nthen $\\mu$ is continuous and\n\\[\n D^+\\mu(t)\\le(2n-1)\\max_M|\\operatorname{Rm}_{g(t)}|\\,\\mu(t).\n\\]\nConsequently $\\mu(t)\\le e^{C(t-s)}\\mu(s)$ on a compact time interval, with\n$C$ independent of $\\lambda$.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Controlled Loop-Family Deformation&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:156,&quot;ref&quot;:&quot;MT:ch19:19.15&quot;},{&quot;id&quot;:&quot;91c8a69f2407&quot;,&quot;label&quot;:&quot;thm:small-annulus-length-transfer&quot;,&quot;title&quot;:&quot;Small-annulus length transfer&quot;,&quot;display_title&quot;:&quot;Theorem 5.28: Small-annulus length transfer&quot;,&quot;body&quot;:&quot;Assume the local quantitative annular graph estimate for ramps: under the\ncurvature and small-turning hypotheses displayed below, an annulus of area\nless than $\\mu_0$ cannot reduce the boundary length by more than the stated\nfactor, uniformly in $\\lambda$.  There is $\\delta_0&gt;0$ with the following\nproperty.  For every $r&gt;0$ and every\nambient sectional-curvature upper bound $K$, there is $\\mu_0&gt;0$ such that if\ntwo ramps $\\gamma,\\widehat\\gamma$ in $M\\times S^1_\\lambda$ cobound an\nannulus of area below $\\mu_0$, and\n\\[\n L(\\gamma)\\ge r,\n \\qquad\n \\int_I|H_\\gamma|\\,ds&lt;\\delta_0\n\\]\nfor every length-$r$ subarc $I\\subset\\gamma$, then\n\\[\n L(\\widehat\\gamma)\\ge\\frac34L(\\gamma).\n\\]\nThe constants are uniform in $\\lambda$.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Controlled Loop-Family Deformation&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:157,&quot;ref&quot;:&quot;MT:ch19:19.31,MT:ch19:19.35&quot;},{&quot;id&quot;:&quot;31a90c8d1eb2&quot;,&quot;label&quot;:&quot;thm:controlled-loop-family-deformation&quot;,&quot;title&quot;:&quot;Controlled deformation of a loop family&quot;,&quot;display_title&quot;:&quot;Theorem 5.29: Controlled deformation of a loop family&quot;,&quot;body&quot;:&quot;Assume the least-disk, attained-annulus, annular-transfer, and compact-family\ncurve-shrinking interfaces in the dependency list hold uniformly on\n$[t_0,t_1]$, including their stated regularity and nondegeneracy hypotheses.\nLet $g(t)$ be a Ricci flow on a compact three-manifold for\n$t\\in[t_0,t_1]$, let $\\Gamma\\colon S^2\\to\\Lambda_0M$ be continuous, and\nlet $\\zeta&gt;0$.  There is a continuous family\n$\\widetilde\\Gamma(t)\\colon S^2\\to\\Lambda_0M$ such that\n$[\\widetilde\\Gamma(t_0)]=[\\Gamma]$ and, for every $c\\in S^2$,\n\\[\n |\\mathcal A_{g(t_0)}(\\widetilde\\Gamma(t_0)(c))\n   -\\mathcal A_{g(t_0)}(\\Gamma(c))|&lt;\\zeta,\n\\]\nand at least one of the following holds:\n\\begin{enumerate}\n\\item $L_{g(t_1)}(\\widetilde\\Gamma(t_1)(c))&lt;\\zeta$;\n\\item\n\\[\n \\mathcal A_{g(t_1)}(\\widetilde\\Gamma(t_1)(c))\n \\le w_{\\mathcal A_{g(t_0)}(\\widetilde\\Gamma(t_0)(c)),t_0}(t_1)+\\zeta.\n\\]\n\\end{enumerate}&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Controlled Loop-Family Deformation&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:158,&quot;ref&quot;:&quot;MT:ch18:18.24&quot;}]},{&quot;id&quot;:&quot;3-width-evolution-through-surgery&quot;,&quot;title&quot;:&quot;_3-Width Evolution Through Surgery&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;051e2016bc24&quot;,&quot;label&quot;:&quot;thm:surgery-pi3-class-transport&quot;,&quot;title&quot;:&quot;Transport of a nonzero third-homotopy class&quot;,&quot;display_title&quot;:&quot;Theorem 5.30: Transport of a nonzero third-homotopy class&quot;,&quot;body&quot;:&quot;Let $\\mathcal X$ be a component path on $[t_0,t_1]$ with only finitely many\nsurgery times, with\n$\\pi_2(\\mathcal X(t_0))=0$ and\n$\\pi_3(\\mathcal X(t_0))\\cong\\mathbb Z$, and let\n$0\\ne\\xi(t_0)\\in\\pi_3(\\mathcal X(t_0))$.  Then $\\pi_2(\\mathcal X(t))=0$\nfor every $t$, and there is a compatible family of nonzero classes\n$\\xi(t)\\in\\pi_3(\\mathcal X(t))$.  At a surgery time $T$, the maps\n$F_t\\colon\\mathcal X(t)\\to\\mathcal X(T)$ of\n\\ref{thm:trivial-surgery-component-map}, for $t&lt;T$ sufficiently close to $T$,\nsatisfy\n\\[\n (F_t)_*\\xi(t)=\\xi(T).\n\\]&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;_3-Width Evolution Through Surgery&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:159,&quot;ref&quot;:&quot;MT:ch18:18.18,MT:ch15:15.12&quot;},{&quot;id&quot;:&quot;516f19e15e63&quot;,&quot;label&quot;:&quot;lem:loop-width-regular-continuity&quot;,&quot;title&quot;:&quot;Continuity of loop-family width at regular times&quot;,&quot;display_title&quot;:&quot;Lemma 5.31: Continuity of loop-family width at regular times&quot;,&quot;body&quot;:&quot;The function $W_\\xi$ is continuous at every nonsurgery time.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;_3-Width Evolution Through Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:160,&quot;ref&quot;:&quot;MT:ch18:18.21&quot;},{&quot;id&quot;:&quot;42e93ee61505&quot;,&quot;label&quot;:&quot;lem:loop-width-surgery-lower-semicontinuity&quot;,&quot;title&quot;:&quot;Loop-family width at a surgery time&quot;,&quot;display_title&quot;:&quot;Lemma 5.32: Loop-family width at a surgery time&quot;,&quot;body&quot;:&quot;At a surgery time $T$,\n\\[\n W_\\xi(T)\\le\\liminf_{t\\uparrow T}W_\\xi(t).\n\\]&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;_3-Width Evolution Through Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:161,&quot;ref&quot;:&quot;MT:ch18:18.22,MT:ch15:15.12&quot;},{&quot;id&quot;:&quot;0a7c95bee89d&quot;,&quot;label&quot;:&quot;lem:short-loops-small-disk&quot;,&quot;title&quot;:&quot;Short loops bound small-area disks&quot;,&quot;display_title&quot;:&quot;Lemma 5.33: Short loops bound small-area disks&quot;,&quot;body&quot;:&quot;Let $(X,g)$ be compact.  For every $\\eta&gt;0$ there is\n$0&lt;\\zeta&lt;\\eta/2$ such that every $C^1$ loop of length less than $\\zeta$\nbounds a Lipschitz disk of area less than $\\eta$.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;_3-Width Evolution Through Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:162,&quot;ref&quot;:&quot;MT:ch18:18.28&quot;},{&quot;id&quot;:&quot;9b1d8806cf9e&quot;,&quot;label&quot;:&quot;lem:short-loop-families-trivial&quot;,&quot;title&quot;:&quot;Short loop families are trivial&quot;,&quot;display_title&quot;:&quot;Lemma 5.34: Short loop families are trivial&quot;,&quot;body&quot;:&quot;Let $(X,g)$ be compact with $\\pi_2(X)=0$.  There is $\\zeta&gt;0$ such that any\ncontinuous family $\\Gamma\\colon S^2\\to\\Lambda_0X$ all of whose loops have\nlength less than $\\zeta$ represents the zero free-homotopy orbit, and hence\nthe zero class after any based choice, under\n$\\pi_2(\\Lambda_0X,*)\\cong\\pi_3(X)$.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;_3-Width Evolution Through Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:163,&quot;ref&quot;:&quot;MT:ch18:18.27&quot;},{&quot;id&quot;:&quot;f29967583a07&quot;,&quot;label&quot;:&quot;thm:loop-width-forward-inequality&quot;,&quot;title&quot;:&quot;Forward inequality for the _3 width&quot;,&quot;display_title&quot;:&quot;Theorem 5.35: Forward inequality for the _3 width&quot;,&quot;body&quot;:&quot;Let $\\mathcal X$ be a component path of a controlled surgery flow, suppose\n$\\pi_2(\\mathcal X(t_0))=0$ and\n$\\pi_3(\\mathcal X(t_0))\\cong\\mathbb Z$, and let\n$0\\ne\\xi(t_0)\\in\\pi_3(\\mathcal X(t_0))$.  For the transported class,\n$W_\\xi$ is continuous at nonsurgery times, obeys\n\\[\n W_\\xi(T)\\le\\liminf_{t\\uparrow T}W_\\xi(t)\n\\]\nat surgery times, and satisfies\n\\[\n D^+W_\\xi(t)\n \\le-2\\pi-\\frac12R_{\\min}(t)W_\\xi(t)\n\\]\non the immediate right of every time in the component path.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;_3-Width Evolution Through Surgery&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:164,&quot;ref&quot;:&quot;MT:ch18:18.18&quot;}]},{&quot;id&quot;:&quot;finite-extinction&quot;,&quot;title&quot;:&quot;Finite Extinction&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;eb500921cc59&quot;,&quot;label&quot;:&quot;thm:free-product-excludes-two-sided-projective-plane&quot;,&quot;title&quot;:&quot;The free-product hypothesis excludes a two-sided projective plane&quot;,&quot;display_title&quot;:&quot;Theorem 5.36: The free-product hypothesis excludes a two-sided projective plane&quot;,&quot;body&quot;:&quot;Assume the corresponding closed three-manifold projective-plane theorem: a\ntwo-sided embedded $\\mathbb{RP}^2$ gives a forbidden free-product factor in\nthe fundamental group.  Let $M$ be a closed connected three-manifold whose\nfundamental group is a\nfree product of finite groups and infinite cyclic groups.  Then $M$ contains\nno embedded $\\mathbb{RP}^2$ with trivial normal bundle.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Finite Extinction&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:165,&quot;ref&quot;:&quot;MT:ch18:18.1&quot;},{&quot;id&quot;:&quot;7a54ac1a4b27&quot;,&quot;label&quot;:&quot;thm:finite-time-extinction&quot;,&quot;title&quot;:&quot;Finite-time extinction&quot;,&quot;display_title&quot;:&quot;Theorem 5.37: Finite-time extinction&quot;,&quot;body&quot;:&quot;Let $(M,g_0)$ be a compact connected normalized Riemannian three-manifold\nwhose fundamental group is a free product of finite groups and infinite\ncyclic groups.  The all-time controlled Ricci flow with surgery starting from\n$(M,g_0)$ has a finite extinction time: there is $T_*&lt;\\infty$ such that\n$M_t=\\varnothing$ for every $t\\ge T_*$.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Finite Extinction&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:166,&quot;ref&quot;:&quot;MT:ch18:18.1&quot;}]}]},{&quot;id&quot;:&quot;topological-endgame&quot;,&quot;title&quot;:&quot;Topological Endgame&quot;,&quot;sections&quot;:[{&quot;id&quot;:&quot;smooth-connected-sums-and-prime-factors&quot;,&quot;title&quot;:&quot;Smooth Connected Sums and Prime Factors&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;74735bfad981&quot;,&quot;label&quot;:&quot;def:smooth-connected-sum&quot;,&quot;title&quot;:&quot;Smooth connected sum&quot;,&quot;display_title&quot;:&quot;Definition 6.1: Smooth connected sum&quot;,&quot;body&quot;:&quot;Let $M$ and $N$ be connected smooth $3$-manifolds without boundary.  Their\n\\emph{smooth connected sum} $M\\mathbin{\\#}N$ is obtained by deleting the\ninteriors of smoothly embedded closed $3$-balls and identifying the two\nresulting boundary spheres by a diffeomorphism.  In the oriented category the\nidentification is orientation reversing.  Connected sums with more than two\nfactors are associated arbitrarily; the resulting diffeomorphism type is\nindependent of all these choices.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Smooth Connected Sums and Prime Factors&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:167,&quot;ref&quot;:&quot;Hatcher3M:ch1:1.1&quot;},{&quot;id&quot;:&quot;5fcd85b09ca5&quot;,&quot;label&quot;:&quot;def:spherical-space-form&quot;,&quot;title&quot;:&quot;Spherical space form&quot;,&quot;display_title&quot;:&quot;Definition 6.2: Spherical space form&quot;,&quot;body&quot;:&quot;A \\emph{spherical space form} is a quotient $S^3/\\Gamma$, where $S^3$ has\nits round metric and $\\Gamma$ is a finite group acting freely by isometries.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Smooth Connected Sums and Prime Factors&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:168,&quot;ref&quot;:&quot;MT:intro:0.1&quot;},{&quot;id&quot;:&quot;5f4913b5014a&quot;,&quot;label&quot;:&quot;def:sphere-bundles-over-circle&quot;,&quot;title&quot;:&quot;The two sphere bundles over the circle&quot;,&quot;display_title&quot;:&quot;Definition 6.3: The two sphere bundles over the circle&quot;,&quot;body&quot;:&quot;Write\n\\[\n E_+=S^2\\times S^1\n \\qquad\\text{and}\\qquad\n E_-=S^1\\mathbin{\\widetilde\\times}S^2\n\\]\nfor, respectively, the orientable product bundle and the nonorientable\ntwisted smooth $S^2$-bundle over $S^1$.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Smooth Connected Sums and Prime Factors&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:169,&quot;ref&quot;:&quot;Hatcher3M:ch1:1.5&quot;},{&quot;id&quot;:&quot;ad5c0172b26d&quot;,&quot;label&quot;:&quot;thm:prime-decomposition-interface&quot;,&quot;title&quot;:&quot;Prime decomposition in the smooth category&quot;,&quot;display_title&quot;:&quot;Theorem 6.4: Prime decomposition in the smooth category&quot;,&quot;body&quot;:&quot;Assume Hatcher&#x27;s Basic 3-Manifold Topology prime-decomposition theorem,\nincluding the stated nonorientable normalization convention.\nEvery closed connected smooth $3$-manifold is a finite connected sum of prime\nsmooth $3$-manifolds.  For an orientable manifold the prime factors are unique,\nup to order and insertion or deletion of $S^3$ factors.  In the nonorientable\ncase, existence still holds, the two prime nonirreducible factors are $E_+$ and\n$E_-$, and uniqueness is restored by replacing every $E_+$ factor by $E_-$\nwhenever the remaining connected sum is nonorientable.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Smooth Connected Sums and Prime Factors&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:170,&quot;ref&quot;:&quot;Hatcher3M:ch1:1.5&quot;},{&quot;id&quot;:&quot;f32e24c7af2a&quot;,&quot;label&quot;:&quot;lem:simply-connected-three-manifold-orientable&quot;,&quot;title&quot;:&quot;A simply connected three-manifold is orientable&quot;,&quot;display_title&quot;:&quot;Lemma 6.5: A simply connected three-manifold is orientable&quot;,&quot;body&quot;:&quot;Every connected simply connected smooth $3$-manifold is orientable.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Smooth Connected Sums and Prime Factors&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:171,&quot;ref&quot;:&quot;Hatcher:ch3:3.25&quot;},{&quot;id&quot;:&quot;edd928203cd3&quot;,&quot;label&quot;:&quot;thm:positive-ricci-three-manifold-roundness&quot;,&quot;title&quot;:&quot;Hamilton roundness for positive Ricci curvature&quot;,&quot;display_title&quot;:&quot;Theorem 6.6: Hamilton roundness for positive Ricci curvature&quot;,&quot;body&quot;:&quot;Assume Hamilton&#x27;s positive-Ricci convergence and spherical-space-form\nclassification theorem in dimension three, including its diffeomorphism-level\nconclusion.  If a closed smooth $3$-manifold admits a Riemannian metric with\npositive Ricci curvature, then it admits a metric of constant positive\nsectional curvature and is diffeomorphic to a spherical space form.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Smooth Connected Sums and Prime Factors&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:172,&quot;ref&quot;:&quot;MT:ch4:4.23&quot;}]},{&quot;id&quot;:&quot;reversing-one-surgery&quot;,&quot;title&quot;:&quot;Reversing One Surgery&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;c97a532e4a8d&quot;,&quot;label&quot;:&quot;lem:whole-disappearing-component-classification&quot;,&quot;title&quot;:&quot;Whole disappearing components&quot;,&quot;display_title&quot;:&quot;Lemma 6.7: Whole disappearing components&quot;,&quot;body&quot;:&quot;If a connected component of $D$ is also a whole component of the time-$t$\nslice, then it is diffeomorphic to one of\n\\[\n S^3/\\Gamma,\\qquad \\mathbb{RP}^3\\mathbin{\\#}\\mathbb{RP}^3,\n \\qquad E_+,\n \\qquad E_-.\n\\]&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Reversing One Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:173,&quot;ref&quot;:&quot;MT:ch4:4.23,MT:ch15:15.3,MT:app:A.25&quot;},{&quot;id&quot;:&quot;0e28b2c2090b&quot;,&quot;label&quot;:&quot;lem:frontier-disappearing-component-classification&quot;,&quot;title&quot;:&quot;Frontier-bearing disappearing components&quot;,&quot;display_title&quot;:&quot;Lemma 6.8: Frontier-bearing disappearing components&quot;,&quot;body&quot;:&quot;Assume the frontier-saturation property that every point of $\\overline C$ is\ncontained in the finite neck-and-cap cover and that no additional end or cap\ncan meet the frontier.  Let $C$ be a connected component of $D$ that is not a\nwhole component of the time-$t$ slice.  Then its closure $\\overline C$ is\ndiffeomorphic, with the frontier spheres corresponding to its boundary, to\nexactly one of\n\\[\n S^2\\times[0,1],\\qquad B^3,\n \\qquad \\mathbb{RP}^3\\setminus\\operatorname{int}(B^3).\n\\]\nThe product has two frontier spheres and each of the other two alternatives\nhas one.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Reversing One Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:174,&quot;ref&quot;:&quot;MT:ch15:15.3,MT:app:A.19,MT:app:A.24&quot;},{&quot;id&quot;:&quot;e8e99e72321a&quot;,&quot;label&quot;:&quot;lem:local-capping-connected-sum-identities&quot;,&quot;title&quot;:&quot;Connected-sum effect of capping frontier spheres&quot;,&quot;display_title&quot;:&quot;Lemma 6.9: Connected-sum effect of capping frontier spheres&quot;,&quot;body&quot;:&quot;Let $X$ be a connected closed smooth $3$-manifold, let $C\\subset X$ be one of\nthe three compact regions in\n\\ref{lem:frontier-disappearing-component-classification}, and let $Y$ be\nobtained by deleting the interior of $C$ and capping every new boundary sphere\nwith a $3$-ball.\n\\begin{enumerate}\n\\item If $C\\cong B^3$, then $X\\cong Y$.\n\\item If $C\\cong\\mathbb{RP}^3\\setminus\\operatorname{int}(B^3)$, then\n  $X\\cong Y\\#\\mathbb{RP}^3$.\n\\item If $C\\cong S^2\\times[0,1]$ and its middle sphere separates $X$, then\n  $Y=Y_1\\sqcup Y_2$ and $X\\cong Y_1\\#Y_2$.\n\\item If $C\\cong S^2\\times[0,1]$ and its middle sphere does not separate $X$,\n  then $Y$ is connected and $X\\cong Y\\#E_\\varepsilon$ for some\n  $\\varepsilon\\in\\{+,-\\}$.  If $X$ is orientable, then $\\varepsilon=+$.\n\\end{enumerate}&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Reversing One Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:175,&quot;ref&quot;:&quot;MT:ch15:15.3,Hatcher3M:ch1:1.1,Hatcher3M:ch1:1.5&quot;},{&quot;id&quot;:&quot;86b927517d94&quot;,&quot;label&quot;:&quot;lem:single-surgery-connected-sum-reconstruction&quot;,&quot;title&quot;:&quot;Reconstruction across one surgery time&quot;,&quot;display_title&quot;:&quot;Lemma 6.10: Reconstruction across one surgery time&quot;,&quot;body&quot;:&quot;Assume the local surgery construction supplies the one-surgery topology\ncontract at this time.  Let $t&lt;T$ be regular and sufficiently close to a\nsurgery time $T$.  Every\ncomponent of the time-$t$ slice is a finite connected sum of components of the\ntime-$T$ slice and factors belonging to\n\\[\n \\{S^3/\\Gamma,\\mathbb{RP}^3,E_+,E_-\\}.\n\\]\nHere a disappearing $\\mathbb{RP}^3\\#\\mathbb{RP}^3$ component contributes two\n$\\mathbb{RP}^3$ factors.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Reversing One Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:176,&quot;ref&quot;:&quot;MT:ch15:15.3&quot;}]},{&quot;id&quot;:&quot;backward-reconstruction-from-extinction&quot;,&quot;title&quot;:&quot;Backward Reconstruction from Extinction&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;3fa1d46bb843&quot;,&quot;label&quot;:&quot;thm:extinction-connected-sum-classification&quot;,&quot;title&quot;:&quot;Connected-sum classification from finite extinction&quot;,&quot;display_title&quot;:&quot;Theorem 6.11: Connected-sum classification from finite extinction&quot;,&quot;body&quot;:&quot;Suppose a controlled Ricci flow with surgery starts from a connected closed\n$3$-manifold $M$ and is extinct by a finite time $T$.  Then there are finite\nfamilies of spherical space forms $P_1,\\ldots,P_r$ and sphere bundles\n$F_1,\\ldots,F_s\\in\\{E_+,E_-\\}$ such that\n\\[\n M\\cong P_1\\#\\cdots\\#P_r\\#F_1\\#\\cdots\\#F_s.\n\\]\nHere $r+s\\ge1$.\nIf $M$ is orientable, every $F_j$ is $E_+$.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Backward Reconstruction from Extinction&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:177,&quot;ref&quot;:&quot;MT:ch15:15.4,MT:intro:0.1&quot;}]},{&quot;id&quot;:&quot;connected-sums-and-fundamental-groups&quot;,&quot;title&quot;:&quot;Connected Sums and Fundamental Groups&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;d78b21365ab2&quot;,&quot;label&quot;:&quot;lem:normalized-initial-metric-exists&quot;,&quot;title&quot;:&quot;Existence of a normalized initial metric&quot;,&quot;display_title&quot;:&quot;Lemma 6.12: Existence of a normalized initial metric&quot;,&quot;body&quot;:&quot;Every closed smooth $3$-manifold admits a Riemannian metric which is normalized\nin the sense required by the all-time controlled-surgery theorem.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Connected Sums and Fundamental Groups&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:178,&quot;ref&quot;:&quot;MT:ch15:p:353&quot;},{&quot;id&quot;:&quot;da9c7ade7060&quot;,&quot;label&quot;:&quot;thm:free-product-connected-sum-classification&quot;,&quot;title&quot;:&quot;The free-product topology theorem&quot;,&quot;display_title&quot;:&quot;Theorem 6.13: The free-product topology theorem&quot;,&quot;body&quot;:&quot;Let $M$ be a closed connected smooth $3$-manifold whose fundamental group is\na free product of finite groups and infinite cyclic groups.  Then $M$ is a\nfinite connected sum of spherical space forms and copies of $E_+$ and $E_-$.\nIf $M$ is orientable, only $E_+$ occurs.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Connected Sums and Fundamental Groups&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:179,&quot;ref&quot;:&quot;MT:intro:0.1&quot;},{&quot;id&quot;:&quot;0783c5d92731&quot;,&quot;label&quot;:&quot;thm:connected-sum-fundamental-group&quot;,&quot;title&quot;:&quot;Fundamental group of a finite connected sum&quot;,&quot;display_title&quot;:&quot;Theorem 6.14: Fundamental group of a finite connected sum&quot;,&quot;body&quot;:&quot;For connected closed smooth $3$-manifolds $M_1,\\ldots,M_n$,\n\\[\n \\pi_1(M_1\\#\\cdots\\#M_n)\n \\cong \\pi_1(M_1)*\\cdots*\\pi_1(M_n).\n\\]&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Connected Sums and Fundamental Groups&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:180,&quot;ref&quot;:&quot;Hatcher:ch1:1.20&quot;},{&quot;id&quot;:&quot;5ae781823571&quot;,&quot;label&quot;:&quot;lem:trivial-free-product-factors&quot;,&quot;title&quot;:&quot;A trivial free product has trivial factors&quot;,&quot;display_title&quot;:&quot;Lemma 6.15: A trivial free product has trivial factors&quot;,&quot;body&quot;:&quot;If a finite free product $G_1*\\cdots*G_n$ is the trivial group, then every\n$G_i$ is trivial.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Connected Sums and Fundamental Groups&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:181,&quot;ref&quot;:&quot;&quot;},{&quot;id&quot;:&quot;4f6c36011bc6&quot;,&quot;label&quot;:&quot;lem:sphere-bundle-fundamental-group&quot;,&quot;title&quot;:&quot;Fundamental group of a sphere bundle over the circle&quot;,&quot;display_title&quot;:&quot;Lemma 6.16: Fundamental group of a sphere bundle over the circle&quot;,&quot;body&quot;:&quot;Both $E_+$ and $E_-$ have fundamental group isomorphic to $\\mathbb Z$.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Connected Sums and Fundamental Groups&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:182,&quot;ref&quot;:&quot;Hatcher:ch4:4.41,Hatcher:ch4:4.48&quot;},{&quot;id&quot;:&quot;716fb7663e1d&quot;,&quot;label&quot;:&quot;lem:simply-connected-spherical-space-form&quot;,&quot;title&quot;:&quot;A simply connected spherical space form&quot;,&quot;display_title&quot;:&quot;Lemma 6.17: A simply connected spherical space form&quot;,&quot;body&quot;:&quot;If a spherical space form $P$ is simply connected, then $P$ is diffeomorphic\nto $S^3$.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Connected Sums and Fundamental Groups&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:183,&quot;ref&quot;:&quot;Hatcher:ch1:1.39,Hatcher:ch1:1.40&quot;},{&quot;id&quot;:&quot;74d4b3842b0c&quot;,&quot;label&quot;:&quot;lem:three-sphere-connected-sum-identity&quot;,&quot;title&quot;:&quot;The three-sphere is the connected-sum identity&quot;,&quot;display_title&quot;:&quot;Lemma 6.18: The three-sphere is the connected-sum identity&quot;,&quot;body&quot;:&quot;For every connected closed smooth $3$-manifold $M$,\n$M\\#S^3\\cong M$.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Connected Sums and Fundamental Groups&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:184,&quot;ref&quot;:&quot;Hatcher3M:ch1:1.1&quot;}]},{&quot;id&quot;:&quot;simple-connectivity&quot;,&quot;title&quot;:&quot;Simple Connectivity&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;fc31a601123a&quot;,&quot;label&quot;:&quot;thm:poincare-conjecture&quot;,&quot;title&quot;:&quot;Poincare conjecture&quot;,&quot;display_title&quot;:&quot;Theorem 6.19: Poincare conjecture&quot;,&quot;body&quot;:&quot;Every closed smooth simply connected $3$-manifold is diffeomorphic to $S^3$.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Simple Connectivity&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:185,&quot;ref&quot;:&quot;MT:intro:0.2(a)&quot;}]}]}],&quot;nodes&quot;:[{&quot;id&quot;:&quot;0071c4676014&quot;,&quot;label&quot;:&quot;thm:eventual-pi2-vanishing&quot;,&quot;title&quot;:&quot;Eventual vanishing of _2&quot;,&quot;display_title&quot;:&quot;Theorem 5.12: Eventual vanishing of _2&quot;,&quot;body&quot;:&quot;For an all-time controlled surgery flow there is $T_1&lt;\\infty$ such that every\ncomponent of every time slice $M_T$, $T\\ge T_1$, has trivial $\\pi_2$.  Any\nsuch component with infinite fundamental group has contractible universal\ncover.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Eventual Vanishing of _2&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:141,&quot;ref&quot;:&quot;MT:ch18:18.9&quot;},{&quot;id&quot;:&quot;018d5ec3ba13&quot;,&quot;label&quot;:&quot;thm:strong-curvature-tensor-maximum-principle&quot;,&quot;title&quot;:&quot;Strong maximum principle for curvature tensors&quot;,&quot;display_title&quot;:&quot;Theorem 2.17: Strong maximum principle for curvature tensors&quot;,&quot;body&quot;:&quot;Let $\\mathcal T$ solve\n$\\partial_t\\mathcal T=\\Delta\\mathcal T+\\Psi(\\mathcal T)$ on a compact\nparabolic domain, and let $K$ be a fiberwise convex, parallel-invariant set.\nIf $\\Psi$ lies in the tangent cone of $K$ along $\\partial K$, and the initial\nand parabolic-boundary values lie in $K$, then $\\mathcal T$ remains in $K$.\nIf an invariant supporting functional is strictly positive at one interior\ninitial point, it is strictly positive at every later interior point.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Local Curvature and Neck Estimates&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:47,&quot;ref&quot;:&quot;MT:ch4:4.17,MT:ch4:4.18&quot;},{&quot;id&quot;:&quot;051e2016bc24&quot;,&quot;label&quot;:&quot;thm:surgery-pi3-class-transport&quot;,&quot;title&quot;:&quot;Transport of a nonzero third-homotopy class&quot;,&quot;display_title&quot;:&quot;Theorem 5.30: Transport of a nonzero third-homotopy class&quot;,&quot;body&quot;:&quot;Let $\\mathcal X$ be a component path on $[t_0,t_1]$ with only finitely many\nsurgery times, with\n$\\pi_2(\\mathcal X(t_0))=0$ and\n$\\pi_3(\\mathcal X(t_0))\\cong\\mathbb Z$, and let\n$0\\ne\\xi(t_0)\\in\\pi_3(\\mathcal X(t_0))$.  Then $\\pi_2(\\mathcal X(t))=0$\nfor every $t$, and there is a compatible family of nonzero classes\n$\\xi(t)\\in\\pi_3(\\mathcal X(t))$.  At a surgery time $T$, the maps\n$F_t\\colon\\mathcal X(t)\\to\\mathcal X(T)$ of\n\\ref{thm:trivial-surgery-component-map}, for $t&lt;T$ sufficiently close to $T$,\nsatisfy\n\\[\n (F_t)_*\\xi(t)=\\xi(T).\n\\]&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;_3-Width Evolution Through Surgery&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:159,&quot;ref&quot;:&quot;MT:ch18:18.18,MT:ch15:15.12&quot;},{&quot;id&quot;:&quot;05758bd0d841&quot;,&quot;label&quot;:&quot;def:two-sphere-width&quot;,&quot;title&quot;:&quot;Least nontrivial two-sphere area&quot;,&quot;display_title&quot;:&quot;Definition 5.1: Least nontrivial two-sphere area&quot;,&quot;body&quot;:&quot;Let $(X,g)$ be compact with $\\pi_2(X)\\ne0$.  Its \\emph{two-sphere width} is\n\\[\n W_2(X,g)=\\inf\\{\\operatorname{Area}_g(f):f\\colon S^2\\to X\\text{ is $C^1$ and not\n null-homotopic}\\}.\n\\]\nFor a component path $\\mathcal X$ in a Ricci flow with surgery, write\n\\[\n W_2(t)=W_2(\\mathcal X(t),g(t))\n\\]\nwhenever\n$\\pi_2(\\mathcal X(t))\\ne0$.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Two-Sphere Width Control&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:130,&quot;ref&quot;:&quot;MT:ch18:18.10&quot;},{&quot;id&quot;:&quot;05c1aec75380&quot;,&quot;label&quot;:&quot;lem:short-backward-curvature-control&quot;,&quot;title&quot;:&quot;Short backward curvature control&quot;,&quot;display_title&quot;:&quot;Lemma 3.24: Short backward curvature control&quot;,&quot;body&quot;:&quot;For every $A&lt;\\infty$ there are $D(A)&lt;\\infty$ and $\\sigma(A)&gt;0$ such that,\nin every sufficiently advanced rescaled first-failure flow, scalar curvature\nis at most $D(A)$ along each backward flow line starting in\n$B(x_{a,b},0,A)$ for as long as that line exists in\n$[-\\sigma(A),0]$.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;First-Failure Extension&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:86,&quot;ref&quot;:&quot;MT:ch17:17.9&quot;},{&quot;id&quot;:&quot;0714466fa4ba&quot;,&quot;label&quot;:&quot;thm:local-ricci-flow-derivative-estimates&quot;,&quot;title&quot;:&quot;Local Ricci-flow derivative estimates&quot;,&quot;display_title&quot;:&quot;Theorem 2.16: Local Ricci-flow derivative estimates&quot;,&quot;body&quot;:&quot;For every $m\\ge0$ there is $C_m&lt;\\infty$ with the following property.  If a\nRicci flow has a relatively compact parabolic neighborhood\n$P(x,t,r,-r^2)$ on which $|\\operatorname{Rm}|\\le r^{-2}$, then\n\\[\n |\\nabla^m\\operatorname{Rm}|\n \\le C_m r^{-m-2}\n\\]\non $P(x,t,r/2,-r^2/2)$.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Local Curvature and Neck Estimates&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:46,&quot;ref&quot;:&quot;MT:ch3:3.28,MT:ch3:3.33&quot;},{&quot;id&quot;:&quot;074ddf37c4ae&quot;,&quot;label&quot;:&quot;lem:uniform-backward-lifetime&quot;,&quot;title&quot;:&quot;Uniform backward lifetime&quot;,&quot;display_title&quot;:&quot;Lemma 3.27: Uniform backward lifetime&quot;,&quot;body&quot;:&quot;Suppose the first alternative of\n\\ref{lem:backward-parabolic-neighborhood-dichotomy} holds and the basepoints\nremain first-failure points.  The backward lifetimes $s(A)$ may then be\nchosen bounded below by one number $s_*&gt;0$ independent of $A$.  Extending\nmaximally, either the compatible neighborhoods exist for every backward\ntime, or a flow line starting in one fixed-radius zero-time based ball\nreaches a surgery cap at the finite maximal backward time with curvature\nbounded in the original first-failure normalization.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;First-Failure Extension&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:89,&quot;ref&quot;:&quot;MT:ch17:17.11&quot;},{&quot;id&quot;:&quot;0783c5d92731&quot;,&quot;label&quot;:&quot;thm:connected-sum-fundamental-group&quot;,&quot;title&quot;:&quot;Fundamental group of a finite connected sum&quot;,&quot;display_title&quot;:&quot;Theorem 6.14: Fundamental group of a finite connected sum&quot;,&quot;body&quot;:&quot;For connected closed smooth $3$-manifolds $M_1,\\ldots,M_n$,\n\\[\n \\pi_1(M_1\\#\\cdots\\#M_n)\n \\cong \\pi_1(M_1)*\\cdots*\\pi_1(M_n).\n\\]&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Connected Sums and Fundamental Groups&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:180,&quot;ref&quot;:&quot;Hatcher:ch1:1.20&quot;},{&quot;id&quot;:&quot;081e62843e0c&quot;,&quot;label&quot;:&quot;def:controlled-ricci-flow-with-surgery&quot;,&quot;title&quot;:&quot;Controlled Ricci flow with surgery&quot;,&quot;display_title&quot;:&quot;Definition 2.5: Controlled Ricci flow with surgery&quot;,&quot;body&quot;:&quot;For the fixed $C$, $\\epsilon$, and control functions, a\n\\emph{controlled Ricci flow with surgery} is a three-dimensional Ricci flow\nwith surgery satisfying the following conditions.\n\\begin{enumerate}\n\\item Every slice is compact and contains no embedded $\\mathbb{RP}^2$ with\n      trivial normal bundle.\n\\item Singular times form a discrete subset of the time interval.\n\\item Time zero is initial, and every component of $(M_0,g(0))$ is\n      normalized: $|\\operatorname{Rm}|\\le1$ and every unit ball has at least\n      half the Euclidean unit-ball volume.\n\\item At a singular time $t$, the exposed region $E_t$ is a finite disjoint\n      union of three-balls, and\n      $M_t=C_t\\cup_{\\Sigma_t}E_t$ with $\\Sigma_t=\\partial E_t$ a finite\n      union of two-spheres.\n\\item Every component of $\\Sigma_t$ is a central sphere at the prescribed\n      scale in the maximal presurgery extension to $t$.\n\\item Immediately before $t$, every point which disappears has a strong\n      $(C,\\epsilon)$-canonical neighborhood.\n\\item Between consecutive singular times the ordinary Ricci flow is maximal.\n\\end{enumerate}\nThe flow is additionally required to have curvature pinched toward positive\nand to satisfy the strong canonical-neighborhood assumption with parameter\n$r(t)$.  Its stagewise noncollapsing condition is that, whenever\n$0&lt;\\rho\\le\\epsilon$ and\n$P(x,t,\\rho,-\\rho^2)$ exists with\n$|\\operatorname{Rm}|\\le\\rho^{-2}$, either\n\\[\n \\operatorname{Vol}_{g(t)}B(x,t,\\rho)\\ge\\kappa(t)\\rho^3\n\\]\nor the component of $M_t$ containing $x$ has positive sectional curvature.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:35,&quot;ref&quot;:&quot;MT:ch15:15.9,MT:ch15:15.11&quot;},{&quot;id&quot;:&quot;0a5091c62134&quot;,&quot;label&quot;:&quot;lem:two-sphere-width-forward-inequality&quot;,&quot;title&quot;:&quot;Forward inequality for the two-sphere width&quot;,&quot;display_title&quot;:&quot;Lemma 5.8: Forward inequality for the two-sphere width&quot;,&quot;body&quot;:&quot;Along a component path with nonzero $\\pi_2$, after all essential sphere\nsurgeries have ceased, $W_2$ is continuous at regular times, satisfies\n\\[\n D^+W_2(t)\\le-4\\pi-\\frac12R_{\\min}(t)W_2(t)\n\\]\nthere, and obeys the left lower-semicontinuity inequality of\n\\ref{lem:two-sphere-width-surgery-control} at every surgery time.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Two-Sphere Width Control&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:137,&quot;ref&quot;:&quot;MT:ch18:18.11&quot;},{&quot;id&quot;:&quot;0a7c95bee89d&quot;,&quot;label&quot;:&quot;lem:short-loops-small-disk&quot;,&quot;title&quot;:&quot;Short loops bound small-area disks&quot;,&quot;display_title&quot;:&quot;Lemma 5.33: Short loops bound small-area disks&quot;,&quot;body&quot;:&quot;Let $(X,g)$ be compact.  For every $\\eta&gt;0$ there is\n$0&lt;\\zeta&lt;\\eta/2$ such that every $C^1$ loop of length less than $\\zeta$\nbounds a Lipschitz disk of area less than $\\eta$.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;_3-Width Evolution Through Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:162,&quot;ref&quot;:&quot;MT:ch18:18.28&quot;},{&quot;id&quot;:&quot;0b063eab0b67&quot;,&quot;label&quot;:&quot;prop:kappa-solution-curvature-trichotomy&quot;,&quot;title&quot;:&quot;Curvature trichotomy for kappa-solutions&quot;,&quot;display_title&quot;:&quot;Proposition 3.7: Curvature trichotomy for kappa-solutions&quot;,&quot;body&quot;:&quot;Every three-dimensional $\\kappa$-solution is exactly one of the following:\nit has positive sectional curvature at every time; it is the shrinking round\ncylinder $S^2\\times\\mathbb R$ up to scaling; or it is the free line-bundle\nquotient of that cylinder over $\\mathbb{RP}^2$.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solution Geometry and Stability&quot;,&quot;kind&quot;:&quot;proposition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:69,&quot;ref&quot;:&quot;MT:ch9:9.83&quot;},{&quot;id&quot;:&quot;0b42ab3768f4&quot;,&quot;label&quot;:&quot;thm:all-time-controlled-surgery-flow&quot;,&quot;title&quot;:&quot;All-time controlled Ricci flow with surgery&quot;,&quot;display_title&quot;:&quot;Theorem 3.32: All-time controlled Ricci flow with surgery&quot;,&quot;body&quot;:&quot;Assume the conditional noncollapsing and strong canonical-neighborhood\nextensions, together with their endpoint-transfer hypotheses, hold at every\nfinite stage.  Assume also that the local surgery construction supplies the\none-surgery connected-sum reconstruction contract at every restart.  There\nare positive nonincreasing sequences\n\\[\n \\mathbf K=(\\kappa_i)_{i\\ge0},\\qquad\n \\boldsymbol\\delta=(\\delta_i)_{i\\ge0},\\qquad\n \\mathbf r=(r_i)_{i\\ge0}\n\\]\nsuch that every normalized compact three-manifold containing no embedded\n$\\mathbb{RP}^2$ with trivial normal bundle is the initial slice of a Ricci\nflow with surgery on $[0,\\infty)$.  For $t\\in[T_i,T_{i+1})$, $x\\in M_t$, and\n$0&lt;\\rho\\le\\epsilon$, every parabolic ball satisfying the curvature hypothesis in\n\\ref{def:surgery-flow-noncollapsing} has volume at least\n$\\kappa_{i+1}\\rho^3$ unless its center lies in a positively curved component.\nThe flow satisfies the strong $(C,\\epsilon)$-canonical-neighborhood assumption\nwith parameter $r_{i+1}$, has curvature pinched toward positive, and uses\nsurgery control at most $\\delta_{i+1}$.  Its surgery times are finite on every\nbounded interval.\nAt every surgery time, the cutting and capping data also satisfy the\none-surgery connected-sum reconstruction contract, so the associated topology\nchange is part of the flow output.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;All-Time Controlled Extension&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:94,&quot;ref&quot;:&quot;MT:ch15:15.9,MT:ch15:15.10&quot;},{&quot;id&quot;:&quot;0b60ec75858a&quot;,&quot;label&quot;:&quot;cor:sphere-family-polygonal-approximation&quot;,&quot;title&quot;:&quot;Polygonal approximation of sphere families&quot;,&quot;display_title&quot;:&quot;Theorem 4.17: Polygonal approximation of sphere families&quot;,&quot;body&quot;:&quot;Let $\\Gamma\\colon S^2\\to\\Lambda M$ be a continuous $C^1$-loop family whose\nmembers are null-homotopic.  For every $\\zeta&gt;0$ there is $N$ such that, for\n$n\\ge N$, the regular polygonal family $\\Gamma_n$ is continuous, every\n$\\Gamma_n(q)$ is null-homotopic, and, uniformly in $q\\in S^2$,\n\\[\n |L(\\Gamma_n(q))-L(\\Gamma(q))|&lt;\\zeta,\n \\qquad\n |A(\\Gamma_n(q))-A(\\Gamma(q))|&lt;\\zeta.\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Polygonal Ramp Approximation&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:111,&quot;ref&quot;:&quot;MT:ch19:19.21&quot;},{&quot;id&quot;:&quot;0c66e31f8cb6&quot;,&quot;label&quot;:&quot;thm:standard-solution-canonical-neighborhoods&quot;,&quot;title&quot;:&quot;Canonical neighborhoods in the standard solution&quot;,&quot;display_title&quot;:&quot;Theorem 3.17: Canonical neighborhoods in the standard solution&quot;,&quot;body&quot;:&quot;For every sufficiently small $\\epsilon&gt;0$ there is\n$C_{\\mathrm{std}}(\\epsilon)&lt;\\infty$ such that every point $(q,t)$ of the\nstandard solution has one of the following neighborhoods:\n\\begin{enumerate}\n\\item a $(C_{\\mathrm{std}},\\epsilon)$-cap whose core contains $q$;\n\\item an evolving $\\epsilon$-neck reaching time zero, with its initial slice\n      disjoint from the cap core;\n\\item an evolving $\\epsilon$-neck defined for normalized backward time\n      $1+\\epsilon$.\n\\end{enumerate}\nThe alternatives persist for flows converging smoothly to the standard\nsolution on the corresponding parabolic neighborhoods.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Canonical Neighborhood Models&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:79,&quot;ref&quot;:&quot;MT:ch12:12.28,MT:ch12:12.32,MT:ch12:12.36&quot;},{&quot;id&quot;:&quot;0d805aef8325&quot;,&quot;label&quot;:&quot;thm:strong-canonical-neighborhood-extension&quot;,&quot;title&quot;:&quot;Extension of strong canonical neighborhoods&quot;,&quot;display_title&quot;:&quot;Theorem 3.28: Extension of strong canonical neighborhoods&quot;,&quot;body&quot;:&quot;Assume the positive-component first-failure, endpoint-transfer, pointed-limit,\nand kappa-solution canonical-neighborhood interfaces used in the proof hold\nwith constants uniform in the stage parameters.\nUnder the finite stage-$i$ parameter hypotheses of\n\\ref{thm:conditional-noncollapsing-extension}, there are\n$0&lt;r_{i+1}\\le r_i$ and\n$0&lt;\\delta_{i+1}\\le\\delta(r_{i+1})$ such that the following holds.  If a\ncontrolled Ricci flow with surgery on $[0,T)$,\n$T\\in(T_i,T_{i+1}]$, has $\\bar\\delta\\le\\delta_{i+1}$ on\n$[T_{i-1},T]$ and satisfies the stage-$i$ pinching, noncollapsing, and\ncanonical-neighborhood hypotheses before $T_i$, then it satisfies the strong\n$(C,\\epsilon)$-canonical-neighborhood assumption with parameter\n$r_{i+1}$ throughout $[0,T)$.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;First-Failure Extension&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:90,&quot;ref&quot;:&quot;MT:ch17:17.1&quot;},{&quot;id&quot;:&quot;0dabec6e7d74&quot;,&quot;label&quot;:&quot;lem:graph-flow-small-slope-comparison&quot;,&quot;title&quot;:&quot;Small-slope graph and curvature comparisons&quot;,&quot;display_title&quot;:&quot;Theorem 4.10: Small-slope graph and curvature comparisons&quot;,&quot;body&quot;:&quot;For sufficiently small $\\delta$, wherever $Y\\ne0$ the $h(t)$-angle between\n$Y$ and $Z$ is greater than $\\pi/4$, and\n\\begin{align*}\n &amp;k\\le|Y|\\le\\sqrt2k,\\\\\n &amp;|\\langle\\nabla_ZZ,Z\\rangle|&lt;(k+2\\delta)|Z|^3,\\\\\n &amp;|\\nabla_ZZ|&lt;2(|Y|+\\delta),\\\\\n &amp;|\\langle Y,Z\\rangle|\\le|Y|\\,|f_z|_{h&#x27;}(1+3\\delta).\n\\end{align*}&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Graph-Flow Coordinate Estimates&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:104,&quot;ref&quot;:&quot;MT:ch19:19.65&quot;},{&quot;id&quot;:&quot;0e28b2c2090b&quot;,&quot;label&quot;:&quot;lem:frontier-disappearing-component-classification&quot;,&quot;title&quot;:&quot;Frontier-bearing disappearing components&quot;,&quot;display_title&quot;:&quot;Lemma 6.8: Frontier-bearing disappearing components&quot;,&quot;body&quot;:&quot;Assume the frontier-saturation property that every point of $\\overline C$ is\ncontained in the finite neck-and-cap cover and that no additional end or cap\ncan meet the frontier.  Let $C$ be a connected component of $D$ that is not a\nwhole component of the time-$t$ slice.  Then its closure $\\overline C$ is\ndiffeomorphic, with the frontier spheres corresponding to its boundary, to\nexactly one of\n\\[\n S^2\\times[0,1],\\qquad B^3,\n \\qquad \\mathbb{RP}^3\\setminus\\operatorname{int}(B^3).\n\\]\nThe product has two frontier spheres and each of the other two alternatives\nhas one.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Reversing One Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:174,&quot;ref&quot;:&quot;MT:ch15:15.3,MT:app:A.19,MT:app:A.24&quot;},{&quot;id&quot;:&quot;0eb0bf7ca335&quot;,&quot;label&quot;:&quot;lem:first-failure-limit-slice-bounded-curvature&quot;,&quot;title&quot;:&quot;Bounded curvature of a first-failure limit slice&quot;,&quot;display_title&quot;:&quot;Lemma 3.26: Bounded curvature of a first-failure limit slice&quot;,&quot;body&quot;:&quot;Let a time slice of a pointed first-failure limit be complete, nonflat, and\nnonnegatively curved.  Suppose it is ordinarily $\\kappa$-noncollapsed on all\nfinite scales and is the smooth limit of slices on which points above a fixed\nscalar-curvature threshold have uniform canonical neighborhoods.  Then its\ncurvature is bounded on the whole slice.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;First-Failure Extension&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:88,&quot;ref&quot;:&quot;MT:ch11:11.7&quot;},{&quot;id&quot;:&quot;10593afc1ddd&quot;,&quot;label&quot;:&quot;lem:positive-curvature-neck-separation&quot;,&quot;title&quot;:&quot;A thin neck separates a point soul from the end&quot;,&quot;display_title&quot;:&quot;Lemma 3.10: A thin neck separates a point soul from the end&quot;,&quot;body&quot;:&quot;For sufficiently small $\\epsilon$, let $M^3$ be complete, noncompact, and\npositively curved with point soul $p$.  The central sphere of every\n$\\epsilon$-neck disjoint from $p$ separates $p$ from the unique end.  Two\ndisjoint such central spheres bound a region diffeomorphic to\n$S^2\\times[0,1]$.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solution Geometry and Stability&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:72,&quot;ref&quot;:&quot;MT:ch2:2.19&quot;},{&quot;id&quot;:&quot;10dc951be346&quot;,&quot;label&quot;:&quot;lem:ramp-slope-evolution&quot;,&quot;title&quot;:&quot;Evolution equation for the ramp slope&quot;,&quot;display_title&quot;:&quot;Theorem 4.5: Evolution equation for the ramp slope&quot;,&quot;body&quot;:&quot;Along a curve-shrinking flow in\n$(M,g(t))\\times(S^1_\\lambda,ds^2)$, the function\n$u=\\langle S,U\\rangle$ satisfies\n\\[\n \\partial_tu=u&#x27;&#x27;+(k^2+\\operatorname{Ric}(S,S))u\n \\ge u&#x27;&#x27;-C&#x27;u,\n\\]\nwhere $C&#x27;$ is any upper bound for the norm of the Ricci tensor of $g(t)$.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Product-Circle Geometry and Ramp Setup&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:99,&quot;ref&quot;:&quot;MT:ch19:19.11&quot;},{&quot;id&quot;:&quot;125231b4985e&quot;,&quot;label&quot;:&quot;thm:hamilton-compactness-generalized-flows&quot;,&quot;title&quot;:&quot;Pointed Ricci-flow compactness&quot;,&quot;display_title&quot;:&quot;Theorem 2.25: Pointed Ricci-flow compactness&quot;,&quot;body&quot;:&quot;Let $(\\mathcal M_j,G_j,x_j)$ be based generalized Ricci flows with base time\nzero, defined on a common open time interval $I$.  Suppose that for every\n$A&lt;\\infty$ and compact $J\\Subset I$ containing zero, all sufficiently large\n$j$ admit compatible embeddings\n\\[\n B_{g_j(0)}(x_j,A)\\times J\\longrightarrow\\mathcal M_j\n\\]\nwith compact zero-time balls and a uniform curvature bound on the images.\nAssume that for some $r_0,\\kappa&gt;0$,\n\\[\n \\operatorname{Vol}_{g_j(0)}B(x_j,r_0)\\ge\\kappa r_0^3.\n\\]\nAfter passing to a subsequence, the flows converge smoothly on compact\nspacetime subsets.  The limit is a pointed Ricci flow\n\\[\n (M_\\infty,g_\\infty(t),x_\\infty)\n\\]\non $I$, and its time-zero slice is complete.  If\n$\\operatorname{Ric}_{g_\\infty(t)}\\ge0$ for $t\\le0$, then every nonpositive\ntime slice of the limit is complete.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:55,&quot;ref&quot;:&quot;MT:ch5:5.14,MT:ch5:5.15&quot;},{&quot;id&quot;:&quot;13cdca21cc2c&quot;,&quot;label&quot;:&quot;thm:separating-neck-centers-form-tube&quot;,&quot;title&quot;:&quot;Separating neck centers lie in an epsilon-tube&quot;,&quot;display_title&quot;:&quot;Theorem 1.26: Separating neck centers lie in an epsilon-tube&quot;,&quot;body&quot;:&quot;There is $\\epsilon_0&gt;0$ such that the following holds for\n$0&lt;\\epsilon\\le\\epsilon_0$.  Let $X$ be a connected subset of a Riemannian\nthree-manifold $M$.  Suppose every $x\\in X$ is the center of an\n$\\epsilon$-neck and every corresponding central sphere separates $M$.\nThen a subcollection of these necks, after reversing axial coordinates when\nnecessary, is a balanced chain whose union contains $X$.  Consequently\n$X$ lies in an $\\epsilon$-tube.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:25,&quot;ref&quot;:&quot;MT:app:A.19&quot;},{&quot;id&quot;:&quot;13fdfedbc3df&quot;,&quot;label&quot;:&quot;lem:minimum-reduced-length-comparison&quot;,&quot;title&quot;:&quot;Minimum reduced-length comparison&quot;,&quot;display_title&quot;:&quot;Lemma 2.12: Minimum reduced-length comparison&quot;,&quot;body&quot;:&quot;Suppose that on every slice of a smooth backward-time interval the minimum\n\\[\n m(\\tau)=\\min_y l_x(y,\\tau)\n\\]\nis attained, and that the union of the minimizing sets over compact\nsubintervals is compact.  Then $m$ is continuous and\n\\[\n D^+m(\\tau)\\le\\frac{3/2-m(\\tau)}{\\tau}.\n\\]\nIf $\\limsup_{\\tau\\downarrow0}m(\\tau)\\le3/2$, then\n$m(\\tau)\\le3/2$ throughout the interval.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Reduced Geometry&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:42,&quot;ref&quot;:&quot;MT:ch7:7.10,MT:ch7:7.11,MT:ch7:7.12&quot;},{&quot;id&quot;:&quot;1548fac8b0f3&quot;,&quot;label&quot;:&quot;lem:epsilon-neck-metric-control&quot;,&quot;title&quot;:&quot;Metric control in a small epsilon-neck&quot;,&quot;display_title&quot;:&quot;Lemma 1.21: Metric control in a small epsilon-neck&quot;,&quot;body&quot;:&quot;Write $d_N$ for the intrinsic distance induced by the restriction of the\nambient metric to $N$.  The estimates below are intrinsic to the neck; no\nambient no-shortcut assertion is being made.\nFor every $0&lt;\\alpha&lt;1/8$, all sufficiently small $\\epsilon$ have the\nfollowing property.  If $N$ is an $\\epsilon$-neck of scale $r_N$ centered\nat $x$, then scalar curvatures on $N$ lie between\n$(1-\\alpha)r_N^{-2}$ and $(1+\\alpha)r_N^{-2}$.  Neck spheres have\ndiameter at most $(1+\\alpha)\\sqrt2\\pi r_N$, and points with sufficiently\nlarge axial separation, namely\n$|s_N(q)-s_N(p)|\\ge\\epsilon^{-1}/100$ or\n$d_N(p,q)\\ge r_N\\epsilon^{-1}/100$, satisfy\n\\[\n (1-\\alpha)r_N|s_N(q)-s_N(p)|\n \\le d_N(p,q)\n \\le(1+\\alpha)r_N|s_N(q)-s_N(p)|.\n\\]\nIn particular, every path contained in $N$ and joining its two end regions has length at least\n$2(1-\\alpha)r_N\\epsilon^{-1}$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:20,&quot;ref&quot;:&quot;MT:app:A.2,MT:app:A.5&quot;},{&quot;id&quot;:&quot;15ee9318bfae&quot;,&quot;label&quot;:&quot;thm:finite-cover-homotopy-three-sphere&quot;,&quot;title&quot;:&quot;Finite fundamental group and the universal cover&quot;,&quot;display_title&quot;:&quot;Theorem 5.15: Finite fundamental group and the universal cover&quot;,&quot;body&quot;:&quot;Let $X$ be a closed connected three-manifold with finite fundamental group\nand $\\pi_2(X)=0$.  Its universal cover $\\widetilde X$ is a homotopy\nthree-sphere, and covering projection induces\n\\[\n \\pi_3(\\widetilde X)\\cong\\pi_3(X)\\cong\\mathbb Z.\n\\]&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Late-Component _3 Topology&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:144,&quot;ref&quot;:&quot;MT:ch18:18.19,Hatcher:ch3:3.30,Hatcher:ch4:4.32&quot;},{&quot;id&quot;:&quot;1686838a0532&quot;,&quot;label&quot;:&quot;thm:reduced-volume-transfer&quot;,&quot;title&quot;:&quot;Quantitative reduced-volume transfer&quot;,&quot;display_title&quot;:&quot;Theorem 2.15: Quantitative reduced-volume transfer&quot;,&quot;body&quot;:&quot;Let $x$ be the terminal point at time $T$, let $0&lt;\\bar\\tau&lt;T$, and let\n$E$ be a measurable subset of the regular reduced-exponential image at\nbackward time $\\bar\\tau$.  Let\n\\[\n d\\mu_{\\bar\\tau}(y)=(4\\pi\\bar\\tau)^{-3/2}\n e^{-l_x(y,\\bar\\tau)}\\,d\\operatorname{Vol}_{g(T-\\bar\\tau)}(y)\n \\quad (y\\in E).\n\\]\nAssume the minimizing curves defining $l_x$ remain in one compact smooth\ndomain.  Suppose there is a measurable endpoint map\n$F:E\\to M_T$ and that the push-forward $\\mu_T=F_*\\mu_{\\bar\\tau}$ is\nabsolutely continuous on a terminal ball, with density $\\theta_T$ satisfying\n \\[\n \\operatorname{Vol}_{g(T-\\bar\\tau)}(E)\\ge V&gt;0,\n \\qquad l_x(\\cdot,\\bar\\tau)\\le L_0\\quad\\hbox{on }E,\n \\]\nand\n\\[\n \\operatorname{supp}\\mu_T\\subset B_{g(T)}(x,\\rho),\n \\qquad 0\\le\\theta_T\\le C\\rho^{-3}\\quad\\hbox{a.e.}\n \\]\nThen\n\\[\n \\operatorname{Vol}_{g(T)}B_{g(T)}(x,\\rho)\n \\ge C^{-1}(4\\pi\\bar\\tau)^{-3/2}e^{-L_0}V\\,\\rho^3.\n\\]&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Reduced Geometry&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:45,&quot;ref&quot;:&quot;MT:ch6:6.71,MT:ch6:6.80,MT:ch8:8.1&quot;},{&quot;id&quot;:&quot;1ab62a65597f&quot;,&quot;label&quot;:&quot;lem:evolved-subarc-global-bounds&quot;,&quot;title&quot;:&quot;Uniform bounds on evolved subarcs&quot;,&quot;display_title&quot;:&quot;Theorem 4.26: Uniform bounds on evolved subarcs&quot;,&quot;body&quot;:&quot;There is $D_0&lt;\\infty$, depending only on $\\Theta$, $L_0$, and the fixed\nambient Ricci flow, such that every subarc $\\gamma_{t&#x27;}$ of length at most\n$r$ satisfies, for $t&#x27;\\le t\\le t&#x27;+\\delta r^2$,\n\\[\n \\int_{\\gamma_t}k\\,ds&lt;D_0,\\qquad L(\\gamma_t)\\le D_0r.\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Localized Total-Curvature Control&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:120,&quot;ref&quot;:&quot;MT:ch19:19.59&quot;},{&quot;id&quot;:&quot;1f26cb4f3c98&quot;,&quot;label&quot;:&quot;thm:two-sphere-width-realization&quot;,&quot;title&quot;:&quot;Realization of the two-sphere width&quot;,&quot;display_title&quot;:&quot;Theorem 5.2: Realization of the two-sphere width&quot;,&quot;body&quot;:&quot;Assume the Sacks--Uhlenbeck minimization and regularity theorem for the\nnonzero $\\pi_2$-class in this compact three-manifold.  If $(X,g)$ is compact\nand $\\pi_2(X)\\ne0$, then $W_2(X,g)&gt;0$ and there is a\nnon-null-homotopic conformal harmonic map $f\\colon S^2\\to X$, a branched\nminimal immersion away from finitely many points, such that\n\\[\n \\operatorname{Area}_g(f)=W_2(X,g).\n\\]&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Two-Sphere Width Control&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:131,&quot;ref&quot;:&quot;MT:ch18:18.10&quot;},{&quot;id&quot;:&quot;21df66602bb6&quot;,&quot;label&quot;:&quot;def:canonical-neck-cap-regions&quot;,&quot;title&quot;:&quot;Tubes, capped tubes, and neck fibrations&quot;,&quot;display_title&quot;:&quot;Definition 1.19: Tubes, capped tubes, and neck fibrations&quot;,&quot;body&quot;:&quot;An \\emph{$\\epsilon$-tube} is a submanifold diffeomorphic to\n$S^2\\times I$, for a nondegenerate interval $I$, covered by\n$\\epsilon$-necks whose central spheres are isotopic to the $S^2$ factors.\nAn open tube has no boundary.  A \\emph{$C$-capped $\\epsilon$-tube} is the\nconnected union of an open $\\epsilon$-tube and one $(C,\\epsilon)$-cap,\nglued along an end of each.  A \\emph{doubly $C$-capped\n$\\epsilon$-tube} has disjoint cap cores attached at both ends.  An\n\\emph{$\\epsilon$-fibration} is a closed connected $S^2$-bundle over\n$S^1$, covered by $\\epsilon$-necks whose central spheres are isotopic to\nthe fibers.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:18,&quot;ref&quot;:&quot;MT:ch9:9.81,MT:app:A.21,MT:app:A.25&quot;},{&quot;id&quot;:&quot;23c07f13aad2&quot;,&quot;label&quot;:&quot;prop:overlapping-epsilon-necks&quot;,&quot;title&quot;:&quot;Overlap control for small epsilon-necks&quot;,&quot;display_title&quot;:&quot;Proposition 1.22: Overlap control for small epsilon-necks&quot;,&quot;body&quot;:&quot;For every $0&lt;\\alpha\\le10^{-2}$, all sufficiently small $\\epsilon$ have\nthe following property.  If two $\\epsilon$-necks $N,N&#x27;$ intersect in a region\nmeeting the middle nine-tenths of each neck, then\ntheir scales differ by a factor in $(1-\\alpha,1+\\alpha)$, their neck-sphere\ntangent planes make angle less than $\\alpha$ on the overlap, and their\noriented axial directions agree up to sign and an error less than\n$\\alpha$.  A neck sphere of one neck contained in the other is isotopic\nthere to a neck sphere.  If the overlap meets the middle nine-tenths of one\nneck, then $N\\cap N&#x27;$ contains neck spheres from both structures which are\nisotopic within the overlap, and the relevant component of the overlap is\ndiffeomorphic to $S^2\\times(0,1)$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;proposition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:21,&quot;ref&quot;:&quot;MT:app:A.11&quot;},{&quot;id&quot;:&quot;2412c0bb3696&quot;,&quot;label&quot;:&quot;lem:bounded-flow-line-cap-exclusion&quot;,&quot;title&quot;:&quot;A cap-reaching flow line forces a canonical neighborhood&quot;,&quot;display_title&quot;:&quot;Lemma 3.20: A cap-reaching flow line forces a canonical neighborhood&quot;,&quot;body&quot;:&quot;In a rescaled first-failure sequence, suppose a point in a fixed-radius\nzero-time ball has a backward flow line of uniformly bounded scalar\ncurvature which reaches a surgery cap in uniformly bounded time.  Then the\nbase first-failure points have strong $(C,\\epsilon)$-canonical neighborhoods\nfor all sufficiently large indices.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;First-Failure Extension&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:82,&quot;ref&quot;:&quot;MT:ch17:17.7&quot;},{&quot;id&quot;:&quot;2472fed1c068&quot;,&quot;label&quot;:&quot;lem:fixed-sphere-area-distortion&quot;,&quot;title&quot;:&quot;Fixed-map area distortion&quot;,&quot;display_title&quot;:&quot;Lemma 5.4: Fixed-map area distortion&quot;,&quot;body&quot;:&quot;Let $g(t)$ be a Ricci flow on a compact manifold for\n$t\\in[t_0,t_1]$, suppose $|\\operatorname{Ric}_{g(t)}|\\le D$, and let\n$f\\colon S^2\\to M$ be $C^1$.  Then, for $s,t\\in[t_0,t_1]$,\n\\[\n e^{-4D|t-s|}\\operatorname{Area}_{g(s)}(f)\n \\le \\operatorname{Area}_{g(t)}(f)\n \\le e^{4D|t-s|}\\operatorname{Area}_{g(s)}(f).\n\\]&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Two-Sphere Width Control&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:133,&quot;ref&quot;:&quot;MT:ch18:18.13&quot;},{&quot;id&quot;:&quot;249d5e5f5ced&quot;,&quot;label&quot;:&quot;lem:metric-sphere-crosses-neck-as-fiber&quot;,&quot;title&quot;:&quot;Metric spheres cross a thin neck in a fiber sphere&quot;,&quot;display_title&quot;:&quot;Lemma 2.23: Metric spheres cross a thin neck in a fiber sphere&quot;,&quot;body&quot;:&quot;For every $\\alpha&gt;0$ there is $\\epsilon_1(\\alpha)&gt;0$ with the following\nproperty.  Let $N$ be an $\\epsilon$-neck, $\\epsilon\\le\\epsilon_1$, whose\ncentral sphere separates the ambient connected manifold.  If $z$ lies\noutside the middle two-thirds of $N$ and $p$ lies in its middle sixth, then\n$\\partial B(z,d(z,p))\\cap N$ is a topological two-sphere in the middle\nquarter of $N$, and axial projection maps it homeomorphically to a neck\nfiber.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Local Curvature and Neck Estimates&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:53,&quot;ref&quot;:&quot;MT:ch19:19.10&quot;},{&quot;id&quot;:&quot;280980cf9bde&quot;,&quot;label&quot;:&quot;thm:controlled-curve-shrinking-existence&quot;,&quot;title&quot;:&quot;Controlled curve shrinking for compact loop families&quot;,&quot;display_title&quot;:&quot;Theorem 4.35: Controlled curve shrinking for compact loop families&quot;,&quot;body&quot;:&quot;Let $g(t)$ be a Ricci flow on a compact manifold for\n$t\\in[t_0,t_1]$, and let\n$\\Gamma\\colon S^2\\to\\Lambda M$ be a continuous family of null-homotopic\nloops.  Assume that the degree-one lifts of the smooth approximating family\nadmit compact-parameter geometric curve-shrinking flows with common lifetime,\ncontinuous parameter dependence, and uniqueness up to time-dependent\nreparametrization.  Assume also that the initial ramp bounds and the\nsmall-turning hypotheses in the derivative estimates hold uniformly in\n$c\\in S^2$ and $0&lt;\\lambda&lt;1$.  Then for every $\\zeta&gt;0$ there is a homotopic family of smooth loops\n$\\widetilde\\Gamma$ with length and least spanning area within $\\zeta$ of\nthose of $\\Gamma$, and constants $L_0,\\Theta_0&lt;\\infty$ such that, for every\n$c\\in S^2$ and $0&lt;\\lambda&lt;1$, the degree-one lift\n$\\widetilde\\Gamma(c)^\\lambda\\subset M\\times S^1_\\lambda$ has a unique\ngeometric curve-shrinking flow, up to time-dependent reparametrization,\nthroughout $[t_0,t_1]$.  For each fixed $\\lambda$, these flows form a\ncontinuous family in $c$, remain ramps, obey uniform length and\ntotal-curvature bounds depending\non $L_0,\\Theta_0$ and the ambient flow, and satisfy the uniform local\ncurvature and derivative estimates above whenever the small-turning\nhypothesis holds.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Controlled Curve-Shrinking Interface&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:129,&quot;ref&quot;:&quot;MT:ch19:19.1,MT:ch19:19.10,MT:ch19:19.14,MT:ch19:19.17,MT:ch19:19.24&quot;},{&quot;id&quot;:&
