id&quot;:&quot;f52d6bda93a2&quot;,&quot;label&quot;:&quot;prop:universal-nonround-kappa&quot;,&quot;title&quot;:&quot;Universal noncollapsing for nonround kappa-solutions&quot;,&quot;display_title&quot;:&quot;Proposition 3.4: Universal noncollapsing for nonround kappa-solutions&quot;,&quot;body&quot;:&quot;Assume the endpoint-transfer hypotheses of \\ref{thm:reduced-volume-transfer}\nhold uniformly on the rescaled model balls.  There is a universal\n$\\kappa_*&gt;0$ such that every nonround\nthree-dimensional $\\kappa$-solution is a $\\kappa_*$-solution.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solutions and Asymptotic Models&quot;,&quot;kind&quot;:&quot;proposition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:66,&quot;ref&quot;:&quot;MT:ch9:9.58&quot;},{&quot;id&quot;:&quot;5685aa7f1635&quot;,&quot;label&quot;:&quot;thm:kappa-solution-compactness&quot;,&quot;title&quot;:&quot;Normalized kappa-solution compactness&quot;,&quot;display_title&quot;:&quot;Theorem 3.5: Normalized kappa-solution compactness&quot;,&quot;body&quot;:&quot;Let $(M_j,g_j(t),p_j)$ be based three-dimensional $\\kappa$-solutions with\n$R(p_j,0)=1$.  A subsequence converges smoothly on compact spacetime\nsubsets to a based $\\kappa$-solution\n\\[\n (M_\\infty,g_\\infty(t),p_\\infty)\n\\]\nwith $R(p_\\infty,0)=1$.\nIn particular, for every $A&lt;\\infty$ and $m\\ge0$ there is $C(A,m)&lt;\\infty$\nsuch that\n\\[\n \\sup_{B_{g_j(0)}(p_j,A)\\times[-A,0]}\n |\\nabla^m\\operatorname{Rm}_{g_j}|\\le C(A,m).\n\\]&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solutions and Asymptotic Models&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:67,&quot;ref&quot;:&quot;MT:ch9:9.59,MT:ch9:9.60,MT:ch9:9.62,MT:ch9:9.63,MT:ch9:9.64,MT:ch9:9.65,MT:ch9:9.66,MT:ch9:9.67,MT:ch9:9.68,MT:ch9:9.69,MT:ch9:9.70,MT:ch9:9.71&quot;}]},{&quot;id&quot;:&quot;kappa-solution-geometry-and-stability&quot;,&quot;title&quot;:&quot;Kappa-Solution Geometry and Stability&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;5d257a96cea2&quot;,&quot;label&quot;:&quot;lem:canonical-neighborhood-stability&quot;,&quot;title&quot;:&quot;Stability of canonical neighborhoods&quot;,&quot;display_title&quot;:&quot;Lemma 3.6: Stability of canonical neighborhoods&quot;,&quot;body&quot;:&quot;Fix $\\epsilon&lt;1/4$ and $C&lt;\\infty$.\n\\begin{enumerate}\n\\item A $(C,\\epsilon)$-cap, controlled component, or round component\n      persists under sufficiently small\n      $C^{\\lfloor\\epsilon^{-1}\\rfloor}$ perturbations of its metric and\n      under a sufficiently small change of center.\n\\item An evolving $\\epsilon$-neck of normalized backward length strictly\n      greater than one persists as a strong $\\epsilon$-neck under\n      sufficiently small smooth perturbations of the flow.\n\\item If $C&#x27;&gt;C$ and $\\epsilon&#x27;&gt;\\epsilon$, sufficiently close pointed\n      metrics carry a $(C&#x27;,\\epsilon&#x27;)$-canonical neighborhood at the\n      corresponding point.\n\\end{enumerate}\nIn particular, strong neck centers form an open spacetime set.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solution Geometry and Stability&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:68,&quot;ref&quot;:&quot;MT:ch9:9.79,MT:ch9:9.80&quot;},{&quot;id&quot;:&quot;0b063eab0b67&quot;,&quot;label&quot;:&quot;prop:kappa-solution-curvature-trichotomy&quot;,&quot;title&quot;:&quot;Curvature trichotomy for kappa-solutions&quot;,&quot;display_title&quot;:&quot;Proposition 3.7: Curvature trichotomy for kappa-solutions&quot;,&quot;body&quot;:&quot;Every three-dimensional $\\kappa$-solution is exactly one of the following:\nit has positive sectional curvature at every time; it is the shrinking round\ncylinder $S^2\\times\\mathbb R$ up to scaling; or it is the free line-bundle\nquotient of that cylinder over $\\mathbb{RP}^2$.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solution Geometry and Stability&quot;,&quot;kind&quot;:&quot;proposition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:69,&quot;ref&quot;:&quot;MT:ch9:9.83&quot;},{&quot;id&quot;:&quot;8f84b6178565&quot;,&quot;label&quot;:&quot;thm:soul-structure-nonnegative-curvature&quot;,&quot;title&quot;:&quot;Soul structure in nonnegative curvature&quot;,&quot;display_title&quot;:&quot;Theorem 3.8: Soul structure in nonnegative curvature&quot;,&quot;body&quot;:&quot;Every connected complete noncompact manifold of nonnegative sectional\ncurvature contains a compact totally geodesic, totally convex soul and is\ndiffeomorphic to its normal bundle.  If the sectional curvature is positive,\nthe soul is a point.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solution Geometry and Stability&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:70,&quot;ref&quot;:&quot;MT:ch2:2.7&quot;},{&quot;id&quot;:&quot;c564a4aa18b6&quot;,&quot;label&quot;:&quot;thm:point-soul-sphere-separation-annulus&quot;,&quot;title&quot;:&quot;Sphere separation and the annulus region about a point soul&quot;,&quot;display_title&quot;:&quot;Theorem 3.9: Sphere separation and the annulus region about a point soul&quot;,&quot;body&quot;:&quot;Let $M^3$ be complete, noncompact, and positively curved, and let $p$ be its\npoint soul.  Assume the smooth Schoenflies theorem and the smooth annulus\ntheorem for embedded two-spheres in the resulting $\\mathbb R^3$ identification\nof $M\\setminus\\{p\\}$.  Then every smoothly embedded two-sphere in\n$M\\setminus\\{p\\}$ has one\nrelatively compact complementary component with three-ball closure and one\ncomponent containing the unique end.  If such a sphere is isotopic in\n$M\\setminus\\{p\\}$ to a distance sphere about $p$, then it separates $p$ from\nthe end.  Any two disjoint embedded two-spheres that separate $p$ from the\nend bound a region diffeomorphic to $S^2\\times[0,1]$.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solution Geometry and Stability&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:71,&quot;ref&quot;:&quot;MT:ch2:2.19&quot;},{&quot;id&quot;:&quot;10593afc1ddd&quot;,&quot;label&quot;:&quot;lem:positive-curvature-neck-separation&quot;,&quot;title&quot;:&quot;A thin neck separates a point soul from the end&quot;,&quot;display_title&quot;:&quot;Lemma 3.10: A thin neck separates a point soul from the end&quot;,&quot;body&quot;:&quot;For sufficiently small $\\epsilon$, let $M^3$ be complete, noncompact, and\npositively curved with point soul $p$.  The central sphere of every\n$\\epsilon$-neck disjoint from $p$ separates $p$ from the unique end.  Two\ndisjoint such central spheres bound a region diffeomorphic to\n$S^2\\times[0,1]$.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solution Geometry and Stability&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:72,&quot;ref&quot;:&quot;MT:ch2:2.19&quot;},{&quot;id&quot;:&quot;a6fce8d4dc10&quot;,&quot;label&quot;:&quot;prop:positive-curvature-neck-scale-lower-bound&quot;,&quot;title&quot;:&quot;Positive curvature excludes arbitrarily small necks&quot;,&quot;display_title&quot;:&quot;Proposition 3.11: Positive curvature excludes arbitrarily small necks&quot;,&quot;body&quot;:&quot;For every sufficiently small $\\epsilon&gt;0$, a complete positively curved\nRiemannian three-manifold contains no sequence of $\\epsilon$-necks whose\nscales tend to zero.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solution Geometry and Stability&quot;,&quot;kind&quot;:&quot;proposition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:73,&quot;ref&quot;:&quot;MT:ch2:2.20&quot;},{&quot;id&quot;:&quot;ce186647dac1&quot;,&quot;label&quot;:&quot;thm:kappa-solution-splitting-at-infinity&quot;,&quot;title&quot;:&quot;Splitting at infinity for kappa-solutions&quot;,&quot;display_title&quot;:&quot;Theorem 3.12: Splitting at infinity for kappa-solutions&quot;,&quot;body&quot;:&quot;Let $(M,g(t))$, $-\\infty&lt;t\\le0$, be a noncompact three-dimensional\n$\\kappa$-solution.  If $p_j\\to\\infty$ and\n\\[\n R(p_j,-1)d_{g(-1)}(p,p_j)^2\\longrightarrow\\infty,\n\\]\nthen there are points $q_j\\to\\infty$ and scales $Q_j=R(q_j,-1)$ for\nwhich the based parabolic rescalings converge on compact subsets to the\nproduct of a shrinking round two-sphere with a flat line, possibly modulo\nthe free line-bundle involution.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solution Geometry and Stability&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:74,&quot;ref&quot;:&quot;MT:ch9:9.39&quot;},{&quot;id&quot;:&quot;ab31435babe2&quot;,&quot;label&quot;:&quot;thm:noncompact-kappa-solution-structure&quot;,&quot;title&quot;:&quot;Structure of noncompact kappa-solutions&quot;,&quot;display_title&quot;:&quot;Theorem 3.13: Structure of noncompact kappa-solutions&quot;,&quot;body&quot;:&quot;For every sufficiently small $\\epsilon&gt;0$ there is\n$C_0=C_0(\\epsilon)&lt;\\infty$ such that the time-zero slice of every\nnoncompact three-dimensional $\\kappa$-solution containing no embedded\ntwo-sided $\\mathbb{RP}^2$ is either a strong $\\epsilon$-tube or a\n$(C_0,\\epsilon)$-cap followed by a strong $\\epsilon$-tube.  The cap core has\nuniform scale-normalized curvature, derivative, diameter, and volume bounds.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solution Geometry and Stability&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:75,&quot;ref&quot;:&quot;MT:ch9:9.84,MT:ch9:9.85,MT:ch9:9.87,MT:ch9:9.88&quot;},{&quot;id&quot;:&quot;c0fea205205b&quot;,&quot;label&quot;:&quot;thm:compact-kappa-solution-structure&quot;,&quot;title&quot;:&quot;Structure of compact kappa-solutions&quot;,&quot;display_title&quot;:&quot;Theorem 3.14: Structure of compact kappa-solutions&quot;,&quot;body&quot;:&quot;For every sufficiently small $\\epsilon&gt;0$ there is\n$C_1=C_1(\\epsilon)&lt;\\infty$ such that a compact three-dimensional\n$\\kappa$-solution is round, is a positively curved $C_1$-component, or is\nthe union of two disjoint $(C_1,\\epsilon)$-cap cores joined by a strong\n$\\epsilon$-tube.  In the nonround cases its time-zero slice is\ndiffeomorphic to $S^3$ or $\\mathbb{RP}^3$.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solution Geometry and Stability&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:76,&quot;ref&quot;:&quot;MT:ch9:9.89,MT:ch9:9.90,MT:ch9:9.91&quot;},{&quot;id&quot;:&quot;c41e0879d383&quot;,&quot;label&quot;:&quot;thm:kappa-solution-structure-summary&quot;,&quot;title&quot;:&quot;Uniform structure of kappa-solutions&quot;,&quot;display_title&quot;:&quot;Theorem 3.15: Uniform structure of kappa-solutions&quot;,&quot;body&quot;:&quot;For every sufficiently small $\\epsilon&gt;0$ there is\n$C=C(\\epsilon)&lt;\\infty$ such that every three-dimensional\n$\\kappa$-solution is one of the following: a round spherical space form; a\ncompact positively curved $C$-component; a compact double-capped strong\n$\\epsilon$-tube; a noncompact $(C,\\epsilon)$-capped strong\n$\\epsilon$-tube; the round strong cylinder; or\n$\\mathbb{RP}^2\\times\\mathbb R$.  In every nonexceptional case each point is\nin a cap core, a controlled or round component, or is the center of a strong\n$\\epsilon$-neck.  Uniformly on the flow,\n\\[\n |\\nabla R|\\le CR^{3/2},\\qquad |\\partial_tR|\\le CR^2.\n\\]&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solution Geometry and Stability&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:77,&quot;ref&quot;:&quot;MT:ch9:9.93&quot;}]},{&quot;id&quot;:&quot;canonical-neighborhood-models&quot;,&quot;title&quot;:&quot;Canonical Neighborhood Models&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;3b2c67594e86&quot;,&quot;label&quot;:&quot;thm:kappa-solution-canonical-neighborhoods&quot;,&quot;title&quot;:&quot;Canonical neighborhoods in kappa-solutions&quot;,&quot;display_title&quot;:&quot;Theorem 3.16: Canonical neighborhoods in kappa-solutions&quot;,&quot;body&quot;:&quot;For every sufficiently small $\\epsilon&gt;0$ there is\n$C=C(\\epsilon)&lt;\\infty$ such that every point of every three-dimensional\n$\\kappa$-solution has a strong $(C,\\epsilon)$-canonical neighborhood,\nunless the solution is the round product $\\mathbb{RP}^2\\times\\mathbb R$.\nMoreover, if generalized flows with no embedded two-sided\n$\\mathbb{RP}^2$ converge smoothly to a $\\kappa$-solution, then their\nbasepoints have strong $(C,\\epsilon)$-canonical neighborhoods for all\nsufficiently large indices.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Canonical Neighborhood Models&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:78,&quot;ref&quot;:&quot;MT:ch9:9.94,MT:ch9:9.95&quot;},{&quot;id&quot;:&quot;0c66e31f8cb6&quot;,&quot;label&quot;:&quot;thm:standard-solution-canonical-neighborhoods&quot;,&quot;title&quot;:&quot;Canonical neighborhoods in the standard solution&quot;,&quot;display_title&quot;:&quot;Theorem 3.17: Canonical neighborhoods in the standard solution&quot;,&quot;body&quot;:&quot;For every sufficiently small $\\epsilon&gt;0$ there is\n$C_{\\mathrm{std}}(\\epsilon)&lt;\\infty$ such that every point $(q,t)$ of the\nstandard solution has one of the following neighborhoods:\n\\begin{enumerate}\n\\item a $(C_{\\mathrm{std}},\\epsilon)$-cap whose core contains $q$;\n\\item an evolving $\\epsilon$-neck reaching time zero, with its initial slice\n      disjoint from the cap core;\n\\item an evolving $\\epsilon$-neck defined for normalized backward time\n      $1+\\epsilon$.\n\\end{enumerate}\nThe alternatives persist for flows converging smoothly to the standard\nsolution on the corresponding parabolic neighborhoods.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Canonical Neighborhood Models&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:79,&quot;ref&quot;:&quot;MT:ch12:12.28,MT:ch12:12.32,MT:ch12:12.36&quot;}]},{&quot;id&quot;:&quot;first-failure-extension&quot;,&quot;title&quot;:&quot;First-Failure Extension&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;61db94ef73bd&quot;,&quot;label&quot;:&quot;lem:canonical-neighborhood-first-failure&quot;,&quot;title&quot;:&quot;First canonical-neighborhood failure&quot;,&quot;display_title&quot;:&quot;Lemma 3.18: First canonical-neighborhood failure&quot;,&quot;body&quot;:&quot;Fix a finite induction stage and a sequence $r_a\\downarrow0$.  Suppose that\nfor every $a$ there are controlled surgery flows with surgery controls\ntending to zero for which the strong $(C,\\epsilon)$-canonical-neighborhood\nassumption with parameter $r_a$ fails before the stage endpoint.  For each\n$a$, after passing sufficiently far down that sequence, there is a first\nfailure time $t_{a,b}$ and a point $x_{a,b}$ at that time such that\n$R(x_{a,b})\\ge r_a^{-2}$, the assumption holds before $t_{a,b}$, and no\nstrong $(C,\\epsilon)$-canonical neighborhood exists at $x_{a,b}$.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;First-Failure Extension&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:80,&quot;ref&quot;:&quot;MT:ch17:17.2&quot;},{&quot;id&quot;:&quot;b83aa6787faa&quot;,&quot;label&quot;:&quot;lem:standard-cap-encounter-control&quot;,&quot;title&quot;:&quot;A bounded-curvature cap encounter is standard&quot;,&quot;display_title&quot;:&quot;Lemma 3.19: A bounded-curvature cap encounter is standard&quot;,&quot;body&quot;:&quot;Consider rescaled first-failure flows and a backward flow line, starting in\na fixed-radius zero-time ball, which reaches a surgery cap after rescaled\ntime $s_a\\le s&#x27;&lt;\\infty$.  If scalar curvature along the line is bounded by\n$D&#x27;&lt;\\infty$ and $\\bar h_a$ is the rescaled surgery scale, then for all large\n$a$ there are constants $c=c(D&#x27;,s&#x27;)&gt;0$, $A&lt;\\infty$, and $\\theta&lt;1$ such that\n\\[\n \\bar h_a^2\\ge c,\n \\qquad s_a&lt;\\theta\\bar h_a^2,\n\\]\nand the point where the line reaches the surgery slice lies in the image of\nthe standard-solution ball $B(p_0,A)$ used to model the cap.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;First-Failure Extension&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:81,&quot;ref&quot;:&quot;MT:ch17:17.4,MT:ch17:17.5,MT:ch17:17.8&quot;},{&quot;id&quot;:&quot;2412c0bb3696&quot;,&quot;label&quot;:&quot;lem:bounded-flow-line-cap-exclusion&quot;,&quot;title&quot;:&quot;A cap-reaching flow line forces a canonical neighborhood&quot;,&quot;display_title&quot;:&quot;Lemma 3.20: A cap-reaching flow line forces a canonical neighborhood&quot;,&quot;body&quot;:&quot;In a rescaled first-failure sequence, suppose a point in a fixed-radius\nzero-time ball has a backward flow line of uniformly bounded scalar\ncurvature which reaches a surgery cap in uniformly bounded time.  Then the\nbase first-failure points have strong $(C,\\epsilon)$-canonical neighborhoods\nfor all sufficiently large indices.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;First-Failure Extension&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:82,&quot;ref&quot;:&quot;MT:ch17:17.7&quot;},{&quot;id&quot;:&quot;f2712cff9330&quot;,&quot;label&quot;:&quot;lem:rescaled-high-curvature-canonical-control&quot;,&quot;title&quot;:&quot;High-curvature control in a rescaled failure slice&quot;,&quot;display_title&quot;:&quot;Lemma 3.21: High-curvature control in a rescaled failure slice&quot;,&quot;body&quot;:&quot;After rescaling first-failure points to scalar curvature one and taking the\nsurgery controls to zero, every point of the zero-time slice with scalar\ncurvature greater than one has a strong\n$(2C,2\\epsilon)$-canonical neighborhood for all sufficiently large indices.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;First-Failure Extension&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:83,&quot;ref&quot;:&quot;MT:ch17:17.6&quot;},{&quot;id&quot;:&quot;33c22cede17b&quot;,&quot;label&quot;:&quot;lem:positive-component-first-failure-control&quot;,&quot;title&quot;:&quot;Positive components at first failure&quot;,&quot;display_title&quot;:&quot;Lemma 3.22: Positive components at first failure&quot;,&quot;body&quot;:&quot;In a rescaled first-failure sequence at a fixed positive induction stage,\nwith unit scalar curvature at the basepoints, suppose the component\ncontaining each basepoint has positive sectional curvature.  Assume in\naddition that the sequence is ordinarily noncollapsed on every fixed based\nball, pointed compactness produces a complete nonflat limit, and every\npositive-curvature limit satisfies the stated kappa-solution canonical\nneighborhood theorem.  Then, after passing to a subsequence, the basepoints\neventually have strong\n$(C,\\epsilon)$-canonical neighborhoods.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;First-Failure Extension&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:84,&quot;ref&quot;:&quot;MT:ch16:16.1,MT:ch17:17.1&quot;},{&quot;id&quot;:&quot;b9cb0afd564e&quot;,&quot;label&quot;:&quot;lem:first-failure-noncollapsing-bridge&quot;,&quot;title&quot;:&quot;First-failure noncollapsing bridge&quot;,&quot;display_title&quot;:&quot;Lemma 3.23: First-failure noncollapsing bridge&quot;,&quot;body&quot;:&quot;Consider a rescaled first-failure sequence with unit scalar curvature at the\nbasepoints and with surgery controls tending to zero.  After passing to a\nsubsequence, one of the following holds:\n\\begin{enumerate}\n\\item the basepoints eventually have strong\n      $(C,\\epsilon)$-canonical neighborhoods;\n\\item there is $\\kappa_*&gt;0$ such that, on every fixed zero-time based ball,\n      every sufficiently advanced flow satisfies the ordinary\n      $\\kappa_*$-noncollapsing volume estimate on each fixed scale on which\n      the required backward parabolic neighborhood exists.\n\\end{enumerate}&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;First-Failure Extension&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:85,&quot;ref&quot;:&quot;MT:ch16:16.1,MT:ch17:17.1&quot;},{&quot;id&quot;:&quot;05c1aec75380&quot;,&quot;label&quot;:&quot;lem:short-backward-curvature-control&quot;,&quot;title&quot;:&quot;Short backward curvature control&quot;,&quot;display_title&quot;:&quot;Lemma 3.24: Short backward curvature control&quot;,&quot;body&quot;:&quot;For every $A&lt;\\infty$ there are $D(A)&lt;\\infty$ and $\\sigma(A)&gt;0$ such that,\nin every sufficiently advanced rescaled first-failure flow, scalar curvature\nis at most $D(A)$ along each backward flow line starting in\n$B(x_{a,b},0,A)$ for as long as that line exists in\n$[-\\sigma(A),0]$.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;First-Failure Extension&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:86,&quot;ref&quot;:&quot;MT:ch17:17.9&quot;},{&quot;id&quot;:&quot;82648ce2769b&quot;,&quot;label&quot;:&quot;lem:backward-parabolic-neighborhood-dichotomy&quot;,&quot;title&quot;:&quot;Backward parabolic-neighborhood dichotomy&quot;,&quot;display_title&quot;:&quot;Lemma 3.25: Backward parabolic-neighborhood dichotomy&quot;,&quot;body&quot;:&quot;After passing to a subsequence of rescaled first-failure flows, exactly one\nof the following occurs:\n\\begin{enumerate}\n\\item for every $A&lt;\\infty$ there are $D(A),s(A)&gt;0$ such that the compatible\n      parabolic neighborhood\n      $P(x_{a,b},0,A,-s(A))$ exists and has\n      $|\\operatorname{Rm}|\\le D(A)$;\n\\item eventually every basepoint has a strong\n      $(C,\\epsilon)$-canonical neighborhood.\n\\end{enumerate}&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;First-Failure Extension&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:87,&quot;ref&quot;:&quot;MT:ch17:17.10&quot;},{&quot;id&quot;:&quot;0eb0bf7ca335&quot;,&quot;label&quot;:&quot;lem:first-failure-limit-slice-bounded-curvature&quot;,&quot;title&quot;:&quot;Bounded curvature of a first-failure limit slice&quot;,&quot;display_title&quot;:&quot;Lemma 3.26: Bounded curvature of a first-failure limit slice&quot;,&quot;body&quot;:&quot;Let a time slice of a pointed first-failure limit be complete, nonflat, and\nnonnegatively curved.  Suppose it is ordinarily $\\kappa$-noncollapsed on all\nfinite scales and is the smooth limit of slices on which points above a fixed\nscalar-curvature threshold have uniform canonical neighborhoods.  Then its\ncurvature is bounded on the whole slice.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;First-Failure Extension&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:88,&quot;ref&quot;:&quot;MT:ch11:11.7&quot;},{&quot;id&quot;:&quot;074ddf37c4ae&quot;,&quot;label&quot;:&quot;lem:uniform-backward-lifetime&quot;,&quot;title&quot;:&quot;Uniform backward lifetime&quot;,&quot;display_title&quot;:&quot;Lemma 3.27: Uniform backward lifetime&quot;,&quot;body&quot;:&quot;Suppose the first alternative of\n\\ref{lem:backward-parabolic-neighborhood-dichotomy} holds and the basepoints\nremain first-failure points.  The backward lifetimes $s(A)$ may then be\nchosen bounded below by one number $s_*&gt;0$ independent of $A$.  Extending\nmaximally, either the compatible neighborhoods exist for every backward\ntime, or a flow line starting in one fixed-radius zero-time based ball\nreaches a surgery cap at the finite maximal backward time with curvature\nbounded in the original first-failure normalization.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;First-Failure Extension&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:89,&quot;ref&quot;:&quot;MT:ch17:17.11&quot;},{&quot;id&quot;:&quot;0d805aef8325&quot;,&quot;label&quot;:&quot;thm:strong-canonical-neighborhood-extension&quot;,&quot;title&quot;:&quot;Extension of strong canonical neighborhoods&quot;,&quot;display_title&quot;:&quot;Theorem 3.28: Extension of strong canonical neighborhoods&quot;,&quot;body&quot;:&quot;Assume the positive-component first-failure, endpoint-transfer, pointed-limit,\nand kappa-solution canonical-neighborhood interfaces used in the proof hold\nwith constants uniform in the stage parameters.\nUnder the finite stage-$i$ parameter hypotheses of\n\\ref{thm:conditional-noncollapsing-extension}, there are\n$0&lt;r_{i+1}\\le r_i$ and\n$0&lt;\\delta_{i+1}\\le\\delta(r_{i+1})$ such that the following holds.  If a\ncontrolled Ricci flow with surgery on $[0,T)$,\n$T\\in(T_i,T_{i+1}]$, has $\\bar\\delta\\le\\delta_{i+1}$ on\n$[T_{i-1},T]$ and satisfies the stage-$i$ pinching, noncollapsing, and\ncanonical-neighborhood hypotheses before $T_i$, then it satisfies the strong\n$(C,\\epsilon)$-canonical-neighborhood assumption with parameter\n$r_{i+1}$ throughout $[0,T)$.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;First-Failure Extension&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:90,&quot;ref&quot;:&quot;MT:ch17:17.1&quot;}]},{&quot;id&quot;:&quot;surgery-continuation-and-finiteness&quot;,&quot;title&quot;:&quot;Surgery Continuation and Finiteness&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;bfa2180fd4c9&quot;,&quot;label&quot;:&quot;lem:controlled-surgery-restart&quot;,&quot;title&quot;:&quot;Controlled restart after surgery&quot;,&quot;display_title&quot;:&quot;Lemma 3.29: Controlled restart after surgery&quot;,&quot;body&quot;:&quot;Let a controlled Ricci flow reach a finite singular time $T$.  In its maximal\nextension, cut every sufficiently curved horn at the central sphere of a\nstrong $\\bar\\delta(T)$-neck of scale $h(T)$, discard each horn end and each\ncomponent containing no controlled-curvature point, and insert the standard\ncaps.  For sufficiently small control, the post-surgery metric is smooth,\nretains curvature pinching, satisfies the seven controlled-flow conditions,\nand is initial data for a maximal ordinary Ricci flow.  The new flow retains\nthe stage noncollapsing and strong canonical-neighborhood estimates.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Surgery Continuation and Finiteness&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:91,&quot;ref&quot;:&quot;MT:ch15:15.8,MT:ch15:15.11&quot;},{&quot;id&quot;:&quot;956e98090959&quot;,&quot;label&quot;:&quot;thm:separating-surgery-map&quot;,&quot;title&quot;:&quot;Map across a separating surgery&quot;,&quot;display_title&quot;:&quot;Theorem 3.30: Map across a separating surgery&quot;,&quot;body&quot;:&quot;Let $T$ be a surgery time of a controlled Ricci flow, and assume every\nsurgery sphere involved in a component $X(t)$ is separating.  For $t&lt;T$\nsufficiently close to $T$, let $X(T)$ be the component produced from\n$X(t)$.  The points whose curvature remains bounded form an open set\n$\\Omega_t\\subset X(t)$ on which the time-flow identifications converge to a\nmap onto the persistent open subset of $X(T)$.  For every $\\eta&gt;0$, after\nchoosing $t$ sufficiently close to $T$, the identification satisfies\n\\[\n (1+\\eta)^{-1}d_{g(t)}(p,q)\\le d_{g(T)}(\\Phi_t p,\\Phi_t q)\n \\le(1+\\eta)d_{g(t)}(p,q)\n \\qquad(p,q\\in\\Omega_t).\n\\]\nAssume that the radial maps on the removed sides agree with the persistent\nidentification on a collar and that the resulting collar interpolation is\n$(1+\\eta)$-Lipschitz.\nIt extends continuously to a map\n\\[\n F\\colon X(t)\\longrightarrow X(T)\n\\]\nwith $\\operatorname{Lip}_{g(t),g(T)}(F)\\le1+\\eta$.  On each removed side,\nthe restriction is the standard radial collapse and hence is distance\nnonincreasing there.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Surgery Continuation and Finiteness&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:92,&quot;ref&quot;:&quot;MT:ch15:15.12,MT:ch13:13.2&quot;},{&quot;id&quot;:&quot;5fcc1cb5b7db&quot;,&quot;label&quot;:&quot;thm:finite-interval-surgery-bound&quot;,&quot;title&quot;:&quot;Finite surgery count on bounded intervals&quot;,&quot;display_title&quot;:&quot;Theorem 3.31: Finite surgery count on bounded intervals&quot;,&quot;body&quot;:&quot;Let a controlled Ricci flow with surgery be defined on $[0,T)$ with\n$T\\le T_{i+1}$ and with the control functions fixed on that interval.  There\nis\n\\[\n N=N\\bigl(\\operatorname{Vol}(M_0,g(0)),T_{i+1},r_{i+1},\n             \\bar\\delta(T_{i+1})\\bigr)&lt;\\infty\n\\]\nsuch that the flow has at most $N$ surgery times in $[0,T)$.  In particular,\nsurgery times cannot accumulate in a bounded interval.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Surgery Continuation and Finiteness&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:93,&quot;ref&quot;:&quot;MT:ch17:17.12&quot;}]},{&quot;id&quot;:&quot;all-time-controlled-extension&quot;,&quot;title&quot;:&quot;All-Time Controlled Extension&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;0b42ab3768f4&quot;,&quot;label&quot;:&quot;thm:all-time-controlled-surgery-flow&quot;,&quot;title&quot;:&quot;All-time controlled Ricci flow with surgery&quot;,&quot;display_title&quot;:&quot;Theorem 3.32: All-time controlled Ricci flow with surgery&quot;,&quot;body&quot;:&quot;Assume the conditional noncollapsing and strong canonical-neighborhood\nextensions, together with their endpoint-transfer hypotheses, hold at every\nfinite stage.  Assume also that the local surgery construction supplies the\none-surgery connected-sum reconstruction contract at every restart.  There\nare positive nonincreasing sequences\n\\[\n \\mathbf K=(\\kappa_i)_{i\\ge0},\\qquad\n \\boldsymbol\\delta=(\\delta_i)_{i\\ge0},\\qquad\n \\mathbf r=(r_i)_{i\\ge0}\n\\]\nsuch that every normalized compact three-manifold containing no embedded\n$\\mathbb{RP}^2$ with trivial normal bundle is the initial slice of a Ricci\nflow with surgery on $[0,\\infty)$.  For $t\\in[T_i,T_{i+1})$, $x\\in M_t$, and\n$0&lt;\\rho\\le\\epsilon$, every parabolic ball satisfying the curvature hypothesis in\n\\ref{def:surgery-flow-noncollapsing} has volume at least\n$\\kappa_{i+1}\\rho^3$ unless its center lies in a positively curved component.\nThe flow satisfies the strong $(C,\\epsilon)$-canonical-neighborhood assumption\nwith parameter $r_{i+1}$, has curvature pinched toward positive, and uses\nsurgery control at most $\\delta_{i+1}$.  Its surgery times are finite on every\nbounded interval.\nAt every surgery time, the cutting and capping data also satisfy the\none-surgery connected-sum reconstruction contract, so the associated topology\nchange is part of the flow output.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;All-Time Controlled Extension&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:94,&quot;ref&quot;:&quot;MT:ch15:15.9,MT:ch15:15.10&quot;}]}]},{&quot;id&quot;:&quot;curve-shrinking-estimates&quot;,&quot;title&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;sections&quot;:[{&quot;id&quot;:&quot;curve-flow-geometry&quot;,&quot;title&quot;:&quot;Curve-Flow Geometry&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;bcc086f18ab4&quot;,&quot;label&quot;:&quot;lem:curve-flow-speed-and-tangent-evolution&quot;,&quot;title&quot;:&quot;Speed and tangent evolution&quot;,&quot;display_title&quot;:&quot;Theorem 4.1: Speed and tangent evolution&quot;,&quot;body&quot;:&quot;Let $\\widehat c(x,t)=(c(x,t),t)$ and\n$\\widehat H=\\widehat c_*(\\partial_t)=H+\\partial_t$.  Then\n\\[\n \\widehat H(|X|^2)=-2\\operatorname{Ric}_g(X,X)-2k^2|X|^2,\n \\qquad\n [\\widehat H,S]=(k^2+\\operatorname{Ric}_g(S,S))S .\n\\]\nEquivalently, the first formula is the time derivative of the squared speed in\nthe evolving pulled-back metric.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Curve-Flow Geometry&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:95,&quot;ref&quot;:&quot;MT:ch19:19.6&quot;},{&quot;id&quot;:&quot;a26bc71fd1e8&quot;,&quot;label&quot;:&quot;lem:space-time-metric-connection&quot;,&quot;title&quot;:&quot;Space-time metric connection identities&quot;,&quot;display_title&quot;:&quot;Lemma 4.2: Space-time metric connection identities&quot;,&quot;body&quot;:&quot;Equip $M\\times I$ with the metric $\\widehat g=g(t)+dt^2$, and denote its\nLevi--Civita connection by $\\nabla$.  If $A,B$ are horizontal vector fields,\nthen\n\\[\n \\nabla_A B=\\nabla_A^gB+\\operatorname{Ric}_g(A,B)\\partial_t,\n \\qquad\n \\langle\\nabla_A\\partial_t,B\\rangle\n       =-\\operatorname{Ric}_g(A,B),\n\\]\nand $\\nabla_A\\partial_t$ is horizontal.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Curve-Flow Geometry&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:96,&quot;ref&quot;:&quot;MT:ch19:19.7&quot;}]},{&quot;id&quot;:&quot;product-circle-geometry-and-ramp-setup&quot;,&quot;title&quot;:&quot;Product-Circle Geometry and Ramp Setup&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;fb27b70fd4ff&quot;,&quot;label&quot;:&quot;lem:product-circle-parallel-geometry&quot;,&quot;title&quot;:&quot;Product-circle geometry&quot;,&quot;display_title&quot;:&quot;Theorem 4.3: Product-circle geometry&quot;,&quot;body&quot;:&quot;On $(M,g(t))\\times(S^1_\\lambda,ds^2)$ let $U$ be the oriented unit tangent\nto the circle factor.  Then $\\nabla U=0$ and\n$\\operatorname{Ric}(V,U)=0$ for every tangent vector $V$; both assertions are\nindependent of $\\lambda&gt;0$.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Product-Circle Geometry and Ramp Setup&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:97,&quot;ref&quot;:&quot;MT:ch19:19.11&quot;},{&quot;id&quot;:&quot;606dd3214150&quot;,&quot;label&quot;:&quot;def:ramp-curve&quot;,&quot;title&quot;:&quot;Ramp&quot;,&quot;display_title&quot;:&quot;Definition 4.4: Ramp&quot;,&quot;body&quot;:&quot;For an immersed oriented curve $c\\colon S^1\\to M\\times S^1_\\lambda$ with\nunit tangent $S$, put $u=\\langle S,U\\rangle$.  The curve is a \\emph{ramp} if\n$u(x)&gt;0$ for every $x\\in S^1$.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Product-Circle Geometry and Ramp Setup&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:98,&quot;ref&quot;:&quot;MT:ch19:19.12&quot;},{&quot;id&quot;:&quot;10dc951be346&quot;,&quot;label&quot;:&quot;lem:ramp-slope-evolution&quot;,&quot;title&quot;:&quot;Evolution equation for the ramp slope&quot;,&quot;display_title&quot;:&quot;Theorem 4.5: Evolution equation for the ramp slope&quot;,&quot;body&quot;:&quot;Along a curve-shrinking flow in\n$(M,g(t))\\times(S^1_\\lambda,ds^2)$, the function\n$u=\\langle S,U\\rangle$ satisfies\n\\[\n \\partial_tu=u&#x27;&#x27;+(k^2+\\operatorname{Ric}(S,S))u\n \\ge u&#x27;&#x27;-C&#x27;u,\n\\]\nwhere $C&#x27;$ is any upper bound for the norm of the Ricci tensor of $g(t)$.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Product-Circle Geometry and Ramp Setup&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:99,&quot;ref&quot;:&quot;MT:ch19:19.11&quot;},{&quot;id&quot;:&quot;9929a0922cf6&quot;,&quot;label&quot;:&quot;thm:ramp-preservation&quot;,&quot;title&quot;:&quot;Ramp preservation&quot;,&quot;display_title&quot;:&quot;Theorem 4.6: Ramp preservation&quot;,&quot;body&quot;:&quot;Suppose $c$ is a curve-shrinking flow on $[t_0,T)$ in the ramp product and\n$c(\\cdot,t_0)$ is a ramp.  If $C&#x27;$ bounds $|\\operatorname{Ric}|$, then\n\\[\n \\min_{S^1}u(\\cdot,t)\\ge\n e^{-C&#x27;(t-t_0)}\\min_{S^1}u(\\cdot,t_0)&gt;0\n \\qquad(t_0\\le t&lt;T).\n\\]\nIn particular every $c(\\cdot,t)$ is a ramp.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Product-Circle Geometry and Ramp Setup&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:100,&quot;ref&quot;:&quot;MT:ch19:19.13&quot;}]},{&quot;id&quot;:&quot;graph-flow-coordinate-estimates&quot;,&quot;title&quot;:&quot;Graph-Flow Coordinate Estimates&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;2c2530143515&quot;,&quot;label&quot;:&quot;def:curve-flow-local-graph-coordinates&quot;,&quot;title&quot;:&quot;Local graph-flow coordinates&quot;,&quot;display_title&quot;:&quot;Definition 4.7: Local graph-flow coordinates&quot;,&quot;body&quot;:&quot;At the midpoint $p$ of a length-$r$ arc, lift the evolving arc through the\n$h(t&#x27;)$-exponential local diffeomorphism from a ball in $T_pW$.  Give\n$T_pW$ the Euclidean metric $h&#x27;=h(t&#x27;)_p$ and take the $z$-axis tangent to the\nlifted arc.  The choice of $r_0$ ensures that throughout the tangent-space\nball\n\\[\n |h(t)-h&#x27;|_{h&#x27;}&lt;\\delta,\\qquad\n |\\Gamma(A,B)|_{h&#x27;}&lt;\\delta|A|_{h&#x27;}|B|_{h&#x27;}.\n\\]\nOn a fixed interval $I&#x27;$ of $h&#x27;$-length $l\\in[0.8r,r]$, write the evolving\narc, up to its maximal graph time $t_3\\le t_2$, as\n$\\widetilde\\gamma(z,t)=(z,f(z,t))$, where $|f_z|_{h&#x27;}\\le1/10$.  Define\n\\[\n Z=\\partial_z\\widetilde\\gamma=(1,f_z),\\qquad\n Y=\\partial_t\\widetilde\\gamma=(0,f_t).\n\\]\nThus $Y$ is $h&#x27;$-orthogonal to the $z$-axis and differs from\n$\\nabla_SS$ by a scalar multiple of $Z$.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Graph-Flow Coordinate Estimates&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:101,&quot;ref&quot;:&quot;MT:ch19:19.64&quot;},{&quot;id&quot;:&quot;d388b2082a09&quot;,&quot;label&quot;:&quot;lem:graph-flow-velocity-identities&quot;,&quot;title&quot;:&quot;Graph-flow velocity identities&quot;,&quot;display_title&quot;:&quot;Theorem 4.8: Graph-flow velocity identities&quot;,&quot;body&quot;:&quot;On the graph interval,\n\\[\n Y=\\frac{\\nabla_ZZ-\\langle\\Gamma(Z,Z),\\partial_z\\rangle_{h&#x27;}Z}{|Z|^2}\n =\\nabla_SS+\\left(\n \\frac{\\langle\\nabla_ZZ,Z\\rangle}{|Z|^4}\n -\\frac{\\langle\\Gamma(Z,Z),\\partial_z\\rangle_{h&#x27;}}{|Z|^2}\n \\right)Z.\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Graph-Flow Coordinate Estimates&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:102,&quot;ref&quot;:&quot;MT:ch19:19.64&quot;},{&quot;id&quot;:&quot;9977c10908db&quot;,&quot;label&quot;:&quot;def:graph-flow-connection-drift&quot;,&quot;title&quot;:&quot;Graph-flow connection drift&quot;,&quot;display_title&quot;:&quot;Definition 4.9: Graph-flow connection drift&quot;,&quot;body&quot;:&quot;Define\n\\[\n \\psi(Z)=\\frac{\\langle\\Gamma(Z,Z),\\partial_z\\rangle_{h&#x27;}}{|Z|^2}.\n\\]\nThe metric and slope comparisons imply $|\\psi(Z)|&lt;1.5\\delta$.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Graph-Flow Coordinate Estimates&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:103,&quot;ref&quot;:&quot;MT:ch19:19.65&quot;},{&quot;id&quot;:&quot;0dabec6e7d74&quot;,&quot;label&quot;:&quot;lem:graph-flow-small-slope-comparison&quot;,&quot;title&quot;:&quot;Small-slope graph and curvature comparisons&quot;,&quot;display_title&quot;:&quot;Theorem 4.10: Small-slope graph and curvature comparisons&quot;,&quot;body&quot;:&quot;For sufficiently small $\\delta$, wherever $Y\\ne0$ the $h(t)$-angle between\n$Y$ and $Z$ is greater than $\\pi/4$, and\n\\begin{align*}\n &amp;k\\le|Y|\\le\\sqrt2k,\\\\\n &amp;|\\langle\\nabla_ZZ,Z\\rangle|&lt;(k+2\\delta)|Z|^3,\\\\\n &amp;|\\nabla_ZZ|&lt;2(|Y|+\\delta),\\\\\n &amp;|\\langle Y,Z\\rangle|\\le|Y|\\,|f_z|_{h&#x27;}(1+3\\delta).\n\\end{align*}&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Graph-Flow Coordinate Estimates&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:104,&quot;ref&quot;:&quot;MT:ch19:19.65&quot;},{&quot;id&quot;:&quot;84f30b171db1&quot;,&quot;label&quot;:&quot;lem:graph-flow-drift-derivative-bounds&quot;,&quot;title&quot;:&quot;Derivatives of the graph-flow connection drift&quot;,&quot;display_title&quot;:&quot;Theorem 4.11: Derivatives of the graph-flow connection drift&quot;,&quot;body&quot;:&quot;For sufficiently small $\\delta$ there is an ambient constant $C&#x27;$ such that\n\\[\n |Z(\\psi(Z))|&lt;C&#x27;(1+\\delta|Y|),\n \\qquad\n |Y(\\psi(Z))|&lt;C&#x27;(|Y|+\\delta|\\nabla_ZY|).\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Graph-Flow Coordinate Estimates&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:105,&quot;ref&quot;:&quot;MT:ch19:19.66&quot;}]},{&quot;id&quot;:&quot;short-time-existence&quot;,&quot;title&quot;:&quot;Short-Time Existence&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;a4d91a09effa&quot;,&quot;label&quot;:&quot;thm:parametric-curve-shrinking-wellposedness&quot;,&quot;title&quot;:&quot;Short-time well-posedness for immersed curve shrinking&quot;,&quot;display_title&quot;:&quot;Theorem 4.12: Short-time well-posedness for immersed curve shrinking&quot;,&quot;body&quot;:&quot;Let $0&lt;\\alpha&lt;1$ and let $g(t)$ be a smooth Ricci flow on a compact\nmanifold for $t\\in[t_0,t_1]$.  For one immersed $C^{2,\\alpha}$ loop\n$c_0$, there is a nontrivial interval $[t_0,T)$ and an immersed geometric\ncurve-shrinking flow $c$ on that interval.  Smooth initial data give smooth\nsolutions.  If a finite endpoint has uniformly bounded curvature and the\nimmersion remains nondegenerate there, then the flow continues across that\nendpoint.  This statement makes no compact-parameter, uniqueness, or\nuniform-family assertion.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Short-Time Existence&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:106,&quot;ref&quot;:&quot;MT:ch19:19.1&quot;},{&quot;id&quot;:&quot;37074c813bce&quot;,&quot;label&quot;:&quot;thm:curve-shrinking-short-time-existence&quot;,&quot;title&quot;:&quot;Short-time existence and curvature blow-up alternative&quot;,&quot;display_title&quot;:&quot;Theorem 4.13: Short-time existence and curvature blow-up alternative&quot;,&quot;body&quot;:&quot;Let $0&lt;\\alpha&lt;1$ and let\n$c_0\\colon S^1\\to(M,g(t_0))$ be an immersed $C^{2,\\alpha}$ curve.  There is\n$T&gt;t_0$ and an immersed curve-shrinking flow $c$ on $[t_0,T)$.  If\n$T&lt;\\sup I$\nand $\\sup_{S^1\\times[t_0,T)}k&lt;\\infty$, then the flow extends, through\nimmersed curves, to an interval $[t_0,T+\\eta)$ for some $\\eta&gt;0$.\nConsequently every finite nonextendible endpoint has\n$\\limsup_{t\\uparrow T}\\max_{S^1}k(\\cdot,t)=\\infty$.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Short-Time Existence&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:107,&quot;ref&quot;:&quot;MT:ch19:19.1&quot;}]},{&quot;id&quot;:&quot;polygonal-ramp-approximation&quot;,&quot;title&quot;:&quot;Polygonal Ramp Approximation&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;c7f77a2809ce&quot;,&quot;label&quot;:&quot;def:regular-polygonal-loop-approximation&quot;,&quot;title&quot;:&quot;Regular polygonal approximation&quot;,&quot;display_title&quot;:&quot;Definition 4.14: Regular polygonal approximation&quot;,&quot;body&quot;:&quot;Let $c\\colon S^1\\to M$ be $C^1$, let $n\\ge1$, and put\n$\\xi_n=e^{2\\pi i/n}$ and $p_j=c(\\xi_n^j)$.  Choose a minimizing geodesic\n$A_j$ from $p_j$ to $p_{j+1}$, with circular indexing, and parametrize it at\nconstant speed on the corresponding subinterval of $S^1$.  The resulting\npiecewise geodesic loop $c_n$ is a \\emph{regular $n$-polygonal approximation}\nof $c$.  When all sides lie below the injectivity radius, the choices are\nunique.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Polygonal Ramp Approximation&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:108,&quot;ref&quot;:&quot;MT:ch19:19.18&quot;},{&quot;id&quot;:&quot;2ea12f74bfde&quot;,&quot;label&quot;:&quot;lem:single-loop-polygonal-approximation&quot;,&quot;title&quot;:&quot;Polygonal approximation&quot;,&quot;display_title&quot;:&quot;Theorem 4.15: Polygonal approximation&quot;,&quot;body&quot;:&quot;For every $C^1$ loop $c\\colon S^1\\to M$ and every $\\zeta&gt;0$, there is\n$N$ such that, for all $n\\ge N$,\n\\[\n |L(c_n)-L(c)|&lt;\\zeta,\n\\]\nand $c_n$ and $c$ cobound a piecewise smooth annulus of area less than\n$\\zeta$.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Polygonal Ramp Approximation&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:109,&quot;ref&quot;:&quot;MT:ch19:19.19&quot;},{&quot;id&quot;:&quot;fd268164d548&quot;,&quot;label&quot;:&quot;lem:compact-family-polygonal-approximation&quot;,&quot;title&quot;:&quot;Uniform polygonal approximation on compact families&quot;,&quot;display_title&quot;:&quot;Theorem 4.16: Uniform polygonal approximation on compact families&quot;,&quot;body&quot;:&quot;Let $K$ be a compact set of $C^1$ loops, with the $C^1$ topology, and let\n$\\zeta&gt;0$.  There is $N=N(K,\\zeta)$ such that the two conclusions of\n\\ref{lem:single-loop-polygonal-approximation} hold for every $c\\in K$ and\nevery $n\\ge N$.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Polygonal Ramp Approximation&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:110,&quot;ref&quot;:&quot;MT:ch19:19.20&quot;},{&quot;id&quot;:&quot;0b60ec75858a&quot;,&quot;label&quot;:&quot;cor:sphere-family-polygonal-approximation&quot;,&quot;title&quot;:&quot;Polygonal approximation of sphere families&quot;,&quot;display_title&quot;:&quot;Theorem 4.17: Polygonal approximation of sphere families&quot;,&quot;body&quot;:&quot;Let $\\Gamma\\colon S^2\\to\\Lambda M$ be a continuous $C^1$-loop family whose\nmembers are null-homotopic.  For every $\\zeta&gt;0$ there is $N$ such that, for\n$n\\ge N$, the regular polygonal family $\\Gamma_n$ is continuous, every\n$\\Gamma_n(q)$ is null-homotopic, and, uniformly in $q\\in S^2$,\n\\[\n |L(\\Gamma_n(q))-L(\\Gamma(q))|&lt;\\zeta,\n \\qquad\n |A(\\Gamma_n(q))-A(\\Gamma(q))|&lt;\\zeta.\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Polygonal Ramp Approximation&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:111,&quot;ref&quot;:&quot;MT:ch19:19.21&quot;},{&quot;id&quot;:&quot;9c9d12b27929&quot;,&quot;label&quot;:&quot;lem:smoothed-polygonal-ramp-bounds&quot;,&quot;title&quot;:&quot;Length and total curvature of smoothed polygonal ramps&quot;,&quot;display_title&quot;:&quot;Theorem 4.18: Length and total curvature of smoothed polygonal ramps&quot;,&quot;body&quot;:&quot;For each $q$, obtain $\\widetilde\\Gamma(q)$ from the $n$-polygonal loop\n$\\Gamma_n(q)$ by the standard smoothing with a fixed, nonnegative, symmetric\nreparameterization bump.  For\n$0&lt;\\lambda&lt;1$, define the ramp\n$\\widetilde\\Gamma(q)^\\lambda(x)=(\\widetilde\\Gamma(q)(x),x)$ in\n $M\\times S^1_\\lambda$.  Then\n\\[\n L(\\widetilde\\Gamma(q)^\\lambda)\n \\le L(\\Gamma(q))+\\lambda,\n \\qquad\n \\int_{\\widetilde\\Gamma(q)^\\lambda}k\\,ds\\le n\\pi .\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Polygonal Ramp Approximation&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:112,&quot;ref&quot;:&quot;MT:ch19:19.22&quot;},{&quot;id&quot;:&quot;2d7fad1bc78e&quot;,&quot;label&quot;:&quot;thm:uniform-controlled-ramp-approximation&quot;,&quot;title&quot;:&quot;Uniform smooth approximation by controlled ramps&quot;,&quot;display_title&quot;:&quot;Theorem 4.19: Uniform smooth approximation by controlled ramps&quot;,&quot;body&quot;:&quot;Let $\\Gamma\\colon S^2\\to\\Lambda M$ be a continuous family of\nnull-homotopic loops representing a class in $\\pi_3(M,*)$, and let\n$0&lt;\\zeta&lt;1$.  There is a continuous family\n$\\widetilde\\Gamma\\colon S^2\\to\\Lambda M$ such that\n$[\\widetilde\\Gamma]=[\\Gamma]$, every member is smooth, and, for every\n$0&lt;\\alpha&lt;1$, the same family is continuous in the $C^{2,\\alpha}$ topology.\nMoreover,\n\\[\n |L(\\widetilde\\Gamma(q))-L(\\Gamma(q))|&lt;\\zeta,\\qquad\n |A(\\widetilde\\Gamma(q))-A(\\Gamma(q))|&lt;\\zeta.\n\\]\nMoreover there is $C_0&lt;\\infty$, independent of $q$ and\n$0&lt;\\lambda&lt;1$, for which both the length and total curvature of every ramp\n$\\widetilde\\Gamma(q)^\\lambda$ are at most $C_0$.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Polygonal Ramp Approximation&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:113,&quot;ref&quot;:&quot;MT:ch19:19.17&quot;}]},{&quot;id&quot;:&quot;evolution-identities-and-global-bounds&quot;,&quot;title&quot;:&quot;Evolution Identities and Global Bounds&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;572cb18da12c&quot;,&quot;label&quot;:&quot;thm:curve-flow-curvature-evolution&quot;,&quot;title&quot;:&quot;Evolution equation for squared curvature&quot;,&quot;display_title&quot;:&quot;Theorem 4.20: Evolution equation for squared curvature&quot;,&quot;body&quot;:&quot;Let $\\widehat{\\operatorname{Rm}}$ be the curvature\ntensor of $\\widehat g$.  At every smooth point of the flow,\n\\begin{align*}\n \\partial_t k^2={}&amp;(k^2)&#x27;&#x27;-2| (\\nabla_SH)^\\perp|^2+2k^4\n -2\\operatorname{Ric}_g(H,H)+4k^2\\operatorname{Ric}_g(S,S)\\\\\n &amp;+2\\widehat{\\operatorname{Rm}}(\\widehat H,S,H,S)\n +2\\operatorname{Ric}_g(S,S)\\operatorname{Ric}_g(H,H)\n -2(\\nabla^g_S\\operatorname{Ric}_g)(S,H).\n\\end{align*}&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Evolution Identities and Global Bounds&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:114,&quot;ref&quot;:&quot;MT:ch19:19.7&quot;},{&quot;id&quot;:&quot;e7b507d1568a&quot;,&quot;label&quot;:&quot;lem:regularized-curve-curvature-inequality&quot;,&quot;title&quot;:&quot;Regularized curvature inequality&quot;,&quot;display_title&quot;:&quot;Theorem 4.21: Regularized curvature inequality&quot;,&quot;body&quot;:&quot;There is a constant $C_1&lt;\\infty$, depending only on bounds for the ambient\nRicci flow and its first covariant curvature derivative, such that, for every\n$\\epsilon&gt;0$ and\n$h_\\epsilon=(k^2+\\epsilon^2)^{1/2}$,\n\\[\n \\partial_t h_\\epsilon\\le h_\\epsilon&#x27;&#x27;+k^3+C_1(h_\\epsilon+1).\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Evolution Identities and Global Bounds&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:115,&quot;ref&quot;:&quot;MT:ch19:19.8&quot;},{&quot;id&quot;:&quot;b99a6419604a&quot;,&quot;label&quot;:&quot;lem:curve-flow-length-total-curvature-evolution&quot;,&quot;title&quot;:&quot;Integral evolution inequalities&quot;,&quot;display_title&quot;:&quot;Theorem 4.22: Integral evolution inequalities&quot;,&quot;body&quot;:&quot;Let\n$L(t)=\\int_{c_t}ds$ and $\\Theta(t)=\\int_{c_t}k\\,ds$, and let $C_2$ bound\n$|\\operatorname{Ric}_g|$ on $M\\times I$.  The function $L$ is smooth and\n$\\Theta$ is locally absolutely continuous.  For almost every time,\n\\[\n L&#x27;(t)\\le\\int_{c_t}(C_2-k^2)\\,ds\\le C_2L(t),\n \\qquad\n \\Theta&#x27;(t)\\le(C_1+C_2)\\Theta(t)+C_1L(t).\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Evolution Identities and Global Bounds&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:116,&quot;ref&quot;:&quot;MT:ch19:19.9&quot;},{&quot;id&quot;:&quot;32d360ee53fe&quot;,&quot;label&quot;:&quot;lem:coupled-length-curvature-comparison&quot;,&quot;title&quot;:&quot;Scalar exponential comparison&quot;,&quot;display_title&quot;:&quot;Lemma 4.23: Scalar exponential comparison&quot;,&quot;body&quot;:&quot;Suppose $L,\\Theta\\colon[0,T]\\to[0,\\infty)$ are absolutely continuous and\n\\[\n L&#x27;\\le C_2L,\\qquad\n \\Theta&#x27;\\le(C_1+C_2)\\Theta+C_1L\n\\]\nalmost everywhere.  Then, for $0\\le t\\le T$,\n\\[\n L(t)\\le L(0)e^{C_2t},\\qquad\n \\Theta(t)+L(t)\\le(\\Theta(0)+L(0))e^{(C_1+C_2)t}.\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Evolution Identities and Global Bounds&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:117,&quot;ref&quot;:&quot;MT:ch19:19.10&quot;},{&quot;id&quot;:&quot;7a2a8ef45f46&quot;,&quot;label&quot;:&quot;thm:curve-flow-length-total-curvature-bounds&quot;,&quot;title&quot;:&quot;Exponential length and total-curvature bounds&quot;,&quot;display_title&quot;:&quot;Theorem 4.24: Exponential length and total-curvature bounds&quot;,&quot;body&quot;:&quot;For the immersed curve-shrinking flow above and $t_0\\le t\\le t_1$,\n\\[\n L(t)\\le L(t_0)e^{C_2(t-t_0)},\n\\]\nand\n\\[\n \\Theta(t)\\le\\Theta(t)+L(t)\n \\le(\\Theta(t_0)+L(t_0))e^{(C_1+C_2)(t-t_0)}.\n\\]\nThus the total-curvature bound necessarily depends on both initial\ntotal curvature and initial length.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Evolution Identities and Global Bounds&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:118,&quot;ref&quot;:&quot;MT:ch19:19.10&quot;},{&quot;id&quot;:&quot;c1c624f5a6e1&quot;,&quot;label&quot;:&quot;thm:ramp-curve-shrinking-global-existence&quot;,&quot;title&quot;:&quot;Global existence for ramps&quot;,&quot;display_title&quot;:&quot;Theorem 4.25: Global existence for ramps&quot;,&quot;body&quot;:&quot;Let $(M,g(t))$, $t_0\\le t\\le t_1$, be a Ricci flow and let\n$c_0\\colon S^1\\to M\\times S^1_\\lambda$ be a $C^{2,\\alpha}$ ramp at time\n$t_0$, for some $0&lt;\\alpha&lt;1$.\nThen its curve-shrinking flow exists on all of $[t_0,t_1]$, remains immersed,\nand consists entirely of ramps.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Evolution Identities and Global Bounds&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:119,&quot;ref&quot;:&quot;MT:ch19:19.14&quot;}]},{&quot;id&quot;:&quot;localized-total-curvature-control&quot;,&quot;title&quot;:&quot;Localized Total-Curvature Control&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;1ab62a65597f&quot;,&quot;label&quot;:&quot;lem:evolved-subarc-global-bounds&quot;,&quot;title&quot;:&quot;Uniform bounds on evolved subarcs&quot;,&quot;display_title&quot;:&quot;Theorem 4.26: Uniform bounds on evolved subarcs&quot;,&quot;body&quot;:&quot;There is $D_0&lt;\\infty$, depending only on $\\Theta$, $L_0$, and the fixed\nambient Ricci flow, such that every subarc $\\gamma_{t&#x27;}$ of length at most\n$r$ satisfies, for $t&#x27;\\le t\\le t&#x27;+\\delta r^2$,\n\\[\n \\int_{\\gamma_t}k\\,ds&lt;D_0,\\qquad L(\\gamma_t)\\le D_0r.\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Localized Total-Curvature Control&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:120,&quot;ref&quot;:&quot;MT:ch19:19.59&quot;},{&quot;id&quot;:&quot;45ed7d334607&quot;,&quot;label&quot;:&quot;lem:localized-cutoff-time-derivative&quot;,&quot;title&quot;:&quot;Time derivative of the localized cutoff&quot;,&quot;display_title&quot;:&quot;Theorem 4.27: Time derivative of the localized cutoff&quot;,&quot;body&quot;:&quot;There is $D_1$, depending only on $\\Theta,L_0$, and the ambient flow, such\nthat, on $[t&#x27;,t_2]$,\n\\[\n |\\partial_t\\varphi(x,t)|\n \\le D_1\\left(1+\\frac1{r\\sqrt{t-t&#x27;}}\\right).\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Localized Total-Curvature Control&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:121,&quot;ref&quot;:&quot;MT:ch19:19.60&quot;},{&quot;id&quot;:&quot;e1d7d80c3e94&quot;,&quot;label&quot;:&quot;lem:localized-total-curvature-evolution&quot;,&quot;title&quot;:&quot;Localized total-curvature differential inequality&quot;,&quot;display_title&quot;:&quot;Theorem 4.28: Localized total-curvature differential inequality&quot;,&quot;body&quot;:&quot;There are constants $D_2,D_3&lt;\\infty$, depending only on\n$\\Theta,L_0$, and the ambient flow, such that the weighted curvature is\nlocally absolutely continuous and, for almost every $t&#x27; &lt; t\\le t_2$,\n\\[\n \\frac d{dt}\\int_{\\gamma_t}\\varphi k\\,ds\n \\le D_2\\left(1+\\frac1{r\\sqrt{t-t&#x27;}}\\right)+\\frac{D_2}{r^2}\n       +D_3\\int_{\\gamma_t}\\varphi k\\,ds\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Localized Total-Curvature Control&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:122,&quot;ref&quot;:&quot;MT:ch19:19.61&quot;},{&quot;id&quot;:&quot;3d419b69ad4d&quot;,&quot;label&quot;:&quot;lem:localized-total-curvature-smallness&quot;,&quot;title&quot;:&quot;Small localized total-curvature bound&quot;,&quot;display_title&quot;:&quot;Theorem 4.29: Small localized total-curvature bound&quot;,&quot;body&quot;:&quot;There is $D_4$, depending only on $\\Theta,L_0$, and the ambient flow, such\nthat\n\\[\n \\int_{\\gamma_t}\\varphi k\\,ds\\le D_4\\sqrt\\delta\n \\qquad(t&#x27;\\le t\\le t_2).\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Localized Total-Curvature Control&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:123,&quot;ref&quot;:&quot;MT:ch19:19.62&quot;},{&quot;id&quot;:&quot;6e44a1958754&quot;,&quot;label&quot;:&quot;lem:short-subarc-total-curvature-bound&quot;,&quot;title&quot;:&quot;Short-subarc total-curvature bound&quot;,&quot;display_title&quot;:&quot;Theorem 4.30: Short-subarc total-curvature bound&quot;,&quot;body&quot;:&quot;For $t\\in[t&#x27;,t_2]$, every transported initial subarc of length at most $r$\nhas total curvature at most $2D_4\\sqrt\\delta$.  Every subarc of $c_t$ of\nlength at most $r/2$ has the same bound.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Localized Total-Curvature Control&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:124,&quot;ref&quot;:&quot;MT:ch19:19.63&quot;}]},{&quot;id&quot;:&quot;short-time-curvature-barrier&quot;,&quot;title&quot;:&quot;Short-Time Curvature Barrier&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;b98f0aa4fc27&quot;,&quot;label&quot;:&quot;lem:graph-slope-persistence&quot;,&quot;title&quot;:&quot;Full-interval graph-slope persistence&quot;,&quot;display_title&quot;:&quot;Theorem 4.31: Full-interval graph-slope persistence&quot;,&quot;body&quot;:&quot;For sufficiently small $\\delta$, the maximal graph time equals the\nprovisional curvature time, $t_3=t_2$, and\n\\[\n |f_z(z,t)|_{h&#x27;}&lt;\\frac1{10}\n \\qquad((z,t)\\in I&#x27;\\times[t&#x27;,t_2]).\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Short-Time Curvature Barrier&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:125,&quot;ref&quot;:&quot;MT:ch19:19.58&quot;},{&quot;id&quot;:&quot;ce9c2abb2e16&quot;,&quot;label&quot;:&quot;lem:graph-flow-tangential-derivative&quot;,&quot;title&quot;:&quot;Tangential component of _ZY&quot;,&quot;display_title&quot;:&quot;Theorem 4.32: Tangential component of _ZY&quot;,&quot;body&quot;:&quot;On $I&#x27;\\times[t&#x27;,t_2]$,\n\\[\n |\\langle\\nabla_ZY,Z\\rangle|\n \\le\\bigl(|f_z|_{h&#x27;}(|\\nabla_ZY|+2\\delta|Y|)\n       +\\delta|Z|^2|Y|\\bigr)(1+\\delta).\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Short-Time Curvature Barrier&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:126,&quot;ref&quot;:&quot;MT:ch19:19.67&quot;},{&quot;id&quot;:&quot;a26f5c19302d&quot;,&quot;label&quot;:&quot;thm:short-time-curve-curvature-barrier&quot;,&quot;title&quot;:&quot;Short-time pointwise curvature barrier&quot;,&quot;display_title&quot;:&quot;Theorem 4.33: Short-time pointwise curvature barrier&quot;,&quot;body&quot;:&quot;Given bounds $\\Theta,L_0$ and the fixed ambient Ricci flow, there are\n$\\delta&gt;0$ and $0&lt;r_0\\le1$ such that the localized hypotheses stated above\nimply\n\\[\n k(x,t)^2\\le\\frac2{t-t&#x27;}\n \\qquad(x\\in S^1,\\ t&#x27;&lt;t\\le t&#x27;+\\delta r^2).\n\\]\nThe constants may depend on both $\\Theta$ and $L_0$.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Short-Time Curvature Barrier&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:127,&quot;ref&quot;:&quot;MT:ch19:19.58&quot;},{&quot;id&quot;:&quot;8b02bd6bd97c&quot;,&quot;label&quot;:&quot;thm:curve-shrinking-derivative-estimates&quot;,&quot;title&quot;:&quot;Derivative estimates for curve shrinking&quot;,&quot;display_title&quot;:&quot;Theorem 4.34: Derivative estimates for curve shrinking&quot;,&quot;body&quot;:&quot;Assume the Altschuler--Grayson higher-order estimates for the gauged curve\nflow under the hypotheses of the curvature barrier, with constants depending\nonly on the displayed initial length and total-curvature bounds.  Under the\nhypotheses of \\ref{thm:short-time-curve-curvature-barrier}, there\nare constants\n$\\widetilde C_i&lt;\\infty$, depending on the ambient Ricci flow and on the\nuniform initial total-curvature and length bounds of the chosen family, such\nthat, for $t&#x27;&lt;t&lt;t&#x27;+\\delta r^2$,\n\\[\n k^2\\le \\widetilde C_0(t-t&#x27;)^{-1},\\qquad\n |\\nabla_SH|^2\\le\\widetilde C_1(t-t&#x27;)^{-2},\n\\]\nand, for every $i\\ge1$,\n\\[\n |\\nabla_S^iH|^2\\le\\widetilde C_i(t-t&#x27;)^{-(i+1)}.\n\\]\nFor a fixed solution, the constants are uniform on the indicated time\ninterval.  Uniformity over compact parameter families or as\n$\\lambda\\downarrow0$ is a separate interface and is not asserted here.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Short-Time Curvature Barrier&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:128,&quot;ref&quot;:&quot;MT:ch19:19.24&quot;}]},{&quot;id&quot;:&quot;controlled-curve-shrinking-interface&quot;,&quot;title&quot;:&quot;Controlled Curve-Shrinking Interface&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;280980cf9bde&quot;,&quot;label&quot;:&quot;thm:controlled-curve-shrinking-existence&quot;,&quot;title&quot;:&quot;Controlled curve shrinking for compact loop families&quot;,&quot;display_title&quot;:&quot;Theorem 4.35: Controlled curve shrinking for compact loop families&quot;,&quot;body&quot;:&quot;Let $g(t)$ be a Ricci flow on a compact manifold for\n$t\\in[t_0,t_1]$, and let\n$\\Gamma\\colon S^2\\to\\Lambda M$ be a continuous family of null-homotopic\nloops.  Assume that the degree-one lifts of the smooth approximating family\nadmit compact-parameter geometric curve-shrinking flows with common lifetime,\ncontinuous parameter dependence, and uniqueness up to time-dependent\nreparametrization.  Assume also that the initial ramp bounds and the\nsmall-turning hypotheses in the derivative estimates hold uniformly in\n$c\\in S^2$ and $0&lt;\\lambda&lt;1$.  Then for every $\\zeta&gt;0$ there is a homotopic family of smooth loops\n$\\widetilde\\Gamma$ with length and least spanning area within $\\zeta$ of\nthose of $\\Gamma$, and constants $L_0,\\Theta_0&lt;\\infty$ such that, for every\n$c\\in S^2$ and $0&lt;\\lambda&lt;1$, the degree-one lift\n$\\widetilde\\Gamma(c)^\\lambda\\subset M\\times S^1_\\lambda$ has a unique\ngeometric curve-shrinking flow, up to time-dependent reparametrization,\nthroughout $[t_0,t_1]$.  For each fixed $\\lambda$, these flows form a\ncontinuous family in $c$, remain ramps, obey uniform length and\ntotal-curvature bounds depending\non $L_0,\\Theta_0$ and the ambient flow, and satisfy the uniform local\ncurvature and derivative estimates above whenever the small-turning\nhypothesis holds.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Controlled Curve-Shrinking Interface&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:129,&quot;ref&quot;:&quot;MT:ch19:19.1,MT:ch19:19.10,MT:ch19:19.14,MT:ch19:19.17,MT:ch19:19.24&quot;}]}]},{&quot;id&quot;:&quot;extinction-component-topology&quot;,&quot;title&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;sections&quot;:[{&quot;id&quot;:&quot;two-sphere-width-control&quot;,&quot;title&quot;:&quot;Two-Sphere Width Control&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;05758bd0d841&quot;,&quot;label&quot;:&quot;def:two-sphere-width&quot;,&quot;title&quot;:&quot;Least nontrivial two-sphere area&quot;,&quot;display_title&quot;:&quot;Definition 5.1: Least nontrivial two-sphere area&quot;,&quot;body&quot;:&quot;Let $(X,g)$ be compact with $\\pi_2(X)\\ne0$.  Its \\emph{two-sphere width} is\n\\[\n W_2(X,g)=\\inf\\{\\operatorname{Area}_g(f):f\\colon S^2\\to X\\text{ is $C^1$ and not\n null-homotopic}\\}.\n\\]\nFor a component path $\\mathcal X$ in a Ricci flow with surgery, write\n\\[\n W_2(t)=W_2(\\mathcal X(t),g(t))\n\\]\nwhenever\n$\\pi_2(\\mathcal X(t))\\ne0$.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Two-Sphere Width Control&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:130,&quot;ref&quot;:&quot;MT:ch18:18.10&quot;},{&quot;id&quot;:&quot;1f26cb4f3c98&quot;,&quot;label&quot;:&quot;thm:two-sphere-width-realization&quot;,&quot;title&quot;:&quot;Realization of the two-sphere width&quot;,&quot;display_title&quot;:&quot;Theorem 5.2: Realization of the two-sphere width&quot;,&quot;body&quot;:&quot;Assume the Sacks--Uhlenbeck minimization and regularity theorem for the\nnonzero $\\pi_2$-class in this compact three-manifold.  If $(X,g)$ is compact\nand $\\pi_2(X)\\ne0$, then $W_2(X,g)&gt;0$ and there is a\nnon-null-homotopic conformal harmonic map $f\\colon S^2\\to X$, a branched\nminimal immersion away from finitely many points, such that\n\\[\n \\operatorname{Area}_g(f)=W_2(X,g).\n\\]&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Two-Sphere Width Control&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:131,&quot;ref&quot;:&quot;MT:ch18:18.10&quot;},{&quot;id&quot;:&quot;4e02960b5f84&quot;,&quot;label&quot;:&quot;lem:minimal-two-sphere-area-variation&quot;,&quot;title&quot;:&quot;Area variation of a minimal two-sphere&quot;,&quot;display_title&quot;:&quot;Lemma 5.3: Area variation of a minimal two-sphere&quot;,&quot;body&quot;:&quot;Let $g(t)$ be a Ricci flow on a three-manifold near $t_0$, and let\n$f\\colon S^2\\to(M,g(t_0))$ be a branched minimal immersion.  If\n$R_{\\min}(t_0)=\\min_M R_{g(t_0)}$, then\n\\[\n \\left.\\frac d{dt}\\right|_{t=t_0}\\operatorname{Area}_{g(t)}(f)\n \\le -4\\pi-\\frac12R_{\\min}(t_0)\\operatorname{Area}_{g(t_0)}(f).\n\\]&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Two-Sphere Width Control&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:132,&quot;ref&quot;:&quot;MT:ch18:18.12&quot;},{&quot;id&quot;:&quot;2472fed1c068&quot;,&quot;label&quot;:&quot;lem:fixed-sphere-area-distortion&quot;,&quot;title&quot;:&quot;Fixed-map area distortion&quot;,&quot;display_title&quot;:&quot;Lemma 5.4: Fixed-map area distortion&quot;,&quot;body&quot;:&quot;Let $g(t)$ be a Ricci flow on a compact manifold for\n$t\\in[t_0,t_1]$, suppose $|\\operatorname{Ric}_{g(t)}|\\le D$, and let\n$f\\colon S^2\\to M$ be $C^1$.  Then, for $s,t\\in[t_0,t_1]$,\n\\[\n e^{-4D|t-s|}\\operatorname{Area}_{g(s)}(f)\n \\le \\operatorname{Area}_{g(t)}(f)\n \\le e^{4D|t-s|}\\operatorname{Area}_{g(s)}(f).\n\\]&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Two-Sphere Width Control&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:133,&quot;ref&quot;:&quot;MT:ch18:18.13&quot;},{&quot;id&quot;:&quot;fa6d9839e669&quot;,&quot;label&quot;:&quot;lem:two-sphere-width-regular-continuity&quot;,&quot;title&quot;:&quot;Continuity of the two-sphere width at regular times&quot;,&quot;display_title&quot;:&quot;Lemma 5.5: Continuity of the two-sphere width at regular times&quot;,&quot;body&quot;:&quot;On a closed surgery-free interval on which the component is identified by\nthe Ricci-flow time vector field and has nonzero $\\pi_2$, the function $W_2$\nis continuous.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Two-Sphere Width Control&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:134,&quot;ref&quot;:&quot;MT:ch18:18.11,MT:ch18:18.13&quot;},{&quot;id&quot;:&quot;8dd1bd7dd325&quot;,&quot;label&quot;:&quot;thm:trivial-surgery-component-map&quot;,&quot;title&quot;:&quot;Component map for a trivial surgery&quot;,&quot;display_title&quot;:&quot;Theorem 5.6: Component map for a trivial surgery&quot;,&quot;body&quot;:&quot;Let $T$ be a surgery time, let $X(t)$ be a presurgery component for $t&lt;T$\nclose to $T$, and suppose every cutting sphere in this component is null\nhomotopic.  Assume the connected-sum analysis supplies, for each selected\npostsurgery component $Y$, a pinch map with the stated $\\pi_2$ uniqueness and\nhomotopy-equivalence properties, and a nonzero-degree map on $\\pi_3$ whenever\n$\\pi_3(X(t))\\cong\\mathbb Z$.  Then for every $\\eta&gt;0$ there is, for all\n$t&lt;T$ sufficiently close to $T$,\n\\[\n F_t\\colon X(t)\\longrightarrow Y,\n \\qquad \\operatorname{Lip}(F_t)\\le1+\\eta,\n\\]\nhomotopic to the corresponding connected-sum pinch map.  The component with\nnonzero $\\pi_2$, when it exists, is unique and its pinch map is a homotopy\nequivalence.  If $\\pi_2(X(t))=0$, then $\\pi_2(Y)=0$.  If in addition\n$\\pi_3(X(t))\\cong\\mathbb Z$, then $\\pi_3(Y)\\cong\\mathbb Z$ and $(F_t)_*$ is\nmultiplication by a nonzero integer; in particular it is injective.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Two-Sphere Width Control&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:135,&quot;ref&quot;:&quot;MT:ch18:18.18,MT:ch18:18.22,MT:ch15:15.12&quot;},{&quot;id&quot;:&quot;637f01ebdc91&quot;,&quot;label&quot;:&quot;lem:two-sphere-width-surgery-control&quot;,&quot;title&quot;:&quot;Two-sphere width across a trivial surgery&quot;,&quot;display_title&quot;:&quot;Lemma 5.7: Two-sphere width across a trivial surgery&quot;,&quot;body&quot;:&quot;Let $T$ be a surgery time after which the surgery spheres in a continuing\ncomponent are null homotopic, and suppose the selected postsurgery component\nhas nonzero $\\pi_2$.  Then\n\\[\n W_2(T)\\le\\liminf_{t\\uparrow T}W_2(t).\n\\]&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Two-Sphere Width Control&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:136,&quot;ref&quot;:&quot;MT:ch18:18.11,MT:ch15:15.12&quot;},{&quot;id&quot;:&quot;0a5091c62134&quot;,&quot;label&quot;:&quot;lem:two-sphere-width-forward-inequality&quot;,&quot;title&quot;:&quot;Forward inequality for the two-sphere width&quot;,&quot;display_title&quot;:&quot;Lemma 5.8: Forward inequality for the two-sphere width&quot;,&quot;body&quot;:&quot;Along a component path with nonzero $\\pi_2$, after all essential sphere\nsurgeries have ceased, $W_2$ is continuous at regular times, satisfies\n\\[\n D^+W_2(t)\\le-4\\pi-\\frac12R_{\\min}(t)W_2(t)\n\\]\nthere, and obeys the left lower-semicontinuity inequality of\n\\ref{lem:two-sphere-width-surgery-control} at every surgery time.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Two-Sphere Width Control&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:137,&quot;ref&quot;:&quot;MT:ch18:18.11&quot;},{&quot;id&quot;:&quot;6364ac4cf64c&quot;,&quot;label&quot;:&quot;thm:finite-essential-sphere-surgeries&quot;,&quot;title&quot;:&quot;Finiteness of essential sphere surgeries&quot;,&quot;display_title&quot;:&quot;Theorem 5.9: Finiteness of essential sphere surgeries&quot;,&quot;body&quot;:&quot;Assume that each essential sphere surgery decreases a nonnegative integer\ntopological complexity by at least one, while the initial complexity is\nfinite.  Then, in a controlled Ricci flow with surgery, only finitely many\nsurgery times use\na sphere which is non-null-homotopic in its presurgery component.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Two-Sphere Width Control&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:138,&quot;ref&quot;:&quot;MT:ch18:18.7,MT:ch18:18.5&quot;}]},{&quot;id&quot;:&quot;eventual-vanishing-of-2&quot;,&quot;title&quot;:&quot;Eventual Vanishing of _2&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;c498839d073a&quot;,&quot;label&quot;:&quot;lem:extinction-scalar-curvature-lower-bound&quot;,&quot;title&quot;:&quot;Scalar-curvature lower bound&quot;,&quot;display_title&quot;:&quot;Lemma 5.10: Scalar-curvature lower bound&quot;,&quot;body&quot;:&quot;For the normalized all-time controlled surgery flow, including the\npostsurgery time slices,\n\\[\n R_{\\min}(t)\\ge-\\frac6{1+4t}.\n\\]&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Eventual Vanishing of _2&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:139,&quot;ref&quot;:&quot;MT:ch18:18.1,MT:ch15:15.9&quot;},{&quot;id&quot;:&quot;a8a4aa399c74&quot;,&quot;label&quot;:&quot;thm:noncompact-two-connected-cover-contractible&quot;,&quot;title&quot;:&quot;Noncompact two-connected covers are contractible&quot;,&quot;display_title&quot;:&quot;Theorem 5.11: Noncompact two-connected covers are contractible&quot;,&quot;body&quot;:&quot;Let $X$ be a connected three-manifold with $\\pi_2(X)=0$.  If its universal\ncover $\\widetilde X$ is noncompact, then $\\widetilde X$ is contractible.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Eventual Vanishing of _2&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:140,&quot;ref&quot;:&quot;MT:ch18:18.9,Hatcher:ch3:3.29,Hatcher:ch4:4.5,Hatcher:ch4:4.32&quot;},{&quot;id&quot;:&quot;0071c4676014&quot;,&quot;label&quot;:&quot;thm:eventual-pi2-vanishing&quot;,&quot;title&quot;:&quot;Eventual vanishing of _2&quot;,&quot;display_title&quot;:&quot;Theorem 5.12: Eventual vanishing of _2&quot;,&quot;body&quot;:&quot;For an all-time controlled surgery flow there is $T_1&lt;\\infty$ such that every\ncomponent of every time slice $M_T$, $T\\ge T_1$, has trivial $\\pi_2$.  Any\nsuch component with infinite fundamental group has contractible universal\ncover.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Eventual Vanishing of _2&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:141,&quot;ref&quot;:&quot;MT:ch18:18.9&quot;}]},{&quot;id&quot;:&quot;late-component-3-topology&quot;,&quot;title&quot;:&quot;Late-Component _3 Topology&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;5f0941d364d0&quot;,&quot;label&quot;:&quot;thm:component-fundamental-group-persistence&quot;,&quot;title&quot;:&quot;Persistence of the fundamental-group class&quot;,&quot;display_title&quot;:&quot;Theorem 5.13: Persistence of the fundamental-group class&quot;,&quot;body&quot;:&quot;Let $[0,T]$ be a bounded interval containing only finitely many surgery times.\nSuppose the fundamental group of every initial component of a controlled\nsurgery flow is a free product of finitely many finite groups and infinite\ncyclic groups.  Then the same is true for every component of every time slice\nup to $T$.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Late-Component _3 Topology&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:142,&quot;ref&quot;:&quot;MT:ch18:18.19,MT:ch15:15.3&quot;},{&quot;id&quot;:&quot;db2a61f4d32e&quot;,&quot;label&quot;:&quot;thm:free-product-pi2-obstruction&quot;,&quot;title&quot;:&quot;Free-product obstruction to vanishing _2&quot;,&quot;display_title&quot;:&quot;Theorem 5.14: Free-product obstruction to vanishing _2&quot;,&quot;body&quot;:&quot;Assume the closed three-manifold sphere/free-product theorem in the form that\na nontrivial free product or an infinite cyclic fundamental group yields an\nessential (non-null-homotopic) embedded $2$-sphere.  If $X$ is a closed\nconnected th
