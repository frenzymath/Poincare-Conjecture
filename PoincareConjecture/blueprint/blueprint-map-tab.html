;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;61db94ef73bd&quot;,&quot;label&quot;:&quot;lem:canonical-neighborhood-first-failure&quot;,&quot;title&quot;:&quot;First canonical-neighborhood failure&quot;,&quot;display_title&quot;:&quot;Lemma 3.19: First canonical-neighborhood failure&quot;,&quot;body&quot;:&quot;Fix a finite induction stage and a sequence $r_a\\downarrow0$.  Suppose that\nfor every $a$ there are controlled surgery flows with surgery controls\ntending to zero for which the strong $(C,\\epsilon)$-canonical-neighborhood\nassumption with parameter $r_a$ fails before the stage endpoint.  For each\n$a$, after passing sufficiently far down that sequence, there is a first\nfailure time $t_{a,b}$ and a point $x_{a,b}$ at that time such that\n$R(x_{a,b})\\ge r_a^{-2}$, the assumption holds before $t_{a,b}$, and no\nstrong $(C,\\epsilon)$-canonical neighborhood exists at $x_{a,b}$.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;First-Failure Extension&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:119,&quot;ref&quot;:&quot;MT:ch17:17.2&quot;},{&quot;id&quot;:&quot;b83aa6787faa&quot;,&quot;label&quot;:&quot;lem:standard-cap-encounter-control&quot;,&quot;title&quot;:&quot;A bounded-curvature cap encounter is standard&quot;,&quot;display_title&quot;:&quot;Lemma 3.20: A bounded-curvature cap encounter is standard&quot;,&quot;body&quot;:&quot;Consider rescaled first-failure flows and a backward flow line, starting in\na fixed-radius zero-time ball, which reaches a surgery cap after rescaled\ntime $s_a\\le s&#x27;&lt;\\infty$.  If scalar curvature along the line is bounded by\n$D&#x27;&lt;\\infty$ and $\\bar h_a$ is the rescaled surgery scale, then for all large\n$a$ there are constants $c=c(D&#x27;,s&#x27;)&gt;0$, $A&lt;\\infty$, and $\\theta&lt;1$ such that\n\\[\n \\bar h_a^2\\ge c,\n \\qquad s_a&lt;\\theta\\bar h_a^2,\n\\]\nand the point where the line reaches the surgery slice lies in the image of\nthe standard-solution ball $B(p_0,A)$ used to model the cap.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;First-Failure Extension&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:120,&quot;ref&quot;:&quot;MT:ch17:17.4,MT:ch17:17.5,MT:ch17:17.8&quot;},{&quot;id&quot;:&quot;2412c0bb3696&quot;,&quot;label&quot;:&quot;lem:bounded-flow-line-cap-exclusion&quot;,&quot;title&quot;:&quot;A cap-reaching flow line forces a canonical neighborhood&quot;,&quot;display_title&quot;:&quot;Lemma 3.21: A cap-reaching flow line forces a canonical neighborhood&quot;,&quot;body&quot;:&quot;In a rescaled first-failure sequence, suppose a point in a fixed-radius\nzero-time ball has a backward flow line of uniformly bounded scalar\ncurvature which reaches a surgery cap in uniformly bounded time.  Then the\nbase first-failure points have strong $(C,\\epsilon)$-canonical neighborhoods\nfor all sufficiently large indices.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;First-Failure Extension&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:121,&quot;ref&quot;:&quot;MT:ch17:17.7&quot;},{&quot;id&quot;:&quot;f2712cff9330&quot;,&quot;label&quot;:&quot;lem:rescaled-high-curvature-canonical-control&quot;,&quot;title&quot;:&quot;High-curvature control in a rescaled failure slice&quot;,&quot;display_title&quot;:&quot;Lemma 3.22: High-curvature control in a rescaled failure slice&quot;,&quot;body&quot;:&quot;After rescaling first-failure points to scalar curvature one and taking the\nsurgery controls to zero, every point of the zero-time slice with scalar\ncurvature greater than one has a strong\n$(2C,2\\epsilon)$-canonical neighborhood for all sufficiently large indices.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;First-Failure Extension&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:122,&quot;ref&quot;:&quot;MT:ch17:17.6&quot;},{&quot;id&quot;:&quot;96ba06153485&quot;,&quot;label&quot;:&quot;lem:first-failure-zero-slice-canonical-transfer&quot;,&quot;title&quot;:&quot;Canonical transfer on a surviving first-failure slice&quot;,&quot;display_title&quot;:&quot;Lemma 3.23: Canonical transfer on a surviving first-failure slice&quot;,&quot;body&quot;:&quot;Consider a diagonal first-failure sequence of controlled flows, with failure\npoints $(x_j,t_j)$ and scales\n$Q_j=R_{g_j(t_j)}(x_j)\\to\\infty$.  Choose the threshold parameters so that\n$r_j^{-2}/Q_j\\le\\vartheta&lt;1$ (enlarging $r_j$ slightly before taking the\ndiagonal if necessary), and translate and rescale by $Q_j$ so that the\nfailure points have scalar curvature one at time zero.  Assume that, for every\nfixed $A&lt;\\infty$, the zero-time $A$-ball has a compatible unscathed backward\nparabolic neighborhood on a common positive time interval.  Then every\nsequence of points in these zero-time balls whose rescaled scalar curvature is\nat least one has, after passing to a subsequence, a strong\n$(2C,2\\epsilon)$-canonical neighborhood.  In particular the conclusion is\nindependent of whether the containing component has positive sectional\ncurvature; no positivity-to-model inference is being made.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;First-Failure Extension&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:123,&quot;ref&quot;:&quot;MT:ch17:17.1,MT:ch17:17.2,MT:ch17:17.6,MT:ch17:17.7&quot;},{&quot;id&quot;:&quot;b9cb0afd564e&quot;,&quot;label&quot;:&quot;lem:first-failure-noncollapsing-bridge&quot;,&quot;title&quot;:&quot;First-failure noncollapsing bridge&quot;,&quot;display_title&quot;:&quot;Lemma 3.24: First-failure noncollapsing bridge&quot;,&quot;body&quot;:&quot;Let $0&lt;r_+\\le r_-\\le\\epsilon$, $\\kappa_-&gt;0$, and\n$0&lt;E_-\\le E&lt;\\infty$ be fixed.  Let $a&lt;b&lt;c$ satisfy\n$b-a\\ge E_-$ and $c-a\\le E$.  Consider a sequence of flows with\nfirst-failure points $(x_j,t_j)$ with $t_j\\in[b,c)$, put\n$Q_j=R_{g_j(t_j)}(x_j)$, and define\nthe translated parabolic rescalings\n\\[\n \\widetilde g_j(s)=Q_jg_j(t_j+Q_j^{-1}s),\n \\qquad R_{\\widetilde g_j(0)}(x_j)=1.\n\\]\nAssume the original flows are three-dimensional Ricci flows with\n$(r,\\delta)$-cutoff, normalized compact initial data, and global stage\nparameter $r\\le\\epsilon$, with $r\\ge r_-$ on\n$[a,b)$ and $r\\ge r_+$ on $[b,c)$, ordinary $\\kappa_-$-noncollapsing on\n$[a,b)$ at every scale below $\\epsilon$, and cutoff\n$\\delta(t)\\le\\bar\\delta(r_-,r_+,\\kappa_-,E_-,E)$ on $[a,c)$.  Assume that\nthe strong $r_+$ canonical-neighborhood hypothesis holds on $[b,c)$.  Let\n$\\kappa_+$ be the\nconstant supplied by\n\\ref{lem:kleiner-lott-noncollapsing-estimate}.  Then, after passing to a\nsubsequence, one may use the single constant $\\kappa_*:=\\kappa_+$ on every\nfixed zero-time based ball: whenever the backward parabolic ball of scale\n$\\rho\\le\\epsilon$ exists, is unscathed, and has curvature at most\n$\\rho^{-2}$, its time-zero ball satisfies\n\\[\n \\operatorname{Vol}_{\\widetilde g_j(0)}\n B_{\\widetilde g_j(0)}(x_j,\\rho)\n \\ge \\kappa_*\\rho^3\n \\quad\\text{or}\\quad\n x_j\\text{ lies in a positive-sectional-curvature component}.\n\\]\nIf an independent hypothesis excludes that positive-component alternative at\nthe selected basepoints, then the displayed inequality gives the fixed volume\n$v_0=\\kappa_*\\eta^3$ on every common backward neighborhood of radius\n$\\eta&gt;0$; the bridge itself does not supply that exclusion.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;First-Failure Extension&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:124,&quot;ref&quot;:&quot;MT:ch16:16.1,MT:ch17:17.1,KL:II.5:II.5.2&quot;},{&quot;id&quot;:&quot;f493bd5c56ad&quot;,&quot;label&quot;:&quot;lem:pre-failure-kappa-limit&quot;,&quot;title&quot;:&quot;Pre-failure KAPPA-limit noncollapsing&quot;,&quot;display_title&quot;:&quot;Lemma 3.25: Pre-failure KAPPA-limit noncollapsing&quot;,&quot;body&quot;:&quot;Take the diagonal first-failure sequence with stage parameters\n$r_a\\downarrow0$, surgery controls $0&lt;\\delta_a\\le\\delta(r_a)$, where\n$\\delta(r_a)$ denotes the fixed selector value from\n\\ref{def:stagewise-delta-selector}, and\n$\\delta_a\\to0$, and failure points $(x_a,t_a)$ chosen after the preceding\ncanonical-neighborhood interval.  After translating $t_a$ to zero and\nrescaling by $Q_a=R(x_a,t_a)\\to\\infty$, the negative-time truncations satisfy\nthe Morgan--Tian/Kleiner--Lott noncollapsing predicate with one constant\n$\\kappa_0&gt;0$ on every scale below $\\epsilon$: every admissible test ball has\nvolume at least $\\kappa_0\\rho^3$, unless its centre lies in a compact\npositive-sectional-curvature component.  The predicate is uniform on every\nfixed compact spacetime region and is inherited by smooth pointed limits.\nIf the selected basepoint component is not positive, the ordinary volume\nbranch holds at every admissible based ball, including the fixed radius used\nfor Hamilton compactness.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;First-Failure Extension&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:125,&quot;ref&quot;:&quot;MT:ch17:17.1,MT:ch14:14.14,MT:ch14:14.15&quot;},{&quot;id&quot;:&quot;05c1aec75380&quot;,&quot;label&quot;:&quot;lem:short-backward-curvature-control&quot;,&quot;title&quot;:&quot;Short backward curvature control&quot;,&quot;display_title&quot;:&quot;Lemma 3.26: Short backward curvature control&quot;,&quot;body&quot;:&quot;Consider the diagonal first-failure sequence with $r_a\\downarrow0$,\n$\\delta_a\\le\\delta(r_a)$ and $\\delta_a\\to0$, where $\\delta(r_a)$ is the fixed\nselector value from \\ref{def:stagewise-delta-selector}, with the strong\n$(C,\\epsilon)$-canonical-neighborhood assumption on every pre-failure slice.\nWrite $\\widehat x_a$ for the unrescaled first-failure point and\n$Q_a=R_{G_a}(\\widehat x_a)\\to\\infty$, and assume the diagonal has been chosen\nwith a fixed $\\vartheta&lt;1$ satisfying\n$r_a^{-2}/Q_a\\le\\vartheta$.\nAssume the source KAPPA-limit predicate of\n\\ref{lem:pre-failure-kappa-limit} on the negative-time truncations.  For\nevery $A&lt;\\infty$ there are $D(A)&lt;\\infty$ and $\\sigma(A)&gt;0$ such that,\nwriting $x_a$ for the point corresponding to $\\widehat x_a$ after rescaling by\n$Q_a$, every sufficiently advanced rescaled flow has scalar curvature at most\n$D(A)$ along each\nbackward flow line starting in $B(x_a,0,A)$ for as long as that line exists\nin $[-\\sigma(A),0]$.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;First-Failure Extension&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:126,&quot;ref&quot;:&quot;MT:ch17:17.9&quot;},{&quot;id&quot;:&quot;82648ce2769b&quot;,&quot;label&quot;:&quot;lem:backward-parabolic-neighborhood-dichotomy&quot;,&quot;title&quot;:&quot;Backward parabolic-neighborhood dichotomy&quot;,&quot;display_title&quot;:&quot;Lemma 3.27: Backward parabolic-neighborhood dichotomy&quot;,&quot;body&quot;:&quot;After passing to a subsequence of rescaled first-failure flows, write $x_a$\nfor the normalized first-failure basepoint in the $a$-th flow.  At least one\nof the following alternatives occurs (the statement does not assert that the\ntwo alternatives are logically disjoint):\n\\begin{enumerate}\n\\item for every $A&lt;\\infty$ there are $D(A),s(A)&gt;0$ and an index $a(A)$ such\n      that, for every $a\\ge a(A)$, the compatible parabolic neighborhood\n      $P(x_a,0,A,-s(A))$ exists and has\n      $|\\operatorname{Rm}|\\le D(A)$;\n\\item on an infinite subsequence (renamed), every sufficiently late basepoint\n      has a strong $(C,\\epsilon)$-canonical neighborhood.\n\\end{enumerate}&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;First-Failure Extension&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:127,&quot;ref&quot;:&quot;MT:ch17:17.10&quot;},{&quot;id&quot;:&quot;0eb0bf7ca335&quot;,&quot;label&quot;:&quot;lem:first-failure-limit-slice-bounded-curvature&quot;,&quot;title&quot;:&quot;Bounded curvature of a first-failure limit slice&quot;,&quot;display_title&quot;:&quot;Lemma 3.28: Bounded curvature of a first-failure limit slice&quot;,&quot;body&quot;:&quot;Let a time slice of a pointed first-failure limit be complete, nonflat, and\nnonnegatively curved.  Suppose it is ordinarily $\\kappa$-noncollapsed on all\nfinite scales and is the smooth limit of slices on which points above a fixed\nscalar-curvature threshold have uniform canonical neighborhoods.  Then its\ncurvature is bounded on the whole slice.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;First-Failure Extension&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:128,&quot;ref&quot;:&quot;MT:ch11:11.7&quot;},{&quot;id&quot;:&quot;074ddf37c4ae&quot;,&quot;label&quot;:&quot;lem:uniform-backward-lifetime&quot;,&quot;title&quot;:&quot;Uniform backward lifetime&quot;,&quot;display_title&quot;:&quot;Lemma 3.29: Uniform backward lifetime&quot;,&quot;body&quot;:&quot;Suppose the first alternative of\n\\ref{lem:backward-parabolic-neighborhood-dichotomy} holds and the basepoints\nremain first-failure points.  The backward lifetimes $s(A)$ may then be\nchosen bounded below by one number $s_*&gt;0$ independent of $A$.  Extending\nmaximally, either the compatible neighborhoods exist for every backward\ntime, or a flow line starting in one fixed-radius zero-time based ball\nreaches a surgery cap at the finite maximal backward time with curvature\nbounded in the original first-failure normalization.  In the infinite-\nextension alternative there are, in addition, numbers $\\eta_*&gt;0$ and\n$K_*&lt;\\infty$, independent of the sequence index, such that\n$P(x_a,0,\\eta_*,-\\eta_*^2)$ is compatible and unscathed and\n$|\\operatorname{Rm}|\\le K_*$ on it.  The radius may be decreased so that\n$\\eta_*\\le K_*^{-1/2}$.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;First-Failure Extension&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:129,&quot;ref&quot;:&quot;MT:ch17:17.11&quot;},{&quot;id&quot;:&quot;0d805aef8325&quot;,&quot;label&quot;:&quot;thm:strong-canonical-neighborhood-extension&quot;,&quot;title&quot;:&quot;Extension of strong canonical neighborhoods&quot;,&quot;display_title&quot;:&quot;Theorem 3.30: Extension of strong canonical neighborhoods&quot;,&quot;body&quot;:&quot;Fix finite stage-$i$ data with ordinary $\\kappa_i$-noncollapsing before\n$T_i$, the stage time-gap bounds, positive pinching, and the cutoff controls\nused in \\ref{thm:conditional-noncollapsing-extension}; importantly, do not\nassume its later-interval canonical-neighborhood conclusion.  Then there are\n$0&lt;r_{i+1}\\le r_i$ and\n$0&lt;\\delta_{i+1}\\le\\mathfrak d_i(r_{i+1})$ such that the following holds.  If a\ncontrolled Ricci flow with surgery on $[0,T)$,\n$T\\in(T_i,T_{i+1}]$, has $\\bar\\delta\\le\\delta_{i+1}$ on\n$[T_{i-1},T]$ and satisfies the stage-$i$ pinching, noncollapsing, and\ncanonical-neighborhood hypotheses before $T_i$, then it satisfies the strong\n$(C,\\epsilon)$-canonical-neighborhood assumption with parameter\n$r_{i+1}$ throughout $[0,T)$.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;First-Failure Extension&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:130,&quot;ref&quot;:&quot;MT:ch17:17.1&quot;}]},{&quot;id&quot;:&quot;surgery-continuation-and-finiteness&quot;,&quot;title&quot;:&quot;Surgery Continuation and Finiteness&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;8d62fb7b0ff0&quot;,&quot;label&quot;:&quot;lem:length-metric-gluing&quot;,&quot;title&quot;:&quot;Length-metric gluing for finitely many surgery pieces&quot;,&quot;display_title&quot;:&quot;Lemma 3.31: Length-metric gluing for finitely many surgery pieces&quot;,&quot;body&quot;:&quot;Let a smooth Riemannian manifold $X$ be cut along finitely many disjoint\nembedded two-spheres into compact codimension-zero pieces $X_1,\\ldots,X_m$,\nwith the induced length metrics and the original collar metric on each common\nboundary.  Let $(Y,d_Y)$ be a metric space and let\n$F_i\\colon X_i\\to Y$ be maps which agree on every common boundary sphere.\nIf each $F_i$ is $L$-Lipschitz for its intrinsic length metric, then the\nglued map $F\\colon X\\to Y$ is $L$-Lipschitz for the ambient Riemannian\ndistance on $X$.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Surgery Continuation and Finiteness&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:131,&quot;ref&quot;:&quot;MT:ch13:13.2&quot;},{&quot;id&quot;:&quot;49993844fd32&quot;,&quot;label&quot;:&quot;lem:rp2-exclusion-under-ball-surgery&quot;,&quot;title&quot;:&quot;Two-sided projective-plane exclusion survives ball surgery&quot;,&quot;display_title&quot;:&quot;Lemma 3.32: Two-sided projective-plane exclusion survives ball surgery&quot;,&quot;body&quot;:&quot;Let $M^-$ be a closed smooth three-manifold (possibly nonorientable)\ncontaining no embedded $\\mathbb{RP}^2$ with trivial normal bundle.  Obtain\n$M^+$ by finitely many\ndisjoint neck surgeries, each deleting a three-ball side and gluing a smooth\nthree-ball cap along its spherical boundary, and by discarding whole\ncomponents.  Then $M^+$ also contains no embedded $\\mathbb{RP}^2$ with trivial\nnormal bundle.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Surgery Continuation and Finiteness&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:132,&quot;ref&quot;:&quot;MT:ch15:15.8&quot;},{&quot;id&quot;:&quot;bfa2180fd4c9&quot;,&quot;label&quot;:&quot;lem:controlled-surgery-restart&quot;,&quot;title&quot;:&quot;Controlled restart after surgery&quot;,&quot;display_title&quot;:&quot;Lemma 3.33: Controlled restart after surgery&quot;,&quot;body&quot;:&quot;Let a controlled Ricci flow reach a finite singular time $T$.  In its maximal\nextension, cut every sufficiently curved horn at the central sphere of a\nstrong $\\bar\\delta(T)$-neck of scale $h(T)$, discard each horn end and each\ncomponent containing no controlled-curvature point, and insert the standard\ncaps.  For sufficiently small control, the post-surgery metric is smooth,\nretains curvature pinching, satisfies the seven controlled-flow conditions,\nand is initial data for a maximal ordinary Ricci flow.  The new flow retains\nthe stage noncollapsing and strong canonical-neighborhood estimates.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Surgery Continuation and Finiteness&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:133,&quot;ref&quot;:&quot;MT:ch15:15.8,MT:ch15:15.11&quot;},{&quot;id&quot;:&quot;956e98090959&quot;,&quot;label&quot;:&quot;thm:separating-surgery-map&quot;,&quot;title&quot;:&quot;Map across a separating surgery: removed-region comparison&quot;,&quot;display_title&quot;:&quot;Theorem 3.34: Map across a separating surgery: removed-region comparison&quot;,&quot;body&quot;:&quot;Let $({\\mathcal M},G)$ be a controlled Ricci flow with surgery satisfying\nAssumptions~(1)--(7) of the Morgan--Tian controlled-flow definition.  Let\n$T$ be a surgery time with control parameter\n$\\bar\\delta(T)&lt;\\delta&#x27;_0$ and surgery scale $h(T)&lt;R_0^{-1/2}$, where\n$\\delta&#x27;_0,R_0$ are the constants of\n\\ref{thm:local-neck-surgery}.  Fix a regular $t&#x27;&lt;T$ sufficiently close to\n$T$, let $X(t&#x27;)$ be a presurgery component, and let $X(T)$ be a component\nobtained from it at $T$.  If every cutting two-sphere in $X(t&#x27;)$ is\nseparating, then the time-flow embedding has an open bounded-curvature\ndomain $\\Omega\\subset X(t&#x27;)$ whose metric limit exists and whose limiting\nidentification is an isometry onto an open subset of $X(T)$.  The\nidentification extends continuously to a map\n\\[\n F\\colon X(t&#x27;)\\longrightarrow X(T)\n\\]\nsuch that, for every regular time $t&lt;T$ sufficiently close to $T$, its\nrestriction to $X(t&#x27;)\\setminus\\Omega$, measured with the time-$t$ pulled-back\nmetric, is distance nonincreasing into $X(T)$.  The radial cross-neck\nextension is the one supplied by the local surgery theorem.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Surgery Continuation and Finiteness&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:134,&quot;ref&quot;:&quot;MT:ch15:15.12,MT:ch13:13.2&quot;},{&quot;id&quot;:&quot;823193a5cb49&quot;,&quot;label&quot;:&quot;lem:global-surgery-map-lipschitz&quot;,&quot;title&quot;:&quot;Global Lipschitz extension across trivial surgery&quot;,&quot;display_title&quot;:&quot;Lemma 3.35: Global Lipschitz extension across trivial surgery&quot;,&quot;body&quot;:&quot;In the setting of\n\\ref{thm:separating-surgery-map}, assume in addition that the selected\npost-surgery component has a decomposition\n\\[\n X(T)=C(T)\\cup K_1(T)\\cup\\cdots\\cup K_m(T),\n\\]\nwhere $C(T)$ is a compact codimension-zero persistent core, the $K_i(T)$ are\nfinitely many compact surgery caps with pairwise disjoint interiors, and all\ncommon boundaries are the cutting two-spheres.  Assume every cutting sphere\nis homotopically trivial in $X(t&#x27;)$.  For $t&#x27;&lt;T$ sufficiently close to $T$,\nthe backward flow identifies $C(T)$ with a compact submanifold\n$C(t&#x27;)\\subset X(t&#x27;)$ by an embedding $n_{t&#x27;}$, and\n\\[\n n_{t&#x27;}^{*}\\bigl(g(t&#x27;)|_{C(t&#x27;)}\\bigr)\\longrightarrow G(T)|_{C(T)}\n \\quad\\text{in }C^\\infty\\text{ on }C(T).\n\\]\nThen, for every $\\eta&gt;0$, there is $t_\\eta&lt;T$ such that for every regular\n$t&#x27;\\in(t_\\eta,T)$ the inverse core map $n_{t&#x27;}^{-1}$ extends over the\nfinitely many cap pieces to a map\n\\[\n \\psi_{t&#x27;}\\colon X(t&#x27;)\\longrightarrow X(T)\n\\]\nwhich maps $X(t&#x27;)\\setminus C(t&#x27;)$ into the union of the caps and satisfies\n\\[\n \\operatorname{Lip}_{(X(t&#x27;),g(t&#x27;))\\to(X(T),G(T))}(\\psi_{t&#x27;})\\le 1+\\eta\n\\]\nfor that $\\eta$.  This metric extension statement deliberately makes no\nhomotopy-type claim; the old-type versus homotopy-sphere-descendant\nalternative is supplied by the separate topology contract before any\nhomotopy consumer invokes $\\psi_{t&#x27;}$.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Surgery Continuation and Finiteness&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:135,&quot;ref&quot;:&quot;MT:ch18:18.18,MT:ch15:15.12&quot;},{&quot;id&quot;:&quot;2c345842c2a8&quot;,&quot;label&quot;:&quot;lem:cutoff-surgery-volume-loss&quot;,&quot;title&quot;:&quot;Uniform volume loss at a cutoff surgery&quot;,&quot;display_title&quot;:&quot;Lemma 3.36: Uniform volume loss at a cutoff surgery&quot;,&quot;body&quot;:&quot;Fix the dimension-three neck parameter $\\epsilon$ and choose the cutoff\nparameter $\\bar\\delta$ below the standard cap threshold.  There is a constant\n$c_{\\rm vol}=c_{\\rm vol}(\\epsilon,\\bar\\delta)&gt;0$ such that, at every cutoff\nsurgery on a central neck of scale $h$, the total volume after inserting the\nstandard cap and discarding the exposed component satisfies\n\\[\n \\operatorname{Vol}(M_t^-)-\\operatorname{Vol}(M_t^+)\n \\ge c_{\\rm vol}h^3.\n\\]\nThe same bound holds componentwise whenever a neck is cut, and it is uniform\nover all scales and all surgery times for which the displayed parameters are\nused.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Surgery Continuation and Finiteness&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:136,&quot;ref&quot;:&quot;KL:II.4:volumelossremark,MT:ch17:17.12&quot;},{&quot;id&quot;:&quot;5fcc1cb5b7db&quot;,&quot;label&quot;:&quot;thm:finite-interval-surgery-bound&quot;,&quot;title&quot;:&quot;Finite surgery count on bounded intervals&quot;,&quot;display_title&quot;:&quot;Theorem 3.37: Finite surgery count on bounded intervals&quot;,&quot;body&quot;:&quot;Let a controlled Ricci flow with surgery be defined on $[0,T)$ with\n$T\\le T_{i+1}$ and with the control functions fixed on that interval.  Assume\nthe positive nonincreasing cutoff function $\\bar\\delta$ is defined through\n$T_{i+1}$ and that $r(t)\\ge r_{i+1}&gt;0$ there.  Put\n\\[\n \\Phi:=\\Phi_{\\rm HI}^{T_{i+1},g(0)}\n \\quad\\text{from \\ref{lem:finite-horizon-surgery-phi-envelope}},\n \\qquad\n h_*:=H_*(\\Phi,T_{i+1},r_{i+1},\n              \\bar\\delta(T_{i+1}))&gt;0,\n\\]\nwhere $H_*$ is the bounded-stage lower envelope from\n\\ref{lem:ricci-flow-surgery-horn-scale}.  Then every cutting neck in $[0,T)$\nhas $h(t)\\ge h_*$.  There is\n\\[\n N=N\\bigl(\\operatorname{Vol}(M_0,g(0)),T_{i+1},r_{i+1},\n             \\bar\\delta(T_{i+1}),h_*\\bigr)&lt;\\infty\n\\]\nsuch that the flow has at most $N$ surgery times in $[0,T)$.  In particular,\nsurgery times cannot accumulate in a bounded interval.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Surgery Continuation and Finiteness&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:137,&quot;ref&quot;:&quot;MT:ch17:17.12&quot;}]},{&quot;id&quot;:&quot;all-time-controlled-extension&quot;,&quot;title&quot;:&quot;All-Time Controlled Extension&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;0b42ab3768f4&quot;,&quot;label&quot;:&quot;thm:all-time-controlled-surgery-flow&quot;,&quot;title&quot;:&quot;All-time controlled Ricci flow with surgery&quot;,&quot;display_title&quot;:&quot;Theorem 3.38: All-time controlled Ricci flow with surgery&quot;,&quot;body&quot;:&quot;There are positive nonincreasing sequences\n$\\mathbf K=(\\kappa_i)_{i\\ge0}$,\n$\\boldsymbol\\delta=(\\delta_i)_{i\\ge0}$, and\n$\\mathbf r=(r_i)_{i\\ge0}$ with the following property.  For every positive\nnonincreasing function $\\bar\\delta\\colon[0,\\infty)\\to(0,\\infty)$ which has\nno transition on $[0,T_0]$ and satisfies\n\\[\n\\bar\\delta(t)&lt;\\delta_{i+1}\\le\\delta_0^{\\rm cap}\n\\qquad\\text{at every transition }T_i&lt;t\\le T_{i+1},\n\\]\nevery normalized compact three-manifold containing no embedded\n$\\mathbb{RP}^2$ with trivial normal bundle is the initial slice of a controlled\nRicci flow with surgery on $[0,\\infty)$ using the Kleiner--Lott\n$(r,\\bar\\delta)$-cutoff of \\ref{def:ricci-flow-with-cutoff}.  For\n$i\\ge0$, $t\\in[T_i,T_{i+1})$, $x\\in M_t$, and\n$0&lt;\\rho\\le\\epsilon$, every parabolic ball satisfying the curvature hypothesis in\n\\ref{def:surgery-flow-noncollapsing} satisfies its source disjunction with\nconstant $\\kappa_{i+1}$: either its volume is at least\n$\\kappa_{i+1}\\rho^3$, or $x$ lies in a component with positive sectional\ncurvature.  Any later use requiring a volume bound is restricted to the first\nbranch (or supplies a separate compact positive-component estimate).\nThe flow satisfies the strong $(C,\\epsilon)$-canonical-neighborhood assumption\nwith parameter $r_{i+1}$, has curvature pinched toward positive, and uses\nsurgery control at most $\\delta_{i+1}$.  Its surgery times are finite on every\nbounded interval.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;All-Time Controlled Extension&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:138,&quot;ref&quot;:&quot;MT:ch15:15.9,MT:ch15:15.10&quot;}]}]},{&quot;id&quot;:&quot;curve-shrinking-estimates&quot;,&quot;title&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;sections&quot;:[{&quot;id&quot;:&quot;curve-flow-geometry&quot;,&quot;title&quot;:&quot;Curve-Flow Geometry&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;bcc086f18ab4&quot;,&quot;label&quot;:&quot;lem:curve-flow-speed-and-tangent-evolution&quot;,&quot;title&quot;:&quot;Speed and tangent evolution&quot;,&quot;display_title&quot;:&quot;Theorem 4.1: Speed and tangent evolution&quot;,&quot;body&quot;:&quot;Let $\\widehat c(x,t)=(c(x,t),t)$ and\n$\\widehat H=\\widehat c_*(\\partial_t)=H+\\partial_t$.  Then\n\\[\n \\widehat H(|X|^2)=-2\\operatorname{Ric}_g(X,X)-2k^2|X|^2,\n \\qquad\n [\\widehat H,S]=(k^2+\\operatorname{Ric}_g(S,S))S .\n\\]\nEquivalently, the first formula is the time derivative of the squared speed in\nthe evolving pulled-back metric.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Curve-Flow Geometry&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:139,&quot;ref&quot;:&quot;MT:ch19:19.6&quot;},{&quot;id&quot;:&quot;a26bc71fd1e8&quot;,&quot;label&quot;:&quot;lem:space-time-metric-connection&quot;,&quot;title&quot;:&quot;Space-time metric connection identities&quot;,&quot;display_title&quot;:&quot;Lemma 4.2: Space-time metric connection identities&quot;,&quot;body&quot;:&quot;Equip $M\\times I$ with the metric $\\widehat g=g(t)+dt^2$, and denote its\nLevi--Civita connection by $\\nabla$.  If $A,B$ are horizontal vector fields,\nthen\n\\[\n \\nabla_A B=\\nabla_A^gB+\\operatorname{Ric}_g(A,B)\\partial_t,\n \\qquad\n \\langle\\nabla_A\\partial_t,B\\rangle\n       =-\\operatorname{Ric}_g(A,B),\n\\]\nand $\\nabla_A\\partial_t$ is horizontal.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Curve-Flow Geometry&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:140,&quot;ref&quot;:&quot;MT:ch19:19.7&quot;}]},{&quot;id&quot;:&quot;product-circle-geometry-and-ramp-setup&quot;,&quot;title&quot;:&quot;Product-Circle Geometry and Ramp Setup&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;fb27b70fd4ff&quot;,&quot;label&quot;:&quot;lem:product-circle-parallel-geometry&quot;,&quot;title&quot;:&quot;Product-circle geometry&quot;,&quot;display_title&quot;:&quot;Theorem 4.3: Product-circle geometry&quot;,&quot;body&quot;:&quot;On $(M,g(t))\\times(S^1_\\lambda,ds^2)$ let $U$ be the oriented unit tangent\nto the circle factor.  Then $\\nabla U=0$ and\n$\\operatorname{Ric}(V,U)=0$ for every tangent vector $V$; both assertions are\nindependent of $\\lambda&gt;0$.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Product-Circle Geometry and Ramp Setup&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:141,&quot;ref&quot;:&quot;MT:ch19:19.11&quot;},{&quot;id&quot;:&quot;abe4d57fef31&quot;,&quot;label&quot;:&quot;def:lifted-ramp-chart-branch&quot;,&quot;title&quot;:&quot;Lifted ramp chart and circle branch&quot;,&quot;display_title&quot;:&quot;Definition 4.4: Lifted ramp chart and circle branch&quot;,&quot;body&quot;:&quot;Throughout this chapter the parameter circle is\n$S^1=\\mathbb R/(2\\pi\\mathbb Z)$.  For every $\\lambda&gt;0$ regard\n$S^1_\\lambda=\\mathbb R/(\\lambda\\mathbb Z)$ with the metric induced by the\nEuclidean coordinate on the cover, so its circumference is $\\lambda$, and\nwrite $\\pi_\\lambda\\colon M\\times\\mathbb R\\to M\\times S^1_\\lambda$ for the\ncovering map induced by the universal cover of the circle factor.  The\ndegree-one map from the parameter circle to the target factor is therefore\n$x\\mapsto\\lambda x/(2\\pi)$ and has constant speed $\\lambda/(2\\pi)$.  A\ndegree-one ramp family is represented locally by a chosen\nlift and a chosen lifted arc/branch over each polygonal side or graph interval.\nAll local charts use the fixed $M$ normal neighborhood of radius $r_0$ and an\naffine coordinate on $\\mathbb R$, then project by $\\pi_\\lambda$.  Hence chart\nradii, connection bounds, and transition estimates are independent of\n$\\lambda$; changing the branch by a deck translation changes nothing.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Product-Circle Geometry and Ramp Setup&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:142,&quot;ref&quot;:&quot;MT:ch19:19.12,MT:ch19:19.64&quot;},{&quot;id&quot;:&quot;606dd3214150&quot;,&quot;label&quot;:&quot;def:ramp-curve&quot;,&quot;title&quot;:&quot;Ramp&quot;,&quot;display_title&quot;:&quot;Definition 4.5: Ramp&quot;,&quot;body&quot;:&quot;For an immersed oriented curve $c\\colon S^1\\to M\\times S^1_\\lambda$ with\nunit tangent $S$, put $u=\\langle S,U\\rangle$.  The curve is a \\emph{ramp} if\n$u(x)&gt;0$ for every $x\\in S^1$.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Product-Circle Geometry and Ramp Setup&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:143,&quot;ref&quot;:&quot;MT:ch19:19.12&quot;},{&quot;id&quot;:&quot;10dc951be346&quot;,&quot;label&quot;:&quot;lem:ramp-slope-evolution&quot;,&quot;title&quot;:&quot;Evolution equation for the ramp slope&quot;,&quot;display_title&quot;:&quot;Theorem 4.6: Evolution equation for the ramp slope&quot;,&quot;body&quot;:&quot;Along a curve-shrinking flow in\n$(M,g(t))\\times(S^1_\\lambda,ds^2)$, the function\n$u=\\langle S,U\\rangle$ satisfies\n\\[\n \\partial_tu=u&#x27;&#x27;+(k^2+\\operatorname{Ric}(S,S))u\n \\ge u&#x27;&#x27;-C&#x27;u,\n\\]\nwhere $C&#x27;$ is any upper bound for the norm of the Ricci tensor of $g(t)$.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Product-Circle Geometry and Ramp Setup&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:144,&quot;ref&quot;:&quot;MT:ch19:19.11&quot;},{&quot;id&quot;:&quot;9929a0922cf6&quot;,&quot;label&quot;:&quot;thm:ramp-preservation&quot;,&quot;title&quot;:&quot;Ramp preservation&quot;,&quot;display_title&quot;:&quot;Theorem 4.7: Ramp preservation&quot;,&quot;body&quot;:&quot;Suppose $c$ is a curve-shrinking flow on $[t_0,T)$ in the ramp product and\n$c(\\cdot,t_0)$ is a ramp.  If $C&#x27;$ bounds $|\\operatorname{Ric}|$, then\n\\[\n \\min_{S^1}u(\\cdot,t)\\ge\n e^{-C&#x27;(t-t_0)}\\min_{S^1}u(\\cdot,t_0)&gt;0\n \\qquad(t_0\\le t&lt;T).\n\\]\nIn particular every $c(\\cdot,t)$ is a ramp.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Product-Circle Geometry and Ramp Setup&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:145,&quot;ref&quot;:&quot;MT:ch19:19.13&quot;}]},{&quot;id&quot;:&quot;graph-flow-coordinate-estimates&quot;,&quot;title&quot;:&quot;Graph-Flow Coordinate Estimates&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;2c2530143515&quot;,&quot;label&quot;:&quot;def:curve-flow-local-graph-coordinates&quot;,&quot;title&quot;:&quot;Local graph-flow coordinates&quot;,&quot;display_title&quot;:&quot;Definition 4.8: Local graph-flow coordinates&quot;,&quot;body&quot;:&quot;At the midpoint $p$ of a length-$r$ arc, lift the evolving arc through the\n$h(t&#x27;)$-exponential local diffeomorphism from a ball in $T_pW$.  Give\n$T_pW$ the Euclidean metric $h&#x27;=h(t&#x27;)_p$ and take the $z$-axis tangent to the\nlifted arc.  The choice of $r_0$ ensures that throughout the tangent-space\nball\n\\[\n |h(t)-h&#x27;|_{h&#x27;}&lt;\\delta,\\qquad\n |\\Gamma(A,B)|_{h&#x27;}&lt;\\delta|A|_{h&#x27;}|B|_{h&#x27;}.\n\\]\nOn a fixed interval $I&#x27;$ of $h&#x27;$-length $l\\in[0.8r,r]$, write the evolving\narc, up to its maximal graph time $t_3\\le t_2$, as\n$\\widetilde\\gamma(z,t)=(z,f(z,t))$, where $|f_z|_{h&#x27;}\\le1/10$.  Define\n\\[\n Z=\\partial_z\\widetilde\\gamma=(1,f_z),\\qquad\n Y=\\partial_t\\widetilde\\gamma=(0,f_t).\n\\]\nThus $Y$ is $h&#x27;$-orthogonal to the $z$-axis and differs from\n$\\nabla_SS$ by a scalar multiple of $Z$.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Graph-Flow Coordinate Estimates&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:146,&quot;ref&quot;:&quot;MT:ch19:19.64&quot;},{&quot;id&quot;:&quot;d388b2082a09&quot;,&quot;label&quot;:&quot;lem:graph-flow-velocity-identities&quot;,&quot;title&quot;:&quot;Graph-flow velocity identities&quot;,&quot;display_title&quot;:&quot;Theorem 4.9: Graph-flow velocity identities&quot;,&quot;body&quot;:&quot;On the graph interval,\n\\[\n Y=\\frac{\\nabla_ZZ-\\langle\\Gamma(Z,Z),\\partial_z\\rangle_{h&#x27;}Z}{|Z|^2}\n =\\nabla_SS+\\left(\n \\frac{\\langle\\nabla_ZZ,Z\\rangle}{|Z|^4}\n -\\frac{\\langle\\Gamma(Z,Z),\\partial_z\\rangle_{h&#x27;}}{|Z|^2}\n \\right)Z.\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Graph-Flow Coordinate Estimates&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:147,&quot;ref&quot;:&quot;MT:ch19:19.64&quot;},{&quot;id&quot;:&quot;9977c10908db&quot;,&quot;label&quot;:&quot;def:graph-flow-connection-drift&quot;,&quot;title&quot;:&quot;Graph-flow connection drift&quot;,&quot;display_title&quot;:&quot;Definition 4.10: Graph-flow connection drift&quot;,&quot;body&quot;:&quot;Define\n\\[\n \\psi(Z)=\\frac{\\langle\\Gamma(Z,Z),\\partial_z\\rangle_{h&#x27;}}{|Z|^2}.\n\\]\nThe metric and slope comparisons imply $|\\psi(Z)|&lt;1.5\\delta$.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Graph-Flow Coordinate Estimates&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:148,&quot;ref&quot;:&quot;MT:ch19:19.65&quot;},{&quot;id&quot;:&quot;0dabec6e7d74&quot;,&quot;label&quot;:&quot;lem:graph-flow-small-slope-comparison&quot;,&quot;title&quot;:&quot;Small-slope graph and curvature comparisons&quot;,&quot;display_title&quot;:&quot;Theorem 4.11: Small-slope graph and curvature comparisons&quot;,&quot;body&quot;:&quot;For sufficiently small $\\delta$, wherever $Y\\ne0$ the $h(t)$-angle between\n$Y$ and $Z$ is greater than $\\pi/4$, and\n\\begin{align*}\n &amp;k\\le|Y|\\le\\sqrt2k,\\\\\n &amp;|\\langle\\nabla_ZZ,Z\\rangle|&lt;(k+2\\delta)|Z|^3,\\\\\n &amp;|\\nabla_ZZ|&lt;2(|Y|+\\delta),\\\\\n &amp;|\\langle Y,Z\\rangle|\\le|Y|\\,|f_z|_{h&#x27;}(1+3\\delta).\n\\end{align*}&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Graph-Flow Coordinate Estimates&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:149,&quot;ref&quot;:&quot;MT:ch19:19.65&quot;},{&quot;id&quot;:&quot;84f30b171db1&quot;,&quot;label&quot;:&quot;lem:graph-flow-drift-derivative-bounds&quot;,&quot;title&quot;:&quot;Derivatives of the graph-flow connection drift&quot;,&quot;display_title&quot;:&quot;Theorem 4.12: Derivatives of the graph-flow connection drift&quot;,&quot;body&quot;:&quot;In the fixed exponential chart write $\\Gamma(t)$ for the Christoffel symbols\nof $h(t)$ and assume $|\\partial_t\\Gamma(t)|_{h&#x27;}\\le C_{\\Gamma}$ on the\nchart.  Thus the time derivative below includes the evolving-connection term.\nFor sufficiently small $\\delta$ there is an ambient constant $C&#x27;$ such that\n\\[\n |Z(\\psi(Z))|&lt;C&#x27;(1+\\delta|Y|),\n \\qquad\n |Y(\\psi(Z))|&lt;C&#x27;(1+|Y|+\\delta|\\nabla_ZY|).\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Graph-Flow Coordinate Estimates&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:150,&quot;ref&quot;:&quot;MT:ch19:19.66&quot;}]},{&quot;id&quot;:&quot;short-time-existence&quot;,&quot;title&quot;:&quot;Short-Time Existence&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;4c44eb3428eb&quot;,&quot;label&quot;:&quot;lem:strongly-parabolic-circle-equation&quot;,&quot;title&quot;:&quot;Strongly parabolic quasilinear equation on a closed circle&quot;,&quot;display_title&quot;:&quot;Lemma 4.13: Strongly parabolic quasilinear equation on a closed circle&quot;,&quot;body&quot;:&quot;Let $E\\to S^1$ be a smooth finite-dimensional vector bundle and let\n$P\\colon\\Gamma(E)\\to\\Gamma(E)$ be a smooth second-order quasilinear operator.\nSuppose that, on a neighbourhood of a section $w$, the linearisation has\nprincipal symbol satisfying\n\\[\n \\langle\\sigma(DP(v))(x,\\xi)z,z\\rangle\n \\ge \\lambda_0|\\xi|^2|z|^2\n \\qquad(\\lambda_0&gt;0)\n\\]\nfor every $v$ in that neighbourhood, $x\\in S^1$, and $\\xi,z$ in the\ncorresponding fibres.  Then the initial-value problem\n\\[\n \\partial_t v=P(v),\\qquad v(0)=w,\n\\]\nhas a unique smooth solution on a positive time interval.  On a compact set\nof initial sections on which the same symbol and coefficient bounds hold, the\ninterval can be chosen uniformly.  Solutions depend continuously on their\ninitial sections in $C^{2,\\alpha}$ on every shorter interval, and a solution\nwhose ellipticity, speed, and $C^2$ bounds stay uniform at a finite endpoint\nextends across that endpoint.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Short-Time Existence&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:151,&quot;ref&quot;:&quot;MT:ch19:19.1&quot;},{&quot;id&quot;:&quot;a4d91a09effa&quot;,&quot;label&quot;:&quot;thm:parametric-curve-shrinking-wellposedness&quot;,&quot;title&quot;:&quot;Compact-parametric parabolic interface for immersed curve shrinking&quot;,&quot;display_title&quot;:&quot;Theorem 4.14: Compact-parametric parabolic interface for immersed curve shrinking&quot;,&quot;body&quot;:&quot;Morgan--Tian Claim~19.1 and Perelman&#x27;s Section~2.1 statement give the\nsingle-curve existence and curvature blow-up alternative.  The parameter-\nuniform clauses below are obtained from the source-backed strongly parabolic\ncircle interface in \\ref{lem:strongly-parabolic-circle-equation}; they are not\nbeing attributed to the single-curve claim alone.\nLet $P$ be compact, $0&lt;\\alpha&lt;1$, and let $g(t)$ be a smooth Ricci flow on a\ncompact manifold for $t\\in[t_0,t_1]$.  Suppose $p\\mapsto c_{0,p}$ is\ncontinuous in $C^{2,\\alpha}$ and $|\\partial_xc_{0,p}|\\ge\\iota_0&gt;0$ for all\n$p\\in P$.  The gauged curve-shrinking equation is uniformly parabolic on a\ntime interval $[t_0,t_0+\\tau]$, with $\\tau&gt;0$ depending only on the compact\ninitial set, $\\iota_0$, and ambient $C^2$ bounds.  It has a unique solution in\nthe gauge and hence a unique geometric solution up to time-dependent\nreparametrization; the solution depends continuously on $(p,t)$ in the\nparabolic $C^{2,\\alpha}$ topology.  If curvature and the immersion lower\nbound remain uniformly bounded at a finite endpoint, the uniform periodic\nparabolic estimates continue every member across that endpoint.  In particular a\ncompact parameter family has a common lifetime whenever these bounds are\nuniform.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Short-Time Existence&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:152,&quot;ref&quot;:&quot;MT:ch19:19.1&quot;},{&quot;id&quot;:&quot;37074c813bce&quot;,&quot;label&quot;:&quot;thm:curve-shrinking-short-time-existence&quot;,&quot;title&quot;:&quot;Short-time existence and curvature blow-up alternative&quot;,&quot;display_title&quot;:&quot;Theorem 4.15: Short-time existence and curvature blow-up alternative&quot;,&quot;body&quot;:&quot;Let $0&lt;\\alpha&lt;1$ and let\n$c_0\\colon S^1\\to(M,g(t_0))$ be an immersed $C^{2,\\alpha}$ curve.  There is\n$T&gt;t_0$ and an immersed curve-shrinking flow $c$ on $[t_0,T)$.  If\n$T&lt;\\sup I$\nand $\\sup_{S^1\\times[t_0,T)}k&lt;\\infty$, then the flow extends, through\nimmersed curves, to an interval $[t_0,T+\\eta)$ for some $\\eta&gt;0$.\nConsequently every finite nonextendible endpoint has\n$\\limsup_{t\\uparrow T}\\max_{S^1}k(\\cdot,t)=\\infty$.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Short-Time Existence&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:153,&quot;ref&quot;:&quot;MT:ch19:19.1&quot;}]},{&quot;id&quot;:&quot;polygonal-ramp-approximation&quot;,&quot;title&quot;:&quot;Polygonal Ramp Approximation&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;c7f77a2809ce&quot;,&quot;label&quot;:&quot;def:regular-polygonal-loop-approximation&quot;,&quot;title&quot;:&quot;Regular polygonal approximation&quot;,&quot;display_title&quot;:&quot;Definition 4.16: Regular polygonal approximation&quot;,&quot;body&quot;:&quot;Let $c\\colon S^1\\to M$ be $C^1$, let $n\\ge1$, and put\n$\\xi_n=e^{2\\pi i/n}$ and $p_j=c(\\xi_n^j)$.  Choose a minimizing geodesic\n$A_j$ from $p_j$ to $p_{j+1}$, with circular indexing, and parametrize it at\nconstant speed on the corresponding subinterval of $S^1$.  The resulting\npiecewise geodesic loop $c_n$ is a \\emph{regular $n$-polygonal approximation}\nof $c$.  When all sides lie below the injectivity radius, the choices are\nunique.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Polygonal Ramp Approximation&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:154,&quot;ref&quot;:&quot;MT:ch19:19.18&quot;},{&quot;id&quot;:&quot;2ea12f74bfde&quot;,&quot;label&quot;:&quot;lem:single-loop-polygonal-approximation&quot;,&quot;title&quot;:&quot;Polygonal approximation&quot;,&quot;display_title&quot;:&quot;Theorem 4.17: Polygonal approximation&quot;,&quot;body&quot;:&quot;For every $C^1$ loop $c\\colon S^1\\to M$ and every $\\zeta&gt;0$, there is\n$N$ such that, for all $n\\ge N$,\n\\[\n |L(c_n)-L(c)|&lt;\\zeta,\n\\]\nand $c_n$ and $c$ cobound a piecewise smooth annulus of area less than\n$\\zeta$.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Polygonal Ramp Approximation&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:155,&quot;ref&quot;:&quot;MT:ch19:19.19&quot;},{&quot;id&quot;:&quot;fd268164d548&quot;,&quot;label&quot;:&quot;lem:compact-family-polygonal-approximation&quot;,&quot;title&quot;:&quot;Uniform polygonal approximation on compact families&quot;,&quot;display_title&quot;:&quot;Theorem 4.18: Uniform polygonal approximation on compact families&quot;,&quot;body&quot;:&quot;Let $K$ be a compact set of $C^1$ loops, with the $C^1$ topology, and let\n$\\zeta&gt;0$.  There is $N=N(K,\\zeta)$ such that the two conclusions of\n\\ref{lem:single-loop-polygonal-approximation} hold for every $c\\in K$ and\nevery $n\\ge N$.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Polygonal Ramp Approximation&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:156,&quot;ref&quot;:&quot;MT:ch19:19.20&quot;},{&quot;id&quot;:&quot;0b60ec75858a&quot;,&quot;label&quot;:&quot;cor:sphere-family-polygonal-approximation&quot;,&quot;title&quot;:&quot;Polygonal approximation of sphere families&quot;,&quot;display_title&quot;:&quot;Theorem 4.19: Polygonal approximation of sphere families&quot;,&quot;body&quot;:&quot;Let $\\Gamma\\colon S^2\\to\\Lambda M$ be a continuous $C^1$-loop family whose\nmembers are null-homotopic.  For every $\\zeta&gt;0$ there is $N$ such that, for\n$n\\ge N$, the regular polygonal family\n$\\Gamma_n\\colon S^2\\to\\Lambda_n^{\\mathrm{pg}}M$ is continuous, every\n$\\Gamma_n(q)$ is null-homotopic, and, uniformly in $q\\in S^2$,\n\\[\n |L(\\Gamma_n(q))-L(\\Gamma(q))|&lt;\\zeta,\n \\qquad\n |A(\\Gamma_n(q))-A(\\Gamma(q))|&lt;\\zeta.\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Polygonal Ramp Approximation&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:157,&quot;ref&quot;:&quot;MT:ch19:19.21&quot;},{&quot;id&quot;:&quot;9c9d12b27929&quot;,&quot;label&quot;:&quot;lem:smoothed-polygonal-ramp-bounds&quot;,&quot;title&quot;:&quot;Length and total curvature of smoothed polygonal ramps&quot;,&quot;display_title&quot;:&quot;Theorem 4.20: Length and total curvature of smoothed polygonal ramps&quot;,&quot;body&quot;:&quot;For each $q$, choose the fixed lifted polygonal branches in\n$M\\times\\mathbb R$ and obtain $\\widetilde\\Gamma(q)$ from the $n$-polygonal\nloop $\\Gamma_n(q)$ by the standard smoothing with a fixed, nonnegative,\nsymmetric reparameterization bump.  Throughout this chapter we use the fixed\nconvention $S^1=\\mathbb R/(2\\pi\\mathbb Z)$.  For $0&lt;\\lambda&lt;1$, project the\ndegree-one lift $x\\mapsto(\\widetilde\\Gamma(q)(x),\\lambda x/(2\\pi))$ by\n$\\pi_\\lambda\\colon M\\times\\mathbb R\\to M\\times S^1_\\lambda$ and call the\nresulting ramp $\\widetilde\\Gamma(q)^\\lambda$.  Then\n\\[\n L(\\widetilde\\Gamma(q)^\\lambda)\n \\le L(\\Gamma(q))+\\lambda,\n \\qquad\n \\int_{\\widetilde\\Gamma(q)^\\lambda}k\\,ds\\le n\\pi .\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Polygonal Ramp Approximation&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:158,&quot;ref&quot;:&quot;MT:ch19:19.22&quot;},{&quot;id&quot;:&quot;31513c36faf4&quot;,&quot;label&quot;:&quot;lem:free-loop-approximation-preserves-pi1-orbit&quot;,&quot;title&quot;:&quot;Free-loop approximation preserves the _1-orbit&quot;,&quot;display_title&quot;:&quot;Lemma 4.21: Free-loop approximation preserves the _1-orbit&quot;,&quot;body&quot;:&quot;Assume $M$ is compact, connected, and $\\pi_2(M)=0$.  If a family\n$\\Gamma\\colon S^2\\to\\Lambda_0M$ represents the free-loop orbit\n$[\\xi]$ under\n$\\pi_2(\\Lambda_0M,*)\\cong\\pi_3(M,*)$, then every family\n$\\widetilde\\Gamma$ produced by the source&#x27;s uniform controlled-ramp\napproximation represents the same orbit\n$[\\xi]$.  No choice of a based representative is required.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Polygonal Ramp Approximation&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:159,&quot;ref&quot;:&quot;MT:ch18:18.16,MT:ch19:19.17&quot;},{&quot;id&quot;:&quot;2d7fad1bc78e&quot;,&quot;label&quot;:&quot;thm:uniform-controlled-ramp-approximation&quot;,&quot;title&quot;:&quot;Uniform smooth approximation by controlled ramps&quot;,&quot;display_title&quot;:&quot;Theorem 4.22: Uniform smooth approximation by controlled ramps&quot;,&quot;body&quot;:&quot;Let $\\Gamma\\colon S^2\\to\\Lambda M$ be a continuous family of\nnull-homotopic loops.  Let $0&lt;\\zeta&lt;1$.  There is a continuous family\n$\\widetilde\\Gamma\\colon S^2\\to\\Lambda M$ such that\n$[\\widetilde\\Gamma]=[\\Gamma]$ as a free-loop homotopy class, every member is\nsmooth, and, for every\n$0&lt;\\alpha&lt;1$, the same family is continuous in the $C^{2,\\alpha}$ topology.\nThe homotopy is a free-loop homotopy; no based class or fixed-basepoint\npreservation is asserted.  In particular,\n\\[\n |L(\\widetilde\\Gamma(q))-L(\\Gamma(q))|&lt;\\zeta,\\qquad\n |A(\\widetilde\\Gamma(q))-A(\\Gamma(q))|&lt;\\zeta.\n\\]\nMoreover there is $C_0&lt;\\infty$, independent of $q$ and\n$0&lt;\\lambda&lt;1$, for which both the length and total curvature of every ramp\n$\\widetilde\\Gamma(q)^\\lambda$ are at most $C_0$.\nThe homotopy assertion is a family assertion: the annuli form a continuous\nmap $S^2\\times[0,1]\\to\\Lambda M$.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Polygonal Ramp Approximation&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:160,&quot;ref&quot;:&quot;MT:ch19:19.17&quot;}]},{&quot;id&quot;:&quot;evolution-identities-and-global-bounds&quot;,&quot;title&quot;:&quot;Evolution Identities and Global Bounds&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;572cb18da12c&quot;,&quot;label&quot;:&quot;thm:curve-flow-curvature-evolution&quot;,&quot;title&quot;:&quot;Evolution equation for squared curvature&quot;,&quot;display_title&quot;:&quot;Theorem 4.23: Evolution equation for squared curvature&quot;,&quot;body&quot;:&quot;Let $\\widehat{\\operatorname{Rm}}$ be the curvature\ntensor of $\\widehat g$.  At every smooth point of the flow,\n\\begin{align*}\n \\partial_t k^2={}&amp;(k^2)&#x27;&#x27;-2| (\\nabla_SH)^\\perp|^2+2k^4\n -2\\operatorname{Ric}_g(H,H)+4k^2\\operatorname{Ric}_g(S,S)\\\\\n &amp;+2\\widehat{\\operatorname{Rm}}(\\widehat H,S,H,S)\n +2\\operatorname{Ric}_g(S,S)\\operatorname{Ric}_g(H,H)\n -2(\\nabla^g_S\\operatorname{Ric}_g)(S,H).\n\\end{align*}&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Evolution Identities and Global Bounds&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:161,&quot;ref&quot;:&quot;MT:ch19:19.7&quot;},{&quot;id&quot;:&quot;e7b507d1568a&quot;,&quot;label&quot;:&quot;lem:regularized-curve-curvature-inequality&quot;,&quot;title&quot;:&quot;Regularized curvature inequality&quot;,&quot;display_title&quot;:&quot;Theorem 4.24: Regularized curvature inequality&quot;,&quot;body&quot;:&quot;There is a constant $C_1&lt;\\infty$, depending only on bounds for the ambient\nRicci flow and its first covariant curvature derivative, such that, for every\n$\\epsilon&gt;0$ and\n$h_\\epsilon=(k^2+\\epsilon^2)^{1/2}$,\n\\[\n \\partial_t h_\\epsilon\\le h_\\epsilon&#x27;&#x27;+k^3+C_1(h_\\epsilon+1).\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Evolution Identities and Global Bounds&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:162,&quot;ref&quot;:&quot;MT:ch19:19.8&quot;},{&quot;id&quot;:&quot;b99a6419604a&quot;,&quot;label&quot;:&quot;lem:curve-flow-length-total-curvature-evolution&quot;,&quot;title&quot;:&quot;Integral evolution inequalities&quot;,&quot;display_title&quot;:&quot;Theorem 4.25: Integral evolution inequalities&quot;,&quot;body&quot;:&quot;Let\n$L(t)=\\int_{c_t}ds$ and $\\Theta(t)=\\int_{c_t}k\\,ds$, and let $C_2$ bound\n$|\\operatorname{Ric}_g|$ on $M\\times I$.  The function $L$ is smooth and\n$\\Theta$ is locally absolutely continuous.  For almost every time,\n\\[\n L&#x27;(t)\\le\\int_{c_t}(C_2-k^2)\\,ds\\le C_2L(t),\n \\qquad\n \\Theta&#x27;(t)\\le(C_1+C_2)\\Theta(t)+C_1L(t).\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Evolution Identities and Global Bounds&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:163,&quot;ref&quot;:&quot;MT:ch19:19.9&quot;},{&quot;id&quot;:&quot;32d360ee53fe&quot;,&quot;label&quot;:&quot;lem:coupled-length-curvature-comparison&quot;,&quot;title&quot;:&quot;Scalar exponential comparison&quot;,&quot;display_title&quot;:&quot;Lemma 4.26: Scalar exponential comparison&quot;,&quot;body&quot;:&quot;Suppose $L,\\Theta\\colon[0,T]\\to[0,\\infty)$ are absolutely continuous and\n\\[\n L&#x27;\\le C_2L,\\qquad\n \\Theta&#x27;\\le(C_1+C_2)\\Theta+C_1L\n\\]\nalmost everywhere.  Then, for $0\\le t\\le T$,\n\\[\n L(t)\\le L(0)e^{C_2t},\\qquad\n \\Theta(t)+L(t)\\le(\\Theta(0)+L(0))e^{(C_1+C_2)t}.\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Evolution Identities and Global Bounds&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:164,&quot;ref&quot;:&quot;MT:ch19:19.10&quot;},{&quot;id&quot;:&quot;7a2a8ef45f46&quot;,&quot;label&quot;:&quot;thm:curve-flow-length-total-curvature-bounds&quot;,&quot;title&quot;:&quot;Exponential length and total-curvature bounds&quot;,&quot;display_title&quot;:&quot;Theorem 4.27: Exponential length and total-curvature bounds&quot;,&quot;body&quot;:&quot;For the immersed curve-shrinking flow above and $t_0\\le t\\le t_1$,\n\\[\n L(t)\\le L(t_0)e^{C_2(t-t_0)},\n\\]\nand\n\\[\n \\Theta(t)+L(t)\n \\le(\\Theta(t_0)+L(t_0))e^{(C_1+C_2)(t-t_0)},\n \\qquad\n \\Theta(t)\\le(\\Theta(t_0)+L(t_0))e^{(C_1+C_2)(t-t_0)}.\n\\]\nThus the total-curvature bound necessarily depends on both initial\ntotal curvature and initial length.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Evolution Identities and Global Bounds&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:165,&quot;ref&quot;:&quot;MT:ch19:19.10&quot;},{&quot;id&quot;:&quot;c1c624f5a6e1&quot;,&quot;label&quot;:&quot;thm:ramp-curve-shrinking-global-existence&quot;,&quot;title&quot;:&quot;Global existence for ramps&quot;,&quot;display_title&quot;:&quot;Theorem 4.28: Global existence for ramps&quot;,&quot;body&quot;:&quot;Let $(M,g(t))$, $t_0\\le t\\le t_1$, be a Ricci flow and let\n$c_0\\colon S^1\\to M\\times S^1_\\lambda$ be a $C^{2,\\alpha}$ ramp at time\n$t_0$, for some $0&lt;\\alpha&lt;1$.\nThen its curve-shrinking flow exists on all of $[t_0,t_1]$, remains immersed,\nand consists entirely of ramps.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Evolution Identities and Global Bounds&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:166,&quot;ref&quot;:&quot;MT:ch19:19.14&quot;}]},{&quot;id&quot;:&quot;localized-total-curvature-control&quot;,&quot;title&quot;:&quot;Localized Total-Curvature Control&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;1ab62a65597f&quot;,&quot;label&quot;:&quot;lem:evolved-subarc-global-bounds&quot;,&quot;title&quot;:&quot;Uniform bounds on evolved subarcs&quot;,&quot;display_title&quot;:&quot;Theorem 4.29: Uniform bounds on evolved subarcs&quot;,&quot;body&quot;:&quot;There is $D_0&lt;\\infty$, depending only on $\\Theta$, $L_0$, and the fixed\nambient Ricci flow, such that every subarc $\\gamma_{t&#x27;}$ of length at most\n$r$ satisfies, for $t&#x27;\\le t\\le t&#x27;+\\delta r^2$,\n\\[\n \\int_{\\gamma_t}k\\,ds&lt;D_0,\\qquad L(\\gamma_t)\\le D_0r.\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Localized Total-Curvature Control&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:167,&quot;ref&quot;:&quot;MT:ch19:19.59&quot;},{&quot;id&quot;:&quot;bff20324cbd4&quot;,&quot;label&quot;:&quot;lem:transported-endpoint-separation&quot;,&quot;title&quot;:&quot;Endpoint separation and transported-length lower bound&quot;,&quot;display_title&quot;:&quot;Lemma 4.30: Endpoint separation and transported-length lower bound&quot;,&quot;body&quot;:&quot;Under the local data fixed above, every transported initial arc $E_{t&#x27;}$ of\nlength $r$ satisfies\n\\[\n L(E_t)\\ge(1-\\eta)r\\qquad(t&#x27;\\le t\\le t_2),\n\\]\nwhere $\\eta\\to0$ as $\\delta\\to0$, uniformly in the chosen arc.  Consequently,\nfor the cutoff chosen below to vanish when $0.45\\le|s|/r\\le0.5$, its support\nstays a positive intrinsic distance (at least $0.04r$ after decreasing\n$\\delta$) from both endpoints of $E_t$.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Localized Total-Curvature Control&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:168,&quot;ref&quot;:&quot;MT:ch19:19.60,MT:ch19:19.63&quot;},{&quot;id&quot;:&quot;45ed7d334607&quot;,&quot;label&quot;:&quot;lem:localized-cutoff-time-derivative&quot;,&quot;title&quot;:&quot;Time derivative of the localized cutoff&quot;,&quot;display_title&quot;:&quot;Theorem 4.31: Time derivative of the localized cutoff&quot;,&quot;body&quot;:&quot;There is $D_1$, depending only on $\\Theta,L_0$, and the ambient flow, such\nthat, on $[t&#x27;,t_2]$,\n\\[\n |\\partial_t\\varphi(x,t)|\n \\le D_1\\left(1+\\frac1{r\\sqrt{t-t&#x27;}}\\right).\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Localized Total-Curvature Control&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:169,&quot;ref&quot;:&quot;MT:ch19:19.60&quot;},{&quot;id&quot;:&quot;e1d7d80c3e94&quot;,&quot;label&quot;:&quot;lem:localized-total-curvature-evolution&quot;,&quot;title&quot;:&quot;Localized total-curvature differential inequality&quot;,&quot;display_title&quot;:&quot;Theorem 4.32: Localized total-curvature differential inequality&quot;,&quot;body&quot;:&quot;There are constants $D_2,D_3&lt;\\infty$, depending only on\n$\\Theta,L_0$, and the ambient flow, such that the weighted curvature is\nlocally absolutely continuous and, for almost every $t&#x27; &lt; t\\le t_2$,\n\\[\n \\frac d{dt}\\int_{\\gamma_t}\\varphi k\\,ds\n \\le D_2\\left(1+\\frac1{r\\sqrt{t-t&#x27;}}\\right)+\\frac{D_2}{r^2}\n       +D_3\\int_{\\gamma_t}\\varphi k\\,ds\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Localized Total-Curvature Control&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:170,&quot;ref&quot;:&quot;MT:ch19:19.61&quot;},{&quot;id&quot;:&quot;3d419b69ad4d&quot;,&quot;label&quot;:&quot;lem:localized-total-curvature-smallness&quot;,&quot;title&quot;:&quot;Small localized total-curvature bound&quot;,&quot;display_title&quot;:&quot;Theorem 4.33: Small localized total-curvature bound&quot;,&quot;body&quot;:&quot;There is $D_4$, depending only on $\\Theta,L_0$, and the ambient flow, such\nthat\n\\[\n \\int_{\\gamma_t}\\varphi k\\,ds\\le D_4\\sqrt\\delta\n \\qquad(t&#x27;\\le t\\le t_2).\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Localized Total-Curvature Control&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:171,&quot;ref&quot;:&quot;MT:ch19:19.62&quot;},{&quot;id&quot;:&quot;6e44a1958754&quot;,&quot;label&quot;:&quot;lem:short-subarc-total-curvature-bound&quot;,&quot;title&quot;:&quot;Short-subarc total-curvature bound&quot;,&quot;display_title&quot;:&quot;Theorem 4.34: Short-subarc total-curvature bound&quot;,&quot;body&quot;:&quot;For $t\\in[t&#x27;,t_2]$, every transported initial subarc of length at most $r$\nhas total curvature at most $2D_4\\sqrt\\delta$.  Every subarc of $c_t$ of\nlength at most $r/2$ has the same bound.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Localized Total-Curvature Control&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:172,&quot;ref&quot;:&quot;MT:ch19:19.63&quot;}]},{&quot;id&quot;:&quot;short-time-curvature-barrier&quot;,&quot;title&quot;:&quot;Short-Time Curvature Barrier&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;b98f0aa4fc27&quot;,&quot;label&quot;:&quot;lem:graph-slope-persistence&quot;,&quot;title&quot;:&quot;Full-interval graph-slope persistence&quot;,&quot;display_title&quot;:&quot;Theorem 4.35: Full-interval graph-slope persistence&quot;,&quot;body&quot;:&quot;For sufficiently small $\\delta$, the maximal graph time equals the\nprovisional curvature time, $t_3=t_2$, and\n\\[\n |f_z(z,t)|_{h&#x27;}&lt;\\frac1{10}\n \\qquad((z,t)\\in I&#x27;\\times[t&#x27;,t_2]).\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Short-Time Curvature Barrier&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:173,&quot;ref&quot;:&quot;MT:ch19:19.58&quot;},{&quot;id&quot;:&quot;ce9c2abb2e16&quot;,&quot;label&quot;:&quot;lem:graph-flow-tangential-derivative&quot;,&quot;title&quot;:&quot;Tangential component of _ZY&quot;,&quot;display_title&quot;:&quot;Theorem 4.36: Tangential component of _ZY&quot;,&quot;body&quot;:&quot;On $I&#x27;\\times[t&#x27;,t_2]$,\n\\[\n |\\langle\\nabla_ZY,Z\\rangle|\n \\le\\bigl(|f_z|_{h&#x27;}(|\\nabla_ZY|+2\\delta|Y|)\n       +\\delta|Z|^2|Y|\\bigr)(1+\\delta).\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Short-Time Curvature Barrier&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:174,&quot;ref&quot;:&quot;MT:ch19:19.67&quot;},{&quot;id&quot;:&quot;a26f5c19302d&quot;,&quot;label&quot;:&quot;thm:short-time-curve-curvature-barrier&quot;,&quot;title&quot;:&quot;Short-time pointwise curvature barrier&quot;,&quot;display_title&quot;:&quot;Theorem 4.37: Short-time pointwise curvature barrier&quot;,&quot;body&quot;:&quot;Given bounds $\\Theta,L_0$ and the fixed ambient Ricci flow, there are\n$\\delta&gt;0$ and $0&lt;r_0\\le1$ such that the localized hypotheses stated above\nimply\n\\[\n k(x,t)^2\\le\\frac2{t-t&#x27;}\n \\qquad(x\\in S^1,\\ t&#x27;&lt;t\\le t&#x27;+\\delta r^2).\n\\]\nThe constants may depend on both $\\Theta$ and $L_0$.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Short-Time Curvature Barrier&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:175,&quot;ref&quot;:&quot;MT:ch19:19.58&quot;},{&quot;id&quot;:&quot;1d5de1e5975f&quot;,&quot;label&quot;:&quot;lem:curve-flow-parabolic-regularity-interface&quot;,&quot;title&quot;:&quot;Parabolic regularity for graph curve flow&quot;,&quot;display_title&quot;:&quot;Lemma 4.38: Parabolic regularity for graph curve flow&quot;,&quot;body&quot;:&quot;On a graph interval on which the slope bound gives\n$0&lt;a_-\\le |Z|^2\\le a_+&lt;\\infty$, suppose the ambient metric and connection\ncoefficients have bounded derivatives of every order and the curve-flow\ncurvature barrier gives $|H|^2\\le C_0(t-t&#x27;)^{-1}$.  Then, for every $m\\ge1$,\nthe uniformly parabolic gauged equation has interior (and periodic-boundary)\nestimates\n\\[\n |\\nabla_S^mH|^2\\le C_m(t-t&#x27;)^{-(m+1)},\n\\]\nwhere $C_m$ depends only on $a_\\pm$, the ambient coefficient bounds, and\n$C_0$.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Short-Time Curvature Barrier&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:176,&quot;ref&quot;:&quot;MT:ch19:19.24&quot;},{&quot;id&quot;:&quot;8b02bd6bd97c&quot;,&quot;label&quot;:&quot;thm:curve-shrinking-derivative-estimates&quot;,&quot;title&quot;:&quot;Derivative estimates for curve shrinking&quot;,&quot;display_title&quot;:&quot;Theorem 4.39: Derivative estimates for curve shrinking&quot;,&quot;body&quot;:&quot;The correction supplies the dependence of the constants in Lemma~19.24 on\nthe initial length and total-curvature bounds.  The all-order estimate is the\nexplicit commuted-equation induction in\n\\ref{lem:curve-flow-parabolic-regularity-interface}, rather than an\nunstated appeal to a separate theorem.\nLet $P$ be compact and let $c_p$, $p\\in P$, be a family of the gauged curve\nflows covered by \\ref{thm:short-time-curve-curvature-barrier}, with common\ninitial length bound $L_0$, total-curvature bound $\\Theta_0$, and the common\nsmall-turning constants of that theorem.  The ambient flow may be\n$M\\times S^1_\\lambda$ for any $0&lt;\\lambda&lt;1$; its curvature and connection\nbounds are those of $M$ and are independent of $\\lambda$.  There are constants\n$\\widetilde C_i&lt;\\infty$, depending on the ambient Ricci flow and on the\nuniform initial total-curvature and length bounds, but independent of\n$p\\in P$ and $0&lt;\\lambda&lt;1$, such that\nfor $t&#x27;&lt;t&lt;t&#x27;+\\delta r^2$,\n\\[\n k^2\\le \\widetilde C_0(t-t&#x27;)^{-1},\\qquad\n |\\nabla_SH|^2\\le\\widetilde C_1(t-t&#x27;)^{-2},\n\\]\nand, for every $i\\ge1$,\n\\[\n |\\nabla_S^iH|^2\\le\\widetilde C_i(t-t&#x27;)^{-(i+1)}.\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Short-Time Curvature Barrier&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:177,&quot;ref&quot;:&quot;MT:ch19:19.24&quot;}]},{&quot;id&quot;:&quot;controlled-curve-shrinking-interface&quot;,&quot;title&quot;:&quot;Controlled Curve-Shrinking Interface&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;280980cf9bde&quot;,&quot;label&quot;:&quot;thm:controlled-curve-shrinking-existence&quot;,&quot;title&quot;:&quot;Controlled curve shrinking for compact loop families&quot;,&quot;display_title&quot;:&quot;Theorem 4.40: Controlled curve shrinking for compact loop families&quot;,&quot;body&quot;:&quot;This is an assembled interface: the cited Morgan--Tian claims supply the\nfree-loop approximation, ramp preservation/global existence, and flow pieces,\nwhile the correction supplies the required dependence on initial length and\ntotal curvature.  The compact-family conclusion is the composition of the\nexplicit interfaces stated above.\nLet $g(t)$ be a Ricci flow on a compact manifold for\n$t\\in[t_0,t_1]$, and let\n$\\Gamma\\colon S^2\\to\\Lambda M$ be a continuous family of null-homotopic\nloops.  Then for every $\\zeta&gt;0$ there is a homotopic family of smooth loops\n$\\widetilde\\Gamma$ with length and least spanning area within $\\zeta$ of\nthose of $\\Gamma$, and constants $L_0,\\Theta_0&lt;\\infty$ such that, for every\n$c\\in S^2$ and $0&lt;\\lambda&lt;1$, the degree-one lift\n$\\widetilde\\Gamma(c)^\\lambda\\subset M\\times S^1_\\lambda$ has a unique\ngeometric curve-shrinking flow, up to time-dependent reparametrization,\nthroughout $[t_0,t_1]$.  For each fixed $\\lambda$, these flows form a\ncontinuous family in $c$, remain ramps, obey uniform length and\ntotal-curvature bounds depending\non $L_0,\\Theta_0$ and the ambient flow, and satisfy the uniform local\ncurvature and derivative estimates above whenever the small-turning\nhypothesis holds.\nThe family statement means continuity as a map\n$S^2\\times[t_0,t_1]\\to\\Lambda M$ after projection from the chosen lifted\nbranches in $M\\times\\mathbb R$.  This is a free-loop family statement; no\nbased representative is fixed, but the free-loop orbit is preserved by\n\\ref{lem:free-loop-approximation-preserves-pi1-orbit} whenever\n$\\pi_2(M)=0$.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Controlled Curve-Shrinking Interface&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:178,&quot;ref&quot;:&quot;MT:ch19:19.1,MT:ch19:19.10,MT:ch19:19.14,MT:ch19:19.17,MT:ch19:19.24&quot;}]}]},{&quot;id&quot;:&quot;extinction-component-topology&quot;,&quot;title&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;sections&quot;:[{&quot;id&quot;:&quot;other-results&quot;,&quot;title&quot;:&quot;Other results&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;52c756bceff7&quot;,&quot;label&quot;:&quot;def:path-of-components&quot;,&quot;title&quot;:&quot;Path and ancestry of components&quot;,&quot;display_title&quot;:&quot;Definition 5.1: Path and ancestry of components&quot;,&quot;body&quot;:&quot;Let $I$ be an interval in the time domain of a controlled Ricci flow with\nsurgery $({\\mathcal M},G)$, with either endpoint allowed to be open, closed,\nfinite, or infinite.  A \\emph{path of components} on $I$ is a connected open\nsubset ${\\mathcal X}\\subset\\mathbf t^{-1}(I)$ such that\n${\\mathcal X}(t)={\\mathcal X}\\cap M_t$ is a connected component of $M_t$ for\nevery $t\\in I$.  On a surgery-free subinterval these components are identified\nby the time vector field.  At a singular time $T\\in I$, the path ends if its\npresurgery component is discarded; otherwise ${\\mathcal X}(T)$ is one chosen\ncontinuing postsurgery component.  For $s\\le t$, a component\n$X_s\\subset M_s$ is an \\emph{ancestor} of $X_t\\subset M_t$, and $X_t$ a\n\\emph{descendant} of $X_s$, when some path of components on $[s,t]$ has those\nendpoint slices.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Other results&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:179,&quot;ref&quot;:&quot;MT:ch18:18.1&quot;}]},{&quot;id&quot;:&quot;two-sphere-width-control&quot;,&quot;title&quot;:&quot;Two-Sphere Width Control&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;05758bd0d841&quot;,&quot;label&quot;:&quot;def:two-sphere-width&quot;,&quot;title&quot;:&quot;Least nontrivial two-sphere area&quot;,&quot;display_title&quot;:&quot;Definition 5.2: Least nontrivial two-sphere area&quot;,&quot;body&quot;:&quot;Let $(X,g)$ be compact with $\\pi_2(X)\\ne0$.  Its \\emph{two-sphere width} is\n\\[\n W_2(X,g)=\\inf\\{\\operatorname{Area}_g(f):f\\colon S^2\\to X\\text{ is $C^1$ and not\n null-homotopic}\\}.\n\\]\nFor a component path $\\mathcal X$ in a Ricci flow with surgery, write\n\\[\n W_2(t)=W_2(\\mathcal X(t),g(t))\n\\]\nwhenever\n$\\pi_2(\\mathcal X(t))\\ne0$.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Two-Sphere Width Control&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:180,&quot;ref&quot;:&quot;MT:ch18:18.10&quot;},{&quot;id&quot;:&quot;1f26cb4f3c98&quot;,&quot;label&quot;:&quot;thm:two-sphere-width-realization&quot;,&quot;title&quot;:&quot;Imported Sacks--Uhlenbeck realization of the two-sphere width&quot;,&quot;display_title&quot;:&quot;Theorem 5.3: Imported Sacks--Uhlenbeck realization of the two-sphere width&quot;,&quot;body&quot;:&quot;If $(X,g)$ is compact and $\\pi_2(X)\\ne0$, then $W_2(X,g)&gt;0$ and there is a\nnon-null-homotopic conformal harmonic map $f\\colon S^2\\to X$, a branched\nminimal immersion away from finitely many points, such that\n\\[\n \\operatorname{Area}_g(f)=W_2(X,g).\n\\]&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Two-Sphere Width Control&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:181,&quot;ref&quot;:&quot;MT:ch18:18.10&quot;},{&quot;id&quot;:&quot;4e02960b5f84&quot;,&quot;label&quot;:&quot;lem:minimal-two-sphere-area-variation&quot;,&quot;title&quot;:&quot;Area variation of a minimal two-sphere&quot;,&quot;display_title&quot;:&quot;Lemma 5.4: Area variation of a minimal two-sphere&quot;,&quot;body&quot;:&quot;Let $g(t)$ be a Ricci flow on a closed three-manifold near $t_0$, and let\n$f\\colon S^2\\to(M,g(t_0))$ be a branched minimal immersion.  If\n$R_{\\min}(t_0)=\\min_M R_{g(t_0)}$, then\n\\[\n \\left.\\frac d{dt}\\right|_{t=t_0}\\operatorname{Area}_{g(t)}(f)\n \\le -4\\pi-\\frac12R_{\\min}(t_0)\\operatorname{Area}_{g(t_0)}(f).\n\\]&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Two-Sphere Width Control&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:182,&quot;ref&quot;:&quot;MT:ch18:18.12&quot;},{&quot;id&quot;:&quot;2472fed1c068&quot;,&quot;label&quot;:&quot;lem:fixed-sphere-area-distortion&quot;,&quot;title&quot;:&quot;Fixed-map area distortion&quot;,&quot;display_title&quot;:&quot;Lemma 5.5: Fixed-map area distortion&quot;,&quot;body&quot;:&quot;Let $g(t)$ be a Ricci flow on a compact manifold for\n$t\\in[t_0,t_1]$, suppose $|\\operatorname{Ric}_{g(t)}|\\le D$, and let\n$f\\colon S^2\\to M$ be $C^1$.  Then, for $s,t\\in[t_0,t_1]$,\n\\[\n e^{-4D|t-s|}\\operatorname{Area}_{g(s)}(f)\n \\le \\operatorname{Area}_{g(t)}(f)\n \\le e^{4D|t-s|}\\operatorname{Area}_{g(s)}(f).\n\\]&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Two-Sphere Width Control&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:183,&quot;ref&quot;:&quot;MT:ch18:18.13&quot;},{&quot;id&quot;:&quot;fa6d9839e669&quot;,&quot;label&quot;:&quot;lem:two-sphere-width-regular-continuity&quot;,&quot;title&quot;:&quot;Continuity of the two-sphere width at regular times&quot;,&quot;display_title&quot;:&quot;Lemma 5.6: Continuity of the two-sphere width at regular times&quot;,&quot;body&quot;:&quot;On a closed surgery-free interval on which the component is identified by\nthe Ricci-flow time vector field and has nonzero $\\pi_2$, the function $W_2$\nis continuous.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Two-Sphere Width Control&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:184,&quot;ref&quot;:&quot;MT:ch18:18.11,MT:ch18:18.13&quot;},{&quot;id&quot;:&quot;9960afbd243c&quot;,&quot;label&quot;:&quot;lem:null-sphere-surgery-topological-comparison&quot;,&quot;title&quot;:&quot;Topological comparison for null-sphere surgery&quot;,&quot;display_title&quot;:&quot;Lemma 5.7: Topological comparison for null-sphere surgery&quot;,&quot;body&quot;:&quot;Let $T$ be a surgery time and let $X^-$ be a connected presurgery\ncomponent just before $T$.  Assume that every cutting sphere in $X^-$ is\nnull-homotopic (and hence separating).  Let $X^+$ range over the connected\npostsurgery components obtained from $X^-$.  The radial extension of the\nflow identification defines, for every sufficiently close regular\n$t&lt;T$, a map from $X(t)$ to each selected $X^+$.  Topologically, exactly one\nof the following alternatives holds:\n\\begin{enumerate}\n\\item if $\\pi _2(X^-)$ is nonzero, there is a unique $X^+$ with nonzero\n      $\\pi _2$, and the corresponding pinch map is a homotopy equivalence;\n\\item if $\\pi _2(X^-)=0$, every $X^+$ has trivial $\\pi _2$ and the\n      continuing component is either homotopy equivalent to $X^-$ or is a\n      homotopy $3$-sphere.\n\\end{enumerate}\nIn the second case, if $\\pi _3(X^-)\\cong\\mathbb Z$, the comparison on the\ncontinuing component is either a homotopy equivalence or a degree-one map\nand therefore induces an injection on $\\pi _3$; the target group is again\n$\\mathbb Z$.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Two-Sphere Width Control&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:185,&quot;ref&quot;:&quot;MT:ch18:18.19,MT:ch18:18.22,MT:ch15:15.12&quot;},{&quot;id&quot;:&quot;8dd1bd7dd325&quot;,&quot;label&quot;:&quot;thm:trivial-surgery-component-map&quot;,&quot;title&quot;:&quot;Component map for a trivial surgery&quot;,&quot;display_title&quot;:&quot;Theorem 5.8: Component map for a trivial surgery&quot;,&quot;body&quot;:&quot;Let $T$ be a surgery time, let $X(t)$ be a presurgery component for $t&lt;T$\nclose to $T$, and suppose every cutting sphere in this component is\nnull-homotopic (hence separating by\n\\ref{lem:nullhomotopic-embedded-sphere-separates}).  For each selected\npostsurgery component $Y$, for every\n$\\eta&gt;0$ there is, for all\n$t&lt;T$ sufficiently close to $T$, a map\n\\[\n F_t\\colon X(t)\\longrightarrow Y,\n \\qquad \\operatorname{Lip}(F_t)\\le1+\\eta,\n\\]\nhomotopic to the corresponding connected-sum pinch map.  The component with\nnonzero $\\pi_2$, when it exists, is unique and its pinch map is a homotopy\nequivalence.  If $\\pi_2(X(t))=0$, then $\\pi_2(Y)=
