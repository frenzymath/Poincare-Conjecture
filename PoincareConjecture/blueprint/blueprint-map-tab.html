.  Suppose an isometric identification of their\ntime-$-t_0$ slices sends $(x,-t_0)$ to the center of the strong neck.\nThen the induced flow on\n\\[\n N\\times[-t_0,0]\\mathbin{\\cup}N&#x27;\\times(-t_1,-t_0]\n\\]\ncontains a strong $\\epsilon$-neck centered at $(x,0)$.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;proposition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:60,&quot;ref&quot;:&quot;MT:ch15:15.1&quot;},{&quot;id&quot;:&quot;e4211b5eebba&quot;,&quot;label&quot;:&quot;def:controlled-surgery-parameters&quot;,&quot;title&quot;:&quot;Controlled surgery parameters&quot;,&quot;display_title&quot;:&quot;Definition 2.19: Controlled surgery parameters&quot;,&quot;body&quot;:&quot;On every finite restriction $[0,b]$ of the all-time construction, fix the\nfinite-horizon surgery producer $\\Phi_{\\mathrm{HI}}^{b,g(0)}$ from\n\\ref{lem:finite-horizon-surgery-phi-envelope}; all occurrences of\n$\\Phi_{\\mathrm{HI}}$ below mean this fixed producer on that restriction.\nFix $\\epsilon&gt;0$ sufficiently small and choose $C$ larger than the uniform\ncanonical-neighborhood constants for the standard solution and for\nthree-dimensional $\\kappa$-solutions.  Put $t_0=2^{-5}$ and\n$T_i=2^it_0$.  The control data are positive nonincreasing sequences\n\\[\n \\mathbf r=(r_i)_{i\\ge0},\\qquad\n \\mathbf K=(\\kappa_i)_{i\\ge0},\\qquad\n \\boldsymbol\\delta=(\\delta_i)_{i\\ge0},\n\\qquad r_0=\\epsilon,\n\\]\nwhere $\\kappa_0&gt;0$ and $0&lt;\\delta_0\\le\\delta_0^{\\rm cap}$ are fixed initial\nentries.  The all-time\nexistence theorem chooses $\\kappa_0$ from the normalized short-time estimate\nand chooses $\\delta_0$ below the fixed local-surgery, neck-gluing, and\ncap-barrier thresholds.  Their associated step functions are\n\\[\n r(t)=r_0,\\quad\\kappa(t)=\\kappa_0\n \\quad(0\\le t&lt;T_0),\n\\]\nand have values $r_{i+1}$ and $\\kappa_{i+1}$ on\n$[T_i,T_{i+1})$.  A positive nonincreasing surgery-control function\n$\\bar\\delta(t)$ is required to have no transition on $[0,T_0]$ and to\nsatisfy, at every later transition time,\n\\[\n \\bar\\delta(t)&lt;\\delta_{i+1}\\le\\delta_0^{\\rm cap}\n \\qquad(T_i&lt;t\\le T_{i+1}),\n\\]\nwhere $\\delta_0^{\\rm cap}$ is the cap-insertion threshold in\n\\ref{lem:ricci-flow-surgery-cap-insertion}.\nDefine\n\\[\n \\rho(t)=\\bar\\delta(t)r(t),\n \\qquad\n h(t)=H(\\Phi_{\\mathrm{HI}}^{b,g(0)},t,r,\\bar\\delta(t))\n \\le \\bar\\delta(t)^2r(t),\n\\]\nat surgery times; this is the neck scale supplied by\n\\ref{lem:ricci-flow-surgery-horn-scale}.\nAt a surgery time $t$, every cutting sphere is the central sphere of a strong\n$\\bar\\delta(t)$-neck of scalar curvature $h(t)^{-2}$.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:61,&quot;ref&quot;:&quot;MT:ch15:15.5,MT:ch15:15.6,MT:ch15:15.7&quot;},{&quot;id&quot;:&quot;081e62843e0c&quot;,&quot;label&quot;:&quot;def:controlled-ricci-flow-with-surgery&quot;,&quot;title&quot;:&quot;Ricci flow with controlled surgery data&quot;,&quot;display_title&quot;:&quot;Definition 2.20: Ricci flow with controlled surgery data&quot;,&quot;body&quot;:&quot;For the fixed $C$, $\\epsilon$, and control functions, a\n\\emph{controlled Ricci flow with surgery} is a three-dimensional Ricci flow\nwith surgery satisfying Assumptions~(1)--(7) of Morgan--Tian and using the\nprescribed cutting data.  Explicitly:\n\\begin{enumerate}\n\\item Every slice is compact and contains no embedded $\\mathbb{RP}^2$ with\n      trivial normal bundle.\n\\item Singular times form a discrete subset of the time interval.\n\\item Time zero is initial, and every component of $(M_0,g(0))$ is\n      normalized: $|\\operatorname{Rm}|\\le1$ and every unit ball has at least\n      half the Euclidean unit-ball volume.\n\\item At a singular time $t$, the exposed region $E_t$ is a finite disjoint\n      union of smoothly embedded closed three-balls.  Its complement\n      $C_t=M_t\\setminus\\operatorname{int}E_t$ is the maximal continuing\n      region: it is the maximal subset for which the time vector field gives\n      an embedding $C_t\\times(t-\\eta,t]\\to\\mathcal M$ for some $\\eta&gt;0$.\n      Thus\n      $M_t=C_t\\cup_{\\Sigma_t}E_t$ with\n      $\\Sigma_t=\\partial C_t=\\partial E_t$ a finite union of two-spheres.\n      For every sufficiently close regular $t^-&lt;t$, backward flow maps $C_t$\n      diffeomorphically onto a compact codimension-zero submanifold\n      $C_{t^-}\\subset M_{t^-}$ with boundary the backward image of\n      $\\Sigma_t$; the disappearing region is\n      $D_{t^-}=M_{t^-}\\setminus C_{t^-}$.\n\\item Every component of $\\Sigma_t$ is the central sphere of a strong\n      $\\bar\\delta(t)$-neck at scalar curvature $h(t)^{-2}$ in the maximal\n      presurgery extension to $t$.\n\\item For every singular time $t$ and every sufficiently close regular\n      $t^-&lt;t$, every point of the disappearing region\n      $D_{t^-}=M_{t^-}\\setminus C_{t^-}$ has a strong\n      $(C,\\epsilon)$-canonical neighborhood.\n\\item Between consecutive singular times the ordinary Ricci flow is maximal.\n\\end{enumerate}\nPositive pinching, the strong canonical-neighborhood assumption with parameter\n$r(t)$, and $\\mathbf K$-noncollapsing are separate quantitative properties;\nthey are not part of this definition.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:62,&quot;ref&quot;:&quot;MT:ch15:15.2,MT:ch15:15.5,MT:ch15:15.8&quot;},{&quot;id&quot;:&quot;606f02fa7ec9&quot;,&quot;label&quot;:&quot;thm:local-volume-injectivity-radius-control&quot;,&quot;title&quot;:&quot;Local volume and injectivity-radius control&quot;,&quot;display_title&quot;:&quot;Theorem 2.21: Local volume and injectivity-radius control&quot;,&quot;body&quot;:&quot;Fix $n$, $K&lt;\\infty$, $r_0&gt;0$, and $v_0&gt;0$.  There are positive constants\n\\[\n v_*=v_*(n,K,r_0,v_0),\n \\qquad \\iota_*=\\iota_*(n,K,r_0,v_0),\n\\]\nwith the following property.  If $(M^n,g)$ is complete,\n$|\\operatorname{Rm}|\\le K$ on $B(p,r_0)$, and\n$\\operatorname{Vol}B(p,r_0)\\ge v_0$, then, for\n$0&lt;s\\le\\min\\{r_0,K^{-1/2}\\}$,\n\\[\n \\operatorname{Vol}B(p,s)\\ge v_*s^n,\n \\qquad\n \\operatorname{inj}_g(p)\\ge\n \\iota_*\\min\\{r_0,K^{-1/2}\\}.\n\\]\nThe convention is that $K^{-1/2}=\\infty$ when $K=0$.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:63,&quot;ref&quot;:&quot;MT:ch1:1.35,MT:ch1:1.36,MT:ch5:5.10&quot;},{&quot;id&quot;:&quot;ff8bc7c2e43e&quot;,&quot;label&quot;:&quot;thm:normalized-short-time-ricci-flow&quot;,&quot;title&quot;:&quot;Normalized short-time flow&quot;,&quot;display_title&quot;:&quot;Theorem 2.22: Normalized short-time flow&quot;,&quot;body&quot;:&quot;There is a universal $\\kappa_0&gt;0$ such that every normalized compact\nthree-manifold $(M,g_0)$ admits a unique Ricci flow $g(t)$ on\n$[0,2^{-5}]$ with $g(0)=g_0$.  On this interval\n\\[\n |\\operatorname{Rm}_{g(t)}|\\le2,\n \\qquad\n \\operatorname{Vol}_{g(t)}B_{g(t)}(x,\\rho)\\ge\\kappa_0\\rho^3\n \\quad(0&lt;\\rho\\le1).\n\\]\nConsequently this interval has no surgery time and supplies the initial\nstage of a controlled Ricci flow with surgery.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:64,&quot;ref&quot;:&quot;MT:ch3:3.11,MT:ch4:4.11,MT:ch5:5.16,MT:ch15:15.1&quot;}]},{&quot;id&quot;:&quot;reduced-geometry&quot;,&quot;title&quot;:&quot;Reduced Geometry&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;0714466fa4ba&quot;,&quot;label&quot;:&quot;thm:local-ricci-flow-derivative-estimates&quot;,&quot;title&quot;:&quot;Local Ricci-flow derivative estimates&quot;,&quot;display_title&quot;:&quot;Theorem 2.23: Local Ricci-flow derivative estimates&quot;,&quot;body&quot;:&quot;For every $m\\ge0$ there is $C_m&lt;\\infty$ with the following property.  If a\nRicci flow has a relatively compact parabolic neighborhood\n$P(x,t,r,-r^2)$ on which $|\\operatorname{Rm}|\\le r^{-2}$, then\n\\[\n |\\nabla^m\\operatorname{Rm}|\n \\le C_m r^{-m-2}\n\\]\non $P(x,t,r/2,-r^2/2)$.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Reduced Geometry&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:65,&quot;ref&quot;:&quot;MT:ch3:3.28,MT:ch3:3.33&quot;},{&quot;id&quot;:&quot;cced2941ff59&quot;,&quot;label&quot;:&quot;def:reduced-length&quot;,&quot;title&quot;:&quot;Reduced length&quot;,&quot;display_title&quot;:&quot;Definition 2.24: Reduced length&quot;,&quot;body&quot;:&quot;Fix a smooth point $(x,T)$ and write backward time as $\\tau=T-t$.  For a\npiecewise smooth backward path $\\gamma\\colon[0,\\bar\\tau]\\to\\mathcal M$\nwith $\\gamma(0)=x$ and $\\mathbf t(\\gamma(\\tau))=T-\\tau$, put\n$X_\\gamma=\\dot\\gamma+\\chi\\in\\mathcal H$.  Define\n\\[\n \\mathcal L(\\gamma)=\n \\int_0^{\\bar\\tau}\\sqrt\\tau\n \\bigl(R(\\gamma(\\tau))+|X_\\gamma(\\tau)|_G^2\\bigr)\\,d\\tau.\n\\]\nFor a point $y$ at backward time $\\bar\\tau$, let\n$L_x(y,\\bar\\tau)$ be the infimum of $\\mathcal L$ over such paths and put\n\\[\n l_x(y,\\bar\\tau)=\\frac{L_x(y,\\bar\\tau)}{2\\sqrt{\\bar\\tau}}.\n\\]\nThese quantities are used only on domains on which every competing path\nstays in the smooth locus.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Reduced Geometry&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:66,&quot;ref&quot;:&quot;MT:ch6:6.2,MT:ch6:6.45&quot;},{&quot;id&quot;:&quot;8b2abffda757&quot;,&quot;label&quot;:&quot;def:reduced-exponential-map&quot;,&quot;title&quot;:&quot;Reduced exponential map and injectivity domain&quot;,&quot;display_title&quot;:&quot;Definition 2.25: Reduced exponential map and injectivity domain&quot;,&quot;body&quot;:&quot;An $\\mathcal L$-geodesic from $(x,T)$ is a critical point of\n$\\mathcal L$.  Its initial vector is\n\\[\n v=\\lim_{\\tau\\downarrow0}\\sqrt\\tau\\,X_\\gamma(\\tau)\n \\in T_xM_T.\n\\]\nThe reduced exponential map is\n$\\mathcal L\\exp_x^\\tau(v)=\\gamma_v(\\tau)$ whenever this geodesic exists.\nIts injectivity set $\\mathcal D_x^\\tau$ consists of those $v$ for which\n$\\gamma_v|_{[0,\\tau]}$ is the unique minimizing $\\mathcal L$-geodesic to its\nendpoint and has no nonzero $\\mathcal L$-Jacobi field vanishing at both ends.\nThe image $\\Omega_x^\\tau=\\mathcal L\\exp_x^\\tau(\\mathcal D_x^\\tau)$ is the\nreduced injectivity domain.  To match Morgan--Tian&#x27;s notation in the\nstagewise statements below, write\n$\\widetilde{\\mathcal U}_x(\\tau):=\\mathcal D_x^\\tau$.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Reduced Geometry&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:67,&quot;ref&quot;:&quot;MT:ch6:6.17,MT:ch6:6.25,MT:ch6:6.26&quot;},{&quot;id&quot;:&quot;e788faf5248f&quot;,&quot;label&quot;:&quot;prop:reduced-injectivity-set-monotonicity&quot;,&quot;title&quot;:&quot;Monotonicity of the reduced injectivity sets&quot;,&quot;display_title&quot;:&quot;Proposition 2.26: Monotonicity of the reduced injectivity sets&quot;,&quot;body&quot;:&quot;If $0&lt;\\tau&lt;\\tau&#x27;$, then\n\\[\n \\mathcal D_x^{\\tau&#x27;}\\subset\\mathcal D_x^\\tau.\n\\]\nThus an initial-vector set contained in $\\mathcal D_x^{\\tau_0}$ has\nwell-defined injective prefixes at every earlier time.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Reduced Geometry&quot;,&quot;kind&quot;:&quot;proposition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:68,&quot;ref&quot;:&quot;MT:ch6:6.30&quot;},{&quot;id&quot;:&quot;bf415d488cc7&quot;,&quot;label&quot;:&quot;def:reduced-volume&quot;,&quot;title&quot;:&quot;Reduced volume&quot;,&quot;display_title&quot;:&quot;Definition 2.27: Reduced volume&quot;,&quot;body&quot;:&quot;For a measurable set $A$ in the regular reduced-exponential image at time\n$T-\\tau$, its reduced volume based at $(x,T)$ is\n\\[\n \\widetilde V_x(A,\\tau)=\n \\int_A(4\\pi\\tau)^{-3/2}e^{-l_x(y,\\tau)}\n \\,d\\operatorname{vol}_{g(T-\\tau)}(y).\n\\]\nEquivalently, if $J(v,\\tau)$ is the Jacobian of the reduced exponential map\nand $\\widetilde A=(\\mathcal L\\exp_x^\\tau)^{-1}(A)$, then\n\\[\n \\widetilde V_x(A,\\tau)=\n \\int_{\\widetilde A}(4\\pi\\tau)^{-3/2}\n e^{-l_x(\\mathcal L\\exp_x^\\tau(v),\\tau)}J(v,\\tau)\\,dv.\n\\]\nWhen the regular image has full measure in the slice, write\n$\\widetilde V_x(\\tau)$ for the value obtained by taking that whole image.\nFor a family $A(\\tau)=\\mathcal L\\exp_x^\\tau(\\widetilde A)$ with\n$0&lt;\\tau\\le\\tau_0$, the reduced-volume monotonicity assertion below is used\nonly when there is one open smooth spacetime set $\\mathcal O$ containing\n$x$ and every $A(\\tau)$ such that every minimizing $\\mathcal L$-geodesic\nfrom $x$ to a point of $A(\\tau)$ stays in $\\mathcal O\\cup\\{x\\}$.\nThis is the common-domain hypothesis in Morgan--Tian&#x27;s monotonicity theorem.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Reduced Geometry&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:69,&quot;ref&quot;:&quot;MT:ch6:6.70,MT:ch6:6.71&quot;},{&quot;id&quot;:&quot;7965e450f6fa&quot;,&quot;label&quot;:&quot;lem:reduced-length-support-inequality&quot;,&quot;title&quot;:&quot;Upper support inequality for reduced length&quot;,&quot;display_title&quot;:&quot;Lemma 2.28: Upper support inequality for reduced length&quot;,&quot;body&quot;:&quot;On a smooth bounded-curvature Ricci-flow domain, reduced length is smooth\nbefore the reduced cut locus and satisfies, in dimension three,\n\\[\n \\partial_\\tau l+\\Delta l\\le \\frac{3/2-l}{\\tau}.\n\\]\nAt an arbitrary endpoint of a minimizing $\\mathcal L$-geodesic and for every\n$\\eta&gt;0$, there is a smooth upper support $l_\\eta$ which agrees with $l$ at\nthat endpoint and satisfies\n\\[\n \\partial_\\tau l_\\eta+\\Delta l_\\eta\n \\le \\frac{3/2-l_\\eta}{\\tau}+\\eta.\n\\]&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Reduced Geometry&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:70,&quot;ref&quot;:&quot;MT:ch6:6.4,MT:ch6:6.13,MT:ch6:6.49,MT:ch6:6.51,MT:ch7:7.8&quot;},{&quot;id&quot;:&quot;13fdfedbc3df&quot;,&quot;label&quot;:&quot;lem:minimum-reduced-length-comparison&quot;,&quot;title&quot;:&quot;Minimum reduced-length comparison&quot;,&quot;display_title&quot;:&quot;Lemma 2.29: Minimum reduced-length comparison&quot;,&quot;body&quot;:&quot;Suppose that on every slice of a smooth backward-time interval the minimum\n\\[\n m(\\tau)=\\min_y l_x(y,\\tau)\n\\]\nis attained, and that the union of the minimizing sets over compact\nsubintervals is compact.  Then $m$ is continuous and\n\\[\n D^+m(\\tau)\\le\\frac{3/2-m(\\tau)}{\\tau}.\n\\]\nIf $\\limsup_{\\tau\\downarrow0}m(\\tau)\\le3/2$, then\n$m(\\tau)\\le3/2$ throughout the interval.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Reduced Geometry&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:71,&quot;ref&quot;:&quot;MT:ch7:7.10,MT:ch7:7.11,MT:ch7:7.12&quot;},{&quot;id&quot;:&quot;46b654fc3e42&quot;,&quot;label&quot;:&quot;thm:reduced-exponential-regularity&quot;,&quot;title&quot;:&quot;Regularity of the reduced exponential map&quot;,&quot;display_title&quot;:&quot;Theorem 2.30: Regularity of the reduced exponential map&quot;,&quot;body&quot;:&quot;Assume that minimizing $\\mathcal L$-geodesics to an open set remain in a\nsmooth region on which $|\\operatorname{Ric}|$ and $|\\nabla R|$ are bounded.\nThen $\\mathcal D_x^\\tau$ is open,\n\\[\n \\mathcal L\\exp_x^\\tau\\colon\\mathcal D_x^\\tau\n \\longrightarrow\\Omega_x^\\tau\n\\]\nis a diffeomorphism, and $l_x(\\cdot,\\tau)$ is smooth on\n$\\Omega_x^\\tau$.  The complement of $\\Omega_x^\\tau$ in the selected open\nset has measure zero.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Reduced Geometry&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:72,&quot;ref&quot;:&quot;MT:ch6:6.18,MT:ch6:6.28,MT:ch6:6.56,MT:ch6:6.67&quot;},{&quot;id&quot;:&quot;841228a21206&quot;,&quot;label&quot;:&quot;lem:reduced-density-monotonicity&quot;,&quot;title&quot;:&quot;Reduced-density monotonicity&quot;,&quot;display_title&quot;:&quot;Lemma 2.31: Reduced-density monotonicity&quot;,&quot;body&quot;:&quot;Let $v\\in\\mathcal D_x^\\tau$ and let $J(v,\\tau)$ be the Jacobian of the\nreduced exponential map.  Along the corresponding minimizing\n$\\mathcal L$-geodesic,\n\\[\n \\frac d{d\\tau}\\left((4\\pi\\tau)^{-3/2}e^{-l}J\\right)\\le0.\n\\]\nConsequently the reduced volume is nonincreasing in backward time as long as\nall minimizing curves under consideration remain in one smooth domain.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Reduced Geometry&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:73,&quot;ref&quot;:&quot;MT:ch6:6.50,MT:ch6:6.80,MT:ch6:6.81&quot;},{&quot;id&quot;:&quot;b4dc4b9a6187&quot;,&quot;label&quot;:&quot;lem:generalized-noncollapsing-small-image&quot;,&quot;title&quot;:&quot;Small reduced-exponential image estimate&quot;,&quot;display_title&quot;:&quot;Lemma 2.32: Small reduced-exponential image estimate&quot;,&quot;body&quot;:&quot;Let $(\\mathcal M,G)$ be a generalized three-dimensional Ricci flow, let\n$x\\in M_T$, and let $0&lt;\\tau_0\\le\\bar\\tau_0$, $0&lt;r\\le\\sqrt{\\tau_0}$.\nAssume that $B_{g(T)}(x,r)$ has compact closure, admits a\ntime-vector-field-compatible embedding over $[T-r^2,T]$, and satisfies\n$|\\operatorname{Rm}|\\le r^{-2}$ on that neighborhood.  Let\n$\\widetilde W\\subset\\widetilde{\\mathcal U}_x(\\tau_0)$ lie in the\n$\\mathcal L$-injectivity domain, with every associated geodesic having\nreduced length at most $l_0$ on $[0,\\tau_0]$, and put\n\\[\n \\varepsilon=\\frac{\\operatorname{Vol}_{g(T)}B_{g(T)}(x,r)^{1/3}}{r},\n \\qquad \\tau_1=\\varepsilon r^2,\n \\qquad \\widetilde W_{\\rm sm}=\n \\widetilde W\\cap\\{|v|\\le(8\\sqrt\\varepsilon)^{-1}\\}.\n\\]\nThere is $\\varepsilon_0=\\varepsilon_0(\\bar\\tau_0)&gt;0$ such that, when\n$\\varepsilon\\le\\varepsilon_0$, the reduced volume of\n$W_{\\rm sm}(\\tau_1)=\\mathcal L\\exp_x^{\\tau_1}(\\widetilde W_{\\rm sm})$ satisfies\n\\[\n \\widetilde V_x(W_{\\rm sm}(\\tau_1),\\tau_1)\n \\le 2\\varepsilon^{3/2}.\n\\]&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Reduced Geometry&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:74,&quot;ref&quot;:&quot;MT:ch8:8.1&quot;},{&quot;id&quot;:&quot;964de89f5091&quot;,&quot;label&quot;:&quot;lem:generalized-noncollapsing-large-tail&quot;,&quot;title&quot;:&quot;Large reduced-exponential tail estimate&quot;,&quot;display_title&quot;:&quot;Lemma 2.33: Large reduced-exponential tail estimate&quot;,&quot;body&quot;:&quot;Let $(\\mathcal M,G)$ be a generalized three-dimensional Ricci flow with\nthe same compact-closure, compatible-embedding, and curvature hypotheses\nas in the preceding lemma.  Let $x\\in M_T$, let\n$0&lt;\\tau_0\\le\\bar\\tau_0$, $0&lt;r\\le\\sqrt{\\tau_0}$, and let\n$\\widetilde W\\subset\\widetilde{\\mathcal U}_x(\\tau_0)$ lie in the\n$\\mathcal L$-injectivity domain.  Assume moreover that there is an open\nsmooth spacetime set $\\mathcal O$ containing $x$ and all\n$\\mathcal L\\exp_x^\\tau(\\widetilde W)$ for $0&lt;\\tau\\le\\tau_0$, and that every\nminimizing $\\mathcal L$-geodesic from $x$ to those images stays in\n$\\mathcal O\\cup\\{x\\}$.  Put\n$\\displaystyle \\varepsilon=\\operatorname{Vol}_{g(T)}B_{g(T)}(x,r)^{1/3}/r$,\nand put\n$\\tau_1=\\varepsilon r^2$ and\n$\\widetilde W_{\\rm lg}=\n\\widetilde W\\setminus\\{|v|\\le(8\\sqrt\\varepsilon)^{-1}\\}$.  There is a\nuniversal $\\varepsilon_1&gt;0$ such that, for\n$0&lt;\\varepsilon\\le\\varepsilon_1$,\n\\[\n \\widetilde V_x(\\mathcal L\\exp_x^{\\tau_1}(\\widetilde W_{\\rm lg}),\\tau_1)\n \\le \\varepsilon^{3/2}.\n\\]&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Reduced Geometry&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:75,&quot;ref&quot;:&quot;MT:ch8:8.1&quot;},{&quot;id&quot;:&quot;01b32c767069&quot;,&quot;label&quot;:&quot;thm:generalized-flow-noncollapsing-interface&quot;,&quot;title&quot;:&quot;Imported interface: generalized-flow noncollapsing&quot;,&quot;display_title&quot;:&quot;Theorem 2.34: Imported interface: generalized-flow noncollapsing&quot;,&quot;body&quot;:&quot;Fix $\\bar\\tau_0,l_0,V&gt;0$.  There is\n$\\kappa=\\kappa(\\bar\\tau_0,V,l_0)&gt;0$ with the following property.  Let\n$(\\mathcal M,G)$ be a generalized three-dimensional Ricci flow, let\n$x\\in M_T$, and suppose that $0&lt;\\tau_0\\le\\bar\\tau_0$ and\n$0&lt;r\\le\\sqrt{\\tau_0}$.  Assume:\n\\begin{enumerate}\n\\item $B_{g(T)}(x,r)$ has compact closure in $M_T$;\n\\item the ball admits a time-vector-field-compatible embedding over\n      $[T-r^2,T]$;\n\\item $|\\operatorname{Rm}|\\le r^{-2}$ on that parabolic neighborhood;\n\\item there is an open set\n      $\\widetilde W\\subset\\widetilde{\\mathcal U}_x(\\tau_0)\\subset T_xM_T$\n      in the $\\mathcal L$-injectivity domain, together with an open smooth\n      spacetime set $\\mathcal O$ containing $x$ and every\n      $W(\\tau)=\\mathcal L\\exp_x^\\tau(\\widetilde W)$ for\n      $0&lt;\\tau\\le\\tau_0$, such that every minimizing $\\mathcal L$-geodesic\n      from $x$ to $W(\\tau)$ stays in $\\mathcal O\\cup\\{x\\}$ and every\n      associated geodesic on $[0,\\tau_0]$ has reduced length at most $l_0$;\n\\item for\n      $W(\\tau)=\\mathcal L\\exp_x^\\tau(\\widetilde W)$, one has\n      $\\operatorname{Vol}_{g(T-\\tau_0)}W(\\tau_0)\\ge V$.\n\\end{enumerate}\nThen\n\\[\n \\operatorname{Vol}_{g(T)}B_{g(T)}(x,r)\\ge\\kappa r^3.\n\\]&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Reduced Geometry&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:76,&quot;ref&quot;:&quot;MT:ch8:8.1&quot;}]},{&quot;id&quot;:&quot;local-curvature-and-neck-estimates&quot;,&quot;title&quot;:&quot;Local Curvature and Neck Estimates&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;018d5ec3ba13&quot;,&quot;label&quot;:&quot;thm:strong-curvature-tensor-maximum-principle&quot;,&quot;title&quot;:&quot;Strong maximum principle for curvature tensors&quot;,&quot;display_title&quot;:&quot;Theorem 2.35: Strong maximum principle for curvature tensors&quot;,&quot;body&quot;:&quot;Let $\\overline U$ be a compact, connected, smooth codimension-zero submanifold\nof a Riemannian manifold $M$, possibly with boundary, and let $\\mathcal V$ be\na tensor bundle over $M$.  Let $\\mathcal T(x,t)$ be a smooth family of\nsections on $\\overline U\\times[0,T]$ satisfying\n\\[\n \\partial_t\\mathcal T=\\Delta\\mathcal T+\\Psi(\\mathcal T),\n\\]\nwhere $\\Psi$ is a smooth fiberwise vector field.  Suppose there is a\ncontinuous, locally Lipschitz, fiberwise \\emph{concave} function\n$s\\colon\\mathcal V\\to\\mathbb R$ (equivalently, all of its superlevel sets are\nconvex) which is invariant under parallel translation and for which, whenever\n$s_x(A)\\ge0$, the vector $\\Psi(A)$ lies in the tangent cone at $A$ to the\nconvex superlevel set $\\{B\\in V_x:s_x(B)\\ge s_x(A)\\}$.  If\n$s(\\mathcal T(x,0))\\ge0$ on $\\overline U$ and\n$s(\\mathcal T(x,t))\\ge0$ on $\\partial\\overline U\\times[0,T]$, and if\n$s(\\mathcal T(x_0,0))&gt;0$ for some $x_0\\in\\operatorname{int}\\overline U$,\nthen $s(\\mathcal T(x,t))&gt;0$ on\n$\\operatorname{int}\\overline U\\times(0,T]$.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Local Curvature and Neck Estimates&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:77,&quot;ref&quot;:&quot;MT:ch4:4.17,MT:ch4:4.18&quot;},{&quot;id&quot;:&quot;42924e90a0f8&quot;,&quot;label&quot;:&quot;lem:two-smallest-curvature-cone-invariant&quot;,&quot;title&quot;:&quot;The three-dimensional two-smallest-curvature cone is reaction invariant&quot;,&quot;display_title&quot;:&quot;Lemma 2.36: The three-dimensional two-smallest-curvature cone is reaction invariant&quot;,&quot;body&quot;:&quot;Let $\\lambda\\ge\\mu\\ge\\nu$ be the eigenvalues of a three-dimensional\ncurvature operator, and put $s=\\mu+\\nu$.  For the Ricci-flow reaction ODE\n\\[\n \\dot\\lambda=\\lambda^2+\\mu\\nu,\\qquad\n \\dot\\mu=\\mu^2+\\lambda\\nu,\\qquad\n \\dot\\nu=\\nu^2+\\lambda\\mu,\n\\]\nthe closed cone $\\{s\\ge0\\}$ is invariant.  More precisely, on its boundary\n $s=0$ one has $\\dot s=\\mu^2+\\nu^2\\ge0$.  The function $s$ is a concave,\nparallel-invariant function of the curvature operator, so its superlevel set\nhas the tangent-cone property required by\n\\ref{thm:strong-curvature-tensor-maximum-principle}.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Local Curvature and Neck Estimates&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:78,&quot;ref&quot;:&quot;MT:ch4:4.17,MT:ch4:4.18&quot;},{&quot;id&quot;:&quot;f3a098444eb6&quot;,&quot;label&quot;:&quot;lem:curvature-nullity-propagation&quot;,&quot;title&quot;:&quot;Propagation of a curvature-operator nullity&quot;,&quot;display_title&quot;:&quot;Lemma 2.37: Propagation of a curvature-operator nullity&quot;,&quot;body&quot;:&quot;Let $T&gt;0$ and let $(U,g(t))$, $0\\le t\\le T$, be a connected\nthree-dimensional Ricci flow whose slices have nonnegative sectional\ncurvature (completeness is not assumed).  If $g(0)$ is nonflat and the\nRicci tensor at some $p\\in U$ at time $T$ has a zero eigenvalue, then\n\\[\n \\mu+\\nu=0\n \\quad\\text{and hence}\\quad\n \\operatorname{spec}(\\operatorname{Rm})=\\{\\lambda,0,0\\},\\qquad\\lambda&gt;0,\n\\]\nat every point of $U$ and every $0&lt;t\\le T$, where\n$\\lambda\\ge\\mu\\ge\\nu$ are the curvature-operator eigenvalues.  Thus the\nRicci tensor has a one-dimensional nullspace and its null line is defined\ncontinuously (and smoothly after a local choice of sign).&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Local Curvature and Neck Estimates&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:79,&quot;ref&quot;:&quot;MT:ch4:4.19,MT:ch4:4.20&quot;},{&quot;id&quot;:&quot;eea9e1e3c571&quot;,&quot;label&quot;:&quot;thm:curvature-null-splitting&quot;,&quot;title&quot;:&quot;Splitting at a curvature null direction&quot;,&quot;display_title&quot;:&quot;Theorem 2.38: Splitting at a curvature null direction&quot;,&quot;body&quot;:&quot;Let $T&gt;0$ and let $(U,g(t))$, $0\\le t\\le T$, be a connected smooth\nthree-dimensional Ricci flow with nonnegative sectional curvature; the\nslices need not be complete for the local assertion.  Assume that $g(0)$ is\nnot flat and that the Ricci tensor at some $p\\in U$ at time $T$ has a zero\neigenvalue (equivalently, the curvature operator has a two-dimensional\nkernel).  Then, for every $0&lt;t\\le T$, the metric is locally a Riemannian\nproduct of a surface of positive curvature and a line, and the flow is\nlocally the product of the surface Ricci flow and the trivial line flow.  If\nevery slice is complete, a covering\n$\\widetilde U\\to U$ carries the product flow\n$(N,h(t))\\times(\\mathbb R,ds^2)$ for $0\\le t\\le T$; deck\ntransformations preserve the parallel line distribution.  Without the\nnonflatness assumption, the separate scalar clause is: if\n$R(p,T)=0$, then the whole connected flow on $U\\times[0,T]$ is flat.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Local Curvature and Neck Estimates&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:80,&quot;ref&quot;:&quot;MT:ch4:4.19,MT:ch4:4.20,MT:ch4:4.21&quot;},{&quot;id&quot;:&quot;e73998aba973&quot;,&quot;label&quot;:&quot;thm:ancient-scalar-curvature-monotonicity&quot;,&quot;title&quot;:&quot;Ancient scalar-curvature monotonicity&quot;,&quot;display_title&quot;:&quot;Theorem 2.39: Ancient scalar-curvature monotonicity&quot;,&quot;body&quot;:&quot;Let $(M,g(t))$, $-\\infty&lt;t\\le0$, be a complete Ricci flow with bounded\nnonnegative curvature operator on each time slice.  Then\n\\[\n \\partial_tR(x,t)\\ge0\n\\]\nat every spacetime point.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Local Curvature and Neck Estimates&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:81,&quot;ref&quot;:&quot;MT:ch4:4.37,MT:ch4:4.39&quot;},{&quot;id&quot;:&quot;545f0a9ee81a&quot;,&quot;label&quot;:&quot;lem:finite-interval-harnack-distance-control&quot;,&quot;title&quot;:&quot;Finite-interval Harnack and distance control&quot;,&quot;display_title&quot;:&quot;Lemma 2.40: Finite-interval Harnack and distance control&quot;,&quot;body&quot;:&quot;Let $0&lt;T&lt;\\infty$ and let $(M,g(t))$, $-T&lt;t\\le0$, be a complete\nthree-dimensional Ricci flow with nonnegative curvature and curvature locally\nbounded in time.  If\n\\[\n Q=\\sup_{x\\in M}R_{g(0)}(x)&lt;\\infty,\n\\]\nthen for every $x\\in M$ and $-T&lt;t\\le0$,\n\\[\n R_{g(t)}(x)\\le Q\\frac{T}{T+t},\n\\]\nand for all $x,y\\in M$,\n\\[\n d_{g(t)}(x,y)\\le d_{g(0)}(x,y)+16\\sqrt{\\frac Q3}\\,T.\n\\]\nThe estimates also hold on compact exhaustions when the flow is initially\ngiven only as a pointed geometric limit.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Local Curvature and Neck Estimates&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:82,&quot;ref&quot;:&quot;MT:ch11:11.12&quot;},{&quot;id&quot;:&quot;895f10b519cc&quot;,&quot;label&quot;:&quot;thm:busemann-function-superharmonicity&quot;,&quot;title&quot;:&quot;Weak superharmonicity of Busemann functions&quot;,&quot;display_title&quot;:&quot;Theorem 2.41: Weak superharmonicity of Busemann functions&quot;,&quot;body&quot;:&quot;Let $(M^n,g)$ be complete with nonnegative Ricci curvature, and let $B$ be\nthe Busemann function of a ray.  Then $\\Delta B\\le0$ weakly: for every\nnonnegative compactly supported smooth function $\\varphi$,\n\\[\n \\int_M B\\,\\Delta\\varphi\\,d\\mu\\le0.\n\\]&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Local Curvature and Neck Estimates&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:83,&quot;ref&quot;:&quot;MT:ch2:2.3&quot;},{&quot;id&quot;:&quot;f82e94abd991&quot;,&quot;label&quot;:&quot;lem:epsilon-neck-geodesic-axis-alignment&quot;,&quot;title&quot;:&quot;Long minimizing geodesics align with a neck axis&quot;,&quot;display_title&quot;:&quot;Lemma 2.42: Long minimizing geodesics align with a neck axis&quot;,&quot;body&quot;:&quot;For every $\\alpha&gt;0$ there is $\\epsilon_0(\\alpha)&gt;0$ such that, in a\nnormalized $\\epsilon$-neck with $\\epsilon\\le\\epsilon_0$, every minimizing\ngeodesic of length greater than $\\epsilon^{-1}/100$ which crosses in the\npositive axial direction has tangent within $\\alpha$ of the axial unit\nvector at every point of the geodesic contained in the neck.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Local Curvature and Neck Estimates&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:84,&quot;ref&quot;:&quot;MT:ch19:19.4&quot;}]},{&quot;id&quot;:&quot;compactness-and-noncollapsing&quot;,&quot;title&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;673665487492&quot;,&quot;label&quot;:&quot;thm:pointed-riemannian-compactness&quot;,&quot;title&quot;:&quot;Pointed Riemannian compactness&quot;,&quot;display_title&quot;:&quot;Theorem 2.43: Pointed Riemannian compactness&quot;,&quot;body&quot;:&quot;Let $(M_j,g_j,x_j)$ be complete pointed Riemannian manifolds.  Suppose that\non every fixed based ball all covariant derivatives of curvature are\nuniformly bounded and that for some $r_0,v_0&gt;0$,\n\\[\n \\operatorname{Vol}_{g_j}B(x_j,r_0)\\ge v_0.\n\\]\nThen a subsequence converges smoothly on compact subsets to a complete\npointed Riemannian manifold.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:85,&quot;ref&quot;:&quot;MT:ch5:5.6,MT:ch5:5.9,MT:ch5:5.10&quot;},{&quot;id&quot;:&quot;125231b4985e&quot;,&quot;label&quot;:&quot;thm:hamilton-compactness-generalized-flows&quot;,&quot;title&quot;:&quot;Pointed Ricci-flow compactness&quot;,&quot;display_title&quot;:&quot;Theorem 2.44: Pointed Ricci-flow compactness&quot;,&quot;body&quot;:&quot;Let $(\\mathcal M_j,G_j,x_j)$ be based generalized Ricci flows with base time\nzero, defined on a common open time interval $I$.  Suppose that for every\n$A&lt;\\infty$ and compact $J\\Subset I$ containing zero, all sufficiently large\n$j$ admit compatible embeddings\n\\[\n B_{g_j(0)}(x_j,A)\\times J\\longrightarrow\\mathcal M_j\n\\]\nwith compact zero-time balls and a uniform curvature bound on the images.\nAssume that for some $r_0,\\kappa&gt;0$,\n\\[\n \\operatorname{Vol}_{g_j(0)}B(x_j,r_0)\\ge\\kappa r_0^3.\n\\]\nAfter passing to a subsequence, the flows converge smoothly on compact\nspacetime subsets.  The limit is a pointed Ricci flow\n\\[\n (M_\\infty,g_\\infty(t),x_\\infty)\n\\]\non $I$, and its time-zero slice is complete.  If\n$\\operatorname{Ric}_{g_\\infty(t)}\\ge0$ for $t\\le0$, then every nonpositive\ntime slice of the limit is complete.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:86,&quot;ref&quot;:&quot;MT:ch5:5.14,MT:ch5:5.15&quot;},{&quot;id&quot;:&quot;af24539c6503&quot;,&quot;label&quot;:&quot;lem:nonflat-terminal-cone-exclusion&quot;,&quot;title&quot;:&quot;Nonflat terminal cones are excluded&quot;,&quot;display_title&quot;:&quot;Lemma 2.45: Nonflat terminal cones are excluded&quot;,&quot;body&quot;:&quot;Let $T&gt;0$ and let $(U,g(t))$, $0\\le t\\le T$, be a connected\nthree-dimensional Ricci flow (the slices need not be complete) with\nnonnegative sectional curvature.  Suppose that, for a Riemannian\ntwo-manifold $(N,h)$, the terminal slice $(U,g(T))$ is isometric to a\nnonempty open subset of the open cone\n\\[\n (N\\times(0,\\infty),\\;dr^2+r^2h).\n\\]\nThen $(U,g(t))$ is flat for every $t\\in[0,T]$.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:87,&quot;ref&quot;:&quot;MT:ch4:4.22&quot;},{&quot;id&quot;:&quot;9a01b45f2cc1&quot;,&quot;label&quot;:&quot;lem:standard-cap-reduced-length-barrier&quot;,&quot;title&quot;:&quot;Normalized standard-cap reduced-length barrier&quot;,&quot;display_title&quot;:&quot;Lemma 2.46: Normalized standard-cap reduced-length barrier&quot;,&quot;body&quot;:&quot;For every $L_0&lt;\\infty$ and every fixed surgery-cap model, there are a\nnormalized inner cap neighborhood, an outer annulus, and a time\n$0&lt;\\theta&lt;1$ such that every backward reduced path which enters the inner\nneighborhood from the outer side before normalized time $\\theta$ has\n$\\mathcal L_+\\ge L_0$.  The same lower bound holds for a path ending at the\nnormalized exposed frontier.  Standard-cap convergence transfers the barrier\nuniformly to all sufficiently small surgery controls, with the terminal\ncontrolled ball outside the outer annulus.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:88,&quot;ref&quot;:&quot;MT:ch16:16.5,MT:ch16:16.8,MT:ch16:16.13&quot;},{&quot;id&quot;:&quot;72a95332c67c&quot;,&quot;label&quot;:&quot;lem:short-reduced-paths-avoid-surgery-caps&quot;,&quot;title&quot;:&quot;Short reduced paths avoid surgery caps&quot;,&quot;display_title&quot;:&quot;Lemma 2.47: Short reduced paths avoid surgery caps&quot;,&quot;body&quot;:&quot;Fix a controlled stage with a finite list of surgery times in\n$[T_{i-1},T]$, a terminal point $(x,T)$ with a controlled parabolic ball of\nradius at least $r_{i+1}$, and $L_0&lt;\\infty$.  There is a\npositive surgery-control bound, depending only on the stage data and $L_0$,\nsuch that every backward path from $x$ with\n\\[\n \\mathcal L_+(\\gamma)=\\int\\sqrt\\tau\n   \\bigl(\\max(R,0)+|\\dot\\gamma|^2\\bigr)\\,d\\tau&lt;L_0\n\\]\nmisses a fixed open neighborhood of every surgery cap and every exposed\npoint in $[T_{i-1},T]$.  The finite list is part of the stage hypothesis; the\nneighborhood and control bound are uniform over that list.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:89,&quot;ref&quot;:&quot;MT:ch16:16.5,MT:ch16:16.8,MT:ch16:16.13,MT:ch16:16.15&quot;},{&quot;id&quot;:&quot;b064cd2364ba&quot;,&quot;label&quot;:&quot;prop:compact-reduced-minimizing-domain&quot;,&quot;title&quot;:&quot;Compact smooth domain for reduced minimizers&quot;,&quot;display_title&quot;:&quot;Proposition 2.48: Compact smooth domain for reduced minimizers&quot;,&quot;body&quot;:&quot;Under the hypotheses of \\ref{lem:short-reduced-paths-avoid-surgery-caps},\nthere is an open subset $U$ of the smooth spacetime over\n$[T_{i-1},T)$ such that:\n\\begin{enumerate}\n\\item every point of $U$ is joined to $x$ by a minimizing smooth\n      $\\mathcal L$-geodesic;\n\\item every slice $U_t$ is nonempty and\n      $\\min_{U_t}\\mathcal L\\le3\\sqrt{T-t}$;\n\\item over every compact time interval, the slice minimizers form a compact\n      subset of the smooth spacetime.\n\\end{enumerate}&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;kind&quot;:&quot;proposition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:90,&quot;ref&quot;:&quot;MT:ch16:16.4,MT:ch16:16.21,MT:ch16:16.24,MT:ch16:16.25&quot;},{&quot;id&quot;:&quot;57ad05a8f82d&quot;,&quot;label&quot;:&quot;lem:positive-component-persistence&quot;,&quot;title&quot;:&quot;Positive-curvature components persist along smooth flow lines&quot;,&quot;display_title&quot;:&quot;Lemma 2.49: Positive-curvature components persist along smooth flow lines&quot;,&quot;body&quot;:&quot;Let $X_s$ be a compact connected component of a smooth three-dimensional\nRicci flow with strictly positive sectional curvature at a time $s$.  Until\nthe next surgery or extinction, its forward images remain compact and have\nstrictly positive sectional curvature.  Consequently, if a smooth backward\nflow line joins a point $y\\in X_s$ to a later point $x$, then the component\ncontaining $x$ is a positive-sectional-curvature component.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:91,&quot;ref&quot;:&quot;MT:ch4:4.23,MT:ch16:16.1&quot;},{&quot;id&quot;:&quot;0b397631172e&quot;,&quot;label&quot;:&quot;prop:stagewise-reduced-exponential-family&quot;,&quot;title&quot;:&quot;Morgan--Tian stagewise reduced-exponential family&quot;,&quot;display_title&quot;:&quot;Proposition 2.50: Morgan--Tian stagewise reduced-exponential family&quot;,&quot;body&quot;:&quot;Fix $i\\ge1$ and the finite control data of\n\\ref{def:controlled-surgery-parameters}.  Let $T\\in[T_i,T_{i+1})$ and let\n$(x,T)\\in\\mathcal M_T^-$ be a smooth presurgery point in a component which is\nnot compact and positive sectional curvature.  Assume the restriction before\n$T_i$ has the stage\n$\\kappa_i$-noncollapsing bound, the whole flow satisfies Assumptions (1)--(7),\ncurvature pinching, and the strong $(C,\\epsilon)$-canonical-neighborhood\nassumption with parameter $r_{i+1}$, and\n\\[\n \\bar\\delta(t)\\le\\mathfrak d_i(r_{i+1})\n \\qquad(T_{i-1}\\le t&lt;T_{i+1}).\n\\]\nSuppose that the fixed stagewise selector has supplied a value\n$0&lt;\\mathfrak d_i(r_{i+1})&lt;1/2$ and that, for some\n$\\rho\\in[r_{i+1},\\epsilon]$ with $T\\ge\\rho^2$, the compatible backward\nparabolic neighborhood\n$P(x,\\rho,T,-\\rho^2)$ exists and\n$|\\operatorname{Rm}|\\le\\rho^{-2}$ there.  Then there are a time\n$\\tau_*&gt;0$, an open smooth domain $U\\subset\\mathbf t^{-1}[T_{i-1},T)$,\nconstants $l_0&lt;\\infty$, $r&#x27;_i&gt;0$, $V_i=\\kappa_i(r&#x27;_i)^3&gt;0$, and an open set\n$\\widetilde W\\subset\\widetilde{\\mathcal U}_x(\\tau_*)$ in the reduced-\nexponential injectivity domain such that:\n\\begin{enumerate}\n\\item $U_t$ is nonempty for every $t\\in[T_{i-1},T)$, every point of $U$\n      is joined to $(x,T)$ by a minimizing smooth $\\mathcal L$-geodesic,\n      and the slice minimum is at most $3\\sqrt{T-t}$;\n\\item the set of slice minimizers is compact over every compact subinterval\n      of $[T_{i-1},T)$;\n\\item there are $t&#x27;&#x27;=T-\\tau_*$ and $y\\in U_{t&#x27;&#x27;}$ with\n      $R(y)&lt;r_i^{-2}$ and a compatible parabolic ball\n      $P(y,t&#x27;&#x27;,r&#x27;_i,-(r&#x27;_i)^2)$ on which\n      $|\\operatorname{Rm}|\\le(r&#x27;_i)^{-2}$ and\n      $\\operatorname{Vol}_{g(t&#x27;&#x27;)}B(y,t&#x27;&#x27;,r&#x27;_i)\\ge V_i$;\n\\item the terminal ball $B_{g(T)}(x,\\rho)$ has compact closure, embeds\n      compatibly and unscathed over $[T-\\rho^2,T]$, and has\n      $|\\operatorname{Rm}|\\le\\rho^{-2}$ there;\n\\item every reduced geodesic issued from $\\widetilde W$ has reduced length at\n      most $l_0$ on $[0,\\tau_*]$, and\n      $\\operatorname{Vol}_{g(T-\\tau_*)}\n      \\mathcal L\\exp_x^{\\tau_*}(\\widetilde W)\\ge V_i$.\n\\end{enumerate}\nHere $r&#x27;_i$ and $l_0$ depend only on the fixed stage data (and not on $x$ or\n$T$).&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;kind&quot;:&quot;proposition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:92,&quot;ref&quot;:&quot;MT:ch16:16.1,MT:ch16:16.4,MT:ch16:16.15,MT:ch16:16.21,MT:ch16:16.26&quot;},{&quot;id&quot;:&quot;4db844706cd7&quot;,&quot;label&quot;:&quot;lem:reduced-volume-noncollapsing-transfer&quot;,&quot;title&quot;:&quot;Reduced-volume noncollapsing transfer&quot;,&quot;display_title&quot;:&quot;Lemma 2.51: Reduced-volume noncollapsing transfer&quot;,&quot;body&quot;:&quot;Assume the stage-$i$ noncollapsing bound on earlier controlled slices and all\nstage hypotheses of\n\\ref{prop:stagewise-reduced-exponential-family}.  For each selected terminal\ncentre choose $\\tau_*$, $\\widetilde W$, $l_0$, and $V_i$ from that proposition;\nthese data explicitly provide all five hypotheses of\n\\ref{thm:generalized-flow-noncollapsing-interface}.  There is then\n$\\kappa_{\\mathcal L}&gt;0$, depending only on the stage data, such that every\nterminal parabolic ball of radius\n$\\rho\\in[r_{i+1},\\epsilon]$ and curvature at most $\\rho^{-2}$ satisfies\n\\[\n \\operatorname{Vol}B(x,T,\\rho)\\ge\\kappa_{\\mathcal L}\\rho^3,\n\\]\nfor every selected terminal centre whose component does not have positive\nsectional curvature.  This is deliberately the nonpositive branch; the\npositive-component branch is supplied by the Kleiner--Lott estimate below.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:93,&quot;ref&quot;:&quot;MT:ch16:16.1,MT:ch16:16.4,MT:ch16:16.26,MT:ch6:6.80&quot;},{&quot;id&quot;:&quot;a0f5febe5349&quot;,&quot;label&quot;:&quot;lem:kleiner-lott-noncollapsing-estimate&quot;,&quot;title&quot;:&quot;Kleiner--Lott all-cases noncollapsing estimate&quot;,&quot;display_title&quot;:&quot;Lemma 2.52: Kleiner--Lott all-cases noncollapsing estimate&quot;,&quot;body&quot;:&quot;Fix $0&lt;r_+\\le r_-\\le\\epsilon$, $\\kappa_-&gt;0$, and finite numbers\n$0&lt;E_-\\le E$.  There are constants\n\\[\n \\bar\\delta=\\bar\\delta(r_-,r_+,\\kappa_-,E_-,E)&gt;0,\n \\qquad\n \\kappa_+=\\kappa_+(r_-,\\kappa_-,E_-,E)&gt;0\n\\]\nwith the following property.  Let $a&lt;b&lt;c$, $b-a\\ge E_-$, and\n$c-a\\le E$.  Let $(\\mathcal M,G)$ be a three-dimensional Ricci flow with\nKleiner--Lott $(r,\\delta)$-cutoff on an interval containing $[a,c)$, with\nnormalized compact initial data, $r\\le\\epsilon$, $r\\ge r_-$ on $[a,b)$,\nand $r\\ge r_+$ on $[b,c)$.  If the flow is ordinarily\n$\\kappa_-$-noncollapsed below $\\epsilon$ on $[a,b)$ and\n$\\delta(t)\\le\\bar\\delta$ on $[a,c)$, and it satisfies the strong\ncanonical-neighborhood assumption with parameter $r_+$ on $[b,c)$, then it is ordinarily\n$\\kappa_+$-noncollapsed below $\\epsilon$ on $[b,c)$ in the sense of\n\\ref{def:surgery-flow-noncollapsing}; at each test centre it gives either the\nvolume lower bound or the positive-sectional-curvature alternative in that\ndefinition.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:94,&quot;ref&quot;:&quot;KL:II.5:II.5.2&quot;},{&quot;id&quot;:&quot;dbf6a4b24420&quot;,&quot;label&quot;:&quot;def:stagewise-delta-selector&quot;,&quot;title&quot;:&quot;Stagewise surgery-control selector&quot;,&quot;display_title&quot;:&quot;Definition 2.53: Stagewise surgery-control selector&quot;,&quot;body&quot;:&quot;For fixed stage data $(i,\\delta_i,r_i,\\kappa_i,T_i)$, a\n\\emph{stagewise surgery-control selector} is a function\n\\[\n \\mathfrak d_i:(0,r_i]\\longrightarrow(0,\\delta_i]\n\\]\nsuch that the conditional extension conclusion below holds with the cutoff\nbound $\\bar\\delta\\le\\mathfrak d_i(r)$ at radius $r$.  Whenever the\npointwise existence statement is used for a family of radii, one selector is\nfixed once and for all by the axiom of choice; the notation\n$\\delta(r)$ in later first-failure arguments means this fixed\n$\\mathfrak d_i(r)$ for the relevant stage, not an unquantified new witness.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:95,&quot;ref&quot;:&quot;KL:II.5:II.5.2&quot;},{&quot;id&quot;:&quot;3c6c0b64ac05&quot;,&quot;label&quot;:&quot;thm:conditional-noncollapsing-extension&quot;,&quot;title&quot;:&quot;Conditional noncollapsing extension&quot;,&quot;display_title&quot;:&quot;Theorem 2.54: Conditional noncollapsing extension&quot;,&quot;body&quot;:&quot;Fix $i\\ge0$ and positive nonincreasing finite sequences\n\\[\n\\delta_0\\ge\\cdots\\ge\\delta_i,\n\\qquad \\epsilon=r_0\\ge\\cdots\\ge r_i,\n\\qquad \\kappa_0\\ge\\cdots\\ge\\kappa_i.\n\\]\nFix stage times with $T_{-1}=0$ and explicit bounds\n\\[\n 0&lt;E_-\\le T_i-T_{i-1},\\qquad T_{i+1}-T_{i-1}\\le E&lt;\\infty.\n\\]\nThere are $0&lt;\\kappa_{i+1}\\le\\kappa_i$ and a stagewise selector\n$\\mathfrak d_i:(0,r_i]\\to(0,\\delta_i]$ in the sense of\n\\ref{def:stagewise-delta-selector} such that, for every\n$0&lt;r_{i+1}\\le r_i$, the following property holds with\n$\\delta(r_{i+1})=\\mathfrak d_i(r_{i+1})$.  If a\nthree-dimensional Ricci flow with Kleiner--Lott $(r,\\bar\\delta)$-cutoff on\n$[0,T)$, $T\\in(T_i,T_{i+1}]$, has normalized compact initial data in the\nsense of \\ref{def:normalized-riemannian-three-manifold}, satisfies the\ncontrolled-surgery topological assumptions, and is ordinarily\n  $\\kappa_i$-noncollapsed below $\\epsilon$ on\n  $[T_{i-1},T_i)$ (with $T_{-1}=0$), satisfies\n\n  \\[\n   r(t)\\ge r_i\\quad(t\\in[T_{i-1},T_i)),\n   \\qquad\n   r(t)\\ge r_{i+1}\\quad(t\\in[T_i,T)),\n  \\]\n  and $r(t)\\le\\epsilon$ throughout $[T_{i-1},T)$,\n  and has a positive nonincreasing\n  surgery-control function satisfying\n\\[\n \\bar\\delta(t)\\le\\delta_j\n \\quad\\bigl(t\\in[T_j,T_{j+1}),\\ 0\\le j\\le i\\bigr),\n \\qquad\n \\bar\\delta(t)\\le\\delta(r_{i+1})\n \\quad\\bigl(t\\in[T_{i-1},T_{i+1})\\bigr),\n\\]\n  where $T_{-1}=0$, and satisfies the strong canonical-neighborhood\n  assumption with parameter $r_{i+1}$ on $[T_i,T)$, then every parabolic ball\n  of radius at most\n  $\\epsilon$ satisfying the curvature hypothesis in\n\\ref{def:surgery-flow-noncollapsing} satisfies its source disjunction with\nconstant $\\kappa_{i+1}$ for every centre and every component of the time slice:\neither the ball has volume at least $\\kappa_{i+1}\\rho^3$, or its centre lies in\na positive-sectional-curvature component.  The constant is independent of the\nparticular flow.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:96,&quot;ref&quot;:&quot;MT:ch16:16.1,KL:II.5:II.5.2&quot;},{&quot;id&quot;:&quot;ff09b9b55dd8&quot;,&quot;label&quot;:&quot;thm:bounded-curvature-at-bounded-distance&quot;,&quot;title&quot;:&quot;Bounded curvature at bounded distance&quot;,&quot;display_title&quot;:&quot;Theorem 2.55: Bounded curvature at bounded distance&quot;,&quot;body&quot;:&quot;For sufficiently small $\\epsilon&gt;0$ and every $A,C&lt;\\infty$, there are\n$D_0=D_0(A,C,\\epsilon)$ and $D=D(A,C,\\epsilon)$ with the following\nproperty.  Let $x$ lie in a three-dimensional Ricci flow with surgery whose\ncurvature is pinched toward positive.  Suppose every point $z$ at time at\nmost $\\mathbf t(x)$ with $R(z)\\ge4R(x)$ has a strong\n$(C,\\epsilon)$-canonical neighborhood.  If $R(x)\\ge D_0$, then\n\\[\n R(y)\\le D R(x)\n \\qquad\\text{for every }y\\in\n B_{g(\\mathbf t(x))}\\bigl(x,A R(x)^{-1/2}\\bigr).\n\\]&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:97,&quot;ref&quot;:&quot;MT:ch10:10.2&quot;},{&quot;id&quot;:&quot;d765b5ede102&quot;,&quot;label&quot;:&quot;lem:blowup-limit-slice-bounded-curvature&quot;,&quot;title&quot;:&quot;Bounded curvature of a blow-up limit slice&quot;,&quot;display_title&quot;:&quot;Lemma 2.56: Bounded curvature of a blow-up limit slice&quot;,&quot;body&quot;:&quot;Let $(M,g,x)$ be a complete, connected, nonflat, three-dimensional\nRiemannian manifold with nonnegative curvature and $R_g(x)=1$.  Assume that\nfor every $A&lt;\\infty$ there is a compatible smooth pointed Ricci-flow limit on\n$B_g(x,A)\\times[-\\tau_A,0]$, with $\\tau_A&gt;0$, whose zero-time slice is\n$g|_{B_g(x,A)}$ and whose slices have nonnegative curvature.  Assume also\nthat every point $q$ with $R_g(q)&gt;4$ has a strong $(2C,2\\epsilon)$-canonical\nneighborhood in the zero-time slice.  For sufficiently small $\\epsilon$, the\ncurvature of $(M,g)$ is bounded on the whole slice:\n\\[\n \\sup_{q\\in M}|\\operatorname{Rm}_g(q)|&lt;\\infty.\n\\]\nThe same conclusion applies to every time slice of a smooth pointed limit\nflow whenever the stated limit-canonical-neighborhood hypothesis is supplied\nat that time.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:98,&quot;ref&quot;:&quot;MT:ch11:11.7&quot;},{&quot;id&quot;:&quot;9e8b196a765e&quot;,&quot;label&quot;:&quot;lem:noncollapsing-predicate-pointed-limit&quot;,&quot;title&quot;:&quot;Closure of the noncollapsing predicate under pointed limits&quot;,&quot;display_title&quot;:&quot;Lemma 2.57: Closure of the noncollapsing predicate under pointed limits&quot;,&quot;body&quot;:&quot;Let smooth pointed parabolic regions converge in $C^\\infty$ on compact\nsubsets, and suppose that every approximating admissible ball of scale\n$\\rho&lt;\\epsilon$ satisfies the uniform source noncollapsing predicate with\nconstant $\\kappa$.  Then every admissible ball in the limit satisfies the\nsame volume-or-positive-component disjunction.  If the positive-component\nalternative is absent on the limit region, the limit is ordinarily\n$\\kappa$-noncollapsed below $\\epsilon$.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:99,&quot;ref&quot;:&quot;MT:ch11:11.1,MT:ch14:14.14,MT:ch14:14.15&quot;},{&quot;id&quot;:&quot;e5a1514edda1&quot;,&quot;label&quot;:&quot;thm:pointed-controlled-flow-compactness&quot;,&quot;title&quot;:&quot;Pointed compactness for controlled flows&quot;,&quot;display_title&quot;:&quot;Theorem 2.58: Pointed compactness for controlled flows&quot;,&quot;body&quot;:&quot;Let $(\\mathcal M_j,G_j,x_j,t_j)$ be based controlled three-dimensional Ricci\nflows and put $Q_j=R_{G_j(t_j)}(x_j)\\to\\infty$.  Write\n$\\widetilde G_j(s)=Q_jG_j(t_j+Q_j^{-1}s)$, so that the base time is zero\nand $R_{\\widetilde G_j(0)}(x_j)=1$.  Assume curvature is pinched toward positive, and the rescaled\nflows satisfy the uniform source predicate\n\\ref{def:surgery-flow-noncollapsing} on every fixed scale for $s&lt;0$.  Every\npoint at nonpositive time with rescaled scalar curvature at least four has a\nstrong $(C,\\epsilon)$-canonical neighborhood.  Suppose that for some\n$0&lt;T_0\\le\\infty$, every fixed\n$B(x_j,0,A)\\times(-T,0]$, with $A&lt;\\infty$ and $T&lt;T_0$, eventually has a\ncompatible spacetime embedding.  In addition, assume that there are fixed\n$\\eta&gt;0$ and $v_0&gt;0$ such that, for all sufficiently large $j$,\n\\[\n \\operatorname{Vol}_{\\widetilde G_j(0)}\n B_{\\widetilde G_j(0)}(x_j,\\eta)\\ge v_0.\n\\]\nThis is the volume-branch input required by Hamilton compactness; in the\nfirst-failure application it is supplied by the ordinary noncollapsing bridge\nand is not inferred from the positive-component exception in the surgery\nnoncollapsing predicate.  Then a subsequence converges smoothly to a complete\npointed Ricci flow on $(-T_0,0]$ with nonnegative curvature, locally bounded\nin time, and the source noncollapsing disjunction passes to the limit.  If\n$T_0=\\infty$ and the positive-sectional-curvature alternative is absent on\nevery limit slice, the limit is a $\\kappa$-solution; without that absence\nhypothesis the conclusion is only the displayed disjunctive predicate.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:100,&quot;ref&quot;:&quot;MT:ch11:11.1,MT:ch11:11.8,MT:ch11:11.10&quot;}]}]},{&quot;id&quot;:&quot;kappa-solutions-surgery-continuation&quot;,&quot;title&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;sections&quot;:[{&quot;id&quot;:&quot;kappa-solutions-and-asymptotic-models&quot;,&quot;title&quot;:&quot;Kappa-Solutions and Asymptotic Models&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;50d00891cd7a&quot;,&quot;label&quot;:&quot;thm:two-dimensional-kappa-solutions-round&quot;,&quot;title&quot;:&quot;Two-dimensional kappa-solutions are round&quot;,&quot;display_title&quot;:&quot;Theorem 3.1: Two-dimensional kappa-solutions are round&quot;,&quot;body&quot;:&quot;Every two-dimensional $\\kappa$-solution in the sense of\n\\ref{def:kappa-solution} is, after a constant parabolic scaling and time\ntranslation, a shrinking compact round surface.  Its orientable double cover\nis the shrinking round two-sphere, so the surface is $S^2$ or\n$\\mathbb{RP}^2$.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solutions and Asymptotic Models&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:101,&quot;ref&quot;:&quot;MT:ch9:9.50&quot;},{&quot;id&quot;:&quot;77d1aa60643f&quot;,&quot;label&quot;:&quot;thm:asymptotic-gradient-shrinking-soliton&quot;,&quot;title&quot;:&quot;Asymptotic gradient-shrinker production&quot;,&quot;display_title&quot;:&quot;Theorem 3.2: Asymptotic gradient-shrinker production&quot;,&quot;body&quot;:&quot;Let $(M,g(t))$ be a complete three-dimensional $\\kappa$-solution on\n$(-\\infty,0]$.  For every basepoint $(p,0)$ there are times\n$\\tau_j\\to\\infty$ and points $q_j$ at time $-\\tau_j$ with\n$l(q_j,\\tau_j)\\le3/2$ such that the parabolically rescaled pointed flows\nbased at $(q_j,-1)$ subconverge smoothly on compact spacetime sets to a\ncomplete nonflat ancient gradient shrinking Ricci soliton with bounded\nnonnegative curvature and the inherited noncollapsing estimate.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solutions and Asymptotic Models&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:102,&quot;ref&quot;:&quot;MT:ch9:9.11,MT:ch9:9.42,MT:ch9:9.44&quot;},{&quot;id&quot;:&quot;aa42ce61a95e&quot;,&quot;label&quot;:&quot;thm:three-dimensional-gradient-shrinker-classification&quot;,&quot;title&quot;:&quot;Three-dimensional gradient-shrinker classification&quot;,&quot;display_title&quot;:&quot;Theorem 3.3: Three-dimensional gradient-shrinker classification&quot;,&quot;body&quot;:&quot;Let $(N,h(t),f)$ be a complete nonflat three-dimensional ancient gradient\nshrinking soliton with bounded nonnegative curvature and positive\n$\\kappa$-noncollapsing on every finite scale.  Then it is either a compact\nround space form or one of\n\\[\n S^2\\times\\mathbb R,\\qquad\n \\mathbb{RP}^2\\times\\mathbb R,\\qquad\n \\mathbb{RP}^2\\widetilde\\times\\mathbb R,\n\\]\nwith their standard shrinking product metrics.  Every noncompact member is\none of the three displayed cylindrical models.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solutions and Asymptotic Models&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:103,&quot;ref&quot;:&quot;MT:ch9:9.53,MT:ch9:9.54&quot;},{&quot;id&quot;:&quot;be45913142d1&quot;,&quot;label&quot;:&quot;thm:kappa-solution-asymptotic-models&quot;,&quot;title&quot;:&quot;Asymptotic models of three-dimensional kappa-solutions&quot;,&quot;display_title&quot;:&quot;Theorem 3.4: Asymptotic models of three-dimensional kappa-solutions&quot;,&quot;body&quot;:&quot;Let $(M,g(t))$ be a three-dimensional $\\kappa$-solution and fix $(p,0)$.\nThere are $\\tau_j\\to\\infty$ and points $q_j$ at time $-\\tau_j$ with reduced\nlength at most $3/2$ such that the parabolically rescaled pointed flows based\nat $(q_j,-1)$ converge to a complete nonflat gradient shrinking soliton with\nbounded nonnegative curvature.  The limit is a compact round space form or\none of the three cylindrical models\n\\[\n S^2\\times\\mathbb R,\\qquad\n \\mathbb{RP}^2\\times\\mathbb R,\\qquad\n \\mathbb{RP}^2\\widetilde\\times\\mathbb R,\n\\]\nwhere the last space is the twisted line bundle.  If the original solution\nis nonround, a sequence can be chosen with one of these three noncompact\nlimits.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solutions and Asymptotic Models&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:104,&quot;ref&quot;:&quot;MT:ch9:9.11,MT:ch9:9.42,MT:ch9:9.44,MT:ch9:9.53,MT:ch9:9.54&quot;},{&quot;id&quot;:&quot;f52d6bda93a2&quot;,&quot;label&quot;:&quot;prop:universal-nonround-kappa&quot;,&quot;title&quot;:&quot;Universal noncollapsing for nonround kappa-solutions&quot;,&quot;display_title&quot;:&quot;Proposition 3.5: Universal noncollapsing for nonround kappa-solutions&quot;,&quot;body&quot;:&quot;There is a universal $\\kappa_*&gt;0$ such that every nonround\nthree-dimensional $\\kappa$-solution is uniformly $\\kappa_*$-noncollapsed:\nfor every $t\\le0$, $x\\in M_t$, and every $r&gt;0$ for which the backward\nparabolic ball is defined and satisfies $|\\operatorname{Rm}|\\le r^{-2}$,\n\\[\n \\operatorname{Vol}_{g(t)}B_{g(t)}(x,r)\\ge\\kappa_*r^3.\n\\]\nThe constant $\\kappa_*$ depends only on the dimension, not on the supplied\n$\\kappa$ or on the particular nonround solution; equivalently, every such\nflow is a $\\kappa_*$-solution in the sense of \\ref{def:kappa-solution}.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solutions and Asymptotic Models&quot;,&quot;kind&quot;:&quot;proposition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:105,&quot;ref&quot;:&quot;MT:ch9:9.58&quot;},{&quot;id&quot;:&quot;5685aa7f1635&quot;,&quot;label&quot;:&quot;thm:kappa-solution-compactness&quot;,&quot;title&quot;:&quot;Normalized kappa-solution compactness&quot;,&quot;display_title&quot;:&quot;Theorem 3.6: Normalized kappa-solution compactness&quot;,&quot;body&quot;:&quot;Fix $\\kappa&gt;0$.  Let $(M_j,g_j(t),p_j)$ be based three-dimensional\n$\\kappa$-solutions for this common value of $\\kappa$, with\n$R(p_j,0)=1$.  A subsequence converges smoothly on compact spacetime\nsubsets to a based $\\kappa$-solution\n\\[\n (M_\\infty,g_\\infty(t),p_\\infty)\n\\]\nwith $R(p_\\infty,0)=1$.\nIn particular, for every $A&lt;\\infty$ and $m\\ge0$ there is $C(A,m)&lt;\\infty$\nsuch that\n\\[\n \\sup_{B_{g_j(0)}(p_j,A)\\times[-A,0]}\n |\\nabla^m\\operatorname{Rm}_{g_j}|\\le C(A,m).\n\\]&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solutions and Asymptotic Models&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:106,&quot;ref&quot;:&quot;MT:ch9:9.59,MT:ch9:9.60,MT:ch9:9.62,MT:ch9:9.63,MT:ch9:9.64,MT:ch9:9.65,MT:ch9:9.66,MT:ch9:9.67,MT:ch9:9.68,MT:ch9:9.69,MT:ch9:9.70,MT:ch9:9.71&quot;}]},{&quot;id&quot;:&quot;kappa-solution-geometry-and-stability&quot;,&quot;title&quot;:&quot;Kappa-Solution Geometry and Stability&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;5d257a96cea2&quot;,&quot;label&quot;:&quot;lem:canonical-neighborhood-stability&quot;,&quot;title&quot;:&quot;Stability of canonical neighborhoods&quot;,&quot;display_title&quot;:&quot;Lemma 3.7: Stability of canonical neighborhoods&quot;,&quot;body&quot;:&quot;Fix $\\epsilon&lt;1/4$ and $C&lt;\\infty$.\n\\begin{enumerate}\n\\item A $(C,\\epsilon)$-cap, controlled component, or round component\n      persists under sufficiently small\n      $C^{\\lfloor\\epsilon^{-1}\\rfloor}$ perturbations of its metric and\n      under a sufficiently small change of center.\n\\item An evolving $\\epsilon$-neck of normalized backward length strictly\n      greater than one persists as a strong $\\epsilon$-neck under\n      sufficiently small smooth perturbations of the flow.\n\\item If $C&#x27;&gt;C$, $\\epsilon&#x27;&gt;\\epsilon$, and the center satisfies $R(x)\\le2$,\n      then there is $\\delta&gt;0$ such that every metric which is $\\delta$-close\n      in $C^{\\lfloor\\epsilon^{-1}\\rfloor}$ to the given\n      $(C,\\epsilon)$-canonical neighborhood contains a\n      $(C&#x27;,\\epsilon&#x27;)$-canonical neighborhood of $x$.\n\\end{enumerate}\nIn particular, strong neck centers form an open spacetime set.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solution Geometry and Stability&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:107,&quot;ref&quot;:&quot;MT:ch9:9.79,MT:ch9:9.80&quot;},{&quot;id&quot;:&quot;0b063eab0b67&quot;,&quot;label&quot;:&quot;prop:kappa-solution-curvature-trichotomy&quot;,&quot;title&quot;:&quot;Curvature trichotomy for kappa-solutions&quot;,&quot;display_title&quot;:&quot;Proposition 3.8: Curvature trichotomy for kappa-solutions&quot;,&quot;body&quot;:&quot;Every three-dimensional $\\kappa$-solution is exactly one of the following\npairwise disjoint alternatives:\n\\begin{enumerate}\n\\item its curvature operator is positive definite (equivalently, every\n      sectional curvature is positive) on every time-slice;\n\\item after a constant parabolic scaling and time translation, it is the\n      shrinking round product $S^2\\times\\mathbb R$;\n\\item after such a normalization, it is the shrinking round flow on the\n      total space of a real line bundle over $\\mathbb{RP}^2$, whose twofold\n      cover is $S^2\\times\\mathbb R$.  This includes the trivial product\n      $\\mathbb{RP}^2\\times\\mathbb R$ and the twisted line bundle\n      $\\mathbb{RP}^2\\widetilde\\times\\mathbb R$.\n\\end{enumerate}&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solution Geometry and Stability&quot;,&quot;kind&quot;:&quot;proposition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:108,&quot;ref&quot;:&quot;MT:ch9:9.83&quot;},{&quot;id&quot;:&quot;8f84b6178565&quot;,&quot;label&quot;:&quot;thm:soul-structure-nonnegative-curvature&quot;,&quot;title&quot;:&quot;Soul structure in nonnegative curvature&quot;,&quot;display_title&quot;:&quot;Theorem 3.9: Soul structure in nonnegative curvature&quot;,&quot;body&quot;:&quot;Every connected complete noncompact manifold of nonnegative sectional\ncurvature contains a compact totally geodesic, totally convex soul and is\ndiffeomorphic to its normal bundle.  If the sectional curvature is positive,\nthe soul is a point.  The proof uses the Cheeger--Gromoll soul theorem,\nsmooth Schoenflies/annulus separation for the resulting embedded spheres, and\nthe covering-space lifting theorem for the normal exponential map; these are\npart of the imported topology contract and are not inferred from curvature\nalone.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solution Geometry and Stability&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:109,&quot;ref&quot;:&quot;MT:ch2:2.7&quot;},{&quot;id&quot;:&quot;10593afc1ddd&quot;,&quot;label&quot;:&quot;lem:positive-curvature-neck-separation&quot;,&quot;title&quot;:&quot;Imported interface: a thin neck separates a point soul from the end&quot;,&quot;display_title&quot;:&quot;Lemma 3.10: Imported interface: a thin neck separates a point soul from the end&quot;,&quot;body&quot;:&quot;For sufficiently small $\\epsilon$, let $M^3$ be complete, noncompact, and\npositively curved with point soul $p$.  The central sphere of every\n$\\epsilon$-neck disjoint from $p$ separates $p$ from the unique end.  Two\ndisjoint $\\epsilon$-necks which avoid $p$ have disjoint central spheres that\nbound a region diffeomorphic to $S^2\\times[0,1]$.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solution Geometry and Stability&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:110,&quot;ref&quot;:&quot;MT:ch2:2.20&quot;},{&quot;id&quot;:&quot;a6fce8d4dc10&quot;,&quot;label&quot;:&quot;prop:positive-curvature-neck-scale-lower-bound&quot;,&quot;title&quot;:&quot;Positive curvature excludes arbitrarily small necks&quot;,&quot;display_title&quot;:&quot;Proposition 3.11: Positive curvature excludes arbitrarily small necks&quot;,&quot;body&quot;:&quot;For every sufficiently small $\\epsilon&gt;0$, a complete positively curved\nRiemannian three-manifold contains no sequence of $\\epsilon$-necks whose\nscales tend to zero.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solution Geometry and Stability&quot;,&quot;kind&quot;:&quot;proposition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:111,&quot;ref&quot;:&quot;MT:ch2:2.19&quot;},{&quot;id&quot;:&quot;b99589f092ca&quot;,&quot;label&quot;:&quot;lem:kappa-point-picking-line&quot;,&quot;title&quot;:&quot;Point-picking and the splitting-limit producer&quot;,&quot;display_title&quot;:&quot;Lemma 3.12: Point-picking and the splitting-limit producer&quot;,&quot;body&quot;:&quot;Let $(M,g(t))$, $-\\infty&lt;t\\le0$, be a complete noncompact three-dimensional\n$\\kappa$-solution and let $p_j\\to\\infty$ satisfy\n$R(p_j,-1)d(p,p_j)^2\\to\\infty$.  The scalar-curvature point-picking rule on a\nball $B_{g(-1)}(p_j,d_j/2)$, where $d_j=d_{g(-1)}(p,p_j)$, produces\n$q_j$ and $Q_j=R(q_j,-1)$ such that\n\\[\n q_j\\in B(p_j,d_j/2),\\qquad Q_j\\ge R(p_j,-1),\\qquad\n Q_jd(p,q_j)^2\\longrightarrow\\infty,\n\\]\nand\n\\[\n R(\\,\\cdot\\,,t)\\le4Q_j\n \\quad\\hbox{on}\\quad\n B_{g(-1)}\\!\\left(q_j,\n   \\frac{d_jR(p_j,-1)^{1/2}}{4Q_j^{1/2}}\\right)\n \\quad(t\\le-1).\n\\]\nThe radii of these balls tend to infinity after scaling by $Q_j$.  A\nsubsequence of the pointed rescaled flows therefore converges smoothly to a\ncomplete ancient product flow $(N,h(t))\\times(\\mathbb R,ds^2)$ with $N$\nnonflat and of bounded nonnegative curvature.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solution Geometry and Stability&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:112,&quot;ref&quot;:&quot;MT:ch9:9.39&quot;},{&quot;id&quot;:&quot;ce186647dac1&quot;,&quot;label&quot;:&quot;thm:kappa-solution-splitting-at-infinity&quot;,&quot;title&quot;:&quot;Splitting at infinity for kappa-solutions&quot;,&quot;display_title&quot;:&quot;Theorem 3.13: Splitting at infinity for kappa-solutions&quot;,&quot;body&quot;:&quot;Let $(M,g(t))$, $-\\infty&lt;t\\le0$, be a noncompact three-dimensional\n$\\kappa$-solution.  If $p_j\\to\\infty$ and\n\\[\n R(p_j,-1)d_{g(-1)}(p,p_j)^2\\longrightarrow\\infty,\n\\]\nthen there are points $q_j\\to\\infty$, scales $Q_j=R(q_j,-1)$, and a\nsubsequence for which the pointed rescaled flows converge smoothly to\n\\[\n (\\Sigma,h(t))\\times(\\mathbb R,ds^2),\n\\]\nwhere $(\\Sigma,h(t))$ is a shrinking compact round surface.  Thus\n$\\Sigma$ is $S^2$ or $\\mathbb{RP}^2$; if $M$ is orientable, it is $S^2$.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solution Geometry and Stability&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:113,&quot;ref&quot;:&quot;MT:ch9:9.39,MT:ch9:9.52&quot;},{&quot;id&quot;:&quot;ab31435babe2&quot;,&quot;label&quot;:&quot;thm:noncompact-kappa-solution-structure&quot;,&quot;title&quot;:&quot;Structure of noncompact kappa-solutions&quot;,&quot;display_title&quot;:&quot;Theorem 3.14: Structure of noncompact kappa-solutions&quot;,&quot;body&quot;:&quot;For every sufficiently small $\\epsilon&gt;0$ there is\n$C_0=C_0(\\epsilon)&lt;\\infty$ such that the time-zero slice of every\nnoncompact three-dimensional $\\kappa$-solution containing no embedded\ntwo-sided $\\mathbb{RP}^2$ is either a strong $\\epsilon$-tube or a\n$(C_0,\\epsilon)$-cap followed by a strong $\\epsilon$-tube.  The cap core has\nuniform scale-normalized curvature, derivative, diameter, and volume bounds.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solution Geometry and Stability&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:114,&quot;ref&quot;:&quot;MT:ch9:9.84,MT:ch9:9.85,MT:ch9:9.87,MT:ch9:9.88&quot;},{&quot;id&quot;:&quot;c0fea205205b&quot;,&quot;label&quot;:&quot;thm:compact-kappa-solution-structure&quot;,&quot;title&quot;:&quot;Structure of compact kappa-solutions&quot;,&quot;display_title&quot;:&quot;Theorem 3.15: Structure of compact kappa-solutions&quot;,&quot;body&quot;:&quot;For every sufficiently small $\\epsilon&gt;0$ there is\n$C_1=C_1(\\epsilon)&lt;\\infty$ such that a compact three-dimensional\n$\\kappa$-solution is round, is a positively curved $C_1$-component, or is\nthe union of two disjoint $(C_1,\\epsilon)$-cap cores joined by a strong\n$\\epsilon$-tube.  In the nonround cases its time-zero slice is\ndiffeomorphic to $S^3$ or $\\mathbb{RP}^3$.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solution Geometry and Stability&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:115,&quot;ref&quot;:&quot;MT:ch9:9.89,MT:ch9:9.90,MT:ch9:9.91&quot;},{&quot;id&quot;:&quot;c41e0879d383&quot;,&quot;label&quot;:&quot;thm:kappa-solution-structure-summary&quot;,&quot;title&quot;:&quot;Uniform structure of kappa-solutions&quot;,&quot;display_title&quot;:&quot;Theorem 3.16: Uniform structure of kappa-solutions&quot;,&quot;body&quot;:&quot;For every sufficiently small $\\epsilon&gt;0$ there is\n$C=C(\\epsilon)&lt;\\infty$ such that every three-dimensional\n$\\kappa$-solution is exactly one of the following seven source alternatives.\nFor the compact nonround branches, put\n$R_{\\max}=\\max_{M}R(\\cdot,0)$ and fix the diameter threshold\n$D_*=D_*(\\epsilon)$ supplied by the large-diameter structure theorem.  The\nround branch is disjoint from the nonround branches, and the two compact\nnonround branches are separated by this threshold:\n\\begin{enumerate}\n\\item the flow is round for all $t\\le0$, and its time-zero slice is\n      $S^3/\\Gamma$ for a finite subgroup $\\Gamma&lt;SO(4)$ acting freely;\n\\item (nonround) the time-zero slice is compact and positively curved, has\n      $\\operatorname{diam}M\\le D_*R_{\\max}^{-1/2}$ and\n      $C^{-1}R(x,0)^{-1/2}&lt;\\operatorname{diam}M&lt;C R(x,0)^{-1/2}$,\n      $C^{-1}R(x,0)^{-3/2}&lt;\\operatorname{Vol}M&lt;C R(x,0)^{-3/2}$,\n      and $C^{-1}R(x,0)&lt;K(P_y)&lt;C R(x,0)$ for every $y$ and $2$-plane\n      $P_y$; it is diffeomorphic to $S^3$ or $\\mathbb{RP}^3$;\n\\item (nonround) the time-zero slice is positively curved and is a double\n      $C$-capped strong $\\epsilon$-tube with\n      $\\operatorname{diam}M&gt;D_*R_{\\max}^{-1/2}$, hence is diffeomorphic to\n      $S^3$ or $\\mathbb{RP}^3$;\n\\item (nonround) the time-zero slice is positively curved and is a $C$-capped strong\n      $\\epsilon$-tube diffeomorphic to $\\mathbb R^3$;\n\\item the time-zero slice is the quotient of a round $S^2\\times\\mathbb R$\n      by a free orientation-preserving involution, is a $C$-capped strong\n      $\\epsilon$-tube, and is diffeomorphic to a punctured $\\mathbb{RP}^3$;\n\\item the time-zero slice is the product of a round $S^2$ and $\\mathbb R$\n      and is a strong $\\epsilon$-tube;\n\\item the time-zero slice is the product $\\mathbb{RP}^2\\times\\mathbb R$\n      with the constant-curvature metric on $\\mathbb{RP}^2$.\n\\end{enumerate}\nIn alternatives (3)--(5), points are in cap cores or are centers of strong\n$\\epsilon$-necks; in alternatives (1), (2), and (7) the source gives the\ncorresponding whole-component description.  Uniformly on the flow,\n\\[\n \\sup_{p\\in M,\\,t\\le0}\\frac{|\\nabla R(p,t)|}{R(p,t)^{3/2}}\\le C,\n \\qquad\n  \\sup_{p\\in M,\\,t\\le0}\\frac{|\\partial_tR(p,t)|}{R(p,t)^2}\\le C.\n\\]&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solution Geometry and Stability&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:116,&quot;ref&quot;:&quot;MT:ch9:9.93&quot;}]},{&quot;id&quot;:&quot;canonical-neighborhood-models&quot;,&quot;title&quot;:&quot;Canonical Neighborhood Models&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;3b2c67594e86&quot;,&quot;label&quot;:&quot;thm:kappa-solution-canonical-neighborhoods&quot;,&quot;title&quot;:&quot;Canonical neighborhoods in kappa-solutions&quot;,&quot;display_title&quot;:&quot;Theorem 3.17: Canonical neighborhoods in kappa-solutions&quot;,&quot;body&quot;:&quot;For every sufficiently small $\\epsilon&gt;0$ there is\n$C=C(\\epsilon)&lt;\\infty$ such that every point of every three-dimensional\n$\\kappa$-solution has a strong $(C,\\epsilon)$-canonical neighborhood,\nunless the solution is the round product $\\mathbb{RP}^2\\times\\mathbb R$.\nMoreover, if generalized flows with no embedded two-sided\n$\\mathbb{RP}^2$ converge smoothly to a $\\kappa$-solution, then their\nbasepoints have strong $(C,\\epsilon)$-canonical neighborhoods for all\nsufficiently large indices.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Canonical Neighborhood Models&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:117,&quot;ref&quot;:&quot;MT:ch9:9.94,MT:ch9:9.95&quot;},{&quot;id&quot;:&quot;0c66e31f8cb6&quot;,&quot;label&quot;:&quot;thm:standard-solution-canonical-neighborhoods&quot;,&quot;title&quot;:&quot;Canonical neighborhoods in the standard solution&quot;,&quot;display_title&quot;:&quot;Theorem 3.18: Canonical neighborhoods in the standard solution&quot;,&quot;body&quot;:&quot;For every sufficiently small $\\epsilon&gt;0$ there is\n$C_{\\mathrm{std}}(\\epsilon)&lt;\\infty$ such that every point $(q,t)$ of the\nstandard solution has one of the following neighborhoods:\n\\begin{enumerate}\n\\item a $(C_{\\mathrm{std}},\\epsilon)$-cap whose core contains $q$;\n\\item an evolving $\\epsilon$-neck reaching time zero, with its initial slice\n      disjoint from the cap core;\n\\item an evolving $\\epsilon$-neck defined for normalized backward time\n      $1+\\epsilon$.\n\\end{enumerate}\nThe alternatives persist for flows converging smoothly to the standard\nsolution on the corresponding parabolic neighborhoods.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Canonical Neighborhood Models&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:118,&quot;ref&quot;:&quot;MT:ch12:12.28,MT:ch12:12.32,MT:ch12:12.36&quot;}]},{&quot;id&quot;:&quot;first-failure-extension&quot;,&quot;title&quot;:&quot;First-Failure Extension&quot
