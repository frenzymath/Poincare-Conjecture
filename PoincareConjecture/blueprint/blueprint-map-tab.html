0$.  If in addition\n$\\pi_3(X(t))\\cong\\mathbb Z$, then $\\pi_3(Y)\\cong\\mathbb Z$ and $(F_t)_*$ is\nmultiplication by a nonzero integer; in particular it is injective.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Two-Sphere Width Control&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:186,&quot;ref&quot;:&quot;MT:ch18:18.18,MT:ch18:18.22,MT:ch15:15.12&quot;},{&quot;id&quot;:&quot;637f01ebdc91&quot;,&quot;label&quot;:&quot;lem:two-sphere-width-surgery-control&quot;,&quot;title&quot;:&quot;Two-sphere width across a trivial surgery&quot;,&quot;display_title&quot;:&quot;Lemma 5.9: Two-sphere width across a trivial surgery&quot;,&quot;body&quot;:&quot;Let $T$ be a surgery time after which the surgery spheres in a continuing\ncomponent are null-homotopic (and hence separating by\n\\ref{lem:nullhomotopic-embedded-sphere-separates}), and suppose the selected\npostsurgery component\nhas nonzero $\\pi_2$.  Then\n\\[\n W_2(T)\\le\\liminf_{t\\uparrow T}W_2(t).\n\\]&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Two-Sphere Width Control&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:187,&quot;ref&quot;:&quot;MT:ch18:18.11,MT:ch15:15.12&quot;},{&quot;id&quot;:&quot;0a5091c62134&quot;,&quot;label&quot;:&quot;lem:two-sphere-width-forward-inequality&quot;,&quot;title&quot;:&quot;Forward inequality for the two-sphere width&quot;,&quot;display_title&quot;:&quot;Lemma 5.10: Forward inequality for the two-sphere width&quot;,&quot;body&quot;:&quot;Along a component path with nonzero $\\pi_2$, after all essential sphere\nsurgeries have ceased, $W_2$ is continuous at regular times, satisfies\n\\[\n D^+W_2(t)\\le-4\\pi-\\frac12R_{\\min}(t)W_2(t)\n\\]\nthere, and obeys the left lower-semicontinuity inequality of\n\\ref{lem:two-sphere-width-surgery-control} at every surgery time.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Two-Sphere Width Control&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:188,&quot;ref&quot;:&quot;MT:ch18:18.11&quot;},{&quot;id&quot;:&quot;ee648cd5d9b1&quot;,&quot;label&quot;:&quot;lem:essential-sphere-family-finiteness&quot;,&quot;title&quot;:&quot;Finite bound for essential sphere families&quot;,&quot;display_title&quot;:&quot;Lemma 5.11: Finite bound for essential sphere families&quot;,&quot;body&quot;:&quot;For every compact (possibly disconnected) $3$-manifold $X$ there is an\ninteger $N(X)$ such that every disjoint family of embedded $2$-spheres in\n$X$ whose members are individually non-null-homotopic and pairwise\nnon-homotopic has at most $N(X)$ members.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Two-Sphere Width Control&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:189,&quot;ref&quot;:&quot;MT:ch18:18.8&quot;},{&quot;id&quot;:&quot;fa9220655baf&quot;,&quot;label&quot;:&quot;def:essential-sphere-family-complexity&quot;,&quot;title&quot;:&quot;Essential sphere family and surgery complexity&quot;,&quot;display_title&quot;:&quot;Definition 5.12: Essential sphere family and surgery complexity&quot;,&quot;body&quot;:&quot;For a compact three-manifold $X$, an essential sphere family is a finite\ndisjoint family $F$ of embedded two-spheres such that each member is not\nnull-homotopic in $X$ and no two distinct members are homotopic in $X$.\nWrite\n\\[\n s(X)=\\max\\{\\#F:F\\text{ is an essential sphere family in }X\\}.\n\\]\nThe finiteness of this maximum is supplied by\n\\ref{lem:essential-sphere-family-finiteness}.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Two-Sphere Width Control&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:190,&quot;ref&quot;:&quot;MT:ch18:18.8&quot;},{&quot;id&quot;:&quot;ae381b6948fa&quot;,&quot;label&quot;:&quot;lem:essential-family-survives-essential-surgery&quot;,&quot;title&quot;:&quot;Essential families survive an essential sphere surgery&quot;,&quot;display_title&quot;:&quot;Lemma 5.13: Essential families survive an essential sphere surgery&quot;,&quot;body&quot;:&quot;Let $M^-$ be a compact $3$-manifold and let $S_0\\subset M^-$ be an embedded\nhomotopically essential $2$-sphere.  Let $M^+$ be obtained by the standard\nsurgery on $S_0$, with its two $3$-ball caps, and let\n$F^+$ be an essential sphere family in $M^+$ disjoint from the cap balls.\nAfter pushing $F^+$ off the caps and identifying the complement with the\npresurgery complement, the family\n$F^-:=F^+\\cup\\{S_0\\}$ is essential in $M^-$.\nConsequently $s(M^-)&gt;s(M^+)$.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Two-Sphere Width Control&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:191,&quot;ref&quot;:&quot;MT:ch18:18.8&quot;},{&quot;id&quot;:&quot;6364ac4cf64c&quot;,&quot;label&quot;:&quot;thm:finite-essential-sphere-surgeries&quot;,&quot;title&quot;:&quot;Finiteness of essential sphere surgeries&quot;,&quot;display_title&quot;:&quot;Theorem 5.14: Finiteness of essential sphere surgeries&quot;,&quot;body&quot;:&quot;In a controlled Ricci flow with surgery, only finitely many\nsurgery times use a sphere which is non-null-homotopic in its presurgery\ncomponent.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Two-Sphere Width Control&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:192,&quot;ref&quot;:&quot;MT:ch18:18.8&quot;}]},{&quot;id&quot;:&quot;eventual-vanishing-of-2&quot;,&quot;title&quot;:&quot;Eventual Vanishing of _2&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;c498839d073a&quot;,&quot;label&quot;:&quot;lem:extinction-scalar-curvature-lower-bound&quot;,&quot;title&quot;:&quot;Scalar-curvature lower bound&quot;,&quot;display_title&quot;:&quot;Lemma 5.15: Scalar-curvature lower bound&quot;,&quot;body&quot;:&quot;For the normalized all-time controlled surgery flow, including the\npostsurgery time slices,\n\\[\n R_{\\min}(t)\\ge-\\frac6{1+4t}.\n\\]&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Eventual Vanishing of _2&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:193,&quot;ref&quot;:&quot;MT:ch18:18.1,MT:ch15:15.9&quot;},{&quot;id&quot;:&quot;a8a4aa399c74&quot;,&quot;label&quot;:&quot;thm:noncompact-two-connected-cover-contractible&quot;,&quot;title&quot;:&quot;Noncompact two-connected covers are contractible&quot;,&quot;display_title&quot;:&quot;Theorem 5.16: Noncompact two-connected covers are contractible&quot;,&quot;body&quot;:&quot;Let $X$ be a connected three-manifold with $\\pi_2(X)=0$.  If its universal\ncover $\\widetilde X$ is noncompact, then $\\widetilde X$ is contractible.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Eventual Vanishing of _2&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:194,&quot;ref&quot;:&quot;MT:ch18:18.9&quot;},{&quot;id&quot;:&quot;0071c4676014&quot;,&quot;label&quot;:&quot;thm:eventual-pi2-vanishing&quot;,&quot;title&quot;:&quot;Eventual vanishing of _2&quot;,&quot;display_title&quot;:&quot;Theorem 5.17: Eventual vanishing of _2&quot;,&quot;body&quot;:&quot;For an all-time controlled surgery flow there is $T_1&lt;\\infty$ such that every\ncomponent of every time slice $M_T$, $T\\ge T_1$, has trivial $\\pi_2$.  Any\nsuch component with infinite fundamental group has contractible universal\ncover.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Eventual Vanishing of _2&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:195,&quot;ref&quot;:&quot;MT:ch18:18.9&quot;}]},{&quot;id&quot;:&quot;late-component-3-topology&quot;,&quot;title&quot;:&quot;Late-Component _3 Topology&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;5d7655e57ef8&quot;,&quot;label&quot;:&quot;lem:finitely-generated-kurosh-free-factor&quot;,&quot;title&quot;:&quot;Imported finitely generated Kurosh factor contract&quot;,&quot;display_title&quot;:&quot;Lemma 5.18: Imported finitely generated Kurosh factor contract&quot;,&quot;body&quot;:&quot;Let\n$G=G_1*\\cdots*G_m*F_r$, with the $G_i$ finite, and let $H$ be a finitely\ngenerated free factor of $G$.  Then $H$ is a free product of finitely many\nfinite groups and a finitely generated free group.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Late-Component _3 Topology&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:196,&quot;ref&quot;:&quot;MT:ch18:18.19&quot;},{&quot;id&quot;:&quot;5f0941d364d0&quot;,&quot;label&quot;:&quot;thm:component-fundamental-group-persistence&quot;,&quot;title&quot;:&quot;Persistence of the fundamental-group class&quot;,&quot;display_title&quot;:&quot;Theorem 5.19: Persistence of the fundamental-group class&quot;,&quot;body&quot;:&quot;Let $[0,T]$ be a bounded interval containing only finitely many surgery times.\nSuppose the fundamental group of every initial component of a controlled\nsurgery flow is a free product of finitely many finite groups and infinite\ncyclic groups.  Then the same is true for every component of every time slice\nup to $T$.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Late-Component _3 Topology&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:197,&quot;ref&quot;:&quot;MT:ch18:18.19,MT:ch15:15.3&quot;},{&quot;id&quot;:&quot;91578b8d4302&quot;,&quot;label&quot;:&quot;lem:hempel-essential-sphere-input&quot;,&quot;title&quot;:&quot;Hempel essential-sphere input&quot;,&quot;display_title&quot;:&quot;Lemma 5.20: Hempel essential-sphere input&quot;,&quot;body&quot;:&quot;Let $X$ be a compact connected boundaryless $3$-manifold.  If\n$\\pi_1(X)$ is a nontrivial free product, or if $\\pi_1(X)\\cong\\mathbb Z$, then\n$X$ contains an embedded $2$-sphere which is not null-homotopic.  In\nparticular, $\\pi_2(X)\\ne0$.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Late-Component _3 Topology&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:198,&quot;ref&quot;:&quot;MT:ch18:18.20&quot;},{&quot;id&quot;:&quot;db2a61f4d32e&quot;,&quot;label&quot;:&quot;thm:free-product-pi2-obstruction&quot;,&quot;title&quot;:&quot;Imported Morgan--Tian/Hempel free-product obstruction to vanishing _2&quot;,&quot;display_title&quot;:&quot;Theorem 5.21: Imported Morgan--Tian/Hempel free-product obstruction to vanishing _2&quot;,&quot;body&quot;:&quot;If $X$ is a closed connected three-manifold with $\\pi_1(X)$ a nontrivial\nfree product or $\\pi_1(X)\\cong\\mathbb Z$, then $\\pi_2(X)\\ne0$.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Late-Component _3 Topology&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:199,&quot;ref&quot;:&quot;MT:ch18:18.20&quot;},{&quot;id&quot;:&quot;15ee9318bfae&quot;,&quot;label&quot;:&quot;thm:finite-cover-homotopy-three-sphere&quot;,&quot;title&quot;:&quot;Finite fundamental group and the universal cover&quot;,&quot;display_title&quot;:&quot;Theorem 5.22: Finite fundamental group and the universal cover&quot;,&quot;body&quot;:&quot;Let $X$ be a closed connected three-manifold with finite fundamental group\nand $\\pi_2(X)=0$.  Its universal cover $\\widetilde X$ is a homotopy\nthree-sphere, and covering projection induces\n\\[\n \\pi_3(\\widetilde X)\\cong\\pi_3(X)\\cong\\mathbb Z.\n\\]&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Late-Component _3 Topology&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:200,&quot;ref&quot;:&quot;MT:ch18:18.19&quot;},{&quot;id&quot;:&quot;6b365de62a4e&quot;,&quot;label&quot;:&quot;thm:late-component-nontrivial-pi3&quot;,&quot;title&quot;:&quot;Nonzero _3 on a late surviving component&quot;,&quot;display_title&quot;:&quot;Theorem 5.23: Nonzero _3 on a late surviving component&quot;,&quot;body&quot;:&quot;Let $T_1$ be as in \\ref{thm:eventual-pi2-vanishing}, and assume the initial\nfundamental groups are free products of finite groups and infinite cyclic\ngroups.  If $\\mathcal X$ is a component path defined on $[T_1,T_2]$, then\n\\[\n \\pi_3(\\mathcal X(T_1))\\cong\\mathbb Z.\n\\]\nIn particular it contains a nonzero class.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Late-Component _3 Topology&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:201,&quot;ref&quot;:&quot;MT:ch18:18.19&quot;}]},{&quot;id&quot;:&quot;the-loop-space-width-interface&quot;,&quot;title&quot;:&quot;The Loop-Space Width Interface&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;3a6bc0d9a9d7&quot;,&quot;label&quot;:&quot;lem:loop-space-quotient-wedge&quot;,&quot;title&quot;:&quot;The quotient and wedge model&quot;,&quot;display_title&quot;:&quot;Lemma 5.24: The quotient and wedge model&quot;,&quot;body&quot;:&quot;For $c_0\\in S^2$, the quotient\n\\[\n Q=(S^2\\times S^1)/(\\{c_0\\}\\times S^1)\n\\]\nis homotopy equivalent to $S^2\\vee S^3$.  Consequently, for every based\nspace $X$ of CW type,\n\\[\n [Q,X]_*\\cong\\pi_2(X)\\times\\pi_3(X).\n\\]&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;The Loop-Space Width Interface&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:202,&quot;ref&quot;:&quot;MT:ch18:18.16&quot;},{&quot;id&quot;:&quot;6bad96de75b2&quot;,&quot;label&quot;:&quot;lem:loop-space-universal-cover-lift&quot;,&quot;title&quot;:&quot;Lifting null-loop families&quot;,&quot;display_title&quot;:&quot;Lemma 5.25: Lifting null-loop families&quot;,&quot;body&quot;:&quot;Let $p\\colon\\widetilde X\\to X$ be the universal cover of a connected\nmanifold.  A continuous family $\\Gamma\\colon S^2\\to\\Lambda_0X$ lifts, after\nchoosing one lift of one marked point, to a continuous family of loops in\n$\\widetilde X$.  Homotopies lift in the same way, and changing the initial\nlift acts by one deck transformation on the entire lifted family.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;The Loop-Space Width Interface&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:203,&quot;ref&quot;:&quot;MT:ch18:18.16&quot;},{&quot;id&quot;:&quot;88699ab8e34d&quot;,&quot;label&quot;:&quot;thm:loop-space-pi3-identification&quot;,&quot;title&quot;:&quot;Free-loop-space identification of _3&quot;,&quot;display_title&quot;:&quot;Theorem 5.26: Free-loop-space identification of _3&quot;,&quot;body&quot;:&quot;If $X$ is compact, connected, and $\\pi_2(X,x_0)=0$, then adjunction induces\nan isomorphism\n\\[\n \\pi_2(\\Lambda_0X,*)\\cong\\pi_3(X,x_0).\n\\]\nFree homotopy classes of not necessarily based maps\n$S^2\\to\\Lambda_0X$ correspond to the orbit set of $\\pi_3(X,x_0)$ under its\nnatural $\\pi_1(X,x_0)$-action.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;The Loop-Space Width Interface&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:204,&quot;ref&quot;:&quot;MT:ch18:18.16&quot;},{&quot;id&quot;:&quot;6ead31810534&quot;,&quot;label&quot;:&quot;def:loop-family-width&quot;,&quot;title&quot;:&quot;Loop-family width&quot;,&quot;display_title&quot;:&quot;Definition 5.27: Loop-family width&quot;,&quot;body&quot;:&quot;For a null-homotopic $C^1$ loop $\\gamma$ in a compact Riemannian manifold,\nlet\n\\[\n \\mathcal A_g(\\gamma)=\\inf_F\\operatorname{Area}_g(F),\n\\]\nwhere $F\\colon D^2\\to X$ ranges over Lipschitz maps whose boundary agrees\nwith $\\gamma$ up to orientation-preserving reparameterization.  For a\ncontinuous family $\\Gamma\\colon S^2\\to\\Lambda_0X$, put\n\\[\n W_g(\\Gamma)=\\sup_{c\\in S^2}\\mathcal A_g(\\Gamma(c)).\n\\]\nIf $\\xi\\in\\pi_3(X)$, let $[\\xi]$ be its $\\pi_1(X)$-orbit.  By\n\\ref{thm:loop-space-pi3-identification}, this orbit corresponds to a free\nhomotopy class of loop families.  Define\n\\[\n W_g(\\xi)=\\inf_{[\\Gamma]=[\\xi]}W_g(\\Gamma),\n\\]\nwhere representatives need not preserve the base point.  Thus $W_g$ is\nconstant on every $\\pi_1(X)$-orbit.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;The Loop-Space Width Interface&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:205,&quot;ref&quot;:&quot;MT:ch18:18.17&quot;},{&quot;id&quot;:&quot;67b3fec08fc1&quot;,&quot;label&quot;:&quot;lem:least-spanning-area-continuity&quot;,&quot;title&quot;:&quot;Continuity of least spanning area&quot;,&quot;display_title&quot;:&quot;Lemma 5.28: Continuity of least spanning area&quot;,&quot;body&quot;:&quot;The function $\\gamma\\mapsto\\mathcal A_g(\\gamma)$ is finite and continuous\non $\\Lambda_0X$ in the $C^1$ topology.  More precisely, two sufficiently\n$C^1$-close loops cobound a Lipschitz annulus whose area tends to zero with\ntheir $C^1$ distance, and\n\\[\n |\\mathcal A_g(\\gamma_0)-\\mathcal A_g(\\gamma_1)|\n \\le\\inf\\{\\operatorname{Area}_g(A):\\partial A=\\gamma_0\\sqcup\\gamma_1\\}.\n\\]&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;The Loop-Space Width Interface&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:206,&quot;ref&quot;:&quot;MT:ch18:18.17&quot;}]},{&quot;id&quot;:&quot;the-width-comparison-ode&quot;,&quot;title&quot;:&quot;The Width Comparison ODE&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;e57b0a4ff9d7&quot;,&quot;label&quot;:&quot;def:loop-width-comparison-ode&quot;,&quot;title&quot;:&quot;Comparison equation&quot;,&quot;display_title&quot;:&quot;Definition 5.29: Comparison equation&quot;,&quot;body&quot;:&quot;For a compact Ricci flow $(M,g(t))$, $t\\in[t_0,t_1]$, and\n$t&#x27;\\in[t_0,t_1]$, let $w_{a,t&#x27;}$ be the solution of\n\\[\n w&#x27;=-2\\pi-\\frac12R_{\\min}(t)w,\n \\qquad w(t&#x27;)=a.\n\\]\nWrite $w_a=w_{a,t_0}$.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;The Width Comparison ODE&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:207,&quot;ref&quot;:&quot;MT:ch18:18.23&quot;},{&quot;id&quot;:&quot;c62f7c1e78a3&quot;,&quot;label&quot;:&quot;lem:loop-width-ode-formula&quot;,&quot;title&quot;:&quot;Integrating-factor formula&quot;,&quot;display_title&quot;:&quot;Lemma 5.30: Integrating-factor formula&quot;,&quot;body&quot;:&quot;Put\n\\[\n B_{t&#x27;}(t)=\\int_{t&#x27;}^t\\frac12R_{\\min}(s)\\,ds.\n\\]\nThen, for $t&#x27;&#x27;\\ge t&#x27;$,\n\\[\n w_{a,t&#x27;}(t&#x27;&#x27;)=e^{-B_{t&#x27;}(t&#x27;&#x27;)}\n \\left(a-2\\pi\\int_{t&#x27;}^{t&#x27;&#x27;}e^{B_{t&#x27;}(s)}\\,ds\\right).\n\\]\nIf $a&#x27;\\ge a$, then\n\\[\n w_{a&#x27;,t&#x27;}(t&#x27;&#x27;)-w_{a,t&#x27;}(t&#x27;&#x27;)\n =(a&#x27;-a)e^{-B_{t&#x27;}(t&#x27;&#x27;)}\\ge0.\n\\]\nOn a fixed compact time interval this difference is bounded by a constant\ntimes $a&#x27;-a$.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;The Width Comparison ODE&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:208,&quot;ref&quot;:&quot;MT:ch18:18.25,MT:ch18:18.26&quot;}]},{&quot;id&quot;:&quot;controlled-loop-family-deformation&quot;,&quot;title&quot;:&quot;Controlled Loop-Family Deformation&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;7aa2ff4580d0&quot;,&quot;label&quot;:&quot;thm:plateau-disk-existence-regularity&quot;,&quot;title&quot;:&quot;Plateau disk existence and boundary regularity&quot;,&quot;display_title&quot;:&quot;Theorem 5.31: Plateau disk existence and boundary regularity&quot;,&quot;body&quot;:&quot;Let $(N,g)$ be a compact real-analytic Riemannian three-manifold and let\n$\\gamma\\colon S^1\\to N$ be an embedded real-analytic null-homotopic curve.\nThe infimum of the areas of $W^{1,2}$ disk maps whose boundary trace is\n$\\gamma$ (up to an orientation-preserving weakly monotone\nreparameterization) is attained by a conformal harmonic Douglas disk.  Its\ninterior branch set is finite, it is real analytic up to the boundary, and it\nhas no true boundary branch point.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Controlled Loop-Family Deformation&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:209,&quot;ref&quot;:&quot;MT:ch19:19.2&quot;},{&quot;id&quot;:&quot;2afafee3686f&quot;,&quot;label&quot;:&quot;lem:least-disk-area-continuity-under-isotopy&quot;,&quot;title&quot;:&quot;Least-disk area is continuous under a boundary isotopy&quot;,&quot;display_title&quot;:&quot;Lemma 5.32: Least-disk area is continuous under a boundary isotopy&quot;,&quot;body&quot;:&quot;Let $(N,g)$ be compact and let\n$\\Gamma\\colon S^1\\times[0,1]\\to N$ be a $C^2$ isotopy such that every\n$\\Gamma_s$ is an embedded null-homotopic curve.  If\n$\\mathcal A_g(\\Gamma_s)$ denotes the least spanning-disk area, then\n$s\\mapsto\\mathcal A_g(\\Gamma_s)$ is continuous.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Controlled Loop-Family Deformation&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:210,&quot;ref&quot;:&quot;MT:ch19:19.4&quot;},{&quot;id&quot;:&quot;2e150f9c057c&quot;,&quot;label&quot;:&quot;lem:immersed-loop-embedded-approximation&quot;,&quot;title&quot;:&quot;Single immersed loop approximation by embedded boundaries&quot;,&quot;display_title&quot;:&quot;Lemma 5.33: Single immersed loop approximation by embedded boundaries&quot;,&quot;body&quot;:&quot;Let $\\gamma\\colon S^1\\to N$ be a $C^2$ immersed null-homotopic loop in a\nsmooth three-manifold.  For every $\\varepsilon&gt;0$ there is an embedded $C^2$\nnull-homotopic loop $\\gamma_\\varepsilon$, $C^2$-close to $\\gamma$, and a\nthin collar homotopy between them such that\n\\[\n \\bigl|\\mathcal A_g(\\gamma_\\varepsilon)-\\mathcal A_g(\\gamma)\\bigr|&lt;\\varepsilon.\n\\]\nThe assertion is for each loop (or each member of a finite net), not a claim\nthat an arbitrary positive-dimensional family can be made simultaneously\nembedded.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Controlled Loop-Family Deformation&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:211,&quot;ref&quot;:&quot;MT:ch19:19.4&quot;},{&quot;id&quot;:&quot;26553450f2f2&quot;,&quot;label&quot;:&quot;lem:plateau-disk-moving-boundary-contract&quot;,&quot;title&quot;:&quot;Plateau disk and moving-boundary contract&quot;,&quot;display_title&quot;:&quot;Lemma 5.34: Plateau disk and moving-boundary contract&quot;,&quot;body&quot;:&quot;The three preceding contracts together provide exactly the disk existence,\nboundary regularity, isotopy continuity, and single-loop immersed-boundary\napproximation used by the least-area variation theorem.  No annular\nattainment or simultaneous family-embedding conclusion is included.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Controlled Loop-Family Deformation&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:212,&quot;ref&quot;:&quot;MT:ch19:19.2,MT:ch19:19.4&quot;},{&quot;id&quot;:&quot;46001210b234&quot;,&quot;label&quot;:&quot;thm:least-disk-area-variation-interface&quot;,&quot;title&quot;:&quot;Least-disk variation interface&quot;,&quot;display_title&quot;:&quot;Theorem 5.35: Least-disk variation interface&quot;,&quot;body&quot;:&quot;Let $(M,g(t))$, $t_0\\le t\\le t_1$, be a Ricci flow on a compact\nthree-manifold, and let $\\gamma(t)$ be a $C^2$ curve-shrinking flow of\nnull-homotopic immersed loops.  Then $t\\mapsto\\mathcal A_{g(t)}(\\gamma(t))$\nis continuous and, at every time at which the flow is smooth,\n\\[\n D^+\\mathcal A_{g(t)}(\\gamma(t))\n \\le-2\\pi-\\frac12R_{\\min}(t)\n \\mathcal A_{g(t)}(\\gamma(t)).\n\\]&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Controlled Loop-Family Deformation&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:213,&quot;ref&quot;:&quot;MT:ch19:19.2,MT:ch19:19.4&quot;},{&quot;id&quot;:&quot;389a14ec18f3&quot;,&quot;label&quot;:&quot;def:nondegenerate-douglas-annulus-class&quot;,&quot;title&quot;:&quot;Nondegenerate Douglas annulus class&quot;,&quot;display_title&quot;:&quot;Definition 5.36: Nondegenerate Douglas annulus class&quot;,&quot;body&quot;:&quot;Let $(M,h)$ be a compact real-analytic Riemannian three-manifold, put\n$\\bar h=h+ds^2$ on $M\\times S^1_\\lambda$, and let\n$c_0,c_1\\colon S^1\\to M\\times S^1_\\lambda$ be disjoint embedded\nreal-analytic degree-one ramps in one free homotopy class.  For $\\rho&gt;0$,\nwrite $\\mathscr A_\\rho(c_0,c_1)$ for the class of $W^{1,2}$ maps $F$ from a\ncompact annulus whose boundary traces are $c_0,c_1$ up to\norientation-preserving weakly monotone reparameterizations and such that\nevery essential simple closed curve $\\alpha$ in the domain satisfies\n\\[\n L_{\\bar h}(F\\circ\\alpha)\\ge\\rho.\n\\]\nArea is counted with multiplicity.  The class is called nondegenerate when it\nis nonempty.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Controlled Loop-Family Deformation&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:214,&quot;ref&quot;:&quot;MT:ch19:19.15&quot;},{&quot;id&quot;:&quot;2e2a150f9e0c&quot;,&quot;label&quot;:&quot;thm:annular-douglas-minimizer&quot;,&quot;title&quot;:&quot;Douglas attainment and regularity for a nondegenerate annulus&quot;,&quot;display_title&quot;:&quot;Theorem 5.37: Douglas attainment and regularity for a nondegenerate annulus&quot;,&quot;body&quot;:&quot;Let $\\rho&gt;0$ and assume that the class\n$\\mathscr A_\\rho(c_0,c_1)$ of\n\\ref{def:nondegenerate-douglas-annulus-class} is nonempty.  Then its annular\narea infimum is attained by a classical conformal harmonic annulus $A$.  Its\ninterior branch set is finite, it is real analytic up to its real-analytic\nboundary, and it has no true boundary branch point.  False boundary branch\npoints are not excluded.  There are interior parallel boundary curves\navoiding the finite branch set which converge to the original boundary and\nwhose intervening collar areas tend to zero.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Controlled Loop-Family Deformation&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:215,&quot;ref&quot;:&quot;MT:ch19:19.15, white-classical-area-minimizing-surfaces:page-0001, white-classical-area-minimizing-surfaces:page-0002&quot;},{&quot;id&quot;:&quot;f538fa47d10b&quot;,&quot;label&quot;:&quot;lem:ramp-annulus-nondegeneration&quot;,&quot;title&quot;:&quot;Ramp nondegeneration&quot;,&quot;display_title&quot;:&quot;Lemma 5.38: Ramp nondegeneration&quot;,&quot;body&quot;:&quot;Let $(M,h)$ be a compact Riemannian three-manifold and equip\n$M\\times S^1_\\lambda$ with the product metric $\\bar h=h+ds^2$.  Let\n$c_0,c_1\\colon S^1\\to M\\times S^1_\\lambda$ be degree-one ramps in the\nsame free homotopy class, and let\n$F\\colon S^1\\times[0,1]\\to M\\times S^1_\\lambda$ span them.  For every\nessential simple closed domain curve $\\alpha$,\n\\[\n L_{\\bar h}(F\\circ\\alpha)\\ge L_{ds^2}(S^1_\\lambda)&gt;0.\n\\]\nThe same bound holds while both curves evolve by smooth curve shrinking.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Controlled Loop-Family Deformation&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:216,&quot;ref&quot;:&quot;MT:ch19:19.15&quot;},{&quot;id&quot;:&quot;d6656f8614ed&quot;,&quot;label&quot;:&quot;lem:smooth-annular-minimizer-bridge&quot;,&quot;title&quot;:&quot;Smooth-flow bridge to the annular minimizer contract&quot;,&quot;display_title&quot;:&quot;Lemma 5.39: Smooth-flow bridge to the annular minimizer contract&quot;,&quot;body&quot;:&quot;Let $(M,g(t))$, $t_0\\le t\\le t_1$, be a smooth Ricci flow on a compact\nthree-manifold, and let $c_0(t),c_1(t)$ be smooth degree-one ramp\ncurve-shrinking flows in $M\\times S^1_\\lambda$ in one free homotopy class.\nAt each $t&gt;t_0$ the metric and the two evolved curves are real analytic, the\nannular nondegeneration bound of\n\\ref{lem:ramp-annulus-nondegeneration} holds.  The preceding theorem then\nproduces a classical Douglas solution with the stated finite branch set and\ncollar exhaustion.  The same assertion at $t=t_0$ and all right-hand\nvariation statements are understood as limits of real-analytic approximants\nto the initial metric and curves.\nAfter the false boundary branches are reparameterized, the pullback metric is\nregularized near its finitely many interior branch points: for every prescribed\narea tolerance it is replaced by a smooth metric with at most twice the\nannulus area and with a finite ambient-dependent upper Gaussian-curvature\nbound.  This regularization is part of the annular comparison contract.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Controlled Loop-Family Deformation&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:217,&quot;ref&quot;:&quot;MT:ch19:19.15&quot;},{&quot;id&quot;:&quot;204f4bfc322e&quot;,&quot;label&quot;:&quot;def:finite-small-annulus-net&quot;,&quot;title&quot;:&quot;Finite small-annulus net&quot;,&quot;display_title&quot;:&quot;Definition 5.40: Finite small-annulus net&quot;,&quot;body&quot;:&quot;Let $\\Gamma\\colon S^2\\to\\Lambda M$ be a continuous $C^1$-loop family.  A\nfinite set ${\\mathcal S}\\subset S^2$ is a \\emph{$\\nu$-annular net} for\n$\\Gamma$ if, for every $c\\in S^2$, there are $\\widehat c\\in{\\mathcal S}$ and\nan admissible Lipschitz annulus from $\\Gamma(c)$ to $\\Gamma(\\widehat c)$ of\narea less than $\\nu$.  Admissible means that the two boundary traces agree\nwith the displayed loops up to orientation-preserving weakly monotone\nreparameterizations, as in the annular-area infimum.  The same terminology is\nused for a ramp family in $M\\times S^1_\\lambda$, with area measured in the\nproduct metric.  In the source the admissible annuli are the swept annuli\nassociated to oriented parameter arcs; this orientation clause is part of the\nnet contract.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Controlled Loop-Family Deformation&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:218,&quot;ref&quot;:&quot;MT:ch18:18.24&quot;},{&quot;id&quot;:&quot;1f83cab86451&quot;,&quot;label&quot;:&quot;lem:finite-net-ramp-nondegeneration&quot;,&quot;title&quot;:&quot;Finite annular nets and a common ramp scale&quot;,&quot;display_title&quot;:&quot;Lemma 5.41: Finite annular nets and a common ramp scale&quot;,&quot;body&quot;:&quot;Let $g(t)$, $t_0\\le t\\le t_1$, be a Ricci flow on a compact manifold, and let\n$\\widetilde\\Gamma\\colon S^2\\to\\Lambda_0M$ and\n$\\widetilde\\Gamma_c^\\lambda(t)$ be the approximation and ramp flows supplied\nby \\ref{thm:controlled-curve-shrinking-existence}.  For every $\\mu&gt;0$ there\nare a finite set ${\\mathcal S}\\subset S^2$ and $\\lambda_{\\rm net}&gt;0$ such\nthat ${\\mathcal S}$ is a $\\mu/2$-annular net for\n$\\widetilde\\Gamma$, and, for every\n$0&lt;\\lambda&lt;\\lambda_{\\rm net}$, it is a $\\mu$-annular net for the initial\nramp family $\\widetilde\\Gamma^\\lambda$.  Thus, for each $c$, one can choose\n$\\widehat c\\in{\\mathcal S}$ so that the initial annular-area infimum between\n$\\widetilde\\Gamma_c^\\lambda(t_0)$ and\n$\\widetilde\\Gamma_{\\widehat c}^\\lambda(t_0)$ is less than $\\mu$.\n\nAt every later time the two boundary curves are embedded degree-one ramps in\nthe same free homotopy class.  Consequently every essential simple closed\ncurve in every spanning annulus for the pair has length at least\n\\[\n \\rho_\\lambda=L(S^1_\\lambda)=\\lambda,\n\\]\nuniformly over $c$, the finite net, and $[t_0,t_1]$ for this fixed\n$\\lambda$.  Finally, after ${\\mathcal S}$ is chosen, any collection of\npositive pointwise thresholds $\\lambda_{\\widehat c}$,\n$\\widehat c\\in{\\mathcal S}$, admits one common scale\n\\[\n 0&lt;\\lambda&lt;\\min\\bigl\\{\\lambda_{\\rm net},\n     \\lambda_{\\widehat c}:\\widehat c\\in{\\mathcal S}\\bigr\\}.\n\\]\nNo lower bound for $\\rho_\\lambda$ uniform as $\\lambda\\downarrow0$ is\nasserted or needed.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Controlled Loop-Family Deformation&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:219,&quot;ref&quot;:&quot;MT:ch18:18.24,MT:ch19:19.15&quot;},{&quot;id&quot;:&quot;0aaa5cc6778f&quot;,&quot;label&quot;:&quot;lem:annular-approximation-comparison&quot;,&quot;title&quot;:&quot;Imported annular approximation and variation interface&quot;,&quot;display_title&quot;:&quot;Lemma 5.42: Imported annular approximation and variation interface&quot;,&quot;body&quot;:&quot;For a smooth pair of degree-one ramp flows in dimension at least three, the\npair can be approximated in $C^2$ by disjoint real-analytic pairs in the same\nfree homotopy class.  The two boundary pairs cobound thin annuli whose areas\ntend to zero, and the corresponding annular infima and forward difference\nquotients converge in both directions.  This is the source&#x27;s third-curve and\nanalytic-regularization interface.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Controlled Loop-Family Deformation&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:220,&quot;ref&quot;:&quot;MT:ch19:19.15&quot;},{&quot;id&quot;:&quot;9dff0d1643ad&quot;,&quot;label&quot;:&quot;lem:annular-area-infimum-variation&quot;,&quot;title&quot;:&quot;Variation of the annular area infimum&quot;,&quot;display_title&quot;:&quot;Lemma 5.43: Variation of the annular area infimum&quot;,&quot;body&quot;:&quot;Let $n=\\dim M\\ge3$, and let $c_0(t),c_1(t)$ be degree-one ramp\ncurve-shrinking flows in $(M,g(t))\\times S^1_\\lambda$ in the same free\nhomotopy class.  Assume at every time under consideration that the positive\nessential-loop lower bound of\n\\ref{lem:ramp-annulus-nondegeneration} holds.  The theorem\n\\ref{thm:annular-douglas-minimizer} then supplies the minimizing annulus.  If\n$\\mu(t)$ is the infimum of the areas of spanning annuli,\nthen $\\mu$ is continuous and\n\\[\n D^+\\mu(t)\\le(2n-1)\\max_M|\\operatorname{Rm}_{g(t)}|\\,\\mu(t).\n\\]\nConsequently $\\mu(t)\\le e^{C(t-s)}\\mu(s)$ on a compact time interval, with\n$C$ independent of $\\lambda$.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Controlled Loop-Family Deformation&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:221,&quot;ref&quot;:&quot;MT:ch19:19.15&quot;},{&quot;id&quot;:&quot;91c8a69f2407&quot;,&quot;label&quot;:&quot;thm:small-annulus-length-transfer&quot;,&quot;title&quot;:&quot;Imported small-annulus length transfer&quot;,&quot;display_title&quot;:&quot;Theorem 5.44: Imported small-annulus length transfer&quot;,&quot;body&quot;:&quot;There is $\\delta_0&gt;0$ with the following property.  For every $r&gt;0$ and every\nambient sectional-curvature upper bound $K$, there is $\\mu_0&gt;0$ such that if\ntwo ramps $\\gamma,\\widehat\\gamma$ in\n$M\\times S^1_\\lambda$ cobound an admissible annulus of area below $\\mu_0$, and\n\\[\n L(\\gamma)\\ge r,\n \\qquad\n \\int_I|\\mathbf k_\\gamma|\\,ds&lt;\\delta_0\n\\]\nfor every length-$r$ subarc $I\\subset\\gamma$, where\n$\\mathbf k_\\gamma$ is the ambient curvature vector of the unit-speed ramp\n$\\gamma$, then\n\\[\n L(\\widehat\\gamma)\\ge\\frac34L(\\gamma).\n\\]\nThe constants are uniform in $\\lambda$.  For each annular comparison to\nwhich this contract is applied, the spanning annulus is required to satisfy\nthe nondegeneration bound in\n\\ref{lem:ramp-annulus-nondegeneration}.  The analytic/disjoint-boundary\napproximation, Douglas minimizer, branch-point metric regularization, and\nlimiting passage are those of\n\\ref{lem:smooth-annular-minimizer-bridge} and\n\\ref{lem:annular-approximation-comparison}; after that passage the preceding\nDouglas theorem supplies the minimizer whenever the proof uses one.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Controlled Loop-Family Deformation&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:222,&quot;ref&quot;:&quot;MT:ch19:19.31,MT:ch19:19.35&quot;},{&quot;id&quot;:&quot;d1f0076b74d6&quot;,&quot;label&quot;:&quot;lem:single-ramp-terminal-dichotomy&quot;,&quot;title&quot;:&quot;Single-ramp terminal dichotomy&quot;,&quot;display_title&quot;:&quot;Lemma 5.45: Single-ramp terminal dichotomy&quot;,&quot;body&quot;:&quot;In the setting of\n\\ref{thm:controlled-curve-shrinking-existence}, let\n$p_1\\colon M\\times S^1_\\lambda\\to M$ be product projection and fix\n$\\zeta&gt;0$.  There is\n$B&gt;(t_1-t_0)^{-1}$, depending only on $\\zeta$, the approximating family, and\nthe ambient Ricci-flow bounds, such that, with $t_2=t_1-B^{-1}$, the following\nholds.  For every $c\\in S^2$ there is $\\lambda_c&gt;0$ such that for every\n$0&lt;\\lambda&lt;\\lambda_c$ at least one of these alternatives holds:\n\\begin{enumerate}\n\\item\n\\[\n \\mathcal A_{g(t_1)}\n   \\bigl(p_1\\widetilde\\Gamma_c^\\lambda(t_1)\\bigr)\n &lt;w_{\\mathcal A_{g(t_0)}(\\widetilde\\Gamma(c)),t_0}(t_1)+\\zeta/2;\n\\]\n\\item\n\\[\n L\\bigl(\\widetilde\\Gamma_c^\\lambda(t)\\bigr)&lt;\\zeta/2\n \\qquad\\text{for every }t\\in[t_2,t_1].\n\\]\n\\end{enumerate}\nThe number $B$ is common to the whole compact family; only the preliminary\nthreshold $\\lambda_c$ is pointwise.  More precisely, the length-growth and\nstopping estimates furnish constants $C_2,C_5,\\delta&#x27;&gt;0$ (depending only on\nthe same family and ambient bounds), and $B$ is chosen so that\n\\[\n B\\ge \\frac{3C_5}{\\delta&#x27;},\\qquad\n B\\ge \\frac{3e^{C_2(t_1-t_0)}}{\\zeta},\\qquad\n B&gt;\\frac{C_2}{\\log 4-\\log 3}.\n\\]\nThe last inequality is the quantitative implication\n$e^{C_2/B}&lt;4/3$ used in the short-transfer argument.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Controlled Loop-Family Deformation&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:223,&quot;ref&quot;:&quot;MT:ch18:18.24&quot;},{&quot;id&quot;:&quot;30267a999bf5&quot;,&quot;label&quot;:&quot;lem:finite-net-short-terminal-transfer&quot;,&quot;title&quot;:&quot;A short net ramp forces a short neighboring terminal loop&quot;,&quot;display_title&quot;:&quot;Lemma 5.46: A short net ramp forces a short neighboring terminal loop&quot;,&quot;body&quot;:&quot;Fix the compact ramp family, $\\zeta$, $B$, and\n$t_2=t_1-B^{-1}$ from\n\\ref{lem:single-ramp-terminal-dichotomy}, with $p_1$ denoting the same product\nprojection.  There is $\\mu_{\\rm short}&gt;0$,\nindependent of $0&lt;\\lambda&lt;1$, with the following property.  Suppose\n$c,\\widehat c\\in S^2$ and the initial ramps\n$\\widetilde\\Gamma_c^\\lambda(t_0)$ and\n$\\widetilde\\Gamma_{\\widehat c}^\\lambda(t_0)$ cobound an annulus of area less\nthan $\\mu_{\\rm short}$.  If\n\\[\n L\\bigl(\\widetilde\\Gamma_{\\widehat c}^\\lambda(t)\\bigr)&lt;\\zeta/2\n \\qquad(t_2\\le t\\le t_1),\n\\]\nthen\n\\[\n L_{g(t_1)}\\bigl(p_1\\widetilde\\Gamma_c^\\lambda(t_1)\\bigr)&lt;\\zeta.\n\\]&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Controlled Loop-Family Deformation&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:224,&quot;ref&quot;:&quot;MT:ch18:18.24,MT:ch19:19.31,MT:ch19:19.35&quot;},{&quot;id&quot;:&quot;31a90c8d1eb2&quot;,&quot;label&quot;:&quot;thm:controlled-loop-family-deformation&quot;,&quot;title&quot;:&quot;Imported controlled deformation of a loop family&quot;,&quot;display_title&quot;:&quot;Theorem 5.47: Imported controlled deformation of a loop family&quot;,&quot;body&quot;:&quot;Let $g(t)$ be a Ricci flow on a compact three-manifold for\n$t\\in[t_0,t_1]$, let $\\Gamma\\colon S^2\\to\\Lambda_0M$ be continuous, and let\n$\\zeta&gt;0$.  There is a continuous family\n$\\widetilde\\Gamma(t)\\colon S^2\\to\\Lambda_0M$ such that\nthe maps $\\widetilde\\Gamma(t_0)$ and $\\Gamma$ are homotopic as maps\n$S^2\\to\\Lambda_0M$, and the path $u\\mapsto\\widetilde\\Gamma(u)$ is a homotopy\nof maps from $\\widetilde\\Gamma(t_0)$ to $\\widetilde\\Gamma(t)$ for every\n$t\\in[t_0,t_1]$.  In particular, whenever $\\pi_2(M)=0$, all these maps have\nthe same free $\\pi_1(M)$-orbit under the established loop-space\n$\\pi_2=0$ identification.  For every $c\\in S^2$,\n\\[\n |\\mathcal A_{g(t_0)}(\\widetilde\\Gamma(t_0)(c))\n   -\\mathcal A_{g(t_0)}(\\Gamma(c))|&lt;\\zeta,\n\\]\nand at least one of the following holds:\n\\begin{enumerate}\n\\item $L_{g(t_1)}(\\widetilde\\Gamma(t_1)(c))&lt;\\zeta$;\n\\item\n\\[\n \\mathcal A_{g(t_1)}(\\widetilde\\Gamma(t_1)(c))\n \\le w_{\\mathcal A_{g(t_0)}(\\widetilde\\Gamma(t_0)(c)),t_0}(t_1)+\\zeta.\n\\]\n\\end{enumerate}\nMore precisely, the construction first fixes the common terminal interval\nfrom \\ref{lem:single-ramp-terminal-dichotomy}, then a positive annular-area\nthreshold $\\mu$, then a finite $\\mu/2$-annular net, and only afterward one\ncommon scale $\\lambda&gt;0$ below the finitely many pointwise thresholds and\n$\\lambda_{\\rm net}$ of\n\\ref{lem:finite-net-ramp-nondegeneration}.  At that fixed scale every net\ncomparison starts with annular area below $\\mu$ and has the positive\nnondegeneration constant $\\rho_\\lambda=\\lambda$ throughout the time\ninterval.  Douglas attainment and the corresponding branch/collar\nregularity are then supplied by\n\\ref{thm:annular-douglas-minimizer}; no uniform positive lower bound as\n$\\lambda\\downarrow0$ is asserted.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Controlled Loop-Family Deformation&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:225,&quot;ref&quot;:&quot;MT:ch18:18.24&quot;}]},{&quot;id&quot;:&quot;3-width-evolution-through-surgery&quot;,&quot;title&quot;:&quot;_3-Width Evolution Through Surgery&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;7a8fd5a54eac&quot;,&quot;label&quot;:&quot;lem:coherent-marked-component-path&quot;,&quot;title&quot;:&quot;Coherent marked-point transport along a component path&quot;,&quot;display_title&quot;:&quot;Lemma 5.48: Coherent marked-point transport along a component path&quot;,&quot;body&quot;:&quot;Let $\\mathcal X$ be a component path with finitely many singular times.\nThere are marked points $x(t)\\in\\mathcal X(t)$, continuous on each regular\ninterval, and paths in the continuing surgery components joining\n$F_t(x(t))$ to $x(T)$ at every singular time $T$.  These choices identify\nthe based homotopy groups across regular intervals and make each surgery map\nan induced map after the displayed basepoint change.  A different choice\nchanges the based identification only by the standard $\\pi_1$-action; hence\nthe induced map on the orbit set of $\\pi_3$ is canonical.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;_3-Width Evolution Through Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:226,&quot;ref&quot;:&quot;MT:ch18:18.18,MT:ch15:15.12&quot;},{&quot;id&quot;:&quot;051e2016bc24&quot;,&quot;label&quot;:&quot;thm:surgery-pi3-class-transport&quot;,&quot;title&quot;:&quot;Transport of a nonzero third-homotopy class&quot;,&quot;display_title&quot;:&quot;Theorem 5.49: Transport of a nonzero third-homotopy class&quot;,&quot;body&quot;:&quot;Let $\\mathcal X$ be a component path on $[t_0,t_1]$ with only finitely many\nsurgery times, with\n$\\pi_2(\\mathcal X(t_0))=0$ and\n$\\pi_3(\\mathcal X(t_0))\\cong\\mathbb Z$, and let\n$0\\ne\\xi(t_0)\\in\\pi_3(\\mathcal X(t_0))$.  Choose the coherent marked\npoints of \\ref{lem:coherent-marked-component-path}.  Then $\\pi_2(\\mathcal\nX(t))=0$\nfor every $t$, and there is a compatible family of nonzero classes\n$\\xi(t)\\in\\pi_3(\\mathcal X(t))$.  At a surgery time $T$, the maps\n$F_t\\colon\\mathcal X(t)\\to\\mathcal X(T)$ of\n\\ref{thm:trivial-surgery-component-map}, for $t&lt;T$ sufficiently close to $T$,\nsatisfy\n\\[\n (F_t)_*[\\xi(t)]=[\\xi(T)]\n\\]\nin the $\\pi_1$-orbit sets; after the coherent marked-point choices this\nequality may be read as an equality of based representatives.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;_3-Width Evolution Through Surgery&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:227,&quot;ref&quot;:&quot;MT:ch18:18.18,MT:ch15:15.12&quot;},{&quot;id&quot;:&quot;516f19e15e63&quot;,&quot;label&quot;:&quot;lem:loop-width-regular-continuity&quot;,&quot;title&quot;:&quot;Continuity of loop-family width at regular times&quot;,&quot;display_title&quot;:&quot;Lemma 5.50: Continuity of loop-family width at regular times&quot;,&quot;body&quot;:&quot;The function $W_\\xi$ is continuous at every nonsurgery time.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;_3-Width Evolution Through Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:228,&quot;ref&quot;:&quot;MT:ch18:18.21&quot;},{&quot;id&quot;:&quot;42e93ee61505&quot;,&quot;label&quot;:&quot;lem:loop-width-surgery-lower-semicontinuity&quot;,&quot;title&quot;:&quot;Loop-family width at a surgery time&quot;,&quot;display_title&quot;:&quot;Lemma 5.51: Loop-family width at a surgery time&quot;,&quot;body&quot;:&quot;At a surgery time $T$,\n\\[\n W_\\xi(T)\\le\\liminf_{t\\uparrow T}W_\\xi(t).\n\\]&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;_3-Width Evolution Through Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:229,&quot;ref&quot;:&quot;MT:ch18:18.22,MT:ch15:15.12&quot;},{&quot;id&quot;:&quot;0a7c95bee89d&quot;,&quot;label&quot;:&quot;lem:short-loops-small-disk&quot;,&quot;title&quot;:&quot;Short loops bound small-area disks&quot;,&quot;display_title&quot;:&quot;Lemma 5.52: Short loops bound small-area disks&quot;,&quot;body&quot;:&quot;Let $(X,g)$ be compact.  For every $\\eta&gt;0$ there is\n$0&lt;\\zeta&lt;\\eta/2$ such that every $C^1$ loop of length less than $\\zeta$\nbounds a Lipschitz disk of area less than $\\eta$.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;_3-Width Evolution Through Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:230,&quot;ref&quot;:&quot;MT:ch18:18.28&quot;},{&quot;id&quot;:&quot;9b1d8806cf9e&quot;,&quot;label&quot;:&quot;lem:short-loop-families-trivial&quot;,&quot;title&quot;:&quot;Short loop families are trivial&quot;,&quot;display_title&quot;:&quot;Lemma 5.53: Short loop families are trivial&quot;,&quot;body&quot;:&quot;Let $(X,g)$ be compact with $\\pi_2(X)=0$.  There is $\\zeta&gt;0$ such that any\ncontinuous family $\\Gamma\\colon S^2\\to\\Lambda_0X$ all of whose loops have\nlength less than $\\zeta$ represents the zero free-homotopy orbit, and hence\nthe zero class after any based choice, under\n$\\pi_2(\\Lambda_0X,*)\\cong\\pi_3(X)$.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;_3-Width Evolution Through Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:231,&quot;ref&quot;:&quot;MT:ch18:18.27&quot;},{&quot;id&quot;:&quot;f29967583a07&quot;,&quot;label&quot;:&quot;thm:loop-width-forward-inequality&quot;,&quot;title&quot;:&quot;Forward inequality for the _3 width&quot;,&quot;display_title&quot;:&quot;Theorem 5.54: Forward inequality for the _3 width&quot;,&quot;body&quot;:&quot;Let $\\mathcal X$ be a component path of a controlled surgery flow on a compact\ninterval $[t_0,t_1]$ containing only finitely many surgery times.  Suppose\n$\\pi_2(\\mathcal X(t_0))=0$ and\n$\\pi_3(\\mathcal X(t_0))\\cong\\mathbb Z$, and let\n$0\\ne\\xi(t_0)\\in\\pi_3(\\mathcal X(t_0))$.  Let\n$\\xi(t)$ be the compatible family of nonzero classes supplied by\n\\ref{thm:surgery-pi3-class-transport}; in particular\n$\\pi_2(\\mathcal X(t))=0$ for every $t$.  Then\n$W_\\xi$ is continuous at nonsurgery times, obeys\n\\[\n W_\\xi(T)\\le\\liminf_{t\\uparrow T}W_\\xi(t)\n\\]\nat surgery times, and satisfies\n\\[\n D^+W_\\xi(t)\n \\le-2\\pi-\\frac12R_{\\min}(t)W_\\xi(t)\n\\]\non the immediate right of every time in $[t_0,t_1)$ for which the component\npath survives.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;_3-Width Evolution Through Surgery&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:232,&quot;ref&quot;:&quot;MT:ch18:18.18&quot;}]},{&quot;id&quot;:&quot;finite-extinction&quot;,&quot;title&quot;:&quot;Finite Extinction&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;1eed2f7e7e5a&quot;,&quot;label&quot;:&quot;lem:projective-plane-prime-factor-contract&quot;,&quot;title&quot;:&quot;Imported prime-factor contract for a two-sided projective plane&quot;,&quot;display_title&quot;:&quot;Lemma 5.55: Imported prime-factor contract for a two-sided projective plane&quot;,&quot;body&quot;:&quot;Let $M$ be a closed connected three-manifold whose fundamental group is a\nfree product of finite groups and infinite cyclic groups, and let $P\\subset M$\nbe an embedded two-sided $\\mathbb{RP}^2$ with trivial normal bundle.  Under\nthe prime/connected-sum decomposition used for this free product, $P$ can be\nisotoped disjoint from the decomposition spheres and hence into one prime\nfactor.  Its inclusion is $\\pi _1$-injective, and because it is two-sided and\nnonseparating in that factor, the factor&#x27;s first homology surjects onto\n$\\mathbb Z$.  This is the Hempel/prime-decomposition topology input in the\nMorgan--Tian proof.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Finite Extinction&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:233,&quot;ref&quot;:&quot;MT:ch18:18.1&quot;},{&quot;id&quot;:&quot;eb500921cc59&quot;,&quot;label&quot;:&quot;thm:free-product-excludes-two-sided-projective-plane&quot;,&quot;title&quot;:&quot;The free-product hypothesis excludes a two-sided projective plane&quot;,&quot;display_title&quot;:&quot;Theorem 5.56: The free-product hypothesis excludes a two-sided projective plane&quot;,&quot;body&quot;:&quot;Let $M$ be a closed connected three-manifold whose\nfundamental group is a free product of finite groups and infinite cyclic\ngroups.  Then $M$ contains no embedded $\\mathbb{RP}^2$ with trivial normal\nbundle.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Finite Extinction&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:234,&quot;ref&quot;:&quot;MT:ch18:18.1&quot;},{&quot;id&quot;:&quot;7a54ac1a4b27&quot;,&quot;label&quot;:&quot;thm:finite-time-extinction&quot;,&quot;title&quot;:&quot;Finite-time extinction&quot;,&quot;display_title&quot;:&quot;Theorem 5.57: Finite-time extinction&quot;,&quot;body&quot;:&quot;Let $(M,g_0)$ be a compact connected normalized Riemannian three-manifold\nwhose fundamental group is a free product of finite groups and infinite\ncyclic groups and which contains no embedded $\\mathbb{RP}^2$ with trivial\nnormal bundle.  Fix an all-time three-dimensional generalized Ricci flow\n$({\\mathcal M},G)$ starting from $(M,g_0)$ which has the\nKleiner--Lott $(r,\\delta)$-cutoff, satisfies Assumptions (1)--(7), has\ncurvature pinched toward positive, satisfies the stagewise strong canonical\nneighborhood and noncollapsing estimates, and has only finitely many surgery\ntimes on each bounded interval, and which is one of the all-time flows\nsupplied by \\ref{thm:all-time-controlled-surgery-flow}.  Then this fixed flow has a\nfinite extinction time: there is $T_*&lt;\\infty$ such that\n$M_t=\\varnothing$ for every $t\\ge T_*$.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Finite Extinction&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:235,&quot;ref&quot;:&quot;MT:ch18:18.1&quot;}]}]},{&quot;id&quot;:&quot;topological-endgame&quot;,&quot;title&quot;:&quot;Topological Endgame&quot;,&quot;sections&quot;:[{&quot;id&quot;:&quot;smooth-connected-sums-and-prime-factors&quot;,&quot;title&quot;:&quot;Smooth Connected Sums and Prime Factors&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;74735bfad981&quot;,&quot;label&quot;:&quot;def:smooth-connected-sum&quot;,&quot;title&quot;:&quot;Smooth connected sum&quot;,&quot;display_title&quot;:&quot;Definition 6.1: Smooth connected sum&quot;,&quot;body&quot;:&quot;Let $M$ and $N$ be connected smooth $3$-manifolds without boundary.  Given\nsmoothly embedded closed $3$-balls and a diffeomorphism of their boundary\nspheres, their \\emph{smooth connected sum} $M\\mathbin{\\#}N$ is obtained by\ndeleting the interiors of the balls and making that boundary identification.\nIn the oriented category the manifolds are oriented and the identification is\norientation reversing.  This orientation convention is part of the definition;\nthe isotopy-extension theorem for $3$-balls then identifies different choices\nand makes finite connected sums associative up to oriented diffeomorphism.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Smooth Connected Sums and Prime Factors&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:236,&quot;ref&quot;:&quot;MT:ch15:15.3&quot;},{&quot;id&quot;:&quot;5fcd85b09ca5&quot;,&quot;label&quot;:&quot;def:spherical-space-form&quot;,&quot;title&quot;:&quot;Spherical space form&quot;,&quot;display_title&quot;:&quot;Definition 6.2: Spherical space form&quot;,&quot;body&quot;:&quot;A \\emph{spherical space form} is a quotient $S^3/\\Gamma$, where $S^3$ has\nits round metric and $\\Gamma$ is a finite group acting freely by isometries.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Smooth Connected Sums and Prime Factors&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:237,&quot;ref&quot;:&quot;MT:intro:0.1&quot;},{&quot;id&quot;:&quot;5f4913b5014a&quot;,&quot;label&quot;:&quot;def:sphere-bundles-over-circle&quot;,&quot;title&quot;:&quot;The two sphere bundles over the circle&quot;,&quot;display_title&quot;:&quot;Definition 6.3: The two sphere bundles over the circle&quot;,&quot;body&quot;:&quot;Write\n\\[\n E_+=S^2\\times S^1\n \\qquad\\text{and}\\qquad\n E_-=S^1\\mathbin{\\widetilde\\times}S^2\n\\]\nfor, respectively, the orientable product bundle and the nonorientable\ntwisted smooth $S^2$-bundle over $S^1$.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Smooth Connected Sums and Prime Factors&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:238,&quot;ref&quot;:&quot;MT:ch15:15.3&quot;},{&quot;id&quot;:&quot;5436ad477cbd&quot;,&quot;label&quot;:&quot;lem:two-sphere-diffeomorphism-classes&quot;,&quot;title&quot;:&quot;The two smooth gluing classes of a two-sphere&quot;,&quot;display_title&quot;:&quot;Lemma 6.4: The two smooth gluing classes of a two-sphere&quot;,&quot;body&quot;:&quot;Every smooth diffeomorphism $\\varphi\\colon S^2\\to S^2$ is smoothly isotopic\nto the identity when it preserves orientation and to the antipodal map when it\nreverses orientation.  Hence gluing the two sphere boundaries of\n$S^2\\times[0,1]$ produces exactly one of $E_+$ and $E_-$.  The resulting\nclosed three-manifold is orientable exactly in the $E_+$ case.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Smooth Connected Sums and Prime Factors&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:239,&quot;ref&quot;:&quot;MT:ch15:15.4&quot;},{&quot;id&quot;:&quot;e939cfe559a1&quot;,&quot;label&quot;:&quot;def:simply-connected&quot;,&quot;title&quot;:&quot;Simply connected space&quot;,&quot;display_title&quot;:&quot;Definition 6.5: Simply connected space&quot;,&quot;body&quot;:&quot;A topological space is \\emph{simply connected} when it is path-connected and\nits fundamental group at one, equivalently every, basepoint is trivial.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Smooth Connected Sums and Prime Factors&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:240,&quot;ref&quot;:&quot;MT:intro:0.1&quot;},{&quot;id&quot;:&quot;206db407e5de&quot;,&quot;label&quot;:&quot;lem:path-connected-implies-connected&quot;,&quot;title&quot;:&quot;Path-connected spaces are connected&quot;,&quot;display_title&quot;:&quot;Lemma 6.6: Path-connected spaces are connected&quot;,&quot;body&quot;:&quot;Every path-connected topological space is connected.  In particular, a space\nwhich is simply connected in the sense of \\ref{def:simply-connected} is\nconnected.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Smooth Connected Sums and Prime Factors&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:241,&quot;ref&quot;:&quot;MT:intro:0.1&quot;},{&quot;id&quot;:&quot;f32e24c7af2a&quot;,&quot;label&quot;:&quot;lem:simply-connected-three-manifold-orientable&quot;,&quot;title&quot;:&quot;A simply connected three-manifold is orientable&quot;,&quot;display_title&quot;:&quot;Lemma 6.7: A simply connected three-manifold is orientable&quot;,&quot;body&quot;:&quot;Every connected simply connected smooth $3$-manifold is orientable.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Smooth Connected Sums and Prime Factors&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:242,&quot;ref&quot;:&quot;MT:intro:0.1&quot;},{&quot;id&quot;:&quot;edd928203cd3&quot;,&quot;label&quot;:&quot;thm:positive-ricci-three-manifold-roundness&quot;,&quot;title&quot;:&quot;Hamilton roundness for positive Ricci curvature&quot;,&quot;display_title&quot;:&quot;Theorem 6.8: Hamilton roundness for positive Ricci curvature&quot;,&quot;body&quot;:&quot;Let $M$ be a compact connected smooth $3$-manifold without boundary and let\n$g$ be a smooth Riemannian metric with $\\operatorname{Ric}_g&gt;0$ everywhere.\nThen $M$ admits a metric of constant positive sectional curvature and is\ndiffeomorphic to a spherical space form.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Smooth Connected Sums and Prime Factors&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:243,&quot;ref&quot;:&quot;MT:ch4:4.23&quot;}]},{&quot;id&quot;:&quot;reversing-one-surgery&quot;,&quot;title&quot;:&quot;Reversing One Surgery&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;c97a532e4a8d&quot;,&quot;label&quot;:&quot;lem:whole-disappearing-component-classification&quot;,&quot;title&quot;:&quot;Whole disappearing components&quot;,&quot;display_title&quot;:&quot;Lemma 6.9: Whole disappearing components&quot;,&quot;body&quot;:&quot;Let $({\\mathcal M},G)$ be a controlled Ricci flow with surgery satisfying\nAssumptions (1)--(7) in the definition of controlled surgery.  Let $T$ be a\nsingular time and let $t^-&lt;T$ be regular and sufficiently close to $T$.  Write\n$C_T\\subset M_T$ for the continuing region, let\n$C_{t^-}\\subset M_{t^-}$ be its backward time-flow image, and put\n$D_{t^-}=M_{t^-}\\setminus C_{t^-}$.  If a connected component of $D_{t^-}$ is\nalso a whole component of $M_{t^-}$, then it is diffeomorphic\nto one of\n\\[\n S^3/\\Gamma,\\qquad \\mathbb{RP}^3\\mathbin{\\#}\\mathbb{RP}^3,\n \\qquad E_+,\n \\qquad E_-.\n\\]&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Reversing One Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:244,&quot;ref&quot;:&quot;MT:ch4:4.23,MT:ch15:15.3,MT:app:A.25&quot;},{&quot;id&quot;:&quot;93db3db3435a&quot;,&quot;label&quot;:&quot;def:proper-disappearing-component&quot;,&quot;title&quot;:&quot;Proper disappearing component&quot;,&quot;display_title&quot;:&quot;Definition 6.10: Proper disappearing component&quot;,&quot;body&quot;:&quot;Let $({\\mathcal M},G)$ satisfy Assumptions (1)--(7), let $T$ be a singular\ntime, and let $t^-&lt;T$ be regular and sufficiently close to $T$.  Write\n$C_{t^-}$ for the backward image of the continuing region and\n$D_{t^-}=M_{t^-}\\setminus C_{t^-}$.  A connected component $D$ of\n$D_{t^-}$ is \\emph{proper} when it is not a connected component of the ambient\nslice $M_{t^-}$.  Its frontier always means the ambient frontier\n$\\operatorname{Fr}_{M_{t^-}}D$; no spherical-frontier, compactness, or\ncanonical-neighborhood conclusion is included in this definition.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Reversing One Surgery&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:245,&quot;ref&quot;:&quot;MT:ch15:15.3&quot;},{&quot;id&quot;:&quot;f9d799d02acb&quot;,&quot;label&quot;:&quot;lem:actual-disappearing-component-frontier-saturation&quot;,&quot;title&quot;:&quot;Actual disappearing components have saturated neck frontier&quot;,&quot;display_title&quot;:&quot;Lemma 6.11: Actual disappearing components have saturated neck frontier&quot;,&quot;body&quot;:&quot;Let $({\\mathcal M},G)$ satisfy Assumptions (1)--(7), let $t$ be a singular\ntime, and let $t^-&lt;t$ be regular and sufficiently close to $t$.  If a connected\ncomponent $D$ of the actual disappearing region\n$D_{t^-}=M_{t^-}\\setminus C_{t^-}$ is not a whole connected component of\n$M_{t^-}$ (where the presurgery slice is compact, smooth, and boundaryless),\nthen $D$ has nonempty frontier and $\\overline D$ is a\ncompact codimension-zero smooth submanifold,\n\\[\n \\operatorname{Fr}_{M_{t^-}}D=S_1\\sqcup\\cdots\\sqcup S_m\n\\]\nis a finite union of pairwise disjoint embedded $2$-spheres, and every\n$S_j$ is the backward image of a component of $\\Sigma_t$ and hence the central\nsphere of the corresponding strong neck in the maximal presurgery extension.\nEvery point of $D$ is either an $\\epsilon$-neck center or belongs to the core\nof a $(C,\\epsilon)$-cap.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Reversing One Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:246,&quot;ref&quot;:&quot;MT:ch15:15.2,MT:ch15:15.3&quot;},{&quot;id&quot;:&quot;0f6cc07f4dc7&quot;,&quot;label&quot;:&quot;lem:fiber-saturation-from-spherical-frontier&quot;,&quot;title&quot;:&quot;Fiber saturation from a spherical frontier&quot;,&quot;display_title&quot;:&quot;Lemma 6.12: Fiber saturation from a spherical frontier&quot;,&quot;body&quot;:&quot;Let $J\\subset\\mathbb R$ be a nonempty open interval and let\n$U\\subset S^2\\times J$ be connected and open.  Suppose that\n$\\operatorname{Fr}_{S^2\\times J}(U)$ is a union of complete fibers\n$S^2\\times\\{s\\}$.  Then there is an open interval $A\\subset J$ such that\n$U=S^2\\times A$.  If, in addition, $\\overline U$ is compact in\n$S^2\\times J$ and the frontier is nonempty, then there are $a&lt;b$ in the\ninterior of $J$ such that\n\\[\n U=S^2\\times(a,b),\\qquad\n \\operatorname{Fr}_{S^2\\times J}(U)\n =S^2\\times\\{a\\}\\,\\sqcup\\,S^2\\times\\{b\\}.\n\\]&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Reversing One Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:247,&quot;ref&quot;:&quot;MT:app:A.20,MT:app:A.21&quot;},{&quot;id&quot;:&quot;5be711b510d7&quot;,&quot;label&quot;:&quot;lem:closed-collar-fiber-saturation&quot;,&quot;title&quot;:&quot;Saturation on a closed product collar&quot;,&quot;display_title&quot;:&quot;Lemma 6.13: Saturation on a closed product collar&quot;,&quot;body&quot;:&quot;Let $E=S^2\\times[a,b]$ be a closed product collar in a smooth\nthree-manifold $Y$, with endpoint fibers $F_a$ and $F_b$.  Let $D\\subset Y$ be\nconnected and open, with compact smooth codimension-zero closure and\n\\(\\partial\\overline D=\\operatorname{Fr}_Y(D)\\) a finite union of displayed\ncross-sectional spheres.  For every connected component $V$ of\n$D\\cap(S^2\\times(a,b))$, there is an open interval $A\\subset(a,b)$ such that\n\\[\n V=S^2\\times A.\n\\]\nMoreover, if $D$ meets an endpoint fiber, it contains that whole fiber; if an\nendpoint fiber meets $\\operatorname{Fr}_Y(D)$, that whole fiber is a frontier\ncomponent.  Thus $D$ crosses each product collar by whole fibers, and can stop\nthere only at a displayed cross-section.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Reversing One Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:248,&quot;ref&quot;:&quot;MT:app:A.20,MT:app:A.21&quot;},{&quot;id&quot;:&quot;01dd4ae8f2cb&quot;,&quot;label&quot;:&quot;lem:relative-fiber-boundary-pairing&quot;,&quot;title&quot;:&quot;Boundary pairing in a fibered neck region&quot;,&quot;display_title&quot;:&quot;Lemma 6.14: Boundary pairing in a fibered neck region&quot;,&quot;body&quot;:&quot;Let $E$ be either an open product $S^2\\times J$ with $J$ an open interval,\nor a closed $S^2$-bundle over $S^1$ presented as\n\n\\[\n q:S^2\\times\\mathbb R\\longrightarrow E,\n \\qquad q(y,s+L)=q(\\phi(y),s)\n\\]\n\nfor some $L&gt;0$ and diffeomorphism $\\phi:S^2\\to S^2$.  Let $D\\subset E$ be\nconnected and open, with compact smooth codimension-zero closure satisfying\n\\(\\partial\\overline D=\\operatorname{Fr}_E(D)\\ne\\varnothing\\), and suppose\nthat this frontier is a union of complete fibers.  Then\n\n\\[\n \\overline D\\cong S^2\\times[0,1],\n \\qquad \\operatorname{Fr}_E(D)=S_0\\sqcup S_1.\n\\]&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Reversing One Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:249,&quot;ref&quot;:&quot;MT:app:A.20,MT:app:A.21,MT:app:A.24&quot;},{&quot;id&quot;:&quot;1407ce3c1421&quot;,&quot;label&quot;:&quot;lem:proper-all-neck-relative-fibration&quot;,&quot;title&quot;:&quot;Relative classification of a proper all-neck region&quot;,&quot;display_title&quot;:&quot;Lemma 6.15: Relative classification of a proper all-neck region&quot;,&quot;body&quot;:&quot;Let $D$ be a proper connected component of a disappearing region in a compact\nboundaryless presurgery $3$-manifold.  Assume every point of $D$ is an\n$\\epsilon$-neck center, every point of its nonempty frontier is a central\nneck sphere, and $\\overline D$ is a compact smooth codimension-zero\nsubmanifold with\n\\[\n \\partial\\overline D=\\operatorname{Fr}D\\ne\\varnothing\n\\]\na finite union of those spheres.  Then\n\\[\n \\overline D\\cong S^2\\times[0,1],\\qquad\n \\operatorname{Fr}D=S_0\\sqcup S_1.\n\\]\nIn particular, the closed $S^2$-bundle alternative in Appendix~A.20 cannot\nbe used to replace this relative conclusion: Appendix~A.21 only gives\ncontainment in an ambient neck-covered component.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Reversing One Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:250,&quot;ref&quot;:&quot;MT:app:A.20,MT:app:A.21,MT:app:A.24&quot;},{&quot;id&quot;:&quot;911928b1060f&quot;,&quot;label&quot;:&quot;lem:exposed-end-successor-overlap&quot;,&quot;title&quot;:&quot;Exposed-end successors share a middle overlap&quot;,&quot;display_title&quot;:&quot;Lemma 6.16: Exposed-end successors share a middle overlap&quot;,&quot;body&quot;:&quot;For sufficiently small $\\epsilon$, let $N_a,\\ldots,N_b$ be a balanced chain\nwith only the positive end exposed.  Every neck centered at a frontier point\nwhich satisfies the extension hypotheses of the finite-chain frontier\ndichotomy (or the capped-chain exposed-frontier lemma) meets the middle\n$0.9\\epsilon^{-1}$ of $N_b$.  Any two such successor necks have a common\ncross-sectional sphere in the middle overlap, isotopic in both necks to their\ncentral spheres.  Consequently they determine one maximal product collar and\none successor incidence, rather than two branches.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Reversing One Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:251,&quot;ref&quot;:&quot;MT:app:A.11,MT:app:A.17,MT:app:A.21&quot;},{&quot;id&quot;:&quot;0282ca1d02a5&quot;,&quot;label&quot;:&quot;lem:maximal-overlap-incidence-no-branching&quot;,&quot;title&quot;:&quot;Maximal-overlap incidence has no branching&quot;,&quot;display_title&quot;:&quot;Lemma 6.17: Maximal-overlap incidence has no branching&quot;,&quot;body&quot;:&quot;Let $Y$ be a connected union of sufficiently small canonical necks and cap\ncores.  Form its incidence graph from \\emph{maximal} connected product collars:\ntwo overlapping neck pieces are one edge whenever their middle overlap contains\na common cross-sectional sphere isotopic in both necks, and cap cores are\nvertices.  Assume the finite-chain frontier extensions and the cap frontier\nlocalization clauses of Appendices~A.17 and A.21 hold, and that an infinite\nchain has no frontier.  Then every neck vertex has degree at most two, every\ncap vertex is terminal, and the connected incidence graph is a (possibly\ndegenerate) finite interval, a half-line, a line, or a circle.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Reversing One Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:252,&quot;ref&quot;:&quot;MT:app:A.17,MT:app:A.21,MT:app:A.23,MT:app:A.25&quot;},{&quot;id&quot;:&quot;7b9b7f513a7d&quot;,&quot;label&quot;:&quot;lem:canonical-cover-incidence-structure&quot;,&quot;title&quot;:&quot;Ordered incidence supplied by the cap/neck classification&quot;,&quot;display_title&quot;:&quot;Lemma 6.18: Ordered incidence supplied by the cap/neck classification&quot;,&quot;body&quot;:&quot;Every containing component furnished by\n\\ref{thm:cap-and-neck-cover-classification} has the following additional\nsource structure.  Its cap/neck incidence graph is a finite interval, a\nhalf-line, a line, or a circle; each edge is a product collar\n$S^2\\times I$, each cap is a terminal vertex, and all central neck spheres\nare cross-sectional fibers in the corresponding edge.  The incidence graph\nhas no branching.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Reversing One Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:253,&quot;ref&quot;:&quot;MT:app:A.21,MT:app:A.25&quot;},{&quot;id&quot;:&quot;d5e974cc00ad&quot;,&quot;label&quot;:&quot;lem:ordered-relative-capped-cover&quot;,&quot;title&quot;:&quot;Ordered incidence of a relative capped cover&quot;,&quot;display_title&quot;:&quot;Lemma 6.19: Ordered incidence of a relative capped cover&quot;,&quot;body&quot;:&quot;Let $Y$ be a connected canonical cap/neck component with the ordered\nincidence structure supplied by Appendix~A.21: after cutting along its central\nneck spheres, the incidence graph is a finite interval, a half-line, a line,\nor a circle; every edge is an $S^2\\times I$ product collar and every cap is a\nterminal vertex with core diffeomorphic to a $3$-ball or to\n$\\mathbb{RP}^3\\setminus\\operatorname{int}(B^3)$.  Let $D\\subset Y$ be a\nproper connected open set with compact smooth codimension-zero closure, whose\nnonempty frontier is a finite union of the displayed cross-sectional spheres\nand satisfies\n\\[\n \\partial\\overline D=\\operatorname{Fr}_Y(D)\\ne\\varnothing.\n\\]\nIf $D$ meets a cap core, then $\\operatorname{Fr}_Y(D)$ has exactly one\ncomponent and\n\n\\[\n \\overline D\\cong B^3\n \\quad\\text{or}\\quad\n \\overline D\\cong\\mathbb{RP}^3\\setminus\\operatorname{int}(B^3).\n\\]&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Reversing One Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:254,&quot;ref&quot;:&quot;MT:app:A.21,MT:app:A.23,MT:app:A.24,MT:app:A.25&quot;},{&quot;id&quot;:&quot;01ca8edf0b34&quot;,&quot;label&quot;:&quot;lem:proper-capped-region-classification&quot;,&quot;title&quot;:&quot;Capped proper regions have one spherical frontier&quot;,&quot;display_title&quot;:&quot;Lemma 6.20: Capped proper regions have one spherical frontier&quot;,&quot;body&quot;:&quot;Let $D$ be a proper connected component of a disappearing region in a compact\nboundaryless $3$-manifold.  Assume that every point of $D$ is an\n$\\epsilon$-neck center or lies in a $(C,\\epsilon)$-cap core, that\n$\\overline D$ is a compact smooth codimension-zero submanifold with nonempty\nfinite spherical frontier, and every frontier component is a central neck\nsphere.  If $D$ meets a cap core, then\n\\[\n \\overline D\\cong B^3\n \\quad\\text{or}\\quad\n \\overline D\\cong\\mathbb{RP}^3\\setminus\\operatorname{int}(B^3),\n \\qquad\n \\operatorname{Fr}D\\cong S^2.\n\\]&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Reversing One Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:255,&quot;ref&quot;:&quot;MT:ch15:15.3,MT:app:A.21,MT:app:A.22,MT:app:A.23,MT:app:A.24&quot;},{&quot;id&quot;:&quot;0e28b2c2090b&quot;,&quot;label&quot;:&quot;lem:frontier-disappearing-component-classification&quot;,&quot;title&quot;:&quot;Relative-boundary classification for a proper disappearing region&quot;,&quot;display_title&quot;:&quot;Lemma 6.21: Relative-boundary classification for a proper disappearing region&quot;,&quot;body&quot;:&quot;Let $({\\mathcal M},G)$ satisfy Assumptions (1)--(7), let $T$ be a singular\ntime, and let $t^-&lt;T$ be regular and sufficiently close to $T$.  If $D$ is a\nproper connected component of $D_{t^-}$ in the sense of\n\\ref{def:proper-disappearing-component}, then the closure\n$\\overline D$ in $M_{t^-}$ is a compact codimension-zero smooth submanifold,\nand there are $m\\in\\{1,2\\}$ pairwise disjoint embedded spheres\n$S_1,\\ldots,S_m$ such that\n\\[\n \\partial_{M_{t^-}}\\overline D\n =\\operatorname{Fr}_{M_{t^-}}D=S_1\\sqcup\\cdots\\sqcup S_m,\n\\]\nwith each $S_j$ the backward image of a surgery central sphere.  The\nsource-exact neck/cap case analysis gives precisely one of\n\\[\n \\overline D\\cong S^2\\times[0,1],\\qquad\n \\overline D\\cong B^3,\\qquad\n \\overline D\\cong\\mathbb{RP}^3\\setminus\\operatorname{int}(B^3).\n\\]\nThe first alternative has two frontier spheres and each of the other two has\none.  No assertion is made here for a disappearing component with empty\nfrontier; that case is covered by\n\\ref{lem:whole-disappearing-component-classification}.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Reversing One Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:256,&quot;ref&quot;:&quot;MT:ch15:15.3,MT:app:A.20,MT:app:A.21,MT:app:A.24&quot;},{&quot;id&quot;:&quot;e8e99e72321a&quot;,&quot;label&quot;:&quot;lem:local-capping-connected-sum-identities&quot;,&quot;title&quot;:&quot;Connected-sum effect of capping frontier spheres&quot;,&quot;display_title&quot;:&quot;Lemma 6.22: Connected-sum effect of capping frontier spheres&quot;,&quot;body&quot;:&quot;Let $X$ be a connected closed smooth $3$-manifold and let\n$C\\subset X$ be a compact codimension-zero smooth submanifold whose relative\nboundary is the frontier-sphere union in\n\\ref{lem:frontier-disappearing-component-classification}.  Use collar\ncoordinates to identify each boundary sphere with the corresponding central\nneck sphere, and let $Y$ be obtained by deleting $\\operatorname{int}C$ and\ncapping every resulting boundary sphere by a smooth $3$-ball.\n\\begin{enumerate}\n\\item If $C\\cong B^3$, then $X\\cong Y$.\n\\item If $C\\cong\\mathbb{RP}^3\\setminus\\operatorname{int}(B^3)$, then\n  $X\\cong Y\\#\\mathbb{RP}^3$.\n\\item If $C\\cong S^2\\times[0,1]$ and its middle sphere separates $X$, then\n  $Y=Y_1\\sqcup Y_2$ and $X\\cong Y_1\\#Y_2$.\n\\item If $C\\cong S^2\\times[0,1]$ and its middle sphere does not separate $X$,\n  then $Y$ is connected and $X\\cong Y\\#E_\\varepsilon$ for some\n  $\\varepsilon\\in\\{+,-\\}$.  If $X$ is orientable, then $\\varepsilon=+$.\n\\end{enumerate}&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Reversing One Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:257,&quot;ref&quot;:&quot;MT:ch15:15.3&quot;},{&quot;id&quot;:&quot;407c8538a6ec&quot;,&quot;label&quot;:&quot;thm:morgan-tian-proposition-15-3&quot;,&quot;title&quot;:&quot;Morgan--Tian one-surgery topological type&quot;,&quot;display_title&quot;:&quot;Theorem 6.23: Morgan--Tian one-surgery topological type&quot;,&quot;body&quot;:&quot;Let $({\\mathcal M},G)$ be a controlled generalized Ricci flow satisfying\nAssumptions (1)--(7) of Morgan--Tian and carrying the Kleiner--Lott\n$(r,\\delta)$-cutoff of \\ref{def:ricci-flow-with-cutoff} on the relevant\nfinite interval.  If $T$ is a singular time and $t^-&lt;T$ is regular and\nsufficiently close to $T$, then, for each connected component $X$ of\n$M_{t^-}$, there is a finite connected-sum expression whose summands are\nconnected components of $M_T$, smooth $S^2$-bundles over $S^1$, and closed\nconstant-positive-curvature three-manifolds.  Taking the disjoint union over\nthe components
