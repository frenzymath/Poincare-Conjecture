  &lt;script&gt;
    const DATA = {&quot;title&quot;:&quot;The Poincare Conjecture&quot;,&quot;chapters&quot;:[{&quot;id&quot;:&quot;foundations-interfaces&quot;,&quot;title&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;sections&quot;:[{&quot;id&quot;:&quot;forward-difference-comparison&quot;,&quot;title&quot;:&quot;Forward-Difference Comparison&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;3f37c7b2cea9&quot;,&quot;label&quot;:&quot;lem:forward-dini-mean-value&quot;,&quot;title&quot;:&quot;Right-Dini mean-value lemma&quot;,&quot;display_title&quot;:&quot;Lemma 1.1: Right-Dini mean-value lemma&quot;,&quot;body&quot;:&quot;Let $q\\colon[c,d]\\to\\mathbb R$ be continuous.  If $q(d)&gt;q(c)$, then\nthere is $s\\in[c,d)$ such that $D^+q(s)&gt;0$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Forward-Difference Comparison&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:0,&quot;ref&quot;:&quot;MT:ch2:2.22&quot;},{&quot;id&quot;:&quot;de78aa012715&quot;,&quot;label&quot;:&quot;thm:forward-dini-comparison&quot;,&quot;title&quot;:&quot;Forward-Dini comparison principle&quot;,&quot;display_title&quot;:&quot;Theorem 1.2: Forward-Dini comparison principle&quot;,&quot;body&quot;:&quot;Let $f\\colon[a,b]\\to\\mathbb R$ be continuous, let\n$\\psi\\colon[a,b]\\times\\mathbb R\\to\\mathbb R$ be of class $C^1$, and\nsuppose\n\\[\n  D^+f(t)\\le \\psi(t,f(t))\\qquad(a\\le t&lt;b).\n\\]\nIf $G\\in C^1([a,b])$ satisfies $G&#x27;(t)=\\psi(t,G(t))$ and\n$f(a)\\le G(a)$, then $f(t)\\le G(t)$ for every $t\\in[a,b]$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Forward-Difference Comparison&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:1,&quot;ref&quot;:&quot;MT:ch2:2.22&quot;},{&quot;id&quot;:&quot;547f37ae7414&quot;,&quot;label&quot;:&quot;lem:uniform-time-slice-transport&quot;,&quot;title&quot;:&quot;Uniform transport of time-slice maxima&quot;,&quot;display_title&quot;:&quot;Lemma 1.3: Uniform transport of time-slice maxima&quot;,&quot;body&quot;:&quot;Let $X$ be a set with functions $\\tau,F,V\\colon X\\to\\mathbb R$, let\n$Z\\subset X$, and let $m\\colon[a,b]\\to\\mathbb R$.  Suppose that for every\n$t\\in[a,b]$ there is $x\\in Z$ with $\\tau(x)=t$ and $F(x)=m(t)$, and that\n$F(y)\\le m(\\tau(y))$ whenever $\\tau(y)\\in[a,b]$.  Suppose also that there\nare $\\rho&gt;0$ and transports $\\Phi_h(x)$, defined for $x\\in Z$,\n$|h|&lt;\\rho$, and $\\tau(x)+h\\in[a,b]$, such that\n\\[\n \\tau(\\Phi_h(x))=\\tau(x)+h,\n \\qquad\n \\sup_{x\\in Z}|F(\\Phi_h(x))-F(x)|\\longrightarrow0\n \\quad(h\\to0).\n\\]\nAssume moreover that, for every $\\eta&gt;0$, there is $h_0&gt;0$ such that\n\\[\n \\frac{F(x)-F(\\Phi_{-h}(x))}{h}\\le V(x)+\\eta\n\\]\nwhenever $x\\in Z$, $0&lt;h&lt;h_0$, and the backward transport is defined.\nIf $\\psi\\colon[a,b]\\times\\mathbb R\\to\\mathbb R$ is continuous and\n\\[\n V(x)\\le\\psi(\\tau(x),F(x))\\qquad(x\\in Z),\n\\]\nthen $m$ is continuous and $D^+m(t)\\le\\psi(t,m(t))$ for every $t&lt;b$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Forward-Difference Comparison&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:2,&quot;ref&quot;:&quot;MT:ch2:2.23&quot;},{&quot;id&quot;:&quot;7f625d515a74&quot;,&quot;label&quot;:&quot;thm:time-slice-maximum-comparison&quot;,&quot;title&quot;:&quot;Time-slice maximum comparison&quot;,&quot;display_title&quot;:&quot;Theorem 1.4: Time-slice maximum comparison&quot;,&quot;body&quot;:&quot;Let $M$ be a smooth manifold, let $\\chi$ be a smooth vector field, and let\n$\\mathbf t\\colon M\\to[a,b]$ be smooth with $\\chi(\\mathbf t)=1$.  Let\n$F\\colon M\\to\\mathbb R$ be smooth, suppose that $F$ attains a maximum on\nevery level set of $\\mathbf t$, and suppose that the set $\\mathcal Z$ of all\nlevelwise maximizers is compact.  If\n$\\psi\\in C^1([a,b]\\times\\mathbb R)$ and\n\\[\n \\chi(F)(x)\\le\\psi(\\mathbf t(x),F(x))\n \\qquad(x\\in\\mathcal Z),\n\\]\nthen\n\\[\n F_{\\max}(t)=\\max_{\\mathbf t^{-1}(t)}F\n\\]\nis continuous and satisfies\n$D^+F_{\\max}(t)\\le\\psi(t,F_{\\max}(t))$ for $t&lt;b$.  Hence, if\n$G&#x27;=\\psi(t,G)$ and $F_{\\max}(a)\\le G(a)$, then\n$F_{\\max}(t)\\le G(t)$ throughout $[a,b]$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Forward-Difference Comparison&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:3,&quot;ref&quot;:&quot;MT:ch2:2.23&quot;}]},{&quot;id&quot;:&quot;controlled-surgery-inputs&quot;,&quot;title&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;34c27224dce4&quot;,&quot;label&quot;:&quot;def:epsilon-neck-and-scale&quot;,&quot;title&quot;:&quot;Epsilon-closeness, neck, and scale&quot;,&quot;display_title&quot;:&quot;Definition 1.5: Epsilon-closeness, neck, and scale&quot;,&quot;body&quot;:&quot;Fix $0&lt;\\epsilon&lt;1/2$ and put $k=\\lfloor\\epsilon^{-1}\\rfloor$.  A metric\n$g$ is \\emph{$\\epsilon$-close to $g_0$ in $C^k$} on a common domain if\nthe $g_0$-norms of $g-g_0$ and its first $k$ covariant derivatives are\nuniformly less than $\\epsilon$.\n\nAn \\emph{$\\epsilon$-neck} centered at $x$ in a Riemannian three-manifold\n$(M,g)$ is the image $N$ of a diffeomorphism\n\\[\n \\varphi\\colon S^2\\times(-\\epsilon^{-1},\\epsilon^{-1})\\longrightarrow N\n\\]\nwith $x\\in\\varphi(S^2\\times\\{0\\})$, such that\n$R(x)\\varphi^*g$ is $\\epsilon$-close in\n$C^{\\lfloor1/\\epsilon\\rfloor}$ to $h_0+ds^2$, where $h_0$ is the round\nmetric of scalar curvature $1$ on $S^2$.  The slices are the neck spheres,\nthe slice at $s=0$ is the central sphere, and\n\\[\n s_N=\\operatorname{pr}_2\\circ\\varphi^{-1},\n \\qquad r_N=R(x)^{-1/2}\n\\]\nare the axial coordinate and the scale.  Replacing $s_N$ by $-s_N$\nreverses the neck.  Its positive and negative ends are respectively\n\\[\n E_N^+=\\{s_N&gt;0.9\\epsilon^{-1}\\},\n \\qquad\n E_N^-=\\{s_N&lt;-0.9\\epsilon^{-1}\\}.\n\\]&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:4,&quot;ref&quot;:&quot;MT:ch2:2.16,MT:ch2:2.18&quot;},{&quot;id&quot;:&quot;82d739ec0ed6&quot;,&quot;label&quot;:&quot;def:maximal-ricci-flow-extension&quot;,&quot;title&quot;:&quot;Maximal extension of a generalized Ricci flow&quot;,&quot;display_title&quot;:&quot;Definition 1.6: Maximal extension of a generalized Ricci flow&quot;,&quot;body&quot;:&quot;Here a \\emph{generalized Ricci flow} consists of a manifold with a time\nfunction $\\mathbf t$, a time vector field $\\chi$ satisfying\n$\\chi(\\mathbf t)=1$, and metrics on $\\ker(d\\mathbf t)$ which evolve by\nthe Ricci-flow equation along $\\chi$.  Let $(\\mathcal M,G)$ be such a\nflow on a terminal interval\n$[T^-,T)$, identify this part of the flow with $M\\times[T^-,T)$, and set\n\\[\n \\Omega=\\{x\\in M:\\liminf_{t\\uparrow T}R(x,t)&lt;\\infty\\}.\n\\]\nSuppose that $\\Omega$ is open and that $g(t)|_\\Omega$ converges smoothly\non compact subsets to a metric $g(T)$.  The \\emph{maximal extension to\n$T$} is\n\\[\n \\widehat{\\mathcal M}\n =\\mathcal M\\cup_{\\Omega\\times[T^-,T)}\n   (\\Omega\\times[T^-,T]).\n\\]\nThe time function, time vector field, and horizontal metrics agree on the\noverlap and hence glue to a generalized Ricci flow\n$(\\widehat{\\mathcal M},\\widehat G)$.  Its terminal time-slice is\n$(\\Omega,g(T))$, which need not be complete.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:5,&quot;ref&quot;:&quot;MT:ch11:11.22&quot;},{&quot;id&quot;:&quot;fdaab108b288&quot;,&quot;label&quot;:&quot;def:standard-surgery-cap-model&quot;,&quot;title&quot;:&quot;Standard surgery-cap model&quot;,&quot;display_title&quot;:&quot;Definition 1.7: Standard surgery-cap model&quot;,&quot;body&quot;:&quot;Fix a complete rotationally symmetric metric $g_0$ on $\\mathbb R^3$ with\nnonnegative sectional curvature and tip $p_0$.  Fix constants\n$A_0&gt;r_0&gt;0$ such that $g_0$ has constant sectional curvature $1/4$ on\n$B_{g_0}(p_0,r_0)$ and there is an isometry\n\\[\n \\psi\\colon(S^2\\times(-\\infty,4],h_0+ds^2)\n \\longrightarrow(\\mathbb R^3\\setminus B_{g_0}(p_0,A_0),g_0).\n\\]\nExtend the cylinder coordinate to a continuous radial function by\n\\[\n s_1(y)=A_0+4-d_{g_0}(p_0,y).\n\\]\nIt is smooth away from $p_0$ and has round two-sphere level sets.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:6,&quot;ref&quot;:&quot;MT:ch12:12.2,MT:ch12:12.3&quot;},{&quot;id&quot;:&quot;da34bc1d727d&quot;,&quot;label&quot;:&quot;def:local-neck-surgery-data&quot;,&quot;title&quot;:&quot;Local neck-surgery data&quot;,&quot;display_title&quot;:&quot;Definition 1.8: Local neck-surgery data&quot;,&quot;body&quot;:&quot;Let $(N,g)$ be a $\\delta$-neck centered at $x_0$, let\n$Q=R_g(x_0)$, and let\n\\[\n \\rho\\colon S^2\\times(-\\delta^{-1},\\delta^{-1})\\longrightarrow N\n\\]\nbe its neck chart.  Assume $\\delta^{-1}&gt;A_0+4$.  Form $\\mathcal S$ by\ngluing $S^2\\times(-\\delta^{-1},4)$ to\n$B_{g_0}(p_0,A_0+4)$ through the cylindrical isometry on\n$S^2\\times(0,4)$.  The two axial coordinates glue to\n\\[\n s\\colon\\mathcal S\\longrightarrow(-\\delta^{-1},A_0+4].\n\\]\nFix smooth cutoffs $\\alpha\\colon[1,2]\\to[0,1]$ and\n$\\beta\\colon[A_0+4-r_0,A_0+4]\\to[0,1]$, equal to $1$ near their left\nendpoints and $0$ near their right endpoints.  Put\n\\[\n \\eta=1-2\\delta,\n \\qquad\n f(s)=\\begin{cases}\n 0,&amp;s\\le0,\\\\\n C_0\\delta e^{-q/s},&amp;s&gt;0.\n \\end{cases}\n\\]&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:7,&quot;ref&quot;:&quot;MT:ch13:13.1,MT:ch13:13.2&quot;},{&quot;id&quot;:&quot;9278327842d4&quot;,&quot;label&quot;:&quot;def:interpolating-surgery-metric&quot;,&quot;title&quot;:&quot;Interpolating surgery metric&quot;,&quot;display_title&quot;:&quot;Definition 1.9: Interpolating surgery metric&quot;,&quot;body&quot;:&quot;Set $A_r=A_0+4-r_0$ and $A&#x27;=A_0+4$.  On $\\mathcal S$, define\n\\[\n\\widehat g=\n\\begin{cases}\n e^{-2f}Q\\rho^*g,&amp;s\\le1,\\\\\n e^{-2f}\\bigl(\\alpha Q\\rho^*g+(1-\\alpha)\\eta g_0\\bigr),\n     &amp;1\\le s\\le2,\\\\\n e^{-2f}\\eta g_0,&amp;2\\le s\\le A_r,\\\\\n \\bigl(\\beta e^{-2f}+(1-\\beta)e^{-2f(A&#x27;)}\\bigr)\\eta g_0,\n     &amp;A_r\\le s\\le A&#x27;.\n\\end{cases}\n\\]\nThe metric at the original scale is\n\\[\n \\widetilde g=Q^{-1}\\widehat g.\n\\]&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:8,&quot;ref&quot;:&quot;MT:ch13:13.2&quot;},{&quot;id&quot;:&quot;efddbd482f53&quot;,&quot;label&quot;:&quot;lem:interpolating-surgery-metric-smooth&quot;,&quot;title&quot;:&quot;Smoothness of the interpolating surgery metric&quot;,&quot;display_title&quot;:&quot;Lemma 1.10: Smoothness of the interpolating surgery metric&quot;,&quot;body&quot;:&quot;The piecewise tensor $\\widehat g$ of\n\\ref{def:interpolating-surgery-metric} is a smooth Riemannian metric on\n$\\mathcal S$.  It equals $Q\\rho^*g$ on $s\\le0$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:9,&quot;ref&quot;:&quot;MT:ch13:13.2&quot;},{&quot;id&quot;:&quot;b0ef6688e9c2&quot;,&quot;label&quot;:&quot;lem:standard-cap-radial-collapse-nonexpanding&quot;,&quot;title&quot;:&quot;Nonexpansion of the standard radial collapse&quot;,&quot;display_title&quot;:&quot;Lemma 1.11: Nonexpansion of the standard radial collapse&quot;,&quot;body&quot;:&quot;In the data of \\ref{def:local-neck-surgery-data}, define\n$\\xi\\colon N\\to\\mathbb R^3$ by preserving the angular coordinate,\nsending $s&lt;A_0+4$ to the point at $g_0$-distance $A_0+4-s$ from $p_0$,\nand collapsing $s\\ge A_0+4$ to $p_0$.  For all sufficiently small\n$\\delta$,\n\\[\n \\xi\\colon(N,Qg)\\longrightarrow(\\mathbb R^3,\\eta g_0)\n\\]\nis distance nonincreasing.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:10,&quot;ref&quot;:&quot;MT:ch12:12.37,MT:ch13:13.1&quot;},{&quot;id&quot;:&quot;2afe5ab2efbb&quot;,&quot;label&quot;:&quot;lem:radial-surgery-map-nonexpanding&quot;,&quot;title&quot;:&quot;The radial surgery map is nonexpanding&quot;,&quot;display_title&quot;:&quot;Lemma 1.12: The radial surgery map is nonexpanding&quot;,&quot;body&quot;:&quot;Regard the map $\\xi$ of\n\\ref{lem:standard-cap-radial-collapse-nonexpanding} as a map from $N$\nto the surgery manifold $\\mathcal S$.  Then\n\\[\n \\xi\\colon(N,g)\\longrightarrow(\\mathcal S,\\widetilde g)\n\\]\nis distance nonincreasing.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:11,&quot;ref&quot;:&quot;MT:ch13:13.2&quot;},{&quot;id&quot;:&quot;faaa7ab069aa&quot;,&quot;label&quot;:&quot;lem:conformal-surgery-curvature-comparison&quot;,&quot;title&quot;:&quot;Conformal curvature comparison on the neck side&quot;,&quot;display_title&quot;:&quot;Lemma 1.13: Conformal curvature comparison on the neck side&quot;,&quot;body&quot;:&quot;Let $h$ be a metric $C^{\\lfloor1/\\delta\\rfloor}$-close to\n$h_0+ds^2$ on $S^2\\times I$, and put $\\widehat h=e^{-2f}h$ with\n$f=C_0\\delta e^{-q/s}$ for $s&gt;0$.  Choose $K$ so that every curvature\neigenvalue of a scale-one $\\delta$-neck is at least $-K\\delta$.\nThere are universal choices $q\\gg(A_0+4)^2$, $C_0=2Ke^q$, and\n$\\delta_*&gt;0$ such that, whenever $0&lt;\\delta\\le\\delta_*$ and $0&lt;s&lt;4$,\nthe scalar curvature of\n$\\widehat h$ is at least that of $h$, and the least eigenvalue of its\ncurvature operator is strictly larger than that of $h$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:12,&quot;ref&quot;:&quot;MT:ch13:13.5,MT:ch13:13.6,MT:ch13:13.7,MT:ch13:13.8,MT:ch13:13.9,MT:ch13:13.10,MT:ch13:13.11,MT:ch13:13.12&quot;},{&quot;id&quot;:&quot;d41a89faf926&quot;,&quot;label&quot;:&quot;lem:retained-neck-surgery-pinching&quot;,&quot;title&quot;:&quot;Curvature and pinching on the retained neck&quot;,&quot;display_title&quot;:&quot;Lemma 1.14: Curvature and pinching on the retained neck&quot;,&quot;body&quot;:&quot;For the universal choices in\n\\ref{lem:conformal-surgery-curvature-comparison} and all sufficiently\nsmall $\\delta$, the metric $\\widetilde g$ has positive sectional curvature\non $1\\le s&lt;4$.  Moreover, if the original neck satisfies, for some\n$t\\ge0$ and $X_g=\\max(0,-\\nu_g)$,\n\\[\n R_g\\ge-\\frac6{1+4t},\n \\qquad\n R_g\\ge2X_g\\bigl(\\log X_g+\\log(1+t)-3\\bigr)\n \\quad(X_g&gt;0),\n\\]\nthen the same inequalities hold for $\\widetilde g$ on $s&lt;4$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:13,&quot;ref&quot;:&quot;MT:ch13:13.13,MT:ch13:13.14&quot;},{&quot;id&quot;:&quot;b945feb50d33&quot;,&quot;label&quot;:&quot;lem:standard-cap-surgery-curvature&quot;,&quot;title&quot;:&quot;Curvature and pinching on the standard-cap side&quot;,&quot;display_title&quot;:&quot;Lemma 1.15: Curvature and pinching on the standard-cap side&quot;,&quot;body&quot;:&quot;For the same universal choices and all sufficiently small $\\delta$, the\nmetric $\\widetilde g$ has positive sectional curvature on\n$4\\le s\\le A_0+4$.  It satisfies the two curvature-pinching inequalities\nin \\ref{lem:retained-neck-surgery-pinching} there.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:14,&quot;ref&quot;:&quot;MT:ch13:13.2&quot;},{&quot;id&quot;:&quot;8ddd9ae35616&quot;,&quot;label&quot;:&quot;lem:local-surgery-standard-cap-convergence&quot;,&quot;title&quot;:&quot;Convergence of the surgery cap to the standard cap&quot;,&quot;display_title&quot;:&quot;Lemma 1.16: Convergence of the surgery cap to the standard cap&quot;,&quot;body&quot;:&quot;For every $\\delta&#x27;&#x27;&gt;0$ there is $\\delta_1&#x27;(\\delta&#x27;&#x27;)&gt;0$ such that, if\n$\\delta\\le\\delta_1&#x27;(\\delta&#x27;&#x27;)$, then $\\widehat g$ on\n$B_{\\widehat g}(p_0,(\\delta&#x27;&#x27;)^{-1})$ is $\\delta&#x27;&#x27;$-close in\n$C^{\\lfloor1/\\delta&#x27;&#x27;\\rfloor}$ to $g_0$ on the corresponding standard\nball.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:15,&quot;ref&quot;:&quot;MT:ch13:13.2&quot;},{&quot;id&quot;:&quot;b5fb8dfb64e4&quot;,&quot;label&quot;:&quot;thm:local-neck-surgery&quot;,&quot;title&quot;:&quot;Local surgery on a delta-neck&quot;,&quot;display_title&quot;:&quot;Theorem 1.17: Local surgery on a delta-neck&quot;,&quot;body&quot;:&quot;There are universal constants $C_0,q,R_0&lt;\\infty$ and $\\delta_0&#x27;&gt;0$ such\nthat, whenever $Q=R_g(x_0)\\ge R_0$ and\n$0&lt;\\delta\\le\\delta_0&#x27;$, the metric $\\widetilde g$ of\n\\ref{def:interpolating-surgery-metric} has the following properties.\n\\begin{enumerate}\n\\item Every curvature-pinching inequality in\n      \\ref{lem:retained-neck-surgery-pinching} that holds on the original\n      neck holds everywhere on $\\mathcal S$.\n\\item The sectional curvature is positive on\n      $1\\le s\\le A_0+4$.\n\\item The radial collapse map\n      $\\xi\\colon(N,g)\\to(\\mathcal S,\\widetilde g)$ is distance\n      nonincreasing.\n\\item The normalized pointed cap converges smoothly on bounded balls,\n      \\[\n        (\\mathcal S,\\widehat g,p_0)\\longrightarrow\n        (\\mathbb R^3,g_0,p_0),\n      \\]\n      as $\\delta\\to0$, in the quantitative sense of\n      \\ref{lem:local-surgery-standard-cap-convergence}.\n\\end{enumerate}&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:16,&quot;ref&quot;:&quot;MT:ch13:13.2&quot;}]},{&quot;id&quot;:&quot;canonical-neck-and-cap-topology&quot;,&quot;title&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;b68b762d3d15&quot;,&quot;label&quot;:&quot;def:canonical-cap&quot;,&quot;title&quot;:&quot;Canonical cap&quot;,&quot;display_title&quot;:&quot;Definition 1.18: Canonical cap&quot;,&quot;body&quot;:&quot;For $C&lt;\\infty$, a \\emph{$(C,\\epsilon)$-cap} is an open submanifold\n$\\mathcal C$ of a Riemannian three-manifold with an open\n$\\epsilon$-neck $N\\subset\\mathcal C$ such that:\n\\begin{enumerate}\n\\item $\\mathcal C$ is diffeomorphic to an open three-ball or to\n      $\\mathbb{RP}^3$ minus a point;\n\\item $\\overline Y=\\mathcal C\\setminus N$ is a compact submanifold with\n      boundary, its interior $Y$ is the \\emph{core}, and\n      $\\partial\\overline Y$ is a central sphere of an $\\epsilon$-neck;\n\\item $R&gt;0$ on $\\mathcal C$,\n      $\\sup_{x,y\\in\\mathcal C}R(y)/R(x)&lt;C$, and\n      $\\operatorname{diam}(\\mathcal C)\n       &lt;C(\\sup_{\\mathcal C}R)^{-1/2}$.\n\\end{enumerate}&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:17,&quot;ref&quot;:&quot;MT:ch9:9.72&quot;},{&quot;id&quot;:&quot;21df66602bb6&quot;,&quot;label&quot;:&quot;def:canonical-neck-cap-regions&quot;,&quot;title&quot;:&quot;Tubes, capped tubes, and neck fibrations&quot;,&quot;display_title&quot;:&quot;Definition 1.19: Tubes, capped tubes, and neck fibrations&quot;,&quot;body&quot;:&quot;An \\emph{$\\epsilon$-tube} is a submanifold diffeomorphic to\n$S^2\\times I$, for a nondegenerate interval $I$, covered by\n$\\epsilon$-necks whose central spheres are isotopic to the $S^2$ factors.\nAn open tube has no boundary.  A \\emph{$C$-capped $\\epsilon$-tube} is the\nconnected union of an open $\\epsilon$-tube and one $(C,\\epsilon)$-cap,\nglued along an end of each.  A \\emph{doubly $C$-capped\n$\\epsilon$-tube} has disjoint cap cores attached at both ends.  An\n\\emph{$\\epsilon$-fibration} is a closed connected $S^2$-bundle over\n$S^1$, covered by $\\epsilon$-necks whose central spheres are isotopic to\nthe fibers.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:18,&quot;ref&quot;:&quot;MT:ch9:9.81,MT:app:A.21,MT:app:A.25&quot;},{&quot;id&quot;:&quot;a7c743202d6a&quot;,&quot;label&quot;:&quot;def:balanced-neck-chain&quot;,&quot;title&quot;:&quot;Balanced chain of epsilon-necks&quot;,&quot;display_title&quot;:&quot;Definition 1.20: Balanced chain of epsilon-necks&quot;,&quot;body&quot;:&quot;A finite \\emph{chain of $\\epsilon$-necks} is a sequence\n$N_a,\\ldots,N_b$ with oriented axial coordinates such that\n$N_i\\cap N_{i+1}$ contains both\n\\[\n \\{s_{N_i}&gt;\\tfrac12\\epsilon^{-1}\\}\n \\quad\\hbox{and}\\quad\n \\{s_{N_{i+1}}&lt;-\\tfrac12\\epsilon^{-1}\\},\n\\]\nis contained in\n\\[\n \\{s_{N_i}&gt;-\\tfrac12\\epsilon^{-1}\\}\n \\cap\n \\{s_{N_{i+1}}&lt;\\tfrac12\\epsilon^{-1}\\},\n\\]\nand $N_i\\cap E_{N_a}^-=\\varnothing$ for $i&gt;a$.  An infinite chain indexed\nby an interval in $\\mathbb Z$ is one whose restriction to every finite\nsubinterval is a chain.  The chain is \\emph{balanced} if consecutive\ncenters $x_j,x_{j+1}$ satisfy\n\\[\n 0.99\\,r_{N_j}\\epsilon^{-1}\n \\le d(x_j,x_{j+1})\n \\le1.01\\,r_{N_j}\\epsilon^{-1}.\n\\]&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:19,&quot;ref&quot;:&quot;MT:app:A.12,MT:app:A.17&quot;},{&quot;id&quot;:&quot;1548fac8b0f3&quot;,&quot;label&quot;:&quot;lem:epsilon-neck-metric-control&quot;,&quot;title&quot;:&quot;Metric control in a small epsilon-neck&quot;,&quot;display_title&quot;:&quot;Lemma 1.21: Metric control in a small epsilon-neck&quot;,&quot;body&quot;:&quot;Write $d_N$ for the intrinsic distance induced by the restriction of the\nambient metric to $N$.  The estimates below are intrinsic to the neck; no\nambient no-shortcut assertion is being made.\nFor every $0&lt;\\alpha&lt;1/8$, all sufficiently small $\\epsilon$ have the\nfollowing property.  If $N$ is an $\\epsilon$-neck of scale $r_N$ centered\nat $x$, then scalar curvatures on $N$ lie between\n$(1-\\alpha)r_N^{-2}$ and $(1+\\alpha)r_N^{-2}$.  Neck spheres have\ndiameter at most $(1+\\alpha)\\sqrt2\\pi r_N$, and points with sufficiently\nlarge axial separation, namely\n$|s_N(q)-s_N(p)|\\ge\\epsilon^{-1}/100$ or\n$d_N(p,q)\\ge r_N\\epsilon^{-1}/100$, satisfy\n\\[\n (1-\\alpha)r_N|s_N(q)-s_N(p)|\n \\le d_N(p,q)\n \\le(1+\\alpha)r_N|s_N(q)-s_N(p)|.\n\\]\nIn particular, every path contained in $N$ and joining its two end regions has length at least\n$2(1-\\alpha)r_N\\epsilon^{-1}$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:20,&quot;ref&quot;:&quot;MT:app:A.2,MT:app:A.5&quot;},{&quot;id&quot;:&quot;23c07f13aad2&quot;,&quot;label&quot;:&quot;prop:overlapping-epsilon-necks&quot;,&quot;title&quot;:&quot;Overlap control for small epsilon-necks&quot;,&quot;display_title&quot;:&quot;Proposition 1.22: Overlap control for small epsilon-necks&quot;,&quot;body&quot;:&quot;For every $0&lt;\\alpha\\le10^{-2}$, all sufficiently small $\\epsilon$ have\nthe following property.  If two $\\epsilon$-necks $N,N&#x27;$ intersect in a region\nmeeting the middle nine-tenths of each neck, then\ntheir scales differ by a factor in $(1-\\alpha,1+\\alpha)$, their neck-sphere\ntangent planes make angle less than $\\alpha$ on the overlap, and their\noriented axial directions agree up to sign and an error less than\n$\\alpha$.  A neck sphere of one neck contained in the other is isotopic\nthere to a neck sphere.  If the overlap meets the middle nine-tenths of one\nneck, then $N\\cap N&#x27;$ contains neck spheres from both structures which are\nisotopic within the overlap, and the relevant component of the overlap is\ndiffeomorphic to $S^2\\times(0,1)$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;proposition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:21,&quot;ref&quot;:&quot;MT:app:A.11&quot;},{&quot;id&quot;:&quot;d3773f5a6e9c&quot;,&quot;label&quot;:&quot;lem:neck-chain-product&quot;,&quot;title&quot;:&quot;A neck chain is a product&quot;,&quot;display_title&quot;:&quot;Lemma 1.23: A neck chain is a product&quot;,&quot;body&quot;:&quot;The union $U$ of a finite or infinite chain of sufficiently small\n$\\epsilon$-necks is diffeomorphic to $S^2\\times(0,1)$, compatibly with\nthe isotopy classes of all neck spheres.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:22,&quot;ref&quot;:&quot;MT:app:A.13&quot;},{&quot;id&quot;:&quot;a0f8035a1904&quot;,&quot;label&quot;:&quot;lem:infinite-neck-chain-frontier&quot;,&quot;title&quot;:&quot;An infinite neck-chain end has no frontier&quot;,&quot;display_title&quot;:&quot;Lemma 1.24: An infinite neck-chain end has no frontier&quot;,&quot;body&quot;:&quot;Let $N_0,N_1,\\ldots$ be a chain of sufficiently small\n$\\epsilon$-necks in $M$, and put $U=\\bigcup_{j\\ge0}N_j$.  Then the\nfrontier of $U$ in $M$ is exactly the frontier of the negative end of\n$N_0$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:23,&quot;ref&quot;:&quot;MT:app:A.15&quot;},{&quot;id&quot;:&quot;e0785f0ad6be&quot;,&quot;label&quot;:&quot;lem:balanced-neck-chain-extension&quot;,&quot;title&quot;:&quot;Extension of a balanced neck chain&quot;,&quot;display_title&quot;:&quot;Lemma 1.25: Extension of a balanced neck chain&quot;,&quot;body&quot;:&quot;For all sufficiently small $\\epsilon$, let\n$N_a,\\ldots,N_b$ be a balanced chain whose central spheres separate $M$.\nIf a point in the frontier of its positive end is the center of an\n$\\epsilon$-neck $N$, then, after reversing $N$ if necessary,\n$N_a,\\ldots,N_b,N$ is a balanced chain.  The analogous assertion holds at\nthe negative end.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:24,&quot;ref&quot;:&quot;MT:app:A.17,MT:app:A.18&quot;},{&quot;id&quot;:&quot;13cdca21cc2c&quot;,&quot;label&quot;:&quot;thm:separating-neck-centers-form-tube&quot;,&quot;title&quot;:&quot;Separating neck centers lie in an epsilon-tube&quot;,&quot;display_title&quot;:&quot;Theorem 1.26: Separating neck centers lie in an epsilon-tube&quot;,&quot;body&quot;:&quot;There is $\\epsilon_0&gt;0$ such that the following holds for\n$0&lt;\\epsilon\\le\\epsilon_0$.  Let $X$ be a connected subset of a Riemannian\nthree-manifold $M$.  Suppose every $x\\in X$ is the center of an\n$\\epsilon$-neck and every corresponding central sphere separates $M$.\nThen a subcollection of these necks, after reversing axial coordinates when\nnecessary, is a balanced chain whose union contains $X$.  Consequently\n$X$ lies in an $\\epsilon$-tube.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:25,&quot;ref&quot;:&quot;MT:app:A.19&quot;},{&quot;id&quot;:&quot;8b5c645f958d&quot;,&quot;label&quot;:&quot;lem:no-infinite-nested-canonical-caps&quot;,&quot;title&quot;:&quot;No infinite nested chain of canonical caps&quot;,&quot;display_title&quot;:&quot;Lemma 1.27: No infinite nested chain of canonical caps&quot;,&quot;body&quot;:&quot;For fixed $C$ and sufficiently small $\\epsilon$, there is no chain of\n$(C,\\epsilon)$-caps\n\\[\n C_0\\subset C_1\\subset\\cdots\n\\]\nsuch that the closure of the core of $C_i$ meets\n$\\operatorname{Fr}_M(C_{i-1})$ for every $i\\ge1$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:26,&quot;ref&quot;:&quot;MT:app:A.22&quot;},{&quot;id&quot;:&quot;4062bfa79032&quot;,&quot;label&quot;:&quot;lem:isotopic-cap-gluing-sphere&quot;,&quot;title&quot;:&quot;An isotopic cap-gluing sphere determines a component&quot;,&quot;display_title&quot;:&quot;Lemma 1.28: An isotopic cap-gluing sphere determines a component&quot;,&quot;body&quot;:&quot;Let $X\\subset M$ be connected.  Let $\\widetilde C$ be a cap or a finite\ncapped tube containing a point of $X$, and let $C&#x27;$ be a\n$(C,\\epsilon)$-cap whose core contains a point of\n$X\\cap\\operatorname{Fr}_M(\\widetilde C)$.  Let $N&#x27;$ be the neck end of\n$C&#x27;$, oriented away from its core.  If a two-sphere\n$\\Sigma\\subset N&#x27;\\cap\\widetilde C$ lies in the closed positive half of\n$N&#x27;$ and is isotopic in $N&#x27;$ to its central sphere, then\n$\\widetilde C\\cup C&#x27;$ is a component of $M$ containing $X$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:27,&quot;ref&quot;:&quot;MT:app:A.24&quot;},{&quot;id&quot;:&quot;63e8303c1711&quot;,&quot;label&quot;:&quot;lem:adjacent-canonical-caps-form-component&quot;,&quot;title&quot;:&quot;Adjacent canonical caps form an ambient component&quot;,&quot;display_title&quot;:&quot;Lemma 1.29: Adjacent canonical caps form an ambient component&quot;,&quot;body&quot;:&quot;Let $X\\subset M$ be connected, and let $\\widetilde C$ be obtained from a\n$(C,\\epsilon)$-cap $C_0$ by adjoining a finite balanced chain to its neck\nend.  Suppose $\\widetilde C$ contains a point of $X$.  Let $C&#x27;$ be a\n$(C,\\epsilon)$-cap whose core contains a point of\n$X\\cap\\operatorname{Fr}_M(\\widetilde C)$, and assume\n$C_0\\nsubseteq C&#x27;$.  Then $\\widetilde C\\cup C&#x27;$ is a component of $M$\ncontaining $X$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:28,&quot;ref&quot;:&quot;MT:app:A.23&quot;},{&quot;id&quot;:&quot;356e0995b890&quot;,&quot;label&quot;:&quot;thm:cap-and-neck-cover-classification&quot;,&quot;title&quot;:&quot;Connected sets covered by canonical cap cores and neck centers&quot;,&quot;display_title&quot;:&quot;Theorem 1.30: Connected sets covered by canonical cap cores and neck centers&quot;,&quot;body&quot;:&quot;For every $C&lt;\\infty$ and all sufficiently small $\\epsilon&gt;0$, let $X$ be\na connected subset of a Riemannian three-manifold $M$.  Suppose every\npoint of $X$ is either the center of an $\\epsilon$-neck or lies in the core\nof a $(C,\\epsilon)$-cap.  Then at least one of the following holds:\n\\begin{enumerate}\n\\item $X$ lies in a component which is the union of two\n      $(C,\\epsilon)$-caps and is diffeomorphic to\n      $S^3$, $\\mathbb{RP}^3$, or\n      $\\mathbb{RP}^3\\#\\mathbb{RP}^3$;\n\\item $X$ lies in a doubly $C$-capped $\\epsilon$-tube component of one\n      of those three diffeomorphism types;\n\\item $X$ lies in one $(C,\\epsilon)$-cap;\n\\item $X$ lies in a $C$-capped $\\epsilon$-tube;\n\\item $X$ lies in an $\\epsilon$-tube;\n\\item $X$ lies in an $\\epsilon$-fibration component covered by\n      $\\epsilon$-necks.\n\\end{enumerate}&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:29,&quot;ref&quot;:&quot;MT:app:A.21&quot;},{&quot;id&quot;:&quot;5c16aa7c0849&quot;,&quot;label&quot;:&quot;thm:canonical-neck-cap-topology&quot;,&quot;title&quot;:&quot;Topology of a manifold covered by canonical caps and necks&quot;,&quot;display_title&quot;:&quot;Theorem 1.31: Topology of a manifold covered by canonical caps and necks&quot;,&quot;body&quot;:&quot;Let $(M,g)$ be a connected Riemannian three-manifold.  For fixed\n$C&lt;\\infty$ and sufficiently small $\\epsilon&gt;0$, suppose each point of\n$M$ is either the center of an $\\epsilon$-neck or belongs to the core of a\n$(C,\\epsilon)$-cap.  Exactly one of the following types occurs:\n\\begin{enumerate}\n\\item $M$ is diffeomorphic to $S^3$, $\\mathbb{RP}^3$, or\n      $\\mathbb{RP}^3\\#\\mathbb{RP}^3$, and is the union of two caps or a\n      doubly capped $\\epsilon$-tube;\n\\item $M$ is diffeomorphic to $\\mathbb R^3$ or to\n      $\\mathbb{RP}^3\\setminus\\{p\\}$, and is a cap or a capped\n      $\\epsilon$-tube;\n\\item $M$ is diffeomorphic to $S^2\\times\\mathbb R$ and is an\n      $\\epsilon$-tube;\n\\item $M$ is diffeomorphic to an $S^2$-bundle over $S^1$ and is an\n      $\\epsilon$-fibration.\n\\end{enumerate}&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:30,&quot;ref&quot;:&quot;MT:app:A.25&quot;}]}]},{&quot;id&quot;:&quot;analytic-control-noncollapsing&quot;,&quot;title&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;sections&quot;:[{&quot;id&quot;:&quot;surgery-flows-and-fixed-controls&quot;,&quot;title&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;5d564488bf3b&quot;,&quot;label&quot;:&quot;def:ricci-flow-with-surgery&quot;,&quot;title&quot;:&quot;Ricci flow with surgery&quot;,&quot;display_title&quot;:&quot;Definition 2.1: Ricci flow with surgery&quot;,&quot;body&quot;:&quot;A \\emph{Ricci flow with surgery} is a pair $(\\mathcal M,G)$ with the\nfollowing structure.  The surgery spacetime $\\mathcal M$ has a continuous\ntime function $\\mathbf t\\colon\\mathcal M\\to I$, a time vector field $\\chi$\nwith $\\chi(\\mathbf t)=1$, and the ordinary, one-sided, and surgery charts\nwhich distinguish smooth, exposed, and singular points.  Every slice\n$M_t=\\mathbf t^{-1}(t)$ is a smooth manifold, and the horizontal bundle is\n$\\mathcal H=\\ker(d\\mathbf t)$.  The tensor $G$ is a smooth metric on\n$\\mathcal H$ and satisfies\n\\[\n \\mathcal L_\\chi G=-2\\operatorname{Ric}_G.\n\\]\nAt an exposed point or an endpoint of $I$, the Lie derivative is one-sided.\nThe flow is three-dimensional when its slices are three-manifolds.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:31,&quot;ref&quot;:&quot;MT:ch14:14.8&quot;},{&quot;id&quot;:&quot;a0d6ae4e1672&quot;,&quot;label&quot;:&quot;def:surgery-flow-noncollapsing&quot;,&quot;title&quot;:&quot;Noncollapsing for a surgery flow&quot;,&quot;display_title&quot;:&quot;Definition 2.2: Noncollapsing for a surgery flow&quot;,&quot;body&quot;:&quot;Let $(\\mathcal M,G)$ be a three-dimensional Ricci flow with surgery.  The\nbackward parabolic neighborhood $P(x,t,\\rho,-\\rho^2)$ exists when every\npoint of $B_{g(t)}(x,\\rho)$ has a backward $\\chi$-flow line of length\n$\\rho^2$, and these flow lines give a product embedding of the ball over\n$[t-\\rho^2,t]$.  For $\\kappa,r_0&gt;0$, the flow is\n\\emph{$\\kappa$-noncollapsed on scales at most $r_0$} if\n\\[\n P(x,t,\\rho,-\\rho^2)\\text{ exists},\\qquad\n |\\operatorname{Rm}|\\le \\rho^{-2}\\text{ on }P\n \\quad\\Longrightarrow\\quad\n \\operatorname{Vol}_{g(t)}B(x,t,\\rho)\\ge\\kappa\\rho^3\n\\]\nwhenever $0&lt;\\rho\\le r_0$.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:32,&quot;ref&quot;:&quot;MT:ch14:14.14,MT:ch14:14.15&quot;},{&quot;id&quot;:&quot;47d5774c640e&quot;,&quot;label&quot;:&quot;def:strong-canonical-neighborhood-control&quot;,&quot;title&quot;:&quot;Strong canonical-neighborhood control&quot;,&quot;display_title&quot;:&quot;Definition 2.3: Strong canonical-neighborhood control&quot;,&quot;body&quot;:&quot;Fix $C&lt;\\infty$, $0&lt;\\epsilon&lt;1/2$, and $r&gt;0$.  A three-dimensional Ricci\nflow with surgery satisfies the \\emph{strong\n$(C,\\epsilon)$-canonical-neighborhood assumption with parameter $r$} if\nevery point $x$ with $R(x)\\ge r^{-2}$ has one of the following\nneighborhoods at the curvature scale $R(x)^{-1/2}$:\n\\begin{enumerate}\n\\item a strong $\\epsilon$-neck centered at $x$, whose parabolic rescaling by\n      $R(x)$ is $\\epsilon$-close in\n      $C^{\\lfloor\\epsilon^{-1}\\rfloor}$ to the shrinking round cylinder on\n      normalized times $(-1,0]$;\n\\item a $(C,\\epsilon)$-cap whose core contains $x$, with $C$-comparable\n      scalar curvatures and scale-normalized diameter and volume bounded by\n      $C$, together with a uniform core volume lower bound and the\n      scale-invariant derivative bounds for $R$;\n\\item a compact positively curved $C$-component containing $x$, with\n      least sectional curvature at least $C^{-1}\\sup R$ and diameter between\n      $C^{-1}(\\sup R)^{-1/2}$ and $C(\\inf R)^{-1/2}$;\n\\item an $\\epsilon$-round component containing $x$: a compact connected\n      component $(M,g)$ for which there are $R&gt;0$, a compact\n      constant-curvature-one manifold $(Z,g_0)$, and a diffeomorphism\n      $\\varphi:Z\\to M$ such that $\\varphi^*(Rg)$ is $\\epsilon$-close to $g_0$\n      in the $C^{\\lfloor\\epsilon^{-1}\\rfloor}$ topology.\n\\end{enumerate}\nOnly the first alternative is a spacetime neighborhood.  The other\nalternatives lie in the slice $M_{\\mathbf t(x)}$.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:33,&quot;ref&quot;:&quot;MT:ch9:9.76,MT:ch14:14.18&quot;},{&quot;id&quot;:&quot;e4211b5eebba&quot;,&quot;label&quot;:&quot;def:controlled-surgery-parameters&quot;,&quot;title&quot;:&quot;Controlled surgery parameters&quot;,&quot;display_title&quot;:&quot;Definition 2.4: Controlled surgery parameters&quot;,&quot;body&quot;:&quot;Fix $\\epsilon&gt;0$ sufficiently small and choose $C$ larger than the uniform\ncanonical-neighborhood constants for the standard solution and for\nthree-dimensional $\\kappa$-solutions.  Put $t_0=2^{-5}$ and\n$T_i=2^it_0$.  The control data are positive nonincreasing sequences\n\\[\n \\mathbf r=(r_i)_{i\\ge0},\\qquad\n \\mathbf K=(\\kappa_i)_{i\\ge0},\\qquad\n \\boldsymbol\\delta=(\\delta_i)_{i\\ge0},\n \\qquad r_0=\\epsilon,\n\\]\nand positive nonincreasing piecewise constant functions $r(t)$ and\n$\\kappa(t)$ with values $r_{i+1}$ and $\\kappa_{i+1}$ on\n$[T_i,T_{i+1})$.  A positive nonincreasing surgery-control function\n$\\bar\\delta(t)$ is required to satisfy\n$\\bar\\delta(t)\\le\\delta_{i+1}$ on that interval.  Define\n\\[\n \\rho(t)=\\bar\\delta(t)r(t),\n \\qquad\n h(t)=h(\\rho(t),\\bar\\delta(t))\n \\le \\bar\\delta(t)^2r(t),\n\\]\nwhere $h$ is the neck scale at which the local surgery construction applies.\nAt a surgery time $t$, every cutting sphere is the central sphere of a strong\n$\\bar\\delta(t)$-neck of scalar curvature $h(t)^{-2}$.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:34,&quot;ref&quot;:&quot;MT:ch15:15.5,MT:ch15:15.6,MT:ch15:15.7&quot;},{&quot;id&quot;:&quot;081e62843e0c&quot;,&quot;label&quot;:&quot;def:controlled-ricci-flow-with-surgery&quot;,&quot;title&quot;:&quot;Controlled Ricci flow with surgery&quot;,&quot;display_title&quot;:&quot;Definition 2.5: Controlled Ricci flow with surgery&quot;,&quot;body&quot;:&quot;For the fixed $C$, $\\epsilon$, and control functions, a\n\\emph{controlled Ricci flow with surgery} is a three-dimensional Ricci flow\nwith surgery satisfying the following conditions.\n\\begin{enumerate}\n\\item Every slice is compact and contains no embedded $\\mathbb{RP}^2$ with\n      trivial normal bundle.\n\\item Singular times form a discrete subset of the time interval.\n\\item Time zero is initial, and every component of $(M_0,g(0))$ is\n      normalized: $|\\operatorname{Rm}|\\le1$ and every unit ball has at least\n      half the Euclidean unit-ball volume.\n\\item At a singular time $t$, the exposed region $E_t$ is a finite disjoint\n      union of three-balls, and\n      $M_t=C_t\\cup_{\\Sigma_t}E_t$ with $\\Sigma_t=\\partial E_t$ a finite\n      union of two-spheres.\n\\item Every component of $\\Sigma_t$ is a central sphere at the prescribed\n      scale in the maximal presurgery extension to $t$.\n\\item Immediately before $t$, every point which disappears has a strong\n      $(C,\\epsilon)$-canonical neighborhood.\n\\item Between consecutive singular times the ordinary Ricci flow is maximal.\n\\end{enumerate}\nThe flow is additionally required to have curvature pinched toward positive\nand to satisfy the strong canonical-neighborhood assumption with parameter\n$r(t)$.  Its stagewise noncollapsing condition is that, whenever\n$0&lt;\\rho\\le\\epsilon$ and\n$P(x,t,\\rho,-\\rho^2)$ exists with\n$|\\operatorname{Rm}|\\le\\rho^{-2}$, either\n\\[\n \\operatorname{Vol}_{g(t)}B(x,t,\\rho)\\ge\\kappa(t)\\rho^3\n\\]\nor the component of $M_t$ containing $x$ has positive sectional curvature.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:35,&quot;ref&quot;:&quot;MT:ch15:15.9,MT:ch15:15.11&quot;},{&quot;id&quot;:&quot;606f02fa7ec9&quot;,&quot;label&quot;:&quot;thm:local-volume-injectivity-radius-control&quot;,&quot;title&quot;:&quot;Local volume and injectivity-radius control&quot;,&quot;display_title&quot;:&quot;Theorem 2.6: Local volume and injectivity-radius control&quot;,&quot;body&quot;:&quot;Fix $n$, $K&lt;\\infty$, $r_0&gt;0$, and $v_0&gt;0$.  There are positive constants\n\\[\n v_*=v_*(n,K,r_0,v_0),\n \\qquad \\iota_*=\\iota_*(n,K,r_0,v_0),\n\\]\nwith the following property.  If $(M^n,g)$ is complete,\n$|\\operatorname{Rm}|\\le K$ on $B(p,r_0)$, and\n$\\operatorname{Vol}B(p,r_0)\\ge v_0$, then, for\n$0&lt;s\\le\\min\\{r_0,K^{-1/2}\\}$,\n\\[\n \\operatorname{Vol}B(p,s)\\ge v_*s^n,\n \\qquad\n \\operatorname{inj}_g(p)\\ge\n \\iota_*\\min\\{r_0,K^{-1/2}\\}.\n\\]\nThe convention is that $K^{-1/2}=\\infty$ when $K=0$.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:36,&quot;ref&quot;:&quot;MT:ch1:1.35,MT:ch1:1.36,MT:ch5:5.10&quot;},{&quot;id&quot;:&quot;ff8bc7c2e43e&quot;,&quot;label&quot;:&quot;thm:normalized-short-time-ricci-flow&quot;,&quot;title&quot;:&quot;Normalized short-time flow&quot;,&quot;display_title&quot;:&quot;Theorem 2.7: Normalized short-time flow&quot;,&quot;body&quot;:&quot;There is a universal $\\kappa_0&gt;0$ such that every normalized compact\nthree-manifold $(M,g_0)$ admits a unique Ricci flow $g(t)$ on\n$[0,2^{-5}]$ with $g(0)=g_0$.  On this interval\n\\[\n |\\operatorname{Rm}_{g(t)}|\\le2,\n \\qquad\n \\operatorname{Vol}_{g(t)}B_{g(t)}(x,\\rho)\\ge\\kappa_0\\rho^3\n \\quad(0&lt;\\rho\\le1).\n\\]\nConsequently this interval has no surgery time and supplies the initial\nstage of a controlled Ricci flow with surgery.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:37,&quot;ref&quot;:&quot;MT:ch3:3.11,MT:ch4:4.11,MT:ch5:5.16,MT:ch15:15.1&quot;}]},{&quot;id&quot;:&quot;reduced-geometry&quot;,&quot;title&quot;:&quot;Reduced Geometry&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;cced2941ff59&quot;,&quot;label&quot;:&quot;def:reduced-length&quot;,&quot;title&quot;:&quot;Reduced length&quot;,&quot;display_title&quot;:&quot;Definition 2.8: Reduced length&quot;,&quot;body&quot;:&quot;Fix a smooth point $(x,T)$ and write backward time as $\\tau=T-t$.  For a\npiecewise smooth backward path $\\gamma\\colon[0,\\bar\\tau]\\to\\mathcal M$\nwith $\\gamma(0)=x$, define\n\\[\n \\mathcal L(\\gamma)=\n \\int_0^{\\bar\\tau}\\sqrt\\tau\n \\bigl(R(\\gamma(\\tau))+|\\dot\\gamma(\\tau)|^2\\bigr)\\,d\\tau.\n\\]\nFor a point $y$ at backward time $\\bar\\tau$, let\n$L_x(y,\\bar\\tau)$ be the infimum of $\\mathcal L$ over such paths and put\n\\[\n l_x(y,\\bar\\tau)=\\frac{L_x(y,\\bar\\tau)}{2\\sqrt{\\bar\\tau}}.\n\\]\nThese quantities are used only on domains on which every competing path\nstays in the smooth locus.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Reduced Geometry&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:38,&quot;ref&quot;:&quot;MT:ch6:6.2,MT:ch6:6.45&quot;},{&quot;id&quot;:&quot;8b2abffda757&quot;,&quot;label&quot;:&quot;def:reduced-exponential-map&quot;,&quot;title&quot;:&quot;Reduced exponential map and injectivity domain&quot;,&quot;display_title&quot;:&quot;Definition 2.9: Reduced exponential map and injectivity domain&quot;,&quot;body&quot;:&quot;An $\\mathcal L$-geodesic from $(x,T)$ is a critical point of\n$\\mathcal L$.  Its initial vector is\n\\[\n v=\\lim_{\\tau\\downarrow0}\\sqrt\\tau\\,\\dot\\gamma(\\tau)\n \\in T_xM_T.\n\\]\nThe reduced exponential map is\n$\\mathcal L\\exp_x^\\tau(v)=\\gamma_v(\\tau)$ whenever this geodesic exists.\nIts injectivity set $\\mathcal D_x^\\tau$ consists of those $v$ for which\n$\\gamma_v|_{[0,\\tau]}$ is the unique minimizing $\\mathcal L$-geodesic to its\nendpoint and has no nonzero $\\mathcal L$-Jacobi field vanishing at both ends.\nThe image $\\Omega_x^\\tau=\\mathcal L\\exp_x^\\tau(\\mathcal D_x^\\tau)$ is the\nreduced injectivity domain.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Reduced Geometry&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:39,&quot;ref&quot;:&quot;MT:ch6:6.17,MT:ch6:6.25,MT:ch6:6.26&quot;},{&quot;id&quot;:&quot;bf415d488cc7&quot;,&quot;label&quot;:&quot;def:reduced-volume&quot;,&quot;title&quot;:&quot;Reduced volume&quot;,&quot;display_title&quot;:&quot;Definition 2.10: Reduced volume&quot;,&quot;body&quot;:&quot;When the reduced injectivity domain has full measure in the time slice, the\nreduced volume based at $(x,T)$ is\n\\[\n \\widetilde V_x(\\tau)=\n \\int_{M_{T-\\tau}}(4\\pi\\tau)^{-3/2}e^{-l_x(y,\\tau)}\n \\,d\\operatorname{vol}_{g(T-\\tau)}(y).\n\\]\nEquivalently, if $J(v,\\tau)$ is the Jacobian of\n$\\mathcal L\\exp_x^\\tau$, then\n\\[\n \\widetilde V_x(\\tau)=\n \\int_{\\mathcal D_x^\\tau}(4\\pi\\tau)^{-3/2}\n e^{-l_x(\\mathcal L\\exp_x^\\tau(v),\\tau)}J(v,\\tau)\\,dv.\n\\]&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Reduced Geometry&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:40,&quot;ref&quot;:&quot;MT:ch6:6.70,MT:ch6:6.71&quot;},{&quot;id&quot;:&quot;7965e450f6fa&quot;,&quot;label&quot;:&quot;lem:reduced-length-support-inequality&quot;,&quot;title&quot;:&quot;Upper support inequality for reduced length&quot;,&quot;display_title&quot;:&quot;Lemma 2.11: Upper support inequality for reduced length&quot;,&quot;body&quot;:&quot;On a smooth bounded-curvature Ricci-flow domain, reduced length is smooth\nbefore the reduced cut locus and satisfies, in dimension three,\n\\[\n \\partial_\\tau l+\\Delta l\\le \\frac{3/2-l}{\\tau}.\n\\]\nAt an arbitrary endpoint of a minimizing $\\mathcal L$-geodesic and for every\n$\\eta&gt;0$, there is a smooth upper support $l_\\eta$ which agrees with $l$ at\nthat endpoint and satisfies\n\\[\n \\partial_\\tau l_\\eta+\\Delta l_\\eta\n \\le \\frac{3/2-l_\\eta}{\\tau}+\\eta.\n\\]&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Reduced Geometry&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:41,&quot;ref&quot;:&quot;MT:ch6:6.4,MT:ch6:6.13,MT:ch6:6.49,MT:ch6:6.51,MT:ch7:7.8&quot;},{&quot;id&quot;:&quot;13fdfedbc3df&quot;,&quot;label&quot;:&quot;lem:minimum-reduced-length-comparison&quot;,&quot;title&quot;:&quot;Minimum reduced-length comparison&quot;,&quot;display_title&quot;:&quot;Lemma 2.12: Minimum reduced-length comparison&quot;,&quot;body&quot;:&quot;Suppose that on every slice of a smooth backward-time interval the minimum\n\\[\n m(\\tau)=\\min_y l_x(y,\\tau)\n\\]\nis attained, and that the union of the minimizing sets over compact\nsubintervals is compact.  Then $m$ is continuous and\n\\[\n D^+m(\\tau)\\le\\frac{3/2-m(\\tau)}{\\tau}.\n\\]\nIf $\\limsup_{\\tau\\downarrow0}m(\\tau)\\le3/2$, then\n$m(\\tau)\\le3/2$ throughout the interval.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Reduced Geometry&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:42,&quot;ref&quot;:&quot;MT:ch7:7.10,MT:ch7:7.11,MT:ch7:7.12&quot;},{&quot;id&quot;:&quot;46b654fc3e42&quot;,&quot;label&quot;:&quot;thm:reduced-exponential-regularity&quot;,&quot;title&quot;:&quot;Regularity of the reduced exponential map&quot;,&quot;display_title&quot;:&quot;Theorem 2.13: Regularity of the reduced exponential map&quot;,&quot;body&quot;:&quot;Assume that minimizing $\\mathcal L$-geodesics to an open set remain in a\nsmooth region on which $|\\operatorname{Ric}|$ and $|\\nabla R|$ are bounded.\nThen $\\mathcal D_x^\\tau$ is open,\n\\[\n \\mathcal L\\exp_x^\\tau\\colon\\mathcal D_x^\\tau\n \\longrightarrow\\Omega_x^\\tau\n\\]\nis a diffeomorphism, and $l_x(\\cdot,\\tau)$ is smooth on\n$\\Omega_x^\\tau$.  The complement of $\\Omega_x^\\tau$ in the selected open\nset has measure zero.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Reduced Geometry&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:43,&quot;ref&quot;:&quot;MT:ch6:6.18,MT:ch6:6.28,MT:ch6:6.56,MT:ch6:6.67&quot;},{&quot;id&quot;:&quot;841228a21206&quot;,&quot;label&quot;:&quot;lem:reduced-density-monotonicity&quot;,&quot;title&quot;:&quot;Reduced-density monotonicity&quot;,&quot;display_title&quot;:&quot;Lemma 2.14: Reduced-density monotonicity&quot;,&quot;body&quot;:&quot;Let $v\\in\\mathcal D_x^\\tau$ and let $J(v,\\tau)$ be the Jacobian of the\nreduced exponential map.  Along the corresponding minimizing\n$\\mathcal L$-geodesic,\n\\[\n \\frac d{d\\tau}\\left((4\\pi\\tau)^{-3/2}e^{-l}J\\right)\\le0.\n\\]\nConsequently the reduced volume is nonincreasing in backward time as long as\nall minimizing curves under consideration remain in one smooth domain.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Reduced Geometry&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:44,&quot;ref&quot;:&quot;MT:ch6:6.50,MT:ch6:6.80,MT:ch6:6.81&quot;},{&quot;id&quot;:&quot;1686838a0532&quot;,&quot;label&quot;:&quot;thm:reduced-volume-transfer&quot;,&quot;title&quot;:&quot;Quantitative reduced-volume transfer&quot;,&quot;display_title&quot;:&quot;Theorem 2.15: Quantitative reduced-volume transfer&quot;,&quot;body&quot;:&quot;Let $x$ be the terminal point at time $T$, let $0&lt;\\bar\\tau&lt;T$, and let\n$E$ be a measurable subset of the regular reduced-exponential image at\nbackward time $\\bar\\tau$.  Let\n\\[\n d\\mu_{\\bar\\tau}(y)=(4\\pi\\bar\\tau)^{-3/2}\n e^{-l_x(y,\\bar\\tau)}\\,d\\operatorname{Vol}_{g(T-\\bar\\tau)}(y)\n \\quad (y\\in E).\n\\]\nAssume the minimizing curves defining $l_x$ remain in one compact smooth\ndomain.  Suppose there is a measurable endpoint map\n$F:E\\to M_T$ and that the push-forward $\\mu_T=F_*\\mu_{\\bar\\tau}$ is\nabsolutely continuous on a terminal ball, with density $\\theta_T$ satisfying\n \\[\n \\operatorname{Vol}_{g(T-\\bar\\tau)}(E)\\ge V&gt;0,\n \\qquad l_x(\\cdot,\\bar\\tau)\\le L_0\\quad\\hbox{on }E,\n \\]\nand\n\\[\n \\operatorname{supp}\\mu_T\\subset B_{g(T)}(x,\\rho),\n \\qquad 0\\le\\theta_T\\le C\\rho^{-3}\\quad\\hbox{a.e.}\n \\]\nThen\n\\[\n \\operatorname{Vol}_{g(T)}B_{g(T)}(x,\\rho)\n \\ge C^{-1}(4\\pi\\bar\\tau)^{-3/2}e^{-L_0}V\\,\\rho^3.\n\\]&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Reduced Geometry&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:45,&quot;ref&quot;:&quot;MT:ch6:6.71,MT:ch6:6.80,MT:ch8:8.1&quot;}]},{&quot;id&quot;:&quot;local-curvature-and-neck-estimates&quot;,&quot;title&quot;:&quot;Local Curvature and Neck Estimates&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;0714466fa4ba&quot;,&quot;label&quot;:&quot;thm:local-ricci-flow-derivative-estimates&quot;,&quot;title&quot;:&quot;Local Ricci-flow derivative estimates&quot;,&quot;display_title&quot;:&quot;Theorem 2.16: Local Ricci-flow derivative estimates&quot;,&quot;body&quot;:&quot;For every $m\\ge0$ there is $C_m&lt;\\infty$ with the following property.  If a\nRicci flow has a relatively compact parabolic neighborhood\n$P(x,t,r,-r^2)$ on which $|\\operatorname{Rm}|\\le r^{-2}$, then\n\\[\n |\\nabla^m\\operatorname{Rm}|\n \\le C_m r^{-m-2}\n\\]\non $P(x,t,r/2,-r^2/2)$.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Local Curvature and Neck Estimates&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:46,&quot;ref&quot;:&quot;MT:ch3:3.28,MT:ch3:3.33&quot;},{&quot;id&quot;:&quot;018d5ec3ba13&quot;,&quot;label&quot;:&quot;thm:strong-curvature-tensor-maximum-principle&quot;,&quot;title&quot;:&quot;Strong maximum principle for curvature tensors&quot;,&quot;display_title&quot;:&quot;Theorem 2.17: Strong maximum principle for curvature tensors&quot;,&quot;body&quot;:&quot;Let $\\mathcal T$ solve\n$\\partial_t\\mathcal T=\\Delta\\mathcal T+\\Psi(\\mathcal T)$ on a compact\nparabolic domain, and let $K$ be a fiberwise convex, parallel-invariant set.\nIf $\\Psi$ lies in the tangent cone of $K$ along $\\partial K$, and the initial\nand parabolic-boundary values lie in $K$, then $\\mathcal T$ remains in $K$.\nIf an invariant supporting functional is strictly positive at one interior\ninitial point, it is strictly positive at every later interior point.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Local Curvature and Neck Estimates&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:47,&quot;ref&quot;:&quot;MT:ch4:4.17,MT:ch4:4.18&quot;},{&quot;id&quot;:&quot;eea9e1e3c571&quot;,&quot;label&quot;:&quot;thm:curvature-null-splitting&quot;,&quot;title&quot;:&quot;Splitting at a curvature null direction&quot;,&quot;display_title&quot;:&quot;Theorem 2.18: Splitting at a curvature null direction&quot;,&quot;body&quot;:&quot;Let a connected three-dimensional Ricci flow have nonnegative curvature\noperator.  If its curvature operator has a null eigenvector at a positive\ntime, then the tangent Ricci-null line distribution is locally parallel and time-independent,\nand every connected parabolic neighborhood on which it is defined locally\nsplits as a surface flow times a flat interval.  If the time slices are\ncomplete, the universal cover splits isometrically as a Ricci flow on a\nsurface times a flat line.  Every quotient is obtained from this product by\na group preserving the parallel line distribution.  In\nparticular, if the scalar curvature vanishes at one positive-time point,\nthen the flow is flat on that connected spacetime neighborhood.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Local Curvature and Neck Estimates&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:48,&quot;ref&quot;:&quot;MT:ch4:4.19,MT:ch4:4.20,MT:ch4:4.21&quot;},{&quot;id&quot;:&quot;e73998aba973&quot;,&quot;label&quot;:&quot;thm:ancient-scalar-curvature-monotonicity&quot;,&quot;title&quot;:&quot;Ancient scalar-curvature monotonicity&quot;,&quot;display_title&quot;:&quot;Theorem 2.19: Ancient scalar-curvature monotonicity&quot;,&quot;body&quot;:&quot;Let $(M,g(t))$, $-\\infty&lt;t\\le0$, be a complete Ricci flow with bounded\nnonnegative curvature operator on each time slice.  Then\n\\[\n \\partial_tR(x,t)\\ge0\n\\]\nat every spacetime point.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Local Curvature and Neck Estimates&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:49,&quot;ref&quot;:&quot;MT:ch4:4.37,MT:ch4:4.39&quot;},{&quot;id&quot;:&quot;895f10b519cc&quot;,&quot;label&quot;:&quot;thm:busemann-function-superharmonicity&quot;,&quot;title&quot;:&quot;Weak superharmonicity of Busemann functions&quot;,&quot;display_title&quot;:&quot;Theorem 2.20: Weak superharmonicity of Busemann functions&quot;,&quot;body&quot;:&quot;Let $(M^n,g)$ be complete with nonnegative Ricci curvature, and let $B$ be\nthe Busemann function of a ray.  Then $\\Delta B\\le0$ weakly: for every\nnonnegative compactly supported smooth function $\\varphi$,\n\\[\n \\int_M B\\,\\Delta\\varphi\\,d\\mu\\le0.\n\\]&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Local Curvature and Neck Estimates&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:50,&quot;ref&quot;:&quot;MT:ch2:2.3&quot;},{&quot;id&quot;:&quot;f82e94abd991&quot;,&quot;label&quot;:&quot;lem:epsilon-neck-geodesic-axis-alignment&quot;,&quot;title&quot;:&quot;Long minimizing geodesics align with a neck axis&quot;,&quot;display_title&quot;:&quot;Lemma 2.21: Long minimizing geodesics align with a neck axis&quot;,&quot;body&quot;:&quot;For every $\\alpha&gt;0$ there is $\\epsilon_0(\\alpha)&gt;0$ such that, in a\nnormalized $\\epsilon$-neck with $\\epsilon\\le\\epsilon_0$, every minimizing\ngeodesic of length greater than $\\epsilon^{-1}/100$ which crosses in the\npositive axial direction has tangent within $\\alpha$ of the axial unit\nvector at every point of the geodesic contained in the neck.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Local Curvature and Neck Estimates&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:51,&quot;ref&quot;:&quot;MT:ch19:19.4&quot;},{&quot;id&quot;:&quot;abf8af0e33e6&quot;,&quot;label&quot;:&quot;lem:external-point-neck-distance-comparison&quot;,&quot;title&quot;:&quot;Distance comparison from outside a thin neck&quot;,&quot;display_title&quot;:&quot;Lemma 2.22: Distance comparison from outside a thin neck&quot;,&quot;body&quot;:&quot;For every $0&lt;\\alpha&lt;1$ there is $\\epsilon_2(\\alpha)&gt;0$ such that the\nfollowing holds.  Let $N$ be a separating $\\epsilon$-neck,\n$\\epsilon\\le\\epsilon_2$, let $z$ lie outside its middle two-thirds on the\nnegative side.  Assume every minimizing geodesic from $z$ to a point of the\npositive half of $N$ enters $N$ through the negative end and remains in $N$\nuntil that endpoint.  Let $p$ lie in its middle half, and let $q$ lie anywhere\nlater on the same axial product line in $N$, with $s(q)&gt;s(p)$.  Then\n\\[\n (1-\\alpha)r_N(s(q)-s(p))\n \\le d(z,q)-d(z,p)\n \\le(1+\\alpha)r_N(s(q)-s(p)).\n\\]&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Local Curvature and Neck Estimates&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:52,&quot;ref&quot;:&quot;MT:ch19:19.9&quot;},{&quot;id&quot;:&quot;249d5e5f5ced&quot;,&quot;label&quot;:&quot;lem:metric-sphere-crosses-neck-as-fiber&quot;,&quot;title&quot;:&quot;Metric spheres cross a thin neck in a fiber sphere&quot;,&quot;display_title&quot;:&quot;Lemma 2.23: Metric spheres cross a thin neck in a fiber sphere&quot;,&quot;body&quot;:&quot;For every $\\alpha&gt;0$ there is $\\epsilon_1(\\alpha)&gt;0$ with the following\nproperty.  Let $N$ be an $\\epsilon$-neck, $\\epsilon\\le\\epsilon_1$, whose\ncentral sphere separates the ambient connected manifold.  If $z$ lies\noutside the middle two-thirds of $N$ and $p$ lies in its middle sixth, then\n$\\partial B(z,d(z,p))\\cap N$ is a topological two-sphere in the middle\nquarter of $N$, and axial projection maps it homeomorphically to a neck\nfiber.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Local Curvature and Neck Estimates&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:53,&quot;ref&quot;:&quot;MT:ch19:19.10&quot;}]},{&quot;id&quot;:&quot;compactness-and-noncollapsing&quot;,&quot;title&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;673665487492&quot;,&quot;label&quot;:&quot;thm:pointed-riemannian-compactness&quot;,&quot;title&quot;:&quot;Pointed Riemannian compactness&quot;,&quot;display_title&quot;:&quot;Theorem 2.24: Pointed Riemannian compactness&quot;,&quot;body&quot;:&quot;Let $(M_j,g_j,x_j)$ be complete pointed Riemannian manifolds.  Suppose that\non every fixed based ball all covariant derivatives of curvature are\nuniformly bounded and that for some $r_0,v_0&gt;0$,\n\\[\n \\operatorname{Vol}_{g_j}B(x_j,r_0)\\ge v_0.\n\\]\nThen a subsequence converges smoothly on compact subsets to a complete\npointed Riemannian manifold.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:54,&quot;ref&quot;:&quot;MT:ch5:5.6,MT:ch5:5.9,MT:ch5:5.10&quot;},{&quot;id&quot;:&quot;125231b4985e&quot;,&quot;label&quot;:&quot;thm:hamilton-compactness-generalized-flows&quot;,&quot;title&quot;:&quot;Pointed Ricci-flow compactness&quot;,&quot;display_title&quot;:&quot;Theorem 2.25: Pointed Ricci-flow compactness&quot;,&quot;body&quot;:&quot;Let $(\\mathcal M_j,G_j,x_j)$ be based generalized Ricci flows with base time\nzero, defined on a common open time interval $I$.  Suppose that for every\n$A&lt;\\infty$ and compact $J\\Subset I$ containing zero, all sufficiently large\n$j$ admit compatible embeddings\n\\[\n B_{g_j(0)}(x_j,A)\\times J\\longrightarrow\\mathcal M_j\n\\]\nwith compact zero-time balls and a uniform curvature bound on the images.\nAssume that for some $r_0,\\kappa&gt;0$,\n\\[\n \\operatorname{Vol}_{g_j(0)}B(x_j,r_0)\\ge\\kappa r_0^3.\n\\]\nAfter passing to a subsequence, the flows converge smoothly on compact\nspacetime subsets.  The limit is a pointed Ricci flow\n\\[\n (M_\\infty,g_\\infty(t),x_\\infty)\n\\]\non $I$, and its time-zero slice is complete.  If\n$\\operatorname{Ric}_{g_\\infty(t)}\\ge0$ for $t\\le0$, then every nonpositive\ntime slice of the limit is complete.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:55,&quot;ref&quot;:&quot;MT:ch5:5.14,MT:ch5:5.15&quot;},{&quot;id&quot;:&quot;af24539c6503&quot;,&quot;label&quot;:&quot;lem:nonflat-terminal-cone-exclusion&quot;,&quot;title&quot;:&quot;Nonflat terminal cones are excluded&quot;,&quot;display_title&quot;:&quot;Lemma 2.26: Nonflat terminal cones are excluded&quot;,&quot;body&quot;:&quot;Let a three-dimensional Ricci flow have nonnegative sectional curvature on a\nconnected spacetime neighborhood.  If at a positive time a nonempty open\nsubset of a slice is isometric to an open subset of a metric cone, then that\nspacetime neighborhood is flat.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:56,&quot;ref&quot;:&quot;MT:ch4:4.22&quot;},{&quot;id&quot;:&quot;72a95332c67c&quot;,&quot;label&quot;:&quot;lem:short-reduced-paths-avoid-surgery-caps&quot;,&quot;title&quot;:&quot;Short reduced paths avoid surgery caps&quot;,&quot;display_title&quot;:&quot;Lemma 2.27: Short reduced paths avoid surgery caps&quot;,&quot;body&quot;:&quot;Fix a controlled stage, a terminal point $(x,T)$ with a controlled\nparabolic ball of radius at least $r_{i+1}$, and $L_0&lt;\\infty$.  There is a\npositive surgery-control bound, depending only on the stage data and $L_0$,\nsuch that every backward path from $x$ with\n\\[\n \\mathcal L_+(\\gamma)=\\int\\sqrt\\tau\n   \\bigl(\\max(R,0)+|\\dot\\gamma|^2\\bigr)\\,d\\tau&lt;L_0\n\\]\nmisses a fixed open neighborhood of every surgery cap and every exposed\npoint in $[T_{i-1},T]$.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:57,&quot;ref&quot;:&quot;MT:ch16:16.5,MT:ch16:16.8,MT:ch16:16.13,MT:ch16:16.15&quot;},{&quot;id&quot;:&quot;b064cd2364ba&quot;,&quot;label&quot;:&quot;prop:compact-reduced-minimizing-domain&quot;,&quot;title&quot;:&quot;Compact smooth domain for reduced minimizers&quot;,&quot;display_title&quot;:&quot;Proposition 2.28: Compact smooth domain for reduced minimizers&quot;,&quot;body&quot;:&quot;Under the hypotheses of \\ref{lem:short-reduced-paths-avoid-surgery-caps},\nthere is an open subset $U$ of the smooth spacetime over\n$[T_{i-1},T)$ such that:\n\\begin{enumerate}\n\\item every point of $U$ is joined to $x$ by a minimizing smooth\n      $\\mathcal L$-geodesic;\n\\item every slice $U_t$ is nonempty and\n      $\\min_{U_t}\\mathcal L\\le3\\sqrt{T-t}$;\n\\item over every compact time interval, the slice minimizers form a compact\n      subset of the smooth spacetime.\n\\end{enumerate}&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;kind&quot;:&quot;proposition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:58,&quot;ref&quot;:&quot;MT:ch16:16.4,MT:ch16:16.21,MT:ch16:16.24,MT:ch16:16.25&quot;},{&quot;id&quot;:&quot;4db844706cd7&quot;,&quot;label&quot;:&quot;lem:reduced-volume-noncollapsing-transfer&quot;,&quot;title&quot;:&quot;Reduced-volume noncollapsing transfer&quot;,&quot;display_title&quot;:&quot;Lemma 2.29: Reduced-volume noncollapsing transfer&quot;,&quot;body&quot;:&quot;Assume the stage-$i$ noncollapsing bound on earlier controlled slices and the\nabsolute-continuity/density hypotheses of \\ref{thm:reduced-volume-transfer}\nfor the selected minimizing families.  Under the hypotheses of\n\\ref{prop:compact-reduced-minimizing-domain}, there is\n$\\kappa_{\\mathcal L}&gt;0$, depending only on the stage data, such that every\nterminal parabolic ball of radius\n$\\rho\\in[r_{i+1},\\epsilon]$ and curvature at most $\\rho^{-2}$ satisfies\n\\[\n \\operatorname{Vol}B(x,T,\\rho)\\ge\\kappa_{\\mathcal L}\\rho^3,\n\\]\nunless the component containing $x$ has positive sectional curvature.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:59,&quot;ref&quot;:&quot;MT:ch16:16.1,MT:ch16:16.27,MT:ch6:6.80&quot;},{&quot;id&quot;:&quot;3c6c0b64ac05&quot;,&quot;label&quot;:&quot;thm:conditional-noncollapsing-extension&quot;,&quot;title&quot;:&quot;Conditional noncollapsing extension&quot;,&quot;display_title&quot;:&quot;Theorem 2.30: Conditional noncollapsing extension&quot;,&quot;body&quot;:&quot;Assume the endpoint-transfer hypotheses of \\ref{thm:reduced-volume-transfer}\nare available uniformly for the minimizing families used at scales\n$[r_{i+1},\\epsilon]$.  Fix $i\\ge0$ and positive nonincreasing finite sequences\n\\[\n \\delta_0\\ge\\cdots\\ge\\delta_i,\n \\qquad \\epsilon=r_0\\ge\\cdots\\ge r_i,\n \\qquad \\kappa_0\\ge\\cdots\\ge\\kappa_i.\n\\]\nThere is $0&lt;\\kappa_{i+1}\\le\\kappa_i$ such that, for every\n$0&lt;r_{i+1}\\le r_i$, there is\n$0&lt;\\delta(r_{i+1})\\le\\delta_i$ with the following property.  If a\ncontrolled Ricci flow with surgery on $[0,T)$,\n$T\\in(T_i,T_{i+1}]$, satisfies the stage-$i$ induction hypotheses before\n$T_i$, has $\\bar\\delta\\le\\delta(r_{i+1})$ on the new stage, and satisfies\nthe strong canonical-neighborhood assumption with parameter $r_{i+1}$,\nthen every parabolic ball of radius at most $\\epsilon$ satisfying the\ncurvature hypothesis in\n\\ref{def:surgery-flow-noncollapsing} has volume at least\n$\\kappa_{i+1}\\rho^3$, unless its center lies in a positively curved component\nof the time slice.  The constant is independent of the particular flow.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:60,&quot;ref&quot;:&quot;MT:ch16:16.1&quot;},{&quot;id&quot;:&quot;ff09b9b55dd8&quot;,&quot;label&quot;:&quot;thm:bounded-curvature-at-bounded-distance&quot;,&quot;title&quot;:&quot;Bounded curvature at bounded distance&quot;,&quot;display_title&quot;:&quot;Theorem 2.31: Bounded curvature at bounded distance&quot;,&quot;body&quot;:&quot;For sufficiently small $\\epsilon&gt;0$ and every $A,C&lt;\\infty$, there are\n$D_0=D_0(A,C,\\epsilon)$ and $D=D(A,C,\\epsilon)$ with the following\nproperty.  Let $x$ lie in a three-dimensional Ricci flow with surgery whose\ncurvature is pinched toward positive.  Suppose every point $z$ at time at\nmost $\\mathbf t(x)$ with $R(z)\\ge4R(x)$ has a strong\n$(C,\\epsilon)$-canonical neighborhood.  If $R(x)\\ge D_0$, then\n\\[\n R(y)\\le D R(x)\n \\qquad\\text{for every }y\\in\n B_{g(\\mathbf t(x))}\\bigl(x,A R(x)^{-1/2}\\bigr).\n\\]&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:61,&quot;ref&quot;:&quot;MT:ch10:10.2&quot;},{&quot;id&quot;:&quot;e5a1514edda1&quot;,&quot;label&quot;:&quot;thm:pointed-controlled-flow-compactness&quot;,&quot;title&quot;:&quot;Pointed compactness for controlled flows&quot;,&quot;display_title&quot;:&quot;Theorem 2.32: Pointed compactness for controlled flows&quot;,&quot;body&quot;:&quot;Let $(\\mathcal M_j,G_j,x_j)$ be based controlled three-dimensional Ricci\nflows and put $Q_j=R(x_j)\\to\\infty$.  Rescale by $Q_j$ and move the base\ntime to zero.  Assume curvature is pinched toward positive, the rescaled\nflows are uniformly $\\kappa$-noncollapsed on every fixed scale, and every\npoint at nonpositive time with rescaled scalar curvature at least four has a\nstrong $(C,\\epsilon)$-canonical neighborhood.  Suppose that for some\n$0&lt;T_0\\le\\infty$, every fixed\n$B(x_j,0,A)\\times(-T,0]$, with $A&lt;\\infty$ and $T&lt;T_0$, eventually has a\ncompatible spacetime embedding.  Then a subsequence converges smoothly to a\ncomplete pointed Ricci flow on $(-T_0,0]$ with nonnegative curvature,\nlocally bounded in time and bounded on each time slice.  If $T_0=\\infty$,\nthe limit is a $\\kappa$-solution.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:62,&quot;ref&quot;:&quot;MT:ch11:11.1,MT:ch11:11.8,MT:ch11:11.10&quot;}]}]},{&quot;id&quot;:&quot;kappa-solutions-surgery-continuation&quot;,&quot;title&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;sections&quot;:[{&quot;id&quot;:&quot;kappa-solutions-and-asymptotic-models&quot;,&quot;title&quot;:&quot;Kappa-Solutions and Asymptotic Models&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;7e3affaa5dd4&quot;,&quot;label&quot;:&quot;def:kappa-solution&quot;,&quot;title&quot;:&quot;Kappa-solution&quot;,&quot;display_title&quot;:&quot;Definition 3.1: Kappa-solution&quot;,&quot;body&quot;:&quot;For $d\\in\\{2,3\\}$, a $d$-dimensional \\emph{$\\kappa$-solution} is a connected Ricci flow\n$(M,g(t))$, $-\\infty&lt;t\\le0$, such that every time slice is complete and\nnonflat, has bounded nonnegative curvature operator, and is\n$\\kappa$-noncollapsed on every finite scale.  The value of $\\kappa&gt;0$ is\nfixed for the flow.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solutions and Asymptotic Models&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:63,&quot;ref&quot;:&quot;MT:ch9:9.1,MT:ch9:9.2&quot;},{&quot;id&quot;:&quot;50d00891cd7a&quot;,&quot;label&quot;:&quot;thm:two-dimensional-kappa-solutions-round&quot;,&quot;title&quot;:&quot;Two-dimensional kappa-solutions are round&quot;,&quot;display_title&quot;:&quot;Theorem 3.2: Two-dimensional kappa-solutions are round&quot;,&quot;body&quot;:&quot;Every orientable two-dimensional $\\kappa$-solution in the sense of\n\\ref{def:kappa-solution} is, after a constant\nparabolic scaling and time translation, the shrinking round two-sphere.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solutions and Asymptotic Models&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:64,&quot;ref&quot;:&quot;MT:ch9:9.4&quot;},{&quot;id&quot;:&quot;be45913142d1&quot;,&quot;label&quot;:&quot;thm:kappa-solution-asymptotic-models&quot;,&quot;title&quot;:&quot;Asymptotic models of three-dimensional kappa-solutions&quot;,&quot;display_title&quot;:&quot;Theorem 3.3: Asymptotic models of three-dimensional kappa-solutions&quot;,&quot;body&quot;:&quot;Assume the endpoint-transfer hypotheses of \\ref{thm:reduced-volume-transfer}\nhold for the rescaled reduced-exponential families below.  Let $(M,g(t))$ be\na three-dimensional $\\kappa$-solution and fix $(p,0)$.\nThere are $\\tau_j\\to\\infty$ and points $q_j$ at time $-\\tau_j$ with reduced\nlength at most $3/2$ such that the parabolically rescaled pointed flows based\nat $(q_j,-1)$ converge to a complete nonflat gradient shrinking soliton with\nbounded nonnegative curvature.  The limit is a compact round space form or\none of the three cylindrical models\n\\[\n S^2\\times\\mathbb R,\\qquad\n \\mathbb{RP}^2\\times\\mathbb R,\\qquad\n \\mathbb{RP}^2\\widetilde\\times\\mathbb R,\n\\]\nwhere the last space is the twisted line bundle.  If the original solution\nis nonround, a sequence can be chosen with one of these three noncompact\nlimits.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solutions and Asymptotic Models&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:65,&quot;ref&quot;:&quot;MT:ch9:9.11,MT:ch9:9.42,MT:ch9:9.44,MT:ch9:9.53,MT:ch9:9.54&quot;},{&quot;
