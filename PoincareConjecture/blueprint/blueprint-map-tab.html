inuation&quot;,&quot;section&quot;:&quot;Kappa-Solutions and Asymptotic Models&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:103,&quot;ref&quot;:&quot;MT:ch9:9.53,MT:ch9:9.54&quot;},{&quot;id&quot;:&quot;ab31435babe2&quot;,&quot;label&quot;:&quot;thm:noncompact-kappa-solution-structure&quot;,&quot;title&quot;:&quot;Structure of noncompact kappa-solutions&quot;,&quot;display_title&quot;:&quot;Theorem 3.14: Structure of noncompact kappa-solutions&quot;,&quot;body&quot;:&quot;For every sufficiently small $\\epsilon&gt;0$ there is\n$C_0=C_0(\\epsilon)&lt;\\infty$ such that the time-zero slice of every\nnoncompact three-dimensional $\\kappa$-solution containing no embedded\ntwo-sided $\\mathbb{RP}^2$ is either a strong $\\epsilon$-tube or a\n$(C_0,\\epsilon)$-cap followed by a strong $\\epsilon$-tube.  The cap core has\nuniform scale-normalized curvature, derivative, diameter, and volume bounds.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solution Geometry and Stability&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:114,&quot;ref&quot;:&quot;MT:ch9:9.84,MT:ch9:9.85,MT:ch9:9.87,MT:ch9:9.88&quot;},{&quot;id&quot;:&quot;abe4d57fef31&quot;,&quot;label&quot;:&quot;def:lifted-ramp-chart-branch&quot;,&quot;title&quot;:&quot;Lifted ramp chart and circle branch&quot;,&quot;display_title&quot;:&quot;Definition 4.4: Lifted ramp chart and circle branch&quot;,&quot;body&quot;:&quot;Throughout this chapter the parameter circle is\n$S^1=\\mathbb R/(2\\pi\\mathbb Z)$.  For every $\\lambda&gt;0$ regard\n$S^1_\\lambda=\\mathbb R/(\\lambda\\mathbb Z)$ with the metric induced by the\nEuclidean coordinate on the cover, so its circumference is $\\lambda$, and\nwrite $\\pi_\\lambda\\colon M\\times\\mathbb R\\to M\\times S^1_\\lambda$ for the\ncovering map induced by the universal cover of the circle factor.  The\ndegree-one map from the parameter circle to the target factor is therefore\n$x\\mapsto\\lambda x/(2\\pi)$ and has constant speed $\\lambda/(2\\pi)$.  A\ndegree-one ramp family is represented locally by a chosen\nlift and a chosen lifted arc/branch over each polygonal side or graph interval.\nAll local charts use the fixed $M$ normal neighborhood of radius $r_0$ and an\naffine coordinate on $\\mathbb R$, then project by $\\pi_\\lambda$.  Hence chart\nradii, connection bounds, and transition estimates are independent of\n$\\lambda$; changing the branch by a deck translation changes nothing.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Product-Circle Geometry and Ramp Setup&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:142,&quot;ref&quot;:&quot;MT:ch19:19.12,MT:ch19:19.64&quot;},{&quot;id&quot;:&quot;ae381b6948fa&quot;,&quot;label&quot;:&quot;lem:essential-family-survives-essential-surgery&quot;,&quot;title&quot;:&quot;Essential families survive an essential sphere surgery&quot;,&quot;display_title&quot;:&quot;Lemma 5.13: Essential families survive an essential sphere surgery&quot;,&quot;body&quot;:&quot;Let $M^-$ be a compact $3$-manifold and let $S_0\\subset M^-$ be an embedded\nhomotopically essential $2$-sphere.  Let $M^+$ be obtained by the standard\nsurgery on $S_0$, with its two $3$-ball caps, and let\n$F^+$ be an essential sphere family in $M^+$ disjoint from the cap balls.\nAfter pushing $F^+$ off the caps and identifying the complement with the\npresurgery complement, the family\n$F^-:=F^+\\cup\\{S_0\\}$ is essential in $M^-$.\nConsequently $s(M^-)&gt;s(M^+)$.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Two-Sphere Width Control&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:191,&quot;ref&quot;:&quot;MT:ch18:18.8&quot;},{&quot;id&quot;:&quot;aed6c9f3f45b&quot;,&quot;label&quot;:&quot;def:ricci-flow-with-cutoff&quot;,&quot;title&quot;:&quot;Ricci flow with Kleiner--Lott (r, )-cutoff&quot;,&quot;display_title&quot;:&quot;Definition 2.15: Ricci flow with Kleiner--Lott (r, )-cutoff&quot;,&quot;body&quot;:&quot;On $[0,b]$, let $r$ be positive nonincreasing, let\n$\\bar\\delta:[0,b]\\to(0,\\infty)$ be nonincreasing, and fix a positive\nnonincreasing threshold sequence\n$\\Delta=(\\delta_i)_{i\\ge0}$ with $0&lt;\\delta_i\\le\\delta_0^{\\rm cap}$, where\n$\\delta_0^{\\rm cap}$ is the cap-insertion threshold supplied by\n\\ref{lem:ricci-flow-surgery-cap-insertion}.  Put\n$t_0=2^{-5}$ and $T_i=2^it_0$.  Require that there is no transition on the\ninitial short-time interval $[0,T_0]$ and that every later transition obeys\n\\[\n\\bar\\delta(t)&lt;\\delta_{i+1}\\le\\delta_0^{\\rm cap}\n \\qquad(T_i&lt;t\\le T_{i+1}).\n\\]\nFix the envelope $\\Phi_{\\mathrm{HI}}^{b,g(0)}$ supplied by\n\\ref{lem:finite-horizon-surgery-phi-envelope}.  At each transition set\n$h(t)=H(\\Phi_{\\mathrm{HI}}^{b,g(0)},t,r,\\bar\\delta(t))$ and put\n$\\rho=\\bar\\delta(t)r(t)$.  Identify the final smooth interval before this\ntransition with $M_{T^-}$, where $T=t$, and define\n\\[\n \\Omega=\\{x\\in M_{T^-}:\\limsup_{s\\nearrow T}|\\operatorname{Rm}(x,s)|&lt;\\infty\\}.\n\\]\nThe limiting metric on $\\Omega$ has scalar curvature $\\bar R$, the function\n$\\bar R$ is proper and bounded below, and\n$\\Omega_\\rho=\\{y\\in\\Omega:\\bar R(y)\\le\\rho^{-2}\\}$ is compact.  Retain\nexactly the connected components of $\\Omega$ meeting $\\Omega_\\rho$ and discard\nthe other components.  For every remaining embedded $\\epsilon$-horn $\\mathcal H$\nwhose compact bounded-curvature frontier lies in $\\Omega_\\rho$, choose (using\nthe properness of $\\bar R$) a point $x_{\\mathcal H}$ on the horn with\n$\\bar R(x_{\\mathcal H})=h(t)^{-2}$.  The scale lemma gives a strong\n$\\bar\\delta(t)$-neck about this point; cut along its central cross-sectional\n$2$-sphere and glue the cap of\n\\ref{lem:ricci-flow-surgery-cap-insertion} along that sphere.  Thus the cut\nis made at a scale-selected neck, not at an arbitrary frontier of\n$\\Omega_\\rho$.  The whole backward slice satisfies the compatible time-$t$\nHamilton--Ivey condition.  On every open smooth subinterval ending at\na transition, the flow also satisfies the a-priori $(r,\\Phi_{\\mathrm{HI}})$\nconditions of\n\\ref{def:ricci-flow-surgery-a-priori-assumptions}; at a first failure the\ncanonical-neighborhood condition is required only on the half-open interval\nbefore the failure time.  An all-time flow has this cutoff when every finite\nrestriction has the stated property.  The condition is imposed only where\nsurgery occurs, so the displayed stagewise bounds are vacuous on a\nsurgery-free stage.  This is a contract for an already constructed flow;\nthe extension theorem below produces parameters making these a-priori\nconditions hold.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:57,&quot;ref&quot;:&quot;KL:II.4:73.1&quot;},{&quot;id&quot;:&quot;af24539c6503&quot;,&quot;label&quot;:&quot;lem:nonflat-terminal-cone-exclusion&quot;,&quot;title&quot;:&quot;Nonflat terminal cones are excluded&quot;,&quot;display_title&quot;:&quot;Lemma 2.45: Nonflat terminal cones are excluded&quot;,&quot;body&quot;:&quot;Let $T&gt;0$ and let $(U,g(t))$, $0\\le t\\le T$, be a connected\nthree-dimensional Ricci flow (the slices need not be complete) with\nnonnegative sectional curvature.  Suppose that, for a Riemannian\ntwo-manifold $(N,h)$, the terminal slice $(U,g(T))$ is isometric to a\nnonempty open subset of the open cone\n\\[\n (N\\times(0,\\infty),\\;dr^2+r^2h).\n\\]\nThen $(U,g(t))$ is flat for every $t\\in[0,T]$.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:87,&quot;ref&quot;:&quot;MT:ch4:4.22&quot;},{&quot;id&quot;:&quot;b064cd2364ba&quot;,&quot;label&quot;:&quot;prop:compact-reduced-minimizing-domain&quot;,&quot;title&quot;:&quot;Compact smooth domain for reduced minimizers&quot;,&quot;display_title&quot;:&quot;Proposition 2.48: Compact smooth domain for reduced minimizers&quot;,&quot;body&quot;:&quot;Under the hypotheses of \\ref{lem:short-reduced-paths-avoid-surgery-caps},\nthere is an open subset $U$ of the smooth spacetime over\n$[T_{i-1},T)$ such that:\n\\begin{enumerate}\n\\item every point of $U$ is joined to $x$ by a minimizing smooth\n      $\\mathcal L$-geodesic;\n\\item every slice $U_t$ is nonempty and\n      $\\min_{U_t}\\mathcal L\\le3\\sqrt{T-t}$;\n\\item over every compact time interval, the slice minimizers form a compact\n      subset of the smooth spacetime.\n\\end{enumerate}&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;kind&quot;:&quot;proposition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:90,&quot;ref&quot;:&quot;MT:ch16:16.4,MT:ch16:16.21,MT:ch16:16.24,MT:ch16:16.25&quot;},{&quot;id&quot;:&quot;b0ef6688e9c2&quot;,&quot;label&quot;:&quot;lem:standard-cap-radial-collapse-nonexpanding&quot;,&quot;title&quot;:&quot;Nonexpansion of the standard radial collapse&quot;,&quot;display_title&quot;:&quot;Lemma 1.12: Nonexpansion of the standard radial collapse&quot;,&quot;body&quot;:&quot;In the data of \\ref{def:local-neck-surgery-data}, define\n$\\xi\\colon N\\to\\mathbb R^3$ by preserving the angular coordinate,\nsending $s&lt;A_0+4$ to the point at $g_0$-distance $A_0+4-s$ from $p_0$,\nand collapsing $s\\ge A_0+4$ to $p_0$.  For all sufficiently small\n$\\delta$,\n\\[\n \\xi\\colon(N,Qg)\\longrightarrow(\\mathbb R^3,\\eta g_0)\n\\]\nis distance nonincreasing.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:11,&quot;ref&quot;:&quot;MT:ch12:12.37,MT:ch13:13.1&quot;},{&quot;id&quot;:&quot;b263544ced78&quot;,&quot;label&quot;:&quot;thm:morgan-tian-corollary-15-4-general&quot;,&quot;title&quot;:&quot;Morgan--Tian Corollary 15.4, general geometrization clause&quot;,&quot;display_title&quot;:&quot;Theorem 6.28: Morgan--Tian Corollary 15.4, general geometrization clause&quot;,&quot;body&quot;:&quot;Let $({\\mathcal M},G)$ be a controlled generalized Ricci flow satisfying\nAssumptions (1)--(7) and carrying the Kleiner--Lott cutoff of\n\\ref{def:ricci-flow-with-cutoff} on $[0,T]$, with initial slice $(M,g(0))$.\nIf a time slice $M_T$ is\nMT-geometrized, then every earlier slice $M_t$, $0\\le t\\le T$, is\nMT-geometrized.  No orientability or connectedness hypothesis is imposed on\nthe individual slices beyond the assumptions of the generalized flow.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Backward Reconstruction from Extinction&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:263,&quot;ref&quot;:&quot;MT:ch15:15.4&quot;},{&quot;id&quot;:&quot;b4dc4b9a6187&quot;,&quot;label&quot;:&quot;lem:generalized-noncollapsing-small-image&quot;,&quot;title&quot;:&quot;Small reduced-exponential image estimate&quot;,&quot;display_title&quot;:&quot;Lemma 2.32: Small reduced-exponential image estimate&quot;,&quot;body&quot;:&quot;Let $(\\mathcal M,G)$ be a generalized three-dimensional Ricci flow, let\n$x\\in M_T$, and let $0&lt;\\tau_0\\le\\bar\\tau_0$, $0&lt;r\\le\\sqrt{\\tau_0}$.\nAssume that $B_{g(T)}(x,r)$ has compact closure, admits a\ntime-vector-field-compatible embedding over $[T-r^2,T]$, and satisfies\n$|\\operatorname{Rm}|\\le r^{-2}$ on that neighborhood.  Let\n$\\widetilde W\\subset\\widetilde{\\mathcal U}_x(\\tau_0)$ lie in the\n$\\mathcal L$-injectivity domain, with every associated geodesic having\nreduced length at most $l_0$ on $[0,\\tau_0]$, and put\n\\[\n \\varepsilon=\\frac{\\operatorname{Vol}_{g(T)}B_{g(T)}(x,r)^{1/3}}{r},\n \\qquad \\tau_1=\\varepsilon r^2,\n \\qquad \\widetilde W_{\\rm sm}=\n \\widetilde W\\cap\\{|v|\\le(8\\sqrt\\varepsilon)^{-1}\\}.\n\\]\nThere is $\\varepsilon_0=\\varepsilon_0(\\bar\\tau_0)&gt;0$ such that, when\n$\\varepsilon\\le\\varepsilon_0$, the reduced volume of\n$W_{\\rm sm}(\\tau_1)=\\mathcal L\\exp_x^{\\tau_1}(\\widetilde W_{\\rm sm})$ satisfies\n\\[\n \\widetilde V_x(W_{\\rm sm}(\\tau_1),\\tau_1)\n \\le 2\\varepsilon^{3/2}.\n\\]&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Reduced Geometry&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:74,&quot;ref&quot;:&quot;MT:ch8:8.1&quot;},{&quot;id&quot;:&quot;b5fb8dfb64e4&quot;,&quot;label&quot;:&quot;thm:local-neck-surgery&quot;,&quot;title&quot;:&quot;Local surgery on a delta-neck&quot;,&quot;display_title&quot;:&quot;Theorem 1.19: Local surgery on a delta-neck&quot;,&quot;body&quot;:&quot;There are universal constants $C_0,q,R_0&lt;\\infty$ and $\\delta_0&#x27;&gt;0$ such\nthat, whenever $Q=R_g(x_0)\\ge R_0$ and\n$0&lt;\\delta\\le\\delta_0&#x27;$, the metric $\\widetilde g$ of\n\\ref{def:interpolating-surgery-metric} has the following properties.\n\\begin{enumerate}\n\\item Every curvature-pinching inequality in\n      \\ref{lem:retained-neck-surgery-pinching} that holds on the original\n      neck holds everywhere on $\\mathcal S$.\n\\item The sectional curvature is positive on\n      $1\\le s\\le A_0+4$.\n\\item The radial collapse map\n      $\\xi\\colon(N,g)\\to(\\mathcal S,\\widetilde g)$ is distance\n      nonincreasing.\n\\item The normalized pointed cap converges smoothly on bounded balls,\n      \\[\n        (\\mathcal S,\\widehat g,p_0)\\longrightarrow\n        (\\mathbb R^3,g_0,p_0),\n      \\]\n      as $\\delta\\to0$, in the quantitative sense of\n      \\ref{lem:local-surgery-standard-cap-convergence}.\n\\end{enumerate}&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:18,&quot;ref&quot;:&quot;MT:ch13:13.2&quot;},{&quot;id&quot;:&quot;b68b762d3d15&quot;,&quot;label&quot;:&quot;def:canonical-cap&quot;,&quot;title&quot;:&quot;Canonical cap&quot;,&quot;display_title&quot;:&quot;Definition 1.20: Canonical cap&quot;,&quot;body&quot;:&quot;For $C&lt;\\infty$, a \\emph{$(C,\\epsilon)$-cap} is an open submanifold\n$\\mathcal C$ of a smooth boundaryless Riemannian three-manifold with an open\n$\\epsilon$-neck $N\\subset\\mathcal C$ whose complement in $\\mathcal C$ is\ncompact, such that:\n\\begin{enumerate}\n\\item $\\mathcal C$ is diffeomorphic to an open three-ball or to\n      $\\mathbb{RP}^3$ minus a point;\n\\item $\\overline Y=\\mathcal C\\setminus N$ is a compact submanifold with\n      boundary, its interior $Y$ is the \\emph{core}, and\n      $\\partial\\overline Y$ is a central sphere of an $\\epsilon$-neck;\n\\item $R&gt;0$ on $\\mathcal C$,\n      $\\operatorname{diam}(\\mathcal C)\n       &lt;C(\\sup_{\\mathcal C}R)^{-1/2}$.\n\\item $\\sup_{x,y\\in\\mathcal C}R(y)/R(x)&lt;C$ and\n      $\\operatorname{Vol}(\\mathcal C)\n      &lt;C(\\sup_{\\mathcal C}R)^{-3/2}$.\n\\item For $y\\in Y$, let $r_y&gt;0$ satisfy\n      $\\sup_{B(y,r_y)}R=r_y^{-2}$.  Then\n      $B(y,r_y)\\Subset\\mathcal C$ and\n      \\[\n       \\inf_{y\\in Y}\\frac{\\operatorname{Vol}B(y,r_y)}{r_y^3}&gt;C^{-1}.\n      \\]\n\\item The scale-invariant derivative bounds\n      \\[\n       \\sup_{\\mathcal C}\\frac{|\\nabla R|}{R^{3/2}}&lt;C,\n       \\qquad\n       \\sup_{\\mathcal C}\n       \\frac{|\\Delta R+2|\\operatorname{Ric}|^2|}{R^2}&lt;C\n      \\]\n      hold.\n\\end{enumerate}\nThe neck orientation is fixed so that the closure of its negative end meets\nthe core; reversing this orientation is not a new cap structure.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:19,&quot;ref&quot;:&quot;MT:ch9:9.72&quot;},{&quot;id&quot;:&quot;b7ee03ad5851&quot;,&quot;label&quot;:&quot;def:ricci-flow-surgery-phi-pinching&quot;,&quot;title&quot;:&quot;Kleiner--Lott -pinching&quot;,&quot;display_title&quot;:&quot;Definition 2.12: Kleiner--Lott -pinching&quot;,&quot;body&quot;:&quot;For an admissible smooth positive nondecreasing $\\Phi$ with $\\Phi(s)/s$ decreasing\nto zero on $(0,\\infty)$, the $\\Phi$-pinching assumption is\n$\\operatorname{Rm}(x,t)\\ge-\\Phi(R(x,t))$ at every spacetime point.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:54,&quot;ref&quot;:&quot;KL:II.4:69.5&quot;},{&quot;id&quot;:&quot;b83aa6787faa&quot;,&quot;label&quot;:&quot;lem:standard-cap-encounter-control&quot;,&quot;title&quot;:&quot;A bounded-curvature cap encounter is standard&quot;,&quot;display_title&quot;:&quot;Lemma 3.20: A bounded-curvature cap encounter is standard&quot;,&quot;body&quot;:&quot;Consider rescaled first-failure flows and a backward flow line, starting in\na fixed-radius zero-time ball, which reaches a surgery cap after rescaled\ntime $s_a\\le s&#x27;&lt;\\infty$.  If scalar curvature along the line is bounded by\n$D&#x27;&lt;\\infty$ and $\\bar h_a$ is the rescaled surgery scale, then for all large\n$a$ there are constants $c=c(D&#x27;,s&#x27;)&gt;0$, $A&lt;\\infty$, and $\\theta&lt;1$ such that\n\\[\n \\bar h_a^2\\ge c,\n \\qquad s_a&lt;\\theta\\bar h_a^2,\n\\]\nand the point where the line reaches the surgery slice lies in the image of\nthe standard-solution ball $B(p_0,A)$ used to model the cap.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;First-Failure Extension&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:120,&quot;ref&quot;:&quot;MT:ch17:17.4,MT:ch17:17.5,MT:ch17:17.8&quot;},{&quot;id&quot;:&quot;b945feb50d33&quot;,&quot;label&quot;:&quot;lem:standard-cap-surgery-curvature&quot;,&quot;title&quot;:&quot;Curvature and pinching on the standard-cap side&quot;,&quot;display_title&quot;:&quot;Lemma 1.17: Curvature and pinching on the standard-cap side&quot;,&quot;body&quot;:&quot;For the same universal choices and all sufficiently small $\\delta$, the\nmetric $\\widetilde g$ has positive sectional curvature on\n$4\\le s\\le A_0+4$.  It satisfies the two curvature-pinching inequalities\nin \\ref{lem:retained-neck-surgery-pinching} there.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:16,&quot;ref&quot;:&quot;MT:ch13:13.2&quot;},{&quot;id&quot;:&quot;b98f0aa4fc27&quot;,&quot;label&quot;:&quot;lem:graph-slope-persistence&quot;,&quot;title&quot;:&quot;Full-interval graph-slope persistence&quot;,&quot;display_title&quot;:&quot;Theorem 4.35: Full-interval graph-slope persistence&quot;,&quot;body&quot;:&quot;For sufficiently small $\\delta$, the maximal graph time equals the\nprovisional curvature time, $t_3=t_2$, and\n\\[\n |f_z(z,t)|_{h&#x27;}&lt;\\frac1{10}\n \\qquad((z,t)\\in I&#x27;\\times[t&#x27;,t_2]).\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Short-Time Curvature Barrier&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:173,&quot;ref&quot;:&quot;MT:ch19:19.58&quot;},{&quot;id&quot;:&quot;b99589f092ca&quot;,&quot;label&quot;:&quot;lem:kappa-point-picking-line&quot;,&quot;title&quot;:&quot;Point-picking and the splitting-limit producer&quot;,&quot;display_title&quot;:&quot;Lemma 3.12: Point-picking and the splitting-limit producer&quot;,&quot;body&quot;:&quot;Let $(M,g(t))$, $-\\infty&lt;t\\le0$, be a complete noncompact three-dimensional\n$\\kappa$-solution and let $p_j\\to\\infty$ satisfy\n$R(p_j,-1)d(p,p_j)^2\\to\\infty$.  The scalar-curvature point-picking rule on a\nball $B_{g(-1)}(p_j,d_j/2)$, where $d_j=d_{g(-1)}(p,p_j)$, produces\n$q_j$ and $Q_j=R(q_j,-1)$ such that\n\\[\n q_j\\in B(p_j,d_j/2),\\qquad Q_j\\ge R(p_j,-1),\\qquad\n Q_jd(p,q_j)^2\\longrightarrow\\infty,\n\\]\nand\n\\[\n R(\\,\\cdot\\,,t)\\le4Q_j\n \\quad\\hbox{on}\\quad\n B_{g(-1)}\\!\\left(q_j,\n   \\frac{d_jR(p_j,-1)^{1/2}}{4Q_j^{1/2}}\\right)\n \\quad(t\\le-1).\n\\]\nThe radii of these balls tend to infinity after scaling by $Q_j$.  A\nsubsequence of the pointed rescaled flows therefore converges smoothly to a\ncomplete ancient product flow $(N,h(t))\\times(\\mathbb R,ds^2)$ with $N$\nnonflat and of bounded nonnegative curvature.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solution Geometry and Stability&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:112,&quot;ref&quot;:&quot;MT:ch9:9.39&quot;},{&quot;id&quot;:&quot;b99a6419604a&quot;,&quot;label&quot;:&quot;lem:curve-flow-length-total-curvature-evolution&quot;,&quot;title&quot;:&quot;Integral evolution inequalities&quot;,&quot;display_title&quot;:&quot;Theorem 4.25: Integral evolution inequalities&quot;,&quot;body&quot;:&quot;Let\n$L(t)=\\int_{c_t}ds$ and $\\Theta(t)=\\int_{c_t}k\\,ds$, and let $C_2$ bound\n$|\\operatorname{Ric}_g|$ on $M\\times I$.  The function $L$ is smooth and\n$\\Theta$ is locally absolutely continuous.  For almost every time,\n\\[\n L&#x27;(t)\\le\\int_{c_t}(C_2-k^2)\\,ds\\le C_2L(t),\n \\qquad\n \\Theta&#x27;(t)\\le(C_1+C_2)\\Theta(t)+C_1L(t).\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Evolution Identities and Global Bounds&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:163,&quot;ref&quot;:&quot;MT:ch19:19.9&quot;},{&quot;id&quot;:&quot;b9cb0afd564e&quot;,&quot;label&quot;:&quot;lem:first-failure-noncollapsing-bridge&quot;,&quot;title&quot;:&quot;First-failure noncollapsing bridge&quot;,&quot;display_title&quot;:&quot;Lemma 3.24: First-failure noncollapsing bridge&quot;,&quot;body&quot;:&quot;Let $0&lt;r_+\\le r_-\\le\\epsilon$, $\\kappa_-&gt;0$, and\n$0&lt;E_-\\le E&lt;\\infty$ be fixed.  Let $a&lt;b&lt;c$ satisfy\n$b-a\\ge E_-$ and $c-a\\le E$.  Consider a sequence of flows with\nfirst-failure points $(x_j,t_j)$ with $t_j\\in[b,c)$, put\n$Q_j=R_{g_j(t_j)}(x_j)$, and define\nthe translated parabolic rescalings\n\\[\n \\widetilde g_j(s)=Q_jg_j(t_j+Q_j^{-1}s),\n \\qquad R_{\\widetilde g_j(0)}(x_j)=1.\n\\]\nAssume the original flows are three-dimensional Ricci flows with\n$(r,\\delta)$-cutoff, normalized compact initial data, and global stage\nparameter $r\\le\\epsilon$, with $r\\ge r_-$ on\n$[a,b)$ and $r\\ge r_+$ on $[b,c)$, ordinary $\\kappa_-$-noncollapsing on\n$[a,b)$ at every scale below $\\epsilon$, and cutoff\n$\\delta(t)\\le\\bar\\delta(r_-,r_+,\\kappa_-,E_-,E)$ on $[a,c)$.  Assume that\nthe strong $r_+$ canonical-neighborhood hypothesis holds on $[b,c)$.  Let\n$\\kappa_+$ be the\nconstant supplied by\n\\ref{lem:kleiner-lott-noncollapsing-estimate}.  Then, after passing to a\nsubsequence, one may use the single constant $\\kappa_*:=\\kappa_+$ on every\nfixed zero-time based ball: whenever the backward parabolic ball of scale\n$\\rho\\le\\epsilon$ exists, is unscathed, and has curvature at most\n$\\rho^{-2}$, its time-zero ball satisfies\n\\[\n \\operatorname{Vol}_{\\widetilde g_j(0)}\n B_{\\widetilde g_j(0)}(x_j,\\rho)\n \\ge \\kappa_*\\rho^3\n \\quad\\text{or}\\quad\n x_j\\text{ lies in a positive-sectional-curvature component}.\n\\]\nIf an independent hypothesis excludes that positive-component alternative at\nthe selected basepoints, then the displayed inequality gives the fixed volume\n$v_0=\\kappa_*\\eta^3$ on every common backward neighborhood of radius\n$\\eta&gt;0$; the bridge itself does not supply that exclusion.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;First-Failure Extension&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:124,&quot;ref&quot;:&quot;MT:ch16:16.1,MT:ch17:17.1,KL:II.5:II.5.2&quot;},{&quot;id&quot;:&quot;bcc086f18ab4&quot;,&quot;label&quot;:&quot;lem:curve-flow-speed-and-tangent-evolution&quot;,&quot;title&quot;:&quot;Speed and tangent evolution&quot;,&quot;display_title&quot;:&quot;Theorem 4.1: Speed and tangent evolution&quot;,&quot;body&quot;:&quot;Let $\\widehat c(x,t)=(c(x,t),t)$ and\n$\\widehat H=\\widehat c_*(\\partial_t)=H+\\partial_t$.  Then\n\\[\n \\widehat H(|X|^2)=-2\\operatorname{Ric}_g(X,X)-2k^2|X|^2,\n \\qquad\n [\\widehat H,S]=(k^2+\\operatorname{Ric}_g(S,S))S .\n\\]\nEquivalently, the first formula is the time derivative of the squared speed in\nthe evolving pulled-back metric.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Curve-Flow Geometry&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:139,&quot;ref&quot;:&quot;MT:ch19:19.6&quot;},{&quot;id&quot;:&quot;be45913142d1&quot;,&quot;label&quot;:&quot;thm:kappa-solution-asymptotic-models&quot;,&quot;title&quot;:&quot;Asymptotic models of three-dimensional kappa-solutions&quot;,&quot;display_title&quot;:&quot;Theorem 3.4: Asymptotic models of three-dimensional kappa-solutions&quot;,&quot;body&quot;:&quot;Let $(M,g(t))$ be a three-dimensional $\\kappa$-solution and fix $(p,0)$.\nThere are $\\tau_j\\to\\infty$ and points $q_j$ at time $-\\tau_j$ with reduced\nlength at most $3/2$ such that the parabolically rescaled pointed flows based\nat $(q_j,-1)$ converge to a complete nonflat gradient shrinking soliton with\nbounded nonnegative curvature.  The limit is a compact round space form or\none of the three cylindrical models\n\\[\n S^2\\times\\mathbb R,\\qquad\n \\mathbb{RP}^2\\times\\mathbb R,\\qquad\n \\mathbb{RP}^2\\widetilde\\times\\mathbb R,\n\\]\nwhere the last space is the twisted line bundle.  If the original solution\nis nonround, a sequence can be chosen with one of these three noncompact\nlimits.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solutions and Asymptotic Models&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:104,&quot;ref&quot;:&quot;MT:ch9:9.11,MT:ch9:9.42,MT:ch9:9.44,MT:ch9:9.53,MT:ch9:9.54&quot;},{&quot;id&quot;:&quot;bf415d488cc7&quot;,&quot;label&quot;:&quot;def:reduced-volume&quot;,&quot;title&quot;:&quot;Reduced volume&quot;,&quot;display_title&quot;:&quot;Definition 2.27: Reduced volume&quot;,&quot;body&quot;:&quot;For a measurable set $A$ in the regular reduced-exponential image at time\n$T-\\tau$, its reduced volume based at $(x,T)$ is\n\\[\n \\widetilde V_x(A,\\tau)=\n \\int_A(4\\pi\\tau)^{-3/2}e^{-l_x(y,\\tau)}\n \\,d\\operatorname{vol}_{g(T-\\tau)}(y).\n\\]\nEquivalently, if $J(v,\\tau)$ is the Jacobian of the reduced exponential map\nand $\\widetilde A=(\\mathcal L\\exp_x^\\tau)^{-1}(A)$, then\n\\[\n \\widetilde V_x(A,\\tau)=\n \\int_{\\widetilde A}(4\\pi\\tau)^{-3/2}\n e^{-l_x(\\mathcal L\\exp_x^\\tau(v),\\tau)}J(v,\\tau)\\,dv.\n\\]\nWhen the regular image has full measure in the slice, write\n$\\widetilde V_x(\\tau)$ for the value obtained by taking that whole image.\nFor a family $A(\\tau)=\\mathcal L\\exp_x^\\tau(\\widetilde A)$ with\n$0&lt;\\tau\\le\\tau_0$, the reduced-volume monotonicity assertion below is used\nonly when there is one open smooth spacetime set $\\mathcal O$ containing\n$x$ and every $A(\\tau)$ such that every minimizing $\\mathcal L$-geodesic\nfrom $x$ to a point of $A(\\tau)$ stays in $\\mathcal O\\cup\\{x\\}$.\nThis is the common-domain hypothesis in Morgan--Tian&#x27;s monotonicity theorem.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Reduced Geometry&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:69,&quot;ref&quot;:&quot;MT:ch6:6.70,MT:ch6:6.71&quot;},{&quot;id&quot;:&quot;bfa2180fd4c9&quot;,&quot;label&quot;:&quot;lem:controlled-surgery-restart&quot;,&quot;title&quot;:&quot;Controlled restart after surgery&quot;,&quot;display_title&quot;:&quot;Lemma 3.33: Controlled restart after surgery&quot;,&quot;body&quot;:&quot;Let a controlled Ricci flow reach a finite singular time $T$.  In its maximal\nextension, cut every sufficiently curved horn at the central sphere of a\nstrong $\\bar\\delta(T)$-neck of scale $h(T)$, discard each horn end and each\ncomponent containing no controlled-curvature point, and insert the standard\ncaps.  For sufficiently small control, the post-surgery metric is smooth,\nretains curvature pinching, satisfies the seven controlled-flow conditions,\nand is initial data for a maximal ordinary Ricci flow.  The new flow retains\nthe stage noncollapsing and strong canonical-neighborhood estimates.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Surgery Continuation and Finiteness&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:133,&quot;ref&quot;:&quot;MT:ch15:15.8,MT:ch15:15.11&quot;},{&quot;id&quot;:&quot;bff20324cbd4&quot;,&quot;label&quot;:&quot;lem:transported-endpoint-separation&quot;,&quot;title&quot;:&quot;Endpoint separation and transported-length lower bound&quot;,&quot;display_title&quot;:&quot;Lemma 4.30: Endpoint separation and transported-length lower bound&quot;,&quot;body&quot;:&quot;Under the local data fixed above, every transported initial arc $E_{t&#x27;}$ of\nlength $r$ satisfies\n\\[\n L(E_t)\\ge(1-\\eta)r\\qquad(t&#x27;\\le t\\le t_2),\n\\]\nwhere $\\eta\\to0$ as $\\delta\\to0$, uniformly in the chosen arc.  Consequently,\nfor the cutoff chosen below to vanish when $0.45\\le|s|/r\\le0.5$, its support\nstays a positive intrinsic distance (at least $0.04r$ after decreasing\n$\\delta$) from both endpoints of $E_t$.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Localized Total-Curvature Control&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:168,&quot;ref&quot;:&quot;MT:ch19:19.60,MT:ch19:19.63&quot;},{&quot;id&quot;:&quot;c0fea205205b&quot;,&quot;label&quot;:&quot;thm:compact-kappa-solution-structure&quot;,&quot;title&quot;:&quot;Structure of compact kappa-solutions&quot;,&quot;display_title&quot;:&quot;Theorem 3.15: Structure of compact kappa-solutions&quot;,&quot;body&quot;:&quot;For every sufficiently small $\\epsilon&gt;0$ there is\n$C_1=C_1(\\epsilon)&lt;\\infty$ such that a compact three-dimensional\n$\\kappa$-solution is round, is a positively curved $C_1$-component, or is\nthe union of two disjoint $(C_1,\\epsilon)$-cap cores joined by a strong\n$\\epsilon$-tube.  In the nonround cases its time-zero slice is\ndiffeomorphic to $S^3$ or $\\mathbb{RP}^3$.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solution Geometry and Stability&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:115,&quot;ref&quot;:&quot;MT:ch9:9.89,MT:ch9:9.90,MT:ch9:9.91&quot;},{&quot;id&quot;:&quot;c1c624f5a6e1&quot;,&quot;label&quot;:&quot;thm:ramp-curve-shrinking-global-existence&quot;,&quot;title&quot;:&quot;Global existence for ramps&quot;,&quot;display_title&quot;:&quot;Theorem 4.28: Global existence for ramps&quot;,&quot;body&quot;:&quot;Let $(M,g(t))$, $t_0\\le t\\le t_1$, be a Ricci flow and let\n$c_0\\colon S^1\\to M\\times S^1_\\lambda$ be a $C^{2,\\alpha}$ ramp at time\n$t_0$, for some $0&lt;\\alpha&lt;1$.\nThen its curve-shrinking flow exists on all of $[t_0,t_1]$, remains immersed,\nand consists entirely of ramps.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Evolution Identities and Global Bounds&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:166,&quot;ref&quot;:&quot;MT:ch19:19.14&quot;},{&quot;id&quot;:&quot;c41e0879d383&quot;,&quot;label&quot;:&quot;thm:kappa-solution-structure-summary&quot;,&quot;title&quot;:&quot;Uniform structure of kappa-solutions&quot;,&quot;display_title&quot;:&quot;Theorem 3.16: Uniform structure of kappa-solutions&quot;,&quot;body&quot;:&quot;For every sufficiently small $\\epsilon&gt;0$ there is\n$C=C(\\epsilon)&lt;\\infty$ such that every three-dimensional\n$\\kappa$-solution is exactly one of the following seven source alternatives.\nFor the compact nonround branches, put\n$R_{\\max}=\\max_{M}R(\\cdot,0)$ and fix the diameter threshold\n$D_*=D_*(\\epsilon)$ supplied by the large-diameter structure theorem.  The\nround branch is disjoint from the nonround branches, and the two compact\nnonround branches are separated by this threshold:\n\\begin{enumerate}\n\\item the flow is round for all $t\\le0$, and its time-zero slice is\n      $S^3/\\Gamma$ for a finite subgroup $\\Gamma&lt;SO(4)$ acting freely;\n\\item (nonround) the time-zero slice is compact and positively curved, has\n      $\\operatorname{diam}M\\le D_*R_{\\max}^{-1/2}$ and\n      $C^{-1}R(x,0)^{-1/2}&lt;\\operatorname{diam}M&lt;C R(x,0)^{-1/2}$,\n      $C^{-1}R(x,0)^{-3/2}&lt;\\operatorname{Vol}M&lt;C R(x,0)^{-3/2}$,\n      and $C^{-1}R(x,0)&lt;K(P_y)&lt;C R(x,0)$ for every $y$ and $2$-plane\n      $P_y$; it is diffeomorphic to $S^3$ or $\\mathbb{RP}^3$;\n\\item (nonround) the time-zero slice is positively curved and is a double\n      $C$-capped strong $\\epsilon$-tube with\n      $\\operatorname{diam}M&gt;D_*R_{\\max}^{-1/2}$, hence is diffeomorphic to\n      $S^3$ or $\\mathbb{RP}^3$;\n\\item (nonround) the time-zero slice is positively curved and is a $C$-capped strong\n      $\\epsilon$-tube diffeomorphic to $\\mathbb R^3$;\n\\item the time-zero slice is the quotient of a round $S^2\\times\\mathbb R$\n      by a free orientation-preserving involution, is a $C$-capped strong\n      $\\epsilon$-tube, and is diffeomorphic to a punctured $\\mathbb{RP}^3$;\n\\item the time-zero slice is the product of a round $S^2$ and $\\mathbb R$\n      and is a strong $\\epsilon$-tube;\n\\item the time-zero slice is the product $\\mathbb{RP}^2\\times\\mathbb R$\n      with the constant-curvature metric on $\\mathbb{RP}^2$.\n\\end{enumerate}\nIn alternatives (3)--(5), points are in cap cores or are centers of strong\n$\\epsilon$-necks; in alternatives (1), (2), and (7) the source gives the\ncorresponding whole-component description.  Uniformly on the flow,\n\\[\n \\sup_{p\\in M,\\,t\\le0}\\frac{|\\nabla R(p,t)|}{R(p,t)^{3/2}}\\le C,\n \\qquad\n  \\sup_{p\\in M,\\,t\\le0}\\frac{|\\partial_tR(p,t)|}{R(p,t)^2}\\le C.\n\\]&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solution Geometry and Stability&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:116,&quot;ref&quot;:&quot;MT:ch9:9.93&quot;},{&quot;id&quot;:&quot;c498839d073a&quot;,&quot;label&quot;:&quot;lem:extinction-scalar-curvature-lower-bound&quot;,&quot;title&quot;:&quot;Scalar-curvature lower bound&quot;,&quot;display_title&quot;:&quot;Lemma 5.15: Scalar-curvature lower bound&quot;,&quot;body&quot;:&quot;For the normalized all-time controlled surgery flow, including the\npostsurgery time slices,\n\\[\n R_{\\min}(t)\\ge-\\frac6{1+4t}.\n\\]&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Eventual Vanishing of _2&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:193,&quot;ref&quot;:&quot;MT:ch18:18.1,MT:ch15:15.9&quot;},{&quot;id&quot;:&quot;c62f7c1e78a3&quot;,&quot;label&quot;:&quot;lem:loop-width-ode-formula&quot;,&quot;title&quot;:&quot;Integrating-factor formula&quot;,&quot;display_title&quot;:&quot;Lemma 5.30: Integrating-factor formula&quot;,&quot;body&quot;:&quot;Put\n\\[\n B_{t&#x27;}(t)=\\int_{t&#x27;}^t\\frac12R_{\\min}(s)\\,ds.\n\\]\nThen, for $t&#x27;&#x27;\\ge t&#x27;$,\n\\[\n w_{a,t&#x27;}(t&#x27;&#x27;)=e^{-B_{t&#x27;}(t&#x27;&#x27;)}\n \\left(a-2\\pi\\int_{t&#x27;}^{t&#x27;&#x27;}e^{B_{t&#x27;}(s)}\\,ds\\right).\n\\]\nIf $a&#x27;\\ge a$, then\n\\[\n w_{a&#x27;,t&#x27;}(t&#x27;&#x27;)-w_{a,t&#x27;}(t&#x27;&#x27;)\n =(a&#x27;-a)e^{-B_{t&#x27;}(t&#x27;&#x27;)}\\ge0.\n\\]\nOn a fixed compact time interval this difference is bounded by a constant\ntimes $a&#x27;-a$.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;The Width Comparison ODE&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:208,&quot;ref&quot;:&quot;MT:ch18:18.25,MT:ch18:18.26&quot;},{&quot;id&quot;:&quot;c7e76a82673e&quot;,&quot;label&quot;:&quot;def:morgan-tian-geometrized&quot;,&quot;title&quot;:&quot;Morgan--Tian geometrized closed three-manifold&quot;,&quot;display_title&quot;:&quot;Definition 6.27: Morgan--Tian geometrized closed three-manifold&quot;,&quot;body&quot;:&quot;A compact closed smooth $3$-manifold (possibly disconnected) is\n\\emph{MT-geometrized} if each connected component is a finite connected sum\nof closed prime $3$-manifolds carrying one of Thurston&#x27;s homogeneous\ngeometries.  In this predicate the two $S^2$-bundles $E_+$ and $E_-$ over\n$S^1$ are admitted as the homogeneous $S^2\\times\\mathbb R$ factors, and a\nconstant-positive-curvature space form is admitted as a spherical factor.\nThis is the source-level predicate used in Morgan--Tian Corollary~15.4; the\nmore detailed orientable graph/hyperbolic package is the separate\nKleiner--Lott definition below.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Backward Reconstruction from Extinction&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:262,&quot;ref&quot;:&quot;MT:ch15:15.4&quot;},{&quot;id&quot;:&quot;c7f77a2809ce&quot;,&quot;label&quot;:&quot;def:regular-polygonal-loop-approximation&quot;,&quot;title&quot;:&quot;Regular polygonal approximation&quot;,&quot;display_title&quot;:&quot;Definition 4.16: Regular polygonal approximation&quot;,&quot;body&quot;:&quot;Let $c\\colon S^1\\to M$ be $C^1$, let $n\\ge1$, and put\n$\\xi_n=e^{2\\pi i/n}$ and $p_j=c(\\xi_n^j)$.  Choose a minimizing geodesic\n$A_j$ from $p_j$ to $p_{j+1}$, with circular indexing, and parametrize it at\nconstant speed on the corresponding subinterval of $S^1$.  The resulting\npiecewise geodesic loop $c_n$ is a \\emph{regular $n$-polygonal approximation}\nof $c$.  When all sides lie below the injectivity radius, the choices are\nunique.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Polygonal Ramp Approximation&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:154,&quot;ref&quot;:&quot;MT:ch19:19.18&quot;},{&quot;id&quot;:&quot;c8a111c03976&quot;,&quot;label&quot;:&quot;prop:evolving-neck-gluing&quot;,&quot;title&quot;:&quot;Imported interface: gluing evolving necks&quot;,&quot;display_title&quot;:&quot;Proposition 2.18: Imported interface: gluing evolving necks&quot;,&quot;body&quot;:&quot;There is $0&lt;\\beta&lt;1/2$ such that the following holds for every\n$0&lt;\\epsilon&lt;1$.  Let\n$(N\\times[-t_0,0],g_1(t))$ be an evolving\n$\\beta\\epsilon$-neck centered at $x$ with $R(x,0)=1$, and let\n$(N&#x27;\\times(-t_1,-t_0],g_2(t))$ be a strong\n$\\beta\\epsilon/2$-neck.  Suppose an isometric identification of their\ntime-$-t_0$ slices sends $(x,-t_0)$ to the center of the strong neck.\nThen the induced flow on\n\\[\n N\\times[-t_0,0]\\mathbin{\\cup}N&#x27;\\times(-t_1,-t_0]\n\\]\ncontains a strong $\\epsilon$-neck centered at $(x,0)$.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;proposition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:60,&quot;ref&quot;:&quot;MT:ch15:15.1&quot;},{&quot;id&quot;:&quot;c97a532e4a8d&quot;,&quot;label&quot;:&quot;lem:whole-disappearing-component-classification&quot;,&quot;title&quot;:&quot;Whole disappearing components&quot;,&quot;display_title&quot;:&quot;Lemma 6.9: Whole disappearing components&quot;,&quot;body&quot;:&quot;Let $({\\mathcal M},G)$ be a controlled Ricci flow with surgery satisfying\nAssumptions (1)--(7) in the definition of controlled surgery.  Let $T$ be a\nsingular time and let $t^-&lt;T$ be regular and sufficiently close to $T$.  Write\n$C_T\\subset M_T$ for the continuing region, let\n$C_{t^-}\\subset M_{t^-}$ be its backward time-flow image, and put\n$D_{t^-}=M_{t^-}\\setminus C_{t^-}$.  If a connected component of $D_{t^-}$ is\nalso a whole component of $M_{t^-}$, then it is diffeomorphic\nto one of\n\\[\n S^3/\\Gamma,\\qquad \\mathbb{RP}^3\\mathbin{\\#}\\mathbb{RP}^3,\n \\qquad E_+,\n \\qquad E_-.\n\\]&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Reversing One Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:244,&quot;ref&quot;:&quot;MT:ch4:4.23,MT:ch15:15.3,MT:app:A.25&quot;},{&quot;id&quot;:&quot;ccd7605040d6&quot;,&quot;label&quot;:&quot;lem:orientability-preserved-by-surgery&quot;,&quot;title&quot;:&quot;Orientability is preserved by Ricci-flow surgery&quot;,&quot;display_title&quot;:&quot;Lemma 6.33: Orientability is preserved by Ricci-flow surgery&quot;,&quot;body&quot;:&quot;If the initial slice of a generalized Ricci flow satisfying Assumptions\n(1)--(7) is connected, closed, and orientable, then every descendant slice\nbefore extinction is orientable.  In a reverse-surgery connected-sum\ndescription, only the orientable bundle $E_+$ can occur.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Backward Reconstruction from Extinction&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:268,&quot;ref&quot;:&quot;MT:ch15:15.3,MT:ch15:15.4&quot;},{&quot;id&quot;:&quot;cced2941ff59&quot;,&quot;label&quot;:&quot;def:reduced-length&quot;,&quot;title&quot;:&quot;Reduced length&quot;,&quot;display_title&quot;:&quot;Definition 2.24: Reduced length&quot;,&quot;body&quot;:&quot;Fix a smooth point $(x,T)$ and write backward time as $\\tau=T-t$.  For a\npiecewise smooth backward path $\\gamma\\colon[0,\\bar\\tau]\\to\\mathcal M$\nwith $\\gamma(0)=x$ and $\\mathbf t(\\gamma(\\tau))=T-\\tau$, put\n$X_\\gamma=\\dot\\gamma+\\chi\\in\\mathcal H$.  Define\n\\[\n \\mathcal L(\\gamma)=\n \\int_0^{\\bar\\tau}\\sqrt\\tau\n \\bigl(R(\\gamma(\\tau))+|X_\\gamma(\\tau)|_G^2\\bigr)\\,d\\tau.\n\\]\nFor a point $y$ at backward time $\\bar\\tau$, let\n$L_x(y,\\bar\\tau)$ be the infimum of $\\mathcal L$ over such paths and put\n\\[\n l_x(y,\\bar\\tau)=\\frac{L_x(y,\\bar\\tau)}{2\\sqrt{\\bar\\tau}}.\n\\]\nThese quantities are used only on domains on which every competing path\nstays in the smooth locus.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Reduced Geometry&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:66,&quot;ref&quot;:&quot;MT:ch6:6.2,MT:ch6:6.45&quot;},{&quot;id&quot;:&quot;ce186647dac1&quot;,&quot;label&quot;:&quot;thm:kappa-solution-splitting-at-infinity&quot;,&quot;title&quot;:&quot;Splitting at infinity for kappa-solutions&quot;,&quot;display_title&quot;:&quot;Theorem 3.13: Splitting at infinity for kappa-solutions&quot;,&quot;body&quot;:&quot;Let $(M,g(t))$, $-\\infty&lt;t\\le0$, be a noncompact three-dimensional\n$\\kappa$-solution.  If $p_j\\to\\infty$ and\n\\[\n R(p_j,-1)d_{g(-1)}(p,p_j)^2\\longrightarrow\\infty,\n\\]\nthen there are points $q_j\\to\\infty$, scales $Q_j=R(q_j,-1)$, and a\nsubsequence for which the pointed rescaled flows converge smoothly to\n\\[\n (\\Sigma,h(t))\\times(\\mathbb R,ds^2),\n\\]\nwhere $(\\Sigma,h(t))$ is a shrinking compact round surface.  Thus\n$\\Sigma$ is $S^2$ or $\\mathbb{RP}^2$; if $M$ is orientable, it is $S^2$.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solution Geometry and Stability&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:113,&quot;ref&quot;:&quot;MT:ch9:9.39,MT:ch9:9.52&quot;},{&quot;id&quot;:&quot;ce9c2abb2e16&quot;,&quot;label&quot;:&quot;lem:graph-flow-tangential-derivative&quot;,&quot;title&quot;:&quot;Tangential component of _ZY&quot;,&quot;display_title&quot;:&quot;Theorem 4.36: Tangential component of _ZY&quot;,&quot;body&quot;:&quot;On $I&#x27;\\times[t&#x27;,t_2]$,\n\\[\n |\\langle\\nabla_ZY,Z\\rangle|\n \\le\\bigl(|f_z|_{h&#x27;}(|\\nabla_ZY|+2\\delta|Y|)\n       +\\delta|Z|^2|Y|\\bigr)(1+\\delta).\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Short-Time Curvature Barrier&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:174,&quot;ref&quot;:&quot;MT:ch19:19.67&quot;},{&quot;id&quot;:&quot;d01966a9dba1&quot;,&quot;label&quot;:&quot;def:ricci-flow-surgery-a-priori-assumptions&quot;,&quot;title&quot;:&quot;Kleiner--Lott a-priori assumptions&quot;,&quot;display_title&quot;:&quot;Definition 2.13: Kleiner--Lott a-priori assumptions&quot;,&quot;body&quot;:&quot;A flow on $I\\subset[0,\\infty)$ satisfies the a-priori assumptions for $(r,\\Phi)$\nwhen it satisfies both the preceding $r$-canonical-neighborhood and\n$\\Phi$-pinching assumptions on $I$.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:55,&quot;ref&quot;:&quot;KL:II.4:69.6&quot;},{&quot;id&quot;:&quot;d1f0076b74d6&quot;,&quot;label&quot;:&quot;lem:single-ramp-terminal-dichotomy&quot;,&quot;title&quot;:&quot;Single-ramp terminal dichotomy&quot;,&quot;display_title&quot;:&quot;Lemma 5.45: Single-ramp terminal dichotomy&quot;,&quot;body&quot;:&quot;In the setting of\n\\ref{thm:controlled-curve-shrinking-existence}, let\n$p_1\\colon M\\times S^1_\\lambda\\to M$ be product projection and fix\n$\\zeta&gt;0$.  There is\n$B&gt;(t_1-t_0)^{-1}$, depending only on $\\zeta$, the approximating family, and\nthe ambient Ricci-flow bounds, such that, with $t_2=t_1-B^{-1}$, the following\nholds.  For every $c\\in S^2$ there is $\\lambda_c&gt;0$ such that for every\n$0&lt;\\lambda&lt;\\lambda_c$ at least one of these alternatives holds:\n\\begin{enumerate}\n\\item\n\\[\n \\mathcal A_{g(t_1)}\n   \\bigl(p_1\\widetilde\\Gamma_c^\\lambda(t_1)\\bigr)\n &lt;w_{\\mathcal A_{g(t_0)}(\\widetilde\\Gamma(c)),t_0}(t_1)+\\zeta/2;\n\\]\n\\item\n\\[\n L\\bigl(\\widetilde\\Gamma_c^\\lambda(t)\\bigr)&lt;\\zeta/2\n \\qquad\\text{for every }t\\in[t_2,t_1].\n\\]\n\\end{enumerate}\nThe number $B$ is common to the whole compact family; only the preliminary\nthreshold $\\lambda_c$ is pointwise.  More precisely, the length-growth and\nstopping estimates furnish constants $C_2,C_5,\\delta&#x27;&gt;0$ (depending only on\nthe same family and ambient bounds), and $B$ is chosen so that\n\\[\n B\\ge \\frac{3C_5}{\\delta&#x27;},\\qquad\n B\\ge \\frac{3e^{C_2(t_1-t_0)}}{\\zeta},\\qquad\n B&gt;\\frac{C_2}{\\log 4-\\log 3}.\n\\]\nThe last inequality is the quantitative implication\n$e^{C_2/B}&lt;4/3$ used in the short-transfer argument.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Controlled Loop-Family Deformation&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:223,&quot;ref&quot;:&quot;MT:ch18:18.24&quot;},{&quot;id&quot;:&quot;d3773f5a6e9c&quot;,&quot;label&quot;:&quot;lem:neck-chain-product&quot;,&quot;title&quot;:&quot;A neck chain is a product&quot;,&quot;display_title&quot;:&quot;Lemma 1.28: A neck chain is a product&quot;,&quot;body&quot;:&quot;Let $N_j$ be a balanced, non-returning chain of sufficiently small\n$\\epsilon$-necks, with $N_i\\cap N_j=\\varnothing$ whenever\n$|i-j|\\ge3$.  For an infinite chain assume the positive-end frontier\ncondition stated below; for a finite chain assume\nthe two exposed ends are distinct.  Then the union\n$U=\\bigcup_jN_j$ is diffeomorphic to $S^2\\times(0,1)$, compatibly with the\nisotopy classes of all neck spheres.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:27,&quot;ref&quot;:&quot;MT:app:A.13&quot;},{&quot;id&quot;:&quot;d388b2082a09&quot;,&quot;label&quot;:&quot;lem:graph-flow-velocity-identities&quot;,&quot;title&quot;:&quot;Graph-flow velocity identities&quot;,&quot;display_title&quot;:&quot;Theorem 4.9: Graph-flow velocity identities&quot;,&quot;body&quot;:&quot;On the graph interval,\n\\[\n Y=\\frac{\\nabla_ZZ-\\langle\\Gamma(Z,Z),\\partial_z\\rangle_{h&#x27;}Z}{|Z|^2}\n =\\nabla_SS+\\left(\n \\frac{\\langle\\nabla_ZZ,Z\\rangle}{|Z|^4}\n -\\frac{\\langle\\Gamma(Z,Z),\\partial_z\\rangle_{h&#x27;}}{|Z|^2}\n \\right)Z.\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Graph-Flow Coordinate Estimates&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:147,&quot;ref&quot;:&quot;MT:ch19:19.64&quot;},{&quot;id&quot;:&quot;d41a89faf926&quot;,&quot;label&quot;:&quot;lem:retained-neck-surgery-pinching&quot;,&quot;title&quot;:&quot;Curvature and pinching on the retained neck&quot;,&quot;display_title&quot;:&quot;Lemma 1.16: Curvature and pinching on the retained neck&quot;,&quot;body&quot;:&quot;For the universal choices in\n\\ref{lem:conformal-surgery-curvature-comparison} and all sufficiently\nsmall $\\delta$, the metric $\\widetilde g$ has positive sectional curvature\non $1\\le s&lt;4$.  Moreover, if the original neck satisfies, for some\n$t\\ge0$ and $X_g=\\max(0,-\\nu_g)$,\n\\[\n R_g\\ge-\\frac6{1+4t},\n \\qquad\n R_g\\ge2X_g\\bigl(\\log X_g+\\log(1+t)-3\\bigr)\n \\quad(X_g&gt;0),\n\\]\nthen the same inequalities hold for $\\widetilde g$ on $s&lt;4$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:15,&quot;ref&quot;:&quot;MT:ch13:13.13,MT:ch13:13.14&quot;},{&quot;id&quot;:&quot;d569479001fb&quot;,&quot;label&quot;:&quot;lem:geometrization-closed-under-standard-factors&quot;,&quot;title&quot;:&quot;Orientable geometrization is closed under reverse-surgery factors&quot;,&quot;display_title&quot;:&quot;Lemma 6.32: Orientable geometrization is closed under reverse-surgery factors&quot;,&quot;body&quot;:&quot;Let $X$ be a connected, closed, orientable geometrized $3$-manifold.  If\n$Q$ is obtained from a connected-sum expression for $X$ by adjoining finitely\nmany orientable spherical space forms and copies of $E_+=S^2\\times S^1$ and\nperforming finitely many connected-sum operations, then $Q$ is connected,\nclosed, orientable, and geometrized.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Backward Reconstruction from Extinction&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:267,&quot;ref&quot;:&quot;KL:app:geom,MT:ch15:15.3,MT:ch15:15.4&quot;},{&quot;id&quot;:&quot;d5e974cc00ad&quot;,&quot;label&quot;:&quot;lem:ordered-relative-capped-cover&quot;,&quot;title&quot;:&quot;Ordered incidence of a relative capped cover&quot;,&quot;display_title&quot;:&quot;Lemma 6.19: Ordered incidence of a relative capped cover&quot;,&quot;body&quot;:&quot;Let $Y$ be a connected canonical cap/neck component with the ordered\nincidence structure supplied by Appendix~A.21: after cutting along its central\nneck spheres, the incidence graph is a finite interval, a half-line, a line,\nor a circle; every edge is an $S^2\\times I$ product collar and every cap is a\nterminal vertex with core diffeomorphic to a $3$-ball or to\n$\\mathbb{RP}^3\\setminus\\operatorname{int}(B^3)$.  Let $D\\subset Y$ be a\nproper connected open set with compact smooth codimension-zero closure, whose\nnonempty frontier is a finite union of the displayed cross-sectional spheres\nand satisfies\n\\[\n \\partial\\overline D=\\operatorname{Fr}_Y(D)\\ne\\varnothing.\n\\]\nIf $D$ meets a cap core, then $\\operatorname{Fr}_Y(D)$ has exactly one\ncomponent and\n\n\\[\n \\overline D\\cong B^3\n \\quad\\text{or}\\quad\n \\overline D\\cong\\mathbb{RP}^3\\setminus\\operatorname{int}(B^3).\n\\]&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Reversing One Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:254,&quot;ref&quot;:&quot;MT:app:A.21,MT:app:A.23,MT:app:A.24,MT:app:A.25&quot;},{&quot;id&quot;:&quot;d6656f8614ed&quot;,&quot;label&quot;:&quot;lem:smooth-annular-minimizer-bridge&quot;,&quot;title&quot;:&quot;Smooth-flow bridge to the annular minimizer contract&quot;,&quot;display_title&quot;:&quot;Lemma 5.39: Smooth-flow bridge to the annular minimizer contract&quot;,&quot;body&quot;:&quot;Let $(M,g(t))$, $t_0\\le t\\le t_1$, be a smooth Ricci flow on a compact\nthree-manifold, and let $c_0(t),c_1(t)$ be smooth degree-one ramp\ncurve-shrinking flows in $M\\times S^1_\\lambda$ in one free homotopy class.\nAt each $t&gt;t_0$ the metric and the two evolved curves are real analytic, the\nannular nondegeneration bound of\n\\ref{lem:ramp-annulus-nondegeneration} holds.  The preceding theorem then\nproduces a classical Douglas solution with the stated finite branch set and\ncollar exhaustion.  The same assertion at $t=t_0$ and all right-hand\nvariation statements are understood as limits of real-analytic approximants\nto the initial metric and curves.\nAfter the false boundary branches are reparameterized, the pullback metric is\nregularized near its finitely many interior branch points: for every prescribed\narea tolerance it is replaced by a smooth metric with at most twice the\nannulus area and with a finite ambient-dependent upper Gaussian-curvature\nbound.  This regularization is part of the annular comparison contract.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Controlled Loop-Family Deformation&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:217,&quot;ref&quot;:&quot;MT:ch19:19.15&quot;},{&quot;id&quot;:&quot;d765b5ede102&quot;,&quot;label&quot;:&quot;lem:blowup-limit-slice-bounded-curvature&quot;,&quot;title&quot;:&quot;Bounded curvature of a blow-up limit slice&quot;,&quot;display_title&quot;:&quot;Lemma 2.56: Bounded curvature of a blow-up limit slice&quot;,&quot;body&quot;:&quot;Let $(M,g,x)$ be a complete, connected, nonflat, three-dimensional\nRiemannian manifold with nonnegative curvature and $R_g(x)=1$.  Assume that\nfor every $A&lt;\\infty$ there is a compatible smooth pointed Ricci-flow limit on\n$B_g(x,A)\\times[-\\tau_A,0]$, with $\\tau_A&gt;0$, whose zero-time slice is\n$g|_{B_g(x,A)}$ and whose slices have nonnegative curvature.  Assume also\nthat every point $q$ with $R_g(q)&gt;4$ has a strong $(2C,2\\epsilon)$-canonical\nneighborhood in the zero-time slice.  For sufficiently small $\\epsilon$, the\ncurvature of $(M,g)$ is bounded on the whole slice:\n\\[\n \\sup_{q\\in M}|\\operatorname{Rm}_g(q)|&lt;\\infty.\n\\]\nThe same conclusion applies to every time slice of a smooth pointed limit\nflow whenever the stated limit-canonical-neighborhood hypothesis is supplied\nat that time.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:98,&quot;ref&quot;:&quot;MT:ch11:11.7&quot;},{&quot;id&quot;:&quot;d78b21365ab2&quot;,&quot;label&quot;:&quot;lem:normalized-initial-metric-exists&quot;,&quot;title&quot;:&quot;Existence of a normalized initial metric&quot;,&quot;display_title&quot;:&quot;Lemma 6.36: Existence of a normalized initial metric&quot;,&quot;body&quot;:&quot;Every closed smooth $3$-manifold admits a Riemannian metric which is normalized\nin the sense required by the all-time controlled-surgery theorem.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Connected Sums and Fundamental Groups&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:271,&quot;ref&quot;:&quot;MT:ch15:p:353&quot;},{&quot;id&quot;:&quot;d7cbc85ad894&quot;,&quot;label&quot;:&quot;lem:finite-neck-chain-frontier-dichotomy&quot;,&quot;title&quot;:&quot;Finite neck-chain frontier extension dichotomy&quot;,&quot;display_title&quot;:&quot;Lemma 1.31: Finite neck-chain frontier extension dichotomy&quot;,&quot;body&quot;:&quot;Let $X$ be connected in a boundaryless smooth Riemannian three-manifold $M$,\nand let $U$ be the compact closure of the union of a finite balanced chain of\nsufficiently small $\\epsilon$-necks.  Assume\n$X\\cap\\operatorname{int}U\\ne\\varnothing$ and\n$X\\cap(M\\setminus\\overline U)\\ne\\varnothing$, and that every point of\n$X\\setminus\\operatorname{int}U$ is the center of an $\\epsilon$-neck whose\ncentral sphere separates $M$.  Then $X$ meets the frontier of one exposed end\nof $U$ at a neck center, and that neck extends the balanced chain after an\naxial reorientation.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:30,&quot;ref&quot;:&quot;MT:app:A.17,MT:app:A.18,MT:app:A.21&quot;},{&quot;id&quot;:&quot;da34bc1d727d&quot;,&quot;label&quot;:&quot;def:local-neck-surgery-data&quot;,&quot;title&quot;:&quot;Local neck-surgery data&quot;,&quot;display_title&quot;:&quot;Definition 1.9: Local neck-surgery data&quot;,&quot;body&quot;:&quot;Let $(N,g)$ be a $\\delta$-neck centered at $x_0$, let\n$Q=R_g(x_0)$, and let\n\\[\n \\rho\\colon S^2\\times(-\\delta^{-1},\\delta^{-1})\\longrightarrow N\n\\]\nbe its neck chart.  Assume $\\delta^{-1}&gt;A_0+4$.  Form $\\mathcal S$ by\ngluing $S^2\\times(-\\delta^{-1},4)$ to\n$B_{g_0}(p_0,A_0+4)$ through the cylindrical isometry on\n$S^2\\times(0,4)$.  The two axial coordinates glue to\n\\[\n s\\colon\\mathcal S\\longrightarrow(-\\delta^{-1},A_0+4].\n\\]\nFix smooth cutoffs $\\alpha\\colon[1,2]\\to[0,1]$ and\n$\\beta\\colon[A_0+4-r_0,A_0+4]\\to[0,1]$, equal to $1$ near their left\nendpoints and $0$ near their right endpoints.  Put\n\\[\n \\eta=1-\\delta,\n \\qquad\n f(s)=\\begin{cases}\n 0,&amp;s\\le0,\\\\\n C_0\\delta e^{-q/s},&amp;s&gt;0.\n \\end{cases}\n\\]&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:8,&quot;ref&quot;:&quot;MT:ch13:13.1,MT:ch13:13.2&quot;},{&quot;id&quot;:&quot;da9c7ade7060&quot;,&quot;label&quot;:&quot;thm:free-product-connected-sum-classification&quot;,&quot;title&quot;:&quot;The free-product topology theorem&quot;,&quot;display_title&quot;:&quot;Theorem 6.37: The free-product topology theorem&quot;,&quot;body&quot;:&quot;Let $M$ be a closed connected smooth $3$-manifold whose fundamental group is\na free product of finite groups and infinite cyclic groups.  Then $M$ is a\nfinite connected sum of spherical space forms and copies of $E_+$ and $E_-$.\nIf $M$ is orientable, only $E_+$ occurs.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Connected Sums and Fundamental Groups&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:272,&quot;ref&quot;:&quot;MT:intro:0.1&quot;},{&quot;id&quot;:&quot;db2a61f4d32e&quot;,&quot;label&quot;:&quot;thm:free-product-pi2-obstruction&quot;,&quot;title&quot;:&quot;Imported Morgan--Tian/Hempel free-product obstruction to vanishing _2&quot;,&quot;display_title&quot;:&quot;Theorem 5.21: Imported Morgan--Tian/Hempel free-product obstruction to vanishing _2&quot;,&quot;body&quot;:&quot;If $X$ is a closed connected three-manifold with $\\pi_1(X)$ a nontrivial\nfree product or $\\pi_1(X)\\cong\\mathbb Z$, then $\\pi_2(X)\\ne0$.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Late-Component _3 Topology&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:199,&quot;ref&quot;:&quot;MT:ch18:18.20&quot;},{&quot;id&quot;:&quot;dbf6a4b24420&quot;,&quot;label&quot;:&quot;def:stagewise-delta-selector&quot;,&quot;title&quot;:&quot;Stagewise surgery-control selector&quot;,&quot;display_title&quot;:&quot;Definition 2.53: Stagewise surgery-control selector&quot;,&quot;body&quot;:&quot;For fixed stage data $(i,\\delta_i,r_i,\\kappa_i,T_i)$, a\n\\emph{stagewise surgery-control selector} is a function\n\\[\n \\mathfrak d_i:(0,r_i]\\longrightarrow(0,\\delta_i]\n\\]\nsuch that the conditional extension conclusion below holds with the cutoff\nbound $\\bar\\delta\\le\\mathfrak d_i(r)$ at radius $r$.  Whenever the\npointwise existence statement is used for a family of radii, one selector is\nfixed once and for all by the axiom of choice; the notation\n$\\delta(r)$ in later first-failure arguments means this fixed\n$\\mathfrak d_i(r)$ for the relevant stage, not an unquantified new witness.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:95,&quot;ref&quot;:&quot;KL:II.5:II.5.2&quot;},{&quot;id&quot;:&quot;ddac191ad725&quot;,&quot;label&quot;:&quot;lem:maximal-cap-selection&quot;,&quot;title&quot;:&quot;Maximal cap selection along a connected covered set&quot;,&quot;display_title&quot;:&quot;Lemma 1.41: Maximal cap selection along a connected covered set&quot;,&quot;body&quot;:&quot;Let $X$ be connected and suppose every point of $X$ is a neck center or lies\nin a $(C,\\epsilon)$-cap core.  If $X$ meets a cap core, then there is a cap\n$C_0$ meeting $X$ such that no finite balanced neck extension from $C_0$ has a\nfrontier point of $X$ in the core of a strictly larger cap.  The choice is\nmade along the ordered cap/neck incidence relation; it is not an arbitrary\nmaximal element of an unproved partial order.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:40,&quot;ref&quot;:&quot;MT:app:A.21,MT:app:A.22,MT:app:A.23&quot;},{&quot;id&quot;:&quot;ddf6538c6124&quot;,&quot;label&quot;:&quot;lem:standard-surgery-cap-model&quot;,&quot;title&quot;:&quot;Imported interface: fixed standard surgery-cap model&quot;,&quot;display_title&quot;:&quot;Lemma 2.4: Imported interface: fixed standard surgery-cap model&quot;,&quot;body&quot;:&quot;Fix a sufficiently small global $\\epsilon&gt;0$ and put $A=10$.  There are\n$B&gt;A$, $k&gt;0$, a smooth $F:(-B,\\infty)\\to\\mathbb R$, and a complete\n$O(3)$-invariant metric $g_0$ on\n$\\mathbb R^3=D^3\\cup((-B,\\infty)\\times S^2)$ such that $F=0$ on\n$[0,\\infty)$, $g_0=e^{2F}g_{\\mathrm{cyl}}$ on the cylindrical end, and\n$g_0|_{D^3}$ has constant sectional curvature $k^2$.  The restriction\n$f=F|_{(-A,0]}$ satisfies\n\\[\n f^{(m)}(0)=0\\ (m\\ge0),\\quad f&lt;0,\\quad f&#x27;&gt;0,\\quad f&#x27;&#x27;&lt;0,\\quad\n \\|f\\|_{C^2}&lt;\\epsilon,\\quad\n \\max\\{|f|,|f&#x27;|\\}\\le\\epsilon|f&#x27;&#x27;|,\n\\]\nand $g_0$ has nonnegative curvature operator and scalar curvature at least\none.  Fix this tuple $(B,F,k,g_0)$ henceforth.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:46,&quot;ref&quot;:&quot;KL:II.2:before-60.2,KL:II.4:72.1,KL:II.4:72.20&quot;},{&quot;id&quot;:&quot;de24ec976230&quot;,&quot;label&quot;:&quot;lem:all-neck-component-tube-or-bundle&quot;,&quot;title&quot;:&quot;All-neck components are tubes or sphere bundles&quot;,&quot;display_title&quot;:&quot;Lemma 1.34: All-neck components are tubes or sphere bundles&quot;,&quot;body&quot;:&quot;For sufficiently small $\\epsilon$, let $Y$ be a connected Riemannian\nthree-manifold without boundary such that every point of $Y$ is the center of\nan embedded $\\epsilon$-neck.  Then either $Y$ is diffeomorphic to\n$S^2\\times(0,1)$ and is an $\\epsilon$-tube, or $Y$ is diffeomorphic to an\n$S^2$-bundle over $S^1$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:33,&quot;ref&quot;:&quot;MT:app:A.20&quot;},{&quot;id&quot;:&quot;de78aa012715&quot;,&quot;label&quot;:&quot;thm:forward-dini-comparison&quot;,&quot;title&quot;:&quot;Forward-Dini comparison principle&quot;,&quot;display_title&quot;:&quot;Theorem 1.2: Forward-Dini comparison principle&quot;,&quot;body&quot;:&quot;Let $f\\colon[a,b]\\to\\mathbb R$ be continuous, let\n$\\psi\\colon[a,b]\\times\\mathbb R\\to\\mathbb R$ be of class $C^1$, and\nsuppose\n\\[\n  D^+f(t)\\le \\psi(t,f(t))\\qquad(a\\le t&lt;b).\n\\]\nIf $G\\in C^1([a,b])$ satisfies $G&#x27;(t)=\\psi(t,G(t))$ and\n$f(a)\\le G(a)$, then $f(t)\\le G(t)$ for every $t\\in[a,b]$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Forward-Difference Comparison&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:1,&quot;ref&quot;:&quot;MT:ch2:2.22&quot;},{&quot;id&quot;:&quot;e0785f0ad6be&quot;,&quot;label&quot;:&quot;lem:balanced-neck-chain-extension&quot;,&quot;title&quot;:&quot;Extension of a balanced neck chain&quot;,&quot;display_title&quot;:&quot;Lemma 1.30: Extension of a balanced neck chain&quot;,&quot;body&quot;:&quot;For all sufficiently small $\\epsilon$, let\n$N_a,\\ldots,N_b$ be a balanced chain whose central spheres separate $M$.\nIf a point in the frontier of its positive end is the center of an\n$\\epsilon$-neck $N$, then, after reversing $N$ if necessary,\n$N_a,\\ldots,N_b,N$ is a balanced chain.  The analogous assertion holds at\nthe negative end.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:29,&quot;ref&quot;:&quot;MT:app:A.17,MT:app:A.18&quot;},{&quot;id&quot;:&quot;e1d7d80c3e94&quot;,&quot;label&quot;:&quot;lem:localized-total-curvature-evolution&quot;,&quot;title&quot;:&quot;Localized total-curvature differential inequality&quot;,&quot;display_title&quot;:&quot;Theorem 4.32: Localized total-curvature differential inequality&quot;,&quot;body&quot;:&quot;There are constants $D_2,D_3&lt;\\infty$, depending only on\n$\\Theta,L_0$, and the ambient flow, such that the weighted curvature is\nlocally absolutely continuous and, for almost every $t&#x27; &lt; t\\le t_2$,\n\\[\n \\frac d{dt}\\int_{\\gamma_t}\\varphi k\\,ds\n \\le D_2\\left(1+\\frac1{r\\sqrt{t-t&#x27;}}\\right)+\\frac{D_2}{r^2}\n       +D_3\\int_{\\gamma_t}\\varphi k\\,ds\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Localized Total-Curvature Control&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:170,&quot;ref&quot;:&quot;MT:ch19:19.61&quot;},{&quot;id&quot;:&quot;e3bfa463978d&quot;,&quot;label&quot;:&quot;def:normalized-riemannian-three-manifold&quot;,&quot;title&quot;:&quot;Normalized compact Riemannian three-manifold&quot;,&quot;display_title&quot;:&quot;Definition 2.3: Normalized compact Riemannian three-manifold&quot;,&quot;body&quot;:&quot;A compact Riemannian three-manifold $(M,g)$ is normalized when\n$|\\operatorname{Rm}_g|\\le1$ and\n\\[\n \\operatorname{Vol}_g B_g(x,1)\\ge\n \\tfrac12\\operatorname{Vol}_{\\mathbb R^3}B(0,1)\n \\qquad(x\\in M).\n\\]&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:45,&quot;ref&quot;:&quot;KL:II.5:Def1&quot;},{&quot;id&quot;:&quot;e4211b5eebba&quot;,&quot;label&quot;:&quot;def:controlled-surgery-parameters&quot;,&quot;title&quot;:&quot;Controlled surgery parameters&quot;,&quot;display_title&quot;:&quot;Definition 2.19: Controlled surgery parameters&quot;,&quot;body&quot;:&quot;On every finite restriction $[0,b]$ of the all-time construction, fix the\nfinite-horizon surgery producer $\\Phi_{\\mathrm{HI}}^{b,g(0)}$ from\n\\ref{lem:finite-horizon-surgery-phi-envelope}; all occurrences of\n$\\Phi_{\\mathrm{HI}}$ below mean this fixed producer on that restriction.\nFix $\\epsilon&gt;0$ sufficiently small and choose $C$ larger than the uniform\ncanonical-neighborhood constants for the standard solution and for\nthree-dimensional $\\kappa$-solutions.  Put $t_0=2^{-5}$ and\n$T_i=2^it_0$.  The control data are positive nonincreasing sequences\n\\[\n \\mathbf r=(r_i)_{i\\ge0},\\qquad\n \\mathbf K=(\\kappa_i)_{i\\ge0},\\qquad\n \\boldsymbol\\delta=(\\delta_i)_{i\\ge0},\n\\qquad r_0=\\epsilon,\n\\]\nwhere $\\kappa_0&gt;0$ and $0&lt;\\delta_0\\le\\delta_0^{\\rm cap}$ are fixed initial\nentries.  The all-time\nexistence theorem chooses $\\kappa_0$ from the normalized short-time estimate\nand chooses $\\delta_0$ below the fixed local-surgery, neck-gluing, and\ncap-barrier thresholds.  Their associated step functions are\n\\[\n r(t)=r_0,\\quad\\kappa(t)=\\kappa_0\n \\quad(0\\le t&lt;T_0),\n\\]\nand have values $r_{i+1}$ and $\\kappa_{i+1}$ on\n$[T_i,T_{i+1})$.  A positive nonincreasing surgery-control function\n$\\bar\\delta(t)$ is required to have no transition on $[0,T_0]$ and to\nsatisfy, at every later transition time,\n\\[\n \\bar\\delta(t)&lt;\\delta_{i+1}\\le\\delta_0^{\\rm cap}\n \\qquad(T_i&lt;t\\le T_{i+1}),\n\\]\nwhere $\\delta_0^{\\rm cap}$ is the cap-insertion threshold in\n\\ref{lem:ricci-flow-surgery-cap-insertion}.\nDefine\n\\[\n \\rho(t)=\\bar\\delta(t)r(t),\n \\qquad\n h(t)=H(\\Phi_{\\mathrm{HI}}^{b,g(0)},t,r,\\bar\\delta(t))\n \\le \\bar\\delta(t)^2r(t),\n\\]\nat surgery times; this is the neck scale supplied by\n\\ref{lem:ricci-flow-surgery-horn-scale}.\nAt a surgery time $t$, every cutting sphere is the central sphere of a strong\n$\\bar\\delta(t)$-neck of scalar curvature $h(t)^{-2}$.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:61,&quot;ref&quot;:&quot;MT:ch15:15.5,MT:ch15:15.6,MT:ch15:15.7&quot;},{&quot;id&quot;:&quot;e57b0a4ff9d7&quot;,&quot;label&quot;:&quot;def:loop-width-comparison-ode&quot;,&quot;title&quot;:&quot;Comparison equation&quot;,&quot;display_title&quot;:&quot;Definition 5.29: Comparison equation&quot;,&quot;body&quot;:&quot;For a compact Ricci flow $(M,g(t))$, $t\\in[t_0,t_1]$, and\n$t&#x27;\\in[t_0,t_1]$, let $w_{a,t&#x27;}$ be the solution of\n\\[\n w&#x27;=-2\\pi-\\frac12R_{\\min}(t)w,\n \\qquad w(t&#x27;)=a.\n\\]\nWrite $w_a=w_{a,t_0}$.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;The Width Comparison ODE&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:207,&quot;ref&quot;:&quot;MT:ch18:18.23&quot;},{&quot;id&quot;:&quot;e5a1514edda1&quot;,&quot;label&quot;:&quot;thm:pointed-controlled-flow-compactness&quot;,&quot;title&quot;:&quot;Pointed compactness for controlled flows&quot;,&quot;display_title&quot;:&quot;Theorem 2.58: Pointed compactness for controlled flows&quot;,&quot;body&quot;:&quot;Let $(\\mathcal M_j,G_j,x_j,t_j)$ be based controlled three-dimensional Ricci\nflows and put $Q_j=R_{G_j(t_j)}(x_j)\\to\\infty$.  Write\n$\\widetilde G_j(s)=Q_jG_j(t_j+Q_j^{-1}s)$, so that the base time is zero\nand $R_{\\widetilde G_j(0)}(x_j)=1$.  Assume curvature is pinched toward positive, and the rescaled\nflows satisfy the uniform source predicate\n\\ref{def:surgery-flow-noncollapsing} on every fixed scale for $s&lt;0$.  Every\npoint at nonpositive time with rescaled scalar curvature at least four has a\nstrong $(C,\\epsilon)$-canonical neighborhood.  Suppose that for some\n$0&lt;T_0\\le\\infty$, every fixed\n$B(x_j,0,A)\\times(-T,0]$, with $A&lt;\\infty$ and $T&lt;T_0$, eventually has a\ncompatible spacetime embedding.  In addition, assume that there are fixed\n$\\eta&gt;0$ and $v_0&gt;0$ such that, for all sufficiently large $j$,\n\\[\n \\operatorname{Vol}_{\\widetilde G_j(0)}\n B_{\\widetilde G_j(0)}(x_j,\\eta)\\ge v_0.\n\\]\nThis is the volume-branch input required by Hamilton compactness; in the\nfirst-failure application it is supplied by the ordinary noncollapsing bridge\nand is not inferred from the positive-component exception in the surgery\nnoncollapsing predicate.  Then a subsequence converges smoothly to a complete\npointed Ricci flow on $(-T_0,0]$ with nonnegative curvature, locally bounded\nin time, and the source noncollapsing disjunction passes to the limit.  If\n$T_0=\\infty$ and the positive-sectional-curvature alternative is absent on\nevery limit slice, the limit is a $\\kappa$-solution; without that absence\nhypothesis the conclusion is only the displayed disjunctive predicate.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:100,&quot;ref&quot;:&quot;MT:ch11:11.1,MT:ch11:11.8,MT:ch11:11.10&quot;},{&quot;id&quot;:&quot;e73998aba973&quot;,&quot;label&quot;:&quot;thm:ancient-scalar-curvature-monotonicity&quot;,&quot;title&quot;:&quot;Ancient scalar-curvature monotonicity&quot;,&quot;display_title&quot;:&quot;Theorem 2.39: Ancient scalar-curvature monotonicity&quot;,&quot;body&quot;:&quot;Let $(M,g(t))$, $-\\infty&lt;t\\le0$, be a complete Ricci flow with bounded\nnonnegative curvature operator on each time slice.  Then\n\\[\n \\partial_tR(x,t)\\ge0\n\\]\nat every spacetime point.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Local Curvature and Neck Estimates&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:81,&quot;ref&quot;:&quot;MT:ch4:4.37,MT:ch4:4.39&quot;},{&quot;id&quot;:&quot;e7695b826f1a&quot;,&quot;label&quot;:&quot;lem:finite-cap-chain-frontier-dichotomy&quot;,&quot;title&quot;:&quot;Finite cap-chain frontier dichotomy&quot;,&quot;display_title&quot;:&quot;Lemma 1.40: Finite cap-chain frontier dichotomy&quot;,&quot;body&quot;:&quot;Let $X$ be connected and let $U$ be the compact closure of a connected union\nof one $(C,\\epsilon)$-cap and a finite balanced chain of $\\epsilon$-necks,\nattached at the negative end with only the positive end exposed as in\n\\ref{lem:capped-chain-exposed-frontier}.\nAssume $X\\cap\\operatorname{int}U\\ne\\varnothing$ and\n$X\\cap(M\\setminus\\overline U)\\ne\\varnothing$, and every point of\n$X\\setminus\\operatorname{int}U$ is either an $\\epsilon$-neck center or lies in\nthe core of a $(C,\\epsilon)$-cap.  If $X\\not\\subset U$, then\n$X\\cap\\operatorname{Fr}_M(U)$ contains either a neck center whose neck extends\nthe balanced chain or a point in the core of a second cap.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:39,&quot;ref&quot;:&quot;MT:app:A.21&quot;},{&quot;id&quot;:&quot;e788faf5248f&quot;,&quot;label&quot;:&quot;prop:reduced-injectivity-set-monotonicity&quot;,&quot;title&quot;:&quot;Monotonicity of the reduced injectivity sets&quot;,&quot;display_title&quot;:&quot;Proposition 2.26: Monotonicity of the reduced injectivity sets&quot;,&quot;body&quot;:&quot;If $0&lt;\\tau&lt;\\tau&#x27;$, then\n\\[\n \\mathcal D_x^{\\tau&#x27;}\\subset\\mathcal D_x^\\tau.\n\\]\nThus an initial-vector set contained in $\\mathcal D_x^{\\tau_0}$ has\nwell-defined injective prefixes at every earlier time.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Reduced Geometry&quot;,&quot;kind&quot;:&quot;proposition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:68,&quot;ref&quot;:&quot;MT:ch6:6.30&quot;},{&quot;id&quot;:&quot;e7b507d1568a&quot;,&quot;label&quot;:&quot;lem:regularized-curve-curvature-inequality&quot;,&quot;title&quot;:&quot;Regularized curvature inequality&quot;,&quot;display_title&quot;:&quot;Theorem 4.24: Regularized curvature inequality&quot;,&quot;body&quot;:&quot;There is a constant $C_1&lt;\\infty$, depending only on bounds for the ambient\nRicci flow and its first covariant curvature derivative, such that, for every\n$\\epsilon&gt;0$ and\n$h_\\epsilon=(k^2+\\epsilon^2)^{1/2}$,\n\\[\n \\partial_t h_\\epsilon\\le h_\\epsilon&#x27;&#x27;+k^3+C_1(h_\\epsilon+1).\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Evolution Identities and Global Bounds&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:162,&quot;ref&quot;:&quot;MT:ch19:19.8&quot;},{&quot;id&quot;:&quot;e8e99e72321a&quot;,&quot;label&quot;:&quot;lem:local-capping-connected-sum-identities&quot;,&quot;title&quot;:&quot;Connected-sum effect of capping frontier spheres&quot;,&quot;display_title&quot;:&quot;Lemma 6.22: Connected-sum effect of capping frontier spheres&quot;,&quot;body&quot;:&quot;Let $X$ be a connected closed smooth $3$-manifold and let\n$C\\subset X$ be a compact codimension-zero smooth submanifold whose relative\nboundary is the frontier-sphere union in\n\\ref{lem:frontier-disappearing-component-classification}.  Use collar\ncoordinates to identify each boundary sphere with the corresponding central\nneck sphere, and let $Y$ be obtained by deleting $\\operatorname{int}C$ and\ncapping every resulting boundary sphere by a smooth $3$-ball.\n\\begin{enumerate}\n\\item If $C\\cong B^3$, then $X\\cong Y$.\n\\item If $C\\cong\\mathbb{RP}^3\\setminus\\operatorname{int}(B^3)$, then\n  $X\\cong Y\\#\\mathbb{RP}^3$.\n\\item If $C\\cong S^2\\times[0,1]$ and its middle sphere separates $X$, then\n  $Y=Y_1\\sqcup Y_2$ and $X\\cong Y_1\\#Y_2$.\n\\item If $C\\cong S^2\\times[0,1]$ and its middle sphere does not separate $X$,\n  then $Y$ is connected and $X\\cong Y\\#E_\\varepsilon$ for some\n  $\\varepsilon\\in\\{+,-\\}$.  If $X$ is orientable, then $\\varepsilon=+$.\n\\end{e
