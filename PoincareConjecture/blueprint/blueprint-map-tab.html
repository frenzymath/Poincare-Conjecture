cal-neighborhood failure&quot;,&quot;body&quot;:&quot;Fix a finite induction stage and a sequence $r_a\\downarrow0$.  Suppose that\nfor every $a$ there are controlled surgery flows with surgery controls\ntending to zero for which the strong $(C,\\epsilon)$-canonical-neighborhood\nassumption with parameter $r_a$ fails before the stage endpoint.  For each\n$a$, after passing sufficiently far down that sequence, there is a first\nfailure time $t_{a,b}$ and a point $x_{a,b}$ at that time such that\n$R(x_{a,b})\\ge r_a^{-2}$, the assumption holds before $t_{a,b}$, and no\nstrong $(C,\\epsilon)$-canonical neighborhood exists at $x_{a,b}$.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;First-Failure Extension&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:119,&quot;ref&quot;:&quot;MT:ch17:17.2&quot;},{&quot;id&quot;:&quot;6364ac4cf64c&quot;,&quot;label&quot;:&quot;thm:finite-essential-sphere-surgeries&quot;,&quot;title&quot;:&quot;Finiteness of essential sphere surgeries&quot;,&quot;display_title&quot;:&quot;Theorem 5.14: Finiteness of essential sphere surgeries&quot;,&quot;body&quot;:&quot;In a controlled Ricci flow with surgery, only finitely many\nsurgery times use a sphere which is non-null-homotopic in its presurgery\ncomponent.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Two-Sphere Width Control&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:192,&quot;ref&quot;:&quot;MT:ch18:18.8&quot;},{&quot;id&quot;:&quot;637f01ebdc91&quot;,&quot;label&quot;:&quot;lem:two-sphere-width-surgery-control&quot;,&quot;title&quot;:&quot;Two-sphere width across a trivial surgery&quot;,&quot;display_title&quot;:&quot;Lemma 5.9: Two-sphere width across a trivial surgery&quot;,&quot;body&quot;:&quot;Let $T$ be a surgery time after which the surgery spheres in a continuing\ncomponent are null-homotopic (and hence separating by\n\\ref{lem:nullhomotopic-embedded-sphere-separates}), and suppose the selected\npostsurgery component\nhas nonzero $\\pi_2$.  Then\n\\[\n W_2(T)\\le\\liminf_{t\\uparrow T}W_2(t).\n\\]&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Two-Sphere Width Control&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:187,&quot;ref&quot;:&quot;MT:ch18:18.11,MT:ch15:15.12&quot;},{&quot;id&quot;:&quot;63e8303c1711&quot;,&quot;label&quot;:&quot;lem:adjacent-canonical-caps-form-component&quot;,&quot;title&quot;:&quot;Adjacent canonical caps form an ambient component&quot;,&quot;display_title&quot;:&quot;Lemma 1.38: Adjacent canonical caps form an ambient component&quot;,&quot;body&quot;:&quot;Let $X\\subset M$ be connected, and let $\\widetilde C$ be obtained from a\n$(C,\\epsilon)$-cap $C_0$ by adjoining a finite balanced chain to its neck\nend.  Suppose $\\widetilde C$ contains a point of $X$.  Let $C&#x27;$ be a\n$(C,\\epsilon)$-cap whose core contains a point of\n$X\\cap\\operatorname{Fr}_M(\\widetilde C)$, and assume\n$C_0\\nsubseteq C&#x27;$.  Then $\\widetilde C\\cup C&#x27;$ is a component of $M$\ncontaining $X$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:37,&quot;ref&quot;:&quot;MT:app:A.23&quot;},{&quot;id&quot;:&quot;6486b6c2f18d&quot;,&quot;label&quot;:&quot;lem:nonseparating-neck-chain-or-bundle&quot;,&quot;title&quot;:&quot;Nonseparating neck chains: tube or closed fibration&quot;,&quot;display_title&quot;:&quot;Lemma 1.33: Nonseparating neck chains: tube or closed fibration&quot;,&quot;body&quot;:&quot;For sufficiently small $\\epsilon$, let $X$ be a connected subset of a\nboundaryless Riemannian three-manifold $M$ such that every point of $X$ is the\ncenter of an embedded $\\epsilon$-neck and no corresponding central sphere\nseparates $M$.  Then either\n\\begin{enumerate}\n\\item there is a balanced chain of these necks, with axial coordinates\n      possibly reversed, whose union $U\\cong S^2\\times(0,1)$ contains $X$; or\n\\item $X$ is contained in a connected component $M_0\\subset M$ all of whose\n      points are $\\epsilon$-neck centers, and $M_0$ is a closed\n      $S^2$-bundle over $S^1$ (an $\\epsilon$-fibration).\n\\end{enumerate}&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:32,&quot;ref&quot;:&quot;MT:app:A.20,MT:app:A.24&quot;},{&quot;id&quot;:&quot;673665487492&quot;,&quot;label&quot;:&quot;thm:pointed-riemannian-compactness&quot;,&quot;title&quot;:&quot;Pointed Riemannian compactness&quot;,&quot;display_title&quot;:&quot;Theorem 2.43: Pointed Riemannian compactness&quot;,&quot;body&quot;:&quot;Let $(M_j,g_j,x_j)$ be complete pointed Riemannian manifolds.  Suppose that\non every fixed based ball all covariant derivatives of curvature are\nuniformly bounded and that for some $r_0,v_0&gt;0$,\n\\[\n \\operatorname{Vol}_{g_j}B(x_j,r_0)\\ge v_0.\n\\]\nThen a subsequence converges smoothly on compact subsets to a complete\npointed Riemannian manifold.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:85,&quot;ref&quot;:&quot;MT:ch5:5.6,MT:ch5:5.9,MT:ch5:5.10&quot;},{&quot;id&quot;:&quot;67b3fec08fc1&quot;,&quot;label&quot;:&quot;lem:least-spanning-area-continuity&quot;,&quot;title&quot;:&quot;Continuity of least spanning area&quot;,&quot;display_title&quot;:&quot;Lemma 5.28: Continuity of least spanning area&quot;,&quot;body&quot;:&quot;The function $\\gamma\\mapsto\\mathcal A_g(\\gamma)$ is finite and continuous\non $\\Lambda_0X$ in the $C^1$ topology.  More precisely, two sufficiently\n$C^1$-close loops cobound a Lipschitz annulus whose area tends to zero with\ntheir $C^1$ distance, and\n\\[\n |\\mathcal A_g(\\gamma_0)-\\mathcal A_g(\\gamma_1)|\n \\le\\inf\\{\\operatorname{Area}_g(A):\\partial A=\\gamma_0\\sqcup\\gamma_1\\}.\n\\]&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;The Loop-Space Width Interface&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:206,&quot;ref&quot;:&quot;MT:ch18:18.17&quot;},{&quot;id&quot;:&quot;6b096c2e83df&quot;,&quot;label&quot;:&quot;lem:capped-chain-exposed-frontier&quot;,&quot;title&quot;:&quot;Frontier localization for a capped finite neck chain&quot;,&quot;display_title&quot;:&quot;Lemma 1.39: Frontier localization for a capped finite neck chain&quot;,&quot;body&quot;:&quot;Let $C_0$ be a $(C,\\epsilon)$-cap and let\n$N_a,\\ldots,N_b$ be a finite balanced chain whose negative end is attached to\n$C_0$, with the positive end of $N_b$ the only uncapped end.  More precisely,\nafter the cap orientation of \\ref{def:canonical-cap} is fixed, assume that\n$E_{N_a}^-\\subset C_0$ and that all other cap/neck intersections are the\noverlaps in \\ref{def:balanced-neck-chain}.  Assume that\n\\[\nU=\\overline{C_0\\cup N_a\\cup\\cdots\\cup N_b}\n\\]\nis compact.  Then every point of\n$\\operatorname{Fr}_M(U)$ lies in the exposed positive-end region of $N_b$.\nConsequently, if such a frontier point is the center of an\n$\\epsilon$-neck, that neck can be axially oriented to extend the chain.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:38,&quot;ref&quot;:&quot;MT:app:A.17,MT:app:A.21&quot;},{&quot;id&quot;:&quot;6b365de62a4e&quot;,&quot;label&quot;:&quot;thm:late-component-nontrivial-pi3&quot;,&quot;title&quot;:&quot;Nonzero _3 on a late surviving component&quot;,&quot;display_title&quot;:&quot;Theorem 5.23: Nonzero _3 on a late surviving component&quot;,&quot;body&quot;:&quot;Let $T_1$ be as in \\ref{thm:eventual-pi2-vanishing}, and assume the initial\nfundamental groups are free products of finite groups and infinite cyclic\ngroups.  If $\\mathcal X$ is a component path defined on $[T_1,T_2]$, then\n\\[\n \\pi_3(\\mathcal X(T_1))\\cong\\mathbb Z.\n\\]\nIn particular it contains a nonzero class.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Late-Component _3 Topology&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:201,&quot;ref&quot;:&quot;MT:ch18:18.19&quot;},{&quot;id&quot;:&quot;6bad96de75b2&quot;,&quot;label&quot;:&quot;lem:loop-space-universal-cover-lift&quot;,&quot;title&quot;:&quot;Lifting null-loop families&quot;,&quot;display_title&quot;:&quot;Lemma 5.25: Lifting null-loop families&quot;,&quot;body&quot;:&quot;Let $p\\colon\\widetilde X\\to X$ be the universal cover of a connected\nmanifold.  A continuous family $\\Gamma\\colon S^2\\to\\Lambda_0X$ lifts, after\nchoosing one lift of one marked point, to a continuous family of loops in\n$\\widetilde X$.  Homotopies lift in the same way, and changing the initial\nlift acts by one deck transformation on the entire lifted family.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;The Loop-Space Width Interface&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:203,&quot;ref&quot;:&quot;MT:ch18:18.16&quot;},{&quot;id&quot;:&quot;6cea49e084d1&quot;,&quot;label&quot;:&quot;thm:morgan-tian-corollary-15-4-empty-general&quot;,&quot;title&quot;:&quot;Morgan--Tian Corollary 15.4, general empty-slice clause&quot;,&quot;display_title&quot;:&quot;Theorem 6.29: Morgan--Tian Corollary 15.4, general empty-slice clause&quot;,&quot;body&quot;:&quot;Let $({\\mathcal M},G)$ satisfy Assumptions (1)--(7) and carry the\nKleiner--Lott cutoff of \\ref{def:ricci-flow-with-cutoff} on $[0,T]$, let the initial slice\n$M_0=M$ be connected and closed, and suppose $M_T=\\varnothing$ for some\n$T&gt;0$.  If only finitely many singular times occur in $[0,T]$, then\n\\[\n M\\cong P_1\\#\\cdots\\#P_r\\#F_1\\#\\cdots\\#F_s,\n \\qquad F_j\\in\\{E_+,E_-\\},\n\\]\nfor finitely many closed constant-positive-curvature space forms $P_i$, with\n$r+s\\ge1$.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Backward Reconstruction from Extinction&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:264,&quot;ref&quot;:&quot;MT:ch15:15.4&quot;},{&quot;id&quot;:&quot;6e44a1958754&quot;,&quot;label&quot;:&quot;lem:short-subarc-total-curvature-bound&quot;,&quot;title&quot;:&quot;Short-subarc total-curvature bound&quot;,&quot;display_title&quot;:&quot;Theorem 4.34: Short-subarc total-curvature bound&quot;,&quot;body&quot;:&quot;For $t\\in[t&#x27;,t_2]$, every transported initial subarc of length at most $r$\nhas total curvature at most $2D_4\\sqrt\\delta$.  Every subarc of $c_t$ of\nlength at most $r/2$ has the same bound.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Localized Total-Curvature Control&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:172,&quot;ref&quot;:&quot;MT:ch19:19.63&quot;},{&quot;id&quot;:&quot;6ead31810534&quot;,&quot;label&quot;:&quot;def:loop-family-width&quot;,&quot;title&quot;:&quot;Loop-family width&quot;,&quot;display_title&quot;:&quot;Definition 5.27: Loop-family width&quot;,&quot;body&quot;:&quot;For a null-homotopic $C^1$ loop $\\gamma$ in a compact Riemannian manifold,\nlet\n\\[\n \\mathcal A_g(\\gamma)=\\inf_F\\operatorname{Area}_g(F),\n\\]\nwhere $F\\colon D^2\\to X$ ranges over Lipschitz maps whose boundary agrees\nwith $\\gamma$ up to orientation-preserving reparameterization.  For a\ncontinuous family $\\Gamma\\colon S^2\\to\\Lambda_0X$, put\n\\[\n W_g(\\Gamma)=\\sup_{c\\in S^2}\\mathcal A_g(\\Gamma(c)).\n\\]\nIf $\\xi\\in\\pi_3(X)$, let $[\\xi]$ be its $\\pi_1(X)$-orbit.  By\n\\ref{thm:loop-space-pi3-identification}, this orbit corresponds to a free\nhomotopy class of loop families.  Define\n\\[\n W_g(\\xi)=\\inf_{[\\Gamma]=[\\xi]}W_g(\\Gamma),\n\\]\nwhere representatives need not preserve the base point.  Thus $W_g$ is\nconstant on every $\\pi_1(X)$-orbit.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;The Loop-Space Width Interface&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:205,&quot;ref&quot;:&quot;MT:ch18:18.17&quot;},{&quot;id&quot;:&quot;716fb7663e1d&quot;,&quot;label&quot;:&quot;lem:simply-connected-spherical-space-form&quot;,&quot;title&quot;:&quot;A simply connected spherical space form&quot;,&quot;display_title&quot;:&quot;Lemma 6.41: A simply connected spherical space form&quot;,&quot;body&quot;:&quot;If a spherical space form $P$ is simply connected, then $P$ is diffeomorphic\nto $S^3$.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Connected Sums and Fundamental Groups&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:276,&quot;ref&quot;:&quot;MT:intro:0.1&quot;},{&quot;id&quot;:&quot;72a95332c67c&quot;,&quot;label&quot;:&quot;lem:short-reduced-paths-avoid-surgery-caps&quot;,&quot;title&quot;:&quot;Short reduced paths avoid surgery caps&quot;,&quot;display_title&quot;:&quot;Lemma 2.47: Short reduced paths avoid surgery caps&quot;,&quot;body&quot;:&quot;Fix a controlled stage with a finite list of surgery times in\n$[T_{i-1},T]$, a terminal point $(x,T)$ with a controlled parabolic ball of\nradius at least $r_{i+1}$, and $L_0&lt;\\infty$.  There is a\npositive surgery-control bound, depending only on the stage data and $L_0$,\nsuch that every backward path from $x$ with\n\\[\n \\mathcal L_+(\\gamma)=\\int\\sqrt\\tau\n   \\bigl(\\max(R,0)+|\\dot\\gamma|^2\\bigr)\\,d\\tau&lt;L_0\n\\]\nmisses a fixed open neighborhood of every surgery cap and every exposed\npoint in $[T_{i-1},T]$.  The finite list is part of the stage hypothesis; the\nneighborhood and control bound are uniform over that list.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:89,&quot;ref&quot;:&quot;MT:ch16:16.5,MT:ch16:16.8,MT:ch16:16.13,MT:ch16:16.15&quot;},{&quot;id&quot;:&quot;74735bfad981&quot;,&quot;label&quot;:&quot;def:smooth-connected-sum&quot;,&quot;title&quot;:&quot;Smooth connected sum&quot;,&quot;display_title&quot;:&quot;Definition 6.1: Smooth connected sum&quot;,&quot;body&quot;:&quot;Let $M$ and $N$ be connected smooth $3$-manifolds without boundary.  Given\nsmoothly embedded closed $3$-balls and a diffeomorphism of their boundary\nspheres, their \\emph{smooth connected sum} $M\\mathbin{\\#}N$ is obtained by\ndeleting the interiors of the balls and making that boundary identification.\nIn the oriented category the manifolds are oriented and the identification is\norientation reversing.  This orientation convention is part of the definition;\nthe isotopy-extension theorem for $3$-balls then identifies different choices\nand makes finite connected sums associative up to oriented diffeomorphism.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Smooth Connected Sums and Prime Factors&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:236,&quot;ref&quot;:&quot;MT:ch15:15.3&quot;},{&quot;id&quot;:&quot;74d4b3842b0c&quot;,&quot;label&quot;:&quot;lem:three-sphere-connected-sum-identity&quot;,&quot;title&quot;:&quot;The three-sphere is the connected-sum identity&quot;,&quot;display_title&quot;:&quot;Lemma 6.42: The three-sphere is the connected-sum identity&quot;,&quot;body&quot;:&quot;For every connected closed smooth $3$-manifold $M$,\n$M\\#S^3\\cong M$.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Connected Sums and Fundamental Groups&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:277,&quot;ref&quot;:&quot;MT:ch15:15.3&quot;},{&quot;id&quot;:&quot;77d1aa60643f&quot;,&quot;label&quot;:&quot;thm:asymptotic-gradient-shrinking-soliton&quot;,&quot;title&quot;:&quot;Asymptotic gradient-shrinker production&quot;,&quot;display_title&quot;:&quot;Theorem 3.2: Asymptotic gradient-shrinker production&quot;,&quot;body&quot;:&quot;Let $(M,g(t))$ be a complete three-dimensional $\\kappa$-solution on\n$(-\\infty,0]$.  For every basepoint $(p,0)$ there are times\n$\\tau_j\\to\\infty$ and points $q_j$ at time $-\\tau_j$ with\n$l(q_j,\\tau_j)\\le3/2$ such that the parabolically rescaled pointed flows\nbased at $(q_j,-1)$ subconverge smoothly on compact spacetime sets to a\ncomplete nonflat ancient gradient shrinking Ricci soliton with bounded\nnonnegative curvature and the inherited noncollapsing estimate.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solutions and Asymptotic Models&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:102,&quot;ref&quot;:&quot;MT:ch9:9.11,MT:ch9:9.42,MT:ch9:9.44&quot;},{&quot;id&quot;:&quot;7965e450f6fa&quot;,&quot;label&quot;:&quot;lem:reduced-length-support-inequality&quot;,&quot;title&quot;:&quot;Upper support inequality for reduced length&quot;,&quot;display_title&quot;:&quot;Lemma 2.28: Upper support inequality for reduced length&quot;,&quot;body&quot;:&quot;On a smooth bounded-curvature Ricci-flow domain, reduced length is smooth\nbefore the reduced cut locus and satisfies, in dimension three,\n\\[\n \\partial_\\tau l+\\Delta l\\le \\frac{3/2-l}{\\tau}.\n\\]\nAt an arbitrary endpoint of a minimizing $\\mathcal L$-geodesic and for every\n$\\eta&gt;0$, there is a smooth upper support $l_\\eta$ which agrees with $l$ at\nthat endpoint and satisfies\n\\[\n \\partial_\\tau l_\\eta+\\Delta l_\\eta\n \\le \\frac{3/2-l_\\eta}{\\tau}+\\eta.\n\\]&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Reduced Geometry&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:70,&quot;ref&quot;:&quot;MT:ch6:6.4,MT:ch6:6.13,MT:ch6:6.49,MT:ch6:6.51,MT:ch7:7.8&quot;},{&quot;id&quot;:&quot;7a2a8ef45f46&quot;,&quot;label&quot;:&quot;thm:curve-flow-length-total-curvature-bounds&quot;,&quot;title&quot;:&quot;Exponential length and total-curvature bounds&quot;,&quot;display_title&quot;:&quot;Theorem 4.27: Exponential length and total-curvature bounds&quot;,&quot;body&quot;:&quot;For the immersed curve-shrinking flow above and $t_0\\le t\\le t_1$,\n\\[\n L(t)\\le L(t_0)e^{C_2(t-t_0)},\n\\]\nand\n\\[\n \\Theta(t)+L(t)\n \\le(\\Theta(t_0)+L(t_0))e^{(C_1+C_2)(t-t_0)},\n \\qquad\n \\Theta(t)\\le(\\Theta(t_0)+L(t_0))e^{(C_1+C_2)(t-t_0)}.\n\\]\nThus the total-curvature bound necessarily depends on both initial\ntotal curvature and initial length.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Evolution Identities and Global Bounds&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:165,&quot;ref&quot;:&quot;MT:ch19:19.10&quot;},{&quot;id&quot;:&quot;7a54ac1a4b27&quot;,&quot;label&quot;:&quot;thm:finite-time-extinction&quot;,&quot;title&quot;:&quot;Finite-time extinction&quot;,&quot;display_title&quot;:&quot;Theorem 5.57: Finite-time extinction&quot;,&quot;body&quot;:&quot;Let $(M,g_0)$ be a compact connected normalized Riemannian three-manifold\nwhose fundamental group is a free product of finite groups and infinite\ncyclic groups and which contains no embedded $\\mathbb{RP}^2$ with trivial\nnormal bundle.  Fix an all-time three-dimensional generalized Ricci flow\n$({\\mathcal M},G)$ starting from $(M,g_0)$ which has the\nKleiner--Lott $(r,\\delta)$-cutoff, satisfies Assumptions (1)--(7), has\ncurvature pinched toward positive, satisfies the stagewise strong canonical\nneighborhood and noncollapsing estimates, and has only finitely many surgery\ntimes on each bounded interval, and which is one of the all-time flows\nsupplied by \\ref{thm:all-time-controlled-surgery-flow}.  Then this fixed flow has a\nfinite extinction time: there is $T_*&lt;\\infty$ such that\n$M_t=\\varnothing$ for every $t\\ge T_*$.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Finite Extinction&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:235,&quot;ref&quot;:&quot;MT:ch18:18.1&quot;},{&quot;id&quot;:&quot;7a8fd5a54eac&quot;,&quot;label&quot;:&quot;lem:coherent-marked-component-path&quot;,&quot;title&quot;:&quot;Coherent marked-point transport along a component path&quot;,&quot;display_title&quot;:&quot;Lemma 5.48: Coherent marked-point transport along a component path&quot;,&quot;body&quot;:&quot;Let $\\mathcal X$ be a component path with finitely many singular times.\nThere are marked points $x(t)\\in\\mathcal X(t)$, continuous on each regular\ninterval, and paths in the continuing surgery components joining\n$F_t(x(t))$ to $x(T)$ at every singular time $T$.  These choices identify\nthe based homotopy groups across regular intervals and make each surgery map\nan induced map after the displayed basepoint change.  A different choice\nchanges the based identification only by the standard $\\pi_1$-action; hence\nthe induced map on the orbit set of $\\pi_3$ is canonical.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;_3-Width Evolution Through Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:226,&quot;ref&quot;:&quot;MT:ch18:18.18,MT:ch15:15.12&quot;},{&quot;id&quot;:&quot;7aa2ff4580d0&quot;,&quot;label&quot;:&quot;thm:plateau-disk-existence-regularity&quot;,&quot;title&quot;:&quot;Plateau disk existence and boundary regularity&quot;,&quot;display_title&quot;:&quot;Theorem 5.31: Plateau disk existence and boundary regularity&quot;,&quot;body&quot;:&quot;Let $(N,g)$ be a compact real-analytic Riemannian three-manifold and let\n$\\gamma\\colon S^1\\to N$ be an embedded real-analytic null-homotopic curve.\nThe infimum of the areas of $W^{1,2}$ disk maps whose boundary trace is\n$\\gamma$ (up to an orientation-preserving weakly monotone\nreparameterization) is attained by a conformal harmonic Douglas disk.  Its\ninterior branch set is finite, it is real analytic up to the boundary, and it\nhas no true boundary branch point.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Controlled Loop-Family Deformation&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:209,&quot;ref&quot;:&quot;MT:ch19:19.2&quot;},{&quot;id&quot;:&quot;7b9b7f513a7d&quot;,&quot;label&quot;:&quot;lem:canonical-cover-incidence-structure&quot;,&quot;title&quot;:&quot;Ordered incidence supplied by the cap/neck classification&quot;,&quot;display_title&quot;:&quot;Lemma 6.18: Ordered incidence supplied by the cap/neck classification&quot;,&quot;body&quot;:&quot;Every containing component furnished by\n\\ref{thm:cap-and-neck-cover-classification} has the following additional\nsource structure.  Its cap/neck incidence graph is a finite interval, a\nhalf-line, a line, or a circle; each edge is a product collar\n$S^2\\times I$, each cap is a terminal vertex, and all central neck spheres\nare cross-sectional fibers in the corresponding edge.  The incidence graph\nhas no branching.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Reversing One Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:253,&quot;ref&quot;:&quot;MT:app:A.21,MT:app:A.25&quot;},{&quot;id&quot;:&quot;7e3affaa5dd4&quot;,&quot;label&quot;:&quot;def:kappa-solution&quot;,&quot;title&quot;:&quot;Kappa-solution&quot;,&quot;display_title&quot;:&quot;Definition 2.10: Kappa-solution&quot;,&quot;body&quot;:&quot;For $d\\in\\{2,3\\}$, a $d$-dimensional \\emph{$\\kappa$-solution} is a connected Ricci flow\n$(M,g(t))$, $-\\infty&lt;t\\le0$, such that every time slice is complete and\nnonflat, has bounded nonnegative curvature operator, and is\n$\\kappa$-noncollapsed on every finite scale.  The value of $\\kappa&gt;0$ is\nfixed for the flow.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:52,&quot;ref&quot;:&quot;MT:ch9:9.1,MT:ch9:9.2,KL:I.11:38.1&quot;},{&quot;id&quot;:&quot;7f625d515a74&quot;,&quot;label&quot;:&quot;thm:time-slice-maximum-comparison&quot;,&quot;title&quot;:&quot;Time-slice maximum comparison&quot;,&quot;display_title&quot;:&quot;Theorem 1.5: Time-slice maximum comparison&quot;,&quot;body&quot;:&quot;Let $M$ be a smooth manifold without boundary, let $\\chi$ be a smooth vector\nfield, and let $\\mathbf t\\colon M\\to\\mathbb R$ be smooth with\n$\\chi(\\mathbf t)=1$.  Let $F\\colon M\\to\\mathbb R$ be smooth and suppose that,\nfor every $t\\in[a,b]$, $F$ attains a maximum on\n$\\mathbf t^{-1}(t)$.  Suppose that the set\n\\[\n \\mathcal Z=\\{x\\in M:\\mathbf t(x)\\in[a,b]\\text{ and }\n F(x)=\\max_{\\mathbf t^{-1}(\\mathbf t(x))}F\\}\n\\]\nof maximizers in the closed slab is compact.  If\n$\\psi\\in C^1([a,b]\\times\\mathbb R)$ and\n\\[\n \\chi(F)(x)\\le\\psi(\\mathbf t(x),F(x))\n \\qquad(x\\in\\mathcal Z),\n\\]\nthen\n\\[\n F_{\\max}(t)=\\max_{\\mathbf t^{-1}(t)}F\n\\]\nis continuous and satisfies\n$D^+F_{\\max}(t)\\le\\psi(t,F_{\\max}(t))$ for $t&lt;b$.  Hence, if\n$G&#x27;=\\psi(t,G)$ and $F_{\\max}(a)\\le G(a)$, then\n$F_{\\max}(t)\\le G(t)$ throughout $[a,b]$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Forward-Difference Comparison&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:4,&quot;ref&quot;:&quot;MT:ch2:2.23&quot;},{&quot;id&quot;:&quot;823193a5cb49&quot;,&quot;label&quot;:&quot;lem:global-surgery-map-lipschitz&quot;,&quot;title&quot;:&quot;Global Lipschitz extension across trivial surgery&quot;,&quot;display_title&quot;:&quot;Lemma 3.35: Global Lipschitz extension across trivial surgery&quot;,&quot;body&quot;:&quot;In the setting of\n\\ref{thm:separating-surgery-map}, assume in addition that the selected\npost-surgery component has a decomposition\n\\[\n X(T)=C(T)\\cup K_1(T)\\cup\\cdots\\cup K_m(T),\n\\]\nwhere $C(T)$ is a compact codimension-zero persistent core, the $K_i(T)$ are\nfinitely many compact surgery caps with pairwise disjoint interiors, and all\ncommon boundaries are the cutting two-spheres.  Assume every cutting sphere\nis homotopically trivial in $X(t&#x27;)$.  For $t&#x27;&lt;T$ sufficiently close to $T$,\nthe backward flow identifies $C(T)$ with a compact submanifold\n$C(t&#x27;)\\subset X(t&#x27;)$ by an embedding $n_{t&#x27;}$, and\n\\[\n n_{t&#x27;}^{*}\\bigl(g(t&#x27;)|_{C(t&#x27;)}\\bigr)\\longrightarrow G(T)|_{C(T)}\n \\quad\\text{in }C^\\infty\\text{ on }C(T).\n\\]\nThen, for every $\\eta&gt;0$, there is $t_\\eta&lt;T$ such that for every regular\n$t&#x27;\\in(t_\\eta,T)$ the inverse core map $n_{t&#x27;}^{-1}$ extends over the\nfinitely many cap pieces to a map\n\\[\n \\psi_{t&#x27;}\\colon X(t&#x27;)\\longrightarrow X(T)\n\\]\nwhich maps $X(t&#x27;)\\setminus C(t&#x27;)$ into the union of the caps and satisfies\n\\[\n \\operatorname{Lip}_{(X(t&#x27;),g(t&#x27;))\\to(X(T),G(T))}(\\psi_{t&#x27;})\\le 1+\\eta\n\\]\nfor that $\\eta$.  This metric extension statement deliberately makes no\nhomotopy-type claim; the old-type versus homotopy-sphere-descendant\nalternative is supplied by the separate topology contract before any\nhomotopy consumer invokes $\\psi_{t&#x27;}$.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Surgery Continuation and Finiteness&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:135,&quot;ref&quot;:&quot;MT:ch18:18.18,MT:ch15:15.12&quot;},{&quot;id&quot;:&quot;82648ce2769b&quot;,&quot;label&quot;:&quot;lem:backward-parabolic-neighborhood-dichotomy&quot;,&quot;title&quot;:&quot;Backward parabolic-neighborhood dichotomy&quot;,&quot;display_title&quot;:&quot;Lemma 3.27: Backward parabolic-neighborhood dichotomy&quot;,&quot;body&quot;:&quot;After passing to a subsequence of rescaled first-failure flows, write $x_a$\nfor the normalized first-failure basepoint in the $a$-th flow.  At least one\nof the following alternatives occurs (the statement does not assert that the\ntwo alternatives are logically disjoint):\n\\begin{enumerate}\n\\item for every $A&lt;\\infty$ there are $D(A),s(A)&gt;0$ and an index $a(A)$ such\n      that, for every $a\\ge a(A)$, the compatible parabolic neighborhood\n      $P(x_a,0,A,-s(A))$ exists and has\n      $|\\operatorname{Rm}|\\le D(A)$;\n\\item on an infinite subsequence (renamed), every sufficiently late basepoint\n      has a strong $(C,\\epsilon)$-canonical neighborhood.\n\\end{enumerate}&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;First-Failure Extension&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:127,&quot;ref&quot;:&quot;MT:ch17:17.10&quot;},{&quot;id&quot;:&quot;82d739ec0ed6&quot;,&quot;label&quot;:&quot;def:maximal-ricci-flow-extension&quot;,&quot;title&quot;:&quot;Maximal extension of a generalized Ricci flow&quot;,&quot;display_title&quot;:&quot;Definition 1.7: Maximal extension of a generalized Ricci flow&quot;,&quot;body&quot;:&quot;Here a \\emph{generalized Ricci flow} consists of a manifold with a\ncontinuous time function $\\mathbf t$ which is a smooth submersion on every\nordinary or one-sided flow chart, a time vector field $\\chi$ smooth on those\ncharts and satisfying $\\chi(\\mathbf t)=1$, and metrics on\n$\\ker(d\\mathbf t)$ which evolve by the Ricci-flow equation along $\\chi$.\nLet $(\\mathcal M,G)$ be such a\nflow on a terminal interval\n$[T^-,T)$, identify this part of the flow with $M\\times[T^-,T)$, and set\n\\[\n \\Omega=\\{x\\in M:\\liminf_{t\\uparrow T}R(x,t)&lt;\\infty\\}.\n\\]\nSuppose that $\\Omega$ is open and that $g(t)|_\\Omega$ converges smoothly\non compact subsets to a metric $g(T)$.  The \\emph{maximal extension to\n$T$} is\n\\[\n \\widehat{\\mathcal M}\n =\\mathcal M\\cup_{\\Omega\\times[T^-,T)}\n   (\\Omega\\times[T^-,T]).\n\\]\nThe time function, time vector field, and horizontal metrics agree on the\noverlap and hence glue to a generalized Ricci flow\n$(\\widehat{\\mathcal M},\\widehat G)$.  Its terminal time-slice is\n$(\\Omega,g(T))$, which need not be complete.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:6,&quot;ref&quot;:&quot;MT:ch11:11.22&quot;},{&quot;id&quot;:&quot;841228a21206&quot;,&quot;label&quot;:&quot;lem:reduced-density-monotonicity&quot;,&quot;title&quot;:&quot;Reduced-density monotonicity&quot;,&quot;display_title&quot;:&quot;Lemma 2.31: Reduced-density monotonicity&quot;,&quot;body&quot;:&quot;Let $v\\in\\mathcal D_x^\\tau$ and let $J(v,\\tau)$ be the Jacobian of the\nreduced exponential map.  Along the corresponding minimizing\n$\\mathcal L$-geodesic,\n\\[\n \\frac d{d\\tau}\\left((4\\pi\\tau)^{-3/2}e^{-l}J\\right)\\le0.\n\\]\nConsequently the reduced volume is nonincreasing in backward time as long as\nall minimizing curves under consideration remain in one smooth domain.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Reduced Geometry&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:73,&quot;ref&quot;:&quot;MT:ch6:6.50,MT:ch6:6.80,MT:ch6:6.81&quot;},{&quot;id&quot;:&quot;84f30b171db1&quot;,&quot;label&quot;:&quot;lem:graph-flow-drift-derivative-bounds&quot;,&quot;title&quot;:&quot;Derivatives of the graph-flow connection drift&quot;,&quot;display_title&quot;:&quot;Theorem 4.12: Derivatives of the graph-flow connection drift&quot;,&quot;body&quot;:&quot;In the fixed exponential chart write $\\Gamma(t)$ for the Christoffel symbols\nof $h(t)$ and assume $|\\partial_t\\Gamma(t)|_{h&#x27;}\\le C_{\\Gamma}$ on the\nchart.  Thus the time derivative below includes the evolving-connection term.\nFor sufficiently small $\\delta$ there is an ambient constant $C&#x27;$ such that\n\\[\n |Z(\\psi(Z))|&lt;C&#x27;(1+\\delta|Y|),\n \\qquad\n |Y(\\psi(Z))|&lt;C&#x27;(1+|Y|+\\delta|\\nabla_ZY|).\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Graph-Flow Coordinate Estimates&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:150,&quot;ref&quot;:&quot;MT:ch19:19.66&quot;},{&quot;id&quot;:&quot;86b927517d94&quot;,&quot;label&quot;:&quot;lem:single-surgery-connected-sum-reconstruction&quot;,&quot;title&quot;:&quot;Reconstruction across one surgery time&quot;,&quot;display_title&quot;:&quot;Lemma 6.24: Reconstruction across one surgery time&quot;,&quot;body&quot;:&quot;Let $({\\mathcal M},G)$ be a controlled generalized Ricci flow satisfying\nAssumptions (1)--(7) and carrying the Kleiner--Lott cutoff of\n\\ref{def:ricci-flow-with-cutoff} on the relevant finite interval.  Let $T$ be a\nsingular time, and let $t^-&lt;T$ be regular and sufficiently close to $T$.\nEvery component of $M_{t^-}$ is a finite connected sum of components of $M_T$\nand factors\nbelonging to\n\\[\n \\{S^3/\\Gamma,\\mathbb{RP}^3,E_+,E_-\\}.\n\\]\nHere a disappearing $\\mathbb{RP}^3\\#\\mathbb{RP}^3$ component contributes two\n$\\mathbb{RP}^3$ factors.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Reversing One Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:259,&quot;ref&quot;:&quot;MT:ch15:15.3&quot;},{&quot;id&quot;:&quot;88699ab8e34d&quot;,&quot;label&quot;:&quot;thm:loop-space-pi3-identification&quot;,&quot;title&quot;:&quot;Free-loop-space identification of _3&quot;,&quot;display_title&quot;:&quot;Theorem 5.26: Free-loop-space identification of _3&quot;,&quot;body&quot;:&quot;If $X$ is compact, connected, and $\\pi_2(X,x_0)=0$, then adjunction induces\nan isomorphism\n\\[\n \\pi_2(\\Lambda_0X,*)\\cong\\pi_3(X,x_0).\n\\]\nFree homotopy classes of not necessarily based maps\n$S^2\\to\\Lambda_0X$ correspond to the orbit set of $\\pi_3(X,x_0)$ under its\nnatural $\\pi_1(X,x_0)$-action.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;The Loop-Space Width Interface&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:204,&quot;ref&quot;:&quot;MT:ch18:18.16&quot;},{&quot;id&quot;:&quot;895f10b519cc&quot;,&quot;label&quot;:&quot;thm:busemann-function-superharmonicity&quot;,&quot;title&quot;:&quot;Weak superharmonicity of Busemann functions&quot;,&quot;display_title&quot;:&quot;Theorem 2.41: Weak superharmonicity of Busemann functions&quot;,&quot;body&quot;:&quot;Let $(M^n,g)$ be complete with nonnegative Ricci curvature, and let $B$ be\nthe Busemann function of a ray.  Then $\\Delta B\\le0$ weakly: for every\nnonnegative compactly supported smooth function $\\varphi$,\n\\[\n \\int_M B\\,\\Delta\\varphi\\,d\\mu\\le0.\n\\]&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Local Curvature and Neck Estimates&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:83,&quot;ref&quot;:&quot;MT:ch2:2.3&quot;},{&quot;id&quot;:&quot;8b02bd6bd97c&quot;,&quot;label&quot;:&quot;thm:curve-shrinking-derivative-estimates&quot;,&quot;title&quot;:&quot;Derivative estimates for curve shrinking&quot;,&quot;display_title&quot;:&quot;Theorem 4.39: Derivative estimates for curve shrinking&quot;,&quot;body&quot;:&quot;The correction supplies the dependence of the constants in Lemma~19.24 on\nthe initial length and total-curvature bounds.  The all-order estimate is the\nexplicit commuted-equation induction in\n\\ref{lem:curve-flow-parabolic-regularity-interface}, rather than an\nunstated appeal to a separate theorem.\nLet $P$ be compact and let $c_p$, $p\\in P$, be a family of the gauged curve\nflows covered by \\ref{thm:short-time-curve-curvature-barrier}, with common\ninitial length bound $L_0$, total-curvature bound $\\Theta_0$, and the common\nsmall-turning constants of that theorem.  The ambient flow may be\n$M\\times S^1_\\lambda$ for any $0&lt;\\lambda&lt;1$; its curvature and connection\nbounds are those of $M$ and are independent of $\\lambda$.  There are constants\n$\\widetilde C_i&lt;\\infty$, depending on the ambient Ricci flow and on the\nuniform initial total-curvature and length bounds, but independent of\n$p\\in P$ and $0&lt;\\lambda&lt;1$, such that\nfor $t&#x27;&lt;t&lt;t&#x27;+\\delta r^2$,\n\\[\n k^2\\le \\widetilde C_0(t-t&#x27;)^{-1},\\qquad\n |\\nabla_SH|^2\\le\\widetilde C_1(t-t&#x27;)^{-2},\n\\]\nand, for every $i\\ge1$,\n\\[\n |\\nabla_S^iH|^2\\le\\widetilde C_i(t-t&#x27;)^{-(i+1)}.\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Short-Time Curvature Barrier&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:177,&quot;ref&quot;:&quot;MT:ch19:19.24&quot;},{&quot;id&quot;:&quot;8b2abffda757&quot;,&quot;label&quot;:&quot;def:reduced-exponential-map&quot;,&quot;title&quot;:&quot;Reduced exponential map and injectivity domain&quot;,&quot;display_title&quot;:&quot;Definition 2.25: Reduced exponential map and injectivity domain&quot;,&quot;body&quot;:&quot;An $\\mathcal L$-geodesic from $(x,T)$ is a critical point of\n$\\mathcal L$.  Its initial vector is\n\\[\n v=\\lim_{\\tau\\downarrow0}\\sqrt\\tau\\,X_\\gamma(\\tau)\n \\in T_xM_T.\n\\]\nThe reduced exponential map is\n$\\mathcal L\\exp_x^\\tau(v)=\\gamma_v(\\tau)$ whenever this geodesic exists.\nIts injectivity set $\\mathcal D_x^\\tau$ consists of those $v$ for which\n$\\gamma_v|_{[0,\\tau]}$ is the unique minimizing $\\mathcal L$-geodesic to its\nendpoint and has no nonzero $\\mathcal L$-Jacobi field vanishing at both ends.\nThe image $\\Omega_x^\\tau=\\mathcal L\\exp_x^\\tau(\\mathcal D_x^\\tau)$ is the\nreduced injectivity domain.  To match Morgan--Tian&#x27;s notation in the\nstagewise statements below, write\n$\\widetilde{\\mathcal U}_x(\\tau):=\\mathcal D_x^\\tau$.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Reduced Geometry&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:67,&quot;ref&quot;:&quot;MT:ch6:6.17,MT:ch6:6.25,MT:ch6:6.26&quot;},{&quot;id&quot;:&quot;8b5c645f958d&quot;,&quot;label&quot;:&quot;lem:no-infinite-nested-canonical-caps&quot;,&quot;title&quot;:&quot;No infinite nested chain of canonical caps&quot;,&quot;display_title&quot;:&quot;Lemma 1.36: No infinite nested chain of canonical caps&quot;,&quot;body&quot;:&quot;For fixed $C$ and sufficiently small $\\epsilon$, there is no chain of\n$(C,\\epsilon)$-caps\n\\[\n C_0\\subset C_1\\subset\\cdots\n\\]\nsuch that the closure of the core of $C_i$ meets\n$\\operatorname{Fr}_M(C_{i-1})$ for every $i\\ge1$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:35,&quot;ref&quot;:&quot;MT:app:A.22&quot;},{&quot;id&quot;:&quot;8d62fb7b0ff0&quot;,&quot;label&quot;:&quot;lem:length-metric-gluing&quot;,&quot;title&quot;:&quot;Length-metric gluing for finitely many surgery pieces&quot;,&quot;display_title&quot;:&quot;Lemma 3.31: Length-metric gluing for finitely many surgery pieces&quot;,&quot;body&quot;:&quot;Let a smooth Riemannian manifold $X$ be cut along finitely many disjoint\nembedded two-spheres into compact codimension-zero pieces $X_1,\\ldots,X_m$,\nwith the induced length metrics and the original collar metric on each common\nboundary.  Let $(Y,d_Y)$ be a metric space and let\n$F_i\\colon X_i\\to Y$ be maps which agree on every common boundary sphere.\nIf each $F_i$ is $L$-Lipschitz for its intrinsic length metric, then the\nglued map $F\\colon X\\to Y$ is $L$-Lipschitz for the ambient Riemannian\ndistance on $X$.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Surgery Continuation and Finiteness&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:131,&quot;ref&quot;:&quot;MT:ch13:13.2&quot;},{&quot;id&quot;:&quot;8dd1bd7dd325&quot;,&quot;label&quot;:&quot;thm:trivial-surgery-component-map&quot;,&quot;title&quot;:&quot;Component map for a trivial surgery&quot;,&quot;display_title&quot;:&quot;Theorem 5.8: Component map for a trivial surgery&quot;,&quot;body&quot;:&quot;Let $T$ be a surgery time, let $X(t)$ be a presurgery component for $t&lt;T$\nclose to $T$, and suppose every cutting sphere in this component is\nnull-homotopic (hence separating by\n\\ref{lem:nullhomotopic-embedded-sphere-separates}).  For each selected\npostsurgery component $Y$, for every\n$\\eta&gt;0$ there is, for all\n$t&lt;T$ sufficiently close to $T$, a map\n\\[\n F_t\\colon X(t)\\longrightarrow Y,\n \\qquad \\operatorname{Lip}(F_t)\\le1+\\eta,\n\\]\nhomotopic to the corresponding connected-sum pinch map.  The component with\nnonzero $\\pi_2$, when it exists, is unique and its pinch map is a homotopy\nequivalence.  If $\\pi_2(X(t))=0$, then $\\pi_2(Y)=0$.  If in addition\n$\\pi_3(X(t))\\cong\\mathbb Z$, then $\\pi_3(Y)\\cong\\mathbb Z$ and $(F_t)_*$ is\nmultiplication by a nonzero integer; in particular it is injective.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Two-Sphere Width Control&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:186,&quot;ref&quot;:&quot;MT:ch18:18.18,MT:ch18:18.22,MT:ch15:15.12&quot;},{&quot;id&quot;:&quot;8ddd9ae35616&quot;,&quot;label&quot;:&quot;lem:local-surgery-standard-cap-convergence&quot;,&quot;title&quot;:&quot;Convergence of the surgery cap to the standard cap&quot;,&quot;display_title&quot;:&quot;Lemma 1.18: Convergence of the surgery cap to the standard cap&quot;,&quot;body&quot;:&quot;For every $\\delta&#x27;&#x27;&gt;0$ there is $\\delta_1&#x27;(\\delta&#x27;&#x27;)&gt;0$ such that, if\n$\\delta\\le\\delta_1&#x27;(\\delta&#x27;&#x27;)$, then $\\widehat g$ on\n$B_{\\widehat g}(p_0,(\\delta&#x27;&#x27;)^{-1})$ is $\\delta&#x27;&#x27;$-close in\n$C^{\\lfloor1/\\delta&#x27;&#x27;\\rfloor}$ to $g_0$ on the corresponding standard\nball.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:17,&quot;ref&quot;:&quot;MT:ch13:13.2&quot;},{&quot;id&quot;:&quot;8f84b6178565&quot;,&quot;label&quot;:&quot;thm:soul-structure-nonnegative-curvature&quot;,&quot;title&quot;:&quot;Soul structure in nonnegative curvature&quot;,&quot;display_title&quot;:&quot;Theorem 3.9: Soul structure in nonnegative curvature&quot;,&quot;body&quot;:&quot;Every connected complete noncompact manifold of nonnegative sectional\ncurvature contains a compact totally geodesic, totally convex soul and is\ndiffeomorphic to its normal bundle.  If the sectional curvature is positive,\nthe soul is a point.  The proof uses the Cheeger--Gromoll soul theorem,\nsmooth Schoenflies/annulus separation for the resulting embedded spheres, and\nthe covering-space lifting theorem for the normal exponential map; these are\npart of the imported topology contract and are not inferred from curvature\nalone.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solution Geometry and Stability&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:109,&quot;ref&quot;:&quot;MT:ch2:2.7&quot;},{&quot;id&quot;:&quot;911928b1060f&quot;,&quot;label&quot;:&quot;lem:exposed-end-successor-overlap&quot;,&quot;title&quot;:&quot;Exposed-end successors share a middle overlap&quot;,&quot;display_title&quot;:&quot;Lemma 6.16: Exposed-end successors share a middle overlap&quot;,&quot;body&quot;:&quot;For sufficiently small $\\epsilon$, let $N_a,\\ldots,N_b$ be a balanced chain\nwith only the positive end exposed.  Every neck centered at a frontier point\nwhich satisfies the extension hypotheses of the finite-chain frontier\ndichotomy (or the capped-chain exposed-frontier lemma) meets the middle\n$0.9\\epsilon^{-1}$ of $N_b$.  Any two such successor necks have a common\ncross-sectional sphere in the middle overlap, isotopic in both necks to their\ncentral spheres.  Consequently they determine one maximal product collar and\none successor incidence, rather than two branches.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Reversing One Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:251,&quot;ref&quot;:&quot;MT:app:A.11,MT:app:A.17,MT:app:A.21&quot;},{&quot;id&quot;:&quot;91578b8d4302&quot;,&quot;label&quot;:&quot;lem:hempel-essential-sphere-input&quot;,&quot;title&quot;:&quot;Hempel essential-sphere input&quot;,&quot;display_title&quot;:&quot;Lemma 5.20: Hempel essential-sphere input&quot;,&quot;body&quot;:&quot;Let $X$ be a compact connected boundaryless $3$-manifold.  If\n$\\pi_1(X)$ is a nontrivial free product, or if $\\pi_1(X)\\cong\\mathbb Z$, then\n$X$ contains an embedded $2$-sphere which is not null-homotopic.  In\nparticular, $\\pi_2(X)\\ne0$.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Late-Component _3 Topology&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:198,&quot;ref&quot;:&quot;MT:ch18:18.20&quot;},{&quot;id&quot;:&quot;91c8a69f2407&quot;,&quot;label&quot;:&quot;thm:small-annulus-length-transfer&quot;,&quot;title&quot;:&quot;Imported small-annulus length transfer&quot;,&quot;display_title&quot;:&quot;Theorem 5.44: Imported small-annulus length transfer&quot;,&quot;body&quot;:&quot;There is $\\delta_0&gt;0$ with the following property.  For every $r&gt;0$ and every\nambient sectional-curvature upper bound $K$, there is $\\mu_0&gt;0$ such that if\ntwo ramps $\\gamma,\\widehat\\gamma$ in\n$M\\times S^1_\\lambda$ cobound an admissible annulus of area below $\\mu_0$, and\n\\[\n L(\\gamma)\\ge r,\n \\qquad\n \\int_I|\\mathbf k_\\gamma|\\,ds&lt;\\delta_0\n\\]\nfor every length-$r$ subarc $I\\subset\\gamma$, where\n$\\mathbf k_\\gamma$ is the ambient curvature vector of the unit-speed ramp\n$\\gamma$, then\n\\[\n L(\\widehat\\gamma)\\ge\\frac34L(\\gamma).\n\\]\nThe constants are uniform in $\\lambda$.  For each annular comparison to\nwhich this contract is applied, the spanning annulus is required to satisfy\nthe nondegeneration bound in\n\\ref{lem:ramp-annulus-nondegeneration}.  The analytic/disjoint-boundary\napproximation, Douglas minimizer, branch-point metric regularization, and\nlimiting passage are those of\n\\ref{lem:smooth-annular-minimizer-bridge} and\n\\ref{lem:annular-approximation-comparison}; after that passage the preceding\nDouglas theorem supplies the minimizer whenever the proof uses one.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Controlled Loop-Family Deformation&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:222,&quot;ref&quot;:&quot;MT:ch19:19.31,MT:ch19:19.35&quot;},{&quot;id&quot;:&quot;9278327842d4&quot;,&quot;label&quot;:&quot;def:interpolating-surgery-metric&quot;,&quot;title&quot;:&quot;Interpolating surgery metric&quot;,&quot;display_title&quot;:&quot;Definition 1.10: Interpolating surgery metric&quot;,&quot;body&quot;:&quot;Set $A_r=A_0+4-r_0$ and $A&#x27;=A_0+4$.  On $\\mathcal S$, define\n\\[\n\\widehat g=\n\\begin{cases}\n e^{-2f}Q\\rho^*g,&amp;s\\le1,\\\\\n e^{-2f}\\bigl(\\alpha Q\\rho^*g+(1-\\alpha)\\eta g_0\\bigr),\n     &amp;1\\le s\\le2,\\\\\n e^{-2f}\\eta g_0,&amp;2\\le s\\le A_r,\\\\\n \\bigl(\\beta e^{-2f}+(1-\\beta)e^{-2f(A&#x27;)}\\bigr)\\eta g_0,\n     &amp;A_r\\le s\\le A&#x27;.\n\\end{cases}\n\\]\nThe metric at the original scale is\n\\[\n \\widetilde g=Q^{-1}\\widehat g.\n\\]&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:9,&quot;ref&quot;:&quot;MT:ch13:13.2&quot;},{&quot;id&quot;:&quot;928ee1addff3&quot;,&quot;label&quot;:&quot;thm:morgan-tian-corollary-15-4&quot;,&quot;title&quot;:&quot;Orientable specialization of Morgan--Tian Corollary 15.4&quot;,&quot;display_title&quot;:&quot;Theorem 6.34: Orientable specialization of Morgan--Tian Corollary 15.4&quot;,&quot;body&quot;:&quot;Let $({\\mathcal M},G)$ be a controlled generalized Ricci flow satisfying\nAssumptions (1)--(7) and carrying the Kleiner--Lott cutoff of\n\\ref{def:ricci-flow-with-cutoff} on $[0,T]$, with connected, closed,\norientable initial slice $M_0$.  Assume that\nthere are only finitely many singular times in $[0,T]$, that every connected\ncomponent of every slice in this interval is orientable, and that every\nconnected component of $M_T$ is geometrized in the sense of\n\\ref{def:thurston-geometrized}.  Then every connected component of every\nearlier slice $M_t$, $0\\le t\\le T$, is geometrized.  No empty-slice or\nfundamental-group conclusion is part of this clause.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Backward Reconstruction from Extinction&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:269,&quot;ref&quot;:&quot;MT:ch15:15.4&quot;},{&quot;id&quot;:&quot;93db3db3435a&quot;,&quot;label&quot;:&quot;def:proper-disappearing-component&quot;,&quot;title&quot;:&quot;Proper disappearing component&quot;,&quot;display_title&quot;:&quot;Definition 6.10: Proper disappearing component&quot;,&quot;body&quot;:&quot;Let $({\\mathcal M},G)$ satisfy Assumptions (1)--(7), let $T$ be a singular\ntime, and let $t^-&lt;T$ be regular and sufficiently close to $T$.  Write\n$C_{t^-}$ for the backward image of the continuing region and\n$D_{t^-}=M_{t^-}\\setminus C_{t^-}$.  A connected component $D$ of\n$D_{t^-}$ is \\emph{proper} when it is not a connected component of the ambient\nslice $M_{t^-}$.  Its frontier always means the ambient frontier\n$\\operatorname{Fr}_{M_{t^-}}D$; no spherical-frontier, compactness, or\ncanonical-neighborhood conclusion is included in this definition.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Reversing One Surgery&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:245,&quot;ref&quot;:&quot;MT:ch15:15.3&quot;},{&quot;id&quot;:&quot;956e98090959&quot;,&quot;label&quot;:&quot;thm:separating-surgery-map&quot;,&quot;title&quot;:&quot;Map across a separating surgery: removed-region comparison&quot;,&quot;display_title&quot;:&quot;Theorem 3.34: Map across a separating surgery: removed-region comparison&quot;,&quot;body&quot;:&quot;Let $({\\mathcal M},G)$ be a controlled Ricci flow with surgery satisfying\nAssumptions~(1)--(7) of the Morgan--Tian controlled-flow definition.  Let\n$T$ be a surgery time with control parameter\n$\\bar\\delta(T)&lt;\\delta&#x27;_0$ and surgery scale $h(T)&lt;R_0^{-1/2}$, where\n$\\delta&#x27;_0,R_0$ are the constants of\n\\ref{thm:local-neck-surgery}.  Fix a regular $t&#x27;&lt;T$ sufficiently close to\n$T$, let $X(t&#x27;)$ be a presurgery component, and let $X(T)$ be a component\nobtained from it at $T$.  If every cutting two-sphere in $X(t&#x27;)$ is\nseparating, then the time-flow embedding has an open bounded-curvature\ndomain $\\Omega\\subset X(t&#x27;)$ whose metric limit exists and whose limiting\nidentification is an isometry onto an open subset of $X(T)$.  The\nidentification extends continuously to a map\n\\[\n F\\colon X(t&#x27;)\\longrightarrow X(T)\n\\]\nsuch that, for every regular time $t&lt;T$ sufficiently close to $T$, its\nrestriction to $X(t&#x27;)\\setminus\\Omega$, measured with the time-$t$ pulled-back\nmetric, is distance nonincreasing into $X(T)$.  The radial cross-neck\nextension is the one supplied by the local surgery theorem.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Surgery Continuation and Finiteness&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:134,&quot;ref&quot;:&quot;MT:ch15:15.12,MT:ch13:13.2&quot;},{&quot;id&quot;:&quot;964de89f5091&quot;,&quot;label&quot;:&quot;lem:generalized-noncollapsing-large-tail&quot;,&quot;title&quot;:&quot;Large reduced-exponential tail estimate&quot;,&quot;display_title&quot;:&quot;Lemma 2.33: Large reduced-exponential tail estimate&quot;,&quot;body&quot;:&quot;Let $(\\mathcal M,G)$ be a generalized three-dimensional Ricci flow with\nthe same compact-closure, compatible-embedding, and curvature hypotheses\nas in the preceding lemma.  Let $x\\in M_T$, let\n$0&lt;\\tau_0\\le\\bar\\tau_0$, $0&lt;r\\le\\sqrt{\\tau_0}$, and let\n$\\widetilde W\\subset\\widetilde{\\mathcal U}_x(\\tau_0)$ lie in the\n$\\mathcal L$-injectivity domain.  Assume moreover that there is an open\nsmooth spacetime set $\\mathcal O$ containing $x$ and all\n$\\mathcal L\\exp_x^\\tau(\\widetilde W)$ for $0&lt;\\tau\\le\\tau_0$, and that every\nminimizing $\\mathcal L$-geodesic from $x$ to those images stays in\n$\\mathcal O\\cup\\{x\\}$.  Put\n$\\displaystyle \\varepsilon=\\operatorname{Vol}_{g(T)}B_{g(T)}(x,r)^{1/3}/r$,\nand put\n$\\tau_1=\\varepsilon r^2$ and\n$\\widetilde W_{\\rm lg}=\n\\widetilde W\\setminus\\{|v|\\le(8\\sqrt\\varepsilon)^{-1}\\}$.  There is a\nuniversal $\\varepsilon_1&gt;0$ such that, for\n$0&lt;\\varepsilon\\le\\varepsilon_1$,\n\\[\n \\widetilde V_x(\\mathcal L\\exp_x^{\\tau_1}(\\widetilde W_{\\rm lg}),\\tau_1)\n \\le \\varepsilon^{3/2}.\n\\]&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Reduced Geometry&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:75,&quot;ref&quot;:&quot;MT:ch8:8.1&quot;},{&quot;id&quot;:&quot;96ba06153485&quot;,&quot;label&quot;:&quot;lem:first-failure-zero-slice-canonical-transfer&quot;,&quot;title&quot;:&quot;Canonical transfer on a surviving first-failure slice&quot;,&quot;display_title&quot;:&quot;Lemma 3.23: Canonical transfer on a surviving first-failure slice&quot;,&quot;body&quot;:&quot;Consider a diagonal first-failure sequence of controlled flows, with failure\npoints $(x_j,t_j)$ and scales\n$Q_j=R_{g_j(t_j)}(x_j)\\to\\infty$.  Choose the threshold parameters so that\n$r_j^{-2}/Q_j\\le\\vartheta&lt;1$ (enlarging $r_j$ slightly before taking the\ndiagonal if necessary), and translate and rescale by $Q_j$ so that the\nfailure points have scalar curvature one at time zero.  Assume that, for every\nfixed $A&lt;\\infty$, the zero-time $A$-ball has a compatible unscathed backward\nparabolic neighborhood on a common positive time interval.  Then every\nsequence of points in these zero-time balls whose rescaled scalar curvature is\nat least one has, after passing to a subsequence, a strong\n$(2C,2\\epsilon)$-canonical neighborhood.  In particular the conclusion is\nindependent of whether the containing component has positive sectional\ncurvature; no positivity-to-model inference is being made.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;First-Failure Extension&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:123,&quot;ref&quot;:&quot;MT:ch17:17.1,MT:ch17:17.2,MT:ch17:17.6,MT:ch17:17.7&quot;},{&quot;id&quot;:&quot;9929a0922cf6&quot;,&quot;label&quot;:&quot;thm:ramp-preservation&quot;,&quot;title&quot;:&quot;Ramp preservation&quot;,&quot;display_title&quot;:&quot;Theorem 4.7: Ramp preservation&quot;,&quot;body&quot;:&quot;Suppose $c$ is a curve-shrinking flow on $[t_0,T)$ in the ramp product and\n$c(\\cdot,t_0)$ is a ramp.  If $C&#x27;$ bounds $|\\operatorname{Ric}|$, then\n\\[\n \\min_{S^1}u(\\cdot,t)\\ge\n e^{-C&#x27;(t-t_0)}\\min_{S^1}u(\\cdot,t_0)&gt;0\n \\qquad(t_0\\le t&lt;T).\n\\]\nIn particular every $c(\\cdot,t)$ is a ramp.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Product-Circle Geometry and Ramp Setup&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:145,&quot;ref&quot;:&quot;MT:ch19:19.13&quot;},{&quot;id&quot;:&quot;9960afbd243c&quot;,&quot;label&quot;:&quot;lem:null-sphere-surgery-topological-comparison&quot;,&quot;title&quot;:&quot;Topological comparison for null-sphere surgery&quot;,&quot;display_title&quot;:&quot;Lemma 5.7: Topological comparison for null-sphere surgery&quot;,&quot;body&quot;:&quot;Let $T$ be a surgery time and let $X^-$ be a connected presurgery\ncomponent just before $T$.  Assume that every cutting sphere in $X^-$ is\nnull-homotopic (and hence separating).  Let $X^+$ range over the connected\npostsurgery components obtained from $X^-$.  The radial extension of the\nflow identification defines, for every sufficiently close regular\n$t&lt;T$, a map from $X(t)$ to each selected $X^+$.  Topologically, exactly one\nof the following alternatives holds:\n\\begin{enumerate}\n\\item if $\\pi _2(X^-)$ is nonzero, there is a unique $X^+$ with nonzero\n      $\\pi _2$, and the corresponding pinch map is a homotopy equivalence;\n\\item if $\\pi _2(X^-)=0$, every $X^+$ has trivial $\\pi _2$ and the\n      continuing component is either homotopy equivalent to $X^-$ or is a\n      homotopy $3$-sphere.\n\\end{enumerate}\nIn the second case, if $\\pi _3(X^-)\\cong\\mathbb Z$, the comparison on the\ncontinuing component is either a homotopy equivalence or a degree-one map\nand therefore induces an injection on $\\pi _3$; the target group is again\n$\\mathbb Z$.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Two-Sphere Width Control&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:185,&quot;ref&quot;:&quot;MT:ch18:18.19,MT:ch18:18.22,MT:ch15:15.12&quot;},{&quot;id&quot;:&quot;9977c10908db&quot;,&quot;label&quot;:&quot;def:graph-flow-connection-drift&quot;,&quot;title&quot;:&quot;Graph-flow connection drift&quot;,&quot;display_title&quot;:&quot;Definition 4.10: Graph-flow connection drift&quot;,&quot;body&quot;:&quot;Define\n\\[\n \\psi(Z)=\\frac{\\langle\\Gamma(Z,Z),\\partial_z\\rangle_{h&#x27;}}{|Z|^2}.\n\\]\nThe metric and slope comparisons imply $|\\psi(Z)|&lt;1.5\\delta$.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Graph-Flow Coordinate Estimates&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:148,&quot;ref&quot;:&quot;MT:ch19:19.65&quot;},{&quot;id&quot;:&quot;9a01b45f2cc1&quot;,&quot;label&quot;:&quot;lem:standard-cap-reduced-length-barrier&quot;,&quot;title&quot;:&quot;Normalized standard-cap reduced-length barrier&quot;,&quot;display_title&quot;:&quot;Lemma 2.46: Normalized standard-cap reduced-length barrier&quot;,&quot;body&quot;:&quot;For every $L_0&lt;\\infty$ and every fixed surgery-cap model, there are a\nnormalized inner cap neighborhood, an outer annulus, and a time\n$0&lt;\\theta&lt;1$ such that every backward reduced path which enters the inner\nneighborhood from the outer side before normalized time $\\theta$ has\n$\\mathcal L_+\\ge L_0$.  The same lower bound holds for a path ending at the\nnormalized exposed frontier.  Standard-cap convergence transfers the barrier\nuniformly to all sufficiently small surgery controls, with the terminal\ncontrolled ball outside the outer annulus.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:88,&quot;ref&quot;:&quot;MT:ch16:16.5,MT:ch16:16.8,MT:ch16:16.13&quot;},{&quot;id&quot;:&quot;9b1d8806cf9e&quot;,&quot;label&quot;:&quot;lem:short-loop-families-trivial&quot;,&quot;title&quot;:&quot;Short loop families are trivial&quot;,&quot;display_title&quot;:&quot;Lemma 5.53: Short loop families are trivial&quot;,&quot;body&quot;:&quot;Let $(X,g)$ be compact with $\\pi_2(X)=0$.  There is $\\zeta&gt;0$ such that any\ncontinuous family $\\Gamma\\colon S^2\\to\\Lambda_0X$ all of whose loops have\nlength less than $\\zeta$ represents the zero free-homotopy orbit, and hence\nthe zero class after any based choice, under\n$\\pi_2(\\Lambda_0X,*)\\cong\\pi_3(X)$.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;_3-Width Evolution Through Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:231,&quot;ref&quot;:&quot;MT:ch18:18.27&quot;},{&quot;id&quot;:&quot;9c9d12b27929&quot;,&quot;label&quot;:&quot;lem:smoothed-polygonal-ramp-bounds&quot;,&quot;title&quot;:&quot;Length and total curvature of smoothed polygonal ramps&quot;,&quot;display_title&quot;:&quot;Theorem 4.20: Length and total curvature of smoothed polygonal ramps&quot;,&quot;body&quot;:&quot;For each $q$, choose the fixed lifted polygonal branches in\n$M\\times\\mathbb R$ and obtain $\\widetilde\\Gamma(q)$ from the $n$-polygonal\nloop $\\Gamma_n(q)$ by the standard smoothing with a fixed, nonnegative,\nsymmetric reparameterization bump.  Throughout this chapter we use the fixed\nconvention $S^1=\\mathbb R/(2\\pi\\mathbb Z)$.  For $0&lt;\\lambda&lt;1$, project the\ndegree-one lift $x\\mapsto(\\widetilde\\Gamma(q)(x),\\lambda x/(2\\pi))$ by\n$\\pi_\\lambda\\colon M\\times\\mathbb R\\to M\\times S^1_\\lambda$ and call the\nresulting ramp $\\widetilde\\Gamma(q)^\\lambda$.  Then\n\\[\n L(\\widetilde\\Gamma(q)^\\lambda)\n \\le L(\\Gamma(q))+\\lambda,\n \\qquad\n \\int_{\\widetilde\\Gamma(q)^\\lambda}k\\,ds\\le n\\pi .\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Polygonal Ramp Approximation&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:158,&quot;ref&quot;:&quot;MT:ch19:19.22&quot;},{&quot;id&quot;:&quot;9dff0d1643ad&quot;,&quot;label&quot;:&quot;lem:annular-area-infimum-variation&quot;,&quot;title&quot;:&quot;Variation of the annular area infimum&quot;,&quot;display_title&quot;:&quot;Lemma 5.43: Variation of the annular area infimum&quot;,&quot;body&quot;:&quot;Let $n=\\dim M\\ge3$, and let $c_0(t),c_1(t)$ be degree-one ramp\ncurve-shrinking flows in $(M,g(t))\\times S^1_\\lambda$ in the same free\nhomotopy class.  Assume at every time under consideration that the positive\nessential-loop lower bound of\n\\ref{lem:ramp-annulus-nondegeneration} holds.  The theorem\n\\ref{thm:annular-douglas-minimizer} then supplies the minimizing annulus.  If\n$\\mu(t)$ is the infimum of the areas of spanning annuli,\nthen $\\mu$ is continuous and\n\\[\n D^+\\mu(t)\\le(2n-1)\\max_M|\\operatorname{Rm}_{g(t)}|\\,\\mu(t).\n\\]\nConsequently $\\mu(t)\\le e^{C(t-s)}\\mu(s)$ on a compact time interval, with\n$C$ independent of $\\lambda$.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Controlled Loop-Family Deformation&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:221,&quot;ref&quot;:&quot;MT:ch19:19.15&quot;},{&quot;id&quot;:&quot;9e0b17247fdb&quot;,&quot;label&quot;:&quot;lem:hamilton-ivey-phi-envelope&quot;,&quot;title&quot;:&quot;Imported interface: Hamilton--Ivey envelope&quot;,&quot;display_title&quot;:&quot;Lemma 2.7: Imported interface: Hamilton--Ivey envelope&quot;,&quot;body&quot;:&quot;For every finite horizon $\\widehat T&gt;0$, every complete Ricci flow\n$(M,g(t))_{0\\le t\\le\\widehat T}$ with curvature bounded on compact time\nintervals, and every initial lower bound\n$\\lambda_1(\\cdot,0)\\ge-1$, there is a positive smooth function\n$\\Phi_{\\mathrm{HI}}^{\\widehat T,g(0)}$ on $\\mathbb R$, nondecreasing with\n$\\Phi_{\\mathrm{HI}}^{\\widehat T,g(0)}(s)/s$ decreasing to zero for $s&gt;0$,\nsuch that\n\\[\n \\operatorname{Rm}_{g(t)}\\ge\n -\\Phi_{\\mathrm{HI}}^{\\widehat T,g(0)}(R_{g(t)})\n \\qquad(0\\le t\\le\\widehat T).\n\\]\nThe producer is allowed to depend on the horizon and on the time-zero metric;\nevery later use fixes those data before invoking the estimate.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:49,&quot;ref&quot;:&quot;KL:appB:B.5,KL:appB:after-B.6,KL:appB:phi&quot;},{&quot;id&quot;:&quot;9e7a99688042&quot;,&quot;label&quot;:&quot;def:curvature-pinched-toward-positive&quot;,&quot;title&quot;:&quot;Curvature pinched toward positive&quot;,&quot;display_title&quot;:&quot;Definition 2.17: Curvature pinched toward positive&quot;,&quot;body&quot;:&quot;Let $(\\mathcal M,G)$ be a three-dimensional Ricci flow with surgery whose\ntime domain lies in $[0,\\infty)$.  At $x\\in\\mathcal M$, write\n$\\lambda(x)\\ge\\mu(x)\\ge\\nu(x)$ for the eigenvalues of the curvature\noperator on $\\bigwedge^2\\mathcal H_x$ and set\n$X(x)=\\max\\{0,-\\nu(x)\\}$.  Its curvature is \\emph{pinched toward positive}\nwhen, for every $x$,\n\\[\n R(x)\\ge-\\frac{6}{1+4\\mathbf t(x)}\n\\]\nand, whenever $X(x)&gt;0$,\n\\[\n R(x)\\ge\n 2X(x)\\bigl(\\log X(x)+\\log(1+\\mathbf t(x))-3\\bigr).\n\\]\nFor a metric at a fixed time $T\\ge0$, pinching up to time $T$ means the\nsame two inequalities with $\\mathbf t(x)$ replaced by $T$.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:59,&quot;ref&quot;:&quot;MT:ch10:10.1,MT:ch14:14.17&quot;},{&quot;id&quot;:&quot;9e8b196a765e&quot;,&quot;label&quot;:&quot;lem:noncollapsing-predicate-pointed-limit&quot;,&quot;title&quot;:&quot;Closure of the noncollapsing predicate under pointed limits&quot;,&quot;display_title&quot;:&quot;Lemma 2.57: Closure of the noncollapsing predicate under pointed limits&quot;,&quot;body&quot;:&quot;Let smooth pointed parabolic regions converge in $C^\\infty$ on compact\nsubsets, and suppose that every approximating admissible ball of scale\n$\\rho&lt;\\epsilon$ satisfies the uniform source noncollapsing predicate with\nconstant $\\kappa$.  Then every admissible ball in the limit satisfies the\nsame volume-or-positive-component disjunction.  If the positive-component\nalternative is absent on the limit region, the limit is ordinarily\n$\\kappa$-noncollapsed below $\\epsilon$.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:99,&quot;ref&quot;:&quot;MT:ch11:11.1,MT:ch14:14.14,MT:ch14:14.15&quot;},{&quot;id&quot;:&quot;a0d6ae4e1672&quot;,&quot;label&quot;:&quot;def:surgery-flow-noncollapsing&quot;,&quot;title&quot;:&quot;Noncollapsing for a surgery flow&quot;,&quot;display_title&quot;:&quot;Definition 2.2: Noncollapsing for a surgery flow&quot;,&quot;body&quot;:&quot;Let $(\\mathcal M,G)$ be a three-dimensional Ricci flow with surgery.  Let\n$\\kappa:[0,\\infty)\\to(0,\\infty)$ be a positive function and let\n$\\epsilon&gt;0$.  The flow is \\emph{$\\kappa$-noncollapsed below $\\epsilon$} if,\nfor every $(x,t)\\in\\mathcal M_t^-$ and\n$0&lt;\\rho&lt;\\epsilon$ with $t\\ge\\rho^2$,\n\\[\n P(x,t,\\rho,-\\rho^2)\\text{ is unscathed},\\qquad\n |\\operatorname{Rm}|\\le \\rho^{-2}\\text{ on }P(x,t,\\rho,-\\rho^2)\n\\quad\\Longrightarrow\\quad\n \\left[\\operatorname{Vol}_{g(t)}B^-(x,t,\\rho)\\ge\\kappa(t)\\rho^3\n \\ \\text{or}\\ x\\text{ lies in a component of }M_t^-\n \\text{ with positive sectional curvature}\\right].\n\\]\nThis is the source convention: a compact positive-sectional-curvature\ncomponent is an allowed exceptional branch.  At a regular time this is the\nsame predicate with $B^-=B$; at a transition it is evaluated on the backward\nslice.  Whenever a later argument needs an actual volume lower bound, it must\nassume the nonpositive branch (or invoke a separate positive-component\nestimate).&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:44,&quot;ref&quot;:&quot;MT:ch14:14.14,MT:ch14:14.15&quot;},{&quot;id&quot;:&quot;a0f5febe5349&quot;,&quot;label&quot;:&quot;lem:kleiner-lott-noncollapsing-estimate&quot;,&quot;title&quot;:&quot;Kleiner--Lott all-cases noncollapsing estimate&quot;,&quot;display_title&quot;:&quot;Lemma 2.52: Kleiner--Lott all-cases noncollapsing estimate&quot;,&quot;body&quot;:&quot;Fix $0&lt;r_+\\le r_-\\le\\epsilon$, $\\kappa_-&gt;0$, and finite numbers\n$0&lt;E_-\\le E$.  There are constants\n\\[\n \\bar\\delta=\\bar\\delta(r_-,r_+,\\kappa_-,E_-,E)&gt;0,\n \\qquad\n \\kappa_+=\\kappa_+(r_-,\\kappa_-,E_-,E)&gt;0\n\\]\nwith the following property.  Let $a&lt;b&lt;c$, $b-a\\ge E_-$, and\n$c-a\\le E$.  Let $(\\mathcal M,G)$ be a three-dimensional Ricci flow with\nKleiner--Lott $(r,\\delta)$-cutoff on an interval containing $[a,c)$, with\nnormalized compact initial data, $r\\le\\epsilon$, $r\\ge r_-$ on $[a,b)$,\nand $r\\ge r_+$ on $[b,c)$.  If the flow is ordinarily\n$\\kappa_-$-noncollapsed below $\\epsilon$ on $[a,b)$ and\n$\\delta(t)\\le\\bar\\delta$ on $[a,c)$, and it satisfies the strong\ncanonical-neighborhood assumption with parameter $r_+$ on $[b,c)$, then it is ordinarily\n$\\kappa_+$-noncollapsed below $\\epsilon$ on $[b,c)$ in the sense of\n\\ref{def:surgery-flow-noncollapsing}; at each test centre it gives either the\nvolume lower bound or the positive-sectional-curvature alternative in that\ndefinition.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:94,&quot;ref&quot;:&quot;KL:II.5:II.5.2&quot;},{&quot;id&quot;:&quot;a0f8035a1904&quot;,&quot;label&quot;:&quot;lem:infinite-neck-chain-frontier&quot;,&quot;title&quot;:&quot;An infinite neck-chain end has no frontier&quot;,&quot;display_title&quot;:&quot;Lemma 1.29: An infinite neck-chain end has no frontier&quot;,&quot;body&quot;:&quot;Let $N_0,N_1,\\ldots$ be a chain of sufficiently small\n$\\epsilon$-necks in $M$, and put $U=\\bigcup_{j\\ge0}N_j$.  Then the\nfrontier of $U$ in $M$ is exactly the frontier of the negative end of\n$N_0$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:28,&quot;ref&quot;:&quot;MT:app:A.15&quot;},{&quot;id&quot;:&quot;a26bc71fd1e8&quot;,&quot;label&quot;:&quot;lem:space-time-metric-connection&quot;,&quot;title&quot;:&quot;Space-time metric connection identities&quot;,&quot;display_title&quot;:&quot;Lemma 4.2: Space-time metric connection identities&quot;,&quot;body&quot;:&quot;Equip $M\\times I$ with the metric $\\widehat g=g(t)+dt^2$, and denote its\nLevi--Civita connection by $\\nabla$.  If $A,B$ are horizontal vector fields,\nthen\n\\[\n \\nabla_A B=\\nabla_A^gB+\\operatorname{Ric}_g(A,B)\\partial_t,\n \\qquad\n \\langle\\nabla_A\\partial_t,B\\rangle\n       =-\\operatorname{Ric}_g(A,B),\n\\]\nand $\\nabla_A\\partial_t$ is horizontal.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Curve-Flow Geometry&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:140,&quot;ref&quot;:&quot;MT:ch19:19.7&quot;},{&quot;id&quot;:&quot;a26f5c19302d&quot;,&quot;label&quot;:&quot;thm:short-time-curve-curvature-barrier&quot;,&quot;title&quot;:&quot;Short-time pointwise curvature barrier&quot;,&quot;display_title&quot;:&quot;Theorem 4.37: Short-time pointwise curvature barrier&quot;,&quot;body&quot;:&quot;Given bounds $\\Theta,L_0$ and the fixed ambient Ricci flow, there are\n$\\delta&gt;0$ and $0&lt;r_0\\le1$ such that the localized hypotheses stated above\nimply\n\\[\n k(x,t)^2\\le\\frac2{t-t&#x27;}\n \\qquad(x\\in S^1,\\ t&#x27;&lt;t\\le t&#x27;+\\delta r^2).\n\\]\nThe constants may depend on both $\\Theta$ and $L_0$.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Short-Time Curvature Barrier&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:175,&quot;ref&quot;:&quot;MT:ch19:19.58&quot;},{&quot;id&quot;:&quot;a4d91a09effa&quot;,&quot;label&quot;:&quot;thm:parametric-curve-shrinking-wellposedness&quot;,&quot;title&quot;:&quot;Compact-parametric parabolic interface for immersed curve shrinking&quot;,&quot;display_title&quot;:&quot;Theorem 4.14: Compact-parametric parabolic interface for immersed curve shrinking&quot;,&quot;body&quot;:&quot;Morgan--Tian Claim~19.1 and Perelman&#x27;s Section~2.1 statement give the\nsingle-curve existence and curvature blow-up alternative.  The parameter-\nuniform clauses below are obtained from the source-backed strongly parabolic\ncircle interface in \\ref{lem:strongly-parabolic-circle-equation}; they are not\nbeing attributed to the single-curve claim alone.\nLet $P$ be compact, $0&lt;\\alpha&lt;1$, and let $g(t)$ be a smooth Ricci flow on a\ncompact manifold for $t\\in[t_0,t_1]$.  Suppose $p\\mapsto c_{0,p}$ is\ncontinuous in $C^{2,\\alpha}$ and $|\\partial_xc_{0,p}|\\ge\\iota_0&gt;0$ for all\n$p\\in P$.  The gauged curve-shrinking equation is uniformly parabolic on a\ntime interval $[t_0,t_0+\\tau]$, with $\\tau&gt;0$ depending only on the compact\ninitial set, $\\iota_0$, and ambient $C^2$ bounds.  It has a unique solution in\nthe gauge and hence a unique geometric solution up to time-dependent\nreparametrization; the solution depends continuously on $(p,t)$ in the\nparabolic $C^{2,\\alpha}$ topology.  If curvature and the immersion lower\nbound remain uniformly bounded at a finite endpoint, the uniform periodic\nparabolic estimates continue every member across that endpoint.  In particular a\ncompact parameter family has a common lifetime whenever these bounds are\nuniform.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Short-Time Existence&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:152,&quot;ref&quot;:&quot;MT:ch19:19.1&quot;},{&quot;id&quot;:&quot;a6fce8d4dc10&quot;,&quot;label&quot;:&quot;prop:positive-curvature-neck-scale-lower-bound&quot;,&quot;title&quot;:&quot;Positive curvature excludes arbitrarily small necks&quot;,&quot;display_title&quot;:&quot;Proposition 3.11: Positive curvature excludes arbitrarily small necks&quot;,&quot;body&quot;:&quot;For every sufficiently small $\\epsilon&gt;0$, a complete positively curved\nRiemannian three-manifold contains no sequence of $\\epsilon$-necks whose\nscales tend to zero.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solution Geometry and Stability&quot;,&quot;kind&quot;:&quot;proposition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:111,&quot;ref&quot;:&quot;MT:ch2:2.19&quot;},{&quot;id&quot;:&quot;a7c743202d6a&quot;,&quot;label&quot;:&quot;def:balanced-neck-chain&quot;,&quot;title&quot;:&quot;Balanced chain of epsilon-necks&quot;,&quot;display_title&quot;:&quot;Definition 1.24: Balanced chain of epsilon-necks&quot;,&quot;body&quot;:&quot;A finite \\emph{chain of $\\epsilon$-necks} is a sequence\n$N_a,\\ldots,N_b$ with oriented axial coordinates such that, for each\n$a\\le i&lt;b$,\n\\[\n \\{s_{N_i}&gt;\\tfrac12\\epsilon^{-1}\\}\\subset N_i\\cap N_{i+1},\n \\qquad\n \\{s_{N_{i+1}}&lt;-\\tfrac12\\epsilon^{-1}\\}\\subset N_i\\cap N_{i+1},\n\\]\nwhile\n\\[\n N_i\\cap N_{i+1}\\subset\n \\{s_{N_i}&gt;-\\tfrac12\\epsilon^{-1}\\}\n \\cap\\{s_{N_{i+1}}&lt;\\tfrac12\\epsilon^{-1}\\},\n\\]\nand $N_i\\cap E_{N_a}^-=\\varnothing$ for\n$i&gt;a$.  An infinite chain indexed by an interval in $\\mathbb Z$ is one\nwhose restriction to every finite subinterval is a chain.  The chain is\n\\emph{balanced} if consecutive centers $x_j,x_{j+1}$ satisfy\n\\[\n 0.99\\,r_{N_j}\\epsilon^{-1}\n \\le d(x_j,x_{j+1})\n \\le1.01\\,r_{N_j}\\epsilon^{-1}.\n\\]&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:23,&quot;ref&quot;:&quot;MT:app:A.12,MT:app:A.17&quot;},{&quot;id&quot;:&quot;a8a4aa399c74&quot;,&quot;label&quot;:&quot;thm:noncompact-two-connected-cover-contractible&quot;,&quot;title&quot;:&quot;Noncompact two-connected covers are contractible&quot;,&quot;display_title&quot;:&quot;Theorem 5.16: Noncompact two-connected covers are contractible&quot;,&quot;body&quot;:&quot;Let $X$ be a connected three-manifold with $\\pi_2(X)=0$.  If its universal\ncover $\\widetilde X$ is noncompact, then $\\widetilde X$ is contractible.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Eventual Vanishing of _2&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:194,&quot;ref&quot;:&quot;MT:ch18:18.9&quot;},{&quot;id&quot;:&quot;aa42ce61a95e&quot;,&quot;label&quot;:&quot;thm:three-dimensional-gradient-shrinker-classification&quot;,&quot;title&quot;:&quot;Three-dimensional gradient-shrinker classification&quot;,&quot;display_title&quot;:&quot;Theorem 3.3: Three-dimensional gradient-shrinker classification&quot;,&quot;body&quot;:&quot;Let $(N,h(t),f)$ be a complete nonflat three-dimensional ancient gradient\nshrinking soliton with bounded nonnegative curvature and positive\n$\\kappa$-noncollapsing on every finite scale.  Then it is either a compact\nround space form or one of\n\\[\n S^2\\times\\mathbb R,\\qquad\n \\mathbb{RP}^2\\times\\mathbb R,\\qquad\n \\mathbb{RP}^2\\widetilde\\times\\mathbb R,\n\\]\nwith their standard shrinking product metrics.  Every noncompact member is\none of the three displayed cylindrical models.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Cont
