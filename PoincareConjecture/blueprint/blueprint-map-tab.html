    .node-card.layer-active:not(.selected)::before { content: &quot;&quot;; position: absolute; left: -4px; top: 5px; bottom: 5px; width: 4px; border-radius: 0 3px 3px 0; background: var(--layer-color); opacity: .92; }

      .chapter-column { flex-basis: 300px; }

  &lt;main class=&quot;map-app&quot;&gt;
    &lt;header class=&quot;map-toolbar&quot;&gt;
      &lt;div class=&quot;map-title&quot;&gt;

      &lt;button class=&quot;map-control map-button&quot; id=&quot;map-fit&quot; type=&quot;button&quot; title=&quot;Fit the map to the available width&quot; aria-label=&quot;Fit map&quot;&gt;Fit&lt;/button&gt;

    const DATA = {&quot;title&quot;:&quot;The Poincare Conjecture&quot;,&quot;chapters&quot;:[{&quot;id&quot;:&quot;foundations-interfaces&quot;,&quot;title&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;sections&quot;:[{&quot;id&quot;:&quot;forward-difference-comparison&quot;,&quot;title&quot;:&quot;Forward-Difference Comparison&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;3f37c7b2cea9&quot;,&quot;label&quot;:&quot;lem:forward-dini-mean-value&quot;,&quot;title&quot;:&quot;Right-Dini mean-value lemma&quot;,&quot;display_title&quot;:&quot;Lemma 1.1: Right-Dini mean-value lemma&quot;,&quot;body&quot;:&quot;Let $q\\colon[c,d]\\to\\mathbb R$ be continuous.  If $q(d)&gt;q(c)$, then\nthere is $s\\in[c,d)$ such that $D^+q(s)&gt;0$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Forward-Difference Comparison&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:0,&quot;ref&quot;:&quot;MT:ch2:2.22&quot;},{&quot;id&quot;:&quot;de78aa012715&quot;,&quot;label&quot;:&quot;thm:forward-dini-comparison&quot;,&quot;title&quot;:&quot;Forward-Dini comparison principle&quot;,&quot;display_title&quot;:&quot;Theorem 1.2: Forward-Dini comparison principle&quot;,&quot;body&quot;:&quot;Let $f\\colon[a,b]\\to\\mathbb R$ be continuous, let\n$\\psi\\colon[a,b]\\times\\mathbb R\\to\\mathbb R$ be of class $C^1$, and\nsuppose\n\\[\n  D^+f(t)\\le \\psi(t,f(t))\\qquad(a\\le t&lt;b).\n\\]\nIf $G\\in C^1([a,b])$ satisfies $G&#x27;(t)=\\psi(t,G(t))$ and\n$f(a)\\le G(a)$, then $f(t)\\le G(t)$ for every $t\\in[a,b]$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Forward-Difference Comparison&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:1,&quot;ref&quot;:&quot;MT:ch2:2.22&quot;},{&quot;id&quot;:&quot;561f6019df62&quot;,&quot;label&quot;:&quot;lem:forward-dini-comparison-with-downward-jumps&quot;,&quot;title&quot;:&quot;Forward-Dini comparison with finitely many downward jumps&quot;,&quot;display_title&quot;:&quot;Lemma 1.3: Forward-Dini comparison with finitely many downward jumps&quot;,&quot;body&quot;:&quot;Let\n\\[\n a=\\tau_0&lt;\\tau_1&lt;\\cdots&lt;\\tau_N=b\n\\]\nbe a finite partition.  Suppose that $f\\colon[a,b]\\to\\mathbb R$ is\ncontinuous on every half-open interval $[\\tau_j,\\tau_{j+1})$, has a finite\nleft lower limit at each interior partition time, and satisfies\n\\[\n f(\\tau_j)\\le\\liminf_{s\\uparrow\\tau_j}f(s)\\qquad(1\\le j&lt;N).\n\\]\nLet $\\psi\\in C^1([a,b]\\times\\mathbb R)$ and assume\n\\[\n D^+f(t)\\le\\psi(t,f(t))\n \\qquad(\\tau_j\\le t&lt;\\tau_{j+1})\n\\]\nfor every $j$.  If $G\\in C^1([a,b])$ solves\n$G&#x27;=\\psi(t,G)$ and $f(a)\\le G(a)$, then $f(t)\\le G(t)$ on all of $[a,b]$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Forward-Difference Comparison&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:2,&quot;ref&quot;:&quot;MT:ch2:2.22,MT:ch18:18.9&quot;},{&quot;id&quot;:&quot;547f37ae7414&quot;,&quot;label&quot;:&quot;lem:uniform-time-slice-transport&quot;,&quot;title&quot;:&quot;Uniform transport of time-slice maxima&quot;,&quot;display_title&quot;:&quot;Lemma 1.4: Uniform transport of time-slice maxima&quot;,&quot;body&quot;:&quot;Let $X$ be a set with functions $\\tau,F,V\\colon X\\to\\mathbb R$, let\n$Z\\subset X$, and let $m\\colon[a,b]\\to\\mathbb R$.  Suppose that for every\n$t\\in[a,b]$ there is $x\\in Z$ with $\\tau(x)=t$ and $F(x)=m(t)$, and that\n$F(y)\\le m(\\tau(y))$ whenever $\\tau(y)\\in[a,b]$.  Suppose also that there\nare $\\rho&gt;0$ and transports $\\Phi_h(x)$, defined for $x\\in Z$,\n$|h|&lt;\\rho$, and $\\tau(x)+h\\in[a,b]$, such that\n\\[\n \\tau(\\Phi_h(x))=\\tau(x)+h,\n \\qquad\n \\sup_{\\substack{x\\in Z\\\\ \\tau(x)+h\\in[a,b]}}\n |F(\\Phi_h(x))-F(x)|\\longrightarrow0\n \\quad(h\\to0).\n\\]\nAssume moreover that, for every $\\eta&gt;0$, there is $h_0&gt;0$ such that\n\\[\n \\frac{F(x)-F(\\Phi_{-h}(x))}{h}\\le V(x)+\\eta\n\\]\nwhenever $x\\in Z$, $0&lt;h&lt;h_0$, and the backward transport is defined.\nIf $\\psi\\colon[a,b]\\times\\mathbb R\\to\\mathbb R$ is continuous and\n\\[\n V(x)\\le\\psi(\\tau(x),F(x))\\qquad(x\\in Z),\n\\]\nthen $m$ is continuous and $D^+m(t)\\le\\psi(t,m(t))$ for every $t&lt;b$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Forward-Difference Comparison&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:3,&quot;ref&quot;:&quot;MT:ch2:2.23&quot;},{&quot;id&quot;:&quot;7f625d515a74&quot;,&quot;label&quot;:&quot;thm:time-slice-maximum-comparison&quot;,&quot;title&quot;:&quot;Time-slice maximum comparison&quot;,&quot;display_title&quot;:&quot;Theorem 1.5: Time-slice maximum comparison&quot;,&quot;body&quot;:&quot;Let $M$ be a smooth manifold without boundary, let $\\chi$ be a smooth vector\nfield, and let $\\mathbf t\\colon M\\to\\mathbb R$ be smooth with\n$\\chi(\\mathbf t)=1$.  Let $F\\colon M\\to\\mathbb R$ be smooth and suppose that,\nfor every $t\\in[a,b]$, $F$ attains a maximum on\n$\\mathbf t^{-1}(t)$.  Suppose that the set\n\\[\n \\mathcal Z=\\{x\\in M:\\mathbf t(x)\\in[a,b]\\text{ and }\n F(x)=\\max_{\\mathbf t^{-1}(\\mathbf t(x))}F\\}\n\\]\nof maximizers in the closed slab is compact.  If\n$\\psi\\in C^1([a,b]\\times\\mathbb R)$ and\n\\[\n \\chi(F)(x)\\le\\psi(\\mathbf t(x),F(x))\n \\qquad(x\\in\\mathcal Z),\n\\]\nthen\n\\[\n F_{\\max}(t)=\\max_{\\mathbf t^{-1}(t)}F\n\\]\nis continuous and satisfies\n$D^+F_{\\max}(t)\\le\\psi(t,F_{\\max}(t))$ for $t&lt;b$.  Hence, if\n$G&#x27;=\\psi(t,G)$ and $F_{\\max}(a)\\le G(a)$, then\n$F_{\\max}(t)\\le G(t)$ throughout $[a,b]$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Forward-Difference Comparison&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:4,&quot;ref&quot;:&quot;MT:ch2:2.23&quot;}]},{&quot;id&quot;:&quot;controlled-surgery-inputs&quot;,&quot;title&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;34c27224dce4&quot;,&quot;label&quot;:&quot;def:epsilon-neck-and-scale&quot;,&quot;title&quot;:&quot;Epsilon-closeness, neck, and scale&quot;,&quot;display_title&quot;:&quot;Definition 1.6: Epsilon-closeness, neck, and scale&quot;,&quot;body&quot;:&quot;Fix $0&lt;\\epsilon&lt;1/2$ and put $k=\\lfloor\\epsilon^{-1}\\rfloor$.  A metric\n$g$ is \\emph{$\\epsilon$-close to $g_0$ in $C^k$} on a common domain $X$ if\n\\[\n \\sup_{x\\in X}\\left(\n |g-g_0|_{g_0}^2+\\sum_{\\ell=1}^k\n |\\nabla_{g_0}^{\\ell}g|_{g_0}^2\\right)&lt;\\epsilon^2.\n\\]\n\nAn \\emph{$\\epsilon$-neck} centered at a point $x$ with $R(x)&gt;0$ in a\nRiemannian three-manifold\n$(M,g)$ is the image $N$ of a diffeomorphism\n\\[\n \\varphi\\colon S^2\\times(-\\epsilon^{-1},\\epsilon^{-1})\\longrightarrow N\n\\]\nwith $x\\in\\varphi(S^2\\times\\{0\\})$, such that\n$R(x)\\varphi^*g$ is $\\epsilon$-close in\n$C^{\\lfloor1/\\epsilon\\rfloor}$ to $h_0+ds^2$, where $h_0$ is the round\nmetric of scalar curvature $1$ on $S^2$.  The slices are the neck spheres,\nthe slice at $s=0$ is the central sphere, and\n\\[\n s_N=\\operatorname{pr}_2\\circ\\varphi^{-1},\n \\qquad r_N=R(x)^{-1/2}\n\\]\nare the axial coordinate and the scale.  Replacing $s_N$ by $-s_N$\nreverses the neck.  Its positive and negative ends are respectively\n\\[\n E_N^+=\\{s_N&gt;0.9\\epsilon^{-1}\\},\n \\qquad\n E_N^-=\\{s_N&lt;-0.9\\epsilon^{-1}\\}.\n\\]&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:5,&quot;ref&quot;:&quot;MT:ch2:2.16,MT:ch2:2.18&quot;},{&quot;id&quot;:&quot;82d739ec0ed6&quot;,&quot;label&quot;:&quot;def:maximal-ricci-flow-extension&quot;,&quot;title&quot;:&quot;Maximal extension of a generalized Ricci flow&quot;,&quot;display_title&quot;:&quot;Definition 1.7: Maximal extension of a generalized Ricci flow&quot;,&quot;body&quot;:&quot;Here a \\emph{generalized Ricci flow} consists of a manifold with a\ncontinuous time function $\\mathbf t$ which is a smooth submersion on every\nordinary or one-sided flow chart, a time vector field $\\chi$ smooth on those\ncharts and satisfying $\\chi(\\mathbf t)=1$, and metrics on\n$\\ker(d\\mathbf t)$ which evolve by the Ricci-flow equation along $\\chi$.\nLet $(\\mathcal M,G)$ be such a\nflow on a terminal interval\n$[T^-,T)$, identify this part of the flow with $M\\times[T^-,T)$, and set\n\\[\n \\Omega=\\{x\\in M:\\liminf_{t\\uparrow T}R(x,t)&lt;\\infty\\}.\n\\]\nSuppose that $\\Omega$ is open and that $g(t)|_\\Omega$ converges smoothly\non compact subsets to a metric $g(T)$.  The \\emph{maximal extension to\n$T$} is\n\\[\n \\widehat{\\mathcal M}\n =\\mathcal M\\cup_{\\Omega\\times[T^-,T)}\n   (\\Omega\\times[T^-,T]).\n\\]\nThe time function, time vector field, and horizontal metrics agree on the\noverlap and hence glue to a generalized Ricci flow\n$(\\widehat{\\mathcal M},\\widehat G)$.  Its terminal time-slice is\n$(\\Omega,g(T))$, which need not be complete.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:6,&quot;ref&quot;:&quot;MT:ch11:11.22&quot;},{&quot;id&quot;:&quot;fdaab108b288&quot;,&quot;label&quot;:&quot;def:standard-surgery-cap-model&quot;,&quot;title&quot;:&quot;Standard surgery-cap model&quot;,&quot;display_title&quot;:&quot;Definition 1.8: Standard surgery-cap model&quot;,&quot;body&quot;:&quot;Fix a complete rotationally symmetric metric $g_0$ on $\\mathbb R^3$ with\nnonnegative sectional curvature and tip $p_0$.  Fix constants\n$A_0&gt;r_0&gt;0$ such that $g_0$ has constant sectional curvature $1/4$ on\n$B_{g_0}(p_0,r_0)$ and there is an isometry\n\\[\n \\psi\\colon(S^2\\times(-\\infty,4],h_0+ds^2)\n \\longrightarrow(\\mathbb R^3\\setminus B_{g_0}(p_0,A_0),g_0).\n\\]\nExtend the cylinder coordinate to a continuous radial function by\n\\[\n s_1(y)=A_0+4-d_{g_0}(p_0,y).\n\\]\nIt is smooth away from $p_0$ and has round two-sphere level sets.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:7,&quot;ref&quot;:&quot;MT:ch12:12.2,MT:ch12:12.3&quot;},{&quot;id&quot;:&quot;da34bc1d727d&quot;,&quot;label&quot;:&quot;def:local-neck-surgery-data&quot;,&quot;title&quot;:&quot;Local neck-surgery data&quot;,&quot;display_title&quot;:&quot;Definition 1.9: Local neck-surgery data&quot;,&quot;body&quot;:&quot;Let $(N,g)$ be a $\\delta$-neck centered at $x_0$, let\n$Q=R_g(x_0)$, and let\n\\[\n \\rho\\colon S^2\\times(-\\delta^{-1},\\delta^{-1})\\longrightarrow N\n\\]\nbe its neck chart.  Assume $\\delta^{-1}&gt;A_0+4$.  Form $\\mathcal S$ by\ngluing $S^2\\times(-\\delta^{-1},4)$ to\n$B_{g_0}(p_0,A_0+4)$ through the cylindrical isometry on\n$S^2\\times(0,4)$.  The two axial coordinates glue to\n\\[\n s\\colon\\mathcal S\\longrightarrow(-\\delta^{-1},A_0+4].\n\\]\nFix smooth cutoffs $\\alpha\\colon[1,2]\\to[0,1]$ and\n$\\beta\\colon[A_0+4-r_0,A_0+4]\\to[0,1]$, equal to $1$ near their left\nendpoints and $0$ near their right endpoints.  Put\n\\[\n \\eta=1-\\delta,\n \\qquad\n f(s)=\\begin{cases}\n 0,&amp;s\\le0,\\\\\n C_0\\delta e^{-q/s},&amp;s&gt;0.\n \\end{cases}\n\\]&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:8,&quot;ref&quot;:&quot;MT:ch13:13.1,MT:ch13:13.2&quot;},{&quot;id&quot;:&quot;9278327842d4&quot;,&quot;label&quot;:&quot;def:interpolating-surgery-metric&quot;,&quot;title&quot;:&quot;Interpolating surgery metric&quot;,&quot;display_title&quot;:&quot;Definition 1.10: Interpolating surgery metric&quot;,&quot;body&quot;:&quot;Set $A_r=A_0+4-r_0$ and $A&#x27;=A_0+4$.  On $\\mathcal S$, define\n\\[\n\\widehat g=\n\\begin{cases}\n e^{-2f}Q\\rho^*g,&amp;s\\le1,\\\\\n e^{-2f}\\bigl(\\alpha Q\\rho^*g+(1-\\alpha)\\eta g_0\\bigr),\n     &amp;1\\le s\\le2,\\\\\n e^{-2f}\\eta g_0,&amp;2\\le s\\le A_r,\\\\\n \\bigl(\\beta e^{-2f}+(1-\\beta)e^{-2f(A&#x27;)}\\bigr)\\eta g_0,\n     &amp;A_r\\le s\\le A&#x27;.\n\\end{cases}\n\\]\nThe metric at the original scale is\n\\[\n \\widetilde g=Q^{-1}\\widehat g.\n\\]&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:9,&quot;ref&quot;:&quot;MT:ch13:13.2&quot;},{&quot;id&quot;:&quot;efddbd482f53&quot;,&quot;label&quot;:&quot;lem:interpolating-surgery-metric-smooth&quot;,&quot;title&quot;:&quot;Smoothness of the interpolating surgery metric&quot;,&quot;display_title&quot;:&quot;Lemma 1.11: Smoothness of the interpolating surgery metric&quot;,&quot;body&quot;:&quot;The piecewise tensor $\\widehat g$ of\n\\ref{def:interpolating-surgery-metric} is a smooth Riemannian metric on\n$\\mathcal S$.  It equals $Q\\rho^*g$ on $s\\le0$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:10,&quot;ref&quot;:&quot;MT:ch13:13.2&quot;},{&quot;id&quot;:&quot;b0ef6688e9c2&quot;,&quot;label&quot;:&quot;lem:standard-cap-radial-collapse-nonexpanding&quot;,&quot;title&quot;:&quot;Nonexpansion of the standard radial collapse&quot;,&quot;display_title&quot;:&quot;Lemma 1.12: Nonexpansion of the standard radial collapse&quot;,&quot;body&quot;:&quot;In the data of \\ref{def:local-neck-surgery-data}, define\n$\\xi\\colon N\\to\\mathbb R^3$ by preserving the angular coordinate,\nsending $s&lt;A_0+4$ to the point at $g_0$-distance $A_0+4-s$ from $p_0$,\nand collapsing $s\\ge A_0+4$ to $p_0$.  For all sufficiently small\n$\\delta$,\n\\[\n \\xi\\colon(N,Qg)\\longrightarrow(\\mathbb R^3,\\eta g_0)\n\\]\nis distance nonincreasing.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:11,&quot;ref&quot;:&quot;MT:ch12:12.37,MT:ch13:13.1&quot;},{&quot;id&quot;:&quot;2afe5ab2efbb&quot;,&quot;label&quot;:&quot;lem:radial-surgery-map-nonexpanding&quot;,&quot;title&quot;:&quot;The radial surgery map is nonexpanding&quot;,&quot;display_title&quot;:&quot;Lemma 1.13: The radial surgery map is nonexpanding&quot;,&quot;body&quot;:&quot;Regard the map $\\xi$ of\n\\ref{lem:standard-cap-radial-collapse-nonexpanding} as a map from $N$\nto the surgery manifold $\\mathcal S$.  Then\n\\[\n \\xi\\colon(N,g)\\longrightarrow(\\mathcal S,\\widetilde g)\n\\]\nis distance nonincreasing.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:12,&quot;ref&quot;:&quot;MT:ch13:13.2&quot;},{&quot;id&quot;:&quot;5eda97c9d2c0&quot;,&quot;label&quot;:&quot;lem:nullhomotopic-embedded-sphere-separates&quot;,&quot;title&quot;:&quot;A null-homotopic embedded sphere separates&quot;,&quot;display_title&quot;:&quot;Lemma 1.14: A null-homotopic embedded sphere separates&quot;,&quot;body&quot;:&quot;Let $M$ be a connected closed smooth $3$-manifold and let\n$S\\subset M$ be a smoothly embedded two-sphere.  If the inclusion\n$S\\hookrightarrow M$ is null-homotopic, then $M\\setminus S$ is disconnected;\nequivalently, $S$ separates $M$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:13,&quot;ref&quot;:&quot;MT:ch15:15.12&quot;},{&quot;id&quot;:&quot;faaa7ab069aa&quot;,&quot;label&quot;:&quot;lem:conformal-surgery-curvature-comparison&quot;,&quot;title&quot;:&quot;Conformal curvature comparison on the neck side&quot;,&quot;display_title&quot;:&quot;Lemma 1.15: Conformal curvature comparison on the neck side&quot;,&quot;body&quot;:&quot;Let $h$ be a metric $C^{\\lfloor1/\\delta\\rfloor}$-close to\n$h_0+ds^2$ on $S^2\\times I$, and put $\\widehat h=e^{-2f}h$ with\n$f=C_0\\delta e^{-q/s}$ for $s&gt;0$.  Choose $K$ so that every curvature\neigenvalue of a scale-one $\\delta$-neck is at least $-K\\delta$.\nThere are universal choices $q\\gg(A_0+4)^2$, $C_0=2Ke^q$, and\n$\\delta_*&gt;0$ such that, whenever $0&lt;\\delta\\le\\delta_*$ and $0&lt;s&lt;4$,\nthe scalar curvature of\n$\\widehat h$ is at least that of $h$, and the least eigenvalue of its\ncurvature operator is strictly larger than that of $h$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:14,&quot;ref&quot;:&quot;MT:ch13:13.5,MT:ch13:13.6,MT:ch13:13.7,MT:ch13:13.8,MT:ch13:13.9,MT:ch13:13.10,MT:ch13:13.11,MT:ch13:13.12&quot;},{&quot;id&quot;:&quot;d41a89faf926&quot;,&quot;label&quot;:&quot;lem:retained-neck-surgery-pinching&quot;,&quot;title&quot;:&quot;Curvature and pinching on the retained neck&quot;,&quot;display_title&quot;:&quot;Lemma 1.16: Curvature and pinching on the retained neck&quot;,&quot;body&quot;:&quot;For the universal choices in\n\\ref{lem:conformal-surgery-curvature-comparison} and all sufficiently\nsmall $\\delta$, the metric $\\widetilde g$ has positive sectional curvature\non $1\\le s&lt;4$.  Moreover, if the original neck satisfies, for some\n$t\\ge0$ and $X_g=\\max(0,-\\nu_g)$,\n\\[\n R_g\\ge-\\frac6{1+4t},\n \\qquad\n R_g\\ge2X_g\\bigl(\\log X_g+\\log(1+t)-3\\bigr)\n \\quad(X_g&gt;0),\n\\]\nthen the same inequalities hold for $\\widetilde g$ on $s&lt;4$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:15,&quot;ref&quot;:&quot;MT:ch13:13.13,MT:ch13:13.14&quot;},{&quot;id&quot;:&quot;b945feb50d33&quot;,&quot;label&quot;:&quot;lem:standard-cap-surgery-curvature&quot;,&quot;title&quot;:&quot;Curvature and pinching on the standard-cap side&quot;,&quot;display_title&quot;:&quot;Lemma 1.17: Curvature and pinching on the standard-cap side&quot;,&quot;body&quot;:&quot;For the same universal choices and all sufficiently small $\\delta$, the\nmetric $\\widetilde g$ has positive sectional curvature on\n$4\\le s\\le A_0+4$.  It satisfies the two curvature-pinching inequalities\nin \\ref{lem:retained-neck-surgery-pinching} there.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:16,&quot;ref&quot;:&quot;MT:ch13:13.2&quot;},{&quot;id&quot;:&quot;8ddd9ae35616&quot;,&quot;label&quot;:&quot;lem:local-surgery-standard-cap-convergence&quot;,&quot;title&quot;:&quot;Convergence of the surgery cap to the standard cap&quot;,&quot;display_title&quot;:&quot;Lemma 1.18: Convergence of the surgery cap to the standard cap&quot;,&quot;body&quot;:&quot;For every $\\delta&#x27;&#x27;&gt;0$ there is $\\delta_1&#x27;(\\delta&#x27;&#x27;)&gt;0$ such that, if\n$\\delta\\le\\delta_1&#x27;(\\delta&#x27;&#x27;)$, then $\\widehat g$ on\n$B_{\\widehat g}(p_0,(\\delta&#x27;&#x27;)^{-1})$ is $\\delta&#x27;&#x27;$-close in\n$C^{\\lfloor1/\\delta&#x27;&#x27;\\rfloor}$ to $g_0$ on the corresponding standard\nball.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:17,&quot;ref&quot;:&quot;MT:ch13:13.2&quot;},{&quot;id&quot;:&quot;b5fb8dfb64e4&quot;,&quot;label&quot;:&quot;thm:local-neck-surgery&quot;,&quot;title&quot;:&quot;Local surgery on a delta-neck&quot;,&quot;display_title&quot;:&quot;Theorem 1.19: Local surgery on a delta-neck&quot;,&quot;body&quot;:&quot;There are universal constants $C_0,q,R_0&lt;\\infty$ and $\\delta_0&#x27;&gt;0$ such\nthat, whenever $Q=R_g(x_0)\\ge R_0$ and\n$0&lt;\\delta\\le\\delta_0&#x27;$, the metric $\\widetilde g$ of\n\\ref{def:interpolating-surgery-metric} has the following properties.\n\\begin{enumerate}\n\\item Every curvature-pinching inequality in\n      \\ref{lem:retained-neck-surgery-pinching} that holds on the original\n      neck holds everywhere on $\\mathcal S$.\n\\item The sectional curvature is positive on\n      $1\\le s\\le A_0+4$.\n\\item The radial collapse map\n      $\\xi\\colon(N,g)\\to(\\mathcal S,\\widetilde g)$ is distance\n      nonincreasing.\n\\item The normalized pointed cap converges smoothly on bounded balls,\n      \\[\n        (\\mathcal S,\\widehat g,p_0)\\longrightarrow\n        (\\mathbb R^3,g_0,p_0),\n      \\]\n      as $\\delta\\to0$, in the quantitative sense of\n      \\ref{lem:local-surgery-standard-cap-convergence}.\n\\end{enumerate}&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:18,&quot;ref&quot;:&quot;MT:ch13:13.2&quot;}]},{&quot;id&quot;:&quot;canonical-neck-and-cap-topology&quot;,&quot;title&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;b68b762d3d15&quot;,&quot;label&quot;:&quot;def:canonical-cap&quot;,&quot;title&quot;:&quot;Canonical cap&quot;,&quot;display_title&quot;:&quot;Definition 1.20: Canonical cap&quot;,&quot;body&quot;:&quot;For $C&lt;\\infty$, a \\emph{$(C,\\epsilon)$-cap} is an open submanifold\n$\\mathcal C$ of a smooth boundaryless Riemannian three-manifold with an open\n$\\epsilon$-neck $N\\subset\\mathcal C$ whose complement in $\\mathcal C$ is\ncompact, such that:\n\\begin{enumerate}\n\\item $\\mathcal C$ is diffeomorphic to an open three-ball or to\n      $\\mathbb{RP}^3$ minus a point;\n\\item $\\overline Y=\\mathcal C\\setminus N$ is a compact submanifold with\n      boundary, its interior $Y$ is the \\emph{core}, and\n      $\\partial\\overline Y$ is a central sphere of an $\\epsilon$-neck;\n\\item $R&gt;0$ on $\\mathcal C$,\n      $\\operatorname{diam}(\\mathcal C)\n       &lt;C(\\sup_{\\mathcal C}R)^{-1/2}$.\n\\item $\\sup_{x,y\\in\\mathcal C}R(y)/R(x)&lt;C$ and\n      $\\operatorname{Vol}(\\mathcal C)\n      &lt;C(\\sup_{\\mathcal C}R)^{-3/2}$.\n\\item For $y\\in Y$, let $r_y&gt;0$ satisfy\n      $\\sup_{B(y,r_y)}R=r_y^{-2}$.  Then\n      $B(y,r_y)\\Subset\\mathcal C$ and\n      \\[\n       \\inf_{y\\in Y}\\frac{\\operatorname{Vol}B(y,r_y)}{r_y^3}&gt;C^{-1}.\n      \\]\n\\item The scale-invariant derivative bounds\n      \\[\n       \\sup_{\\mathcal C}\\frac{|\\nabla R|}{R^{3/2}}&lt;C,\n       \\qquad\n       \\sup_{\\mathcal C}\n       \\frac{|\\Delta R+2|\\operatorname{Ric}|^2|}{R^2}&lt;C\n      \\]\n      hold.\n\\end{enumerate}\nThe neck orientation is fixed so that the closure of its negative end meets\nthe core; reversing this orientation is not a new cap structure.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:19,&quot;ref&quot;:&quot;MT:ch9:9.72&quot;},{&quot;id&quot;:&quot;e9a6b43315ac&quot;,&quot;label&quot;:&quot;def:embedded-horn-frontier&quot;,&quot;title&quot;:&quot;Embedded horn frontier and cross-sectional sphere&quot;,&quot;display_title&quot;:&quot;Definition 1.21: Embedded horn frontier and cross-sectional sphere&quot;,&quot;body&quot;:&quot;For an embedded neck chart $\\varphi_N$ as in\n\\ref{def:epsilon-neck-and-scale}, write\n\\[\n S_N(\\sigma)=\\varphi_N(S^2\\times\\{\\sigma\\}),\\qquad\n H_N^+=\\varphi_N(S^2\\times(0,\\epsilon^{-1})),\\qquad\n H_N^-=\\varphi_N(S^2\\times(-\\epsilon^{-1},0)).\n\\]\nThe \\emph{horn frontier} of a cap is the embedded central sphere\n$S_N(0)=\\partial\\overline Y$ of its neck end, with the side containing the\ncompact core designated the core side.  For any open region $U\\subset M$,\n\\(\\operatorname{Fr}_M(U)=\\overline U^{\\,M}\\setminus U\\) denotes its ambient\nfrontier.  Thus every frontier point below is a point of this specified\nembedded sphere (or of an exposed end frontier), and every\ncross-sectional sphere is one of the displayed $S_N(\\sigma)$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:20,&quot;ref&quot;:&quot;MT:ch9:9.72,MT:app:A.21&quot;},{&quot;id&quot;:&quot;0a74e0f36622&quot;,&quot;label&quot;:&quot;def:epsilon-horn-terminology&quot;,&quot;title&quot;:&quot;Embedded epsilon-horn and end convention&quot;,&quot;display_title&quot;:&quot;Definition 1.22: Embedded epsilon-horn and end convention&quot;,&quot;body&quot;:&quot;Let $(M^3,g)$ be a smooth boundaryless Riemannian three-manifold and let\n$I\\subset\\mathbb R$ be a nonempty open interval.  An \\emph{embedded\n$\\epsilon$-horn} is an open embedded submanifold\n$\\mathcal H\\cong S^2\\times I$ such that every point of $\\mathcal H$ lies in\nan $\\epsilon$-neck and, for one end of $I$, the scalar curvature remains\nbounded along that end while it tends to $+\\infty$ along the other end.  The\nchosen product coordinate is proper toward the divergent end; its compact\ncross-sectional spheres are the embedded frontier spheres used for truncation.\nReversing the product coordinate exchanges the two ends but does not change\nthe horn.  A capped $\\epsilon$-horn is obtained by adjoining one canonical cap\nalong the bounded end; a double $\\epsilon$-horn has divergent ends at both\nsides.  In a Ricci-flow terminal slice, the bounded-end condition means\nbounded curvature on the terminal domain, and the divergent-end condition means\n$\\bar R\\to+\\infty$ along the end.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:21,&quot;ref&quot;:&quot;KL:II:Definition2&quot;},{&quot;id&quot;:&quot;21df66602bb6&quot;,&quot;label&quot;:&quot;def:canonical-neck-cap-regions&quot;,&quot;title&quot;:&quot;Tubes, capped tubes, and neck fibrations&quot;,&quot;display_title&quot;:&quot;Definition 1.23: Tubes, capped tubes, and neck fibrations&quot;,&quot;body&quot;:&quot;An \\emph{$\\epsilon$-tube} is a submanifold diffeomorphic to\n$S^2\\times I$, for a nondegenerate interval $I$, covered by\n$\\epsilon$-necks whose central spheres are isotopic to the $S^2$ factors.\nAn open tube has no boundary.  A \\emph{$C$-capped $\\epsilon$-tube} is the\nconnected union of an open $\\epsilon$-tube and one $(C,\\epsilon)$-cap,\nglued along an end of each.  A \\emph{doubly $C$-capped\n$\\epsilon$-tube} has disjoint cap cores attached at both ends.  An\n\\emph{$\\epsilon$-fibration} is a closed connected $S^2$-bundle over\n$S^1$, covered by $\\epsilon$-necks whose central spheres are isotopic to\nthe fibers.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:22,&quot;ref&quot;:&quot;MT:ch9:9.81,MT:app:A.21,MT:app:A.25&quot;},{&quot;id&quot;:&quot;a7c743202d6a&quot;,&quot;label&quot;:&quot;def:balanced-neck-chain&quot;,&quot;title&quot;:&quot;Balanced chain of epsilon-necks&quot;,&quot;display_title&quot;:&quot;Definition 1.24: Balanced chain of epsilon-necks&quot;,&quot;body&quot;:&quot;A finite \\emph{chain of $\\epsilon$-necks} is a sequence\n$N_a,\\ldots,N_b$ with oriented axial coordinates such that, for each\n$a\\le i&lt;b$,\n\\[\n \\{s_{N_i}&gt;\\tfrac12\\epsilon^{-1}\\}\\subset N_i\\cap N_{i+1},\n \\qquad\n \\{s_{N_{i+1}}&lt;-\\tfrac12\\epsilon^{-1}\\}\\subset N_i\\cap N_{i+1},\n\\]\nwhile\n\\[\n N_i\\cap N_{i+1}\\subset\n \\{s_{N_i}&gt;-\\tfrac12\\epsilon^{-1}\\}\n \\cap\\{s_{N_{i+1}}&lt;\\tfrac12\\epsilon^{-1}\\},\n\\]\nand $N_i\\cap E_{N_a}^-=\\varnothing$ for\n$i&gt;a$.  An infinite chain indexed by an interval in $\\mathbb Z$ is one\nwhose restriction to every finite subinterval is a chain.  The chain is\n\\emph{balanced} if consecutive centers $x_j,x_{j+1}$ satisfy\n\\[\n 0.99\\,r_{N_j}\\epsilon^{-1}\n \\le d(x_j,x_{j+1})\n \\le1.01\\,r_{N_j}\\epsilon^{-1}.\n\\]&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:23,&quot;ref&quot;:&quot;MT:app:A.12,MT:app:A.17&quot;},{&quot;id&quot;:&quot;1548fac8b0f3&quot;,&quot;label&quot;:&quot;lem:epsilon-neck-metric-control&quot;,&quot;title&quot;:&quot;Metric control in a small epsilon-neck&quot;,&quot;display_title&quot;:&quot;Lemma 1.25: Metric control in a small epsilon-neck&quot;,&quot;body&quot;:&quot;Write $d_N$ for the intrinsic distance induced by the restriction of the\nambient metric to $N$.  The estimates below are intrinsic to the neck; no\nambient no-shortcut assertion is being made.\nFor every $0&lt;\\alpha&lt;1/8$, all sufficiently small $\\epsilon$ have the\nfollowing property.  If $N$ is an $\\epsilon$-neck of scale $r_N$ centered\nat $x$, then scalar curvatures on $N$ lie between\n$(1-\\alpha)r_N^{-2}$ and $(1+\\alpha)r_N^{-2}$.  Neck spheres have\ndiameter at most $(1+\\alpha)\\sqrt2\\pi r_N$, and points with sufficiently\nlarge axial separation, namely\n$|s_N(q)-s_N(p)|\\ge\\epsilon^{-1}/100$ or\n$d_N(p,q)\\ge r_N\\epsilon^{-1}/100$, satisfy\n\\[\n (1-\\alpha)r_N|s_N(q)-s_N(p)|\n \\le d_N(p,q)\n \\le(1+\\alpha)r_N|s_N(q)-s_N(p)|.\n\\]\nIn particular, every path contained in $N$ and joining its two end regions\nhas length at least\n$\\frac95(1-\\alpha)r_N\\epsilon^{-1}$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:24,&quot;ref&quot;:&quot;MT:app:A.2,MT:app:A.5&quot;},{&quot;id&quot;:&quot;23c07f13aad2&quot;,&quot;label&quot;:&quot;prop:overlapping-epsilon-necks&quot;,&quot;title&quot;:&quot;Overlap control for small epsilon-necks&quot;,&quot;display_title&quot;:&quot;Proposition 1.26: Overlap control for small epsilon-necks&quot;,&quot;body&quot;:&quot;For every $0&lt;\\alpha\\le10^{-2}$, all sufficiently small $\\epsilon$ have\nthe following property.  If two $\\epsilon$-necks $N,N&#x27;$ intersect, then\ntheir scales differ by a factor in $(1-\\alpha,1+\\alpha)$, their neck-sphere\ntangent planes make angle less than $\\alpha$ on the overlap, and their\noriented axial directions agree up to sign and an error less than\n$\\alpha$.  A neck sphere of one neck contained in the other is isotopic\nthere to a neck sphere.  If the overlap contains a point in the middle\nnine-tenths of one neck, then there is a point in the overlap lying in the\nmiddle $0.96\\epsilon^{-1}$ of both neck coordinates; the corresponding\ncross-sectional spheres are contained in the opposite necks, isotopic in the\noverlap, and the relevant overlap component is diffeomorphic to\n$S^2\\times(0,1)$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;proposition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:25,&quot;ref&quot;:&quot;MT:app:A.11&quot;},{&quot;id&quot;:&quot;4e2f98dbbfef&quot;,&quot;label&quot;:&quot;lem:neck-separation-type-locally-constant&quot;,&quot;title&quot;:&quot;Separation type is constant on a connected neck-center set&quot;,&quot;display_title&quot;:&quot;Lemma 1.27: Separation type is constant on a connected neck-center set&quot;,&quot;body&quot;:&quot;For sufficiently small $\\epsilon$, let $X$ be a connected subset of a\nsmooth boundaryless Riemannian three-manifold $M$ such that every point of\n$X$ is the center of an embedded $\\epsilon$-neck.  Then either every central\nneck sphere arising from points of $X$ separates $M$, or none does.  More\nprecisely, if two centers are sufficiently close that their necks meet in\nthe middle nine-tenths, their central spheres are ambiently isotopic and\ntherefore have the same separation predicate; these neighborhoods form an\nopen cover of $X$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:26,&quot;ref&quot;:&quot;MT:app:A.11&quot;},{&quot;id&quot;:&quot;d3773f5a6e9c&quot;,&quot;label&quot;:&quot;lem:neck-chain-product&quot;,&quot;title&quot;:&quot;A neck chain is a product&quot;,&quot;display_title&quot;:&quot;Lemma 1.28: A neck chain is a product&quot;,&quot;body&quot;:&quot;Let $N_j$ be a balanced, non-returning chain of sufficiently small\n$\\epsilon$-necks, with $N_i\\cap N_j=\\varnothing$ whenever\n$|i-j|\\ge3$.  For an infinite chain assume the positive-end frontier\ncondition stated below; for a finite chain assume\nthe two exposed ends are distinct.  Then the union\n$U=\\bigcup_jN_j$ is diffeomorphic to $S^2\\times(0,1)$, compatibly with the\nisotopy classes of all neck spheres.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:27,&quot;ref&quot;:&quot;MT:app:A.13&quot;},{&quot;id&quot;:&quot;a0f8035a1904&quot;,&quot;label&quot;:&quot;lem:infinite-neck-chain-frontier&quot;,&quot;title&quot;:&quot;An infinite neck-chain end has no frontier&quot;,&quot;display_title&quot;:&quot;Lemma 1.29: An infinite neck-chain end has no frontier&quot;,&quot;body&quot;:&quot;Let $N_0,N_1,\\ldots$ be a chain of sufficiently small\n$\\epsilon$-necks in $M$, and put $U=\\bigcup_{j\\ge0}N_j$.  Then the\nfrontier of $U$ in $M$ is exactly the frontier of the negative end of\n$N_0$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:28,&quot;ref&quot;:&quot;MT:app:A.15&quot;},{&quot;id&quot;:&quot;e0785f0ad6be&quot;,&quot;label&quot;:&quot;lem:balanced-neck-chain-extension&quot;,&quot;title&quot;:&quot;Extension of a balanced neck chain&quot;,&quot;display_title&quot;:&quot;Lemma 1.30: Extension of a balanced neck chain&quot;,&quot;body&quot;:&quot;For all sufficiently small $\\epsilon$, let\n$N_a,\\ldots,N_b$ be a balanced chain whose central spheres separate $M$.\nIf a point in the frontier of its positive end is the center of an\n$\\epsilon$-neck $N$, then, after reversing $N$ if necessary,\n$N_a,\\ldots,N_b,N$ is a balanced chain.  The analogous assertion holds at\nthe negative end.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:29,&quot;ref&quot;:&quot;MT:app:A.17,MT:app:A.18&quot;},{&quot;id&quot;:&quot;d7cbc85ad894&quot;,&quot;label&quot;:&quot;lem:finite-neck-chain-frontier-dichotomy&quot;,&quot;title&quot;:&quot;Finite neck-chain frontier extension dichotomy&quot;,&quot;display_title&quot;:&quot;Lemma 1.31: Finite neck-chain frontier extension dichotomy&quot;,&quot;body&quot;:&quot;Let $X$ be connected in a boundaryless smooth Riemannian three-manifold $M$,\nand let $U$ be the compact closure of the union of a finite balanced chain of\nsufficiently small $\\epsilon$-necks.  Assume\n$X\\cap\\operatorname{int}U\\ne\\varnothing$ and\n$X\\cap(M\\setminus\\overline U)\\ne\\varnothing$, and that every point of\n$X\\setminus\\operatorname{int}U$ is the center of an $\\epsilon$-neck whose\ncentral sphere separates $M$.  Then $X$ meets the frontier of one exposed end\nof $U$ at a neck center, and that neck extends the balanced chain after an\naxial reorientation.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:30,&quot;ref&quot;:&quot;MT:app:A.17,MT:app:A.18,MT:app:A.21&quot;},{&quot;id&quot;:&quot;13cdca21cc2c&quot;,&quot;label&quot;:&quot;thm:separating-neck-centers-form-tube&quot;,&quot;title&quot;:&quot;Separating neck centers lie in an epsilon-tube&quot;,&quot;display_title&quot;:&quot;Theorem 1.32: Separating neck centers lie in an epsilon-tube&quot;,&quot;body&quot;:&quot;There is $\\epsilon_0&gt;0$ such that the following holds for\n$0&lt;\\epsilon\\le\\epsilon_0$.  Let $X$ be a connected subset of a smooth\nRiemannian three-manifold $M$ without boundary.  Suppose every $x\\in X$ is\nthe center of an embedded $\\epsilon$-neck and every corresponding central\nsphere separates $M$.\nThen a subcollection of these necks, after reversing axial coordinates when\nnecessary, is a balanced chain whose union contains $X$.  Consequently\n$X$ lies in an $\\epsilon$-tube.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:31,&quot;ref&quot;:&quot;MT:app:A.12,MT:app:A.15,MT:app:A.17,MT:app:A.18,MT:app:A.19&quot;},{&quot;id&quot;:&quot;6486b6c2f18d&quot;,&quot;label&quot;:&quot;lem:nonseparating-neck-chain-or-bundle&quot;,&quot;title&quot;:&quot;Nonseparating neck chains: tube or closed fibration&quot;,&quot;display_title&quot;:&quot;Lemma 1.33: Nonseparating neck chains: tube or closed fibration&quot;,&quot;body&quot;:&quot;For sufficiently small $\\epsilon$, let $X$ be a connected subset of a\nboundaryless Riemannian three-manifold $M$ such that every point of $X$ is the\ncenter of an embedded $\\epsilon$-neck and no corresponding central sphere\nseparates $M$.  Then either\n\\begin{enumerate}\n\\item there is a balanced chain of these necks, with axial coordinates\n      possibly reversed, whose union $U\\cong S^2\\times(0,1)$ contains $X$; or\n\\item $X$ is contained in a connected component $M_0\\subset M$ all of whose\n      points are $\\epsilon$-neck centers, and $M_0$ is a closed\n      $S^2$-bundle over $S^1$ (an $\\epsilon$-fibration).\n\\end{enumerate}&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:32,&quot;ref&quot;:&quot;MT:app:A.20,MT:app:A.24&quot;},{&quot;id&quot;:&quot;de24ec976230&quot;,&quot;label&quot;:&quot;lem:all-neck-component-tube-or-bundle&quot;,&quot;title&quot;:&quot;All-neck components are tubes or sphere bundles&quot;,&quot;display_title&quot;:&quot;Lemma 1.34: All-neck components are tubes or sphere bundles&quot;,&quot;body&quot;:&quot;For sufficiently small $\\epsilon$, let $Y$ be a connected Riemannian\nthree-manifold without boundary such that every point of $Y$ is the center of\nan embedded $\\epsilon$-neck.  Then either $Y$ is diffeomorphic to\n$S^2\\times(0,1)$ and is an $\\epsilon$-tube, or $Y$ is diffeomorphic to an\n$S^2$-bundle over $S^1$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:33,&quot;ref&quot;:&quot;MT:app:A.20&quot;},{&quot;id&quot;:&quot;f08c381beccc&quot;,&quot;label&quot;:&quot;lem:nested-cap-scale-comparison&quot;,&quot;title&quot;:&quot;Uniform scale in a nested cap chain&quot;,&quot;display_title&quot;:&quot;Lemma 1.35: Uniform scale in a nested cap chain&quot;,&quot;body&quot;:&quot;Fix $C$ and sufficiently small $\\epsilon$.  Let\n$C_0\\subset C_1\\subset\\cdots$ be canonical caps whose successive core\nclosures meet the preceding frontier.  If $Q_0$ is the scalar\ncurvature at a fixed point of the first core, then every neck scale exposed by\nthe chain is at least $c(C,\\epsilon)Q_0^{-1/2}$, and every noncontradictory\nenlargement increases the distance from that point to the complement by at\nleast $c(C,\\epsilon)Q_0^{-1/2}$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:34,&quot;ref&quot;:&quot;MT:app:A.22&quot;},{&quot;id&quot;:&quot;8b5c645f958d&quot;,&quot;label&quot;:&quot;lem:no-infinite-nested-canonical-caps&quot;,&quot;title&quot;:&quot;No infinite nested chain of canonical caps&quot;,&quot;display_title&quot;:&quot;Lemma 1.36: No infinite nested chain of canonical caps&quot;,&quot;body&quot;:&quot;For fixed $C$ and sufficiently small $\\epsilon$, there is no chain of\n$(C,\\epsilon)$-caps\n\\[\n C_0\\subset C_1\\subset\\cdots\n\\]\nsuch that the closure of the core of $C_i$ meets\n$\\operatorname{Fr}_M(C_{i-1})$ for every $i\\ge1$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:35,&quot;ref&quot;:&quot;MT:app:A.22&quot;},{&quot;id&quot;:&quot;4062bfa79032&quot;,&quot;label&quot;:&quot;lem:isotopic-cap-gluing-sphere&quot;,&quot;title&quot;:&quot;An isotopic cap-gluing sphere determines a component&quot;,&quot;display_title&quot;:&quot;Lemma 1.37: An isotopic cap-gluing sphere determines a component&quot;,&quot;body&quot;:&quot;Let $X\\subset M$ be connected.  Let $\\widetilde C$ be a cap or a finite\ncapped tube containing a point of $X$, and let $C&#x27;$ be a\n$(C,\\epsilon)$-cap whose core contains a point of\n$X\\cap\\operatorname{Fr}_M(\\widetilde C)$.  Let $N&#x27;$ be the neck end of\n$C&#x27;$, oriented away from its core.  If a two-sphere\n$\\Sigma\\subset N&#x27;\\cap\\widetilde C$ lies in the closed positive half of\n$N&#x27;$ and is isotopic in $N&#x27;$ to its central sphere, then\n$\\widetilde C\\cup C&#x27;$ is a component of $M$ containing $X$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:36,&quot;ref&quot;:&quot;MT:app:A.24&quot;},{&quot;id&quot;:&quot;63e8303c1711&quot;,&quot;label&quot;:&quot;lem:adjacent-canonical-caps-form-component&quot;,&quot;title&quot;:&quot;Adjacent canonical caps form an ambient component&quot;,&quot;display_title&quot;:&quot;Lemma 1.38: Adjacent canonical caps form an ambient component&quot;,&quot;body&quot;:&quot;Let $X\\subset M$ be connected, and let $\\widetilde C$ be obtained from a\n$(C,\\epsilon)$-cap $C_0$ by adjoining a finite balanced chain to its neck\nend.  Suppose $\\widetilde C$ contains a point of $X$.  Let $C&#x27;$ be a\n$(C,\\epsilon)$-cap whose core contains a point of\n$X\\cap\\operatorname{Fr}_M(\\widetilde C)$, and assume\n$C_0\\nsubseteq C&#x27;$.  Then $\\widetilde C\\cup C&#x27;$ is a component of $M$\ncontaining $X$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:37,&quot;ref&quot;:&quot;MT:app:A.23&quot;},{&quot;id&quot;:&quot;6b096c2e83df&quot;,&quot;label&quot;:&quot;lem:capped-chain-exposed-frontier&quot;,&quot;title&quot;:&quot;Frontier localization for a capped finite neck chain&quot;,&quot;display_title&quot;:&quot;Lemma 1.39: Frontier localization for a capped finite neck chain&quot;,&quot;body&quot;:&quot;Let $C_0$ be a $(C,\\epsilon)$-cap and let\n$N_a,\\ldots,N_b$ be a finite balanced chain whose negative end is attached to\n$C_0$, with the positive end of $N_b$ the only uncapped end.  More precisely,\nafter the cap orientation of \\ref{def:canonical-cap} is fixed, assume that\n$E_{N_a}^-\\subset C_0$ and that all other cap/neck intersections are the\noverlaps in \\ref{def:balanced-neck-chain}.  Assume that\n\\[\nU=\\overline{C_0\\cup N_a\\cup\\cdots\\cup N_b}\n\\]\nis compact.  Then every point of\n$\\operatorname{Fr}_M(U)$ lies in the exposed positive-end region of $N_b$.\nConsequently, if such a frontier point is the center of an\n$\\epsilon$-neck, that neck can be axially oriented to extend the chain.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:38,&quot;ref&quot;:&quot;MT:app:A.17,MT:app:A.21&quot;},{&quot;id&quot;:&quot;e7695b826f1a&quot;,&quot;label&quot;:&quot;lem:finite-cap-chain-frontier-dichotomy&quot;,&quot;title&quot;:&quot;Finite cap-chain frontier dichotomy&quot;,&quot;display_title&quot;:&quot;Lemma 1.40: Finite cap-chain frontier dichotomy&quot;,&quot;body&quot;:&quot;Let $X$ be connected and let $U$ be the compact closure of a connected union\nof one $(C,\\epsilon)$-cap and a finite balanced chain of $\\epsilon$-necks,\nattached at the negative end with only the positive end exposed as in\n\\ref{lem:capped-chain-exposed-frontier}.\nAssume $X\\cap\\operatorname{int}U\\ne\\varnothing$ and\n$X\\cap(M\\setminus\\overline U)\\ne\\varnothing$, and every point of\n$X\\setminus\\operatorname{int}U$ is either an $\\epsilon$-neck center or lies in\nthe core of a $(C,\\epsilon)$-cap.  If $X\\not\\subset U$, then\n$X\\cap\\operatorname{Fr}_M(U)$ contains either a neck center whose neck extends\nthe balanced chain or a point in the core of a second cap.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:39,&quot;ref&quot;:&quot;MT:app:A.21&quot;},{&quot;id&quot;:&quot;ddac191ad725&quot;,&quot;label&quot;:&quot;lem:maximal-cap-selection&quot;,&quot;title&quot;:&quot;Maximal cap selection along a connected covered set&quot;,&quot;display_title&quot;:&quot;Lemma 1.41: Maximal cap selection along a connected covered set&quot;,&quot;body&quot;:&quot;Let $X$ be connected and suppose every point of $X$ is a neck center or lies\nin a $(C,\\epsilon)$-cap core.  If $X$ meets a cap core, then there is a cap\n$C_0$ meeting $X$ such that no finite balanced neck extension from $C_0$ has a\nfrontier point of $X$ in the core of a strictly larger cap.  The choice is\nmade along the ordered cap/neck incidence relation; it is not an arbitrary\nmaximal element of an unproved partial order.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:40,&quot;ref&quot;:&quot;MT:app:A.21,MT:app:A.22,MT:app:A.23&quot;},{&quot;id&quot;:&quot;356e0995b890&quot;,&quot;label&quot;:&quot;thm:cap-and-neck-cover-classification&quot;,&quot;title&quot;:&quot;Connected sets covered by canonical cap cores and neck centers&quot;,&quot;display_title&quot;:&quot;Theorem 1.42: Connected sets covered by canonical cap cores and neck centers&quot;,&quot;body&quot;:&quot;For every $C&lt;\\infty$ and all sufficiently small $\\epsilon&gt;0$, let $X$ be\na connected subset of a smooth Riemannian three-manifold $M$ without\nboundary.  Suppose every\npoint of $X$ is either the center of an $\\epsilon$-neck or lies in the core\nof a $(C,\\epsilon)$-cap.  Then at least one of the following holds:\n\\begin{enumerate}\n\\item $X$ lies in a component which is the union of two\n      $(C,\\epsilon)$-caps and is diffeomorphic to\n      $S^3$, $\\mathbb{RP}^3$, or\n      $\\mathbb{RP}^3\\#\\mathbb{RP}^3$;\n\\item $X$ lies in a doubly $C$-capped $\\epsilon$-tube component of one\n      of those three diffeomorphism types;\n\\item $X$ lies in one $(C,\\epsilon)$-cap;\n\\item $X$ lies in a $C$-capped $\\epsilon$-tube;\n\\item $X$ lies in an $\\epsilon$-tube;\n\\item $X$ lies in an $\\epsilon$-fibration component covered by\n      $\\epsilon$-necks.\n\\end{enumerate}&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:41,&quot;ref&quot;:&quot;MT:app:A.21&quot;},{&quot;id&quot;:&quot;5c16aa7c0849&quot;,&quot;label&quot;:&quot;thm:canonical-neck-cap-topology&quot;,&quot;title&quot;:&quot;Topology of a manifold covered by canonical caps and necks&quot;,&quot;display_title&quot;:&quot;Theorem 1.43: Topology of a manifold covered by canonical caps and necks&quot;,&quot;body&quot;:&quot;Let $(M,g)$ be a connected smooth Riemannian three-manifold without boundary.\nFor fixed\n$C&lt;\\infty$ and sufficiently small $\\epsilon&gt;0$, suppose each point of\n$M$ is either the center of an $\\epsilon$-neck or belongs to the core of a\n$(C,\\epsilon)$-cap.  At least one of the following source alternatives\noccurs (their displayed diffeomorphism types are separated by compactness\nand end structure):\n\\begin{enumerate}\n\\item $M$ is diffeomorphic to $S^3$, $\\mathbb{RP}^3$, or\n      $\\mathbb{RP}^3\\#\\mathbb{RP}^3$, and is the union of two caps or a\n      doubly capped $\\epsilon$-tube;\n\\item $M$ is diffeomorphic to $\\mathbb R^3$ or to\n      $\\mathbb{RP}^3\\setminus\\{p\\}$, and is a cap or a capped\n      $\\epsilon$-tube;\n\\item $M$ is diffeomorphic to $S^2\\times\\mathbb R$ and is an\n      $\\epsilon$-tube;\n\\item $M$ is diffeomorphic to an $S^2$-bundle over $S^1$ and is an\n      $\\epsilon$-fibration.\n\\end{enumerate}&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:42,&quot;ref&quot;:&quot;MT:app:A.25&quot;}]}]},{&quot;id&quot;:&quot;analytic-control-noncollapsing&quot;,&quot;title&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;sections&quot;:[{&quot;id&quot;:&quot;surgery-flows-and-fixed-controls&quot;,&quot;title&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;5d564488bf3b&quot;,&quot;label&quot;:&quot;def:ricci-flow-with-surgery&quot;,&quot;title&quot;:&quot;Ricci flow with surgery&quot;,&quot;display_title&quot;:&quot;Definition 2.1: Ricci flow with surgery&quot;,&quot;body&quot;:&quot;A \\emph{Ricci flow with surgery} is a pair $(\\mathcal M,G)$ with the\nfollowing structure.  The surgery spacetime $\\mathcal M$ has a continuous\ntime function $\\mathbf t\\colon\\mathcal M\\to I$ which is $C^\\infty$ with\nnonvanishing differential on every ordinary or one-sided smooth chart, a\ntime vector field $\\chi$ which is smooth on those charts and satisfies\n$\\chi(\\mathbf t)=1$, and the ordinary, one-sided, and surgery charts\nwhich distinguish smooth, exposed, and singular points.  Every regular slice\n$M_t=\\mathbf t^{-1}(t)$ is a smooth manifold, and the horizontal bundle is\n$\\mathcal H=\\ker(d\\mathbf t)$.  The tensor $G$ is a smooth metric on\n$\\mathcal H$ and satisfies\n\\[\n \\mathcal L_\\chi G=-2\\operatorname{Ric}_G.\n\\]\nAt an exposed point or an endpoint of $I$, the Lie derivative is one-sided.\nAt each transition time $t=t_k^+=t_{k+1}^-$ there are a backward slice\n$\\mathcal M_t^- = \\Omega_k\\times\\{t\\}$, where $\\Omega_k$ is the open set of\npoints with bounded curvature and smooth terminal limit on the preceding\npiece, and a forward slice $\\mathcal M_t^+=M_{k+1}\\times\\{t\\}$, the initial\nslice of the following piece; at regular times\n$\\mathcal M_t^- = \\mathcal M_t^+=M_t$, while at a terminal singular time only\n$\\mathcal M_t^-$ is defined.  The path metrics on these slices may be\ninfinite between distinct components.  The flow is three-dimensional when\nits slices are three-manifolds.\n\nFor $x$ in a slice side and $s&gt;0$, let\n$B^\\pm(x,t,s)$ denote the open radius-$s$ ball in the path metric of the\nconnected component of $\\mathcal M_t^\\pm$ containing $x$; at a regular time the\ntwo signs agree with the ordinary metric ball.  The metric on the backward\nside is the terminal presurgery metric and the metric on the forward side is\nthe postsurgery initial metric.  Thus a ball or parabolic region with a minus\n(respectively plus) sign is formed only from points on the corresponding side\nof a transition.\n\nAn admissible curve is a continuous curve whose time-$u$ point lies in the\ncorresponding slice and whose restriction to each constituent flow is smooth.\nIt is \\emph{static} when its spatial component is constant in every chart.\nFor $(x,t)\\in\\mathcal M_t^+$, with $t+\\Delta t$ in the time domain and\n$\\Delta t&gt;0$, let\n$P(x,t,s,\\Delta t)$ be the union of maximal static curves starting in\n$B^+(x,t,s)$ and defined through $t+\\Delta t$.  For\n$(x,t)\\in\\mathcal M_t^-$ and $\\Delta t&lt;0$, define\n$P(x,t,s,\\Delta t)$ by maximal static curves ending in $B^-(x,t,s)$ and\ndefined back to $t+\\Delta t$.  No forward development is formed from a\nterminal singular slice, and no backward development is formed outside the\ntime domain.  A set $Y\\subset\\mathcal M_t$ is\n\\emph{unscathed on $[c,d]$} if every point of $Y$ lies on a static curve\nthroughout that interval.  A parabolic region is unscathed when its ball is\nunscathed and the region is its full static development.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:43,&quot;ref&quot;:&quot;MT:ch14:14.8&quot;},{&quot;id&quot;:&quot;a0d6ae4e1672&quot;,&quot;label&quot;:&quot;def:surgery-flow-noncollapsing&quot;,&quot;title&quot;:&quot;Noncollapsing for a surgery flow&quot;,&quot;display_title&quot;:&quot;Definition 2.2: Noncollapsing for a surgery flow&quot;,&quot;body&quot;:&quot;Let $(\\mathcal M,G)$ be a three-dimensional Ricci flow with surgery.  Let\n$\\kappa:[0,\\infty)\\to(0,\\infty)$ be a positive function and let\n$\\epsilon&gt;0$.  The flow is \\emph{$\\kappa$-noncollapsed below $\\epsilon$} if,\nfor every $(x,t)\\in\\mathcal M_t^-$ and\n$0&lt;\\rho&lt;\\epsilon$ with $t\\ge\\rho^2$,\n\\[\n P(x,t,\\rho,-\\rho^2)\\text{ is unscathed},\\qquad\n |\\operatorname{Rm}|\\le \\rho^{-2}\\text{ on }P(x,t,\\rho,-\\rho^2)\n\\quad\\Longrightarrow\\quad\n \\left[\\operatorname{Vol}_{g(t)}B^-(x,t,\\rho)\\ge\\kappa(t)\\rho^3\n \\ \\text{or}\\ x\\text{ lies in a component of }M_t^-\n \\text{ with positive sectional curvature}\\right].\n\\]\nThis is the source convention: a compact positive-sectional-curvature\ncomponent is an allowed exceptional branch.  At a regular time this is the\nsame predicate with $B^-=B$; at a transition it is evaluated on the backward\nslice.  Whenever a later argument needs an actual volume lower bound, it must\nassume the nonpositive branch (or invoke a separate positive-component\nestimate).&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:44,&quot;ref&quot;:&quot;MT:ch14:14.14,MT:ch14:14.15&quot;},{&quot;id&quot;:&quot;e3bfa463978d&quot;,&quot;label&quot;:&quot;def:normalized-riemannian-three-manifold&quot;,&quot;title&quot;:&quot;Normalized compact Riemannian three-manifold&quot;,&quot;display_title&quot;:&quot;Definition 2.3: Normalized compact Riemannian three-manifold&quot;,&quot;body&quot;:&quot;A compact Riemannian three-manifold $(M,g)$ is normalized when\n$|\\operatorname{Rm}_g|\\le1$ and\n\\[\n \\operatorname{Vol}_g B_g(x,1)\\ge\n \\tfrac12\\operatorname{Vol}_{\\mathbb R^3}B(0,1)\n \\qquad(x\\in M).\n\\]&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:45,&quot;ref&quot;:&quot;KL:II.5:Def1&quot;},{&quot;id&quot;:&quot;ddf6538c6124&quot;,&quot;label&quot;:&quot;lem:standard-surgery-cap-model&quot;,&quot;title&quot;:&quot;Imported interface: fixed standard surgery-cap model&quot;,&quot;display_title&quot;:&quot;Lemma 2.4: Imported interface: fixed standard surgery-cap model&quot;,&quot;body&quot;:&quot;Fix a sufficiently small global $\\epsilon&gt;0$ and put $A=10$.  There are\n$B&gt;A$, $k&gt;0$, a smooth $F:(-B,\\infty)\\to\\mathbb R$, and a complete\n$O(3)$-invariant metric $g_0$ on\n$\\mathbb R^3=D^3\\cup((-B,\\infty)\\times S^2)$ such that $F=0$ on\n$[0,\\infty)$, $g_0=e^{2F}g_{\\mathrm{cyl}}$ on the cylindrical end, and\n$g_0|_{D^3}$ has constant sectional curvature $k^2$.  The restriction\n$f=F|_{(-A,0]}$ satisfies\n\\[\n f^{(m)}(0)=0\\ (m\\ge0),\\quad f&lt;0,\\quad f&#x27;&gt;0,\\quad f&#x27;&#x27;&lt;0,\\quad\n \\|f\\|_{C^2}&lt;\\epsilon,\\quad\n \\max\\{|f|,|f&#x27;|\\}\\le\\epsilon|f&#x27;&#x27;|,\n\\]\nand $g_0$ has nonnegative curvature operator and scalar curvature at least\none.  Fix this tuple $(B,F,k,g_0)$ henceforth.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:46,&quot;ref&quot;:&quot;KL:II.2:before-60.2,KL:II.4:72.1,KL:II.4:72.20&quot;},{&quot;id&quot;:&quot;5300ba7685e0&quot;,&quot;label&quot;:&quot;def:standard-solution&quot;,&quot;title&quot;:&quot;Standard solution&quot;,&quot;display_title&quot;:&quot;Definition 2.5: Standard solution&quot;,&quot;body&quot;:&quot;The standard solution is the maximal Ricci flow $(\\mathbb R^3,g(t))$ with\n$g(0)=g_0$ and curvature bounded on every compact subinterval of its domain.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:47,&quot;ref&quot;:&quot;KL:II.2:60.2&quot;},{&quot;id&quot;:&quot;3138498549d7&quot;,&quot;label&quot;:&quot;def:hamilton-ivey-pinching-condition&quot;,&quot;title&quot;:&quot;Hamilton--Ivey pinching condition&quot;,&quot;display_title&quot;:&quot;Definition 2.6: Hamilton--Ivey pinching condition&quot;,&quot;body&quot;:&quot;For $t&gt;0$, let $\\lambda_1\\le\\lambda_2\\le\\lambda_3$ be the curvature-operator\neigenvalues.  The time-$t$ Hamilton--Ivey condition is automatic when\n$\\lambda_1\\ge0$ and otherwise, with $X=-\\lambda_1$,\n\\[\n tR\\ge tX\\left(\\log(tX)+\\log\\frac{1+t}{t}-3\\right).\n\\]&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:48,&quot;ref&quot;:&quot;KL:appB:B.5&quot;},{&quot;id&quot;:&quot;9e0b17247fdb&quot;,&quot;label&quot;:&quot;lem:hamilton-ivey-phi-envelope&quot;,&quot;title&quot;:&quot;Imported interface: Hamilton--Ivey envelope&quot;,&quot;display_title&quot;:&quot;Lemma 2.7: Imported interface: Hamilton--Ivey envelope&quot;,&quot;body&quot;:&quot;For every finite horizon $\\widehat T&gt;0$, every complete Ricci flow\n$(M,g(t))_{0\\le t\\le\\widehat T}$ with curvature bounded on compact time\nintervals, and every initial lower bound\n$\\lambda_1(\\cdot,0)\\ge-1$, there is a positive smooth function\n$\\Phi_{\\mathrm{HI}}^{\\widehat T,g(0)}$ on $\\mathbb R$, nondecreasing with\n$\\Phi_{\\mathrm{HI}}^{\\widehat T,g(0)}(s)/s$ decreasing to zero for $s&gt;0$,\nsuch that\n\\[\n \\operatorname{Rm}_{g(t)}\\ge\n -\\Phi_{\\mathrm{HI}}^{\\widehat T,g(0)}(R_{g(t)})\n \\qquad(0\\le t\\le\\widehat T).\n\\]\nThe producer is allowed to depend on the horizon and on the time-zero metric;\nevery later use fixes those data before invoking the estimate.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:49,&quot;ref&quot;:&quot;KL:appB:B.5,KL:appB:after-B.6,KL:appB:phi&quot;},{&quot;id&quot;:&quot;55d6f2f40050&quot;,&quot;label&quot;:&quot;lem:ricci-flow-surgery-cap-insertion&quot;,&quot;title&quot;:&quot;Imported interface: pinching-preserving cap insertion&quot;,&quot;display_title&quot;:&quot;Lemma 2.8: Imported interface: pinching-preserving cap insertion&quot;,&quot;body&quot;:&quot;For the fixed $A=10$ and $(B,F,k,g_0)$ above, there are\n$\\delta_0^{\\rm cap}\\in(0,1/2]$ and $\\delta&#x27;(\\delta)\\to0$ such that, whenever\n$t&gt;0$, $0&lt;\\delta&lt;\\delta_0^{\\rm cap}$, and a metric $h_0$ on\n$(-A,\\delta^{-1})\\times S^2$ is $\\delta$-close after scaling by $R(x)$ to the\nunit scalar-curvature cylinder in $C^{\\lfloor1/\\delta\\rfloor+1}$, with a\nspecified base point $x\\in\\{0\\}\\times S^2$, and satisfies the time-$t$\nHamilton--Ivey condition on the whole input metric, it extends over a\nthree-ball to a metric $h$ with the same pinching,\n$h=h_0$ on $[0,\\delta^{-1})\\times S^2$, $R(x)h=g_0$ on\n$(-B,-A)\\times S^2$, constant curvature $k^2$ on the ball, and\n$\\delta&#x27;$-closeness to $e^{2F}g_{\\mathrm{cyl}}$ on the capped end.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:50,&quot;ref&quot;:&quot;KL:II.4:72.24&quot;},{&quot;id&quot;:&quot;ea4ae1699338&quot;,&quot;label&quot;:&quot;lem:finite-horizon-surgery-phi-envelope&quot;,&quot;title&quot;:&quot;Finite-horizon Hamilton--Ivey envelope across surgery&quot;,&quot;display_title&quot;:&quot;Lemma 2.9: Finite-horizon Hamilton--Ivey envelope across surgery&quot;,&quot;body&quot;:&quot;Let $(\\mathcal M,G)$ be a three-dimensional Ricci flow with surgery on a\nfinite interval $[0,b]$ with finitely many transition times.  Assume that\nthe initial curvature operator has smallest eigenvalue at least $-1$, every\nordinary piece has bounded curvature on compact time intervals, and every\ntransition is made by the pinching-preserving cap insertion of\n\\ref{lem:ricci-flow-surgery-cap-insertion}.  Then there is one admissible\nsmooth nondecreasing function $\\Phi_{\\rm HI}^{b,g(0)}$ with\n$\\Phi_{\\rm HI}^{b,g(0)}(s)/s\\to0$ as $s\\to\\infty$ such that\n\\[\n \\operatorname{Rm}_{G}(x,t)\\ge-\\Phi_{\\rm HI}^{b,g(0)}(R_G(x,t))\n\\]\non every ordinary slice and on both the backward and forward sides of every\ntransition where those slices are defined.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:51,&quot;ref&quot;:&quot;KL:appB:B.5,KL:appB:after-B.6,KL:II.4:72.24&quot;},{&quot;id&quot;:&quot;7e3affaa5dd4&quot;,&quot;label&quot;:&quot;def:kappa-solution&quot;,&quot;title&quot;:&quot;Kappa-solution&quot;,&quot;display_title&quot;:&quot;Definition 2.10: Kappa-solution&quot;,&quot;body&quot;:&quot;For $d\\in\\{2,3\\}$, a $d$-dimensional \\emph{$\\kappa$-solution} is a connected Ricci flow\n$(M,g(t))$, $-\\infty&lt;t\\le0$, such that every time slice is complete and\nnonflat, has bounded nonnegative curvature operator, and is\n$\\kappa$-noncollapsed on every finite scale.  The value of $\\kappa&gt;0$ is\nfixed for the flow.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:52,&quot;ref&quot;:&quot;MT:ch9:9.1,MT:ch9:9.2,KL:I.11:38.1&quot;},{&quot;id&quot;:&quot;2695ed9e4485&quot;,&quot;label&quot;:&quot;def:ricci-flow-surgery-canonical-neighborhood-assumption&quot;,&quot;title&quot;:&quot;Kleiner--Lott canonical-neighborhood assumption&quot;,&quot;display_title&quot;:&quot;Definition 2.11: Kleiner--Lott canonical-neighborhood assumption&quot;,&quot;body&quot;:&quot;Fix small $\\epsilon&gt;0$, the universal $\\kappa_0$ of Proposition~50.1, the\nderivative constant $\\eta$ of Lemma~59.4, and the constants\n$C_1^\\kappa,C_2^\\kappa,C_1^{\\mathrm{std}},C_2^{\\mathrm{std}}$ from\nLemma~59.7 and Claim~5 of II.2.  Set\n\\[\n C_1=\\max\\{30\\epsilon^{-1},C_1^\\kappa,C_1^{\\mathrm{std}}\\},\\qquad\nC_2=\\max\\{C_2^\\kappa,C_2^{\\mathrm{std}}\\}.\n\\]\nAt a transition time, $\\mathcal M_t^-$ denotes the presurgery slice and\n$\\mathcal M_t^+$ the postsurgery slice; at a regular time both denote the\nordinary slice.  A backward (respectively forward) parabolic neighborhood\nbelow is only formed with $x\\in\\mathcal M_t^-$ (respectively\n$x\\in\\mathcal M_t^+$) and with time depth at most $t$.  With this eligibility\nconvention, for a positive nonincreasing $r$, every\n$(x,t)\\in\\mathcal M_t^\\pm$ with\n$R(x,t)\\ge r(t)^{-2}$ has an open canonical neighborhood\n$\\overline{B^\\pm(x,t,\\widehat r)}\\subset U\\subset B^\\pm(x,t,2\\widehat r)$,\nwhere $R(x,t)^{-1/2}&lt;\\widehat r&lt;C_1R(x,t)^{-1/2}$, modeled by a strong\n$\\epsilon$-neck, a $\\kappa_0$- or standard-solution cap, an $S^3/\\mathbb{RP}^3$\ncomponent, or an $\\epsilon$-round positive space form; on $U$ scalar curvature\nis $C_2$-comparable to $R(x,t)$ and the derivative bounds\n$|\\nabla R|&lt;\\eta R^{3/2}$ and $|\\partial_tR|&lt;\\eta R^2$ hold one-sided at surgery.\nIn the neck, cap, and closed-component cases,\n\\[\n \\operatorname{Vol}_{g(t)}U&gt;C_2^{-1}R(x,t)^{-3/2},\n\\]\nand in the closed-component case the infimal sectional curvature on $U$ is\ngreater than $C_2^{-1}R(x,t)$.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:53,&quot;ref&quot;:&quot;KL:I.11:50.1,KL:II.1:59.4,KL:II.1:59.7,KL:II.2:Claim5,KL:II.4:69.1&quot;},{&quot;id&quot;:&quot;b7ee03ad5851&quot;,&quot;label&quot;:&quot;def:ricci-flow-surgery-phi-pinching&quot;,&quot;title&quot;:&quot;Kleiner--Lott -pinching&quot;,&quot;display_title&quot;:&quot;Definition 2.12: Kleiner--Lott -pinching&quot;,&quot;body&quot;:&quot;For an admissible smooth positive nondecreasing $\\Phi$ with $\\Phi(s)/s$ decreasing\nto zero on $(0,\\infty)$, the $\\Phi$-pinching assumption is\n$\\operatorname{Rm}(x,t)\\ge-\\Phi(R(x,t))$ at every spacetime point.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:54,&quot;ref&quot;:&quot;KL:II.4:69.5&quot;},{&quot;id&quot;:&quot;d01966a9dba1&quot;,&quot;label&quot;:&quot;def:ricci-flow-surgery-a-priori-assumptions&quot;,&quot;title&quot;:&quot;Kleiner--Lott a-priori assumptions&quot;,&quot;display_title&quot;:&quot;Definition 2.13: Kleiner--Lott a-priori assumptions&quot;,&quot;body&quot;:&quot;A flow on $I\\subset[0,\\infty)$ satisfies the a-priori assumptions for $(r,\\Phi)$\nwhen it satisfies both the preceding $r$-canonical-neighborhood and\n$\\Phi$-pinching assumptions on $I$.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:55,&quot;ref&quot;:&quot;KL:II.4:69.6&quot;},{&quot;id&quot;:&quot;efaf9514f541&quot;,&quot;label&quot;:&quot;lem:ricci-flow-surgery-horn-scale&quot;,&quot;title&quot;:&quot;Imported interface: Kleiner--Lott surgery scale&quot;,&quot;display_title&quot;:&quot;Lemma 2.14: Imported interface: Kleiner--Lott surgery scale&quot;,&quot;body&quot;:&quot;Fix $\\Phi$, $\\widehat T$, and positive nonincreasing $r$ on\n$[0,\\widehat T]$.  At a singular time $T$, write $\\bar R$ for the scalar\ncurvature on the terminal maximal extension and $\\bar R(x,T)$ for its value\nat a point of the bounded-curvature domain.  There is a producer\n\\[\n H(\\Phi,T,r,\\delta)&gt;0\\qquad(0&lt;T\\le\\widehat T,\\ 0&lt;\\delta&lt;1/2)\n\\]\nwith $H(\\Phi,T,r,\\delta)&lt;\\delta^2r(T)$, nondecreasing in $r(T)$ and $\\delta$,\nsuch that at a singular time $T$, an embedded $\\epsilon$-horn whose compact\nbounded-curvature frontier lies in $\\{\\bar R\\le(\\delta r(T))^{-2}\\}$ and whose\npoint has $\\bar R\\ge H(\\Phi,T,r,\\delta)^{-2}$ contains the backward parabolic\nregion\n\\[\n P\\bigl(x,T,\\delta^{-1}\\bar R(x,T)^{-1/2},-\\bar R(x,T)^{-1}\\bigr)\n\\]\ninside a strong $\\delta$-neck.\nMoreover, for every $r_-&gt;0$ and $\\delta_-&gt;0$ there is a uniform lower\nenvelope\n\\[\n H_*=H_*(\\Phi,\\widehat T,r_-,\\delta_-)&gt;0\n\\]\nsuch that $H(\\Phi,T,r,\\delta)\\ge H_*$ whenever\n$0&lt;T\\le\\widehat T$, $r(T)\\ge r_-$, and $\\delta\\ge\\delta_-$.  Thus a\npositive nonincreasing control function on a bounded interval cannot make the\nselected surgery scales collapse to zero.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:56,&quot;ref&quot;:&quot;KL:II.4:71.1,KL:II.4:after-71.1&quot;},{&quot;id&quot;:&quot;aed6c9f3f45b&quot;,&quot;label&quot;:&quot;def:ricci-flow-with-cutoff&quot;,&quot;title&quot;:&quot;Ricci flow with Kleiner--Lott (r, )-cutoff&quot;,&quot;display_title&quot;:&quot;Definition 2.15: Ricci flow with Kleiner--Lott (r, )-cutoff&quot;,&quot;body&quot;:&quot;On $[0,b]$, let $r$ be positive nonincreasing, let\n$\\bar\\delta:[0,b]\\to(0,\\infty)$ be nonincreasing, and fix a positive\nnonincreasing threshold sequence\n$\\Delta=(\\delta_i)_{i\\ge0}$ with $0&lt;\\delta_i\\le\\delta_0^{\\rm cap}$, where\n$\\delta_0^{\\rm cap}$ is the cap-insertion threshold supplied by\n\\ref{lem:ricci-flow-surgery-cap-insertion}.  Put\n$t_0=2^{-5}$ and $T_i=2^it_0$.  Require that there is no transition on the\ninitial short-time interval $[0,T_0]$ and that every later transition obeys\n\\[\n\\bar\\delta(t)&lt;\\delta_{i+1}\\le\\delta_0^{\\rm cap}\n \\qquad(T_i&lt;t\\le T_{i+1}).\n\\]\nFix the envelope $\\Phi_{\\mathrm{HI}}^{b,g(0)}$ supplied by\n\\ref{lem:finite-horizon-surgery-phi-envelope}.  At each transition set\n$h(t)=H(\\Phi_{\\mathrm{HI}}^{b,g(0)},t,r,\\bar\\delta(t))$ and put\n$\\rho=\\bar\\delta(t)r(t)$.  Identify the final smooth interval before this\ntransition with $M_{T^-}$, where $T=t$, and define\n\\[\n \\Omega=\\{x\\in M_{T^-}:\\limsup_{s\\nearrow T}|\\operatorname{Rm}(x,s)|&lt;\\infty\\}.\n\\]\nThe limiting metric on $\\Omega$ has scalar curvature $\\bar R$, the function\n$\\bar R$ is proper and bounded below, and\n$\\Omega_\\rho=\\{y\\in\\Omega:\\bar R(y)\\le\\rho^{-2}\\}$ is compact.  Retain\nexactly the connected components of $\\Omega$ meeting $\\Omega_\\rho$ and discard\nthe other components.  For every remaining embedded $\\epsilon$-horn $\\mathcal H$\nwhose compact bounded-curvature frontier lies in $\\Omega_\\rho$, choose (using\nthe properness of $\\bar R$) a point $x_{\\mathcal H}$ on the horn with\n$\\bar R(x_{\\mathcal H})=h(t)^{-2}$.  The scale lemma gives a strong\n$\\bar\\delta(t)$-neck about this point; cut along its central cross-sectional\n$2$-sphere and glue the cap of\n\\ref{lem:ricci-flow-surgery-cap-insertion} along that sphere.  Thus the cut\nis made at a scale-selected neck, not at an arbitrary frontier of\n$\\Omega_\\rho$.  The whole backward slice satisfies the compatible time-$t$\nHamilton--Ivey condition.  On every open smooth subinterval ending at\na transition, the flow also satisfies the a-priori $(r,\\Phi_{\\mathrm{HI}})$\nconditions of\n\\ref{def:ricci-flow-surgery-a-priori-assumptions}; at a first failure the\ncanonical-neighborhood condition is required only on the half-open interval\nbefore the failure time.  An all-time flow has this cutoff when every finite\nrestriction has the stated property.  The condition is imposed only where\nsurgery occurs, so the displayed stagewise bounds are vacuous on a\nsurgery-free stage.  This is a contract for an already constructed flow;\nthe extension theorem below produces parameters making these a-priori\nconditions hold.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:57,&quot;ref&quot;:&quot;KL:II.4:73.1&quot;},{&quot;id&quot;:&quot;47d5774c640e&quot;,&quot;label&quot;:&quot;def:strong-canonical-neighborhood-control&quot;,&quot;title&quot;:&quot;Strong canonical-neighborhood control&quot;,&quot;display_title&quot;:&quot;Definition 2.16: Strong canonical-neighborhood control&quot;,&quot;body&quot;:&quot;Fix $C&lt;\\infty$, $0&lt;\\epsilon&lt;1/2$, and $r&gt;0$.  A three-dimensional Ricci\nflow with surgery satisfies the \\emph{strong\n$(C,\\epsilon)$-canonical-neighborhood assumption with parameter $r$} if\nevery point $x$ with $R(x)\\ge r^{-2}$ has one of the following\nneighborhoods at the curvature scale $R(x)^{-1/2}$:\n\\begin{enumerate}\n\\item a strong $\\epsilon$-neck centered at $x$, whose parabolic rescaling by\n      $R(x)$ is $\\epsilon$-close in\n      $C^{\\lfloor\\epsilon^{-1}\\rfloor}$ to the shrinking round cylinder on\n      normalized times $(-1,0]$;\n\\item a $(C,\\epsilon)$-cap whose core contains $x$, with $C$-comparable\n      scalar curvatures and scale-normalized diameter and volume bounded by\n      $C$, together with a uniform core volume lower bound and the\n      scale-invariant derivative bounds for $R$;\n\\item a compact positively curved $C$-component containing $x$, with\n      underlying manifold diffeomorphic to $S^3$ or $\\mathbb{RP}^3$,\n      least sectional curvature greater than $C^{-1}\\sup_M R$, and\n      \\[\n       C^{-1}(\\inf_M R)^{-1/2}&lt;\\operatorname{diam}(M)\n       &lt;C(\\sup_M R)^{-1/2};\n      \\]\n\\item an $\\epsilon$-round component containing $x$: a compact connected\n      component $(M,g)$ for which there are $R&gt;0$, a compact\n      constant-curvature-one manifold $(Z,g_0)$, and a diffeomorphism\n      $\\varphi:Z\\to M$ such that $\\varphi^*(Rg)$ is $\\epsilon$-close to $g_0$\n      in the $C^{\\lfloor\\epsilon^{-1}\\rfloor}$ topology.\n\\end{enumerate}\nOnly the first alternative is a spacetime neighborhood.  The other\nalternatives lie in the slice $M_{\\mathbf t(x)}$.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:58,&quot;ref&quot;:&quot;MT:ch9:9.76,MT:ch14:14.18&quot;},{&quot;id&quot;:&quot;9e7a99688042&quot;,&quot;label&quot;:&quot;def:curvature-pinched-toward-positive&quot;,&quot;title&quot;:&quot;Curvature pinched toward positive&quot;,&quot;display_title&quot;:&quot;Definition 2.17: Curvature pinched toward positive&quot;,&quot;body&quot;:&quot;Let $(\\mathcal M,G)$ be a three-dimensional Ricci flow with surgery whose\ntime domain lies in $[0,\\infty)$.  At $x\\in\\mathcal M$, write\n$\\lambda(x)\\ge\\mu(x)\\ge\\nu(x)$ for the eigenvalues of the curvature\noperator on $\\bigwedge^2\\mathcal H_x$ and set\n$X(x)=\\max\\{0,-\\nu(x)\\}$.  Its curvature is \\emph{pinched toward positive}\nwhen, for every $x$,\n\\[\n R(x)\\ge-\\frac{6}{1+4\\mathbf t(x)}\n\\]\nand, whenever $X(x)&gt;0$,\n\\[\n R(x)\\ge\n 2X(x)\\bigl(\\log X(x)+\\log(1+\\mathbf t(x))-3\\bigr).\n\\]\nFor a metric at a fixed time $T\\ge0$, pinching up to time $T$ means the\nsame two inequalities with $\\mathbf t(x)$ replaced by $T$.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:59,&quot;ref&quot;:&quot;MT:ch10:10.1,MT:ch14:14.17&quot;},{&quot;id&quot;:&quot;c8a111c03976&quot;,&quot;label&quot;:&quot;prop:evolving-neck-gluing&quot;,&quot;title&quot;:&quot;Imported interface: gluing evolving necks&quot;,&quot;display_title&quot;:&quot;Proposition 2.18: Imported interface: gluing evolving necks&quot;,&quot;body&quot;:&quot;There is $0&lt;\\beta&lt;1/2$ such that the following holds for every\n$0&lt;\\epsilon&lt;1$.  Let\n$(N\\times[-t_0,0],g_1(t))$ be an evolving\n$\\beta\\epsilon$-neck centered at $x$ with $R(x,0)=1$, and let\n$(N&#x27;\\times(-t_1,-t_0],g_2(t))$ be a strong\n$\\beta\\epsilon/2$-neck
