 $X$ gives the corresponding global statement.  The number of\nsummands and operations is finite because the exposed region and its frontier\nare finite.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Reversing One Surgery&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:258,&quot;ref&quot;:&quot;MT:ch15:15.3&quot;},{&quot;id&quot;:&quot;86b927517d94&quot;,&quot;label&quot;:&quot;lem:single-surgery-connected-sum-reconstruction&quot;,&quot;title&quot;:&quot;Reconstruction across one surgery time&quot;,&quot;display_title&quot;:&quot;Lemma 6.24: Reconstruction across one surgery time&quot;,&quot;body&quot;:&quot;Let $({\\mathcal M},G)$ be a controlled generalized Ricci flow satisfying\nAssumptions (1)--(7) and carrying the Kleiner--Lott cutoff of\n\\ref{def:ricci-flow-with-cutoff} on the relevant finite interval.  Let $T$ be a\nsingular time, and let $t^-&lt;T$ be regular and sufficiently close to $T$.\nEvery component of $M_{t^-}$ is a finite connected sum of components of $M_T$\nand factors\nbelonging to\n\\[\n \\{S^3/\\Gamma,\\mathbb{RP}^3,E_+,E_-\\}.\n\\]\nHere a disappearing $\\mathbb{RP}^3\\#\\mathbb{RP}^3$ component contributes two\n$\\mathbb{RP}^3$ factors.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Reversing One Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:259,&quot;ref&quot;:&quot;MT:ch15:15.3&quot;}]},{&quot;id&quot;:&quot;backward-reconstruction-from-extinction&quot;,&quot;title&quot;:&quot;Backward Reconstruction from Extinction&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;3fa1d46bb843&quot;,&quot;label&quot;:&quot;thm:extinction-connected-sum-classification&quot;,&quot;title&quot;:&quot;Connected-sum classification from finite extinction&quot;,&quot;display_title&quot;:&quot;Theorem 6.25: Connected-sum classification from finite extinction&quot;,&quot;body&quot;:&quot;Let $({\\mathcal M},G)$ be a fixed controlled generalized Ricci flow satisfying\nAssumptions (1)--(7) and carrying the Kleiner--Lott cutoff of\n\\ref{def:ricci-flow-with-cutoff} on every finite restriction, with\nconnected closed initial slice $M_0=M$.  Assume that a regular time\n$T_{\\rm ext}&lt;\\infty$ has empty slice $M_{T_{\\rm ext}}=\\varnothing$ and that\nthe flow remains empty afterwards, and assume explicitly that only finitely\nmany singular times occur in every bounded time interval.  Then there are finite families of\nspherical space forms $P_1,\\ldots,P_r$ and sphere bundles\n$F_1,\\ldots,F_s\\in\\{E_+,E_-\\}$ such that\n\\[\n M\\cong P_1\\#\\cdots\\#P_r\\#F_1\\#\\cdots\\#F_s.\n\\]\nHere $r+s\\ge1$.\nIf $M$ is orientable, every $F_j$ is $E_+$.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Backward Reconstruction from Extinction&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:260,&quot;ref&quot;:&quot;MT:ch15:15.4,MT:intro:0.1&quot;},{&quot;id&quot;:&quot;fe7d11cd444e&quot;,&quot;label&quot;:&quot;def:thurston-geometrized&quot;,&quot;title&quot;:&quot;Thurston-geometrized closed three-manifold&quot;,&quot;display_title&quot;:&quot;Definition 6.26: Thurston-geometrized closed three-manifold&quot;,&quot;body&quot;:&quot;Let $M$ be a connected closed orientable smooth $3$-manifold.  We call $M$\n\\emph{geometrized} if there are closed connected smooth $3$-manifolds\n$P_1,\\ldots,P_n$, each orientable, and a diffeomorphism\n$M\\cong P_1\\#\\cdots\\#P_n$ such that, for every $i$, there is a compact\ncodimension-zero submanifold $G_i\\subset P_i$ (possibly empty or all of\n$P_i$) whose nonempty boundary components are tori and for which\n\\begin{enumerate}\n\\item $G_i$ is a graph manifold: it is obtained from finitely many products\n      $S^1\\times P_{ij}$, with $P_{ij}$ a pair of pants, and finitely many\n      products $S^1\\times D^2_{ij}$ by pairing an even number of boundary\n      tori by diffeomorphisms and gluing, with the gluing chosen so that\n      $G_i$ is orientable;\n\\item the interior of $P_i\\setminus G_i$ admits a complete metric of\n      constant negative sectional curvature and finite volume; and\n\\item for every boundary torus $T\\subset\\partial G_i$, the inclusion\n      $\\pi_1(T)\\to\\pi_1(P_i)$ is injective.\n\\end{enumerate}\nThe cases $G_i=\\varnothing$ and $G_i=P_i$ are allowed (the latter is the\nclosed graph-manifold case).  Equivalently, this is the finite-volume\nlocally-homogeneous formulation obtained by cutting along the displayed\nincompressible tori.  This definition is only for connected, closed,\norientable manifolds; no orientation-double-cover convention is folded into\nthe term ``geometrized.&#x27;&#x27;&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Backward Reconstruction from Extinction&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:261,&quot;ref&quot;:&quot;KL:app:geom,MT:ch15:15.4&quot;},{&quot;id&quot;:&quot;c7e76a82673e&quot;,&quot;label&quot;:&quot;def:morgan-tian-geometrized&quot;,&quot;title&quot;:&quot;Morgan--Tian geometrized closed three-manifold&quot;,&quot;display_title&quot;:&quot;Definition 6.27: Morgan--Tian geometrized closed three-manifold&quot;,&quot;body&quot;:&quot;A compact closed smooth $3$-manifold (possibly disconnected) is\n\\emph{MT-geometrized} if each connected component is a finite connected sum\nof closed prime $3$-manifolds carrying one of Thurston&#x27;s homogeneous\ngeometries.  In this predicate the two $S^2$-bundles $E_+$ and $E_-$ over\n$S^1$ are admitted as the homogeneous $S^2\\times\\mathbb R$ factors, and a\nconstant-positive-curvature space form is admitted as a spherical factor.\nThis is the source-level predicate used in Morgan--Tian Corollary~15.4; the\nmore detailed orientable graph/hyperbolic package is the separate\nKleiner--Lott definition below.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Backward Reconstruction from Extinction&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:262,&quot;ref&quot;:&quot;MT:ch15:15.4&quot;},{&quot;id&quot;:&quot;b263544ced78&quot;,&quot;label&quot;:&quot;thm:morgan-tian-corollary-15-4-general&quot;,&quot;title&quot;:&quot;Morgan--Tian Corollary 15.4, general geometrization clause&quot;,&quot;display_title&quot;:&quot;Theorem 6.28: Morgan--Tian Corollary 15.4, general geometrization clause&quot;,&quot;body&quot;:&quot;Let $({\\mathcal M},G)$ be a controlled generalized Ricci flow satisfying\nAssumptions (1)--(7) and carrying the Kleiner--Lott cutoff of\n\\ref{def:ricci-flow-with-cutoff} on $[0,T]$, with initial slice $(M,g(0))$.\nIf a time slice $M_T$ is\nMT-geometrized, then every earlier slice $M_t$, $0\\le t\\le T$, is\nMT-geometrized.  No orientability or connectedness hypothesis is imposed on\nthe individual slices beyond the assumptions of the generalized flow.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Backward Reconstruction from Extinction&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:263,&quot;ref&quot;:&quot;MT:ch15:15.4&quot;},{&quot;id&quot;:&quot;6cea49e084d1&quot;,&quot;label&quot;:&quot;thm:morgan-tian-corollary-15-4-empty-general&quot;,&quot;title&quot;:&quot;Morgan--Tian Corollary 15.4, general empty-slice clause&quot;,&quot;display_title&quot;:&quot;Theorem 6.29: Morgan--Tian Corollary 15.4, general empty-slice clause&quot;,&quot;body&quot;:&quot;Let $({\\mathcal M},G)$ satisfy Assumptions (1)--(7) and carry the\nKleiner--Lott cutoff of \\ref{def:ricci-flow-with-cutoff} on $[0,T]$, let the initial slice\n$M_0=M$ be connected and closed, and suppose $M_T=\\varnothing$ for some\n$T&gt;0$.  If only finitely many singular times occur in $[0,T]$, then\n\\[\n M\\cong P_1\\#\\cdots\\#P_r\\#F_1\\#\\cdots\\#F_s,\n \\qquad F_j\\in\\{E_+,E_-\\},\n\\]\nfor finitely many closed constant-positive-curvature space forms $P_i$, with\n$r+s\\ge1$.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Backward Reconstruction from Extinction&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:264,&quot;ref&quot;:&quot;MT:ch15:15.4&quot;},{&quot;id&quot;:&quot;564a66dfd8e8&quot;,&quot;label&quot;:&quot;lem:positive-space-form-geometrized&quot;,&quot;title&quot;:&quot;Positive space forms are geometrized&quot;,&quot;display_title&quot;:&quot;Lemma 6.30: Positive space forms are geometrized&quot;,&quot;body&quot;:&quot;Every closed connected orientable three-manifold carrying a metric of constant\npositive sectional curvature is geometrized in the sense of\n\\ref{def:thurston-geometrized}.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Backward Reconstruction from Extinction&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:265,&quot;ref&quot;:&quot;MT:ch15:15.4&quot;},{&quot;id&quot;:&quot;4a2c4d0e2044&quot;,&quot;label&quot;:&quot;lem:orientable-sphere-bundle-geometrized&quot;,&quot;title&quot;:&quot;The orientable sphere bundle is geometrized&quot;,&quot;display_title&quot;:&quot;Lemma 6.31: The orientable sphere bundle is geometrized&quot;,&quot;body&quot;:&quot;$E_+=S^2\\times S^1$ is geometrized in the sense of\n\\ref{def:thurston-geometrized}.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Backward Reconstruction from Extinction&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:266,&quot;ref&quot;:&quot;MT:ch15:15.4&quot;},{&quot;id&quot;:&quot;d569479001fb&quot;,&quot;label&quot;:&quot;lem:geometrization-closed-under-standard-factors&quot;,&quot;title&quot;:&quot;Orientable geometrization is closed under reverse-surgery factors&quot;,&quot;display_title&quot;:&quot;Lemma 6.32: Orientable geometrization is closed under reverse-surgery factors&quot;,&quot;body&quot;:&quot;Let $X$ be a connected, closed, orientable geometrized $3$-manifold.  If\n$Q$ is obtained from a connected-sum expression for $X$ by adjoining finitely\nmany orientable spherical space forms and copies of $E_+=S^2\\times S^1$ and\nperforming finitely many connected-sum operations, then $Q$ is connected,\nclosed, orientable, and geometrized.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Backward Reconstruction from Extinction&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:267,&quot;ref&quot;:&quot;KL:app:geom,MT:ch15:15.3,MT:ch15:15.4&quot;},{&quot;id&quot;:&quot;ccd7605040d6&quot;,&quot;label&quot;:&quot;lem:orientability-preserved-by-surgery&quot;,&quot;title&quot;:&quot;Orientability is preserved by Ricci-flow surgery&quot;,&quot;display_title&quot;:&quot;Lemma 6.33: Orientability is preserved by Ricci-flow surgery&quot;,&quot;body&quot;:&quot;If the initial slice of a generalized Ricci flow satisfying Assumptions\n(1)--(7) is connected, closed, and orientable, then every descendant slice\nbefore extinction is orientable.  In a reverse-surgery connected-sum\ndescription, only the orientable bundle $E_+$ can occur.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Backward Reconstruction from Extinction&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:268,&quot;ref&quot;:&quot;MT:ch15:15.3,MT:ch15:15.4&quot;},{&quot;id&quot;:&quot;928ee1addff3&quot;,&quot;label&quot;:&quot;thm:morgan-tian-corollary-15-4&quot;,&quot;title&quot;:&quot;Orientable specialization of Morgan--Tian Corollary 15.4&quot;,&quot;display_title&quot;:&quot;Theorem 6.34: Orientable specialization of Morgan--Tian Corollary 15.4&quot;,&quot;body&quot;:&quot;Let $({\\mathcal M},G)$ be a controlled generalized Ricci flow satisfying\nAssumptions (1)--(7) and carrying the Kleiner--Lott cutoff of\n\\ref{def:ricci-flow-with-cutoff} on $[0,T]$, with connected, closed,\norientable initial slice $M_0$.  Assume that\nthere are only finitely many singular times in $[0,T]$, that every connected\ncomponent of every slice in this interval is orientable, and that every\nconnected component of $M_T$ is geometrized in the sense of\n\\ref{def:thurston-geometrized}.  Then every connected component of every\nearlier slice $M_t$, $0\\le t\\le T$, is geometrized.  No empty-slice or\nfundamental-group conclusion is part of this clause.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Backward Reconstruction from Extinction&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:269,&quot;ref&quot;:&quot;MT:ch15:15.4&quot;},{&quot;id&quot;:&quot;4c7ae5881218&quot;,&quot;label&quot;:&quot;thm:morgan-tian-corollary-15-4-empty&quot;,&quot;title&quot;:&quot;Orientable specialization of the Corollary 15.4 empty-slice clause&quot;,&quot;display_title&quot;:&quot;Theorem 6.35: Orientable specialization of the Corollary 15.4 empty-slice clause&quot;,&quot;body&quot;:&quot;Let $({\\mathcal M},G)$ be a controlled generalized Ricci flow satisfying\nAssumptions (1)--(7) and carrying the Kleiner--Lott cutoff of\n\\ref{def:ricci-flow-with-cutoff} on $[0,T]$, with connected, closed,\norientable initial slice $M_0=M$.  Suppose\nthat $M_T=\\varnothing$ at a time $T&gt;0$ and that only finitely many singular\ntimes occur in $[0,T]$.  Then\n\\[\n M\\cong P_1\\#\\cdots\\#P_r\\#E_+^{\\# s}\n\\]\nfor finitely many closed constant-positive-curvature $3$-manifolds $P_i$ and\nsome $s\\ge0$ (with $r+s\\ge1$).&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Backward Reconstruction from Extinction&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:270,&quot;ref&quot;:&quot;MT:ch15:15.4&quot;}]},{&quot;id&quot;:&quot;connected-sums-and-fundamental-groups&quot;,&quot;title&quot;:&quot;Connected Sums and Fundamental Groups&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;d78b21365ab2&quot;,&quot;label&quot;:&quot;lem:normalized-initial-metric-exists&quot;,&quot;title&quot;:&quot;Existence of a normalized initial metric&quot;,&quot;display_title&quot;:&quot;Lemma 6.36: Existence of a normalized initial metric&quot;,&quot;body&quot;:&quot;Every closed smooth $3$-manifold admits a Riemannian metric which is normalized\nin the sense required by the all-time controlled-surgery theorem.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Connected Sums and Fundamental Groups&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:271,&quot;ref&quot;:&quot;MT:ch15:p:353&quot;},{&quot;id&quot;:&quot;da9c7ade7060&quot;,&quot;label&quot;:&quot;thm:free-product-connected-sum-classification&quot;,&quot;title&quot;:&quot;The free-product topology theorem&quot;,&quot;display_title&quot;:&quot;Theorem 6.37: The free-product topology theorem&quot;,&quot;body&quot;:&quot;Let $M$ be a closed connected smooth $3$-manifold whose fundamental group is\na free product of finite groups and infinite cyclic groups.  Then $M$ is a\nfinite connected sum of spherical space forms and copies of $E_+$ and $E_-$.\nIf $M$ is orientable, only $E_+$ occurs.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Connected Sums and Fundamental Groups&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:272,&quot;ref&quot;:&quot;MT:intro:0.1&quot;},{&quot;id&quot;:&quot;0783c5d92731&quot;,&quot;label&quot;:&quot;thm:connected-sum-fundamental-group&quot;,&quot;title&quot;:&quot;Fundamental group of a finite connected sum&quot;,&quot;display_title&quot;:&quot;Theorem 6.38: Fundamental group of a finite connected sum&quot;,&quot;body&quot;:&quot;For $n\\ge1$ and connected closed smooth $3$-manifolds\n$M_1,\\ldots,M_n$, choices of basepoints and connecting paths give an\nisomorphism\n\\[\n \\pi_1(M_1\\#\\cdots\\#M_n)\n \\cong \\pi_1(M_1)*\\cdots*\\pi_1(M_n).\n\\]\nChanging those choices conjugates the factor inclusions, so the isomorphism\nis canonical only up to the corresponding inner automorphisms.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Connected Sums and Fundamental Groups&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:273,&quot;ref&quot;:&quot;MT:intro:0.1&quot;},{&quot;id&quot;:&quot;5ae781823571&quot;,&quot;label&quot;:&quot;lem:trivial-free-product-factors&quot;,&quot;title&quot;:&quot;A trivial free product has trivial factors&quot;,&quot;display_title&quot;:&quot;Lemma 6.39: A trivial free product has trivial factors&quot;,&quot;body&quot;:&quot;If a finite free product $G_1*\\cdots*G_n$ is the trivial group, then every\n$G_i$ is trivial.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Connected Sums and Fundamental Groups&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:274,&quot;ref&quot;:&quot;MT:intro:0.1&quot;},{&quot;id&quot;:&quot;4f6c36011bc6&quot;,&quot;label&quot;:&quot;lem:sphere-bundle-fundamental-group&quot;,&quot;title&quot;:&quot;Fundamental group of a sphere bundle over the circle&quot;,&quot;display_title&quot;:&quot;Lemma 6.40: Fundamental group of a sphere bundle over the circle&quot;,&quot;body&quot;:&quot;Both $E_+$ and $E_-$ have fundamental group isomorphic to $\\mathbb Z$.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Connected Sums and Fundamental Groups&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:275,&quot;ref&quot;:&quot;MT:intro:0.1&quot;},{&quot;id&quot;:&quot;716fb7663e1d&quot;,&quot;label&quot;:&quot;lem:simply-connected-spherical-space-form&quot;,&quot;title&quot;:&quot;A simply connected spherical space form&quot;,&quot;display_title&quot;:&quot;Lemma 6.41: A simply connected spherical space form&quot;,&quot;body&quot;:&quot;If a spherical space form $P$ is simply connected, then $P$ is diffeomorphic\nto $S^3$.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Connected Sums and Fundamental Groups&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:276,&quot;ref&quot;:&quot;MT:intro:0.1&quot;},{&quot;id&quot;:&quot;74d4b3842b0c&quot;,&quot;label&quot;:&quot;lem:three-sphere-connected-sum-identity&quot;,&quot;title&quot;:&quot;The three-sphere is the connected-sum identity&quot;,&quot;display_title&quot;:&quot;Lemma 6.42: The three-sphere is the connected-sum identity&quot;,&quot;body&quot;:&quot;For every connected closed smooth $3$-manifold $M$,\n$M\\#S^3\\cong M$.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Connected Sums and Fundamental Groups&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:277,&quot;ref&quot;:&quot;MT:ch15:15.3&quot;}]},{&quot;id&quot;:&quot;simple-connectivity&quot;,&quot;title&quot;:&quot;Simple Connectivity&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;fc31a601123a&quot;,&quot;label&quot;:&quot;thm:poincare-conjecture&quot;,&quot;title&quot;:&quot;Poincare conjecture&quot;,&quot;display_title&quot;:&quot;Theorem 6.43: Poincare conjecture&quot;,&quot;body&quot;:&quot;Every compact, connected, smooth $3$-manifold without boundary which is\nsimply connected in the sense of \\ref{def:simply-connected} is diffeomorphic\nto $S^3$.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Simple Connectivity&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:278,&quot;ref&quot;:&quot;MT:intro:0.2(a)&quot;}]}]}],&quot;nodes&quot;:[{&quot;id&quot;:&quot;0071c4676014&quot;,&quot;label&quot;:&quot;thm:eventual-pi2-vanishing&quot;,&quot;title&quot;:&quot;Eventual vanishing of _2&quot;,&quot;display_title&quot;:&quot;Theorem 5.17: Eventual vanishing of _2&quot;,&quot;body&quot;:&quot;For an all-time controlled surgery flow there is $T_1&lt;\\infty$ such that every\ncomponent of every time slice $M_T$, $T\\ge T_1$, has trivial $\\pi_2$.  Any\nsuch component with infinite fundamental group has contractible universal\ncover.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Eventual Vanishing of _2&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:195,&quot;ref&quot;:&quot;MT:ch18:18.9&quot;},{&quot;id&quot;:&quot;018d5ec3ba13&quot;,&quot;label&quot;:&quot;thm:strong-curvature-tensor-maximum-principle&quot;,&quot;title&quot;:&quot;Strong maximum principle for curvature tensors&quot;,&quot;display_title&quot;:&quot;Theorem 2.35: Strong maximum principle for curvature tensors&quot;,&quot;body&quot;:&quot;Let $\\overline U$ be a compact, connected, smooth codimension-zero submanifold\nof a Riemannian manifold $M$, possibly with boundary, and let $\\mathcal V$ be\na tensor bundle over $M$.  Let $\\mathcal T(x,t)$ be a smooth family of\nsections on $\\overline U\\times[0,T]$ satisfying\n\\[\n \\partial_t\\mathcal T=\\Delta\\mathcal T+\\Psi(\\mathcal T),\n\\]\nwhere $\\Psi$ is a smooth fiberwise vector field.  Suppose there is a\ncontinuous, locally Lipschitz, fiberwise \\emph{concave} function\n$s\\colon\\mathcal V\\to\\mathbb R$ (equivalently, all of its superlevel sets are\nconvex) which is invariant under parallel translation and for which, whenever\n$s_x(A)\\ge0$, the vector $\\Psi(A)$ lies in the tangent cone at $A$ to the\nconvex superlevel set $\\{B\\in V_x:s_x(B)\\ge s_x(A)\\}$.  If\n$s(\\mathcal T(x,0))\\ge0$ on $\\overline U$ and\n$s(\\mathcal T(x,t))\\ge0$ on $\\partial\\overline U\\times[0,T]$, and if\n$s(\\mathcal T(x_0,0))&gt;0$ for some $x_0\\in\\operatorname{int}\\overline U$,\nthen $s(\\mathcal T(x,t))&gt;0$ on\n$\\operatorname{int}\\overline U\\times(0,T]$.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Local Curvature and Neck Estimates&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:77,&quot;ref&quot;:&quot;MT:ch4:4.17,MT:ch4:4.18&quot;},{&quot;id&quot;:&quot;01b32c767069&quot;,&quot;label&quot;:&quot;thm:generalized-flow-noncollapsing-interface&quot;,&quot;title&quot;:&quot;Imported interface: generalized-flow noncollapsing&quot;,&quot;display_title&quot;:&quot;Theorem 2.34: Imported interface: generalized-flow noncollapsing&quot;,&quot;body&quot;:&quot;Fix $\\bar\\tau_0,l_0,V&gt;0$.  There is\n$\\kappa=\\kappa(\\bar\\tau_0,V,l_0)&gt;0$ with the following property.  Let\n$(\\mathcal M,G)$ be a generalized three-dimensional Ricci flow, let\n$x\\in M_T$, and suppose that $0&lt;\\tau_0\\le\\bar\\tau_0$ and\n$0&lt;r\\le\\sqrt{\\tau_0}$.  Assume:\n\\begin{enumerate}\n\\item $B_{g(T)}(x,r)$ has compact closure in $M_T$;\n\\item the ball admits a time-vector-field-compatible embedding over\n      $[T-r^2,T]$;\n\\item $|\\operatorname{Rm}|\\le r^{-2}$ on that parabolic neighborhood;\n\\item there is an open set\n      $\\widetilde W\\subset\\widetilde{\\mathcal U}_x(\\tau_0)\\subset T_xM_T$\n      in the $\\mathcal L$-injectivity domain, together with an open smooth\n      spacetime set $\\mathcal O$ containing $x$ and every\n      $W(\\tau)=\\mathcal L\\exp_x^\\tau(\\widetilde W)$ for\n      $0&lt;\\tau\\le\\tau_0$, such that every minimizing $\\mathcal L$-geodesic\n      from $x$ to $W(\\tau)$ stays in $\\mathcal O\\cup\\{x\\}$ and every\n      associated geodesic on $[0,\\tau_0]$ has reduced length at most $l_0$;\n\\item for\n      $W(\\tau)=\\mathcal L\\exp_x^\\tau(\\widetilde W)$, one has\n      $\\operatorname{Vol}_{g(T-\\tau_0)}W(\\tau_0)\\ge V$.\n\\end{enumerate}\nThen\n\\[\n \\operatorname{Vol}_{g(T)}B_{g(T)}(x,r)\\ge\\kappa r^3.\n\\]&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Reduced Geometry&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:76,&quot;ref&quot;:&quot;MT:ch8:8.1&quot;},{&quot;id&quot;:&quot;01ca8edf0b34&quot;,&quot;label&quot;:&quot;lem:proper-capped-region-classification&quot;,&quot;title&quot;:&quot;Capped proper regions have one spherical frontier&quot;,&quot;display_title&quot;:&quot;Lemma 6.20: Capped proper regions have one spherical frontier&quot;,&quot;body&quot;:&quot;Let $D$ be a proper connected component of a disappearing region in a compact\nboundaryless $3$-manifold.  Assume that every point of $D$ is an\n$\\epsilon$-neck center or lies in a $(C,\\epsilon)$-cap core, that\n$\\overline D$ is a compact smooth codimension-zero submanifold with nonempty\nfinite spherical frontier, and every frontier component is a central neck\nsphere.  If $D$ meets a cap core, then\n\\[\n \\overline D\\cong B^3\n \\quad\\text{or}\\quad\n \\overline D\\cong\\mathbb{RP}^3\\setminus\\operatorname{int}(B^3),\n \\qquad\n \\operatorname{Fr}D\\cong S^2.\n\\]&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Reversing One Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:255,&quot;ref&quot;:&quot;MT:ch15:15.3,MT:app:A.21,MT:app:A.22,MT:app:A.23,MT:app:A.24&quot;},{&quot;id&quot;:&quot;01dd4ae8f2cb&quot;,&quot;label&quot;:&quot;lem:relative-fiber-boundary-pairing&quot;,&quot;title&quot;:&quot;Boundary pairing in a fibered neck region&quot;,&quot;display_title&quot;:&quot;Lemma 6.14: Boundary pairing in a fibered neck region&quot;,&quot;body&quot;:&quot;Let $E$ be either an open product $S^2\\times J$ with $J$ an open interval,\nor a closed $S^2$-bundle over $S^1$ presented as\n\n\\[\n q:S^2\\times\\mathbb R\\longrightarrow E,\n \\qquad q(y,s+L)=q(\\phi(y),s)\n\\]\n\nfor some $L&gt;0$ and diffeomorphism $\\phi:S^2\\to S^2$.  Let $D\\subset E$ be\nconnected and open, with compact smooth codimension-zero closure satisfying\n\\(\\partial\\overline D=\\operatorname{Fr}_E(D)\\ne\\varnothing\\), and suppose\nthat this frontier is a union of complete fibers.  Then\n\n\\[\n \\overline D\\cong S^2\\times[0,1],\n \\qquad \\operatorname{Fr}_E(D)=S_0\\sqcup S_1.\n\\]&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Reversing One Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:249,&quot;ref&quot;:&quot;MT:app:A.20,MT:app:A.21,MT:app:A.24&quot;},{&quot;id&quot;:&quot;0282ca1d02a5&quot;,&quot;label&quot;:&quot;lem:maximal-overlap-incidence-no-branching&quot;,&quot;title&quot;:&quot;Maximal-overlap incidence has no branching&quot;,&quot;display_title&quot;:&quot;Lemma 6.17: Maximal-overlap incidence has no branching&quot;,&quot;body&quot;:&quot;Let $Y$ be a connected union of sufficiently small canonical necks and cap\ncores.  Form its incidence graph from \\emph{maximal} connected product collars:\ntwo overlapping neck pieces are one edge whenever their middle overlap contains\na common cross-sectional sphere isotopic in both necks, and cap cores are\nvertices.  Assume the finite-chain frontier extensions and the cap frontier\nlocalization clauses of Appendices~A.17 and A.21 hold, and that an infinite\nchain has no frontier.  Then every neck vertex has degree at most two, every\ncap vertex is terminal, and the connected incidence graph is a (possibly\ndegenerate) finite interval, a half-line, a line, or a circle.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Reversing One Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:252,&quot;ref&quot;:&quot;MT:app:A.17,MT:app:A.21,MT:app:A.23,MT:app:A.25&quot;},{&quot;id&quot;:&quot;051e2016bc24&quot;,&quot;label&quot;:&quot;thm:surgery-pi3-class-transport&quot;,&quot;title&quot;:&quot;Transport of a nonzero third-homotopy class&quot;,&quot;display_title&quot;:&quot;Theorem 5.49: Transport of a nonzero third-homotopy class&quot;,&quot;body&quot;:&quot;Let $\\mathcal X$ be a component path on $[t_0,t_1]$ with only finitely many\nsurgery times, with\n$\\pi_2(\\mathcal X(t_0))=0$ and\n$\\pi_3(\\mathcal X(t_0))\\cong\\mathbb Z$, and let\n$0\\ne\\xi(t_0)\\in\\pi_3(\\mathcal X(t_0))$.  Choose the coherent marked\npoints of \\ref{lem:coherent-marked-component-path}.  Then $\\pi_2(\\mathcal\nX(t))=0$\nfor every $t$, and there is a compatible family of nonzero classes\n$\\xi(t)\\in\\pi_3(\\mathcal X(t))$.  At a surgery time $T$, the maps\n$F_t\\colon\\mathcal X(t)\\to\\mathcal X(T)$ of\n\\ref{thm:trivial-surgery-component-map}, for $t&lt;T$ sufficiently close to $T$,\nsatisfy\n\\[\n (F_t)_*[\\xi(t)]=[\\xi(T)]\n\\]\nin the $\\pi_1$-orbit sets; after the coherent marked-point choices this\nequality may be read as an equality of based representatives.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;_3-Width Evolution Through Surgery&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:227,&quot;ref&quot;:&quot;MT:ch18:18.18,MT:ch15:15.12&quot;},{&quot;id&quot;:&quot;05758bd0d841&quot;,&quot;label&quot;:&quot;def:two-sphere-width&quot;,&quot;title&quot;:&quot;Least nontrivial two-sphere area&quot;,&quot;display_title&quot;:&quot;Definition 5.2: Least nontrivial two-sphere area&quot;,&quot;body&quot;:&quot;Let $(X,g)$ be compact with $\\pi_2(X)\\ne0$.  Its \\emph{two-sphere width} is\n\\[\n W_2(X,g)=\\inf\\{\\operatorname{Area}_g(f):f\\colon S^2\\to X\\text{ is $C^1$ and not\n null-homotopic}\\}.\n\\]\nFor a component path $\\mathcal X$ in a Ricci flow with surgery, write\n\\[\n W_2(t)=W_2(\\mathcal X(t),g(t))\n\\]\nwhenever\n$\\pi_2(\\mathcal X(t))\\ne0$.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Two-Sphere Width Control&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:180,&quot;ref&quot;:&quot;MT:ch18:18.10&quot;},{&quot;id&quot;:&quot;05c1aec75380&quot;,&quot;label&quot;:&quot;lem:short-backward-curvature-control&quot;,&quot;title&quot;:&quot;Short backward curvature control&quot;,&quot;display_title&quot;:&quot;Lemma 3.26: Short backward curvature control&quot;,&quot;body&quot;:&quot;Consider the diagonal first-failure sequence with $r_a\\downarrow0$,\n$\\delta_a\\le\\delta(r_a)$ and $\\delta_a\\to0$, where $\\delta(r_a)$ is the fixed\nselector value from \\ref{def:stagewise-delta-selector}, with the strong\n$(C,\\epsilon)$-canonical-neighborhood assumption on every pre-failure slice.\nWrite $\\widehat x_a$ for the unrescaled first-failure point and\n$Q_a=R_{G_a}(\\widehat x_a)\\to\\infty$, and assume the diagonal has been chosen\nwith a fixed $\\vartheta&lt;1$ satisfying\n$r_a^{-2}/Q_a\\le\\vartheta$.\nAssume the source KAPPA-limit predicate of\n\\ref{lem:pre-failure-kappa-limit} on the negative-time truncations.  For\nevery $A&lt;\\infty$ there are $D(A)&lt;\\infty$ and $\\sigma(A)&gt;0$ such that,\nwriting $x_a$ for the point corresponding to $\\widehat x_a$ after rescaling by\n$Q_a$, every sufficiently advanced rescaled flow has scalar curvature at most\n$D(A)$ along each\nbackward flow line starting in $B(x_a,0,A)$ for as long as that line exists\nin $[-\\sigma(A),0]$.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;First-Failure Extension&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:126,&quot;ref&quot;:&quot;MT:ch17:17.9&quot;},{&quot;id&quot;:&quot;0714466fa4ba&quot;,&quot;label&quot;:&quot;thm:local-ricci-flow-derivative-estimates&quot;,&quot;title&quot;:&quot;Local Ricci-flow derivative estimates&quot;,&quot;display_title&quot;:&quot;Theorem 2.23: Local Ricci-flow derivative estimates&quot;,&quot;body&quot;:&quot;For every $m\\ge0$ there is $C_m&lt;\\infty$ with the following property.  If a\nRicci flow has a relatively compact parabolic neighborhood\n$P(x,t,r,-r^2)$ on which $|\\operatorname{Rm}|\\le r^{-2}$, then\n\\[\n |\\nabla^m\\operatorname{Rm}|\n \\le C_m r^{-m-2}\n\\]\non $P(x,t,r/2,-r^2/2)$.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Reduced Geometry&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:65,&quot;ref&quot;:&quot;MT:ch3:3.28,MT:ch3:3.33&quot;},{&quot;id&quot;:&quot;074ddf37c4ae&quot;,&quot;label&quot;:&quot;lem:uniform-backward-lifetime&quot;,&quot;title&quot;:&quot;Uniform backward lifetime&quot;,&quot;display_title&quot;:&quot;Lemma 3.29: Uniform backward lifetime&quot;,&quot;body&quot;:&quot;Suppose the first alternative of\n\\ref{lem:backward-parabolic-neighborhood-dichotomy} holds and the basepoints\nremain first-failure points.  The backward lifetimes $s(A)$ may then be\nchosen bounded below by one number $s_*&gt;0$ independent of $A$.  Extending\nmaximally, either the compatible neighborhoods exist for every backward\ntime, or a flow line starting in one fixed-radius zero-time based ball\nreaches a surgery cap at the finite maximal backward time with curvature\nbounded in the original first-failure normalization.  In the infinite-\nextension alternative there are, in addition, numbers $\\eta_*&gt;0$ and\n$K_*&lt;\\infty$, independent of the sequence index, such that\n$P(x_a,0,\\eta_*,-\\eta_*^2)$ is compatible and unscathed and\n$|\\operatorname{Rm}|\\le K_*$ on it.  The radius may be decreased so that\n$\\eta_*\\le K_*^{-1/2}$.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;First-Failure Extension&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:129,&quot;ref&quot;:&quot;MT:ch17:17.11&quot;},{&quot;id&quot;:&quot;0783c5d92731&quot;,&quot;label&quot;:&quot;thm:connected-sum-fundamental-group&quot;,&quot;title&quot;:&quot;Fundamental group of a finite connected sum&quot;,&quot;display_title&quot;:&quot;Theorem 6.38: Fundamental group of a finite connected sum&quot;,&quot;body&quot;:&quot;For $n\\ge1$ and connected closed smooth $3$-manifolds\n$M_1,\\ldots,M_n$, choices of basepoints and connecting paths give an\nisomorphism\n\\[\n \\pi_1(M_1\\#\\cdots\\#M_n)\n \\cong \\pi_1(M_1)*\\cdots*\\pi_1(M_n).\n\\]\nChanging those choices conjugates the factor inclusions, so the isomorphism\nis canonical only up to the corresponding inner automorphisms.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Connected Sums and Fundamental Groups&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:273,&quot;ref&quot;:&quot;MT:intro:0.1&quot;},{&quot;id&quot;:&quot;081e62843e0c&quot;,&quot;label&quot;:&quot;def:controlled-ricci-flow-with-surgery&quot;,&quot;title&quot;:&quot;Ricci flow with controlled surgery data&quot;,&quot;display_title&quot;:&quot;Definition 2.20: Ricci flow with controlled surgery data&quot;,&quot;body&quot;:&quot;For the fixed $C$, $\\epsilon$, and control functions, a\n\\emph{controlled Ricci flow with surgery} is a three-dimensional Ricci flow\nwith surgery satisfying Assumptions~(1)--(7) of Morgan--Tian and using the\nprescribed cutting data.  Explicitly:\n\\begin{enumerate}\n\\item Every slice is compact and contains no embedded $\\mathbb{RP}^2$ with\n      trivial normal bundle.\n\\item Singular times form a discrete subset of the time interval.\n\\item Time zero is initial, and every component of $(M_0,g(0))$ is\n      normalized: $|\\operatorname{Rm}|\\le1$ and every unit ball has at least\n      half the Euclidean unit-ball volume.\n\\item At a singular time $t$, the exposed region $E_t$ is a finite disjoint\n      union of smoothly embedded closed three-balls.  Its complement\n      $C_t=M_t\\setminus\\operatorname{int}E_t$ is the maximal continuing\n      region: it is the maximal subset for which the time vector field gives\n      an embedding $C_t\\times(t-\\eta,t]\\to\\mathcal M$ for some $\\eta&gt;0$.\n      Thus\n      $M_t=C_t\\cup_{\\Sigma_t}E_t$ with\n      $\\Sigma_t=\\partial C_t=\\partial E_t$ a finite union of two-spheres.\n      For every sufficiently close regular $t^-&lt;t$, backward flow maps $C_t$\n      diffeomorphically onto a compact codimension-zero submanifold\n      $C_{t^-}\\subset M_{t^-}$ with boundary the backward image of\n      $\\Sigma_t$; the disappearing region is\n      $D_{t^-}=M_{t^-}\\setminus C_{t^-}$.\n\\item Every component of $\\Sigma_t$ is the central sphere of a strong\n      $\\bar\\delta(t)$-neck at scalar curvature $h(t)^{-2}$ in the maximal\n      presurgery extension to $t$.\n\\item For every singular time $t$ and every sufficiently close regular\n      $t^-&lt;t$, every point of the disappearing region\n      $D_{t^-}=M_{t^-}\\setminus C_{t^-}$ has a strong\n      $(C,\\epsilon)$-canonical neighborhood.\n\\item Between consecutive singular times the ordinary Ricci flow is maximal.\n\\end{enumerate}\nPositive pinching, the strong canonical-neighborhood assumption with parameter\n$r(t)$, and $\\mathbf K$-noncollapsing are separate quantitative properties;\nthey are not part of this definition.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:62,&quot;ref&quot;:&quot;MT:ch15:15.2,MT:ch15:15.5,MT:ch15:15.8&quot;},{&quot;id&quot;:&quot;0a5091c62134&quot;,&quot;label&quot;:&quot;lem:two-sphere-width-forward-inequality&quot;,&quot;title&quot;:&quot;Forward inequality for the two-sphere width&quot;,&quot;display_title&quot;:&quot;Lemma 5.10: Forward inequality for the two-sphere width&quot;,&quot;body&quot;:&quot;Along a component path with nonzero $\\pi_2$, after all essential sphere\nsurgeries have ceased, $W_2$ is continuous at regular times, satisfies\n\\[\n D^+W_2(t)\\le-4\\pi-\\frac12R_{\\min}(t)W_2(t)\n\\]\nthere, and obeys the left lower-semicontinuity inequality of\n\\ref{lem:two-sphere-width-surgery-control} at every surgery time.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Two-Sphere Width Control&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:188,&quot;ref&quot;:&quot;MT:ch18:18.11&quot;},{&quot;id&quot;:&quot;0a74e0f36622&quot;,&quot;label&quot;:&quot;def:epsilon-horn-terminology&quot;,&quot;title&quot;:&quot;Embedded epsilon-horn and end convention&quot;,&quot;display_title&quot;:&quot;Definition 1.22: Embedded epsilon-horn and end convention&quot;,&quot;body&quot;:&quot;Let $(M^3,g)$ be a smooth boundaryless Riemannian three-manifold and let\n$I\\subset\\mathbb R$ be a nonempty open interval.  An \\emph{embedded\n$\\epsilon$-horn} is an open embedded submanifold\n$\\mathcal H\\cong S^2\\times I$ such that every point of $\\mathcal H$ lies in\nan $\\epsilon$-neck and, for one end of $I$, the scalar curvature remains\nbounded along that end while it tends to $+\\infty$ along the other end.  The\nchosen product coordinate is proper toward the divergent end; its compact\ncross-sectional spheres are the embedded frontier spheres used for truncation.\nReversing the product coordinate exchanges the two ends but does not change\nthe horn.  A capped $\\epsilon$-horn is obtained by adjoining one canonical cap\nalong the bounded end; a double $\\epsilon$-horn has divergent ends at both\nsides.  In a Ricci-flow terminal slice, the bounded-end condition means\nbounded curvature on the terminal domain, and the divergent-end condition means\n$\\bar R\\to+\\infty$ along the end.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:21,&quot;ref&quot;:&quot;KL:II:Definition2&quot;},{&quot;id&quot;:&quot;0a7c95bee89d&quot;,&quot;label&quot;:&quot;lem:short-loops-small-disk&quot;,&quot;title&quot;:&quot;Short loops bound small-area disks&quot;,&quot;display_title&quot;:&quot;Lemma 5.52: Short loops bound small-area disks&quot;,&quot;body&quot;:&quot;Let $(X,g)$ be compact.  For every $\\eta&gt;0$ there is\n$0&lt;\\zeta&lt;\\eta/2$ such that every $C^1$ loop of length less than $\\zeta$\nbounds a Lipschitz disk of area less than $\\eta$.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;_3-Width Evolution Through Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:230,&quot;ref&quot;:&quot;MT:ch18:18.28&quot;},{&quot;id&quot;:&quot;0aaa5cc6778f&quot;,&quot;label&quot;:&quot;lem:annular-approximation-comparison&quot;,&quot;title&quot;:&quot;Imported annular approximation and variation interface&quot;,&quot;display_title&quot;:&quot;Lemma 5.42: Imported annular approximation and variation interface&quot;,&quot;body&quot;:&quot;For a smooth pair of degree-one ramp flows in dimension at least three, the\npair can be approximated in $C^2$ by disjoint real-analytic pairs in the same\nfree homotopy class.  The two boundary pairs cobound thin annuli whose areas\ntend to zero, and the corresponding annular infima and forward difference\nquotients converge in both directions.  This is the source&#x27;s third-curve and\nanalytic-regularization interface.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Controlled Loop-Family Deformation&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:220,&quot;ref&quot;:&quot;MT:ch19:19.15&quot;},{&quot;id&quot;:&quot;0b063eab0b67&quot;,&quot;label&quot;:&quot;prop:kappa-solution-curvature-trichotomy&quot;,&quot;title&quot;:&quot;Curvature trichotomy for kappa-solutions&quot;,&quot;display_title&quot;:&quot;Proposition 3.8: Curvature trichotomy for kappa-solutions&quot;,&quot;body&quot;:&quot;Every three-dimensional $\\kappa$-solution is exactly one of the following\npairwise disjoint alternatives:\n\\begin{enumerate}\n\\item its curvature operator is positive definite (equivalently, every\n      sectional curvature is positive) on every time-slice;\n\\item after a constant parabolic scaling and time translation, it is the\n      shrinking round product $S^2\\times\\mathbb R$;\n\\item after such a normalization, it is the shrinking round flow on the\n      total space of a real line bundle over $\\mathbb{RP}^2$, whose twofold\n      cover is $S^2\\times\\mathbb R$.  This includes the trivial product\n      $\\mathbb{RP}^2\\times\\mathbb R$ and the twisted line bundle\n      $\\mathbb{RP}^2\\widetilde\\times\\mathbb R$.\n\\end{enumerate}&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solution Geometry and Stability&quot;,&quot;kind&quot;:&quot;proposition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:108,&quot;ref&quot;:&quot;MT:ch9:9.83&quot;},{&quot;id&quot;:&quot;0b397631172e&quot;,&quot;label&quot;:&quot;prop:stagewise-reduced-exponential-family&quot;,&quot;title&quot;:&quot;Morgan--Tian stagewise reduced-exponential family&quot;,&quot;display_title&quot;:&quot;Proposition 2.50: Morgan--Tian stagewise reduced-exponential family&quot;,&quot;body&quot;:&quot;Fix $i\\ge1$ and the finite control data of\n\\ref{def:controlled-surgery-parameters}.  Let $T\\in[T_i,T_{i+1})$ and let\n$(x,T)\\in\\mathcal M_T^-$ be a smooth presurgery point in a component which is\nnot compact and positive sectional curvature.  Assume the restriction before\n$T_i$ has the stage\n$\\kappa_i$-noncollapsing bound, the whole flow satisfies Assumptions (1)--(7),\ncurvature pinching, and the strong $(C,\\epsilon)$-canonical-neighborhood\nassumption with parameter $r_{i+1}$, and\n\\[\n \\bar\\delta(t)\\le\\mathfrak d_i(r_{i+1})\n \\qquad(T_{i-1}\\le t&lt;T_{i+1}).\n\\]\nSuppose that the fixed stagewise selector has supplied a value\n$0&lt;\\mathfrak d_i(r_{i+1})&lt;1/2$ and that, for some\n$\\rho\\in[r_{i+1},\\epsilon]$ with $T\\ge\\rho^2$, the compatible backward\nparabolic neighborhood\n$P(x,\\rho,T,-\\rho^2)$ exists and\n$|\\operatorname{Rm}|\\le\\rho^{-2}$ there.  Then there are a time\n$\\tau_*&gt;0$, an open smooth domain $U\\subset\\mathbf t^{-1}[T_{i-1},T)$,\nconstants $l_0&lt;\\infty$, $r&#x27;_i&gt;0$, $V_i=\\kappa_i(r&#x27;_i)^3&gt;0$, and an open set\n$\\widetilde W\\subset\\widetilde{\\mathcal U}_x(\\tau_*)$ in the reduced-\nexponential injectivity domain such that:\n\\begin{enumerate}\n\\item $U_t$ is nonempty for every $t\\in[T_{i-1},T)$, every point of $U$\n      is joined to $(x,T)$ by a minimizing smooth $\\mathcal L$-geodesic,\n      and the slice minimum is at most $3\\sqrt{T-t}$;\n\\item the set of slice minimizers is compact over every compact subinterval\n      of $[T_{i-1},T)$;\n\\item there are $t&#x27;&#x27;=T-\\tau_*$ and $y\\in U_{t&#x27;&#x27;}$ with\n      $R(y)&lt;r_i^{-2}$ and a compatible parabolic ball\n      $P(y,t&#x27;&#x27;,r&#x27;_i,-(r&#x27;_i)^2)$ on which\n      $|\\operatorname{Rm}|\\le(r&#x27;_i)^{-2}$ and\n      $\\operatorname{Vol}_{g(t&#x27;&#x27;)}B(y,t&#x27;&#x27;,r&#x27;_i)\\ge V_i$;\n\\item the terminal ball $B_{g(T)}(x,\\rho)$ has compact closure, embeds\n      compatibly and unscathed over $[T-\\rho^2,T]$, and has\n      $|\\operatorname{Rm}|\\le\\rho^{-2}$ there;\n\\item every reduced geodesic issued from $\\widetilde W$ has reduced length at\n      most $l_0$ on $[0,\\tau_*]$, and\n      $\\operatorname{Vol}_{g(T-\\tau_*)}\n      \\mathcal L\\exp_x^{\\tau_*}(\\widetilde W)\\ge V_i$.\n\\end{enumerate}\nHere $r&#x27;_i$ and $l_0$ depend only on the fixed stage data (and not on $x$ or\n$T$).&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;kind&quot;:&quot;proposition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:92,&quot;ref&quot;:&quot;MT:ch16:16.1,MT:ch16:16.4,MT:ch16:16.15,MT:ch16:16.21,MT:ch16:16.26&quot;},{&quot;id&quot;:&quot;0b42ab3768f4&quot;,&quot;label&quot;:&quot;thm:all-time-controlled-surgery-flow&quot;,&quot;title&quot;:&quot;All-time controlled Ricci flow with surgery&quot;,&quot;display_title&quot;:&quot;Theorem 3.38: All-time controlled Ricci flow with surgery&quot;,&quot;body&quot;:&quot;There are positive nonincreasing sequences\n$\\mathbf K=(\\kappa_i)_{i\\ge0}$,\n$\\boldsymbol\\delta=(\\delta_i)_{i\\ge0}$, and\n$\\mathbf r=(r_i)_{i\\ge0}$ with the following property.  For every positive\nnonincreasing function $\\bar\\delta\\colon[0,\\infty)\\to(0,\\infty)$ which has\nno transition on $[0,T_0]$ and satisfies\n\\[\n\\bar\\delta(t)&lt;\\delta_{i+1}\\le\\delta_0^{\\rm cap}\n\\qquad\\text{at every transition }T_i&lt;t\\le T_{i+1},\n\\]\nevery normalized compact three-manifold containing no embedded\n$\\mathbb{RP}^2$ with trivial normal bundle is the initial slice of a controlled\nRicci flow with surgery on $[0,\\infty)$ using the Kleiner--Lott\n$(r,\\bar\\delta)$-cutoff of \\ref{def:ricci-flow-with-cutoff}.  For\n$i\\ge0$, $t\\in[T_i,T_{i+1})$, $x\\in M_t$, and\n$0&lt;\\rho\\le\\epsilon$, every parabolic ball satisfying the curvature hypothesis in\n\\ref{def:surgery-flow-noncollapsing} satisfies its source disjunction with\nconstant $\\kappa_{i+1}$: either its volume is at least\n$\\kappa_{i+1}\\rho^3$, or $x$ lies in a component with positive sectional\ncurvature.  Any later use requiring a volume bound is restricted to the first\nbranch (or supplies a separate compact positive-component estimate).\nThe flow satisfies the strong $(C,\\epsilon)$-canonical-neighborhood assumption\nwith parameter $r_{i+1}$, has curvature pinched toward positive, and uses\nsurgery control at most $\\delta_{i+1}$.  Its surgery times are finite on every\nbounded interval.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;All-Time Controlled Extension&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:138,&quot;ref&quot;:&quot;MT:ch15:15.9,MT:ch15:15.10&quot;},{&quot;id&quot;:&quot;0b60ec75858a&quot;,&quot;label&quot;:&quot;cor:sphere-family-polygonal-approximation&quot;,&quot;title&quot;:&quot;Polygonal approximation of sphere families&quot;,&quot;display_title&quot;:&quot;Theorem 4.19: Polygonal approximation of sphere families&quot;,&quot;body&quot;:&quot;Let $\\Gamma\\colon S^2\\to\\Lambda M$ be a continuous $C^1$-loop family whose\nmembers are null-homotopic.  For every $\\zeta&gt;0$ there is $N$ such that, for\n$n\\ge N$, the regular polygonal family\n$\\Gamma_n\\colon S^2\\to\\Lambda_n^{\\mathrm{pg}}M$ is continuous, every\n$\\Gamma_n(q)$ is null-homotopic, and, uniformly in $q\\in S^2$,\n\\[\n |L(\\Gamma_n(q))-L(\\Gamma(q))|&lt;\\zeta,\n \\qquad\n |A(\\Gamma_n(q))-A(\\Gamma(q))|&lt;\\zeta.\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Polygonal Ramp Approximation&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:157,&quot;ref&quot;:&quot;MT:ch19:19.21&quot;},{&quot;id&quot;:&quot;0c66e31f8cb6&quot;,&quot;label&quot;:&quot;thm:standard-solution-canonical-neighborhoods&quot;,&quot;title&quot;:&quot;Canonical neighborhoods in the standard solution&quot;,&quot;display_title&quot;:&quot;Theorem 3.18: Canonical neighborhoods in the standard solution&quot;,&quot;body&quot;:&quot;For every sufficiently small $\\epsilon&gt;0$ there is\n$C_{\\mathrm{std}}(\\epsilon)&lt;\\infty$ such that every point $(q,t)$ of the\nstandard solution has one of the following neighborhoods:\n\\begin{enumerate}\n\\item a $(C_{\\mathrm{std}},\\epsilon)$-cap whose core contains $q$;\n\\item an evolving $\\epsilon$-neck reaching time zero, with its initial slice\n      disjoint from the cap core;\n\\item an evolving $\\epsilon$-neck defined for normalized backward time\n      $1+\\epsilon$.\n\\end{enumerate}\nThe alternatives persist for flows converging smoothly to the standard\nsolution on the corresponding parabolic neighborhoods.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Canonical Neighborhood Models&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:118,&quot;ref&quot;:&quot;MT:ch12:12.28,MT:ch12:12.32,MT:ch12:12.36&quot;},{&quot;id&quot;:&quot;0d805aef8325&quot;,&quot;label&quot;:&quot;thm:strong-canonical-neighborhood-extension&quot;,&quot;title&quot;:&quot;Extension of strong canonical neighborhoods&quot;,&quot;display_title&quot;:&quot;Theorem 3.30: Extension of strong canonical neighborhoods&quot;,&quot;body&quot;:&quot;Fix finite stage-$i$ data with ordinary $\\kappa_i$-noncollapsing before\n$T_i$, the stage time-gap bounds, positive pinching, and the cutoff controls\nused in \\ref{thm:conditional-noncollapsing-extension}; importantly, do not\nassume its later-interval canonical-neighborhood conclusion.  Then there are\n$0&lt;r_{i+1}\\le r_i$ and\n$0&lt;\\delta_{i+1}\\le\\mathfrak d_i(r_{i+1})$ such that the following holds.  If a\ncontrolled Ricci flow with surgery on $[0,T)$,\n$T\\in(T_i,T_{i+1}]$, has $\\bar\\delta\\le\\delta_{i+1}$ on\n$[T_{i-1},T]$ and satisfies the stage-$i$ pinching, noncollapsing, and\ncanonical-neighborhood hypotheses before $T_i$, then it satisfies the strong\n$(C,\\epsilon)$-canonical-neighborhood assumption with parameter\n$r_{i+1}$ throughout $[0,T)$.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;First-Failure Extension&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:130,&quot;ref&quot;:&quot;MT:ch17:17.1&quot;},{&quot;id&quot;:&quot;0dabec6e7d74&quot;,&quot;label&quot;:&quot;lem:graph-flow-small-slope-comparison&quot;,&quot;title&quot;:&quot;Small-slope graph and curvature comparisons&quot;,&quot;display_title&quot;:&quot;Theorem 4.11: Small-slope graph and curvature comparisons&quot;,&quot;body&quot;:&quot;For sufficiently small $\\delta$, wherever $Y\\ne0$ the $h(t)$-angle between\n$Y$ and $Z$ is greater than $\\pi/4$, and\n\\begin{align*}\n &amp;k\\le|Y|\\le\\sqrt2k,\\\\\n &amp;|\\langle\\nabla_ZZ,Z\\rangle|&lt;(k+2\\delta)|Z|^3,\\\\\n &amp;|\\nabla_ZZ|&lt;2(|Y|+\\delta),\\\\\n &amp;|\\langle Y,Z\\rangle|\\le|Y|\\,|f_z|_{h&#x27;}(1+3\\delta).\n\\end{align*}&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Graph-Flow Coordinate Estimates&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:149,&quot;ref&quot;:&quot;MT:ch19:19.65&quot;},{&quot;id&quot;:&quot;0e28b2c2090b&quot;,&quot;label&quot;:&quot;lem:frontier-disappearing-component-classification&quot;,&quot;title&quot;:&quot;Relative-boundary classification for a proper disappearing region&quot;,&quot;display_title&quot;:&quot;Lemma 6.21: Relative-boundary classification for a proper disappearing region&quot;,&quot;body&quot;:&quot;Let $({\\mathcal M},G)$ satisfy Assumptions (1)--(7), let $T$ be a singular\ntime, and let $t^-&lt;T$ be regular and sufficiently close to $T$.  If $D$ is a\nproper connected component of $D_{t^-}$ in the sense of\n\\ref{def:proper-disappearing-component}, then the closure\n$\\overline D$ in $M_{t^-}$ is a compact codimension-zero smooth submanifold,\nand there are $m\\in\\{1,2\\}$ pairwise disjoint embedded spheres\n$S_1,\\ldots,S_m$ such that\n\\[\n \\partial_{M_{t^-}}\\overline D\n =\\operatorname{Fr}_{M_{t^-}}D=S_1\\sqcup\\cdots\\sqcup S_m,\n\\]\nwith each $S_j$ the backward image of a surgery central sphere.  The\nsource-exact neck/cap case analysis gives precisely one of\n\\[\n \\overline D\\cong S^2\\times[0,1],\\qquad\n \\overline D\\cong B^3,\\qquad\n \\overline D\\cong\\mathbb{RP}^3\\setminus\\operatorname{int}(B^3).\n\\]\nThe first alternative has two frontier spheres and each of the other two has\none.  No assertion is made here for a disappearing component with empty\nfrontier; that case is covered by\n\\ref{lem:whole-disappearing-component-classification}.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Reversing One Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:256,&quot;ref&quot;:&quot;MT:ch15:15.3,MT:app:A.20,MT:app:A.21,MT:app:A.24&quot;},{&quot;id&quot;:&quot;0eb0bf7ca335&quot;,&quot;label&quot;:&quot;lem:first-failure-limit-slice-bounded-curvature&quot;,&quot;title&quot;:&quot;Bounded curvature of a first-failure limit slice&quot;,&quot;display_title&quot;:&quot;Lemma 3.28: Bounded curvature of a first-failure limit slice&quot;,&quot;body&quot;:&quot;Let a time slice of a pointed first-failure limit be complete, nonflat, and\nnonnegatively curved.  Suppose it is ordinarily $\\kappa$-noncollapsed on all\nfinite scales and is the smooth limit of slices on which points above a fixed\nscalar-curvature threshold have uniform canonical neighborhoods.  Then its\ncurvature is bounded on the whole slice.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;First-Failure Extension&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:128,&quot;ref&quot;:&quot;MT:ch11:11.7&quot;},{&quot;id&quot;:&quot;0f6cc07f4dc7&quot;,&quot;label&quot;:&quot;lem:fiber-saturation-from-spherical-frontier&quot;,&quot;title&quot;:&quot;Fiber saturation from a spherical frontier&quot;,&quot;display_title&quot;:&quot;Lemma 6.12: Fiber saturation from a spherical frontier&quot;,&quot;body&quot;:&quot;Let $J\\subset\\mathbb R$ be a nonempty open interval and let\n$U\\subset S^2\\times J$ be connected and open.  Suppose that\n$\\operatorname{Fr}_{S^2\\times J}(U)$ is a union of complete fibers\n$S^2\\times\\{s\\}$.  Then there is an open interval $A\\subset J$ such that\n$U=S^2\\times A$.  If, in addition, $\\overline U$ is compact in\n$S^2\\times J$ and the frontier is nonempty, then there are $a&lt;b$ in the\ninterior of $J$ such that\n\\[\n U=S^2\\times(a,b),\\qquad\n \\operatorname{Fr}_{S^2\\times J}(U)\n =S^2\\times\\{a\\}\\,\\sqcup\\,S^2\\times\\{b\\}.\n\\]&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Reversing One Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:247,&quot;ref&quot;:&quot;MT:app:A.20,MT:app:A.21&quot;},{&quot;id&quot;:&quot;10593afc1ddd&quot;,&quot;label&quot;:&quot;lem:positive-curvature-neck-separation&quot;,&quot;title&quot;:&quot;Imported interface: a thin neck separates a point soul from the end&quot;,&quot;display_title&quot;:&quot;Lemma 3.10: Imported interface: a thin neck separates a point soul from the end&quot;,&quot;body&quot;:&quot;For sufficiently small $\\epsilon$, let $M^3$ be complete, noncompact, and\npositively curved with point soul $p$.  The central sphere of every\n$\\epsilon$-neck disjoint from $p$ separates $p$ from the unique end.  Two\ndisjoint $\\epsilon$-necks which avoid $p$ have disjoint central spheres that\nbound a region diffeomorphic to $S^2\\times[0,1]$.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solution Geometry and Stability&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:110,&quot;ref&quot;:&quot;MT:ch2:2.20&quot;},{&quot;id&quot;:&quot;10dc951be346&quot;,&quot;label&quot;:&quot;lem:ramp-slope-evolution&quot;,&quot;title&quot;:&quot;Evolution equation for the ramp slope&quot;,&quot;display_title&quot;:&quot;Theorem 4.6: Evolution equation for the ramp slope&quot;,&quot;body&quot;:&quot;Along a curve-shrinking flow in\n$(M,g(t))\\times(S^1_\\lambda,ds^2)$, the function\n$u=\\langle S,U\\rangle$ satisfies\n\\[\n \\partial_tu=u&#x27;&#x27;+(k^2+\\operatorname{Ric}(S,S))u\n \\ge u&#x27;&#x27;-C&#x27;u,\n\\]\nwhere $C&#x27;$ is any upper bound for the norm of the Ricci tensor of $g(t)$.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Product-Circle Geometry and Ramp Setup&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:144,&quot;ref&quot;:&quot;MT:ch19:19.11&quot;},{&quot;id&quot;:&quot;125231b4985e&quot;,&quot;label&quot;:&quot;thm:hamilton-compactness-generalized-flows&quot;,&quot;title&quot;:&quot;Pointed Ricci-flow compactness&quot;,&quot;display_title&quot;:&quot;Theorem 2.44: Pointed Ricci-flow compactness&quot;,&quot;body&quot;:&quot;Let $(\\mathcal M_j,G_j,x_j)$ be based generalized Ricci flows with base time\nzero, defined on a common open time interval $I$.  Suppose that for every\n$A&lt;\\infty$ and compact $J\\Subset I$ containing zero, all sufficiently large\n$j$ admit compatible embeddings\n\\[\n B_{g_j(0)}(x_j,A)\\times J\\longrightarrow\\mathcal M_j\n\\]\nwith compact zero-time balls and a uniform curvature bound on the images.\nAssume that for some $r_0,\\kappa&gt;0$,\n\\[\n \\operatorname{Vol}_{g_j(0)}B(x_j,r_0)\\ge\\kappa r_0^3.\n\\]\nAfter passing to a subsequence, the flows converge smoothly on compact\nspacetime subsets.  The limit is a pointed Ricci flow\n\\[\n (M_\\infty,g_\\infty(t),x_\\infty)\n\\]\non $I$, and its time-zero slice is complete.  If\n$\\operatorname{Ric}_{g_\\infty(t)}\\ge0$ for $t\\le0$, then every nonpositive\ntime slice of the limit is complete.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:86,&quot;ref&quot;:&quot;MT:ch5:5.14,MT:ch5:5.15&quot;},{&quot;id&quot;:&quot;13cdca21cc2c&quot;,&quot;label&quot;:&quot;thm:separating-neck-centers-form-tube&quot;,&quot;title&quot;:&quot;Separating neck centers lie in an epsilon-tube&quot;,&quot;display_title&quot;:&quot;Theorem 1.32: Separating neck centers lie in an epsilon-tube&quot;,&quot;body&quot;:&quot;There is $\\epsilon_0&gt;0$ such that the following holds for\n$0&lt;\\epsilon\\le\\epsilon_0$.  Let $X$ be a connected subset of a smooth\nRiemannian three-manifold $M$ without boundary.  Suppose every $x\\in X$ is\nthe center of an embedded $\\epsilon$-neck and every corresponding central\nsphere separates $M$.\nThen a subcollection of these necks, after reversing axial coordinates when\nnecessary, is a balanced chain whose union contains $X$.  Consequently\n$X$ lies in an $\\epsilon$-tube.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:31,&quot;ref&quot;:&quot;MT:app:A.12,MT:app:A.15,MT:app:A.17,MT:app:A.18,MT:app:A.19&quot;},{&quot;id&quot;:&quot;13fdfedbc3df&quot;,&quot;label&quot;:&quot;lem:minimum-reduced-length-comparison&quot;,&quot;title&quot;:&quot;Minimum reduced-length comparison&quot;,&quot;display_title&quot;:&quot;Lemma 2.29: Minimum reduced-length comparison&quot;,&quot;body&quot;:&quot;Suppose that on every slice of a smooth backward-time interval the minimum\n\\[\n m(\\tau)=\\min_y l_x(y,\\tau)\n\\]\nis attained, and that the union of the minimizing sets over compact\nsubintervals is compact.  Then $m$ is continuous and\n\\[\n D^+m(\\tau)\\le\\frac{3/2-m(\\tau)}{\\tau}.\n\\]\nIf $\\limsup_{\\tau\\downarrow0}m(\\tau)\\le3/2$, then\n$m(\\tau)\\le3/2$ throughout the interval.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Reduced Geometry&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:71,&quot;ref&quot;:&quot;MT:ch7:7.10,MT:ch7:7.11,MT:ch7:7.12&quot;},{&quot;id&quot;:&quot;1407ce3c1421&quot;,&quot;label&quot;:&quot;lem:proper-all-neck-relative-fibration&quot;,&quot;title&quot;:&quot;Relative classification of a proper all-neck region&quot;,&quot;display_title&quot;:&quot;Lemma 6.15: Relative classification of a proper all-neck region&quot;,&quot;body&quot;:&quot;Let $D$ be a proper connected component of a disappearing region in a compact\nboundaryless presurgery $3$-manifold.  Assume every point of $D$ is an\n$\\epsilon$-neck center, every point of its nonempty frontier is a central\nneck sphere, and $\\overline D$ is a compact smooth codimension-zero\nsubmanifold with\n\\[\n \\partial\\overline D=\\operatorname{Fr}D\\ne\\varnothing\n\\]\na finite union of those spheres.  Then\n\\[\n \\overline D\\cong S^2\\times[0,1],\\qquad\n \\operatorname{Fr}D=S_0\\sqcup S_1.\n\\]\nIn particular, the closed $S^2$-bundle alternative in Appendix~A.20 cannot\nbe used to replace this relative conclusion: Appendix~A.21 only gives\ncontainment in an ambient neck-covered component.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Reversing One Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:250,&quot;ref&quot;:&quot;MT:app:A.20,MT:app:A.21,MT:app:A.24&quot;},{&quot;id&quot;:&quot;1548fac8b0f3&quot;,&quot;label&quot;:&quot;lem:epsilon-neck-metric-control&quot;,&quot;title&quot;:&quot;Metric control in a small epsilon-neck&quot;,&quot;display_title&quot;:&quot;Lemma 1.25: Metric control in a small epsilon-neck&quot;,&quot;body&quot;:&quot;Write $d_N$ for the intrinsic distance induced by the restriction of the\nambient metric to $N$.  The estimates below are intrinsic to the neck; no\nambient no-shortcut assertion is being made.\nFor every $0&lt;\\alpha&lt;1/8$, all sufficiently small $\\epsilon$ have the\nfollowing property.  If $N$ is an $\\epsilon$-neck of scale $r_N$ centered\nat $x$, then scalar curvatures on $N$ lie between\n$(1-\\alpha)r_N^{-2}$ and $(1+\\alpha)r_N^{-2}$.  Neck spheres have\ndiameter at most $(1+\\alpha)\\sqrt2\\pi r_N$, and points with sufficiently\nlarge axial separation, namely\n$|s_N(q)-s_N(p)|\\ge\\epsilon^{-1}/100$ or\n$d_N(p,q)\\ge r_N\\epsilon^{-1}/100$, satisfy\n\\[\n (1-\\alpha)r_N|s_N(q)-s_N(p)|\n \\le d_N(p,q)\n \\le(1+\\alpha)r_N|s_N(q)-s_N(p)|.\n\\]\nIn particular, every path contained in $N$ and joining its two end regions\nhas length at least\n$\\frac95(1-\\alpha)r_N\\epsilon^{-1}$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:24,&quot;ref&quot;:&quot;MT:app:A.2,MT:app:A.5&quot;},{&quot;id&quot;:&quot;15ee9318bfae&quot;,&quot;label&quot;:&quot;thm:finite-cover-homotopy-three-sphere&quot;,&quot;title&quot;:&quot;Finite fundamental group and the universal cover&quot;,&quot;display_title&quot;:&quot;Theorem 5.22: Finite fundamental group and the universal cover&quot;,&quot;body&quot;:&quot;Let $X$ be a closed connected three-manifold with finite fundamental group\nand $\\pi_2(X)=0$.  Its universal cover $\\widetilde X$ is a homotopy\nthree-sphere, and covering projection induces\n\\[\n \\pi_3(\\widetilde X)\\cong\\pi_3(X)\\cong\\mathbb Z.\n\\]&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Late-Component _3 Topology&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:200,&quot;ref&quot;:&quot;MT:ch18:18.19&quot;},{&quot;id&quot;:&quot;1ab62a65597f&quot;,&quot;label&quot;:&quot;lem:evolved-subarc-global-bounds&quot;,&quot;title&quot;:&quot;Uniform bounds on evolved subarcs&quot;,&quot;display_title&quot;:&quot;Theorem 4.29: Uniform bounds on evolved subarcs&quot;,&quot;body&quot;:&quot;There is $D_0&lt;\\infty$, depending only on $\\Theta$, $L_0$, and the fixed\nambient Ricci flow, such that every subarc $\\gamma_{t&#x27;}$ of length at most\n$r$ satisfies, for $t&#x27;\\le t\\le t&#x27;+\\delta r^2$,\n\\[\n \\int_{\\gamma_t}k\\,ds&lt;D_0,\\qquad L(\\gamma_t)\\le D_0r.\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Localized Total-Curvature Control&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:167,&quot;ref&quot;:&quot;MT:ch19:19.59&quot;},{&quot;id&quot;:&quot;1d5de1e5975f&quot;,&quot;label&quot;:&quot;lem:curve-flow-parabolic-regularity-interface&quot;,&quot;title&quot;:&quot;Parabolic regularity for graph curve flow&quot;,&quot;display_title&quot;:&quot;Lemma 4.38: Parabolic regularity for graph curve flow&quot;,&quot;body&quot;:&quot;On a graph interval on which the slope bound gives\n$0&lt;a_-\\le |Z|^2\\le a_+&lt;\\infty$, suppose the ambient metric and connection\ncoefficients have bounded derivatives of every order and the curve-flow\ncurvature barrier gives $|H|^2\\le C_0(t-t&#x27;)^{-1}$.  Then, for every $m\\ge1$,\nthe uniformly parabolic gauged equation has interior (and periodic-boundary)\nestimates\n\\[\n |\\nabla_S^mH|^2\\le C_m(t-t&#x27;)^{-(m+1)},\n\\]\nwhere $C_m$ depends only on $a_\\pm$, the ambient coefficient bounds, and\n$C_0$.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Short-Time Curvature Barrier&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:176,&quot;ref&quot;:&quot;MT:ch19:19.24&quot;},{&quot;id&quot;:&quot;1eed2f7e7e5a&quot;,&quot;label&quot;:&quot;lem:projective-plane-prime-factor-contract&quot;,&quot;title&quot;:&quot;Imported prime-factor contract for a two-sided projective plane&quot;,&quot;display_title&quot;:&quot;Lemma 5.55: Imported prime-factor contract for a two-sided projective plane&quot;,&quot;body&quot;:&quot;Let $M$ be a closed connected three-manifold whose fundamental group is a\nfree product of finite groups and infinite cyclic groups, and let $P\\subset M$\nbe an embedded two-sided $\\mathbb{RP}^2$ with trivial normal bundle.  Under\nthe prime/connected-sum decomposition used for this free product, $P$ can be\nisotoped disjoint from the decomposition spheres and hence into one prime\nfactor.  Its inclusion is $\\pi _1$-injective, and because it is two-sided and\nnonseparating in that factor, the factor&#x27;s first homology surjects onto\n$\\mathbb Z$.  This is the Hempel/prime-decomposition topology input in the\nMorgan--Tian proof.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Finite Extinction&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:233,&quot;ref&quot;:&quot;MT:ch18:18.1&quot;},{&quot;id&quot;:&quot;1f26cb4f3c98&quot;,&quot;label&quot;:&quot;thm:two-sphere-width-realization&quot;,&quot;title&quot;:&quot;Imported Sacks--Uhlenbeck realization of the two-sphere width&quot;,&quot;display_title&quot;:&quot;Theorem 5.3: Imported Sacks--Uhlenbeck realization of the two-sphere width&quot;,&quot;body&quot;:&quot;If $(X,g)$ is compact and $\\pi_2(X)\\ne0$, then $W_2(X,g)&gt;0$ and there is a\nnon-null-homotopic conformal harmonic map $f\\colon S^2\\to X$, a branched\nminimal immersion away from finitely many points, such that\n\\[\n \\operatorname{Area}_g(f)=W_2(X,g).\n\\]&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Two-Sphere Width Control&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:181,&quot;ref&quot;:&quot;MT:ch18:18.10&quot;},{&quot;id&quot;:&quot;1f83cab86451&quot;,&quot;label&quot;:&quot;lem:finite-net-ramp-nondegeneration&quot;,&quot;title&quot;:&quot;Finite annular nets and a common ramp scale&quot;,&quot;display_title&quot;:&quot;Lemma 5.41: Finite annular nets and a common ramp scale&quot;,&quot;body&quot;:&quot;Let $g(t)$, $t_0\\le t\\le t_1$, be a Ricci flow on a compact manifold, and let\n$\\widetilde\\Gamma\\colon S^2\\to\\Lambda_0M$ and\n$\\widetilde\\Gamma_c^\\lambda(t)$ be the approximation and ramp flows supplied\nby \\ref{thm:controlled-curve-shrinking-existence}.  For every $\\mu&gt;0$ there\nare a finite set ${\\mathcal S}\\subset S^2$ and $\\lambda_{\\rm net}&gt;0$ such\nthat ${\\mathcal S}$ is a $\\mu/2$-annular net for\n$\\widetilde\\Gamma$, and, for every\n$0&lt;\\lambda&lt;\\lambda_{\\rm net}$, it is a $\\mu$-annular net for the initial\nramp family $\\widetilde\\Gamma^\\lambda$.  Thus, for each $c$, one can choose\n$\\widehat c\\in{\\mathcal S}$ so that the initial annular-area infimum between\n$\\widetilde\\Gamma_c^\\lambda(t_0)$ and\n$\\widetilde\\Gamma_{\\widehat c}^\\lambda(t_0)$ is less than $\\mu$.\n\nAt every later time the two boundary curves are embedded degree-one ramps in\nthe same free homotopy class.  Consequently every essential simple closed\ncurve in every spanning annulus for the pair has length at least\n\\[\n \\rho_\\lambda=L(S^1_\\lambda)=\\lambda,\n\\]\nuniformly over $c$, the finite net, and $[t_0,t_1]$ for this fixed\n$\\lambda$.  Finally, after ${\\mathcal S}$ is chosen, any collection of\npositive pointwise thresholds $\\lambda_{\\widehat c}$,\n$\\widehat c\\in{\\mathcal S}$, admits one common scale\n\\[\n 0&lt;\\lambda&lt;\\min\\bigl\\{\\lambda_{\\rm net},\n     \\lambda_{\\widehat c}:\\widehat c\\in{\\mathcal S}\\bigr\\}.\n\\]\nNo lower bound for $\\rho_\\lambda$ uniform as $\\lambda\\downarrow0$ is\nasserted or needed.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Controlled Loop-Family Deformation&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:219,&quot;ref&quot;:&quot;MT:ch18:18.24,MT:ch19:19.15&quot;},{&quot;id&quot;:&quot;204f4bfc322e&quot;,&quot;label&quot;:&quot;def:finite-small-annulus-net&quot;,&quot;title&quot;:&quot;Finite small-annulus net&quot;,&quot;display_title&quot;:&quot;Definition 5.40: Finite small-annulus net&quot;,&quot;body&quot;:&quot;Let $\\Gamma\\colon S^2\\to\\Lambda M$ be a continuous $C^1$-loop family.  A\nfinite set ${\\mathcal S}\\subset S^2$ is a \\emph{$\\nu$-annular net} for\n$\\Gamma$ if, for every $c\\in S^2$, there are $\\widehat c\\in{\\mathcal S}$ and\nan admissible Lipschitz annulus from $\\Gamma(c)$ to $\\Gamma(\\widehat c)$ of\narea less than $\\nu$.  Admissible means that the two boundary traces agree\nwith the displayed loops up to orientation-preserving weakly monotone\nreparameterizations, as in the annular-area infimum.  The same terminology is\nused for a ramp family in $M\\times S^1_\\lambda$, with area measured in the\nproduct metric.  In the source the admissible annuli are the swept annuli\nassociated to oriented parameter arcs; this orientation clause is part of the\nnet contract.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Controlled Loop-Family Deformation&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:218,&quot;ref&quot;:&quot;MT:ch18:18.24&quot;},{&quot;id&quot;:&quot;206db407e5de&quot;,&quot;label&quot;:&quot;lem:path-connected-implies-connected&quot;,&quot;title&quot;:&quot;Path-connected spaces are connected&quot;,&quot;display_title&quot;:&quot;Lemma 6.6: Path-connected spaces are connected&quot;,&quot;body&quot;:&quot;Every path-connected topological space is connected.  In particular, a space\nwhich is simply connected in the sense of \\ref{def:simply-connected} is\nconnected.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Smooth Connected Sums and Prime Factors&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:241,&quot;ref&quot;:&quot;MT:intro:0.1&quot;},{&quot;id&quot;:&quot;21df66602bb6&quot;,&quot;label&quot;:&quot;def:canonical-neck-cap-regions&quot;,&quot;title&quot;:&quot;Tubes, capped tubes, and neck fibrations&quot;,&quot;display_title&quot;:&quot;Definition 1.23: Tubes, capped tubes, and neck fibrations&quot;,&quot;body&quot;:&quot;An \\emph{$\\epsilon$-tube} is a submanifold diffeomorphic to\n$S^2\\times I$, for a nondegenerate interval $I$, covered by\n$\\epsilon$-necks whose central spheres are isotopic to the $S^2$ factors.\nAn open tube has no boundary.  A \\emph{$C$-capped $\\epsilon$-tube} is the\nconnected union of an open $\\epsilon$-tube and one $(C,\\epsilon)$-cap,\nglued along an end of each.  A \\emph{doubly $C$-capped\n$\\epsilon$-tube} has disjoint cap cores attached at both ends.  An\n\\emph{$\\epsilon$-fibration} is a closed connected $S^2$-bundle over\n$S^1$, covered by $\\epsilon$-necks whose central spheres are isotopic to\nthe fibers.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:22,&quot;ref&quot;:&quot;MT:ch9:9.81,MT:app:A.21,MT:app:A.25&quot;},{&quot;id&quot;:&quot;23c07f13aad2&quot;,&quot;label&quot;:&quot;prop:overlapping-epsilon-necks&quot;,&quot;title&quot;:&quot;Overlap control for small epsilon-necks&quot;,&quot;display_title&quot;:&quot;Proposition 1.26: Overlap control for small epsilon-necks&quot;,&quot;body&quot;:&quot;For every $0&lt;\\alpha\\le10^{-2}$, all sufficiently small $\\epsilon$ have\nthe following property.  If two $\\epsilon$-necks $N,N&#x27;$ intersect, then\ntheir scales differ by a factor in $(1-\\alpha,1+\\alpha)$, their neck-sphere\ntangent planes make angle less than $\\alpha$ on the overlap, and their\noriented axial directions agree up to sign and an error less than\n$\\alpha$.  A neck sphere of one neck contained in the other is isotopic\nthere to a neck sphere.  If the overlap contains a point in the middle\nnine-tenths of one neck, then there is a point in the overlap lying in the\nmiddle $0.96\\epsilon^{-1}$ of both neck coordinates; the corresponding\ncross-sectional spheres are contained in the opposite necks, isotopic in the\noverlap, and the relevant overlap component is diffeomorphic to\n$S^2\\times(0,1)$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;proposition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:25,&quot;ref&quot;:&quot;MT:app:A.11&quot;},{&quot;id&quot;:&quot;2412c0bb3696&quot;,&quot;label&quot;:&quot;lem:bounded-flow-line-cap-exclusion&quot;,&quot;title&quot;:&quot;A cap-reaching flow line forces a canonical neighborhood&quot;,&quot;display_title&quot;:&quot;Lemma 3.21: A cap-reaching flow line forces a canonical neighborhood&quot;,&quot;body&quot;:&quot;In a rescaled first-failure sequence, suppose a point in a fixed-radius\nzero-time ball has a backward flow line of uniformly bounded scalar\ncurvature which reaches a surgery cap in uniformly bounded time.  Then the\nbase first-failure points have strong $(C,\\epsilon)$-canonical neighborhoods\nfor all sufficiently large indices.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;First-Failure Extension&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:121,&quot;ref&quot;:&quot;MT:ch17:17.7&quot;},{&quot;id&quot;:&quot;2472fed1c068&quot;,&quot;label&quot;:&quot;lem:fixed-sphere-area-distortion&quot;,&quot;title&quot;:&quot;Fixed-map area distortion&quot;,&quot;display_title&quot;:&quot;Lemma 5.5: Fixed-map area distortion&quot;,&quot;body&quot;:&quot;Let $g(t)$ be a Ricci flow on a compact manifold for\n$t\\in[t_0,t_1]$, suppose $|\\operatorname{Ric}_{g(t)}|\\le D$, and let\n$f\\colon S^2\\to M$ be $C^1$.  Then, for $s,t\\in[t_0,t_1]$,\n\\[\n e^{-4D|t-s|}\\operatorname{Area}_{g(s)}(f)\n \\le \\operatorname{Area}_{g(t)}(f)\n \\le e^{4D|t-s|}\\operatorname{Area}_{g(s)}(f).\n\\]&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Two-Sphere Width Control&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:183,&quot;ref&quot;:&quot;MT:ch18:18.13&quot;},{&quot;id&quot;:&quot;26553450f2f2&quot;,&quot;label&quot;:&quot;lem:plateau-disk-moving-boundary-contract&quot;,&quot;title&quot;:&quot;Plateau disk and moving-boundary contract&quot;,&quot;display_title&quot;:&quot;Lemma 5.34: Plateau disk and moving-boundary contract&quot;,&quot;body&quot;:&quot;The three preceding contracts together provide exactly the disk existence,\nboundary regularity, isotopy continuity, and single-loop immersed-boundary\napproximation used by the least-area variation theorem.  No annular\nattainment or simultaneous family-embedding conclusion is included.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Controlled Loop-Family Deformation&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:212,&quot;ref&quot;:&quot;MT:ch19:19.2,MT:ch19:19.4&quot;},{&quot;id&quot;:&quot;2695ed9e4485&quot;,&quot;label&quot;:&quot;def:ricci-flow-surgery-canonical-neighborhood-assumption&quot;,&quot;title&quot;:&quot;Kleiner--Lott canonical-neighborhood assumption&quot;,&quot;display_title&quot;:&quot;Definition 2.11: Kleiner--Lott canonical-neighborhood assumption&quot;,&quot;body&quot;:&quot;Fix small $\\epsilon&gt;0$, the universal $\\kappa_0$ of Proposition~50.1, the\nderivative constant $\\eta$ of Lemma~59.4, and the constants\n$C_1^\\kappa,C_2^\\kappa,C_1^{\\ma
