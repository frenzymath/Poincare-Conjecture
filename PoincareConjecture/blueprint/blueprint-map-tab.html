numerate}&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Reversing One Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:257,&quot;ref&quot;:&quot;MT:ch15:15.3&quot;},{&quot;id&quot;:&quot;e939cfe559a1&quot;,&quot;label&quot;:&quot;def:simply-connected&quot;,&quot;title&quot;:&quot;Simply connected space&quot;,&quot;display_title&quot;:&quot;Definition 6.5: Simply connected space&quot;,&quot;body&quot;:&quot;A topological space is \\emph{simply connected} when it is path-connected and\nits fundamental group at one, equivalently every, basepoint is trivial.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Smooth Connected Sums and Prime Factors&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:240,&quot;ref&quot;:&quot;MT:intro:0.1&quot;},{&quot;id&quot;:&quot;e9a6b43315ac&quot;,&quot;label&quot;:&quot;def:embedded-horn-frontier&quot;,&quot;title&quot;:&quot;Embedded horn frontier and cross-sectional sphere&quot;,&quot;display_title&quot;:&quot;Definition 1.21: Embedded horn frontier and cross-sectional sphere&quot;,&quot;body&quot;:&quot;For an embedded neck chart $\\varphi_N$ as in\n\\ref{def:epsilon-neck-and-scale}, write\n\\[\n S_N(\\sigma)=\\varphi_N(S^2\\times\\{\\sigma\\}),\\qquad\n H_N^+=\\varphi_N(S^2\\times(0,\\epsilon^{-1})),\\qquad\n H_N^-=\\varphi_N(S^2\\times(-\\epsilon^{-1},0)).\n\\]\nThe \\emph{horn frontier} of a cap is the embedded central sphere\n$S_N(0)=\\partial\\overline Y$ of its neck end, with the side containing the\ncompact core designated the core side.  For any open region $U\\subset M$,\n\\(\\operatorname{Fr}_M(U)=\\overline U^{\\,M}\\setminus U\\) denotes its ambient\nfrontier.  Thus every frontier point below is a point of this specified\nembedded sphere (or of an exposed end frontier), and every\ncross-sectional sphere is one of the displayed $S_N(\\sigma)$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:20,&quot;ref&quot;:&quot;MT:ch9:9.72,MT:app:A.21&quot;},{&quot;id&quot;:&quot;ea4ae1699338&quot;,&quot;label&quot;:&quot;lem:finite-horizon-surgery-phi-envelope&quot;,&quot;title&quot;:&quot;Finite-horizon Hamilton--Ivey envelope across surgery&quot;,&quot;display_title&quot;:&quot;Lemma 2.9: Finite-horizon Hamilton--Ivey envelope across surgery&quot;,&quot;body&quot;:&quot;Let $(\\mathcal M,G)$ be a three-dimensional Ricci flow with surgery on a\nfinite interval $[0,b]$ with finitely many transition times.  Assume that\nthe initial curvature operator has smallest eigenvalue at least $-1$, every\nordinary piece has bounded curvature on compact time intervals, and every\ntransition is made by the pinching-preserving cap insertion of\n\\ref{lem:ricci-flow-surgery-cap-insertion}.  Then there is one admissible\nsmooth nondecreasing function $\\Phi_{\\rm HI}^{b,g(0)}$ with\n$\\Phi_{\\rm HI}^{b,g(0)}(s)/s\\to0$ as $s\\to\\infty$ such that\n\\[\n \\operatorname{Rm}_{G}(x,t)\\ge-\\Phi_{\\rm HI}^{b,g(0)}(R_G(x,t))\n\\]\non every ordinary slice and on both the backward and forward sides of every\ntransition where those slices are defined.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:51,&quot;ref&quot;:&quot;KL:appB:B.5,KL:appB:after-B.6,KL:II.4:72.24&quot;},{&quot;id&quot;:&quot;eb500921cc59&quot;,&quot;label&quot;:&quot;thm:free-product-excludes-two-sided-projective-plane&quot;,&quot;title&quot;:&quot;The free-product hypothesis excludes a two-sided projective plane&quot;,&quot;display_title&quot;:&quot;Theorem 5.56: The free-product hypothesis excludes a two-sided projective plane&quot;,&quot;body&quot;:&quot;Let $M$ be a closed connected three-manifold whose\nfundamental group is a free product of finite groups and infinite cyclic\ngroups.  Then $M$ contains no embedded $\\mathbb{RP}^2$ with trivial normal\nbundle.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Finite Extinction&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:234,&quot;ref&quot;:&quot;MT:ch18:18.1&quot;},{&quot;id&quot;:&quot;edd928203cd3&quot;,&quot;label&quot;:&quot;thm:positive-ricci-three-manifold-roundness&quot;,&quot;title&quot;:&quot;Hamilton roundness for positive Ricci curvature&quot;,&quot;display_title&quot;:&quot;Theorem 6.8: Hamilton roundness for positive Ricci curvature&quot;,&quot;body&quot;:&quot;Let $M$ be a compact connected smooth $3$-manifold without boundary and let\n$g$ be a smooth Riemannian metric with $\\operatorname{Ric}_g&gt;0$ everywhere.\nThen $M$ admits a metric of constant positive sectional curvature and is\ndiffeomorphic to a spherical space form.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Smooth Connected Sums and Prime Factors&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:243,&quot;ref&quot;:&quot;MT:ch4:4.23&quot;},{&quot;id&quot;:&quot;ee648cd5d9b1&quot;,&quot;label&quot;:&quot;lem:essential-sphere-family-finiteness&quot;,&quot;title&quot;:&quot;Finite bound for essential sphere families&quot;,&quot;display_title&quot;:&quot;Lemma 5.11: Finite bound for essential sphere families&quot;,&quot;body&quot;:&quot;For every compact (possibly disconnected) $3$-manifold $X$ there is an\ninteger $N(X)$ such that every disjoint family of embedded $2$-spheres in\n$X$ whose members are individually non-null-homotopic and pairwise\nnon-homotopic has at most $N(X)$ members.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Two-Sphere Width Control&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:189,&quot;ref&quot;:&quot;MT:ch18:18.8&quot;},{&quot;id&quot;:&quot;eea9e1e3c571&quot;,&quot;label&quot;:&quot;thm:curvature-null-splitting&quot;,&quot;title&quot;:&quot;Splitting at a curvature null direction&quot;,&quot;display_title&quot;:&quot;Theorem 2.38: Splitting at a curvature null direction&quot;,&quot;body&quot;:&quot;Let $T&gt;0$ and let $(U,g(t))$, $0\\le t\\le T$, be a connected smooth\nthree-dimensional Ricci flow with nonnegative sectional curvature; the\nslices need not be complete for the local assertion.  Assume that $g(0)$ is\nnot flat and that the Ricci tensor at some $p\\in U$ at time $T$ has a zero\neigenvalue (equivalently, the curvature operator has a two-dimensional\nkernel).  Then, for every $0&lt;t\\le T$, the metric is locally a Riemannian\nproduct of a surface of positive curvature and a line, and the flow is\nlocally the product of the surface Ricci flow and the trivial line flow.  If\nevery slice is complete, a covering\n$\\widetilde U\\to U$ carries the product flow\n$(N,h(t))\\times(\\mathbb R,ds^2)$ for $0\\le t\\le T$; deck\ntransformations preserve the parallel line distribution.  Without the\nnonflatness assumption, the separate scalar clause is: if\n$R(p,T)=0$, then the whole connected flow on $U\\times[0,T]$ is flat.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Local Curvature and Neck Estimates&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:80,&quot;ref&quot;:&quot;MT:ch4:4.19,MT:ch4:4.20,MT:ch4:4.21&quot;},{&quot;id&quot;:&quot;efaf9514f541&quot;,&quot;label&quot;:&quot;lem:ricci-flow-surgery-horn-scale&quot;,&quot;title&quot;:&quot;Imported interface: Kleiner--Lott surgery scale&quot;,&quot;display_title&quot;:&quot;Lemma 2.14: Imported interface: Kleiner--Lott surgery scale&quot;,&quot;body&quot;:&quot;Fix $\\Phi$, $\\widehat T$, and positive nonincreasing $r$ on\n$[0,\\widehat T]$.  At a singular time $T$, write $\\bar R$ for the scalar\ncurvature on the terminal maximal extension and $\\bar R(x,T)$ for its value\nat a point of the bounded-curvature domain.  There is a producer\n\\[\n H(\\Phi,T,r,\\delta)&gt;0\\qquad(0&lt;T\\le\\widehat T,\\ 0&lt;\\delta&lt;1/2)\n\\]\nwith $H(\\Phi,T,r,\\delta)&lt;\\delta^2r(T)$, nondecreasing in $r(T)$ and $\\delta$,\nsuch that at a singular time $T$, an embedded $\\epsilon$-horn whose compact\nbounded-curvature frontier lies in $\\{\\bar R\\le(\\delta r(T))^{-2}\\}$ and whose\npoint has $\\bar R\\ge H(\\Phi,T,r,\\delta)^{-2}$ contains the backward parabolic\nregion\n\\[\n P\\bigl(x,T,\\delta^{-1}\\bar R(x,T)^{-1/2},-\\bar R(x,T)^{-1}\\bigr)\n\\]\ninside a strong $\\delta$-neck.\nMoreover, for every $r_-&gt;0$ and $\\delta_-&gt;0$ there is a uniform lower\nenvelope\n\\[\n H_*=H_*(\\Phi,\\widehat T,r_-,\\delta_-)&gt;0\n\\]\nsuch that $H(\\Phi,T,r,\\delta)\\ge H_*$ whenever\n$0&lt;T\\le\\widehat T$, $r(T)\\ge r_-$, and $\\delta\\ge\\delta_-$.  Thus a\npositive nonincreasing control function on a bounded interval cannot make the\nselected surgery scales collapse to zero.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:56,&quot;ref&quot;:&quot;KL:II.4:71.1,KL:II.4:after-71.1&quot;},{&quot;id&quot;:&quot;efddbd482f53&quot;,&quot;label&quot;:&quot;lem:interpolating-surgery-metric-smooth&quot;,&quot;title&quot;:&quot;Smoothness of the interpolating surgery metric&quot;,&quot;display_title&quot;:&quot;Lemma 1.11: Smoothness of the interpolating surgery metric&quot;,&quot;body&quot;:&quot;The piecewise tensor $\\widehat g$ of\n\\ref{def:interpolating-surgery-metric} is a smooth Riemannian metric on\n$\\mathcal S$.  It equals $Q\\rho^*g$ on $s\\le0$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:10,&quot;ref&quot;:&quot;MT:ch13:13.2&quot;},{&quot;id&quot;:&quot;f08c381beccc&quot;,&quot;label&quot;:&quot;lem:nested-cap-scale-comparison&quot;,&quot;title&quot;:&quot;Uniform scale in a nested cap chain&quot;,&quot;display_title&quot;:&quot;Lemma 1.35: Uniform scale in a nested cap chain&quot;,&quot;body&quot;:&quot;Fix $C$ and sufficiently small $\\epsilon$.  Let\n$C_0\\subset C_1\\subset\\cdots$ be canonical caps whose successive core\nclosures meet the preceding frontier.  If $Q_0$ is the scalar\ncurvature at a fixed point of the first core, then every neck scale exposed by\nthe chain is at least $c(C,\\epsilon)Q_0^{-1/2}$, and every noncontradictory\nenlargement increases the distance from that point to the complement by at\nleast $c(C,\\epsilon)Q_0^{-1/2}$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:34,&quot;ref&quot;:&quot;MT:app:A.22&quot;},{&quot;id&quot;:&quot;f2712cff9330&quot;,&quot;label&quot;:&quot;lem:rescaled-high-curvature-canonical-control&quot;,&quot;title&quot;:&quot;High-curvature control in a rescaled failure slice&quot;,&quot;display_title&quot;:&quot;Lemma 3.22: High-curvature control in a rescaled failure slice&quot;,&quot;body&quot;:&quot;After rescaling first-failure points to scalar curvature one and taking the\nsurgery controls to zero, every point of the zero-time slice with scalar\ncurvature greater than one has a strong\n$(2C,2\\epsilon)$-canonical neighborhood for all sufficiently large indices.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;First-Failure Extension&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:122,&quot;ref&quot;:&quot;MT:ch17:17.6&quot;},{&quot;id&quot;:&quot;f29967583a07&quot;,&quot;label&quot;:&quot;thm:loop-width-forward-inequality&quot;,&quot;title&quot;:&quot;Forward inequality for the _3 width&quot;,&quot;display_title&quot;:&quot;Theorem 5.54: Forward inequality for the _3 width&quot;,&quot;body&quot;:&quot;Let $\\mathcal X$ be a component path of a controlled surgery flow on a compact\ninterval $[t_0,t_1]$ containing only finitely many surgery times.  Suppose\n$\\pi_2(\\mathcal X(t_0))=0$ and\n$\\pi_3(\\mathcal X(t_0))\\cong\\mathbb Z$, and let\n$0\\ne\\xi(t_0)\\in\\pi_3(\\mathcal X(t_0))$.  Let\n$\\xi(t)$ be the compatible family of nonzero classes supplied by\n\\ref{thm:surgery-pi3-class-transport}; in particular\n$\\pi_2(\\mathcal X(t))=0$ for every $t$.  Then\n$W_\\xi$ is continuous at nonsurgery times, obeys\n\\[\n W_\\xi(T)\\le\\liminf_{t\\uparrow T}W_\\xi(t)\n\\]\nat surgery times, and satisfies\n\\[\n D^+W_\\xi(t)\n \\le-2\\pi-\\frac12R_{\\min}(t)W_\\xi(t)\n\\]\non the immediate right of every time in $[t_0,t_1)$ for which the component\npath survives.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;_3-Width Evolution Through Surgery&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:232,&quot;ref&quot;:&quot;MT:ch18:18.18&quot;},{&quot;id&quot;:&quot;f32e24c7af2a&quot;,&quot;label&quot;:&quot;lem:simply-connected-three-manifold-orientable&quot;,&quot;title&quot;:&quot;A simply connected three-manifold is orientable&quot;,&quot;display_title&quot;:&quot;Lemma 6.7: A simply connected three-manifold is orientable&quot;,&quot;body&quot;:&quot;Every connected simply connected smooth $3$-manifold is orientable.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Smooth Connected Sums and Prime Factors&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:242,&quot;ref&quot;:&quot;MT:intro:0.1&quot;},{&quot;id&quot;:&quot;f3a098444eb6&quot;,&quot;label&quot;:&quot;lem:curvature-nullity-propagation&quot;,&quot;title&quot;:&quot;Propagation of a curvature-operator nullity&quot;,&quot;display_title&quot;:&quot;Lemma 2.37: Propagation of a curvature-operator nullity&quot;,&quot;body&quot;:&quot;Let $T&gt;0$ and let $(U,g(t))$, $0\\le t\\le T$, be a connected\nthree-dimensional Ricci flow whose slices have nonnegative sectional\ncurvature (completeness is not assumed).  If $g(0)$ is nonflat and the\nRicci tensor at some $p\\in U$ at time $T$ has a zero eigenvalue, then\n\\[\n \\mu+\\nu=0\n \\quad\\text{and hence}\\quad\n \\operatorname{spec}(\\operatorname{Rm})=\\{\\lambda,0,0\\},\\qquad\\lambda&gt;0,\n\\]\nat every point of $U$ and every $0&lt;t\\le T$, where\n$\\lambda\\ge\\mu\\ge\\nu$ are the curvature-operator eigenvalues.  Thus the\nRicci tensor has a one-dimensional nullspace and its null line is defined\ncontinuously (and smoothly after a local choice of sign).&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Local Curvature and Neck Estimates&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:79,&quot;ref&quot;:&quot;MT:ch4:4.19,MT:ch4:4.20&quot;},{&quot;id&quot;:&quot;f493bd5c56ad&quot;,&quot;label&quot;:&quot;lem:pre-failure-kappa-limit&quot;,&quot;title&quot;:&quot;Pre-failure KAPPA-limit noncollapsing&quot;,&quot;display_title&quot;:&quot;Lemma 3.25: Pre-failure KAPPA-limit noncollapsing&quot;,&quot;body&quot;:&quot;Take the diagonal first-failure sequence with stage parameters\n$r_a\\downarrow0$, surgery controls $0&lt;\\delta_a\\le\\delta(r_a)$, where\n$\\delta(r_a)$ denotes the fixed selector value from\n\\ref{def:stagewise-delta-selector}, and\n$\\delta_a\\to0$, and failure points $(x_a,t_a)$ chosen after the preceding\ncanonical-neighborhood interval.  After translating $t_a$ to zero and\nrescaling by $Q_a=R(x_a,t_a)\\to\\infty$, the negative-time truncations satisfy\nthe Morgan--Tian/Kleiner--Lott noncollapsing predicate with one constant\n$\\kappa_0&gt;0$ on every scale below $\\epsilon$: every admissible test ball has\nvolume at least $\\kappa_0\\rho^3$, unless its centre lies in a compact\npositive-sectional-curvature component.  The predicate is uniform on every\nfixed compact spacetime region and is inherited by smooth pointed limits.\nIf the selected basepoint component is not positive, the ordinary volume\nbranch holds at every admissible based ball, including the fixed radius used\nfor Hamilton compactness.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;First-Failure Extension&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:125,&quot;ref&quot;:&quot;MT:ch17:17.1,MT:ch14:14.14,MT:ch14:14.15&quot;},{&quot;id&quot;:&quot;f52d6bda93a2&quot;,&quot;label&quot;:&quot;prop:universal-nonround-kappa&quot;,&quot;title&quot;:&quot;Universal noncollapsing for nonround kappa-solutions&quot;,&quot;display_title&quot;:&quot;Proposition 3.5: Universal noncollapsing for nonround kappa-solutions&quot;,&quot;body&quot;:&quot;There is a universal $\\kappa_*&gt;0$ such that every nonround\nthree-dimensional $\\kappa$-solution is uniformly $\\kappa_*$-noncollapsed:\nfor every $t\\le0$, $x\\in M_t$, and every $r&gt;0$ for which the backward\nparabolic ball is defined and satisfies $|\\operatorname{Rm}|\\le r^{-2}$,\n\\[\n \\operatorname{Vol}_{g(t)}B_{g(t)}(x,r)\\ge\\kappa_*r^3.\n\\]\nThe constant $\\kappa_*$ depends only on the dimension, not on the supplied\n$\\kappa$ or on the particular nonround solution; equivalently, every such\nflow is a $\\kappa_*$-solution in the sense of \\ref{def:kappa-solution}.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solutions and Asymptotic Models&quot;,&quot;kind&quot;:&quot;proposition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:105,&quot;ref&quot;:&quot;MT:ch9:9.58&quot;},{&quot;id&quot;:&quot;f538fa47d10b&quot;,&quot;label&quot;:&quot;lem:ramp-annulus-nondegeneration&quot;,&quot;title&quot;:&quot;Ramp nondegeneration&quot;,&quot;display_title&quot;:&quot;Lemma 5.38: Ramp nondegeneration&quot;,&quot;body&quot;:&quot;Let $(M,h)$ be a compact Riemannian three-manifold and equip\n$M\\times S^1_\\lambda$ with the product metric $\\bar h=h+ds^2$.  Let\n$c_0,c_1\\colon S^1\\to M\\times S^1_\\lambda$ be degree-one ramps in the\nsame free homotopy class, and let\n$F\\colon S^1\\times[0,1]\\to M\\times S^1_\\lambda$ span them.  For every\nessential simple closed domain curve $\\alpha$,\n\\[\n L_{\\bar h}(F\\circ\\alpha)\\ge L_{ds^2}(S^1_\\lambda)&gt;0.\n\\]\nThe same bound holds while both curves evolve by smooth curve shrinking.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Controlled Loop-Family Deformation&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:216,&quot;ref&quot;:&quot;MT:ch19:19.15&quot;},{&quot;id&quot;:&quot;f82e94abd991&quot;,&quot;label&quot;:&quot;lem:epsilon-neck-geodesic-axis-alignment&quot;,&quot;title&quot;:&quot;Long minimizing geodesics align with a neck axis&quot;,&quot;display_title&quot;:&quot;Lemma 2.42: Long minimizing geodesics align with a neck axis&quot;,&quot;body&quot;:&quot;For every $\\alpha&gt;0$ there is $\\epsilon_0(\\alpha)&gt;0$ such that, in a\nnormalized $\\epsilon$-neck with $\\epsilon\\le\\epsilon_0$, every minimizing\ngeodesic of length greater than $\\epsilon^{-1}/100$ which crosses in the\npositive axial direction has tangent within $\\alpha$ of the axial unit\nvector at every point of the geodesic contained in the neck.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Local Curvature and Neck Estimates&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:84,&quot;ref&quot;:&quot;MT:ch19:19.4&quot;},{&quot;id&quot;:&quot;f9d799d02acb&quot;,&quot;label&quot;:&quot;lem:actual-disappearing-component-frontier-saturation&quot;,&quot;title&quot;:&quot;Actual disappearing components have saturated neck frontier&quot;,&quot;display_title&quot;:&quot;Lemma 6.11: Actual disappearing components have saturated neck frontier&quot;,&quot;body&quot;:&quot;Let $({\\mathcal M},G)$ satisfy Assumptions (1)--(7), let $t$ be a singular\ntime, and let $t^-&lt;t$ be regular and sufficiently close to $t$.  If a connected\ncomponent $D$ of the actual disappearing region\n$D_{t^-}=M_{t^-}\\setminus C_{t^-}$ is not a whole connected component of\n$M_{t^-}$ (where the presurgery slice is compact, smooth, and boundaryless),\nthen $D$ has nonempty frontier and $\\overline D$ is a\ncompact codimension-zero smooth submanifold,\n\\[\n \\operatorname{Fr}_{M_{t^-}}D=S_1\\sqcup\\cdots\\sqcup S_m\n\\]\nis a finite union of pairwise disjoint embedded $2$-spheres, and every\n$S_j$ is the backward image of a component of $\\Sigma_t$ and hence the central\nsphere of the corresponding strong neck in the maximal presurgery extension.\nEvery point of $D$ is either an $\\epsilon$-neck center or belongs to the core\nof a $(C,\\epsilon)$-cap.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Reversing One Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:246,&quot;ref&quot;:&quot;MT:ch15:15.2,MT:ch15:15.3&quot;},{&quot;id&quot;:&quot;fa6d9839e669&quot;,&quot;label&quot;:&quot;lem:two-sphere-width-regular-continuity&quot;,&quot;title&quot;:&quot;Continuity of the two-sphere width at regular times&quot;,&quot;display_title&quot;:&quot;Lemma 5.6: Continuity of the two-sphere width at regular times&quot;,&quot;body&quot;:&quot;On a closed surgery-free interval on which the component is identified by\nthe Ricci-flow time vector field and has nonzero $\\pi_2$, the function $W_2$\nis continuous.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Two-Sphere Width Control&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:184,&quot;ref&quot;:&quot;MT:ch18:18.11,MT:ch18:18.13&quot;},{&quot;id&quot;:&quot;fa9220655baf&quot;,&quot;label&quot;:&quot;def:essential-sphere-family-complexity&quot;,&quot;title&quot;:&quot;Essential sphere family and surgery complexity&quot;,&quot;display_title&quot;:&quot;Definition 5.12: Essential sphere family and surgery complexity&quot;,&quot;body&quot;:&quot;For a compact three-manifold $X$, an essential sphere family is a finite\ndisjoint family $F$ of embedded two-spheres such that each member is not\nnull-homotopic in $X$ and no two distinct members are homotopic in $X$.\nWrite\n\\[\n s(X)=\\max\\{\\#F:F\\text{ is an essential sphere family in }X\\}.\n\\]\nThe finiteness of this maximum is supplied by\n\\ref{lem:essential-sphere-family-finiteness}.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Two-Sphere Width Control&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:190,&quot;ref&quot;:&quot;MT:ch18:18.8&quot;},{&quot;id&quot;:&quot;faaa7ab069aa&quot;,&quot;label&quot;:&quot;lem:conformal-surgery-curvature-comparison&quot;,&quot;title&quot;:&quot;Conformal curvature comparison on the neck side&quot;,&quot;display_title&quot;:&quot;Lemma 1.15: Conformal curvature comparison on the neck side&quot;,&quot;body&quot;:&quot;Let $h$ be a metric $C^{\\lfloor1/\\delta\\rfloor}$-close to\n$h_0+ds^2$ on $S^2\\times I$, and put $\\widehat h=e^{-2f}h$ with\n$f=C_0\\delta e^{-q/s}$ for $s&gt;0$.  Choose $K$ so that every curvature\neigenvalue of a scale-one $\\delta$-neck is at least $-K\\delta$.\nThere are universal choices $q\\gg(A_0+4)^2$, $C_0=2Ke^q$, and\n$\\delta_*&gt;0$ such that, whenever $0&lt;\\delta\\le\\delta_*$ and $0&lt;s&lt;4$,\nthe scalar curvature of\n$\\widehat h$ is at least that of $h$, and the least eigenvalue of its\ncurvature operator is strictly larger than that of $h$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:14,&quot;ref&quot;:&quot;MT:ch13:13.5,MT:ch13:13.6,MT:ch13:13.7,MT:ch13:13.8,MT:ch13:13.9,MT:ch13:13.10,MT:ch13:13.11,MT:ch13:13.12&quot;},{&quot;id&quot;:&quot;fb27b70fd4ff&quot;,&quot;label&quot;:&quot;lem:product-circle-parallel-geometry&quot;,&quot;title&quot;:&quot;Product-circle geometry&quot;,&quot;display_title&quot;:&quot;Theorem 4.3: Product-circle geometry&quot;,&quot;body&quot;:&quot;On $(M,g(t))\\times(S^1_\\lambda,ds^2)$ let $U$ be the oriented unit tangent\nto the circle factor.  Then $\\nabla U=0$ and\n$\\operatorname{Ric}(V,U)=0$ for every tangent vector $V$; both assertions are\nindependent of $\\lambda&gt;0$.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Product-Circle Geometry and Ramp Setup&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:141,&quot;ref&quot;:&quot;MT:ch19:19.11&quot;},{&quot;id&quot;:&quot;fc31a601123a&quot;,&quot;label&quot;:&quot;thm:poincare-conjecture&quot;,&quot;title&quot;:&quot;Poincare conjecture&quot;,&quot;display_title&quot;:&quot;Theorem 6.43: Poincare conjecture&quot;,&quot;body&quot;:&quot;Every compact, connected, smooth $3$-manifold without boundary which is\nsimply connected in the sense of \\ref{def:simply-connected} is diffeomorphic\nto $S^3$.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Simple Connectivity&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:278,&quot;ref&quot;:&quot;MT:intro:0.2(a)&quot;},{&quot;id&quot;:&quot;fd268164d548&quot;,&quot;label&quot;:&quot;lem:compact-family-polygonal-approximation&quot;,&quot;title&quot;:&quot;Uniform polygonal approximation on compact families&quot;,&quot;display_title&quot;:&quot;Theorem 4.18: Uniform polygonal approximation on compact families&quot;,&quot;body&quot;:&quot;Let $K$ be a compact set of $C^1$ loops, with the $C^1$ topology, and let\n$\\zeta&gt;0$.  There is $N=N(K,\\zeta)$ such that the two conclusions of\n\\ref{lem:single-loop-polygonal-approximation} hold for every $c\\in K$ and\nevery $n\\ge N$.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Polygonal Ramp Approximation&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:156,&quot;ref&quot;:&quot;MT:ch19:19.20&quot;},{&quot;id&quot;:&quot;fdaab108b288&quot;,&quot;label&quot;:&quot;def:standard-surgery-cap-model&quot;,&quot;title&quot;:&quot;Standard surgery-cap model&quot;,&quot;display_title&quot;:&quot;Definition 1.8: Standard surgery-cap model&quot;,&quot;body&quot;:&quot;Fix a complete rotationally symmetric metric $g_0$ on $\\mathbb R^3$ with\nnonnegative sectional curvature and tip $p_0$.  Fix constants\n$A_0&gt;r_0&gt;0$ such that $g_0$ has constant sectional curvature $1/4$ on\n$B_{g_0}(p_0,r_0)$ and there is an isometry\n\\[\n \\psi\\colon(S^2\\times(-\\infty,4],h_0+ds^2)\n \\longrightarrow(\\mathbb R^3\\setminus B_{g_0}(p_0,A_0),g_0).\n\\]\nExtend the cylinder coordinate to a continuous radial function by\n\\[\n s_1(y)=A_0+4-d_{g_0}(p_0,y).\n\\]\nIt is smooth away from $p_0$ and has round two-sphere level sets.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:7,&quot;ref&quot;:&quot;MT:ch12:12.2,MT:ch12:12.3&quot;},{&quot;id&quot;:&quot;fe7d11cd444e&quot;,&quot;label&quot;:&quot;def:thurston-geometrized&quot;,&quot;title&quot;:&quot;Thurston-geometrized closed three-manifold&quot;,&quot;display_title&quot;:&quot;Definition 6.26: Thurston-geometrized closed three-manifold&quot;,&quot;body&quot;:&quot;Let $M$ be a connected closed orientable smooth $3$-manifold.  We call $M$\n\\emph{geometrized} if there are closed connected smooth $3$-manifolds\n$P_1,\\ldots,P_n$, each orientable, and a diffeomorphism\n$M\\cong P_1\\#\\cdots\\#P_n$ such that, for every $i$, there is a compact\ncodimension-zero submanifold $G_i\\subset P_i$ (possibly empty or all of\n$P_i$) whose nonempty boundary components are tori and for which\n\\begin{enumerate}\n\\item $G_i$ is a graph manifold: it is obtained from finitely many products\n      $S^1\\times P_{ij}$, with $P_{ij}$ a pair of pants, and finitely many\n      products $S^1\\times D^2_{ij}$ by pairing an even number of boundary\n      tori by diffeomorphisms and gluing, with the gluing chosen so that\n      $G_i$ is orientable;\n\\item the interior of $P_i\\setminus G_i$ admits a complete metric of\n      constant negative sectional curvature and finite volume; and\n\\item for every boundary torus $T\\subset\\partial G_i$, the inclusion\n      $\\pi_1(T)\\to\\pi_1(P_i)$ is injective.\n\\end{enumerate}\nThe cases $G_i=\\varnothing$ and $G_i=P_i$ are allowed (the latter is the\nclosed graph-manifold case).  Equivalently, this is the finite-volume\nlocally-homogeneous formulation obtained by cutting along the displayed\nincompressible tori.  This definition is only for connected, closed,\norientable manifolds; no orientation-double-cover convention is folded into\nthe term ``geometrized.&#x27;&#x27;&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Backward Reconstruction from Extinction&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:261,&quot;ref&quot;:&quot;KL:app:geom,MT:ch15:15.4&quot;},{&quot;id&quot;:&quot;ff09b9b55dd8&quot;,&quot;label&quot;:&quot;thm:bounded-curvature-at-bounded-distance&quot;,&quot;title&quot;:&quot;Bounded curvature at bounded distance&quot;,&quot;display_title&quot;:&quot;Theorem 2.55: Bounded curvature at bounded distance&quot;,&quot;body&quot;:&quot;For sufficiently small $\\epsilon&gt;0$ and every $A,C&lt;\\infty$, there are\n$D_0=D_0(A,C,\\epsilon)$ and $D=D(A,C,\\epsilon)$ with the following\nproperty.  Let $x$ lie in a three-dimensional Ricci flow with surgery whose\ncurvature is pinched toward positive.  Suppose every point $z$ at time at\nmost $\\mathbf t(x)$ with $R(z)\\ge4R(x)$ has a strong\n$(C,\\epsilon)$-canonical neighborhood.  If $R(x)\\ge D_0$, then\n\\[\n R(y)\\le D R(x)\n \\qquad\\text{for every }y\\in\n B_{g(\\mathbf t(x))}\\bigl(x,A R(x)^{-1/2}\\bigr).\n\\]&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:97,&quot;ref&quot;:&quot;MT:ch10:10.2&quot;},{&quot;id&quot;:&quot;ff8bc7c2e43e&quot;,&quot;label&quot;:&quot;thm:normalized-short-time-ricci-flow&quot;,&quot;title&quot;:&quot;Normalized short-time flow&quot;,&quot;display_title&quot;:&quot;Theorem 2.22: Normalized short-time flow&quot;,&quot;body&quot;:&quot;There is a universal $\\kappa_0&gt;0$ such that every normalized compact\nthree-manifold $(M,g_0)$ admits a unique Ricci flow $g(t)$ on\n$[0,2^{-5}]$ with $g(0)=g_0$.  On this interval\n\\[\n |\\operatorname{Rm}_{g(t)}|\\le2,\n \\qquad\n \\operatorname{Vol}_{g(t)}B_{g(t)}(x,\\rho)\\ge\\kappa_0\\rho^3\n \\quad(0&lt;\\rho\\le1).\n\\]\nConsequently this interval has no surgery time and supplies the initial\nstage of a controlled Ricci flow with surgery.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:64,&quot;ref&quot;:&quot;MT:ch3:3.11,MT:ch4:4.11,MT:ch5:5.16,MT:ch15:15.1&quot;}],&quot;edges&quot;:[{&quot;from&quot;:&quot;0a5091c62134&quot;,&quot;to&quot;:&quot;0071c4676014&quot;},{&quot;from&quot;:&quot;52c756bceff7&quot;,&quot;to&quot;:&quot;0071c4676014&quot;},{&quot;from&quot;:&quot;561f6019df62&quot;,&quot;to&quot;:&quot;0071c4676014&quot;},{&quot;from&quot;:&quot;5fcc1cb5b7db&quot;,&quot;to&quot;:&quot;0071c4676014&quot;},{&quot;from&quot;:&quot;6364ac4cf64c&quot;,&quot;to&quot;:&quot;0071c4676014&quot;},{&quot;from&quot;:&quot;8dd1bd7dd325&quot;,&quot;to&quot;:&quot;0071c4676014&quot;},{&quot;from&quot;:&quot;a8a4aa399c74&quot;,&quot;to&quot;:&quot;0071c4676014&quot;},{&quot;from&quot;:&quot;c498839d073a&quot;,&quot;to&quot;:&quot;0071c4676014&quot;},{&quot;from&quot;:&quot;7f625d515a74&quot;,&quot;to&quot;:&quot;018d5ec3ba13&quot;},{&quot;from&quot;:&quot;46b654fc3e42&quot;,&quot;to&quot;:&quot;01b32c767069&quot;},{&quot;from&quot;:&quot;841228a21206&quot;,&quot;to&quot;:&quot;01b32c767069&quot;},{&quot;from&quot;:&quot;8b2abffda757&quot;,&quot;to&quot;:&quot;01b32c767069&quot;},{&quot;from&quot;:&quot;964de89f5091&quot;,&quot;to&quot;:&quot;01b32c767069&quot;},{&quot;from&quot;:&quot;b4dc4b9a6187&quot;,&quot;to&quot;:&quot;01b32c767069&quot;},{&quot;from&quot;:&quot;bf415d488cc7&quot;,&quot;to&quot;:&quot;01b32c767069&quot;},{&quot;from&quot;:&quot;e788faf5248f&quot;,&quot;to&quot;:&quot;01b32c767069&quot;},{&quot;from&quot;:&quot;21df66602bb6&quot;,&quot;to&quot;:&quot;01ca8edf0b34&quot;},{&quot;from&quot;:&quot;23c07f13aad2&quot;,&quot;to&quot;:&quot;01ca8edf0b34&quot;},{&quot;from&quot;:&quot;356e0995b890&quot;,&quot;to&quot;:&quot;01ca8edf0b34&quot;},{&quot;from&quot;:&quot;93db3db3435a&quot;,&quot;to&quot;:&quot;01ca8edf0b34&quot;},{&quot;from&quot;:&quot;d3773f5a6e9c&quot;,&quot;to&quot;:&quot;01ca8edf0b34&quot;},{&quot;from&quot;:&quot;d5e974cc0     }
    function layerSpan(maxDepth, levels) {
      if (Number.isFinite(maxDepth)) return Math.max(1, maxDepth);
      const observed = [...levels.values()];
      return Math.max(1, ...observed);
    }
    function layerOpacity(level, maxDepth, levels) {
      const span = layerSpan(maxDepth, levels);
      if (span &lt;= 1 || level &lt;= 1) return 1;
      const t = Math.max(0, Math.min(1, (level - 1) / Math.max(1, span - 1)));
      return Math.max(0.42, 1 - t * 0.54);
    }
    function layerStrength(level, maxDepth, levels) {
      const span = layerSpan(maxDepth, levels);
      if (span &lt;= 1 || level &lt;= 1) return 80;
      const t = Math.max(0, Math.min(1, (level - 1) / Math.max(1, span - 1)));
      return Math.round(92 - t * 38);
    }
    function focusEdgeStyle(edge, focusedId, levels, dirs) {
      const fromLevel = levels.get(edge.from);
      const toLevel = levels.get(edge.to);
      if (fromLevel == null || toLevel == null) return null;
      const edgeLevel = Math.max(fromLevel, toLevel);
      // Keep only edges that step between consecutive layers (or touch the focus).
      if (Math.abs(fromLevel - toLevel) !== 1 &amp;&amp; !(fromLevel === 0 || toLevel === 0)) return null;
      let relation;
      if (edge.to === focusedId || (dirs.get(edge.from) === &quot;in&quot; &amp;&amp; dirs.get(edge.to) !== &quot;out&quot;)) {
        relation = &quot;incoming&quot;;
      } else if (edge.from === focusedId || (dirs.get(edge.to) === &quot;out&quot; &amp;&amp; dirs.get(edge.from) !== &quot;in&quot;)) {
        relation = &quot;outgoing&quot;;
      } else if (fromLevel &lt; toLevel) {
        relation = &quot;outgoing&quot;;
      } else {
        relation = &quot;incoming&quot;;
      }
      const color = layerColor(relation, edgeLevel);
      return { relation, color, edgeLevel };
    }

    function render() {
      const visibleNodeIds = new Set(displayedNodes().map((node) =&gt; node.id));
      canvas.querySelectorAll(&quot;.chapter-column&quot;).forEach((node) =&gt; node.remove());
      for (const [index, chapter] of DATA.chapters.entries()) {
        const column = document.createElement(&quot;section&quot;);
        column.className = &quot;chapter-column&quot;;
        column.dataset.chapter = chapter.title;
        column.style.setProperty(&quot;--chapter-color&quot;, chapterColor(index));
        const count = chapter.sections.reduce((sum, section) =&gt; sum + section.nodes.filter((node) =&gt; visibleNodeIds.has(node.id)).length, 0);
        if (!count) continue;
        column.innerHTML = `&lt;header class=&quot;chapter-head&quot;&gt;&lt;div class=&quot;chapter-kicker&quot;&gt;Stage ${String(index + 1).padStart(2, &quot;0&quot;)}&lt;/div&gt;&lt;h2&gt;${escapeHtml(chapter.title)}&lt;/h2&gt;&lt;div class=&quot;chapter-count&quot;&gt;${count} statement${count === 1 ? &quot;&quot; : &quot;s&quot;}&lt;/div&gt;&lt;/header&gt;&lt;div class=&quot;chapter-body&quot;&gt;&lt;/div&gt;`;
        const body = column.querySelector(&quot;.chapter-body&quot;);
        for (const section of chapter.sections) {
          const group = document.createElement(&quot;section&quot;);
          group.className = &quot;section-group&quot;;
          group.dataset.section = section.title;
          const sectionNodes = section.nodes.filter((node) =&gt; visibleNodeIds.has(node.id));
          if (!sectionNodes.length) continue;
          group.innerHTML = `&lt;header class=&quot;section-head&quot;&gt;&lt;h3&gt;${escapeHtml(section.title)}&lt;/h3&gt;&lt;span&gt;${sectionNodes.length}&lt;/span&gt;&lt;/header&gt;&lt;div class=&quot;node-list&quot;&gt;&lt;/div&gt;`;
          const list = group.querySelector(&quot;.node-list&quot;);
          for (const node of sectionNodes) {
            const card = document.createElement(&quot;div&quot;);
            card.className = &quot;node-card&quot;;
            card.tabIndex = 0;
            card.setAttribute(&quot;role&quot;, &quot;button&quot;);
            card.setAttribute(&quot;aria-pressed&quot;, &quot;false&quot;);
            card.dataset.node = node.id;
            card.dataset.chapter = chapter.title;
            card.dataset.status = node.status;
            card.dataset.search = `${node.title} ${node.label} ${node.kind}`.toLowerCase();
            card.innerHTML = `&lt;span class=&quot;node-title&quot;&gt;${escapeHtml(node.display_title || node.title)}&lt;/span&gt;&lt;span class=&quot;node-depth-badge&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;button class=&quot;node-preview-toggle&quot; type=&quot;button&quot; title=&quot;Show statement preview&quot; aria-label=&quot;Show statement preview&quot; aria-expanded=&quot;false&quot;&gt;›&lt;/button&gt;`;
            card.addEventListener(&quot;click&quot;, () =&gt; selectNode(node.id));
            card.addEventListener(&quot;keydown&quot;, (event) =&gt; {
              if (event.target !== card || event.key !== &quot;Enter&quot; &amp;&amp; event.key !== &quot; &quot;) return;
              event.preventDefault();
              selectNode(node.id);
            });
            card.querySelector(&quot;.node-preview-toggle&quot;).addEventListener(&quot;click&quot;, (event) =&gt; {
              event.stopPropagation();
              toggleDetail(node.id, card);
            });
            list.appendChild(card);
          }
          body.appendChild(group);
        }
        canvas.appendChild(column);
      }
      chapterSelect.querySelectorAll(&quot;option:not(:first-child)&quot;).forEach((option) =&gt; option.remove());
      for (const chapter of DATA.chapters) {
        const option = document.createElement(&quot;option&quot;);
        option.value = chapter.title;
        option.textContent = chapter.title;
        chapterSelect.appendChild(option);
      }
      stat.textContent = `${visibleNodeIds.size}/${DATA.stats.nodes} statements · ${displayedEdges().length} dependency links`;
      requestAnimationFrame(() =&gt; {
        measure();
        fitMap(false);
      });
    }

    function measure() {
      canvas.style.transform = &quot;none&quot;;
      const columns = [...canvas.querySelectorAll(&quot;.chapter-column&quot;)];
      const style = getComputedStyle(canvas);
      const paddingRight = Number.parseFloat(style.paddingRight) || 0;
      const paddingBottom = Number.parseFloat(style.paddingBottom) || 0;
      baseWidth = Math.ceil(Math.max(...columns.map((column) =&gt; column.offsetLeft + column.offsetWidth), 1) + paddingRight);
      baseHeight = Math.ceil(Math.max(...columns.map((column) =&gt; column.offsetTop + column.offsetHeight), 1) + paddingBottom);
      canvas.style.transform = `scale(${zoom})`;
      scene.style.width = `${Math.max(viewport.clientWidth, Math.ceil(baseWidth * zoom))}px`;
      scene.style.height = `${Math.max(viewport.clientHeight, Math.ceil(baseHeight * zoom))}px`;
      for (const layer of [edgeLayer, focusEdgeLayer]) {
        layer.setAttribute(&quot;width&quot;, String(baseWidth));
        layer.setAttribute(&quot;height&quot;, String(baseHeight));
        layer.setAttribute(&quot;viewBox&quot;, `0 0 ${baseWidth} ${baseHeight}`);
      }
    }

    function drawArrowhead(layer, path, color, classes = [], focused = false, opacity = null) {
      const length = path.getTotalLength();
      if (!Number.isFinite(length) || length &lt;= 0) return;
      const tip = path.getPointAtLength(length);
      const sampleDistance = Math.min(14, Math.max(4, length * .25));
      const before = path.getPointAtLength(Math.max(0, length - sampleDistance));
      const angle = Math.atan2(tip.y - before.y, tip.x - before.x) * 180 / Math.PI;
      const headLength = focused ? 10 : 8.5;
      const halfWidth = focused ? 5 : 4.25;
      const arrowhead = document.createElementNS(&quot;http://www.w3.org/2000/svg&quot;, &quot;polygon&quot;);
      arrowhead.classList.add(&quot;edge-arrowhead&quot;, ...classes);
      arrowhead.setAttribute(&quot;points&quot;, `0,0 ${-headLength},${-halfWidth} ${-headLength},${halfWidth}`);
      arrowhead.setAttribute(&quot;transform&quot;, `translate(${tip.x} ${tip.y}) rotate(${angle})`);
      arrowhead.setAttribute(&quot;fill&quot;, color);
      if (opacity != null) {
        arrowhead.setAttribute(&quot;fill-opacity&quot;, String(opacity));
        arrowhead.style.opacity = String(opacity);
      }
      layer.appendChild(arrowhead);
    }

    function drawEdges() {
      const rect = canvas.getBoundingClientRect();
      edgeLayer.querySelectorAll(&quot;.edge-path, .edge-arrowhead&quot;).forEach((element) =&gt; element.remove());
      focusEdgeLayer.querySelectorAll(&quot;.edge-path, .edge-arrowhead&quot;).forEach((element) =&gt; element.remove());
      edgeLayer.classList.toggle(&quot;muted&quot;, !!focusedId);
      const edges = displayedEdges();
      const maxDepth = depthSelect.value === &quot;all&quot; ? Number.POSITIVE_INFINITY : Number(depthSelect.value);
      const neighborhood = focusedId ? dependencyNeighborhood(focusedId, edges, maxDepth) : { levels: new Map(), dirs: new Map() };
      const { levels, dirs } = neighborhood;
      for (const edge of edges) {
        const from = canvas.querySelector(`[data-node=&quot;${CSS.escape(edge.from)}&quot;]`);
        const to = canvas.querySelector(`[data-node=&quot;${CSS.escape(edge.to)}&quot;]`);
        if (!from || !to) continue;
        const a = from.getBoundingClientRect();
        const b = to.getBoundingClientRect();
        const sameChapter = byId.get(edge.from)?.chapter === byId.get(edge.to)?.chapter;
        const x1 = (a.right - rect.left) / zoom;
        const y1 = (a.top + a.height / 2 - rect.top) / zoom;
        const x2 = ((sameChapter ? b.right : b.left) - rect.left) / zoom;
        const y2 = (b.top + b.height / 2 - rect.top) / zoom;
        let pathData;
        if (sameChapter) {
          const right = Math.max(x1, x2) + 16;
          pathData = `M ${x1} ${y1} C ${right} ${y1}, ${right} ${y2}, ${x2} ${y2}`;
        } else {
          const delta = Math.max(28, Math.abs(x2 - x1) * .34);
          const direction = x2 &gt;= x1 ? 1 : -1;
          pathData = `M ${x1} ${y1} C ${x1 + delta * direction} ${y1}, ${x2 - delta * direction} ${y2}, ${x2} ${y2}`;
        }
        const focusStyle = focusedId ? focusEdgeStyle(edge, focusedId, levels, dirs) : null;
        if (focusStyle) {
          const opacity = layerOpacity(focusStyle.edgeLevel, maxDepth, levels);
          const focusPath = document.createElementNS(&quot;http://www.w3.org/2000/svg&quot;, &quot;path&quot;);
          focusPath.classList.add(&quot;edge-path&quot;, &quot;edge-focus&quot;, `edge-${focusStyle.relation}`);
          focusPath.dataset.layer = String(focusStyle.edgeLevel);
          focusPath.dataset.relation = focusStyle.relation;
          focusPath.setAttribute(&quot;d&quot;, pathData);
          focusPath.setAttribute(&quot;stroke&quot;, focusStyle.color);
          focusPath.setAttribute(&quot;stroke-opacity&quot;, String(opacity));
          focusPath.style.stroke = focusStyle.color;
          focusPath.style.opacity = String(opacity);
          focusEdgeLayer.appendChild(focusPath);
          drawArrowhead(focusEdgeLayer, focusPath, focusStyle.color, [`edge-${focusStyle.relation}`], true, opacity);
        } else if (!focusedId) {
          const path = document.createElementNS(&quot;http://www.w3.org/2000/svg&quot;, &quot;path&quot;);
          path.classList.add(&quot;edge-path&quot;);
          if (!sameChapter) path.classList.add(&quot;edge-cross&quot;);
          path.setAttribute(&quot;d&quot;, pathData);
          edgeLayer.appendChild(path);
          drawArrowhead(edgeLayer, path, sameChapter ? &quot;#8fb1df&quot; : &quot;#6f95cb&quot;, sameChapter ? [] : [&quot;edge-cross&quot;]);
        }
      }
    }

    function refreshFocusPresentation() {
      const maxDepth = depthSelect.value === &quot;all&quot; ? Number.POSITIVE_INFINITY : Number(depthSelect.value);
      const edges = displayedEdges();
      const neighborhood = focusedId
        ? dependencyNeighborhood(focusedId, edges, maxDepth)
        : { levels: new Map(), dirs: new Map() };
      const { levels, dirs } = neighborhood;
      const query = search.value.trim().toLowerCase();
      const selectedStatus = status.value;
      const selectedChapter = chapterSelect.value;
      let visible = 0;
      canvas.querySelectorAll(&quot;.node-card&quot;).forEach((card) =&gt; {
        const nodeId = card.dataset.node;
        const node = byId.get(nodeId);
        const isSelected = nodeId === focusedId;
        const level = levels.get(nodeId);
        const dir = dirs.get(nodeId);
        const isChapter = selectedChapter === &quot;all&quot; || card.dataset.chapter === selectedChapter;
        const isStatus = selectedStatus === &quot;all&quot; || card.dataset.status === selectedStatus;
        const isQuery = !query || card.dataset.search.includes(query);
        const filterMatch = isChapter &amp;&amp; isStatus &amp;&amp; isQuery;
        const inNeighborhood = !focusedId || levels.has(nodeId);
        card.classList.toggle(&quot;selected&quot;, isSelected);
        card.setAttribute(&quot;aria-pressed&quot;, String(isSelected));
        card.classList.toggle(&quot;layer-dep&quot;, dir === &quot;in&quot;);
        card.classList.toggle(&quot;layer-use&quot;, dir === &quot;out&quot;);
        card.classList.toggle(&quot;match&quot;, !!query &amp;&amp; isQuery);
        // Depth filter owns visibility; status/search filters only dim within the neighborhood.
        const hideForDepth = !!focusedId &amp;&amp; !inNeighborhood;
        card.style.visibility = hideForDepth ? &quot;hidden&quot; : &quot;&quot;;
        card.style.pointerEvents = hideForDepth ? &quot;none&quot; : &quot;&quot;;
        card.classList.toggle(&quot;dim&quot;, hideForDepth || !filterMatch);
        const layerActive = !!focusedId &amp;&amp; level != null &amp;&amp; level &gt; 0 &amp;&amp; !hideForDepth;
        const depthBadge = card.querySelector(&quot;.node-depth-badge&quot;);
        card.classList.toggle(&quot;layer-active&quot;, layerActive);
        if (layerActive) {
          const relation = dir === &quot;out&quot; ? &quot;outgoing&quot; : &quot;incoming&quot;;
          const color = layerColor(relation, level);
          depthBadge.textContent = `${dir === &quot;out&quot; ? &quot;out&quot; : &quot;in&quot;} ${level}`;
          depthBadge.title = `${dir === &quot;out&quot; ? &quot;Downstream&quot; : &quot;Prerequisite&quot;}, layer ${level}`;
          card.style.setProperty(&quot;--layer-color&quot;, color);
        } else {
          depthBadge.textContent = &quot;&quot;;
          depthBadge.removeAttribute(&quot;title&quot;);
          card.style.removeProperty(&quot;--layer-color&quot;);
        }
        if (level != null &amp;&amp; level &gt; 0 &amp;&amp; filterMatch &amp;&amp; !hideForDepth) {
          card.style.setProperty(&quot;--layer-strength&quot;, String(layerStrength(level, maxDepth, levels)));
          card.style.opacity = String(layerOpacity(level, maxDepth, levels));
        } else {
          card.style.removeProperty(&quot;--layer-strength&quot;);
          card.style.opacity = &quot;&quot;;
        }
        if (filterMatch &amp;&amp; !hideForDepth) visible += 1;
        if (node) card.setAttribute(&quot;aria-label&quot;, `${node.title}, ${statusLabel(node.status)}`);
      });
      canvas.querySelectorAll(&quot;.chapter-column&quot;).forEach((column) =&gt; {
        column.style.opacity = selectedChapter === &quot;all&quot; || column.dataset.chapter === selectedChapter ? &quot;1&quot; : &quot;.35&quot;;
      });
      const edgeCount = focusedId
        ? edges.filter((edge) =&gt; levels.has(edge.from) &amp;&amp; levels.has(edge.to)).length
        : displayedEdges().length;
      stat.textContent = focusedId
        ? `${visible} in ${depthSelect.value === &quot;all&quot; ? &quot;all&quot; : depthSelect.value}-layer focus · ${edgeCount} links`
        : `${visible}/${DATA.stats.nodes} statements · ${edgeCount} dependency links`;
      return { levels, dirs };
    }

    function applyFilters() {
      refreshFocusPresentation();
      drawEdges();
    }

    function linkList(ids, emptyText) {
      if (!ids.length) return `&lt;li&gt;${escapeHtml(emptyText)}&lt;/li&gt;`;
      return ids.slice(0, 12).map((id) =&gt; {
        const node = byId.get(id);
        return node ? `&lt;li&gt;${escapeHtml(node.display_title || node.title)}&lt;/li&gt;` : &quot;&quot;;
      }).join(&quot;&quot;);
    }

    async function discoverKatex() {
      const mainScript = [...window.parent.document.querySelectorAll(&quot;script[type=module][src]&quot;)]
        .map((script) =&gt; script.src)
        .find((source) =&gt; /\/assets\/index-[^/]+\.js$/.test(source));
      if (!mainScript) throw new Error(&quot;hgraph entry bundle was not found&quot;);
      const bundle = await fetch(mainScript).then((response) =&gt; response.text());
      const renderer = bundle.match(/katexLoader-[A-Za-z0-9_-]+\.js/)?.[0];
      const stylesheet = bundle.match(/katexLoader-[A-Za-z0-9_-]+\.css/)?.[0];
      if (!renderer || !stylesheet) throw new Error(&quot;hgraph KaTeX assets were not found&quot;);
      if (!document.querySelector(&#x27;link[data-katex-stylesheet]&#x27;)) {
        const link = document.createElement(&quot;link&quot;);
        link.rel = &quot;stylesheet&quot;;
        link.dataset.katexStylesheet = &quot;&quot;;
        link.href = new URL(stylesheet, new URL(&quot;.&quot;, mainScript)).href;
        document.head.appendChild(link);
      }
      return import(new URL(renderer, new URL(&quot;.&quot;, mainScript)).href).then((module) =&gt; module.default);
    }

    function loadKatex() {
      if (!katexLoader) katexLoader = discoverKatex();
      return katexLoader;
    }

    function typesetDetailBody(id, card) {
      const body = document.querySelector(&quot;#detail-body .detail-statement&quot;);
      if (!body || !body.textContent.includes(&quot;$&quot;) &amp;&amp; !body.textContent.includes(&quot;\\(&quot;) &amp;&amp; !body.textContent.includes(&quot;\\begin&quot;) &amp;&amp; !body.textContent.includes(&quot;begin{&quot;)) return;
      const normalizeMath = (value) =&gt; {
        let text = String(value)
          .replace(/\\?begin\{align\*?\s*[})]?/g, &quot;\\begin{aligned}&quot;)
          .replace(/\\?l?end\{align\*?\s*[})]?/g, &quot;\\end{aligned}&quot;);
        text = text.replace(/(?&lt;!\\\[)\\begin\{aligned\}/g, &quot;\\[\\begin{aligned}&quot;);
        text = text.replace(/\\end\{aligned\}(?!\\\])/g, &quot;\\end{aligned}\\]&quot;);
        return text;
      };
      body.textContent = normalizeMath(body.textContent);
      loadKatex().then((render) =&gt; {
        if (!body.isConnected || previewId !== id) return;
        render(body, {
          delimiters: [
            { left: &quot;\\[&quot;, right: &quot;\\]&quot;, display: true },
            { left: &quot;\\(&quot;, right: &quot;\\)&quot;, display: false },
            { left: &quot;$$&quot;, right: &quot;$$&quot;, display: true },
            { left: &quot;$&quot;, right: &quot;$&quot;, display: false },
          ],
          macros: KATEX_MACROS,
          globalGroup: true,
          throwOnError: false,
        });
        if (previewId === id &amp;&amp; card) placeDetail(card);
      }).catch(() =&gt; {});
    }

    function placeDetail(card) {
      if (!card || !detail.classList.contains(&quot;open&quot;)) return;
      const anchor = card.getBoundingClientRect();
      const viewportRect = viewport.getBoundingClientRect();
      if (anchor.right &lt; viewportRect.left || anchor.left &gt; viewportRect.right || anchor.bottom &lt; viewportRect.top || anchor.top &gt; viewportRect.bottom) {
        closeDetail();
        return;
      }
      const margin = 12;
      const gap = 10;
      const preferredWidth = Math.min(430, window.innerWidth - margin * 2);
      const spaces = {
        right: window.innerWidth - anchor.right - gap - margin,
        left: anchor.left - gap - margin,
        below: window.innerHeight - anchor.bottom - gap - margin,
        above: anchor.top - gap - margin,
      };
      const horizontalSide = spaces.right &gt;= preferredWidth || spaces.left &gt;= preferredWidth
        ? (spaces.right &gt;= spaces.left ? &quot;right&quot; : &quot;left&quot;)
        : null;

      detail.style.left = &quot;auto&quot;;
      detail.style.right = &quot;auto&quot;;
      detail.style.top = &quot;auto&quot;;
      detail.style.bottom = &quot;auto&quot;;
      detail.style.width = `${preferredWidth}px`;
      detail.style.maxHeight = `${Math.min(560, window.innerHeight - margin * 2)}px`;

      if (horizontalSide) {
        detail.style.left = horizontalSide === &quot;right&quot;
          ? `${anchor.right + gap}px`
          : `${anchor.left - gap - preferredWidth}px`;
        const panelHeight = detail.getBoundingClientRect().height;
        detail.style.top = `${Math.max(margin, Math.min(anchor.top, window.innerHeight - panelHeight - margin))}px`;
        detail.dataset.placement = horizontalSide;
        return;
      }

      const verticalSide = spaces.below &gt;= spaces.above ? &quot;below&quot; : &quot;above&quot;;
      const availableHeight = Math.max(80, spaces[verticalSide]);
      detail.style.maxHeight = `${Math.min(560, availableHeight)}px`;
      detail.style.left = `${Math.max(margin, Math.min(anchor.left + anchor.width / 2 - preferredWidth / 2, window.innerWidth - preferredWidth - margin))}px`;
      if (verticalSide === &quot;below&quot;) {
        detail.style.top = `${anchor.bottom + gap}px`;
      } else {
        detail.style.bottom = `${window.innerHeight - anchor.top + gap}px`;
      }
      detail.dataset.placement = verticalSide;
    }

    function openDetail(id, card = canvas.querySelector(`[data-node=&quot;${CSS.escape(id)}&quot;]`)) {
      const node = byId.get(id);
      if (!node) return;
      previewId = id;
      previewAnchor = card;
      canvas.querySelectorAll(&quot;.node-card&quot;).forEach((nodeCard) =&gt; {
        const isOpen = nodeCard.dataset.node === id;
        nodeCard.classList.toggle(&quot;preview-open&quot;, isOpen);
        const button = nodeCard.querySelector(&quot;.node-preview-toggle&quot;);
        button.setAttribute(&quot;aria-expanded&quot;, String(isOpen));
        button.setAttribute(&quot;aria-label&quot;, isOpen ? &quot;Hide statement preview&quot; : &quot;Show statement preview&quot;);
        button.title = isOpen ? &quot;Hide statement preview&quot; : &quot;Show statement preview&quot;;
      });
      document.getElementById(&quot;detail-kind&quot;).textContent = node.kind;
      document.getElementById(&quot;detail-title&quot;).textContent = node.title;
      document.getElementById(&quot;detail-label&quot;).textContent = node.label;
      document.getElementById(&quot;detail-chapter&quot;).textContent = node.chapter;
      document.getElementById(&quot;detail-section&quot;).textContent = node.section;
      document.getElementById(&quot;detail-status&quot;).textContent = statusLabel(node.status);
      const sourceRef = node.ref || node.label || node.id;
      document.getElementById(&quot;detail-ref&quot;).textContent = sourceRef;
      document.getElementById(&quot;detail-body&quot;).innerHTML = `&lt;div class=&quot;detail-source-ref&quot;&gt;Original source / dcref: &lt;code&gt;${escapeHtml(sourceRef)}&lt;/code&gt;&lt;/div&gt;&lt;div class=&quot;detail-statement&quot;&gt;${escapeHtml(node.body || &quot;No statement text was captured for this node.&quot;)}&lt;/div&gt;`;
      document.getElementById(&quot;detail-deps&quot;).innerHTML = linkList(incoming.get(id) || [], &quot;No prerequisites in the current blueprint.&quot;);
      document.getElementById(&quot;detail-used-by&quot;).innerHTML = linkList(outgoing.get(id) || [], &quot;No downstream consumers in the current blueprint.&quot;);
      detail.classList.add(&quot;open&quot;);
      if (card) {
        placeDetail(card);
      }
      typesetDetailBody(id, card);
    }

    function toggleDetail(id, card) {
      if (previewId === id &amp;&amp; detail.classList.contains(&quot;open&quot;)) {
        closeDetail();
      } else {
        openDetail(id, card);
      }
    }

    function closeDetail() {
      previewId = null;
      previewAnchor = null;
      detail.classList.remove(&quot;open&quot;);
      delete detail.dataset.placement;
      canvas.querySelectorAll(&quot;.node-card.preview-open&quot;).forEach((card) =&gt; {
        card.classList.remove(&quot;preview-open&quot;);
        const button = card.querySelector(&quot;.node-preview-toggle&quot;);
        button.setAttribute(&quot;aria-expanded&quot;, &quot;false&quot;);
        button.setAttribute(&quot;aria-label&quot;, &quot;Show statement preview&quot;);
        button.title = &quot;Show statement preview&quot;;
      });
    }

    function selectNode(id) {
      focusedId = focusedId === id ? null : id;
      refreshFocusPresentation();
      drawEdges();
    }

    function setZoom(next, keepFit = false) {
      zoom = Math.max(.08, Math.min(4, next));
      fitMode = keepFit;
      measure();
      drawEdges();
    }

    function fitMap(smooth = true) {
      measure();
