quot;2afe5ab2efbb&quot;,&quot;label&quot;:&quot;lem:radial-surgery-map-nonexpanding&quot;,&quot;title&quot;:&quot;The radial surgery map is nonexpanding&quot;,&quot;display_title&quot;:&quot;Lemma 1.12: The radial surgery map is nonexpanding&quot;,&quot;body&quot;:&quot;Regard the map $\\xi$ of\n\\ref{lem:standard-cap-radial-collapse-nonexpanding} as a map from $N$\nto the surgery manifold $\\mathcal S$.  Then\n\\[\n \\xi\\colon(N,g)\\longrightarrow(\\mathcal S,\\widetilde g)\n\\]\nis distance nonincreasing.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:11,&quot;ref&quot;:&quot;MT:ch13:13.2&quot;},{&quot;id&quot;:&quot;2c2530143515&quot;,&quot;label&quot;:&quot;def:curve-flow-local-graph-coordinates&quot;,&quot;title&quot;:&quot;Local graph-flow coordinates&quot;,&quot;display_title&quot;:&quot;Definition 4.7: Local graph-flow coordinates&quot;,&quot;body&quot;:&quot;At the midpoint $p$ of a length-$r$ arc, lift the evolving arc through the\n$h(t&#x27;)$-exponential local diffeomorphism from a ball in $T_pW$.  Give\n$T_pW$ the Euclidean metric $h&#x27;=h(t&#x27;)_p$ and take the $z$-axis tangent to the\nlifted arc.  The choice of $r_0$ ensures that throughout the tangent-space\nball\n\\[\n |h(t)-h&#x27;|_{h&#x27;}&lt;\\delta,\\qquad\n |\\Gamma(A,B)|_{h&#x27;}&lt;\\delta|A|_{h&#x27;}|B|_{h&#x27;}.\n\\]\nOn a fixed interval $I&#x27;$ of $h&#x27;$-length $l\\in[0.8r,r]$, write the evolving\narc, up to its maximal graph time $t_3\\le t_2$, as\n$\\widetilde\\gamma(z,t)=(z,f(z,t))$, where $|f_z|_{h&#x27;}\\le1/10$.  Define\n\\[\n Z=\\partial_z\\widetilde\\gamma=(1,f_z),\\qquad\n Y=\\partial_t\\widetilde\\gamma=(0,f_t).\n\\]\nThus $Y$ is $h&#x27;$-orthogonal to the $z$-axis and differs from\n$\\nabla_SS$ by a scalar multiple of $Z$.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Graph-Flow Coordinate Estimates&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:101,&quot;ref&quot;:&quot;MT:ch19:19.64&quot;},{&quot;id&quot;:&quot;2d7fad1bc78e&quot;,&quot;label&quot;:&quot;thm:uniform-controlled-ramp-approximation&quot;,&quot;title&quot;:&quot;Uniform smooth approximation by controlled ramps&quot;,&quot;display_title&quot;:&quot;Theorem 4.19: Uniform smooth approximation by controlled ramps&quot;,&quot;body&quot;:&quot;Let $\\Gamma\\colon S^2\\to\\Lambda M$ be a continuous family of\nnull-homotopic loops representing a class in $\\pi_3(M,*)$, and let\n$0&lt;\\zeta&lt;1$.  There is a continuous family\n$\\widetilde\\Gamma\\colon S^2\\to\\Lambda M$ such that\n$[\\widetilde\\Gamma]=[\\Gamma]$, every member is smooth, and, for every\n$0&lt;\\alpha&lt;1$, the same family is continuous in the $C^{2,\\alpha}$ topology.\nMoreover,\n\\[\n |L(\\widetilde\\Gamma(q))-L(\\Gamma(q))|&lt;\\zeta,\\qquad\n |A(\\widetilde\\Gamma(q))-A(\\Gamma(q))|&lt;\\zeta.\n\\]\nMoreover there is $C_0&lt;\\infty$, independent of $q$ and\n$0&lt;\\lambda&lt;1$, for which both the length and total curvature of every ramp\n$\\widetilde\\Gamma(q)^\\lambda$ are at most $C_0$.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Polygonal Ramp Approximation&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:113,&quot;ref&quot;:&quot;MT:ch19:19.17&quot;},{&quot;id&quot;:&quot;2e2a150f9e0c&quot;,&quot;label&quot;:&quot;thm:annular-douglas-minimizer&quot;,&quot;title&quot;:&quot;Regularity of an attained annular minimizer&quot;,&quot;display_title&quot;:&quot;Theorem 5.25: Regularity of an attained annular minimizer&quot;,&quot;body&quot;:&quot;Let $(N,h)$ be a compact real-analytic Riemannian manifold of dimension at\nleast three.  Let $c_0,c_1$ be disjoint embedded real-analytic closed curves\nwhich are freely homotopic and homotopically nontrivial.  Suppose an admissible\nspanning annulus $F_0$ attains the annular area infimum, and that there is\n$\\rho&gt;0$ such that, for every essential simple closed curve $\\alpha$ in its\ndomain,\n\\[\n L_h(F_0\\circ\\alpha)\\ge\\rho.\n\\]\nAfter replacing $F_0$ by its conformal harmonic representative in the same\nminimizing class, it has finite interior branch set, is real analytic up to\nits real-analytic boundary, and has no true boundary branch point.  False\nboundary branch points are not excluded.  There are interior parallel\nboundary curves avoiding the finite branch set which converge to the original\nboundary and whose intervening collar areas tend to zero.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Controlled Loop-Family Deformation&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:154,&quot;ref&quot;:&quot;MT:ch19:19.15, white-classical-area-minimizing-surfaces:page-0001, white-classical-area-minimizing-surfaces:page-0002&quot;},{&quot;id&quot;:&quot;2ea12f74bfde&quot;,&quot;label&quot;:&quot;lem:single-loop-polygonal-approximation&quot;,&quot;title&quot;:&quot;Polygonal approximation&quot;,&quot;display_title&quot;:&quot;Theorem 4.15: Polygonal approximation&quot;,&quot;body&quot;:&quot;For every $C^1$ loop $c\\colon S^1\\to M$ and every $\\zeta&gt;0$, there is\n$N$ such that, for all $n\\ge N$,\n\\[\n |L(c_n)-L(c)|&lt;\\zeta,\n\\]\nand $c_n$ and $c$ cobound a piecewise smooth annulus of area less than\n$\\zeta$.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Polygonal Ramp Approximation&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:109,&quot;ref&quot;:&quot;MT:ch19:19.19&quot;},{&quot;id&quot;:&quot;31a90c8d1eb2&quot;,&quot;label&quot;:&quot;thm:controlled-loop-family-deformation&quot;,&quot;title&quot;:&quot;Controlled deformation of a loop family&quot;,&quot;display_title&quot;:&quot;Theorem 5.29: Controlled deformation of a loop family&quot;,&quot;body&quot;:&quot;Assume the least-disk, attained-annulus, annular-transfer, and compact-family\ncurve-shrinking interfaces in the dependency list hold uniformly on\n$[t_0,t_1]$, including their stated regularity and nondegeneracy hypotheses.\nLet $g(t)$ be a Ricci flow on a compact three-manifold for\n$t\\in[t_0,t_1]$, let $\\Gamma\\colon S^2\\to\\Lambda_0M$ be continuous, and\nlet $\\zeta&gt;0$.  There is a continuous family\n$\\widetilde\\Gamma(t)\\colon S^2\\to\\Lambda_0M$ such that\n$[\\widetilde\\Gamma(t_0)]=[\\Gamma]$ and, for every $c\\in S^2$,\n\\[\n |\\mathcal A_{g(t_0)}(\\widetilde\\Gamma(t_0)(c))\n   -\\mathcal A_{g(t_0)}(\\Gamma(c))|&lt;\\zeta,\n\\]\nand at least one of the following holds:\n\\begin{enumerate}\n\\item $L_{g(t_1)}(\\widetilde\\Gamma(t_1)(c))&lt;\\zeta$;\n\\item\n\\[\n \\mathcal A_{g(t_1)}(\\widetilde\\Gamma(t_1)(c))\n \\le w_{\\mathcal A_{g(t_0)}(\\widetilde\\Gamma(t_0)(c)),t_0}(t_1)+\\zeta.\n\\]\n\\end{enumerate}&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Controlled Loop-Family Deformation&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:158,&quot;ref&quot;:&quot;MT:ch18:18.24&quot;},{&quot;id&quot;:&quot;32d360ee53fe&quot;,&quot;label&quot;:&quot;lem:coupled-length-curvature-comparison&quot;,&quot;title&quot;:&quot;Scalar exponential comparison&quot;,&quot;display_title&quot;:&quot;Lemma 4.23: Scalar exponential comparison&quot;,&quot;body&quot;:&quot;Suppose $L,\\Theta\\colon[0,T]\\to[0,\\infty)$ are absolutely continuous and\n\\[\n L&#x27;\\le C_2L,\\qquad\n \\Theta&#x27;\\le(C_1+C_2)\\Theta+C_1L\n\\]\nalmost everywhere.  Then, for $0\\le t\\le T$,\n\\[\n L(t)\\le L(0)e^{C_2t},\\qquad\n \\Theta(t)+L(t)\\le(\\Theta(0)+L(0))e^{(C_1+C_2)t}.\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Evolution Identities and Global Bounds&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:117,&quot;ref&quot;:&quot;MT:ch19:19.10&quot;},{&quot;id&quot;:&quot;33c22cede17b&quot;,&quot;label&quot;:&quot;lem:positive-component-first-failure-control&quot;,&quot;title&quot;:&quot;Positive components at first failure&quot;,&quot;display_title&quot;:&quot;Lemma 3.22: Positive components at first failure&quot;,&quot;body&quot;:&quot;In a rescaled first-failure sequence at a fixed positive induction stage,\nwith unit scalar curvature at the basepoints, suppose the component\ncontaining each basepoint has positive sectional curvature.  Assume in\naddition that the sequence is ordinarily noncollapsed on every fixed based\nball, pointed compactness produces a complete nonflat limit, and every\npositive-curvature limit satisfies the stated kappa-solution canonical\nneighborhood theorem.  Then, after passing to a subsequence, the basepoints\neventually have strong\n$(C,\\epsilon)$-canonical neighborhoods.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;First-Failure Extension&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:84,&quot;ref&quot;:&quot;MT:ch16:16.1,MT:ch17:17.1&quot;},{&quot;id&quot;:&quot;34c27224dce4&quot;,&quot;label&quot;:&quot;def:epsilon-neck-and-scale&quot;,&quot;title&quot;:&quot;Epsilon-closeness, neck, and scale&quot;,&quot;display_title&quot;:&quot;Definition 1.5: Epsilon-closeness, neck, and scale&quot;,&quot;body&quot;:&quot;Fix $0&lt;\\epsilon&lt;1/2$ and put $k=\\lfloor\\epsilon^{-1}\\rfloor$.  A metric\n$g$ is \\emph{$\\epsilon$-close to $g_0$ in $C^k$} on a common domain if\nthe $g_0$-norms of $g-g_0$ and its first $k$ covariant derivatives are\nuniformly less than $\\epsilon$.\n\nAn \\emph{$\\epsilon$-neck} centered at $x$ in a Riemannian three-manifold\n$(M,g)$ is the image $N$ of a diffeomorphism\n\\[\n \\varphi\\colon S^2\\times(-\\epsilon^{-1},\\epsilon^{-1})\\longrightarrow N\n\\]\nwith $x\\in\\varphi(S^2\\times\\{0\\})$, such that\n$R(x)\\varphi^*g$ is $\\epsilon$-close in\n$C^{\\lfloor1/\\epsilon\\rfloor}$ to $h_0+ds^2$, where $h_0$ is the round\nmetric of scalar curvature $1$ on $S^2$.  The slices are the neck spheres,\nthe slice at $s=0$ is the central sphere, and\n\\[\n s_N=\\operatorname{pr}_2\\circ\\varphi^{-1},\n \\qquad r_N=R(x)^{-1/2}\n\\]\nare the axial coordinate and the scale.  Replacing $s_N$ by $-s_N$\nreverses the neck.  Its positive and negative ends are respectively\n\\[\n E_N^+=\\{s_N&gt;0.9\\epsilon^{-1}\\},\n \\qquad\n E_N^-=\\{s_N&lt;-0.9\\epsilon^{-1}\\}.\n\\]&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:4,&quot;ref&quot;:&quot;MT:ch2:2.16,MT:ch2:2.18&quot;},{&quot;id&quot;:&quot;356e0995b890&quot;,&quot;label&quot;:&quot;thm:cap-and-neck-cover-classification&quot;,&quot;title&quot;:&quot;Connected sets covered by canonical cap cores and neck centers&quot;,&quot;display_title&quot;:&quot;Theorem 1.30: Connected sets covered by canonical cap cores and neck centers&quot;,&quot;body&quot;:&quot;For every $C&lt;\\infty$ and all sufficiently small $\\epsilon&gt;0$, let $X$ be\na connected subset of a Riemannian three-manifold $M$.  Suppose every\npoint of $X$ is either the center of an $\\epsilon$-neck or lies in the core\nof a $(C,\\epsilon)$-cap.  Then at least one of the following holds:\n\\begin{enumerate}\n\\item $X$ lies in a component which is the union of two\n      $(C,\\epsilon)$-caps and is diffeomorphic to\n      $S^3$, $\\mathbb{RP}^3$, or\n      $\\mathbb{RP}^3\\#\\mathbb{RP}^3$;\n\\item $X$ lies in a doubly $C$-capped $\\epsilon$-tube component of one\n      of those three diffeomorphism types;\n\\item $X$ lies in one $(C,\\epsilon)$-cap;\n\\item $X$ lies in a $C$-capped $\\epsilon$-tube;\n\\item $X$ lies in an $\\epsilon$-tube;\n\\item $X$ lies in an $\\epsilon$-fibration component covered by\n      $\\epsilon$-necks.\n\\end{enumerate}&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:29,&quot;ref&quot;:&quot;MT:app:A.21&quot;},{&quot;id&quot;:&quot;37074c813bce&quot;,&quot;label&quot;:&quot;thm:curve-shrinking-short-time-existence&quot;,&quot;title&quot;:&quot;Short-time existence and curvature blow-up alternative&quot;,&quot;display_title&quot;:&quot;Theorem 4.13: Short-time existence and curvature blow-up alternative&quot;,&quot;body&quot;:&quot;Let $0&lt;\\alpha&lt;1$ and let\n$c_0\\colon S^1\\to(M,g(t_0))$ be an immersed $C^{2,\\alpha}$ curve.  There is\n$T&gt;t_0$ and an immersed curve-shrinking flow $c$ on $[t_0,T)$.  If\n$T&lt;\\sup I$\nand $\\sup_{S^1\\times[t_0,T)}k&lt;\\infty$, then the flow extends, through\nimmersed curves, to an interval $[t_0,T+\\eta)$ for some $\\eta&gt;0$.\nConsequently every finite nonextendible endpoint has\n$\\limsup_{t\\uparrow T}\\max_{S^1}k(\\cdot,t)=\\infty$.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Short-Time Existence&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:107,&quot;ref&quot;:&quot;MT:ch19:19.1&quot;},{&quot;id&quot;:&quot;3a6bc0d9a9d7&quot;,&quot;label&quot;:&quot;lem:loop-space-quotient-wedge&quot;,&quot;title&quot;:&quot;The quotient and wedge model&quot;,&quot;display_title&quot;:&quot;Lemma 5.17: The quotient and wedge model&quot;,&quot;body&quot;:&quot;For $c_0\\in S^2$, the quotient\n\\[\n Q=(S^2\\times S^1)/(\\{c_0\\}\\times S^1)\n\\]\nis homotopy equivalent to $S^2\\vee S^3$.  Consequently, for every based\nspace $X$ of CW type,\n\\[\n [Q,X]_*\\cong\\pi_2(X)\\times\\pi_3(X).\n\\]&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;The Loop-Space Width Interface&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:146,&quot;ref&quot;:&quot;MT:ch18:18.16&quot;},{&quot;id&quot;:&quot;3b2c67594e86&quot;,&quot;label&quot;:&quot;thm:kappa-solution-canonical-neighborhoods&quot;,&quot;title&quot;:&quot;Canonical neighborhoods in kappa-solutions&quot;,&quot;display_title&quot;:&quot;Theorem 3.16: Canonical neighborhoods in kappa-solutions&quot;,&quot;body&quot;:&quot;For every sufficiently small $\\epsilon&gt;0$ there is\n$C=C(\\epsilon)&lt;\\infty$ such that every point of every three-dimensional\n$\\kappa$-solution has a strong $(C,\\epsilon)$-canonical neighborhood,\nunless the solution is the round product $\\mathbb{RP}^2\\times\\mathbb R$.\nMoreover, if generalized flows with no embedded two-sided\n$\\mathbb{RP}^2$ converge smoothly to a $\\kappa$-solution, then their\nbasepoints have strong $(C,\\epsilon)$-canonical neighborhoods for all\nsufficiently large indices.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Canonical Neighborhood Models&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:78,&quot;ref&quot;:&quot;MT:ch9:9.94,MT:ch9:9.95&quot;},{&quot;id&quot;:&quot;3c6c0b64ac05&quot;,&quot;label&quot;:&quot;thm:conditional-noncollapsing-extension&quot;,&quot;title&quot;:&quot;Conditional noncollapsing extension&quot;,&quot;display_title&quot;:&quot;Theorem 2.30: Conditional noncollapsing extension&quot;,&quot;body&quot;:&quot;Assume the endpoint-transfer hypotheses of \\ref{thm:reduced-volume-transfer}\nare available uniformly for the minimizing families used at scales\n$[r_{i+1},\\epsilon]$.  Fix $i\\ge0$ and positive nonincreasing finite sequences\n\\[\n \\delta_0\\ge\\cdots\\ge\\delta_i,\n \\qquad \\epsilon=r_0\\ge\\cdots\\ge r_i,\n \\qquad \\kappa_0\\ge\\cdots\\ge\\kappa_i.\n\\]\nThere is $0&lt;\\kappa_{i+1}\\le\\kappa_i$ such that, for every\n$0&lt;r_{i+1}\\le r_i$, there is\n$0&lt;\\delta(r_{i+1})\\le\\delta_i$ with the following property.  If a\ncontrolled Ricci flow with surgery on $[0,T)$,\n$T\\in(T_i,T_{i+1}]$, satisfies the stage-$i$ induction hypotheses before\n$T_i$, has $\\bar\\delta\\le\\delta(r_{i+1})$ on the new stage, and satisfies\nthe strong canonical-neighborhood assumption with parameter $r_{i+1}$,\nthen every parabolic ball of radius at most $\\epsilon$ satisfying the\ncurvature hypothesis in\n\\ref{def:surgery-flow-noncollapsing} has volume at least\n$\\kappa_{i+1}\\rho^3$, unless its center lies in a positively curved component\nof the time slice.  The constant is independent of the particular flow.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:60,&quot;ref&quot;:&quot;MT:ch16:16.1&quot;},{&quot;id&quot;:&quot;3d419b69ad4d&quot;,&quot;label&quot;:&quot;lem:localized-total-curvature-smallness&quot;,&quot;title&quot;:&quot;Small localized total-curvature bound&quot;,&quot;display_title&quot;:&quot;Theorem 4.29: Small localized total-curvature bound&quot;,&quot;body&quot;:&quot;There is $D_4$, depending only on $\\Theta,L_0$, and the ambient flow, such\nthat\n\\[\n \\int_{\\gamma_t}\\varphi k\\,ds\\le D_4\\sqrt\\delta\n \\qquad(t&#x27;\\le t\\le t_2).\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Localized Total-Curvature Control&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:123,&quot;ref&quot;:&quot;MT:ch19:19.62&quot;},{&quot;id&quot;:&quot;3f37c7b2cea9&quot;,&quot;label&quot;:&quot;lem:forward-dini-mean-value&quot;,&quot;title&quot;:&quot;Right-Dini mean-value lemma&quot;,&quot;display_title&quot;:&quot;Lemma 1.1: Right-Dini mean-value lemma&quot;,&quot;body&quot;:&quot;Let $q\\colon[c,d]\\to\\mathbb R$ be continuous.  If $q(d)&gt;q(c)$, then\nthere is $s\\in[c,d)$ such that $D^+q(s)&gt;0$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Forward-Difference Comparison&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:0,&quot;ref&quot;:&quot;MT:ch2:2.22&quot;},{&quot;id&quot;:&quot;3fa1d46bb843&quot;,&quot;label&quot;:&quot;thm:extinction-connected-sum-classification&quot;,&quot;title&quot;:&quot;Connected-sum classification from finite extinction&quot;,&quot;display_title&quot;:&quot;Theorem 6.11: Connected-sum classification from finite extinction&quot;,&quot;body&quot;:&quot;Suppose a controlled Ricci flow with surgery starts from a connected closed\n$3$-manifold $M$ and is extinct by a finite time $T$.  Then there are finite\nfamilies of spherical space forms $P_1,\\ldots,P_r$ and sphere bundles\n$F_1,\\ldots,F_s\\in\\{E_+,E_-\\}$ such that\n\\[\n M\\cong P_1\\#\\cdots\\#P_r\\#F_1\\#\\cdots\\#F_s.\n\\]\nHere $r+s\\ge1$.\nIf $M$ is orientable, every $F_j$ is $E_+$.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Backward Reconstruction from Extinction&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:177,&quot;ref&quot;:&quot;MT:ch15:15.4,MT:intro:0.1&quot;},{&quot;id&quot;:&quot;4062bfa79032&quot;,&quot;label&quot;:&quot;lem:isotopic-cap-gluing-sphere&quot;,&quot;title&quot;:&quot;An isotopic cap-gluing sphere determines a component&quot;,&quot;display_title&quot;:&quot;Lemma 1.28: An isotopic cap-gluing sphere determines a component&quot;,&quot;body&quot;:&quot;Let $X\\subset M$ be connected.  Let $\\widetilde C$ be a cap or a finite\ncapped tube containing a point of $X$, and let $C&#x27;$ be a\n$(C,\\epsilon)$-cap whose core contains a point of\n$X\\cap\\operatorname{Fr}_M(\\widetilde C)$.  Let $N&#x27;$ be the neck end of\n$C&#x27;$, oriented away from its core.  If a two-sphere\n$\\Sigma\\subset N&#x27;\\cap\\widetilde C$ lies in the closed positive half of\n$N&#x27;$ and is isotopic in $N&#x27;$ to its central sphere, then\n$\\widetilde C\\cup C&#x27;$ is a component of $M$ containing $X$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:27,&quot;ref&quot;:&quot;MT:app:A.24&quot;},{&quot;id&quot;:&quot;42e93ee61505&quot;,&quot;label&quot;:&quot;lem:loop-width-surgery-lower-semicontinuity&quot;,&quot;title&quot;:&quot;Loop-family width at a surgery time&quot;,&quot;display_title&quot;:&quot;Lemma 5.32: Loop-family width at a surgery time&quot;,&quot;body&quot;:&quot;At a surgery time $T$,\n\\[\n W_\\xi(T)\\le\\liminf_{t\\uparrow T}W_\\xi(t).\n\\]&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;_3-Width Evolution Through Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:161,&quot;ref&quot;:&quot;MT:ch18:18.22,MT:ch15:15.12&quot;},{&quot;id&quot;:&quot;45ed7d334607&quot;,&quot;label&quot;:&quot;lem:localized-cutoff-time-derivative&quot;,&quot;title&quot;:&quot;Time derivative of the localized cutoff&quot;,&quot;display_title&quot;:&quot;Theorem 4.27: Time derivative of the localized cutoff&quot;,&quot;body&quot;:&quot;There is $D_1$, depending only on $\\Theta,L_0$, and the ambient flow, such\nthat, on $[t&#x27;,t_2]$,\n\\[\n |\\partial_t\\varphi(x,t)|\n \\le D_1\\left(1+\\frac1{r\\sqrt{t-t&#x27;}}\\right).\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Localized Total-Curvature Control&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:121,&quot;ref&quot;:&quot;MT:ch19:19.60&quot;},{&quot;id&quot;:&quot;46001210b234&quot;,&quot;label&quot;:&quot;thm:least-disk-area-variation-interface&quot;,&quot;title&quot;:&quot;Least-disk variation interface&quot;,&quot;display_title&quot;:&quot;Theorem 5.24: Least-disk variation interface&quot;,&quot;body&quot;:&quot;Assume Plateau minimizers for the relevant null-homotopic curves exist with\nthe required boundary regularity, and that their moving-boundary first\nvariation is valid.  Let $g(t)$ be a Ricci flow on a compact three-manifold and let\n$\\gamma(t)$ be a smooth curve-shrinking flow of null-homotopic immersed\nloops.  Then $t\\mapsto\\mathcal A_{g(t)}(\\gamma(t))$ is continuous and, at\nevery time at which the flow is smooth,\n\\[\n D^+\\mathcal A_{g(t)}(\\gamma(t))\n \\le-2\\pi-\\frac12R_{\\min}(t)\n       \\mathcal A_{g(t)}(\\gamma(t)).\n\\]&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Controlled Loop-Family Deformation&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:153,&quot;ref&quot;:&quot;MT:ch19:19.2,MT:ch19:19.4&quot;},{&quot;id&quot;:&quot;46b654fc3e42&quot;,&quot;label&quot;:&quot;thm:reduced-exponential-regularity&quot;,&quot;title&quot;:&quot;Regularity of the reduced exponential map&quot;,&quot;display_title&quot;:&quot;Theorem 2.13: Regularity of the reduced exponential map&quot;,&quot;body&quot;:&quot;Assume that minimizing $\\mathcal L$-geodesics to an open set remain in a\nsmooth region on which $|\\operatorname{Ric}|$ and $|\\nabla R|$ are bounded.\nThen $\\mathcal D_x^\\tau$ is open,\n\\[\n \\mathcal L\\exp_x^\\tau\\colon\\mathcal D_x^\\tau\n \\longrightarrow\\Omega_x^\\tau\n\\]\nis a diffeomorphism, and $l_x(\\cdot,\\tau)$ is smooth on\n$\\Omega_x^\\tau$.  The complement of $\\Omega_x^\\tau$ in the selected open\nset has measure zero.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Reduced Geometry&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:43,&quot;ref&quot;:&quot;MT:ch6:6.18,MT:ch6:6.28,MT:ch6:6.56,MT:ch6:6.67&quot;},{&quot;id&quot;:&quot;47d5774c640e&quot;,&quot;label&quot;:&quot;def:strong-canonical-neighborhood-control&quot;,&quot;title&quot;:&quot;Strong canonical-neighborhood control&quot;,&quot;display_title&quot;:&quot;Definition 2.3: Strong canonical-neighborhood control&quot;,&quot;body&quot;:&quot;Fix $C&lt;\\infty$, $0&lt;\\epsilon&lt;1/2$, and $r&gt;0$.  A three-dimensional Ricci\nflow with surgery satisfies the \\emph{strong\n$(C,\\epsilon)$-canonical-neighborhood assumption with parameter $r$} if\nevery point $x$ with $R(x)\\ge r^{-2}$ has one of the following\nneighborhoods at the curvature scale $R(x)^{-1/2}$:\n\\begin{enumerate}\n\\item a strong $\\epsilon$-neck centered at $x$, whose parabolic rescaling by\n      $R(x)$ is $\\epsilon$-close in\n      $C^{\\lfloor\\epsilon^{-1}\\rfloor}$ to the shrinking round cylinder on\n      normalized times $(-1,0]$;\n\\item a $(C,\\epsilon)$-cap whose core contains $x$, with $C$-comparable\n      scalar curvatures and scale-normalized diameter and volume bounded by\n      $C$, together with a uniform core volume lower bound and the\n      scale-invariant derivative bounds for $R$;\n\\item a compact positively curved $C$-component containing $x$, with\n      least sectional curvature at least $C^{-1}\\sup R$ and diameter between\n      $C^{-1}(\\sup R)^{-1/2}$ and $C(\\inf R)^{-1/2}$;\n\\item an $\\epsilon$-round component containing $x$: a compact connected\n      component $(M,g)$ for which there are $R&gt;0$, a compact\n      constant-curvature-one manifold $(Z,g_0)$, and a diffeomorphism\n      $\\varphi:Z\\to M$ such that $\\varphi^*(Rg)$ is $\\epsilon$-close to $g_0$\n      in the $C^{\\lfloor\\epsilon^{-1}\\rfloor}$ topology.\n\\end{enumerate}\nOnly the first alternative is a spacetime neighborhood.  The other\nalternatives lie in the slice $M_{\\mathbf t(x)}$.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:33,&quot;ref&quot;:&quot;MT:ch9:9.76,MT:ch14:14.18&quot;},{&quot;id&quot;:&quot;4db844706cd7&quot;,&quot;label&quot;:&quot;lem:reduced-volume-noncollapsing-transfer&quot;,&quot;title&quot;:&quot;Reduced-volume noncollapsing transfer&quot;,&quot;display_title&quot;:&quot;Lemma 2.29: Reduced-volume noncollapsing transfer&quot;,&quot;body&quot;:&quot;Assume the stage-$i$ noncollapsing bound on earlier controlled slices and the\nabsolute-continuity/density hypotheses of \\ref{thm:reduced-volume-transfer}\nfor the selected minimizing families.  Under the hypotheses of\n\\ref{prop:compact-reduced-minimizing-domain}, there is\n$\\kappa_{\\mathcal L}&gt;0$, depending only on the stage data, such that every\nterminal parabolic ball of radius\n$\\rho\\in[r_{i+1},\\epsilon]$ and curvature at most $\\rho^{-2}$ satisfies\n\\[\n \\operatorname{Vol}B(x,T,\\rho)\\ge\\kappa_{\\mathcal L}\\rho^3,\n\\]\nunless the component containing $x$ has positive sectional curvature.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:59,&quot;ref&quot;:&quot;MT:ch16:16.1,MT:ch16:16.27,MT:ch6:6.80&quot;},{&quot;id&quot;:&quot;4e02960b5f84&quot;,&quot;label&quot;:&quot;lem:minimal-two-sphere-area-variation&quot;,&quot;title&quot;:&quot;Area variation of a minimal two-sphere&quot;,&quot;display_title&quot;:&quot;Lemma 5.3: Area variation of a minimal two-sphere&quot;,&quot;body&quot;:&quot;Let $g(t)$ be a Ricci flow on a three-manifold near $t_0$, and let\n$f\\colon S^2\\to(M,g(t_0))$ be a branched minimal immersion.  If\n$R_{\\min}(t_0)=\\min_M R_{g(t_0)}$, then\n\\[\n \\left.\\frac d{dt}\\right|_{t=t_0}\\operatorname{Area}_{g(t)}(f)\n \\le -4\\pi-\\frac12R_{\\min}(t_0)\\operatorname{Area}_{g(t_0)}(f).\n\\]&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Two-Sphere Width Control&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:132,&quot;ref&quot;:&quot;MT:ch18:18.12&quot;},{&quot;id&quot;:&quot;4f6c36011bc6&quot;,&quot;label&quot;:&quot;lem:sphere-bundle-fundamental-group&quot;,&quot;title&quot;:&quot;Fundamental group of a sphere bundle over the circle&quot;,&quot;display_title&quot;:&quot;Lemma 6.16: Fundamental group of a sphere bundle over the circle&quot;,&quot;body&quot;:&quot;Both $E_+$ and $E_-$ have fundamental group isomorphic to $\\mathbb Z$.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Connected Sums and Fundamental Groups&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:182,&quot;ref&quot;:&quot;Hatcher:ch4:4.41,Hatcher:ch4:4.48&quot;},{&quot;id&quot;:&quot;50d00891cd7a&quot;,&quot;label&quot;:&quot;thm:two-dimensional-kappa-solutions-round&quot;,&quot;title&quot;:&quot;Two-dimensional kappa-solutions are round&quot;,&quot;display_title&quot;:&quot;Theorem 3.2: Two-dimensional kappa-solutions are round&quot;,&quot;body&quot;:&quot;Every orientable two-dimensional $\\kappa$-solution in the sense of\n\\ref{def:kappa-solution} is, after a constant\nparabolic scaling and time translation, the shrinking round two-sphere.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solutions and Asymptotic Models&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:64,&quot;ref&quot;:&quot;MT:ch9:9.4&quot;},{&quot;id&quot;:&quot;516f19e15e63&quot;,&quot;label&quot;:&quot;lem:loop-width-regular-continuity&quot;,&quot;title&quot;:&quot;Continuity of loop-family width at regular times&quot;,&quot;display_title&quot;:&quot;Lemma 5.31: Continuity of loop-family width at regular times&quot;,&quot;body&quot;:&quot;The function $W_\\xi$ is continuous at every nonsurgery time.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;_3-Width Evolution Through Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:160,&quot;ref&quot;:&quot;MT:ch18:18.21&quot;},{&quot;id&quot;:&quot;547f37ae7414&quot;,&quot;label&quot;:&quot;lem:uniform-time-slice-transport&quot;,&quot;title&quot;:&quot;Uniform transport of time-slice maxima&quot;,&quot;display_title&quot;:&quot;Lemma 1.3: Uniform transport of time-slice maxima&quot;,&quot;body&quot;:&quot;Let $X$ be a set with functions $\\tau,F,V\\colon X\\to\\mathbb R$, let\n$Z\\subset X$, and let $m\\colon[a,b]\\to\\mathbb R$.  Suppose that for every\n$t\\in[a,b]$ there is $x\\in Z$ with $\\tau(x)=t$ and $F(x)=m(t)$, and that\n$F(y)\\le m(\\tau(y))$ whenever $\\tau(y)\\in[a,b]$.  Suppose also that there\nare $\\rho&gt;0$ and transports $\\Phi_h(x)$, defined for $x\\in Z$,\n$|h|&lt;\\rho$, and $\\tau(x)+h\\in[a,b]$, such that\n\\[\n \\tau(\\Phi_h(x))=\\tau(x)+h,\n \\qquad\n \\sup_{x\\in Z}|F(\\Phi_h(x))-F(x)|\\longrightarrow0\n \\quad(h\\to0).\n\\]\nAssume moreover that, for every $\\eta&gt;0$, there is $h_0&gt;0$ such that\n\\[\n \\frac{F(x)-F(\\Phi_{-h}(x))}{h}\\le V(x)+\\eta\n\\]\nwhenever $x\\in Z$, $0&lt;h&lt;h_0$, and the backward transport is defined.\nIf $\\psi\\colon[a,b]\\times\\mathbb R\\to\\mathbb R$ is continuous and\n\\[\n V(x)\\le\\psi(\\tau(x),F(x))\\qquad(x\\in Z),\n\\]\nthen $m$ is continuous and $D^+m(t)\\le\\psi(t,m(t))$ for every $t&lt;b$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Forward-Difference Comparison&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:2,&quot;ref&quot;:&quot;MT:ch2:2.23&quot;},{&quot;id&quot;:&quot;5685aa7f1635&quot;,&quot;label&quot;:&quot;thm:kappa-solution-compactness&quot;,&quot;title&quot;:&quot;Normalized kappa-solution compactness&quot;,&quot;display_title&quot;:&quot;Theorem 3.5: Normalized kappa-solution compactness&quot;,&quot;body&quot;:&quot;Let $(M_j,g_j(t),p_j)$ be based three-dimensional $\\kappa$-solutions with\n$R(p_j,0)=1$.  A subsequence converges smoothly on compact spacetime\nsubsets to a based $\\kappa$-solution\n\\[\n (M_\\infty,g_\\infty(t),p_\\infty)\n\\]\nwith $R(p_\\infty,0)=1$.\nIn particular, for every $A&lt;\\infty$ and $m\\ge0$ there is $C(A,m)&lt;\\infty$\nsuch that\n\\[\n \\sup_{B_{g_j(0)}(p_j,A)\\times[-A,0]}\n |\\nabla^m\\operatorname{Rm}_{g_j}|\\le C(A,m).\n\\]&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solutions and Asymptotic Models&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:67,&quot;ref&quot;:&quot;MT:ch9:9.59,MT:ch9:9.60,MT:ch9:9.62,MT:ch9:9.63,MT:ch9:9.64,MT:ch9:9.65,MT:ch9:9.66,MT:ch9:9.67,MT:ch9:9.68,MT:ch9:9.69,MT:ch9:9.70,MT:ch9:9.71&quot;},{&quot;id&quot;:&quot;572cb18da12c&quot;,&quot;label&quot;:&quot;thm:curve-flow-curvature-evolution&quot;,&quot;title&quot;:&quot;Evolution equation for squared curvature&quot;,&quot;display_title&quot;:&quot;Theorem 4.20: Evolution equation for squared curvature&quot;,&quot;body&quot;:&quot;Let $\\widehat{\\operatorname{Rm}}$ be the curvature\ntensor of $\\widehat g$.  At every smooth point of the flow,\n\\begin{align*}\n \\partial_t k^2={}&amp;(k^2)&#x27;&#x27;-2| (\\nabla_SH)^\\perp|^2+2k^4\n -2\\operatorname{Ric}_g(H,H)+4k^2\\operatorname{Ric}_g(S,S)\\\\\n &amp;+2\\widehat{\\operatorname{Rm}}(\\widehat H,S,H,S)\n +2\\operatorname{Ric}_g(S,S)\\operatorname{Ric}_g(H,H)\n -2(\\nabla^g_S\\operatorname{Ric}_g)(S,H).\n\\end{align*}&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Evolution Identities and Global Bounds&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:114,&quot;ref&quot;:&quot;MT:ch19:19.7&quot;},{&quot;id&quot;:&quot;5ae781823571&quot;,&quot;label&quot;:&quot;lem:trivial-free-product-factors&quot;,&quot;title&quot;:&quot;A trivial free product has trivial factors&quot;,&quot;display_title&quot;:&quot;Lemma 6.15: A trivial free product has trivial factors&quot;,&quot;body&quot;:&quot;If a finite free product $G_1*\\cdots*G_n$ is the trivial group, then every\n$G_i$ is trivial.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Connected Sums and Fundamental Groups&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:181,&quot;ref&quot;:&quot;&quot;},{&quot;id&quot;:&quot;5c16aa7c0849&quot;,&quot;label&quot;:&quot;thm:canonical-neck-cap-topology&quot;,&quot;title&quot;:&quot;Topology of a manifold covered by canonical caps and necks&quot;,&quot;display_title&quot;:&quot;Theorem 1.31: Topology of a manifold covered by canonical caps and necks&quot;,&quot;body&quot;:&quot;Let $(M,g)$ be a connected Riemannian three-manifold.  For fixed\n$C&lt;\\infty$ and sufficiently small $\\epsilon&gt;0$, suppose each point of\n$M$ is either the center of an $\\epsilon$-neck or belongs to the core of a\n$(C,\\epsilon)$-cap.  Exactly one of the following types occurs:\n\\begin{enumerate}\n\\item $M$ is diffeomorphic to $S^3$, $\\mathbb{RP}^3$, or\n      $\\mathbb{RP}^3\\#\\mathbb{RP}^3$, and is the union of two caps or a\n      doubly capped $\\epsilon$-tube;\n\\item $M$ is diffeomorphic to $\\mathbb R^3$ or to\n      $\\mathbb{RP}^3\\setminus\\{p\\}$, and is a cap or a capped\n      $\\epsilon$-tube;\n\\item $M$ is diffeomorphic to $S^2\\times\\mathbb R$ and is an\n      $\\epsilon$-tube;\n\\item $M$ is diffeomorphic to an $S^2$-bundle over $S^1$ and is an\n      $\\epsilon$-fibration.\n\\end{enumerate}&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:30,&quot;ref&quot;:&quot;MT:app:A.25&quot;},{&quot;id&quot;:&quot;5d257a96cea2&quot;,&quot;label&quot;:&quot;lem:canonical-neighborhood-stability&quot;,&quot;title&quot;:&quot;Stability of canonical neighborhoods&quot;,&quot;display_title&quot;:&quot;Lemma 3.6: Stability of canonical neighborhoods&quot;,&quot;body&quot;:&quot;Fix $\\epsilon&lt;1/4$ and $C&lt;\\infty$.\n\\begin{enumerate}\n\\item A $(C,\\epsilon)$-cap, controlled component, or round component\n      persists under sufficiently small\n      $C^{\\lfloor\\epsilon^{-1}\\rfloor}$ perturbations of its metric and\n      under a sufficiently small change of center.\n\\item An evolving $\\epsilon$-neck of normalized backward length strictly\n      greater than one persists as a strong $\\epsilon$-neck under\n      sufficiently small smooth perturbations of the flow.\n\\item If $C&#x27;&gt;C$ and $\\epsilon&#x27;&gt;\\epsilon$, sufficiently close pointed\n      metrics carry a $(C&#x27;,\\epsilon&#x27;)$-canonical neighborhood at the\n      corresponding point.\n\\end{enumerate}\nIn particular, strong neck centers form an open spacetime set.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solution Geometry and Stability&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:68,&quot;ref&quot;:&quot;MT:ch9:9.79,MT:ch9:9.80&quot;},{&quot;id&quot;:&quot;5d564488bf3b&quot;,&quot;label&quot;:&quot;def:ricci-flow-with-surgery&quot;,&quot;title&quot;:&quot;Ricci flow with surgery&quot;,&quot;display_title&quot;:&quot;Definition 2.1: Ricci flow with surgery&quot;,&quot;body&quot;:&quot;A \\emph{Ricci flow with surgery} is a pair $(\\mathcal M,G)$ with the\nfollowing structure.  The surgery spacetime $\\mathcal M$ has a continuous\ntime function $\\mathbf t\\colon\\mathcal M\\to I$, a time vector field $\\chi$\nwith $\\chi(\\mathbf t)=1$, and the ordinary, one-sided, and surgery charts\nwhich distinguish smooth, exposed, and singular points.  Every slice\n$M_t=\\mathbf t^{-1}(t)$ is a smooth manifold, and the horizontal bundle is\n$\\mathcal H=\\ker(d\\mathbf t)$.  The tensor $G$ is a smooth metric on\n$\\mathcal H$ and satisfies\n\\[\n \\mathcal L_\\chi G=-2\\operatorname{Ric}_G.\n\\]\nAt an exposed point or an endpoint of $I$, the Lie derivative is one-sided.\nThe flow is three-dimensional when its slices are three-manifolds.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:31,&quot;ref&quot;:&quot;MT:ch14:14.8&quot;},{&quot;id&quot;:&quot;5f0941d364d0&quot;,&quot;label&quot;:&quot;thm:component-fundamental-group-persistence&quot;,&quot;title&quot;:&quot;Persistence of the fundamental-group class&quot;,&quot;display_title&quot;:&quot;Theorem 5.13: Persistence of the fundamental-group class&quot;,&quot;body&quot;:&quot;Let $[0,T]$ be a bounded interval containing only finitely many surgery times.\nSuppose the fundamental group of every initial component of a controlled\nsurgery flow is a free product of finitely many finite groups and infinite\ncyclic groups.  Then the same is true for every component of every time slice\nup to $T$.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Late-Component _3 Topology&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:142,&quot;ref&quot;:&quot;MT:ch18:18.19,MT:ch15:15.3&quot;},{&quot;id&quot;:&quot;5f4913b5014a&quot;,&quot;label&quot;:&quot;def:sphere-bundles-over-circle&quot;,&quot;title&quot;:&quot;The two sphere bundles over the circle&quot;,&quot;display_title&quot;:&quot;Definition 6.3: The two sphere bundles over the circle&quot;,&quot;body&quot;:&quot;Write\n\\[\n E_+=S^2\\times S^1\n \\qquad\\text{and}\\qquad\n E_-=S^1\\mathbin{\\widetilde\\times}S^2\n\\]\nfor, respectively, the orientable product bundle and the nonorientable\ntwisted smooth $S^2$-bundle over $S^1$.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Smooth Connected Sums and Prime Factors&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:169,&quot;ref&quot;:&quot;Hatcher3M:ch1:1.5&quot;},{&quot;id&quot;:&quot;5fcc1cb5b7db&quot;,&quot;label&quot;:&quot;thm:finite-interval-surgery-bound&quot;,&quot;title&quot;:&quot;Finite surgery count on bounded intervals&quot;,&quot;display_title&quot;:&quot;Theorem 3.31: Finite surgery count on bounded intervals&quot;,&quot;body&quot;:&quot;Let a controlled Ricci flow with surgery be defined on $[0,T)$ with\n$T\\le T_{i+1}$ and with the control functions fixed on that interval.  There\nis\n\\[\n N=N\\bigl(\\operatorname{Vol}(M_0,g(0)),T_{i+1},r_{i+1},\n             \\bar\\delta(T_{i+1})\\bigr)&lt;\\infty\n\\]\nsuch that the flow has at most $N$ surgery times in $[0,T)$.  In particular,\nsurgery times cannot accumulate in a bounded interval.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Surgery Continuation and Finiteness&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:93,&quot;ref&quot;:&quot;MT:ch17:17.12&quot;},{&quot;id&quot;:&quot;5fcd85b09ca5&quot;,&quot;label&quot;:&quot;def:spherical-space-form&quot;,&quot;title&quot;:&quot;Spherical space form&quot;,&quot;display_title&quot;:&quot;Definition 6.2: Spherical space form&quot;,&quot;body&quot;:&quot;A \\emph{spherical space form} is a quotient $S^3/\\Gamma$, where $S^3$ has\nits round metric and $\\Gamma$ is a finite group acting freely by isometries.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Smooth Connected Sums and Prime Factors&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:168,&quot;ref&quot;:&quot;MT:intro:0.1&quot;},{&quot;id&quot;:&quot;606dd3214150&quot;,&quot;label&quot;:&quot;def:ramp-curve&quot;,&quot;title&quot;:&quot;Ramp&quot;,&quot;display_title&quot;:&quot;Definition 4.4: Ramp&quot;,&quot;body&quot;:&quot;For an immersed oriented curve $c\\colon S^1\\to M\\times S^1_\\lambda$ with\nunit tangent $S$, put $u=\\langle S,U\\rangle$.  The curve is a \\emph{ramp} if\n$u(x)&gt;0$ for every $x\\in S^1$.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Product-Circle Geometry and Ramp Setup&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:98,&quot;ref&quot;:&quot;MT:ch19:19.12&quot;},{&quot;id&quot;:&quot;606f02fa7ec9&quot;,&quot;label&quot;:&quot;thm:local-volume-injectivity-radius-control&quot;,&quot;title&quot;:&quot;Local volume and injectivity-radius control&quot;,&quot;display_title&quot;:&quot;Theorem 2.6: Local volume and injectivity-radius control&quot;,&quot;body&quot;:&quot;Fix $n$, $K&lt;\\infty$, $r_0&gt;0$, and $v_0&gt;0$.  There are positive constants\n\\[\n v_*=v_*(n,K,r_0,v_0),\n \\qquad \\iota_*=\\iota_*(n,K,r_0,v_0),\n\\]\nwith the following property.  If $(M^n,g)$ is complete,\n$|\\operatorname{Rm}|\\le K$ on $B(p,r_0)$, and\n$\\operatorname{Vol}B(p,r_0)\\ge v_0$, then, for\n$0&lt;s\\le\\min\\{r_0,K^{-1/2}\\}$,\n\\[\n \\operatorname{Vol}B(p,s)\\ge v_*s^n,\n \\qquad\n \\operatorname{inj}_g(p)\\ge\n \\iota_*\\min\\{r_0,K^{-1/2}\\}.\n\\]\nThe convention is that $K^{-1/2}=\\infty$ when $K=0$.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Surgery Flows and Fixed Controls&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:36,&quot;ref&quot;:&quot;MT:ch1:1.35,MT:ch1:1.36,MT:ch5:5.10&quot;},{&quot;id&quot;:&quot;61db94ef73bd&quot;,&quot;label&quot;:&quot;lem:canonical-neighborhood-first-failure&quot;,&quot;title&quot;:&quot;First canonical-neighborhood failure&quot;,&quot;display_title&quot;:&quot;Lemma 3.18: First canonical-neighborhood failure&quot;,&quot;body&quot;:&quot;Fix a finite induction stage and a sequence $r_a\\downarrow0$.  Suppose that\nfor every $a$ there are controlled surgery flows with surgery controls\ntending to zero for which the strong $(C,\\epsilon)$-canonical-neighborhood\nassumption with parameter $r_a$ fails before the stage endpoint.  For each\n$a$, after passing sufficiently far down that sequence, there is a first\nfailure time $t_{a,b}$ and a point $x_{a,b}$ at that time such that\n$R(x_{a,b})\\ge r_a^{-2}$, the assumption holds before $t_{a,b}$, and no\nstrong $(C,\\epsilon)$-canonical neighborhood exists at $x_{a,b}$.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;First-Failure Extension&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:80,&quot;ref&quot;:&quot;MT:ch17:17.2&quot;},{&quot;id&quot;:&quot;6364ac4cf64c&quot;,&quot;label&quot;:&quot;thm:finite-essential-sphere-surgeries&quot;,&quot;title&quot;:&quot;Finiteness of essential sphere surgeries&quot;,&quot;display_title&quot;:&quot;Theorem 5.9: Finiteness of essential sphere surgeries&quot;,&quot;body&quot;:&quot;Assume that each essential sphere surgery decreases a nonnegative integer\ntopological complexity by at least one, while the initial complexity is\nfinite.  Then, in a controlled Ricci flow with surgery, only finitely many\nsurgery times use\na sphere which is non-null-homotopic in its presurgery component.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Two-Sphere Width Control&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:138,&quot;ref&quot;:&quot;MT:ch18:18.7,MT:ch18:18.5&quot;},{&quot;id&quot;:&quot;637f01ebdc91&quot;,&quot;label&quot;:&quot;lem:two-sphere-width-surgery-control&quot;,&quot;title&quot;:&quot;Two-sphere width across a trivial surgery&quot;,&quot;display_title&quot;:&quot;Lemma 5.7: Two-sphere width across a trivial surgery&quot;,&quot;body&quot;:&quot;Let $T$ be a surgery time after which the surgery spheres in a continuing\ncomponent are null homotopic, and suppose the selected postsurgery component\nhas nonzero $\\pi_2$.  Then\n\\[\n W_2(T)\\le\\liminf_{t\\uparrow T}W_2(t).\n\\]&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Two-Sphere Width Control&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:136,&quot;ref&quot;:&quot;MT:ch18:18.11,MT:ch15:15.12&quot;},{&quot;id&quot;:&quot;63e8303c1711&quot;,&quot;label&quot;:&quot;lem:adjacent-canonical-caps-form-component&quot;,&quot;title&quot;:&quot;Adjacent canonical caps form an ambient component&quot;,&quot;display_title&quot;:&quot;Lemma 1.29: Adjacent canonical caps form an ambient component&quot;,&quot;body&quot;:&quot;Let $X\\subset M$ be connected, and let $\\widetilde C$ be obtained from a\n$(C,\\epsilon)$-cap $C_0$ by adjoining a finite balanced chain to its neck\nend.  Suppose $\\widetilde C$ contains a point of $X$.  Let $C&#x27;$ be a\n$(C,\\epsilon)$-cap whose core contains a point of\n$X\\cap\\operatorname{Fr}_M(\\widetilde C)$, and assume\n$C_0\\nsubseteq C&#x27;$.  Then $\\widetilde C\\cup C&#x27;$ is a component of $M$\ncontaining $X$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:28,&quot;ref&quot;:&quot;MT:app:A.23&quot;},{&quot;id&quot;:&quot;673665487492&quot;,&quot;label&quot;:&quot;thm:pointed-riemannian-compactness&quot;,&quot;title&quot;:&quot;Pointed Riemannian compactness&quot;,&quot;display_title&quot;:&quot;Theorem 2.24: Pointed Riemannian compactness&quot;,&quot;body&quot;:&quot;Let $(M_j,g_j,x_j)$ be complete pointed Riemannian manifolds.  Suppose that\non every fixed based ball all covariant derivatives of curvature are\nuniformly bounded and that for some $r_0,v_0&gt;0$,\n\\[\n \\operatorname{Vol}_{g_j}B(x_j,r_0)\\ge v_0.\n\\]\nThen a subsequence converges smoothly on compact subsets to a complete\npointed Riemannian manifold.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:54,&quot;ref&quot;:&quot;MT:ch5:5.6,MT:ch5:5.9,MT:ch5:5.10&quot;},{&quot;id&quot;:&quot;67b3fec08fc1&quot;,&quot;label&quot;:&quot;lem:least-spanning-area-continuity&quot;,&quot;title&quot;:&quot;Continuity of least spanning area&quot;,&quot;display_title&quot;:&quot;Lemma 5.21: Continuity of least spanning area&quot;,&quot;body&quot;:&quot;The function $\\gamma\\mapsto\\mathcal A_g(\\gamma)$ is finite and continuous\non $\\Lambda_0X$ in the $C^1$ topology.  More precisely, two sufficiently\n$C^1$-close loops cobound a Lipschitz annulus whose area tends to zero with\ntheir $C^1$ distance, and\n\\[\n |\\mathcal A_g(\\gamma_0)-\\mathcal A_g(\\gamma_1)|\n \\le\\inf\\{\\operatorname{Area}_g(A):\\partial A=\\gamma_0\\sqcup\\gamma_1\\}.\n\\]&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;The Loop-Space Width Interface&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:150,&quot;ref&quot;:&quot;MT:ch18:18.17&quot;},{&quot;id&quot;:&quot;6b365de62a4e&quot;,&quot;label&quot;:&quot;thm:late-component-nontrivial-pi3&quot;,&quot;title&quot;:&quot;Nonzero _3 on a late surviving component&quot;,&quot;display_title&quot;:&quot;Theorem 5.16: Nonzero _3 on a late surviving component&quot;,&quot;body&quot;:&quot;Let $T_1$ be as in \\ref{thm:eventual-pi2-vanishing}, and assume the initial\nfundamental groups are free products of finite groups and infinite cyclic\ngroups.  If $\\mathcal X$ is a component path defined on $[T_1,T_2]$, then\n\\[\n \\pi_3(\\mathcal X(T_1))\\cong\\mathbb Z.\n\\]\nIn particular it contains a nonzero class.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Late-Component _3 Topology&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:145,&quot;ref&quot;:&quot;MT:ch18:18.19&quot;},{&quot;id&quot;:&quot;6bad96de75b2&quot;,&quot;label&quot;:&quot;lem:loop-space-universal-cover-lift&quot;,&quot;title&quot;:&quot;Lifting null-loop families&quot;,&quot;display_title&quot;:&quot;Lemma 5.18: Lifting null-loop families&quot;,&quot;body&quot;:&quot;Let $p\\colon\\widetilde X\\to X$ be the universal cover of a connected\nmanifold.  A continuous family $\\Gamma\\colon S^2\\to\\Lambda_0X$ lifts, after\nchoosing one lift of one marked point, to a continuous family of loops in\n$\\widetilde X$.  Homotopies lift in the same way, and changing the initial\nlift acts by one deck transformation on the entire lifted family.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;The Loop-Space Width Interface&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:147,&quot;ref&quot;:&quot;MT:ch18:18.16&quot;},{&quot;id&quot;:&quot;6e44a1958754&quot;,&quot;label&quot;:&quot;lem:short-subarc-total-curvature-bound&quot;,&quot;title&quot;:&quot;Short-subarc total-curvature bound&quot;,&quot;display_title&quot;:&quot;Theorem 4.30: Short-subarc total-curvature bound&quot;,&quot;body&quot;:&quot;For $t\\in[t&#x27;,t_2]$, every transported initial subarc of length at most $r$\nhas total curvature at most $2D_4\\sqrt\\delta$.  Every subarc of $c_t$ of\nlength at most $r/2$ has the same bound.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Localized Total-Curvature Control&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:124,&quot;ref&quot;:&quot;MT:ch19:19.63&quot;},{&quot;id&quot;:&quot;6ead31810534&quot;,&quot;label&quot;:&quot;def:loop-family-width&quot;,&quot;title&quot;:&quot;Loop-family width&quot;,&quot;display_title&quot;:&quot;Definition 5.20: Loop-family width&quot;,&quot;body&quot;:&quot;For a null-homotopic $C^1$ loop $\\gamma$ in a compact Riemannian manifold,\nlet\n\\[\n \\mathcal A_g(\\gamma)=\\inf_F\\operatorname{Area}_g(F),\n\\]\nwhere $F\\colon D^2\\to X$ ranges over Lipschitz maps whose boundary agrees\nwith $\\gamma$ up to orientation-preserving reparameterization.  For a\ncontinuous family $\\Gamma\\colon S^2\\to\\Lambda_0X$, put\n\\[\n W_g(\\Gamma)=\\max_{c\\in S^2}\\mathcal A_g(\\Gamma(c)).\n\\]\nIf $\\xi\\in\\pi_3(X)$, let $[\\xi]$ be its $\\pi_1(X)$-orbit.  By\n\\ref{thm:loop-space-pi3-identification}, this orbit corresponds to a free\nhomotopy class of loop families.  Define\n\\[\n W_g(\\xi)=\\inf_{[\\Gamma]=[\\xi]}W_g(\\Gamma),\n\\]\nwhere representatives need not preserve the base point.  Thus $W_g$ is\nconstant on every $\\pi_1(X)$-orbit.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;The Loop-Space Width Interface&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:149,&quot;ref&quot;:&quot;MT:ch18:18.17&quot;},{&quot;id&quot;:&quot;716fb7663e1d&quot;,&quot;label&quot;:&quot;lem:simply-connected-spherical-space-form&quot;,&quot;title&quot;:&quot;A simply connected spherical space form&quot;,&quot;display_title&quot;:&quot;Lemma 6.17: A simply connected spherical space form&quot;,&quot;body&quot;:&quot;If a spherical space form $P$ is simply connected, then $P$ is diffeomorphic\nto $S^3$.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Connected Sums and Fundamental Groups&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:183,&quot;ref&quot;:&quot;Hatcher:ch1:1.39,Hatcher:ch1:1.40&quot;},{&quot;id&quot;:&quot;72a95332c67c&quot;,&quot;label&quot;:&quot;lem:short-reduced-paths-avoid-surgery-caps&quot;,&quot;title&quot;:&quot;Short reduced paths avoid surgery caps&quot;,&quot;display_title&quot;:&quot;Lemma 2.27: Short reduced paths avoid surgery caps&quot;,&quot;body&quot;:&quot;Fix a controlled stage, a terminal point $(x,T)$ with a controlled\nparabolic ball of radius at least $r_{i+1}$, and $L_0&lt;\\infty$.  There is a\npositive surgery-control bound, depending only on the stage data and $L_0$,\nsuch that every backward path from $x$ with\n\\[\n \\mathcal L_+(\\gamma)=\\int\\sqrt\\tau\n   \\bigl(\\max(R,0)+|\\dot\\gamma|^2\\bigr)\\,d\\tau&lt;L_0\n\\]\nmisses a fixed open neighborhood of every surgery cap and every exposed\npoint in $[T_{i-1},T]$.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Compactness and Noncollapsing&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:57,&quot;ref&quot;:&quot;MT:ch16:16.5,MT:ch16:16.8,MT:ch16:16.13,MT:ch16:16.15&quot;},{&quot;id&quot;:&quot;74735bfad981&quot;,&quot;label&quot;:&quot;def:smooth-connected-sum&quot;,&quot;title&quot;:&quot;Smooth connected sum&quot;,&quot;display_title&quot;:&quot;Definition 6.1: Smooth connected sum&quot;,&quot;body&quot;:&quot;Let $M$ and $N$ be connected smooth $3$-manifolds without boundary.  Their\n\\emph{smooth connected sum} $M\\mathbin{\\#}N$ is obtained by deleting the\ninteriors of smoothly embedded closed $3$-balls and identifying the two\nresulting boundary spheres by a diffeomorphism.  In the oriented category the\nidentification is orientation reversing.  Connected sums with more than two\nfactors are associated arbitrarily; the resulting diffeomorphism type is\nindependent of all these choices.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Smooth Connected Sums and Prime Factors&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:167,&quot;ref&quot;:&quot;Hatcher3M:ch1:1.1&quot;},{&quot;id&quot;:&quot;74d4b3842b0c&quot;,&quot;label&quot;:&quot;lem:three-sphere-connected-sum-identity&quot;,&quot;title&quot;:&quot;The three-sphere is the connected-sum identity&quot;,&quot;display_title&quot;:&quot;Lemma 6.18: The three-sphere is the connected-sum identity&quot;,&quot;body&quot;:&quot;For every connected closed smooth $3$-manifold $M$,\n$M\\#S^3\\cong M$.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Connected Sums and Fundamental Groups&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:184,&quot;ref&quot;:&quot;Hatcher3M:ch1:1.1&quot;},{&quot;id&quot;:&quot;7965e450f6fa&quot;,&quot;label&quot;:&quot;lem:reduced-length-support-inequality&quot;,&quot;title&quot;:&quot;Upper support inequality for reduced length&quot;,&quot;display_title&quot;:&quot;Lemma 2.11: Upper support inequality for reduced length&quot;,&quot;body&quot;:&quot;On a smooth bounded-curvature Ricci-flow domain, reduced length is smooth\nbefore the reduced cut locus and satisfies, in dimension three,\n\\[\n \\partial_\\tau l+\\Delta l\\le \\frac{3/2-l}{\\tau}.\n\\]\nAt an arbitrary endpoint of a minimizing $\\mathcal L$-geodesic and for every\n$\\eta&gt;0$, there is a smooth upper support $l_\\eta$ which agrees with $l$ at\nthat endpoint and satisfies\n\\[\n \\partial_\\tau l_\\eta+\\Delta l_\\eta\n \\le \\frac{3/2-l_\\eta}{\\tau}+\\eta.\n\\]&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Reduced Geometry&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:41,&quot;ref&quot;:&quot;MT:ch6:6.4,MT:ch6:6.13,MT:ch6:6.49,MT:ch6:6.51,MT:ch7:7.8&quot;},{&quot;id&quot;:&quot;7a2a8ef45f46&quot;,&quot;label&quot;:&quot;thm:curve-flow-length-total-curvature-bounds&quot;,&quot;title&quot;:&quot;Exponential length and total-curvature bounds&quot;,&quot;display_title&quot;:&quot;Theorem 4.24: Exponential length and total-curvature bounds&quot;,&quot;body&quot;:&quot;For the immersed curve-shrinking flow above and $t_0\\le t\\le t_1$,\n\\[\n L(t)\\le L(t_0)e^{C_2(t-t_0)},\n\\]\nand\n\\[\n \\Theta(t)\\le\\Theta(t)+L(t)\n \\le(\\Theta(t_0)+L(t_0))e^{(C_1+C_2)(t-t_0)}.\n\\]\nThus the total-curvature bound necessarily depends on both initial\ntotal curvature and initial length.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Evolution Identities and Global Bounds&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:118,&quot;ref&quot;:&quot;MT:ch19:19.10&quot;},{&quot;id&quot;:&quot;7a54ac1a4b27&quot;,&quot;label&quot;:&quot;thm:finite-time-extinction&quot;,&quot;title&quot;:&quot;Finite-time extinction&quot;,&quot;display_title&quot;:&quot;Theorem 5.37: Finite-time extinction&quot;,&quot;body&quot;:&quot;Let $(M,g_0)$ be a compact connected normalized Riemannian three-manifold\nwhose fundamental group is a free product of finite groups and infinite\ncyclic groups.  The all-time controlled Ricci flow with surgery starting from\n$(M,g_0)$ has a finite extinction time: there is $T_*&lt;\\infty$ such that\n$M_t=\\varnothing$ for every $t\\ge T_*$.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Finite Extinction&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:166,&quot;ref&quot;:&quot;MT:ch18:18.1&quot;},{&quot;id&quot;:&quot;7e3affaa5dd4&quot;,&quot;label&quot;:&quot;def:kappa-solution&quot;,&quot;title&quot;:&quot;Kappa-solution&quot;,&quot;display_title&quot;:&quot;Definition 3.1: Kappa-solution&quot;,&quot;body&quot;:&quot;For $d\\in\\{2,3\\}$, a $d$-dimensional \\emph{$\\kappa$-solution} is a connected Ricci flow\n$(M,g(t))$, $-\\infty&lt;t\\le0$, such that every time slice is complete and\nnonflat, has bounded nonnegative curvature operator, and is\n$\\kappa$-noncollapsed on every finite scale.  The value of $\\kappa&gt;0$ is\nfixed for the flow.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solutions and Asymptotic Models&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:63,&quot;ref&quot;:&quot;MT:ch9:9.1,MT:ch9:9.2&quot;},{&quot;id&quot;:&quot;7f625d515a74&quot;,&quot;label&quot;:&quot;thm:time-slice-maximum-comparison&quot;,&quot;title&quot;:&quot;Time-slice maximum comparison&quot;,&quot;display_title&quot;:&quot;Theorem 1.4: Time-slice maximum comparison&quot;,&quot;body&quot;:&quot;Let $M$ be a smooth manifold, let $\\chi$ be a smooth vector field, and let\n$\\mathbf t\\colon M\\to[a,b]$ be smooth with $\\chi(\\mathbf t)=1$.  Let\n$F\\colon M\\to\\mathbb R$ be smooth, suppose that $F$ attains a maximum on\nevery level set of $\\mathbf t$, and suppose that the set $\\mathcal Z$ of all\nlevelwise maximizers is compact.  If\n$\\psi\\in C^1([a,b]\\times\\mathbb R)$ and\n\\[\n \\chi(F)(x)\\le\\psi(\\mathbf t(x),F(x))\n \\qquad(x\\in\\mathcal Z),\n\\]\nthen\n\\[\n F_{\\max}(t)=\\max_{\\mathbf t^{-1}(t)}F\n\\]\nis continuous and satisfies\n$D^+F_{\\max}(t)\\le\\psi(t,F_{\\max}(t))$ for $t&lt;b$.  Hence, if\n$G&#x27;=\\psi(t,G)$ and $F_{\\max}(a)\\le G(a)$, then\n$F_{\\max}(t)\\le G(t)$ throughout $[a,b]$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Forward-Difference Comparison&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:3,&quot;ref&quot;:&quot;MT:ch2:2.23&quot;},{&quot;id&quot;:&quot;82648ce2769b&quot;,&quot;label&quot;:&quot;lem:backward-parabolic-neighborhood-dichotomy&quot;,&quot;title&quot;:&quot;Backward parabolic-neighborhood dichotomy&quot;,&quot;display_title&quot;:&quot;Lemma 3.25: Backward parabolic-neighborhood dichotomy&quot;,&quot;body&quot;:&quot;After passing to a subsequence of rescaled first-failure flows, exactly one\nof the following occurs:\n\\begin{enumerate}\n\\item for every $A&lt;\\infty$ there are $D(A),s(A)&gt;0$ such that the compatible\n      parabolic neighborhood\n      $P(x_{a,b},0,A,-s(A))$ exists and has\n      $|\\operatorname{Rm}|\\le D(A)$;\n\\item eventually every basepoint has a strong\n      $(C,\\epsilon)$-canonical neighborhood.\n\\end{enumerate}&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;First-Failure Extension&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:87,&quot;ref&quot;:&quot;MT:ch17:17.10&quot;},{&quot;id&quot;:&quot;82d739ec0ed6&quot;,&quot;label&quot;:&quot;def:maximal-ricci-flow-extension&quot;,&quot;title&quot;:&quot;Maximal extension of a generalized Ricci flow&quot;,&quot;display_title&quot;:&quot;Definition 1.6: Maximal extension of a generalized Ricci flow&quot;,&quot;body&quot;:&quot;Here a \\emph{generalized Ricci flow} consists of a manifold with a time\nfunction $\\mathbf t$, a time vector field $\\chi$ satisfying\n$\\chi(\\mathbf t)=1$, and metrics on $\\ker(d\\mathbf t)$ which evolve by\nthe Ricci-flow equation along $\\chi$.  Let $(\\mathcal M,G)$ be such a\nflow on a terminal interval\n$[T^-,T)$, identify this part of the flow with $M\\times[T^-,T)$, and set\n\\[\n \\Omega=\\{x\\in M:\\liminf_{t\\uparrow T}R(x,t)&lt;\\infty\\}.\n\\]\nSuppose that $\\Omega$ is open and that $g(t)|_\\Omega$ converges smoothly\non compact subsets to a metric $g(T)$.  The \\emph{maximal extension to\n$T$} is\n\\[\n \\widehat{\\mathcal M}\n =\\mathcal M\\cup_{\\Omega\\times[T^-,T)}\n   (\\Omega\\times[T^-,T]).\n\\]\nThe time function, time vector field, and horizontal metrics agree on the\noverlap and hence glue to a generalized Ricci flow\n$(\\widehat{\\mathcal M},\\widehat G)$.  Its terminal time-slice is\n$(\\Omega,g(T))$, which need not be complete.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:5,&quot;ref&quot;:&quot;MT:ch11:11.22&quot;},{&quot;id&quot;:&quot;841228a21206&quot;,&quot;label&quot;:&quot;lem:reduced-density-monotonicity&quot;,&quot;title&quot;:&quot;Reduced-density monotonicity&quot;,&quot;display_title&quot;:&quot;Lemma 2.14: Reduced-density monotonicity&quot;,&quot;body&quot;:&quot;Let $v\\in\\mathcal D_x^\\tau$ and let $J(v,\\tau)$ be the Jacobian of the\nreduced exponential map.  Along the corresponding minimizing\n$\\mathcal L$-geodesic,\n\\[\n \\frac d{d\\tau}\\left((4\\pi\\tau)^{-3/2}e^{-l}J\\right)\\le0.\n\\]\nConsequently the reduced volume is nonincreasing in backward time as long as\nall minimizing curves under consideration remain in one smooth domain.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Reduced Geometry&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:44,&quot;ref&quot;:&quot;MT:ch6:6.50,MT:ch6:6.80,MT:ch6:6.81&quot;},{&quot;id&quot;:&quot;84f30b171db1&quot;,&quot;label&quot;:&quot;lem:graph-flow-drift-derivative-bounds&quot;,&quot;title&quot;:&quot;Derivatives of the graph-flow connection drift&quot;,&quot;display_title&quot;:&quot;Theorem 4.11: Derivatives of the graph-flow connection drift&quot;,&quot;body&quot;:&quot;For sufficiently small $\\delta$ there is an ambient constant $C&#x27;$ such that\n\\[\n |Z(\\psi(Z))|&lt;C&#x27;(1+\\delta|Y|),\n \\qquad\n |Y(\\psi(Z))|&lt;C&#x27;(|Y|+\\delta|\\nabla_ZY|).\n\\]&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Graph-Flow Coordinate Estimates&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:105,&quot;ref&quot;:&quot;MT:ch19:19.66&quot;},{&quot;id&quot;:&quot;86b927517d94&quot;,&quot;label&quot;:&quot;lem:single-surgery-connected-sum-reconstruction&quot;,&quot;title&quot;:&quot;Reconstruction across one surgery time&quot;,&quot;display_title&quot;:&quot;Lemma 6.10: Reconstruction across one surgery time&quot;,&quot;body&quot;:&quot;Assume the local surgery construction supplies the one-surgery topology\ncontract at this time.  Let $t&lt;T$ be regular and sufficiently close to a\nsurgery time $T$.  Every\ncomponent of the time-$t$ slice is a finite connected sum of components of the\ntime-$T$ slice and factors belonging to\n\\[\n \\{S^3/\\Gamma,\\mathbb{RP}^3,E_+,E_-\\}.\n\\]\nHere a disappearing $\\mathbb{RP}^3\\#\\mathbb{RP}^3$ component contributes two\n$\\mathbb{RP}^3$ factors.&quot;,&quot;chapter&quot;:&quot;Topological Endgame&quot;,&quot;section&quot;:&quot;Reversing One Surgery&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:176,&quot;ref&quot;:&quot;MT:ch15:15.3&quot;},{&quot;id&quot;:&quot;88699ab8e34d&quot;,&quot;label&quot;:&quot;thm:loop-space-pi3-identification&quot;,&quot;title&quot;:&quot;Free-loop-space identification of _3&quot;,&quot;display_title&quot;:&quot;Theorem 5.19: Free-loop-space identification of _3&quot;,&quot;body&quot;:&quot;If $X$ is compact, connected, and $\\pi_2(X,x_0)=0$, then adjunction induces\nan isomorphism\n\\[\n \\pi_2(\\Lambda_0X,*)\\cong\\pi_3(X,x_0).\n\\]\nFree homotopy classes of not necessarily based maps\n$S^2\\to\\Lambda_0X$ correspond to the orbit set of $\\pi_3(X,x_0)$ under its\nnatural $\\pi_1(X,x_0)$-action.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;The Loop-Space Width Interface&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:148,&quot;ref&quot;:&quot;MT:ch18:18.16&quot;},{&quot;id&quot;:&quot;895f10b519cc&quot;,&quot;label&quot;:&quot;thm:busemann-function-superharmonicity&quot;,&quot;title&quot;:&quot;Weak superharmonicity of Busemann functions&quot;,&quot;display_title&quot;:&quot;Theorem 2.20: Weak superharmonicity of Busemann functions&quot;,&quot;body&quot;:&quot;Let $(M^n,g)$ be complete with nonnegative Ricci curvature, and let $B$ be\nthe Busemann function of a ray.  Then $\\Delta B\\le0$ weakly: for every\nnonnegative compactly supported smooth function $\\varphi$,\n\\[\n \\int_M B\\,\\Delta\\varphi\\,d\\mu\\le0.\n\\]&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Local Curvature and Neck Estimates&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:50,&quot;ref&quot;:&quot;MT:ch2:2.3&quot;},{&quot;id&quot;:&quot;8b02bd6bd97c&quot;,&quot;label&quot;:&quot;thm:curve-shrinking-derivative-estimates&quot;,&quot;title&quot;:&quot;Derivative estimates for curve shrinking&quot;,&quot;display_title&quot;:&quot;Theorem 4.34: Derivative estimates for curve shrinking&quot;,&quot;body&quot;:&quot;Assume the Altschuler--Grayson higher-order estimates for the gauged curve\nflow under the hypotheses of the curvature barrier, with constants depending\nonly on the displayed initial length and total-curvature bounds.  Under the\nhypotheses of \\ref{thm:short-time-curve-curvature-barrier}, there\nare constants\n$\\widetilde C_i&lt;\\infty$, depending on the ambient Ricci flow and on the\nuniform initial total-curvature and length bounds of the chosen family, such\nthat, for $t&#x27;&lt;t&lt;t&#x27;+\\delta r^2$,\n\\[\n k^2\\le \\widetilde C_0(t-t&#x27;)^{-1},\\qquad\n |\\nabla_SH|^2\\le\\widetilde C_1(t-t&#x27;)^{-2},\n\\]\nand, for every $i\\ge1$,\n\\[\n |\\nabla_S^iH|^2\\le\\widetilde C_i(t-t&#x27;)^{-(i+1)}.\n\\]\nFor a fixed solution, the constants are uniform on the indicated time\ninterval.  Uniformity over compact parameter families or as\n$\\lambda\\downarrow0$ is a separate interface and is not asserted here.&quot;,&quot;chapter&quot;:&quot;Curve-Shrinking Estimates&quot;,&quot;section&quot;:&quot;Short-Time Curvature Barrier&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:128,&quot;ref&quot;:&quot;MT:ch19:19.24&quot;},{&quot;id&quot;:&quot;8b2abffda757&quot;,&quot;label&quot;:&quot;def:reduced-exponential-map&quot;,&quot;title&quot;:&quot;Reduced exponential map and injectivity domain&quot;,&quot;display_title&quot;:&quot;Definition 2.9: Reduced exponential map and injectivity domain&quot;,&quot;body&quot;:&quot;An $\\mathcal L$-geodesic from $(x,T)$ is a critical point of\n$\\mathcal L$.  Its initial vector is\n\\[\n v=\\lim_{\\tau\\downarrow0}\\sqrt\\tau\\,\\dot\\gamma(\\tau)\n \\in T_xM_T.\n\\]\nThe reduced exponential map is\n$\\mathcal L\\exp_x^\\tau(v)=\\gamma_v(\\tau)$ whenever this geodesic exists.\nIts injectivity set $\\mathcal D_x^\\tau$ consists of those $v$ for which\n$\\gamma_v|_{[0,\\tau]}$ is the unique minimizing $\\mathcal L$-geodesic to its\nendpoint and has no nonzero $\\mathcal L$-Jacobi field vanishing at both ends.\nThe image $\\Omega_x^\\tau=\\mathcal L\\exp_x^\\tau(\\mathcal D_x^\\tau)$ is the\nreduced injectivity domain.&quot;,&quot;chapter&quot;:&quot;Analytic Control &amp; Noncollapsing&quot;,&quot;section&quot;:&quot;Reduced Geometry&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:39,&quot;ref&quot;:&quot;MT:ch6:6.17,MT:ch6:6.25,MT:ch6:6.26&quot;},{&quot;id&quot;:&quot;8b5c645f958d&quot;,&quot;label&quot;:&quot;lem:no-infinite-nested-canonical-caps&quot;,&quot;title&quot;:&quot;No infinite nested chain of canonical caps&quot;,&quot;display_title&quot;:&quot;Lemma 1.27: No infinite nested chain of canonical caps&quot;,&quot;body&quot;:&quot;For fixed $C$ and sufficiently small $\\epsilon$, there is no chain of\n$(C,\\epsilon)$-caps\n\\[\n C_0\\subset C_1\\subset\\cdots\n\\]\nsuch that the closure of the core of $C_i$ meets\n$\\operatorname{Fr}_M(C_{i-1})$ for every $i\\ge1$.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Canonical Neck and Cap Topology&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:26,&quot;ref&quot;:&quot;MT:app:A.22&quot;},{&quot;id&quot;:&quot;8dd1bd7dd325&quot;,&quot;label&quot;:&quot;thm:trivial-surgery-component-map&quot;,&quot;title&quot;:&quot;Component map for a trivial surgery&quot;,&quot;display_title&quot;:&quot;Theorem 5.6: Component map for a trivial surgery&quot;,&quot;body&quot;:&quot;Let $T$ be a surgery time, let $X(t)$ be a presurgery component for $t&lt;T$\nclose to $T$, and suppose every cutting sphere in this component is null\nhomotopic.  Assume the connected-sum analysis supplies, for each selected\npostsurgery component $Y$, a pinch map with the stated $\\pi_2$ uniqueness and\nhomotopy-equivalence properties, and a nonzero-degree map on $\\pi_3$ whenever\n$\\pi_3(X(t))\\cong\\mathbb Z$.  Then for every $\\eta&gt;0$ there is, for all\n$t&lt;T$ sufficiently close to $T$,\n\\[\n F_t\\colon X(t)\\longrightarrow Y,\n \\qquad \\operatorname{Lip}(F_t)\\le1+\\eta,\n\\]\nhomotopic to the corresponding connected-sum pinch map.  The component with\nnonzero $\\pi_2$, when it exists, is unique and its pinch map is a homotopy\nequivalence.  If $\\pi_2(X(t))=0$, then $\\pi_2(Y)=0$.  If in addition\n$\\pi_3(X(t))\\cong\\mathbb Z$, then $\\pi_3(Y)\\cong\\mathbb Z$ and $(F_t)_*$ is\nmultiplication by a nonzero integer; in particular it is injective.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Two-Sphere Width Control&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:135,&quot;ref&quot;:&quot;MT:ch18:18.18,MT:ch18:18.22,MT:ch15:15.12&quot;},{&quot;id&quot;:&quot;8ddd9ae35616&quot;,&quot;label&quot;:&quot;lem:local-surgery-standard-cap-convergence&quot;,&quot;title&quot;:&quot;Convergence of the surgery cap to the standard cap&quot;,&quot;display_title&quot;:&quot;Lemma 1.16: Convergence of the surgery cap to the standard cap&quot;,&quot;body&quot;:&quot;For every $\\delta&#x27;&#x27;&gt;0$ there is $\\delta_1&#x27;(\\delta&#x27;&#x27;)&gt;0$ such that, if\n$\\delta\\le\\delta_1&#x27;(\\delta&#x27;&#x27;)$, then $\\widehat g$ on\n$B_{\\widehat g}(p_0,(\\delta&#x27;&#x27;)^{-1})$ is $\\delta&#x27;&#x27;$-close in\n$C^{\\lfloor1/\\delta&#x27;&#x27;\\rfloor}$ to $g_0$ on the corresponding standard\nball.&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;lemma&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:15,&quot;ref&quot;:&quot;MT:ch13:13.2&quot;},{&quot;id&quot;:&quot;8f84b6178565&quot;,&quot;label&quot;:&quot;thm:soul-structure-nonnegative-curvature&quot;,&quot;title&quot;:&quot;Soul structure in nonnegative curvature&quot;,&quot;display_title&quot;:&quot;Theorem 3.8: Soul structure in nonnegative curvature&quot;,&quot;body&quot;:&quot;Every connected complete noncompact manifold of nonnegative sectional\ncurvature contains a compact totally geodesic, totally convex soul and is\ndiffeomorphic to its normal bundle.  If the sectional curvature is positive,\nthe soul is a point.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Kappa-Solution Geometry and Stability&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:70,&quot;ref&quot;:&quot;MT:ch2:2.7&quot;},{&quot;id&quot;:&quot;91c8a69f2407&quot;,&quot;label&quot;:&quot;thm:small-annulus-length-transfer&quot;,&quot;title&quot;:&quot;Small-annulus length transfer&quot;,&quot;display_title&quot;:&quot;Theorem 5.28: Small-annulus length transfer&quot;,&quot;body&quot;:&quot;Assume the local quantitative annular graph estimate for ramps: under the\ncurvature and small-turning hypotheses displayed below, an annulus of area\nless than $\\mu_0$ cannot reduce the boundary length by more than the stated\nfactor, uniformly in $\\lambda$.  There is $\\delta_0&gt;0$ with the following\nproperty.  For every $r&gt;0$ and every\nambient sectional-curvature upper bound $K$, there is $\\mu_0&gt;0$ such that if\ntwo ramps $\\gamma,\\widehat\\gamma$ in $M\\times S^1_\\lambda$ cobound an\nannulus of area below $\\mu_0$, and\n\\[\n L(\\gamma)\\ge r,\n \\qquad\n \\int_I|H_\\gamma|\\,ds&lt;\\delta_0\n\\]\nfor every length-$r$ subarc $I\\subset\\gamma$, then\n\\[\n L(\\widehat\\gamma)\\ge\\frac34L(\\gamma).\n\\]\nThe constants are uniform in $\\lambda$.&quot;,&quot;chapter&quot;:&quot;Extinction &amp; Component Topology&quot;,&quot;section&quot;:&quot;Controlled Loop-Family Deformation&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:157,&quot;ref&quot;:&quot;MT:ch19:19.31,MT:ch19:19.35&quot;},{&quot;id&quot;:&quot;9278327842d4&quot;,&quot;label&quot;:&quot;def:interpolating-surgery-metric&quot;,&quot;title&quot;:&quot;Interpolating surgery metric&quot;,&quot;display_title&quot;:&quot;Definition 1.9: Interpolating surgery metric&quot;,&quot;body&quot;:&quot;Set $A_r=A_0+4-r_0$ and $A&#x27;=A_0+4$.  On $\\mathcal S$, define\n\\[\n\\widehat g=\n\\begin{cases}\n e^{-2f}Q\\rho^*g,&amp;s\\le1,\\\\\n e^{-2f}\\bigl(\\alpha Q\\rho^*g+(1-\\alpha)\\eta g_0\\bigr),\n     &amp;1\\le s\\le2,\\\\\n e^{-2f}\\eta g_0,&amp;2\\le s\\le A_r,\\\\\n \\bigl(\\beta e^{-2f}+(1-\\beta)e^{-2f(A&#x27;)}\\bigr)\\eta g_0,\n     &amp;A_r\\le s\\le A&#x27;.\n\\end{cases}\n\\]\nThe metric at the original scale is\n\\[\n \\widetilde g=Q^{-1}\\widehat g.\n\\]&quot;,&quot;chapter&quot;:&quot;Foundations &amp; Interfaces&quot;,&quot;section&quot;:&quot;Controlled-Surgery Inputs&quot;,&quot;kind&quot;:&quot;definition&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:8,&quot;ref&quot;:&quot;MT:ch13:13.2&quot;},{&quot;id&quot;:&quot;956e98090959&quot;,&quot;label&quot;:&quot;thm:separating-surgery-map&quot;,&quot;title&quot;:&quot;Map across a separating surgery&quot;,&quot;display_title&quot;:&quot;Theorem 3.30: Map across a separating surgery&quot;,&quot;body&quot;:&quot;Let $T$ be a surgery time of a controlled Ricci flow, and assume every\nsurgery sphere involved in a component $X(t)$ is separating.  For $t&lt;T$\nsufficiently close to $T$, let $X(T)$ be the component produced from\n$X(t)$.  The points whose curvature remains bounded form an open set\n$\\Omega_t\\subset X(t)$ on which the time-flow identifications converge to a\nmap onto the persistent open subset of $X(T)$.  For every $\\eta&gt;0$, after\nchoosing $t$ sufficiently close to $T$, the identification satisfies\n\\[\n (1+\\eta)^{-1}d_{g(t)}(p,q)\\le d_{g(T)}(\\Phi_t p,\\Phi_t q)\n \\le(1+\\eta)d_{g(t)}(p,q)\n \\qquad(p,q\\in\\Omega_t).\n\\]\nAssume that the radial maps on the removed sides agree with the persistent\nidentification on a collar and that the resulting collar interpolation is\n$(1+\\eta)$-Lipschitz.\nIt extends continuously to a map\n\\[\n F\\colon X(t)\\longrightarrow X(T)\n\\]\nwith $\\operatorname{Lip}_{g(t),g(T)}(F)\\le1+\\eta$.  On each removed side,\nthe restriction is the standard radial collapse and hence is distance\nnonincreasing there.&quot;,&quot;chapter&quot;:&quot;Kappa-Solutions &amp; Surgery Continuation&quot;,&quot;section&quot;:&quot;Surgery Continuation and Finiteness&quot;,&quot;kind&quot;:&quot;theorem&quot;,&quot;status&quot;:&quot;empty&quot;,&quot;order&quot;:92,&quot;ref&quot;:&quot;MT:ch15:15.12,MT:ch13:13.2&quot;},{&quot;id&quot;:&quot;9929a0922cf6&quot;,&quot;label&quot;:&quot;thm:ramp-preservation&quot;,&quot;title&quot;:&quot;Ramp preservation&quot;
