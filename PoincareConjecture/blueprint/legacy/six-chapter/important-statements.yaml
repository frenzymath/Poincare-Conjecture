# Semantic "important nodes" list for the blueprint map.
#
# The map's "Important nodes" toggle shows only these labels (and the
# dependency edges between them).  Edit this file and rebuild with
#   python3 blueprint/tools/build_blueprint_map.py
# Labels must match blueprint \label{...} / hgraph node labels exactly.
#
# Target balance: about 9–11 milestones per chapter, covering the main
# closed candidate route (including the repaired terminal cone and the
# four classical imported boundaries) rather than every theorem-like
# environment.

version: 1

# Optional per-chapter notes for editors; the map only reads `labels`.
chapters:
  Foundations & Interfaces:
    target: 9
    labels:
      - thm:forward-dini-comparison
      - thm:time-slice-maximum-comparison
      - def:epsilon-neck-and-scale
      - thm:local-neck-surgery
      - def:canonical-cap
      - prop:overlapping-epsilon-necks
      - thm:separating-neck-centers-form-tube
      - thm:cap-and-neck-cover-classification
      - thm:canonical-neck-cap-topology

  Analytic Control & Noncollapsing:
    target: 10
    labels:
      - def:controlled-ricci-flow-with-surgery
      - thm:local-volume-injectivity-radius-control
      - thm:normalized-short-time-ricci-flow
      - thm:local-ricci-flow-derivative-estimates
      - thm:reduced-exponential-regularity
      - thm:generalized-flow-noncollapsing-interface
      - thm:strong-curvature-tensor-maximum-principle
      - thm:hamilton-compactness-generalized-flows
      - thm:conditional-noncollapsing-extension
      - thm:pointed-controlled-flow-compactness

  Kappa-Solutions & Surgery Continuation:
    target: 10
    labels:
      - def:kappa-solution
      - thm:asymptotic-gradient-shrinking-soliton
      - thm:three-dimensional-gradient-shrinker-classification
      - thm:kappa-solution-asymptotic-models
      - thm:kappa-solution-structure-summary
      - thm:kappa-solution-canonical-neighborhoods
      - thm:standard-solution-canonical-neighborhoods
      - thm:strong-canonical-neighborhood-extension
      - thm:finite-interval-surgery-bound
      - thm:all-time-controlled-surgery-flow

  Curve-Shrinking Estimates:
    target: 10
    labels:
      - def:ramp-curve
      - thm:ramp-preservation
      - thm:curve-shrinking-short-time-existence
      - thm:parametric-curve-shrinking-wellposedness
      - thm:uniform-controlled-ramp-approximation
      - thm:curve-flow-length-total-curvature-bounds
      - thm:ramp-curve-shrinking-global-existence
      - thm:short-time-curve-curvature-barrier
      - thm:curve-shrinking-derivative-estimates
      - thm:controlled-curve-shrinking-existence

  Extinction & Component Topology:
    target: 11
    labels:
      - def:two-sphere-width
      - thm:two-sphere-width-realization
      - thm:finite-essential-sphere-surgeries
      - thm:eventual-pi2-vanishing
      - lem:hempel-essential-sphere-input
      - thm:component-fundamental-group-persistence
      - thm:late-component-nontrivial-pi3
      - thm:loop-space-pi3-identification
      - thm:plateau-disk-existence-regularity
      - thm:annular-douglas-minimizer
      - thm:finite-time-extinction

  Topological Endgame:
    target: 11
    labels:
      - thm:positive-ricci-three-manifold-roundness
      - lem:relative-fiber-boundary-pairing
      - lem:maximal-overlap-incidence-no-branching
      - thm:morgan-tian-proposition-15-3
      - lem:single-surgery-connected-sum-reconstruction
      - thm:extinction-connected-sum-classification
      - thm:morgan-tian-corollary-15-4
      - thm:morgan-tian-corollary-15-4-empty
      - thm:free-product-connected-sum-classification
      - thm:connected-sum-fundamental-group
      - thm:poincare-conjecture

