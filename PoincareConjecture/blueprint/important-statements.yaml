# Semantic "important nodes" list for the blueprint map.
#
# The map's "Important nodes" toggle shows only these labels (and the
# dependency edges between them).  Edit this file and rebuild with
#   python3 blueprint/tools/build_blueprint_map.py
# Labels must match blueprint \label{...} / hgraph node labels exactly.
#
# Target balance: about 8–10 milestones per chapter, covering the main
# route rather than every theorem-like environment.

version: 1

chapters:
  Foundations & Interfaces:
    target: 9
    labels:
      - thm:forward-dini-comparison
