# Workspace manifest for the Poincare Conjecture site.
# scripts/build_site.py stages this manifest for hgraph in temporary storage.
# `root:` names both a project's directory and its hash route in the site.
# `category:` groups the cards under a heading, in order of first appearance,
# so the order below is the reading order: the geometry, then what it is all
# for, then the supporting subjects. The card names the *book* (author +
# book_title) because the section already names the subject.
#
# Add a project = add one entry here.
#
# image: is a cover, relative to this file; it is inlined into the page and
# downscaled to card size on the way in. `image_fit: contain` shows the whole
# cover — the card panel is landscape and a cover is portrait, so the default
# `cover` fit would crop it down to a band.
title: Poincaré Conjecture
favicon: site/img/frenzymath.png
subtitle: >
  A proof of the Poincaré conjecture in dimension three, with a blueprint
  drawn from the Lean formalization and its mathematical references.
overview: site/overview.html
stylesheet: site/blueprint-only.css

# Extra landing-page tabs, beside Projects/Overview. Each names a Markdown or
# HTML file (relative to this manifest), rendered as trusted content with math
# typeset in the browser.
tabs:
  - id: proof-map
    label: Proof Map
    content: site/proof-map-tab.html
  - id: people
    label: People
    content: site/people.html

# Extra applications served on the same origin by `hgraph serve`. The Proof
# Map is built separately so its expandable map can keep its own small runtime.
static:
  proof-map: site/proof-map/dist

# Every project below lives in this one repo, so they share it: it is what the
# "send to GitHub" button on a node's review panel files its issue against.
# Without it that panel just says no repository is configured. A project in its
# own repo would override it with a `repo:` on its own entry.
repo: frenzymath/Poincare-Conjecture

# Optional: a line under each category heading. Keyed by the projects'
# `category:` below — drop an entry and that heading simply has no subtitle.
categories:
  The Poincaré Conjecture: >
    The primary Poincare proof library and its blueprint.
  Ricci Flow References: >
    Reference blueprints for Ricci flow, singularity analysis, surgery,
    and geometrization.
  Three-Manifold References: >
    Thurston's geometric view of three-manifolds — hyperbolic structures,
    Kleinian groups, and the geometrization programme behind the conjecture.
  Riemannian Geometry References: >
    The core machinery — metrics, connections, curvature and geodesics, and the
    comparison theorems that turn curvature bounds into topology; with the
    smooth-manifold groundwork it is all stated on.
  Algebraic Topology References: >
    The invariants the conjecture is phrased in: the fundamental group, covering
    spaces, and homology.
  Partial Differential Equations References: >
    The analysis the flow rests on — Sobolev spaces and second-order elliptic
    theory.

projects:
  - name: The Poincaré Conjecture
    root: PoincareConjecture
    category: The Poincaré Conjecture
    author: Frenzymath
    book_title: The Poincaré Conjecture
    image: site/img/frenzymath.svg
    image_alt: Frenzymath logo
    image_fit: contain
    tag: Flagship
    blurb: >
      A proof of the Poincaré conjecture in dimension three.
      A mathematical blueprint drawn from the Lean proof.

  - name: Ricci Flow & the Poincaré Conjecture
    root: references/MorganTian
    category: Ricci Flow References
    author: John Morgan & Gang Tian
    book_title: Ricci Flow and the Poincaré Conjecture
    image: site/img/morgantian.jpg
    image_alt: Cover of Morgan & Tian, Ricci Flow and the Poincaré Conjecture (Clay Mathematics Monographs 3)
    image_fit: contain
    tag: Monograph
    blurb: >
      Ricci flow with surgery, κ-solutions, and canonical neighborhoods — the
      analytic core of Perelman's proof of the Poincaré conjecture.

  - name: Notes on Perelman's Papers
    root: references/KleinerLott
    category: Ricci Flow References
    author: Bruce Kleiner & John Lott
    book_title: Notes on Perelman's Papers
    # Typographic title card, not a book jacket: this is a journal article
    # (Geom. Topol. 12 (2008) 2587–2855, arXiv:math/0605667), so there is no
    # cover art to reproduce. Replace with a publisher image if wanted.
    image: site/img/kleinerlott.svg
    image_alt: Title card for Kleiner & Lott, Notes on Perelman's Papers
    image_fit: contain
    tag: Article
    blurb: >
      A line-by-line reading of Perelman's three preprints: entropy, no local
      collapsing, and the canonical-neighborhood theorem.

  - name: Hamilton–Perelman's Proof
    root: references/CaoZhu
    category: Ricci Flow References
    author: Huai-Dong Cao & Xi-Ping Zhu
    book_title: Hamilton–Perelman's Proof of the Poincaré and Geometrization Conjectures
    # As above: Asian J. Math. 10 (2006) 165–492, revised arXiv version — an
    # article rather than a book, so the card is typographic by design.
    image: site/img/caozhu.svg
    image_alt: Title card for Cao & Zhu, Hamilton–Perelman's Proof of the Poincaré and Geometrization Conjectures
    image_fit: contain
    tag: Article
    blurb: >
      A complete exposition of the Hamilton–Perelman programme for the Poincaré
      and geometrization conjectures.

  - name: "The Ricci Flow: Techniques and Applications"
    root: references/ChowEtAl
    category: Ricci Flow References
    author: Bennett Chow et al.
    book_title: "The Ricci Flow: Techniques and Applications, Parts II–IV"
    image: site/img/chowetal.jpg
    image_alt: "Cover of Chow et al., The Ricci Flow: Techniques and Applications, Part II"
    image_fit: contain
    tag: Monograph
    blurb: >
      Techniques and applications of Ricci flow: analytic and geometric
      estimates, singularity analysis, and long-time behavior.

  - name: "The Ricci Flow: An Introduction"
    root: references/ChowKnopf
    category: Ricci Flow References
    author: Bennett Chow & Dan Knopf
    book_title: "The Ricci Flow: An Introduction"
    image: site/img/chowknopf.jpg
    image_alt: "Cover of Chow and Knopf, The Ricci Flow: An Introduction"
    image_fit: contain
    tag: Textbook
    blurb: >
      An introduction to Ricci flow: special solutions, short-time existence,
      maximum principles, derivative estimates, and singularity models.

  - name: Lectures on the Ricci Flow
    root: references/Topping
    category: Ricci Flow References
    author: Peter Topping
    book_title: Lectures on the Ricci Flow
    image: site/img/topping.jpg
    image_alt: Cover of Topping, Lectures on the Ricci Flow
    image_fit: contain
    tag: Lecture notes
    blurb: >
      Foundations of Ricci flow: parabolic estimates, compactness, Perelman's
      entropy, and curvature pinching in three dimensions.

  # GTM 218 is not Riemannian geometry proper — it is the prerequisite volume the
  # rest is stated on. It sits in this section rather than its own because the
  # shelf reads as one geometry stack; the heading says so.
  - name: Smooth Manifolds
    root: references/LeeSmooth
    category: Riemannian Geometry References
    author: John M. Lee
    book_title: Introduction to Smooth Manifolds
    image: site/img/leesmooth.jpg
    image_alt: Cover of Lee, Introduction to Smooth Manifolds (Springer GTM 218, 2nd ed.)
    image_fit: contain
    tag: Textbook
    blurb: >
      Smooth-manifold foundations: charts and atlases, tangent and vector
      bundles, and vector fields.

  - name: Riemannian Geometry
    root: references/LeeRiemannian
    category: Riemannian Geometry References
    author: John M. Lee
    book_title: Introduction to Riemannian Manifolds
    image: site/img/leeriemannian.jpg
    image_alt: Cover of Lee, Introduction to Riemannian Manifolds (Springer GTM 176, 2nd ed.)
    image_fit: contain
    tag: Textbook
    blurb: >
      Riemannian metrics, connections and geodesics, curvature, and the
      comparison theorems of Riemannian geometry.

  - name: Riemannian Geometry
    root: references/DoCarmo
    category: Riemannian Geometry References
    author: Manfredo P. do Carmo
    book_title: Riemannian Geometry
    image: site/img/docarmo.jpg
    image_alt: Cover of do Carmo, Riemannian Geometry (Birkhäuser)
    image_fit: contain
    tag: Textbook
    blurb: >
      Metrics, connections, curvature, geodesics, and the comparison theorems
      up to the Sphere Theorem.

  - name: Riemannian Geometry
    root: references/Petersen
    category: Riemannian Geometry References
    author: Peter Petersen
    book_title: Riemannian Geometry
    image: site/img/petersen.jpg
    image_alt: Cover of Petersen, Riemannian Geometry (Springer GTM 171, 3rd ed.)
    image_fit: contain
    tag: Textbook
    blurb: >
      Curvature and examples, geodesics and distance, Killing fields, and the
      convergence and finiteness theorems.


  - name: Finite Propagation Speed and Kernel Estimates
    root: references/CheegerGromovTaylor
    category: Riemannian Geometry References
    author: Jeff Cheeger, Mikhail Gromov & Michael Taylor
    book_title: >-
      Finite Propagation Speed, Kernel Estimates for Functions of the Laplace
      Operator, and the Geometry of Complete Riemannian Manifolds
    image: site/img/cheeger-gromov-taylor.jpg
    image_alt: Title page of the Cheeger–Gromov–Taylor article on kernel estimates
    image_fit: contain
    tag: Article
    blurb: >
      Finite propagation speed and Laplace-operator kernel estimates on complete
      Riemannian manifolds under curvature, volume, and injectivity bounds.

  - name: Algebraic Topology
    root: references/Hatcher
    category: Algebraic Topology References
    author: Allen Hatcher
    book_title: Algebraic Topology
    image: site/img/hatcher.jpg
    image_alt: Cover of Hatcher, Algebraic Topology (Cambridge University Press)
    image_fit: contain
    tag: Textbook
    blurb: >
      The fundamental group, covering spaces, and singular homology and
      cohomology.

  - name: The Geometry and Topology of Three-Manifolds
    root: references/Thurston
    category: Three-Manifold References
    author: William P. Thurston
    book_title: The Geometry and Topology of Three-Manifolds
    image: site/img/thurston.svg
    image_alt: Title card for Thurston, The Geometry and Topology of Three-Manifolds
    image_fit: contain
    tag: Lecture notes
    blurb: >
      Three-manifold topology, hyperbolic geometry, geometric structures,
      Dehn surgery, Kleinian groups, convergence, and orbifolds.

  - name: Partial Differential Equations
    root: references/Evans
    category: Partial Differential Equations References
    author: Lawrence C. Evans
    book_title: Partial Differential Equations
    image: site/img/evans.jpg
    image_alt: Cover of Evans, Partial Differential Equations (AMS GSM 19)
    image_fit: contain
    tag: Textbook
    blurb: >
      Sobolev spaces and the theory of second-order elliptic, parabolic, and
      hyperbolic partial differential equations.

  - name: Elliptic Partial Differential Equations of Second Order
    root: references/GilbargTrudinger
    category: Partial Differential Equations References
    author: David Gilbarg & Neil S. Trudinger
    book_title: Elliptic Partial Differential Equations of Second Order
    image: site/img/gilbarg-trudinger.jpg
    image_alt: Cover of Gilbarg and Trudinger, Elliptic Partial Differential Equations of Second Order
    image_fit: contain
    tag: Monograph
    blurb: >
      Linear and quasilinear second-order elliptic equations: maximum
      principles, Schauder theory, generalized solutions, and nonlinear
      estimates.

  - name: Lecture Notes on Elliptic Differential Equations
    root: references/HanLinLectureNotes
    category: Partial Differential Equations References
    author: Qing Han & Fang-Hua Lin
    book_title: Lecture Notes on Elliptic Differential Equations
    image: site/img/han-lin.jpg
    image_alt: Title page of Han and Lin, Lecture Notes on Elliptic Differential Equations
    image_fit: contain
    tag: Lecture notes
    blurb: >
      Harmonic functions, maximum principles, weak solutions, elliptic
      regularity, and viscosity solutions.
