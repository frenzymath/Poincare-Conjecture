name: Source checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Lean source statistics and admissions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-site.txt
      - name: Test source and site tooling
        run: python -m unittest discover -s scripts/tests
      - name: Scan primary formalization
        run: >-
          python scripts/lean_stats.py PoincareConjecture
          --exclude Comparator/Challenge.lean
          --output "$RUNNER_TEMP/lean-statistics" --check
      - name: Publish statistics table
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/lean-statistics/summary.md" ]; then
            cat "$RUNNER_TEMP/lean-statistics/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-source-statistics
          path: ${{ runner.temp }}/lean-statistics
          retention-days: 7
          if-no-files-found: error
