name: Manual Lean build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Lake build (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PoincareConjecture
            path: PoincareConjecture

    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Print Lean version
        working-directory: ${{ matrix.path }}
        run: lean --version

      - name: Fetch Mathlib cache
        working-directory: ${{ matrix.path }}
        run: lake exe cache get

      - name: Lake build
        working-directory: ${{ matrix.path }}
        run: lake build
